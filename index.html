shang kāihuì qián gěi nín.",null,"BODY1184"],["GV: 那总部的数据呢？ (Còn số liệu tổng bộ?)",null,null,"Nà zǒngbù de shùjù ne?",null,"BODY1185"],["HS: 总部的数据我可以先问问能不能明天中午交。如果不行，能不能请小林帮我整理一部分？ (Số liệu tổng bộ em hỏi xem trưa mai nộp được không. Không được thì nhờ Tiểu Lâm tổng hợp giúp một phần được không ạ?)",null,null,"Zǒngbù de shùjù wǒ kěyǐ xiān wènwen néng bùnéng míngtiān zhōngwǔ jiāo. Rúguǒ bùxíng, néng bùnéng qǐng Xiǎo Lín bāng wǒ zhěnglǐ yībùfen?",null,"BODY1186"],["GV (biến cố): 小林今天请假了。 (Tiểu Lâm hôm nay nghỉ phép.)",null,null,"Xiǎo Lín jīntiān qǐngjià le.",null,"BODY1187"],["HS: 那我先做报价和总部的数据，会议资料我只做重点部分，详细的明天会后再补充，您看可以吗？ (Vậy em làm báo giá và số liệu tổng bộ trước, tài liệu họp chỉ làm phần trọng điểm, chi tiết họp xong mai bổ sung, anh thấy được không ạ?)",null,null,"Nà wǒ xiān zuò bàojià hé zǒngbù de shùjù, huìyì zīliào wǒ zhǐ zuò zhòngdiǎn bùfen, xiángxì de míngtiān huìhòu zài bǔchōng, nín kàn kěyǐ ma?",null,"BODY1188"],["GV: 可以，就这么办。 (Được, cứ thế mà làm.)",null,null,"Kěyǐ, jiù zhème bàn.",null,"BODY1189"],["HS: 好的，我五点之前把报价发出去，七点之前把数据发给总部，做完马上跟您汇报。 (Vâng, trước 5h em gửi báo giá, trước 7h gửi số liệu cho tổng bộ, xong báo cáo anh ngay.)",null,null,"Hǎo de, wǒ wǔdiǎn zhīqián bǎ bàojià fāchū qù, qīdiǎn zhīqián bǎ shùjù fāgěi zǒngbù, zuò wán mǎshàng gēn nín huìbào.",null,"BODY1190"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY1191-C"],["✗ 我会完成在周五。 → ✓ 我周五之前会完成。/ 我会在周五之前完成。",null,null,"Wǒhuì wánchéng zài zhōuwǔ. | Wǒ zhōuwǔ zhīqián huì wánchéng. / | Wǒhuì zài zhōuwǔ zhīqián wánchéng.",null,"BODY1192"],["✗ 进度是很慢。 → ✓ 进度很慢 / 进度落后了。",null,null,"Jìndù shì hěn màn. | Jìndù hěn màn | Jìndù luòhòu le.",null,"BODY1193"],["✗ 我已经确认了跟客户。 → ✓ 我已经跟客户确认过了。",null,null,"Wǒ yǐjīng quèrèn le gēn kèhù. | Wǒ yǐjīng gēn kèhù quèrèn guò le.",null,"BODY1194"],["✗ 这个工作很急，你快快做。 (cộc, ra lệnh) → ✓ 这件事比较急，麻烦你抓紧处理一下。",null,null,"Zhège gōngzuò hěn jí, nǐ kuàikuài zuò. | Zhèjiàn shì bǐjiào jí, máfan nǐ zhuājǐn chǔlǐ yīxià.",null,"BODY1195"],["✗ 我做不完了。 (bỏ cuộc) → ✓ 按现在的进度，恐怕来不及，我需要……的帮助。",null,null,"Wǒ zuò bù wán le. | Àn xiànzài de jìndù, kǒngpà láibùjí, wǒ xūyào…… de bāngzhù.",null,"BODY1196"],["✗ 他耽误我。 → ✓ 他耽误了我的时间 / 他的延误影响了我的进度。",null,null,"Tā dānwù wǒ. | Tā dānwù le wǒ de shíjiān | Tā de yánwù yǐngxiǎng le wǒ de jìndù.",null,"BODY1197"],["Nâng cấp HSK5: 我做完了 → 这项工作已经按时完成，结果已经同步给相关部门。",null,null,"Wǒ zuò wán le | Zhèxiàng gōngzuò yǐjīng ànshí wánchéng, jiéguǒ yǐjīng tóngbù gěi xiāngguān bùmén.",null,"BODY1198"],["Phát âm: 截止 jiézhǐ; 进度 jìndù; 耽误 dānwu; 优先 yōuxiān.",null,null,"Jiézhǐ | Jìndù | Dānwù | Yōuxiān",null,"BODY1199"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY1200-C"],["Ghi âm báo cáo tiến độ 2–3 phút về một việc thật đang làm: tiến độ hiện tại → rủi ro → phương án → thời gian dự kiến.",null,null,null,null,"BODY1201"],["HSK5: thêm phần đề xuất phân chia người khi có 2 việc trùng hạn.",null,null,null,null,"BODY1202"],["Luyện cặp: đóng lại Hội thoại 3 và 4, sau đó đổi vai.",null,null,null,null,"BODY1203"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY1204"],["Buổi 07 — 购物与消费 Mua sắm và tiêu dùng",null,null,"Gòuwù yǔ xiāofèi",null,"BODY1205-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY1206-C"],["HSK4: Hỏi giá, mặc cả, đổi trả sản phẩm, yêu cầu bảo hành. HSK5: Đàm phán mua số lượng lớn, phân tích thói quen tiêu dùng.",null,null,null,null,"BODY1207"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY1209-C"],["1. Hỏi: 你最近买的一样东西是什么？在哪儿买的？ (Món đồ gần đây nhất bạn mua là gì? Mua ở đâu?)",null,null,"Nǐ zuìjìn mǎi de yīyàng dōngxi shì shénme? Zài nǎr mǎi de?",null,"BODY1210"],["Đáp: 我最近买了一个新的电饭锅，在Shopee上买的，比商场便宜三十万盾。 (Tôi vừa mua nồi cơm điện mới trên Shopee, rẻ hơn trung tâm thương mại 300 nghìn.)",null,null,"Wǒ zuìjìn mǎi le yīgè xīn de diànfànguō, zài S | Shàng mǎi de, bǐ shāngchǎng piányi sānshíwàn dùn.",null,"BODY1211"],["2. Hỏi: 你喜欢网上购物还是去商店买？为什么？ (Thích mua online hay đến cửa hàng? Vì sao?)",null,null,"Nǐ xǐhuan wǎngshàng gòuwù háishì qù shāngdiàn mǎi? Wèishénme?",null,"BODY1212"],["Đáp: 日用品我喜欢网上买，方便又便宜；衣服和鞋我一定要去店里试一下。 (Đồ dùng hằng ngày thích mua online, tiện lại rẻ; quần áo giày dép phải ra cửa hàng thử.)",null,null,"Rìyòngpǐn wǒ xǐhuan wǎngshàng mǎi, fāngbiàn yòu piányi; yīfu hé xié wǒ yīdìng yào qù diànlǐ shìyīxià.",null,"BODY1213"],["3. Hỏi: 你买东西会讲价吗？ (Bạn mua đồ có mặc cả không?)",null,null,"Nǐ mǎi dōngxi huì jiǎngjià ma?",null,"BODY1214"],["Đáp: 在市场买东西一定会讲价，在超市和商场就不讲了，因为都是标价。 (Ở chợ thì nhất định mặc cả, siêu thị và trung tâm thương mại thì không vì đều có giá niêm yết.)",null,null,"Zài shìchǎng mǎi dōngxi yīdìng huì jiǎngjià, zài chāoshì hé shāngchǎng jiù bù jiǎng le, yīnwèi dōu shì biāojià.",null,"BODY1215"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY1216-C"],["1. 划算 (hời, đáng tiền): 买一送一，太划算了！ (Mua 1 tặng 1, hời quá!)",null,null,"Huásuàn | Mǎiyīsòngyī, tài huásuàn le!",null,"BODY1217"],["2. 性价比 (tỷ lệ giá/chất lượng): 这款手机性价比很高，功能多，价格又不贵。 (Điện thoại này đáng tiền, nhiều chức năng mà giá không đắt.)",null,null,"Xìngjiàbǐ | Zhè kuǎn shǒujī xìngjiàbǐ hěn gāo, gōngnéng duō, jiàgé yòu bù guì.",null,"BODY1218"],["3. 打折 (giảm giá): 这件衣服打八折，原价一百万，现在八十万。 (Áo này giảm 20%, giá gốc 1 triệu, giờ 800 nghìn.)",null,null,"Dǎzhé | Zhèjiàn yīfu dǎ bāzhé, yuánjià yībǎiwàn, xiànzài bāshíwàn.",null,"BODY1219"],["4. 退货 (trả hàng): 买了不合适，七天之内可以退货。 (Mua không vừa, trong 7 ngày có thể trả hàng.)",null,null,"Tuìhuò | Mǎi le bù héshì, qītiān zhīnèi kěyǐ tuìhuò.",null,"BODY1220"],["5. 换货 (đổi hàng): 鞋子小了一号，我想换大一号的。 (Giày nhỏ một số, tôi muốn đổi lớn hơn một số.)",null,null,"Huànhuò | Xiézi xiǎo le yīhào, wǒ xiǎng huàn dà yīhào de.",null,"BODY1221"],["6. 保修 (bảo hành): 这台电脑保修两年，人为损坏不保修。 (Máy tính bảo hành 2 năm, hư hỏng do người dùng không bảo hành.)",null,null,"Bǎoxiū | Zhè tái diànnǎo bǎoxiū liǎngnián, rénwéi sǔnhuài bù bǎoxiū.",null,"BODY1222"],["7. 讲价 / 便宜点儿 (mặc cả / rẻ chút): 老板，能不能便宜点儿？ (Ông chủ, rẻ chút được không?)",null,null,"Jiǎngjià | Piányi diǎnr | Lǎobǎn, néng bùnéng piányi diǎnr?",null,"BODY1223"],["8. 质量 (chất lượng): 这个牌子质量很好，用了五年都没坏。 (Hãng này chất lượng tốt, dùng 5 năm chưa hỏng.)",null,null,"Zhìliàng | Zhège páizi zhìliàng hěn hǎo, yòng le wǔnián dōu méi huài.",null,"BODY1224"],["9. 发票 / 收据 (hóa đơn / biên lai): 请给我开一张发票，公司要报销。 (Xuất cho tôi hóa đơn, công ty cần thanh toán.)",null,null,"Fāpiào | Shōujù | Qǐng gěi wǒ kāi yīzhāng fāpiào, gōngsī yào bàoxiāo.",null,"BODY1225"],["10. 包邮 (miễn phí vận chuyển): 满五十万盾包邮。 (Đơn từ 500 nghìn miễn phí ship.)",null,null,"Bāo yóu | Mǎn wǔshíwàn dùn bāo yóu.",null,"BODY1226"],["11. 冲动消费 (mua sắm bốc đồng): 打折的时候最容易冲动消费。 (Lúc giảm giá dễ mua sắm bốc đồng nhất.)",null,null,"Chōngdòng xiāofèi | Dǎzhé de shíhou zuì róngyì chōngdòng xiāofèi.",null,"BODY1227"],["12. 批发价 / 零售价 (giá sỉ / giá lẻ): 买一百件以上可以按批发价算。 (Mua từ 100 cái trở lên tính giá sỉ.)",null,null,"Pīfājià | Língshòujià | Mǎi yībǎijiàn yǐshàng kěyǐ àn pīfājià suàn.",null,"BODY1228"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY1229-C"],["1. 这款有优惠吗？ (Mẫu này có ưu đãi không?)",null,null,"Zhè kuǎn yǒu yōuhuì ma?",null,"BODY1230"],["Ví dụ: 这款空调现在有优惠吗？我看网上比店里便宜。 (Điều hòa này giờ có ưu đãi không? Tôi thấy trên mạng rẻ hơn ở cửa hàng.)",null,null,"Zhè kuǎn kōngtiáo xiànzài yǒu yōuhuì ma? Wǒ kàn wǎngshàng bǐ diànlǐ piányi.",null,"BODY1231"],["Ví dụ: 这款有会员优惠吗？我是你们的老顾客了。 (Mẫu này có ưu đãi thành viên không? Tôi là khách quen rồi.)",null,null,"Zhè kuǎn yǒu huìyuán yōuhuì ma? Wǒ shì nǐmen de lǎo gùkè le.",null,"BODY1232"],["2. 能不能便宜一点？……的话，我就买了 (Rẻ chút được không? Nếu … thì tôi mua luôn)",null,null,"Néng bùnéng piányi yīdiǎn?…… Dehuà, wǒ jiù mǎi le",null,"BODY1233"],["Ví dụ: 能不能便宜一点？八十万的话，我就买了。 (Rẻ chút được không? 800 nghìn thì tôi lấy luôn.)",null,null,"Néng bùnéng piányi yīdiǎn? Bāshíwàn dehuà, wǒ jiù mǎi le.",null,"BODY1234"],["Ví dụ: 我买两件，能不能便宜一点？送个袋子的话，我就买了。 (Tôi mua 2 cái, bớt chút được không? Tặng thêm túi thì tôi mua luôn.)",null,null,"Wǒ mǎi liǎngjiàn, néng bùnéng piányi yīdiǎn? Sòng gè dàizi dehuà, wǒ jiù mǎi le.",null,"BODY1235"],["3. 与其……，不如…… (Thay vì …, chi bằng …)",null,null,"Yǔqí……, bùrú……",null,"BODY1236"],["Ví dụ: 与其买便宜的用一年就坏，不如多花点钱买个好的。 (Thay vì mua đồ rẻ dùng một năm đã hỏng, chi bằng bỏ thêm tiền mua đồ tốt.)",null,null,"Yǔqí mǎi piányi de yòng yīnián jiù huài, bùrú duō huā diǎn qián mǎi gè hǎo de.",null,"BODY1237"],["Ví dụ: 与其在商场排队，不如在网上买，还包邮。 (Thay vì xếp hàng ở trung tâm thương mại, chi bằng mua online, lại miễn phí ship.)",null,null,"Yǔqí zài shāngchǎng páiduì, bùrú zài wǎngshàng mǎi, hái bāo yóu.",null,"BODY1238"],["4. ……跟……比，哪个更…… (… so với …, cái nào … hơn)",null,null,"…… Gēn…… bǐ, nǎge gèng……",null,"BODY1239"],["Ví dụ: 这款跟那款比，哪个更省电？ (Mẫu này so với mẫu kia, cái nào tiết kiệm điện hơn?)",null,null,"Zhè kuǎn gēn nàkuǎn bǐ, nǎge gèng shěng diàn?",null,"BODY1240"],["Ví dụ: 小米跟三星比，哪个性价比更高？ (Xiaomi so với Samsung, hãng nào đáng tiền hơn?)",null,null,"Xiǎomǐ gēn Sānxīng bǐ, nǎge xìngjiàbǐ gèng gāo?",null,"BODY1241"],["5. 我买的……有问题，可以……吗？ (… tôi mua có vấn đề, có thể … không?)",null,null,"Wǒ mǎi de…… yǒu wèntí, kěyǐ…… ma?",null,"BODY1242"],["Ví dụ: 我昨天买的耳机有问题，左边没有声音，可以换一个吗？ (Tai nghe hôm qua tôi mua có vấn đề, bên trái không có tiếng, đổi cái khác được không?)",null,null,"Wǒ zuótiān mǎi de ěrjī yǒu wèntí, zuǒbiān méiyǒu shēngyīn, kěyǐ huàn yīgè ma?",null,"BODY1243"],["Ví dụ: 我买的裙子有个洞，可以退货吗？ (Váy tôi mua có lỗ thủng, trả hàng được không?)",null,null,"Wǒ mǎi de qúnzi yǒu gè dòng, kěyǐ tuìhuò ma?",null,"BODY1244"],["6. 按照规定，…… (Theo quy định, …)",null,null,"Ànzhào guīdìng,……",null,"BODY1245"],["Ví dụ: 按照规定，七天之内无理由退货。 (Theo quy định, trong 7 ngày được trả hàng không cần lý do.)",null,null,"Ànzhào guīdìng, qītiān zhīnèi wú lǐyóu tuìhuò.",null,"BODY1246"],["Ví dụ: 按照规定，质量问题一个月内可以换新。 (Theo quy định, lỗi chất lượng trong 1 tháng được đổi mới.)",null,null,"Ànzhào guīdìng, zhìliàng wèntí yīgèyuè nèi kěyǐ huàn xīn.",null,"BODY1247"],["7. 不是……的问题，是…… (Không phải vấn đề …, mà là …)",null,null,"Bùshì…… de wèntí, shì……",null,"BODY1248"],["Ví dụ: 不是我用错了，是机器本身的质量问题。 (Không phải tôi dùng sai, mà là lỗi chất lượng của máy.)",null,null,"Bùshì wǒ yòng cuò le, shì jīqì běnshēn de zhìliàng wèntí.",null,"BODY1249"],["Ví dụ: 不是价格的问题，是你们的服务态度有问题。 (Không phải vấn đề giá, mà là thái độ phục vụ có vấn đề.)",null,null,"Bùshì jiàgé de wèntí, shì nǐmen de fúwùtàidù yǒu wèntí.",null,"BODY1250"],["8. 万一……，能…… (Lỡ …, có thể … không)",null,null,"Wànyī……, néng……",null,"BODY1251"],["Ví dụ: 万一穿着不合适，能换吗？ (Lỡ mặc không vừa, đổi được không?)",null,null,"Wànyī chuānzhe bù héshì, néng huàn ma?",null,"BODY1252"],["Ví dụ: 万一过了保修期坏了，能修吗？要多少钱？ (Lỡ hết bảo hành mà hỏng, sửa được không? Bao nhiêu tiền?)",null,null,"Wànyī guò le bǎoxiūqī huài le, néng xiū ma? Yào duōshǎo qián?",null,"BODY1253"],["9. (HSK5) 如果我们一次订……，单价能不能…… (Nếu chúng tôi đặt một lần …, đơn giá có thể … không)",null,null,"Rúguǒ wǒmen yīcì dìng……, dānjià néng bùnéng……",null,"BODY1254"],["Ví dụ: 如果我们一次订五百台，单价能不能降到八百万？ (Nếu đặt một lần 500 chiếc, đơn giá giảm xuống 8 triệu được không?)",null,null,"Rúguǒ wǒmen yīcì dìng wǔbǎi tái, dānjià néng bùnéng jiàngdào bābǎiwàn?",null,"BODY1255"],["Ví dụ: 如果我们签一年的合同，价格能不能再优惠百分之五？ (Nếu ký hợp đồng 1 năm, giá ưu đãi thêm 5% được không?)",null,null,"Rúguǒ wǒmen qiān yīnián de hétong, jiàgé néng bùnéng zài yōuhuì bǎifēnzhīwǔ?",null,"BODY1256"],["10. (HSK5) 从……的角度来看，…… (Xét từ góc độ …, …)",null,null,"Cóng…… de jiǎodù láikàn,……",null,"BODY1257"],["Ví dụ: 从长期使用的角度来看，贵一点的反而更划算。 (Xét về sử dụng lâu dài, đồ đắt hơn lại hời hơn.)",null,null,"Cóng chángqī shǐyòng de jiǎodù láikàn, guì yīdiǎn de fǎn'ér gèng huásuàn.",null,"BODY1258"],["Ví dụ: 从环保的角度来看，我们应该少买一次性的东西。 (Xét từ góc độ môi trường, nên mua ít đồ dùng một lần.)",null,null,"Cóng huánbǎo de jiǎodù láikàn, wǒmen yīnggāi shǎo mǎi yīcìxìng de dōngxi.",null,"BODY1259"],["情景对话 1 — Mua quần áo ở trung tâm thương mại (hỏi size, thử đồ, giảm giá)",null,null,"Qíngjǐng duìhuà",null,"BODY1260-C"],["店员: 欢迎光临！随便看看，有喜欢的可以试一下。 (Kính chào quý khách! Cứ xem tự nhiên, thích cái nào có thể thử.)",null,null,"Diànyuán: huānyíngguānglín! Suíbiàn kànkan, yǒu xǐhuan de kěyǐ shìyīxià.",null,"BODY1261"],["顾客: 你好，这件衬衫有没有白色的？ (Chào bạn, áo sơ mi này có màu trắng không?)",null,null,"Gùkè: nǐhǎo, zhèjiàn chènshān yǒuméiyǒu báisè de?",null,"BODY1262"],["店员: 有的，您穿多大号的？ (Có ạ, anh/chị mặc size nào?)",null,null,"Diànyuán: yǒu de, nín chuān duō dà hào de?",null,"BODY1263"],["顾客: 我一般穿M号，但是不同牌子不太一样。 (Tôi thường mặc size M, nhưng mỗi hãng mỗi khác.)",null,null,"Gùkè: wǒ yībān chuān M hào, dànshì bùtóng páizi bù tài yīyàng.",null,"BODY1264"],["店员: 我们家的偏小一点，建议您试一下L号。试衣间在那边。 (Hàng bên em hơi nhỏ, anh/chị nên thử size L. Phòng thử ở đằng kia.)",null,null,"Diànyuán: wǒmen jiā de piān xiǎo yīdiǎn, jiànyìnín shìyīxià L hào. Shìyījiān zài nàbiān.",null,"BODY1265"],["顾客: (thử xong) L号正好。这件多少钱？ (Size L vừa. Áo này bao nhiêu tiền?)",null,null,"Gùkè: L hào zhènghǎo. Zhèjiàn duōshǎo qián?",null,"BODY1266"],["店员: 原价九十万盾，现在打八折，七十二万。 (Giá gốc 900 nghìn, đang giảm 20%, còn 720 nghìn.)",null,null,"Diànyuán: yuánjià jiǔshíwàn dùn, xiànzài dǎ bāzhé, qīshí'èrwàn.",null,"BODY1267"],["顾客: 有点贵。还有其他优惠吗？ (Hơi đắt. Còn ưu đãi nào khác không?)",null,null,"Gùkè: yǒudiǎn guì. Háiyǒu qítā yōuhuì ma?",null,"BODY1268"],["店员: 买两件的话，第二件半价。 (Mua 2 cái thì cái thứ hai nửa giá.)",null,null,"Diànyuán: mǎi liǎngjiàn dehuà, dì'èrjiàn bànjià.",null,"BODY1269"],["顾客: 那我再看看裤子。这条黑色的裤子跟那条灰色的比，哪个更好搭配？ (Vậy tôi xem thêm quần. Quần đen này so với quần xám kia, cái nào dễ phối hơn?)",null,null,"Gùkè: nà wǒ zài kànkan kùzi. Zhè tiáo hēisè de kùzi gēn nàtiáo huīsè de bǐ, nǎge gènghǎo dāpèi?",null,"BODY1270"],["店员: 黑色的更百搭，上班和平时都可以穿。 (Màu đen dễ phối hơn, đi làm hay đi chơi đều mặc được.)",null,null,"Diànyuán: hēisè de gèng bǎi dā, shàngbān hé píngshí dōu kěyǐ chuān.",null,"BODY1271"],["顾客: 好，那我要这件衬衫和这条黑裤子。万一回家洗了缩水，能换吗？ (Được, tôi lấy áo này và quần đen. Lỡ về giặt bị co, đổi được không?)",null,null,"Gùkè: hǎo, nà wǒ yào zhèjiàn chènshān hé zhè tiáo hēi kùzi. Wànyī huíjiā xǐ le suōshuǐ, néng huàn ma?",null,"BODY1272"],["店员: 七天之内没洗过、吊牌还在的话，可以换。洗过的就不能换了。 (Trong 7 ngày chưa giặt, còn mác thì đổi được. Đã giặt thì không đổi được.)",null,null,"Diànyuán: qītiān zhīnèi méixǐ guò, diàopái hái zài dehuà, kěyǐ huàn. Xǐ guò de jiù bùnéng huàn le.",null,"BODY1273"],["顾客: 明白了。一共多少钱？ (Hiểu rồi. Tổng bao nhiêu tiền?)",null,null,"Gùkè: míngbai le. Yīgòng duōshǎo qián?",null,"BODY1274"],["店员: 衬衫七十二万，裤子第二件半价，五十万，一共一百二十二万。 (Áo 720 nghìn, quần cái thứ hai nửa giá 500 nghìn, tổng 1 triệu 220.)",null,null,"Diànyuán: chènshān qīshí'èrwàn, kùzi dì'èrjiàn bànjià, wǔshíwàn, yīgòng yībǎi èrshí'èrwàn.",null,"BODY1275"],["顾客: 可以刷卡吗？ (Quẹt thẻ được không?)",null,null,"Gùkè: kěyǐ shuākǎ ma?",null,"BODY1276"],["店员: 可以。您有我们的会员卡吗？没有的话可以免费办一张，下次购物可以积分。 (Được. Anh/chị có thẻ thành viên không? Chưa có thì làm miễn phí, lần sau mua được tích điểm.)",null,null,"Diànyuán: kěyǐ. Nín yǒu wǒmen de huìyuánkǎ ma? Méiyǒu dehuà kěyǐ miǎnfèi bàn yīzhāng, xiàcì gòuwù kěyǐ jīfēn.",null,"BODY1277"],["顾客: 好，办一张吧。 (Được, làm một thẻ đi.)",null,null,"Gùkè: hǎo, bàn yīzhāng ba.",null,"BODY1278"],["情景对话 2 — Mặc cả ở chợ (chợ Đồng Xuân / Bến Thành)",null,null,"Qíngjǐng duìhuà",null,"BODY1279-C"],["顾客: 老板，这个包多少钱？ (Chủ quán, cái túi này bao nhiêu?)",null,null,"Gùkè: lǎobǎn, zhège bāo duōshǎo qián?",null,"BODY1280"],["老板: 这个是真皮的，五十万盾。 (Cái này da thật, 500 nghìn.)",null,null,"Lǎobǎn: zhège shì zhēnpí de, wǔshíwàn dùn.",null,"BODY1281"],["顾客: 五十万？太贵了吧！三十万卖不卖？ (500 nghìn? Đắt quá! 300 nghìn bán không?)",null,null,"Gùkè: wǔshíwàn? Tàiguì le ba! Sānshíwàn mài bù mài?",null,"BODY1282"],["老板: 三十万不行，进价都不止三十万。 (300 không được, giá nhập còn hơn 300.)",null,null,"Lǎobǎn: sānshíwàn bùxíng, jìnjià dōu bùzhǐ sānshíwàn.",null,"BODY1283"],["顾客: 我刚才在前面那家看到一样的，才三十五万。 (Vừa nãy ở quán phía trước tôi thấy y hệt, chỉ 350 nghìn.)",null,null,"Gùkè: wǒ gāngcái zài qiánmiàn nà jiā kàndào yīyàng de, cái sānshíwǔwàn.",null,"BODY1284"],["老板: 他们那个不是真皮的，你摸摸我的，质量完全不一样。 (Cái đó không phải da thật, chị sờ cái của tôi xem, chất lượng khác hẳn.)",null,null,"Lǎobǎn: tāmen nàge bùshì zhēnpí de, nǐ mōmō wǒ de, zhìliàng wánquán bù yīyàng.",null,"BODY1285"],["顾客: 嗯，手感是不错。四十万吧，四十万我就买了。 (Ừm, sờ thì thích thật. 400 nghìn đi, 400 thì tôi lấy luôn.)",null,null,"Gùkè: ń, shǒugǎn shì bùcuò. Sìshíwàn ba, sìshíwàn wǒ jiù mǎi le.",null,"BODY1286"],["老板: 四十五万，不能再少了。 (450, không bớt được nữa.)",null,null,"Lǎobǎn: sìshíwǔwàn, bùnéng zài shǎo le.",null,"BODY1287"],["顾客: 我买两个，一个送朋友。两个八十万怎么样？ (Tôi mua 2 cái, một cái tặng bạn. 2 cái 800 nghìn được không?)",null,null,"Gùkè: wǒ mǎi liǎnggè, yīgè sòng péngyou. Liǎnggè bāshíwàn zěnmeyàng?",null,"BODY1288"],["老板: 哎呀，你真会讲价！好吧，两个八十五万，最低价了。 (Trời ơi, chị mặc cả giỏi thật! Thôi được, 2 cái 850, giá thấp nhất rồi.)",null,null,"Lǎobǎn: āiyā, nǐ zhēn huì jiǎngjià! Hǎo ba, liǎnggè bā shíwǔwàn, zuìdījià le.",null,"BODY1289"],["顾客: 八十二万，再送我一个小钱包。 (820, tặng thêm cái ví nhỏ.)",null,null,"Gùkè: bāshí'èrwàn, zài sòng wǒ yīgè xiǎo qiánbāo.",null,"BODY1290"],["老板: 行行行，八十二万，钱包送你。下次再来啊！ (Được được, 820, ví tặng chị. Lần sau lại đến nhé!)",null,null,"Lǎobǎn: xíngxíngxíng, bāshí'èrwàn, qiánbāo sòng nǐ. Xiàcì zài lái a!",null,"BODY1291"],["顾客: 一定！可以帮我包得好看一点吗？我要送人的。 (Nhất định! Gói đẹp giúp tôi được không? Tôi đem tặng.)",null,null,"Gùkè: yīdìng! Kěyǐ bāng wǒ bāo de hǎokàn yīdiǎn ma? Wǒ yào sòng rén de.",null,"BODY1292"],["老板: 没问题，给你装个礼品袋。 (Không vấn đề, cho chị túi quà.)",null,null,"Lǎobǎn: méi wèntí, gěi nǐ zhuāng gè lǐpǐndài.",null,"BODY1293"],["情景对话 3 — Mua đồ điện tử: so sánh, bảo hành",null,null,"Qíngjǐng duìhuà",null,"BODY1294-C"],["顾客: 你好，我想买一台笔记本电脑，主要用来办公。 (Chào bạn, tôi muốn mua laptop, chủ yếu làm văn phòng.)",null,null,"Gùkè: nǐhǎo, wǒ xiǎng mǎi yītái bǐjìběndiànnǎo, zhǔyào yònglái bàngōng.",null,"BODY1295"],["店员: 您的预算大概是多少？ (Ngân sách của anh/chị khoảng bao nhiêu?)",null,null,"Diànyuán: nín de yùsuàn dàgài shì duōshǎo?",null,"BODY1296"],["顾客: 两千万盾左右。 (Khoảng 20 triệu.)",null,null,"Gùkè: liǎngqiānwàn dùn zuǒyòu.",null,"BODY1297"],["店员: 这个价位我推荐这两款：联想的和华硕的。 (Tầm giá này em giới thiệu 2 mẫu: Lenovo và Asus.)",null,null,"Diànyuán: zhège jiàwèi wǒ tuījiàn zhè liǎngkuǎn: Liánxiǎng de hé Huáshuò de.",null,"BODY1298"],["顾客: 这两款比，哪个性价比更高？ (So 2 mẫu này, mẫu nào đáng tiền hơn?)",null,null,"Gùkè: zhè liǎngkuǎn bǐ, nǎge xìngjiàbǐ gèng gāo?",null,"BODY1299"],["店员: 联想的电池更耐用，能用十个小时；华硕的屏幕更好，但是重一点。 (Lenovo pin bền hơn, dùng được 10 tiếng; Asus màn hình đẹp hơn nhưng nặng hơn chút.)",null,null,"Diànyuán: Liánxiǎng de diànchí gèng nàiyòng, néng yòng shígè xiǎoshí; Huáshuò de píngmù gènghǎo, dànshì zhòng yīdiǎn.",null,"BODY1300"],["顾客: 我经常出差，带着方便比较重要。 (Tôi hay đi công tác, mang theo tiện là quan trọng.)",null,null,"Gùkè: wǒ jīngcháng chūchāi, dài zhe fāngbiàn bǐjiào zhòngyào.",null,"BODY1301"],["店员: 那建议您选联想的，只有一点三公斤。 (Vậy nên chọn Lenovo, chỉ 1,3kg.)",null,null,"Diànyuán: nà jiànyìnín xuǎn Liánxiǎng de, zhǐyǒu yīdiǎn sān gōngjīn.",null,"BODY1302"],["顾客: 保修多久？ (Bảo hành bao lâu?)",null,null,"Gùkè: bǎoxiū duōjiǔ?",null,"BODY1303"],["店员: 全国联保两年，第一年还可以上门维修。 (Bảo hành toàn quốc 2 năm, năm đầu còn sửa tận nơi.)",null,null,"Diànyuán: quánguó liánbǎo liǎngnián, dìyīnián hái kěyǐ shàngmén wéixiū.",null,"BODY1304"],["顾客: 如果屏幕摔坏了，保修吗？ (Nếu rơi vỡ màn hình có bảo hành không?)",null,null,"Gùkè: rúguǒ píngmù shuāihuài le, bǎoxiū ma?",null,"BODY1305"],["店员: 人为损坏不在保修范围内。不过您可以多花一百五十万买意外险，摔坏、进水都能免费修。 (Hư hỏng do người dùng không nằm trong bảo hành. Nhưng có thể mua thêm bảo hiểm rơi vỡ 1 triệu 500, rơi vỡ hay vào nước đều sửa miễn phí.)",null,null,"Diànyuán: rénwéi sǔnhuài bù zài bǎoxiū fànwéi nèi. Bùguò nín kěyǐ duō huā yībǎiwǔshíwàn mǎi yìwàixiǎn, shuāihuài, jìnshuǐ dōu néng miǎnfèi xiū.",null,"BODY1306"],["顾客: 嗯，我考虑一下。现在买有什么赠品吗？ (Ừm, để tôi cân nhắc. Mua bây giờ có quà tặng gì không?)",null,null,"Gùkè: ń, wǒ kǎolǜyīxià. Xiànzài mǎi yǒu shénme zèngpǐn ma?",null,"BODY1307"],["店员: 送一个电脑包和一个无线鼠标。 (Tặng một túi laptop và chuột không dây.)",null,null,"Diànyuán: sòng yīgè diànnǎobāo hé yīgè wúxiàn shǔbiāo.",null,"BODY1308"],["顾客: 好，那我要联想的，加上意外险。麻烦开一张公司发票。 (Được, tôi lấy Lenovo, thêm bảo hiểm rơi vỡ. Phiền xuất hóa đơn công ty.)",null,null,"Gùkè: hǎo, nà wǒ yào Liánxiǎng de, jiāshàng yìwàixiǎn. Máfan kāi yīzhāng gōngsī fāpiào.",null,"BODY1309"],["店员: 好的，请把公司名称和税号给我。 (Vâng, xin cho em tên công ty và mã số thuế.)",null,null,"Diànyuán: hǎo de, qǐng bǎ gōngsī míngchēng hé shuìhào gěi wǒ.",null,"BODY1310"],["情景对话 4 — Đổi hàng lỗi: người bán ban đầu từ chối",null,null,"Qíngjǐng duìhuà",null,"BODY1311-C"],["顾客: 你好，我上周在这儿买了一个电饭锅，昨天就坏了，不能加热。 (Chào bạn, tuần trước tôi mua nồi cơm điện ở đây, hôm qua đã hỏng, không nóng được.)",null,null,"Gùkè: nǐhǎo, wǒ shàngzhōu zài zhèr mǎi le yīgè diànfànguō, zuótiān jiù huài le, bùnéng jiārè.",null,"BODY1312"],["店员: 您有购物小票吗？ (Anh/chị có biên lai không?)",null,null,"Diànyuán: nín yǒu gòuwù xiǎopiào ma?",null,"BODY1313"],["顾客: 有，这是小票，还有保修卡。 (Có, đây là biên lai và thẻ bảo hành.)",null,null,"Gùkè: yǒu, zhè shì xiǎopiào, háiyǒu bǎoxiūkǎ.",null,"BODY1314"],["店员: 我看一下……您是不是用的时候没放水就开了？ (Để em xem… Có phải lúc dùng anh/chị chưa cho nước đã bật không?)",null,null,"Diànyuán: wǒ kàn yīxià…… nín shìbùshì yòng de shíhou méi fàngshuǐ jiù kāi le?",null,"BODY1315"],["顾客: 不是我用错了，我每次都按说明书用的，才用了三次。 (Không phải tôi dùng sai, lần nào tôi cũng dùng theo hướng dẫn, mới dùng 3 lần.)",null,null,"Gùkè: bùshì wǒ yòng cuò le, wǒ měicì dōu àn shuōmíngshū yòng de, cái yòng le sāncì.",null,"BODY1316"],["店员: 不好意思，按照我们的规定，用过的商品不能换，只能寄到厂家维修。 (Xin lỗi, theo quy định bên em, hàng đã dùng không đổi được, chỉ gửi về hãng sửa.)",null,null,"Diànyuán: bùhǎoyìsi, ànzhào wǒmen de guīdìng, yòng guò de shāngpǐn bùnéng huàn, zhǐnéng jì dào chǎngjiā wéixiū.",null,"BODY1317"],["顾客: 维修要多久？ (Sửa mất bao lâu?)",null,null,"Gùkè: wéixiū yào duōjiǔ?",null,"BODY1318"],["店员: 大概两个星期。 (Khoảng 2 tuần.)",null,null,"Diànyuán: dàgài liǎnggè xīngqī.",null,"BODY1319"],["顾客: 两个星期太久了，我们家每天都要做饭。而且才买了一个星期就坏，这明显是质量问题。 (2 tuần lâu quá, nhà tôi ngày nào cũng nấu cơm. Mà mới mua một tuần đã hỏng, rõ ràng là lỗi chất lượng.)",null,null,"Gùkè: liǎnggè xīngqī tàijiǔ le, wǒmen jiā měitiān dōu yào zuòfàn. Érqiě cái mǎi le yīgè xīngqī jiù huài, zhè míngxiǎn shì zhìliàng wèntí.",null,"BODY1320"],["店员: 我理解，但是我没有权限给您换。 (Em hiểu, nhưng em không có quyền đổi cho anh/chị.)",null,null,"Diànyuán: wǒ lǐjiě, dànshì wǒ méiyǒu quánxiàn gěi nín huàn.",null,"BODY1321"],["顾客: 那麻烦你请你们经理来一下，好吗？ (Vậy phiền bạn mời quản lý ra được không?)",null,null,"Gùkè: nà máfan nǐ qǐng nǐmen jīnglǐ lái yīxià, hǎo ma?",null,"BODY1322"],["经理: 您好，我是这里的经理，发生什么事了？ (Chào anh/chị, tôi là quản lý ở đây, có chuyện gì vậy?)",null,null,"Jīnglǐ: nínhǎo, wǒ shì zhèlǐ de jīnglǐ, fāshēng shénme shì le?",null,"BODY1323"],["顾客: 我买的电饭锅用了三次就坏了。按照消费者保护法，质量问题在保修期内应该可以换新的。 (Nồi cơm tôi mua dùng 3 lần đã hỏng. Theo luật bảo vệ người tiêu dùng, lỗi chất lượng trong thời gian bảo hành phải được đổi mới.)",null,null,"Gùkè: wǒ mǎi de diànfànguō yòng le sāncì jiù huài le. Ànzhào xiāofèizhě bǎohùfǎ, zhìliàng wèntí zài bǎoxiūqī nèi yīnggāi kěyǐ huàn xīn de.",null,"BODY1324"],["经理: 您说得对。我们先检测一下，如果是质量问题，马上给您换一台新的。 (Anh/chị nói đúng. Bên tôi kiểm tra trước, nếu là lỗi chất lượng sẽ đổi ngay chiếc mới.)",null,null,"Jīnglǐ: nín shuōdeduì. Wǒmen xiān jiǎncè yīxià, rúguǒ shì zhìliàng wèntí, mǎshàng gěi nín huàn yītái xīn de.",null,"BODY1325"],["经理: (10 phút sau) 检测过了，是加热盘的问题，给您换一台新的。真不好意思，给您添麻烦了。 (Kiểm tra rồi, lỗi mâm nhiệt, đổi cho anh/chị chiếc mới. Thật xin lỗi, làm phiền anh/chị rồi.)",null,null,"Jīnglǐ: jiǎncè guò le, shì jiārè pán de wèntí, gěi nín huàn yītái xīn de. Zhēn bùhǎoyìsi, gěi nín tiānmáfan le.",null,"BODY1326"],["顾客: 谢谢。新的这台保修期是从今天开始算吗？ (Cảm ơn. Chiếc mới này bảo hành tính từ hôm nay à?)",null,null,"Gùkè: xièxie. Xīn de zhè tái bǎoxiūqī shìcóng jīntiān kāishǐ suàn ma?",null,"BODY1327"],["经理: 是的，从今天开始重新算一年。另外送您一个蒸笼，表示歉意。 (Vâng, tính lại một năm từ hôm nay. Tặng thêm anh/chị một xửng hấp để tạ lỗi.)",null,null,"Jīnglǐ: shì de, cóng jīntiān kāishǐ chóngxīn suàn yīnián. Lìngwài sòng nín yīgè zhēnglóng, biǎoshìqiànyì.",null,"BODY1328"],["顾客: 好的，这样处理我很满意。 (Được, xử lý vậy tôi rất hài lòng.)",null,null,"Gùkè: hǎo de, zhèyàng chǔlǐ wǒ hěn mǎnyì.",null,"BODY1329"],["情景对话 5 — Mua online: hàng giao sai, liên hệ CSKH",null,null,"Qíngjǐng duìhuà",null,"BODY1330-C"],["顾客: 你好，我在你们网店买了一双运动鞋，订单号是20261015。 (Chào bạn, tôi mua đôi giày thể thao ở shop, mã đơn 20261015.)",null,null,"Gùkè: nǐhǎo, wǒ zài nǐmen wǎngdiàn mǎi le yīshuāng yùndòngxié, dìngdānhào shì 20261015.",null,"BODY1331"],["客服: 您好，请问有什么可以帮您？ (Chào anh/chị, em có thể giúp gì ạ?)",null,null,"Kèfú: nínhǎo, qǐngwèn yǒu shénme kěyǐ bāng nín?",null,"BODY1332"],["顾客: 我买的是四十二码，可是收到的是四十码，穿不进去。 (Tôi mua size 42 mà nhận được size 40, không đi vừa.)",null,null,"Gùkè: wǒ mǎi de shì sìshí'èr mǎ, kěshì shōudào de shì sìshí mǎ, chuān bù jìnqù.",null,"BODY1333"],["客服: 非常抱歉！麻烦您拍一下鞋子和鞋盒上的标签发给我。 (Rất xin lỗi! Phiền anh/chị chụp ảnh giày và nhãn trên hộp gửi em.)",null,null,"Kèfú: fēicháng bàoqiàn! Máfan nín pāi yīxià xiézi hé xiéhé shàng de biāoqiān fāgěi wǒ.",null,"BODY1334"],["顾客: 已经发给你了。 (Gửi bạn rồi.)",null,null,"Gùkè: yǐjīng fāgěinǐ le.",null,"BODY1335"],["客服: 收到了，确实是我们发错了。您想换货还是退货？ (Nhận rồi, đúng là bên em gửi nhầm. Anh/chị muốn đổi hay trả hàng?)",null,null,"Kèfú: shōudào le, quèshí shì wǒmen fācuò le. Nín xiǎng huànhuò háishì tuìhuò?",null,"BODY1336"],["顾客: 换货吧，我还是挺喜欢这双鞋的。 (Đổi đi, tôi vẫn khá thích đôi này.)",null,null,"Gùkè: huànhuò ba, wǒ háishì tǐng xǐhuan zhè shuāng xié de.",null,"BODY1337"],["客服: 好的。我们会安排快递员明天上门取件，同时给您发四十二码的，运费由我们承担。 (Vâng. Mai bên em cho shipper đến lấy hàng, đồng thời gửi size 42, phí ship bên em chịu.)",null,null,"Kèfú: hǎo de. Wǒmen huì ānpái kuàidì yuán míngtiān shàngmén qǔ jiàn, tóngshí gěi nín fā sìshí'èr mǎ de, yùnfèi yóu wǒmen chéngdān.",null,"BODY1338"],["顾客: 大概几天能收到？ (Khoảng mấy ngày nhận được?)",null,null,"Gùkè: dàgài jǐtiān néng shōudào?",null,"BODY1339"],["客服: 河内市内两到三天。为了表示歉意，我们再送您一张五万盾的优惠券。 (Nội thành Hà Nội 2–3 ngày. Để tạ lỗi, bên em tặng anh/chị voucher 50 nghìn.)",null,null,"Kèfú: Hénèi shìnèi liǎng dào sāntiān. Wèile biǎoshìqiànyì, wǒmen zài sòng nín yīzhāng wǔwàn dùn de yōuhuìquàn.",null,"BODY1340"],["顾客: 好的，谢谢。下次请仔细一点。 (Được, cảm ơn. Lần sau cẩn thận hơn nhé.)",null,null,"Gùkè: hǎo de, xièxie. Xiàcì qǐng zǐxì yīdiǎn.",null,"BODY1341"],["客服: 一定！有任何问题随时联系我们。 (Nhất định ạ! Có vấn đề gì cứ liên hệ bên em.)",null,null,"Kèfú: yīdìng! Yǒu rènhé wèntí suíshí liánxì wǒmen.",null,"BODY1342"],["情景对话 6 — (HSK5) Đàm phán mua số lượng lớn (mua quà Trung thu cho 300 nhân viên)",null,null,"Qíngjǐng duìhuà",null,"BODY1343-C"],["采购: 王经理，我们公司想给三百个员工买中秋节礼盒，想了解一下你们的价格。 (Giám đốc Vương, công ty tôi muốn mua hộp quà Trung thu cho 300 nhân viên, muốn tìm hiểu giá bên anh.)",null,null,"Cǎigòu: Wáng jīnglǐ, wǒmen gōngsī xiǎng gěi sānbǎigè yuángōng mǎi Zhōngqiū Jié lǐhé, xiǎng liǎojiě yīxià nǐmen de jiàgé.",null,"BODY1344"],["供应商: 欢迎！我们有三种礼盒，零售价分别是五十万、八十万和一百二十万。 (Hoan nghênh! Bên tôi có 3 loại hộp quà, giá lẻ lần lượt 500 nghìn, 800 nghìn và 1 triệu 200.)",null,null,"Gōngyìngshāng: huānyíng! Wǒmen yǒu sānzhǒng lǐhé, língshòujià fēnbié shì wǔshíwàn, bāshíwàn hé yībǎi'èrshíwàn.",null,"BODY1345"],["采购: 我们的预算是每盒六十万左右，想要八十万那款。三百盒的话能按批发价吗？ (Ngân sách khoảng 600 nghìn/hộp, muốn loại 800 nghìn. 300 hộp có tính giá sỉ được không?)",null,null,"Cǎigòu: wǒmen de yùsuàn shì měihé liùshíwàn zuǒyòu, xiǎngyào bāshíwàn nàkuǎn. Sānbǎi hé dehuà néng àn pīfājià ma?",null,"BODY1346"],["供应商: 三百盒可以打八五折，六十八万一盒。 (300 hộp giảm 15%, 680 nghìn/hộp.)",null,null,"Gōngyìngshāng: sānbǎi hé kěyǐ dǎ bāwǔzhé, liùshíbā wàn yīhé.",null,"BODY1347"],["采购: 还是超出预算了。如果我们一次订三百五十盒，单价能不能降到六十万？ (Vẫn vượt ngân sách. Nếu đặt một lần 350 hộp, đơn giá giảm xuống 600 nghìn được không?)",null,null,"Cǎigòu: háishì chāochūyùsuàn le. Rúguǒ wǒmen yīcì dìng sānbǎiwǔshí hé, dānjià néng bùnéng jiàngdào liùshíwàn?",null,"BODY1348"],["供应商: 六十万太低了，月饼的成本今年涨了不少。六十五万是我们的底线。 (600 thấp quá, chi phí bánh năm nay tăng nhiều. 650 là giá sàn của bên tôi.)",null,null,"Gōngyìngshāng: liùshíwàn tài dī le, yuèbǐng de chéngběn jīnnián zhǎngle bùshǎo. Liù shíwǔwàn shì wǒmen de dǐxiàn.",null,"BODY1349"],["采购: 我理解。那换个方式：价格六十五万，但是你们免费在礼盒上印我们公司的标志，并且免费送货到三个工厂。 (Tôi hiểu. Vậy đổi cách: giá 650, nhưng bên anh in logo công ty chúng tôi lên hộp miễn phí và giao miễn phí đến 3 nhà máy.)",null,null,"Cǎigòu: wǒ lǐjiě. Nà huàn gè fāngshì: jiàgé liù shíwǔwàn, dànshì nǐmen miǎnfèi zài lǐhé shàng yìn wǒmen gōngsī de biāozhì, bìngqiě miǎnfèi sònghuòdào sāngè gōngchǎng.",null,"BODY1350"],["供应商: 印标志没问题，送货的话，河内市内免费，北宁和海防要收运费。 (In logo không vấn đề, giao hàng thì nội thành Hà Nội miễn phí, Bắc Ninh và Hải Phòng thu phí.)",null,null,"Gōngyìngshāng: yìn biāozhì méi wèntí, sònghuò dehuà, Hénèi shìnèi miǎnfèi, Běiníng hé Hǎifáng yào shōu yùnfèi.",null,"BODY1351"],["采购: 从长期合作的角度来看，我们每年春节、中秋都要订礼盒。如果这次全部免费送货，春节的订单我们也给你们。 (Xét về hợp tác lâu dài, năm nào Tết và Trung thu chúng tôi cũng đặt quà. Nếu lần này giao miễn phí toàn bộ, đơn Tết chúng tôi cũng giao cho bên anh.)",null,null,"Cǎigòu: cóng chángqī hézuò de jiǎodù láikàn, wǒmen měinián Chūn Jié, Zhōngqiū dōu yào dìng lǐhé. Rúguǒ zhècì quánbù miǎnfèi sònghuò, Chūn Jié de dìngdān wǒmen yě gěi nǐmen.",null,"BODY1352"],["供应商: 好，看在长期合作的份上，全部免费送货。 (Được, vì hợp tác lâu dài, giao miễn phí toàn bộ.)",null,null,"Gōngyìngshāng: hǎo, kàn zài chángqī hézuò de fèn shàng, quánbù miǎnfèi sònghuò.",null,"BODY1353"],["采购: 付款方式呢？ (Phương thức thanh toán?)",null,null,"Cǎigòu: fùkuǎn fāngshì ne?",null,"BODY1354"],["供应商: 先付百分之五十定金，送货以后付清余款。 (Cọc 50%, giao hàng xong trả hết phần còn lại.)",null,null,"Gōngyìngshāng: xiānfù bǎifēnzhīwǔshí dìngjīn, sònghuò yǐhòu fùqīng yúkuǎn.",null,"BODY1355"],["采购: 定金能不能改成百分之三十？我们公司的流程是收货验收以后才付大部分款项。 (Cọc đổi thành 30% được không? Quy trình công ty tôi là nhận hàng nghiệm thu xong mới trả phần lớn.)",null,null,"Cǎigòu: dìngjīn néng bùnéng gǎichéng bǎifēnzhīsānshí? Wǒmen gōngsī de liúchéng shì shōuhuò yànshōu yǐhòu cái fù dàbùfen kuǎnxiàng.",null,"BODY1356"],["供应商: 可以，百分之三十。月饼的保质期是二十天，最晚中秋节前一周送到。 (Được, 30%. Bánh hạn dùng 20 ngày, muộn nhất giao trước Trung thu một tuần.)",null,null,"Gōngyìngshāng: kěyǐ, bǎifēnzhīsānshí. Yuèbǐng de bǎozhìqī shì èrshítiān, zuì wǎn Zhōngqiū Jié qián yīzhōu sòngdào.",null,"BODY1357"],["采购: 好，那我们就这样定了。请把合同和样品发给我，我们确认以后就签。 (Được, vậy chốt thế. Gửi tôi hợp đồng và hàng mẫu, xác nhận xong chúng tôi ký.)",null,null,"Cǎigòu: hǎo, nà wǒmen jiù zhèyàng dìng le. Qǐng bǎ hétong hé yàngpǐn fāgěi wǒ, wǒmen quèrèn yǐhòu jiù qiān.",null,"BODY1358"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY1359-C"],["1. Hỏi: 你买东西最看重什么？价格、质量还是品牌？ (Mua đồ bạn coi trọng gì nhất? Giá, chất lượng hay thương hiệu?)",null,null,"Nǐ mǎi dōngxi zuì kànzhòng shénme? Jiàgé, zhìliàng háishì pǐnpái?",null,"BODY1360"],["Đáp: 我最看重性价比。太便宜的质量不好，太贵的又没必要，所以我会先看评价，再比较价格。 (Tôi coi trọng giá trị so với tiền nhất. Rẻ quá chất lượng kém, đắt quá lại không cần, nên xem đánh giá trước rồi so giá.)",null,null,"Wǒ zuì kànzhòng xìngjiàbǐ. Tài piányi de zhìliàng bùhǎo, tàiguì de yòu méi bìyào, suǒyǐ wǒhuì xiān kàn píngjià, zài bǐjiào jiàgé.",null,"BODY1361"],["2. Hỏi: 你有没有冲动消费过？买了什么？ (Bạn từng mua sắm bốc đồng chưa? Mua gì?)",null,null,"Nǐ yǒuméiyǒu chōngdòng xiāofèi guò? Mǎi le shénme?",null,"BODY1362"],["Đáp: 有。去年双十一我买了一台跑步机，觉得很划算，结果只用了三次，现在用来挂衣服。 (Có. 11/11 năm ngoái tôi mua máy chạy bộ, thấy hời lắm, rốt cuộc dùng 3 lần, giờ để phơi quần áo.)",null,null,"Yǒu. Qùnián Shuāng Shíyī wǒ mǎi le yītái pǎobùjī, juéde hěn huásuàn, jiéguǒ zhǐyòng le sāncì, xiànzài yònglái guà yīfu.",null,"BODY1363"],["3. Hỏi: 你遇到过买到假货或者质量很差的东西吗？怎么处理的？ (Từng mua phải hàng giả hay kém chất lượng chưa? Xử lý thế nào?)",null,null,"Nǐ yùdào guò mǎi dào jiǎhuò huòzhě zhìliàng hěn chà de dōngxi ma? Zěnme chǔlǐ de?",null,"BODY1364"],["Đáp: 遇到过。网上买的一个充电器用了两天就发烫，我拍了视频给客服，他们给我全额退款了。 (Từng gặp. Sạc mua trên mạng dùng 2 ngày đã nóng ran, tôi quay video gửi CSKH, họ hoàn tiền toàn bộ.)",null,null,"Yùdào guò. Wǎngshàng mǎi de yīgè chōngdiànqì yòng le liǎngtiān jiù fā tàng, wǒ pāi le shìpín gěi kèfú, tāmen gěi wǒ quán'é tuìkuǎn le.",null,"BODY1365"],["4. Hỏi: (HSK5) 你觉得现在的年轻人消费观念有什么变化？ (Bạn thấy quan niệm tiêu dùng của giới trẻ thay đổi thế nào?)",null,null,"Nǐ juéde xiànzài de niánqīngrén xiāofèiguānniàn yǒu shénme biànhuà?",null,"BODY1366"],["Đáp: 一方面，年轻人更愿意花钱买体验，比如旅游和健身；另一方面，很多人用分期付款，容易超前消费。 (Một mặt, giới trẻ sẵn sàng chi cho trải nghiệm như du lịch, gym; mặt khác, nhiều người dùng trả góp, dễ tiêu trước khả năng.)",null,null,"Yīfāngmiàn, niánqīngrén gèng yuànyì huāqiánmǎi tǐyàn, bǐrú lǚyóu hé jiànshēn; lìngyīfāngmiàn, hěnduō rén yòng fēnqīfùkuǎn, róngyì chāoqiánxiāofèi.",null,"BODY1367"],["情景模拟 ROLE-PLAY — GV đóng người bán từ chối đổi hàng lỗi; HS kiên trì nhưng lịch sự. Vòng 2 (bất ngờ): GV đòi HS chứng minh không phải lỗi người dùng",null,null,"Qíngjǐng mónǐ",null,"BODY1368-C"],["HS: 你好，我上个月买的手机，屏幕突然不亮了。 (Chào bạn, điện thoại tôi mua tháng trước, màn hình đột nhiên không sáng.)",null,null,"Nǐhǎo, wǒ shànggèyuè mǎi de shǒujī, píngmù tūrán bù liàng le.",null,"BODY1369"],["GV: 是不是您摔过？ (Có phải anh/chị làm rơi không?)",null,null,"Shìbùshì nín shuāi guò?",null,"BODY1370"],["HS: 没有摔过，一直用着保护壳和贴膜，您可以看一下，一点划痕都没有。 (Không hề rơi, luôn dùng ốp và dán màn hình, bạn xem, không một vết xước.)",null,null,"Méiyǒu shuāi guò, yīzhí yòng zhe bǎohù ké hé tiēmó, nín kěyǐ kàn yīxià, yīdiǎn huàhén dōu méiyǒu.",null,"BODY1371"],["GV: 那可能是进水了。 (Vậy có thể bị vào nước.)",null,null,"Nà kěnéng shì jìnshuǐ le.",null,"BODY1372"],["HS: 也没有进过水。不是我用错了，是手机本身的问题。能不能先检测一下？ (Cũng không vào nước. Không phải tôi dùng sai, là lỗi của máy. Kiểm tra trước được không?)",null,null,"Yě méiyǒu jìn guò shuǐ. Bùshì wǒ yòng cuò le, shì shǒujī běnshēn de wèntí. Néng bùnéng xiān jiǎncè yīxià?",null,"BODY1373"],["GV: 检测要寄到厂家，要十天。 (Kiểm tra phải gửi về hãng, mất 10 ngày.)",null,null,"Jiǎncè yào jì dào chǎngjiā, yào shítiān.",null,"BODY1374"],["HS: 十天太久了，我工作要用手机。在检测期间，能不能借我一台备用机？ (10 ngày lâu quá, tôi cần điện thoại để làm việc. Trong thời gian kiểm tra, cho tôi mượn máy dự phòng được không?)",null,null,"Shítiān tàijiǔ le, wǒ gōngzuò yào yòng shǒujī. Zài jiǎncè qījiān, néng bùnéng jiè wǒ yītái bèiyòngjī?",null,"BODY1375"],["GV: 我们一般不提供备用机。 (Bên em thường không cho mượn máy.)",null,null,"Wǒmen yībān bù tígōng bèiyòngjī.",null,"BODY1376"],["HS: 按照保修规定，保修期内质量问题可以换新或者免费维修。我是你们的会员，希望你们能灵活处理一下。 (Theo quy định bảo hành, lỗi chất lượng trong thời hạn được đổi mới hoặc sửa miễn phí. Tôi là thành viên của các bạn, mong xử lý linh hoạt.)",null,null,"Ànzhào bǎoxiū guīdìng, bǎoxiūqī nèi zhìliàng wèntí kěyǐ huàn xīn huòzhě miǎnfèi wéixiū. Wǒ shì nǐmen de huìyuán, xīwàng nǐmen néng línghuóchǔlǐ yīxià.",null,"BODY1377"],["GV: 好吧，我跟经理申请一下备用机。 (Thôi được, em xin quản lý cho mượn máy dự phòng.)",null,null,"Hǎo ba, wǒ gēn jīnglǐ shēnqǐng yīxià bèiyòngjī.",null,"BODY1378"],["HS: 谢谢！检测结果出来以后，请第一时间打电话通知我。 (Cảm ơn! Có kết quả kiểm tra thì gọi báo tôi ngay nhé.)",null,null,"Xièxie! Jiǎncè jiéguǒ chūlái yǐhòu, qǐng dìyī shíjiān dǎdiànhuà tōngzhī wǒ.",null,"BODY1379"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY1380-C"],["✗ 这个多少钱？便宜一点给我。 (cộc) → ✓ 这个多少钱？能不能便宜一点？",null,null,"Zhège duōshǎo qián? Piányi yīdiǎn gěi wǒ. | Zhège duōshǎo qián? Néng bùnéng piányi yīdiǎn?",null,"BODY1381"],["✗ 打折百分之二十。 → ✓ 打八折。 (Người TQ nói 打八折 = giảm 20%, KHÔNG phải giảm 80%.)",null,null,"Dǎzhé bǎifēnzhī'èrshí. | Dǎ bāzhé. | Dǎ bāzhé",null,"BODY1382"],["✗ 我要换这个东西因为它坏。 → ✓ 这个东西坏了，我想换一个。",null,null,"Wǒ yào huàn zhège dōngxi yīnwèi tā huài. | Zhège dōngxi huài le, wǒ xiǎng huàn yīgè.",null,"BODY1383"],["✗ 我买了它三天以前。 → ✓ 我三天前买的。",null,null,"Wǒ mǎi le tā sāntiān yǐqián. | Wǒ sāntiān qián mǎi de.",null,"BODY1384"],["✗ 这件衣服很贵太。 → ✓ 这件衣服太贵了。",null,null,"Zhèjiàn yīfu hěn guì tài. | Zhèjiàn yīfu tàiguì le.",null,"BODY1385"],["✗ 保修是多久？ → ✓ 保修多久？/ 保修期是多长时间？",null,null,"Bǎoxiū shì duōjiǔ? | Bǎoxiū duōjiǔ? / | Bǎoxiūqī shì duōchángshíjiān?",null,"BODY1386"],["Lưu ý văn hóa: ở TQ mặc cả ở chợ là bình thường; ở trung tâm thương mại hỏi 有没有活动？/ 有什么优惠？ thay vì đòi bớt giá.",null,null,"Yǒuméiyǒu huódòng? / | Yǒu shénme yōuhuì?",null,"BODY1387"],["Phát âm: 划算 huásuàn; 性价比 xìngjiàbǐ; 退货 tuìhuò; 保修 bǎoxiū.",null,null,"Huásuàn | Xìngjiàbǐ | Tuìhuò | Bǎoxiū",null,"BODY1388"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY1389-C"],["Ghi âm hội thoại yêu cầu bảo hành / đổi hàng lỗi 2–3 phút (tự đóng 2 vai, có ít nhất 1 lần bị từ chối và cách thuyết phục).",null,null,null,null,"BODY1390"],["HSK5: thêm 2 phút đàm phán mua số lượng lớn (giá – số lượng – vận chuyển – thanh toán).",null,null,null,null,"BODY1391"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY1392"],["Buổi 08 — 旅行与突发情况 Du lịch và sự cố",null,null,"Lǚxíng yǔ tūfā qíngkuàng",null,"BODY1393-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY1394-C"],["HSK4: Đặt phòng, hỏi đường, đổi vé; giới thiệu điểm du lịch Việt Nam cho bạn Trung Quốc. HSK5: Thương lượng bồi thường và hành trình thay thế khi gặp sự cố.",null,null,null,null,"BODY1395"],["Bối cảnh xuyên suốt: 4 điểm đến — Hà Nội, Hạ Long (Quảng Ninh), Đà Nẵng – Hội An, Nha Trang.",null,null,null,null,"BODY1396"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY1398-C"],["1. Hỏi: 你最近一次旅行去了哪儿？跟谁去的？ (Chuyến du lịch gần nhất bạn đi đâu? Đi với ai?)",null,null,"Nǐ zuìjìn yīcì lǚxíng qù le nǎr? Gēn shuí qù de?",null,"BODY1399"],["Đáp: 我今年夏天跟家人去了岘港，玩了四天三夜，孩子们特别喜欢美溪海滩。 (Hè này tôi đi Đà Nẵng với gia đình, 4 ngày 3 đêm, bọn trẻ rất thích biển Mỹ Khê.)",null,null,"Wǒ jīnniánxiàtiān gēn jiārén qù le Xiàngǎng, wán le sìtiān sānyè, háizi men tèbié xǐhuan Měixī Hǎitān.",null,"BODY1400"],["2. Hỏi: 如果中国朋友第一次来越南，你会推荐他去哪儿？ (Nếu bạn TQ lần đầu đến VN, bạn sẽ giới thiệu đi đâu?)",null,null,"Rúguǒ Zhōngguó péngyou dìyīcì lái Yuènán, nǐ huì tuījiàn tā qù nǎr?",null,"BODY1401"],["Đáp: 我会推荐他先去河内看老城区，然后去下龙湾坐船，时间多的话再去岘港和会安。 (Tôi giới thiệu đi Hà Nội xem phố cổ trước, rồi đi Hạ Long đi thuyền, nhiều thời gian thì đi thêm Đà Nẵng, Hội An.)",null,null,"Wǒhuì tuījiàn tā xiān qù Hénèi kàn lǎochéngqū, ránhòu qù Xiàlóng Wān zuòchuán, shíjiān duō dehuà zài qù Xiàngǎng hé Huì'ān.",null,"BODY1402"],["3. Hỏi: 你旅行的时候遇到过什么麻烦吗？ (Đi du lịch bạn từng gặp rắc rối gì chưa?)",null,null,"Nǐ lǚxíng de shíhou yùdào guò shénme máfan ma?",null,"BODY1403"],["Đáp: 遇到过。有一次航班延误了五个小时，我们在机场等到半夜才起飞。 (Từng gặp. Có lần chuyến bay trễ 5 tiếng, bọn tôi chờ ở sân bay đến nửa đêm mới cất cánh.)",null,null,"Yùdào guò. Yǒu yīcì hángbān yánwù le wǔgè xiǎoshí, wǒmen zài jīchǎng děngdào bànyè cái qǐfēi.",null,"BODY1404"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY1405-C"],["1. 预订 (đặt trước): 我在网上预订了两晚的海景房。 (Tôi đặt trên mạng 2 đêm phòng hướng biển.)",null,null,"Yùdìng | Wǒ zài wǎngshàng yùdìng le liǎng wǎn de hǎijǐngfáng.",null,"BODY1406"],["2. 取消 (hủy): 因为台风，航班被取消了。 (Vì bão, chuyến bay bị hủy.)",null,null,"Qǔxiāo | Yīnwèi táifēng, hángbān bèi qǔxiāo le.",null,"BODY1407"],["3. 改签 (đổi vé, đổi chuyến): 我想把明天的机票改签到后天。 (Tôi muốn đổi vé máy bay ngày mai sang ngày kia.)",null,null,"Gǎiqiān | Wǒ xiǎng bǎ míngtiān de jīpiào gǎiqiān dào hòutiān.",null,"BODY1408"],["4. 延误 (trễ, chậm – dùng cho chuyến bay/tàu): 航班延误了三个小时。 (Chuyến bay trễ 3 tiếng.)",null,null,"Yánwù | Hángbān yánwù le sāngè xiǎoshí.",null,"BODY1409"],["5. 行李丢失 (thất lạc hành lý): 我的行李丢失了，应该去哪儿登记？ (Hành lý tôi bị thất lạc, phải đăng ký ở đâu?)",null,null,"Xíngli diūshī | Wǒ de xíngli diūshī le, yīnggāi qù nǎr dēngjì?",null,"BODY1410"],["6. 赔偿 (bồi thường): 航空公司应该赔偿我们的损失。 (Hãng hàng không phải bồi thường thiệt hại cho chúng tôi.)",null,null,"Péicháng | Hángkōnggōngsī yīnggāi péicháng wǒmen de sǔnshī.",null,"BODY1411"],["7. 入住 / 退房 (nhận phòng / trả phòng): 几点可以入住？退房时间是几点？ (Mấy giờ nhận phòng được? Mấy giờ trả phòng?)",null,null,"Rùzhù | Tuìfáng | Jǐdiǎn kěyǐ rùzhù? Tuìfáng shíjiān shì jǐdiǎn?",null,"BODY1412"],["8. 押金 (tiền đặt cọc): 入住需要交一百万盾押金，退房时退还。 (Nhận phòng cần cọc 1 triệu, trả phòng hoàn lại.)",null,null,"Yājīn | Rùzhù xūyào jiāo yībǎiwàn dùn yājīn, tuìfáng shí tuìhuán.",null,"BODY1413"],["9. 景点 (điểm tham quan): 河内有哪些必去的景点？ (Hà Nội có những điểm nào nhất định phải đến?)",null,null,"Jǐngdiǎn | Hénèi yǒu nǎxiē bì qù de jǐngdiǎn?",null,"BODY1414"],["10. 导游 / 跟团 / 自由行 (hướng dẫn viên / đi tour / tự túc): 我们不跟团，自由行更自在。 (Chúng tôi không đi tour, tự túc thoải mái hơn.)",null,null,"Dǎoyóu | Gēn tuán | Zìyóu xíng | Wǒmen bù gēn tuán, zìyóu xíng gèng zì zài.",null,"BODY1415"],["11. 当地特色 (đặc sắc địa phương): 来了芽庄一定要尝尝当地特色的海鲜。 (Đến Nha Trang nhất định phải nếm hải sản đặc sắc địa phương.)",null,null,"Dāngdì tèsè | Lái le Yázhuāng yīdìng yào chángchang dāngdì tèsè de hǎixiān.",null,"BODY1416"],["12. 旺季 / 淡季 (mùa cao điểm / thấp điểm): 夏天是岘港的旺季，酒店要提前订。 (Mùa hè là cao điểm ở Đà Nẵng, khách sạn phải đặt trước.)",null,null,"Wàngjì | Dànjì | Xiàtiān shì Xiàngǎng de wàngjì, jiǔdiàn yào tíqián dìng.",null,"BODY1417"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY1418-C"],["1. 我的航班被取消了，…… (Chuyến bay của tôi bị hủy, …)",null,null,"Wǒ de hángbān bèi qǔxiāo le,……",null,"BODY1419"],["Ví dụ: 我的航班被取消了，请问今天还有去胡志明市的航班吗？ (Chuyến bay của tôi bị hủy, xin hỏi hôm nay còn chuyến đi TP.HCM không?)",null,null,"Wǒ de hángbān bèi qǔxiāo le, qǐngwèn jīntiān háiyǒu qù Húzhìmíng Shì de hángbān ma?",null,"BODY1420"],["Ví dụ: 我的航班被取消了，可是明天上午我要见客户，这怎么办？ (Chuyến bay của tôi bị hủy, mà sáng mai tôi phải gặp khách, giờ làm sao?)",null,null,"Wǒ de hángbān bèi qǔxiāo le, kěshì míngtiān shàngwǔ wǒ yào jiàn kèhù, zhè zěnmebàn?",null,"BODY1421"],["2. 还有其他办法吗？ (Còn cách nào khác không?)",null,null,"Háiyǒu qítā bànfǎ ma?",null,"BODY1422"],["Ví dụ: 今天的航班都满了吗？还有其他办法吗？比如坐火车？ (Chuyến bay hôm nay kín hết rồi à? Còn cách nào khác không? Như đi tàu?)",null,null,"Jīntiān de hángbān dōu mǎn le ma? Háiyǒu qítā bànfǎ ma? Bǐrú zuòhuǒchē?",null,"BODY1423"],["Ví dụ: 如果不能退款，还有其他办法吗？能不能换成代金券？ (Nếu không hoàn tiền được, còn cách nào khác không? Đổi sang voucher được không?)",null,null,"Rúguǒ bùnéng tuìkuǎn, háiyǒu qítā bànfǎ ma? Néng bùnéng huànchéng dàijīnquàn?",null,"BODY1424"],["3. 我在……预订了……，预订号是…… (Tôi đã đặt … ở …, mã đặt là …)",null,null,"Wǒ zài…… yùdìng le……, yùdìng hào shì……",null,"BODY1425"],["Ví dụ: 我在网上预订了三晚的双人房，预订号是A12345。 (Tôi đặt trên mạng 3 đêm phòng đôi, mã đặt A12345.)",null,null,"Wǒ zài wǎngshàng yùdìng le sān wǎn de shuāngrénfáng, yùdìng hào shì A12345.",null,"BODY1426"],["Ví dụ: 我在你们官网预订了明天的游船，预订号发到您邮箱了。 (Tôi đặt du thuyền ngày mai trên web chính thức, mã đặt đã gửi vào email bạn.)",null,null,"Wǒ zài nǐmen guān wǎng yùdìng le míngtiān de yóuchuán, yùdìng hào fādào nín yóuxiāng le.",null,"BODY1427"],["4. 从……到……怎么去最方便？ (Từ … đến … đi thế nào tiện nhất?)",null,null,"Cóng…… dào…… zěnme qù zuì fāngbiàn?",null,"BODY1428"],["Ví dụ: 从河内到下龙湾怎么去最方便？ (Từ Hà Nội đến Hạ Long đi thế nào tiện nhất?)",null,null,"Cóng Hénèi dào Xiàlóng Wān zěnme qù zuì fāngbiàn?",null,"BODY1429"],["Ví dụ: 从岘港到会安怎么去最方便？要多长时间？ (Từ Đà Nẵng đến Hội An đi thế nào tiện nhất? Mất bao lâu?)",null,null,"Cóng Xiàngǎng dào Huì'ān zěnme qù zuì fāngbiàn? Yào duōchángshíjiān?",null,"BODY1430"],["5. 来……一定要……，不然就白来了 (Đến … nhất định phải …, không thì coi như uổng công)",null,null,"Lái…… yīdìng yào……, bùrán jiù bái lái le",null,"BODY1431"],["Ví dụ: 来河内一定要尝尝烤肉米线，不然就白来了。 (Đến Hà Nội nhất định phải ăn bún chả, không thì uổng công.)",null,null,"Lái Hénèi yīdìng yào chángchang kǎoròumǐxiàn, bùrán jiù bái lái le.",null,"BODY1432"],["Ví dụ: 来岘港一定要去巴拿山看金桥，不然就白来了。 (Đến Đà Nẵng nhất định phải lên Bà Nà xem Cầu Vàng, không thì uổng công.)",null,null,"Lái Xiàngǎng yīdìng yào qù Bāná Shān kàn Jīnqiáo, bùrán jiù bái lái le.",null,"BODY1433"],["6. ……以……出名 (… nổi tiếng về …)",null,null,"…… Yǐ…… chūmíng",null,"BODY1434"],["Ví dụ: 下龙湾以三千多个石灰岩岛屿出名。 (Hạ Long nổi tiếng với hơn 3.000 đảo đá vôi.)",null,null,"Xiàlóng Wān yǐ sānqiānduō gè shíhuīyán dǎoyǔ chūmíng.",null,"BODY1435"],["Ví dụ: 芽庄以海滩和海鲜出名。 (Nha Trang nổi tiếng về bãi biển và hải sản.)",null,null,"Yázhuāng yǐ hǎitān hé hǎixiān chūmíng.",null,"BODY1436"],["7. 不管……，都…… (Dù …, đều …)",null,null,"Bùguǎn……, dōu……",null,"BODY1437"],["Ví dụ: 不管什么季节，河内老城区都很热闹。 (Dù mùa nào, phố cổ Hà Nội đều rất náo nhiệt.)",null,null,"Bùguǎn shénme jìjié, Hénèi lǎochéngqū dōu hěn rènao.",null,"BODY1438"],["Ví dụ: 不管航班延误多久，你们都应该给我们安排吃的。 (Dù trễ bao lâu, các bạn đều phải sắp xếp đồ ăn cho chúng tôi.)",null,null,"Bùguǎn hángbān yánwù duōjiǔ, nǐmen dōu yīnggāi gěi wǒmen ānpái chī de.",null,"BODY1439"],["8. 麻烦您帮我…… (Phiền anh/chị giúp tôi …)",null,null,"Máfan nín bāng wǒ……",null,"BODY1440"],["Ví dụ: 麻烦您帮我叫一辆出租车去机场。 (Phiền anh/chị gọi giúp tôi một taxi ra sân bay.)",null,null,"Máfan nín bāng wǒ jiào yīliàng chūzūchē qù jīchǎng.",null,"BODY1441"],["Ví dụ: 麻烦您帮我把行李寄存到下午。 (Phiền anh/chị giữ hành lý giúp tôi đến chiều.)",null,null,"Máfan nín bāng wǒ bǎ xíngli jìcún dào xiàwǔ.",null,"BODY1442"],["9. (HSK5) 按照规定，……应该…… (Theo quy định, … phải …)",null,null,"Ànzhào guīdìng,…… yīnggāi……",null,"BODY1443"],["Ví dụ: 按照规定，航班延误超过四个小时，航空公司应该提供餐食和赔偿。 (Theo quy định, trễ trên 4 tiếng hãng phải cung cấp bữa ăn và bồi thường.)",null,null,"Ànzhào guīdìng, hángbān yánwù chāoguò sìgè xiǎoshí, hángkōnggōngsī yīnggāi tígōng cānshí hé péicháng.",null,"BODY1444"],["Ví dụ: 按照规定，酒店超额预订应该负责安排同等级的酒店。 (Theo quy định, khách sạn nhận đặt quá số phòng phải chịu trách nhiệm bố trí khách sạn cùng hạng.)",null,null,"Ànzhào guīdìng, jiǔdiàn chāo'é yùdìng yīnggāi fùzé ānpái tóng děngjí de jiǔdiàn.",null,"BODY1445"],["10. (HSK5) 我可以接受……，但前提是…… (Tôi có thể chấp nhận …, nhưng với điều kiện …)",null,null,"Wǒ kěyǐ jiēshòu……, dàn qiántí shì……",null,"BODY1446"],["Ví dụ: 我可以接受改签到明天，但前提是你们负责今晚的酒店。 (Tôi chấp nhận đổi sang mai, nhưng với điều kiện các bạn lo khách sạn tối nay.)",null,null,"Wǒ kěyǐ jiēshòu gǎiqiān dào míngtiān, dàn qiántí shì nǐmen fùzé jīnwǎn de jiǔdiàn.",null,"BODY1447"],["Ví dụ: 我可以接受换酒店，但前提是你们安排车送我们过去。 (Tôi chấp nhận đổi khách sạn, nhưng với điều kiện các bạn bố trí xe đưa qua.)",null,null,"Wǒ kěyǐ jiēshòu huàn jiǔdiàn, dàn qiántí shì nǐmen ānpái chē sòng wǒmen guòqù.",null,"BODY1448"],["情景对话 1 — HÀ NỘI: dẫn bạn Trung Quốc đi phố cổ",null,null,"Qíngjǐng duìhuà",null,"BODY1449-C"],["A: 小王，欢迎来河内！今天我带你逛逛老城区。 (Tiểu Vương, chào mừng đến Hà Nội! Hôm nay mình dẫn bạn dạo phố cổ.)",null,null,"Xiǎo Wáng, huānyíng lái Hénèi! Jīntiān wǒ dài nǐ guàngguàng lǎochéngqū.",null,"BODY1450"],["B: 太好了！河内有哪些必去的景点？ (Tuyệt quá! Hà Nội có những điểm nào nhất định phải đến?)",null,null,"Tàihǎole! Hénèi yǒu nǎxiē bì qù de jǐngdiǎn?",null,"BODY1451"],["A: 第一站是还剑湖，湖中间有个龟塔，是河内的象征。 (Điểm đầu là Hồ Hoàn Kiếm, giữa hồ có Tháp Rùa, biểu tượng của Hà Nội.)",null,null,"Dìyīzhàn shì Huánjiàn Hú, hú zhōngjiān yǒu gè guī tǎ, shì Hénèi de xiàngzhēng.",null,"BODY1452"],["B: 为什么叫还剑湖？ (Sao lại gọi là Hồ Hoàn Kiếm?)",null,null,"Wèishénme jiào Huánjiàn Hú?",null,"BODY1453"],["A: 传说以前有一位国王在这里把宝剑还给了神龟，所以叫\"还剑\"。 (Truyền thuyết kể một vị vua trả lại gươm báu cho Rùa thần ở đây, nên gọi là \"Hoàn Kiếm\".)",null,null,"Chuánshuō yǐqián yǒu yīwèi guówáng zài zhèlǐ bǎ bǎojiàn huángěi le shénguī, suǒyǐ jiào \"huánjiàn\".",null,"BODY1454"],["B: 有意思！老城区为什么街道名字都是\"某某街\"？ (Thú vị! Sao tên phố cổ đều là \"phố Hàng …\"?)",null,null,"Yǒuyìsi! Lǎochéngqū wèishénme jiēdào míngzi dōu shì \"mǒumǒu jiē\"?",null,"BODY1455"],["A: 老城区有三十六条街，以前每条街卖一种东西，比如\"银器街\"卖银器，\"糖街\"卖糖。 (Phố cổ có 36 phố phường, xưa mỗi phố bán một mặt hàng, như Hàng Bạc bán đồ bạc, Hàng Đường bán đường.)",null,null,"Lǎochéngqū yǒu sānshíliùtiáo jiē, yǐqián měi tiáo jiē mài yīzhǒng dōngxi, bǐrú \"yínqì jiē\" mài yínqì, \"táng jiē\" mài táng.",null,"BODY1456"],["B: 我看到很多人坐在路边的小凳子上喝东西。 (Mình thấy nhiều người ngồi ghế nhựa bên đường uống gì đó.)",null,null,"Wǒ kàndào hěnduō rén zuòzài lùbiān de xiǎo dèngzi shàng hē dōngxi.",null,"BODY1457"],["A: 那是河内的\"人行道文化\"。我们去喝一杯鸡蛋咖啡吧，是河内的特色。 (Đó là \"văn hóa vỉa hè\" Hà Nội. Mình đi uống cà phê trứng nhé, đặc sản Hà Nội đấy.)",null,null,"Nà shì Hénèi de \"rénxíngdào wénhuà\". Wǒmen qù hēyībēi jīdànkāfēi ba, shì Hénèi de tèsè.",null,"BODY1458"],["B: 鸡蛋咖啡？听起来很奇怪。 (Cà phê trứng? Nghe lạ quá.)",null,null,"Jīdànkāfēi? Tīng qǐlái hěn qíguài.",null,"BODY1459"],["A: 喝起来像提拉米苏，很香很甜，你一定会喜欢的。 (Uống giống tiramisu, rất thơm ngọt, bạn chắc chắn sẽ thích.)",null,null,"Hē qǐlái xiàng tílā mǐsū, hěn xiāng hěntián, nǐ yīdìng huì xǐhuan de.",null,"BODY1460"],["B: (uống xong) 真的好喝！中午我们吃什么？ (Ngon thật! Trưa mình ăn gì?)",null,null,"Zhēnde hǎohē! Zhōngwǔ wǒmen chī shénme?",null,"BODY1461"],["A: 来河内一定要尝尝烤肉米线，不然就白来了。美国总统奥巴马也来吃过。 (Đến Hà Nội nhất định phải ăn bún chả, không thì uổng công. Tổng thống Obama cũng từng đến ăn.)",null,null,"Lái Hénèi yīdìng yào chángchang kǎoròumǐxiàn, bùrán jiù bái lái le. Měiguó zǒngtǒng Àobāmǎ yě lái chī guò.",null,"BODY1462"],["B: 哈哈，那一定要去！晚上还有什么活动？ (Haha, vậy nhất định phải đi! Tối còn hoạt động gì nữa?)",null,null,"Hāhā, nà yīdìng yào qù! Wǎnshàng háiyǒu shénme huódòng?",null,"BODY1463"],["A: 晚上可以看水上木偶戏，然后去啤酒街喝扎啤，周末那里还是步行街。 (Tối xem múa rối nước, rồi ra phố bia Tạ Hiện uống bia hơi, cuối tuần ở đó còn là phố đi bộ.)",null,null,"Wǎnshàng kěyǐ kàn shuǐshàngmù'ǒuxì, ránhòu qù píjiǔ jiē hē zhāpí, zhōumò nàlǐ háishì bùxíngjiē.",null,"BODY1464"],["B: 安排得太好了！明天呢？ (Sắp xếp hay quá! Còn mai?)",null,null,"Ānpái de tàihǎole! Míngtiān ne?",null,"BODY1465"],["A: 明天上午去胡志明陵和文庙，下午你自由活动，后天我们去下龙湾。 (Sáng mai đi Lăng Bác và Văn Miếu, chiều bạn tự do, ngày kia mình đi Hạ Long.)",null,null,"Míngtiān shàngwǔ qù Húzhìmíng Líng hé Wénmiào, xiàwǔ nǐ zìyóu huódòng, hòutiān wǒmen qù Xiàlóng Wān.",null,"BODY1466"],["情景对话 2 — HẠ LONG (Quảng Ninh): đặt tour du thuyền qua điện thoại",null,null,"Qíngjǐng duìhuà",null,"BODY1467-C"],["游客: 你好，我想预订下龙湾的游船，两个人，这个周六。 (Chào bạn, tôi muốn đặt du thuyền Hạ Long, 2 người, thứ 7 này.)",null,null,"Yóukè: nǐhǎo, wǒ xiǎng yùdìng Xiàlóng Wān de yóuchuán, liǎnggè rén, zhège zhōuliù.",null,"BODY1468"],["客服: 您好！我们有一日游和两天一夜的，您想选哪种？ (Chào anh/chị! Bên em có tour trong ngày và 2 ngày 1 đêm, anh/chị chọn loại nào?)",null,null,"Kèfú: nínhǎo! Wǒmen yǒu yīrìyóu hé liǎngtiān yīyè de, nín xiǎng xuǎn nǎ zhǒng?",null,"BODY1469"],["游客: 两天一夜的包括什么？ (2 ngày 1 đêm gồm những gì?)",null,null,"Yóukè: liǎngtiān yīyè de bāokuò shénme?",null,"BODY1470"],["客服: 包括从河内往返的接送、船上住一晚、四顿饭，还有划皮艇和参观溶洞。 (Gồm xe đưa đón khứ hồi từ Hà Nội, ngủ trên thuyền một đêm, 4 bữa ăn, chèo kayak và tham quan hang động.)",null,null,"Kèfú: bāokuò cóng Hénèi wǎngfǎn de jiēsòng, chuánshàng zhù yī wǎn, sì dùnfàn, háiyǒu huà pítǐng hé cānguān róngdòng.",null,"BODY1471"],["游客: 从河内到下龙湾要多长时间？ (Từ Hà Nội đến Hạ Long mất bao lâu?)",null,null,"Yóukè: cóng Hénèi dào Xiàlóng Wān yào duōchángshíjiān?",null,"BODY1472"],["客服: 走高速公路大概两个半小时。早上八点在您的酒店接您。 (Đi cao tốc khoảng 2 tiếng rưỡi. 8h sáng đón tại khách sạn của anh/chị.)",null,null,"Kèfú: zǒu gāosùgōnglù dàgài liǎnggè bànxiǎoshí. Zǎoshang bādiǎn zài nín de jiǔdiàn jiē nín.",null,"BODY1473"],["游客: 价格是多少？ (Giá bao nhiêu?)",null,null,"Yóukè: jiàgé shì duōshǎo?",null,"BODY1474"],["客服: 海景房每人三百五十万盾，带阳台的是四百二十万。 (Phòng hướng biển 3 triệu 500/người, có ban công là 4 triệu 200.)",null,null,"Kèfú: hǎijǐngfáng měirén sānbǎiwǔshíwàn dùn, dài yángtái de shì sìbǎi èrshíwàn.",null,"BODY1475"],["游客: 我们要带阳台的。船上的饭有素食吗？我朋友不吃肉。 (Chúng tôi lấy phòng có ban công. Đồ ăn trên thuyền có món chay không? Bạn tôi không ăn thịt.)",null,null,"Yóukè: wǒmen yào dài yángtái de. Chuánshàng de fàn yǒu sùshí ma? Wǒ péngyou bùchī ròu.",null,"BODY1476"],["客服: 有的，我帮您备注一位素食。 (Có ạ, em ghi chú giúp một suất chay.)",null,null,"Kèfú: yǒu de, wǒ bāng nín bèizhù yīwèi sùshí.",null,"BODY1477"],["游客: 如果那天天气不好，可以取消吗？ (Nếu hôm đó thời tiết xấu, hủy được không?)",null,null,"Yóukè: rúguǒ nàtiān tiānqì bùhǎo, kěyǐ qǔxiāo ma?",null,"BODY1478"],["客服: 如果因为台风船不能出海，我们会全额退款，或者免费改到别的日期。 (Nếu bão thuyền không ra khơi được, bên em hoàn tiền 100% hoặc đổi ngày miễn phí.)",null,null,"Kèfú: rúguǒ yīnwèi táifēng chuán bùnéng chūhǎi, wǒmen huì quán'é tuìkuǎn, huòzhě miǎnfèi gǎi dào biéde rìqī.",null,"BODY1479"],["游客: 那如果是我们自己的原因取消呢？ (Còn nếu hủy vì lý do của chúng tôi?)",null,null,"Yóukè: nà rúguǒ shì wǒmen zìjǐ de yuányīn qǔxiāo ne?",null,"BODY1480"],["客服: 提前三天取消免费，三天以内要收百分之五十的费用。 (Hủy trước 3 ngày miễn phí, trong vòng 3 ngày thu 50% phí.)",null,null,"Kèfú: tíqián sāntiān qǔxiāo miǎnfèi, sāntiān yǐnèi yào shōu bǎifēnzhīwǔshí de fèiyòng.",null,"BODY1481"],["游客: 明白了。在下龙湾还有什么值得去的地方？ (Hiểu rồi. Ở Hạ Long còn chỗ nào đáng đi?)",null,null,"Yóukè: míngbai le. Zài Xiàlóng Wān háiyǒu shénme zhíde qù de dìfang?",null,"BODY1482"],["客服: 时间多的话，可以坐缆车去太阳世界看摩天轮，晚上还有夜市。 (Nhiều thời gian thì đi cáp treo Sun World xem vòng quay, tối còn có chợ đêm.)",null,null,"Kèfú: shíjiān duō dehuà, kěyǐ zuò lǎnchē qù tàiyáng shìjiè kàn mótiānlún, wǎnshàng háiyǒu yèshì.",null,"BODY1483"],["游客: 好，就订带阳台的，两个人。怎么付款？ (Được, đặt phòng có ban công, 2 người. Thanh toán thế nào?)",null,null,"Yóukè: hǎo, jiù dìng dài yángtái de, liǎnggè rén. Zěnme fùkuǎn?",null,"BODY1484"],["客服: 您先转账百分之三十的定金，我马上把确认单发到您的邮箱。 (Anh/chị chuyển trước 30% tiền cọc, em gửi ngay phiếu xác nhận vào email.)",null,null,"Kèfú: nín xiān zhuǎnzhàng bǎifēnzhīsānshí de dìngjīn, wǒ mǎshàng bǎ quèrèn dānfā dào nín de yóuxiāng.",null,"BODY1485"],["情景对话 3 — ĐÀ NẴNG – HỘI AN: nhận phòng khách sạn và hỏi lịch trình",null,null,"Qíngjǐng duìhuà",null,"BODY1486-C"],["前台: 您好，欢迎入住！请问有预订吗？ (Chào anh/chị, chào mừng nhận phòng! Có đặt trước không ạ?)",null,null,"Qiántái: nínhǎo, huānyíng rùzhù! Qǐngwèn yǒu yùdìng ma?",null,"BODY1487"],["游客: 有，我在网上预订了三晚的家庭房，预订号是DN5678，姓陈。 (Có, tôi đặt trên mạng 3 đêm phòng gia đình, mã DN5678, họ Trần.)",null,null,"Yóukè: yǒu, wǒ zài wǎngshàng yùdìng le sān wǎn de jiātíng fáng, yùdìng hào shì DN5678, xìng chén.",null,"BODY1488"],["前台: 好的，请出示一下护照。入住需要交一百万盾押金，退房的时候退还。 (Vâng, xin cho xem hộ chiếu. Nhận phòng cần cọc 1 triệu, trả phòng hoàn lại.)",null,null,"Qiántái: hǎo de, qǐng chūshì yīxià hùzhào. Rùzhù xūyào jiāo yībǎiwàn dùn yājīn, tuìfáng de shíhou tuìhuán.",null,"BODY1489"],["游客: 可以刷卡吗？ (Quẹt thẻ được không?)",null,null,"Yóukè: kěyǐ shuākǎ ma?",null,"BODY1490"],["前台: 可以。您的房间在十二楼，海景房。早餐是六点半到十点，在二楼餐厅。 (Được. Phòng anh/chị ở tầng 12, hướng biển. Bữa sáng 6h30–10h, ở nhà hàng tầng 2.)",null,null,"Qiántái: kěyǐ. Nín de fángjiān zài shí'èrlóu, hǎijǐngfáng. Zǎocān shì liùdiǎnbàn dào shídiǎn, zài èrlóu cāntīng.",null,"BODY1491"],["游客: 谢谢。我们想去巴拿山，从这儿过去要多久？ (Cảm ơn. Chúng tôi muốn đi Bà Nà, từ đây đi mất bao lâu?)",null,null,"Yóukè: xièxie. Wǒmen xiǎng qù Bāná Shān, cóng zhèr guòqù yào duōjiǔ?",null,"BODY1492"],["前台: 打车大概四十分钟。建议早上八点前出发，人比较少。 (Đi taxi khoảng 40 phút. Nên đi trước 8h sáng, ít người hơn.)",null,null,"Qiántái: dǎchē dàgài sìshífēnzhōng. Jiànyì zǎoshang bādiǎn qián chūfā, rén bǐjiào shǎo.",null,"BODY1493"],["游客: 巴拿山有什么好玩的？ (Bà Nà có gì vui?)",null,null,"Yóukè: Bāná Shān yǒu shénme hǎowán de?",null,"BODY1494"],["前台: 最有名的是金桥，就是两只大手托着的那座桥。山上还有法国村，温度比下面低十度左右，记得带件外套。 (Nổi tiếng nhất là Cầu Vàng, cây cầu có đôi bàn tay khổng lồ nâng đỡ. Trên núi còn có làng Pháp, nhiệt độ thấp hơn dưới khoảng 10 độ, nhớ mang áo khoác.)",null,null,"Qiántái: zuì yǒumíng de shì Jīnqiáo, jiùshì liǎngzhī dà shǒu tuō zhe de nà zuò qiáo. Shānshàng háiyǒu fǎguó cūn, wēndù bǐ xiàmiàn dī shídù zuǒyòu, jìde dài jiàn wàitào.",null,"BODY1495"],["游客: 那从岘港到会安怎么去最方便？ (Vậy từ Đà Nẵng đến Hội An đi thế nào tiện nhất?)",null,null,"Yóukè: nà cóng Xiàngǎng dào Huì'ān zěnme qù zuì fāngbiàn?",null,"BODY1496"],["前台: 打车或者包车都可以，大概四十五分钟。会安古镇晚上最漂亮，到处都是灯笼。 (Đi taxi hoặc thuê xe đều được, khoảng 45 phút. Phố cổ Hội An đẹp nhất buổi tối, đèn lồng khắp nơi.)",null,null,"Qiántái: dǎchē huòzhě bāochē dōu kěyǐ, dàgài sìshíwǔfēnzhōng. Huì'āngǔzhèn wǎnshàng zuì piàoliang, dàochù dōu shì dēnglóng.",null,"BODY1497"],["游客: 我们想后天晚上去会安，酒店可以帮我们包车吗？ (Tối ngày kia chúng tôi muốn đi Hội An, khách sạn thuê xe giúp được không?)",null,null,"Yóukè: wǒmen xiǎng hòutiān wǎnshàng qù Huì'ān, jiǔdiàn kěyǐ bāng wǒmen bāochē ma?",null,"BODY1498"],["前台: 可以，七座车往返是八十万盾，司机会等您三个小时。 (Được, xe 7 chỗ khứ hồi 800 nghìn, tài xế đợi 3 tiếng.)",null,null,"Qiántái: kěyǐ, qīzuò chē wǎngfǎn shì bāshíwàn dùn, sījī huì děng nín sāngè xiǎoshí.",null,"BODY1499"],["游客: 好，麻烦您帮我订后天下午五点的。 (Được, phiền đặt giúp tôi 5h chiều ngày kia.)",null,null,"Yóukè: hǎo, máfan nín bāng wǒ dìng hòutiān xiàwǔ wǔdiǎn de.",null,"BODY1500"],["前台: 没问题。还有什么需要吗？ (Không vấn đề. Còn cần gì nữa không ạ?)",null,null,"Qiántái: méi wèntí. Háiyǒu shénme xūyào ma?",null,"BODY1501"],["游客: 退房那天我们的航班是晚上九点，能不能晚一点退房？ (Hôm trả phòng chuyến bay chúng tôi lúc 9h tối, trả phòng muộn chút được không?)",null,null,"Yóukè: tuìfáng nàtiān wǒmen de hángbān shì wǎnshàng jiǔdiǎn, néng bùnéng wǎnyīdiǎn tuìfáng?",null,"BODY1502"],["前台: 可以延迟到下午两点，免费。之后的话可以把行李寄存在前台。 (Được lùi đến 2h chiều, miễn phí. Sau đó có thể gửi hành lý ở lễ tân.)",null,null,"Qiántái: kěyǐ yánchí dào xiàwǔ liǎngdiǎn, miǎnfèi. Zhīhòu dehuà kěyǐ bǎ xíngli jìcún zài qiántái.",null,"BODY1503"],["游客: 太好了，谢谢！ (Tuyệt quá, cảm ơn!)",null,null,"Yóukè: tàihǎole, xièxie!",null,"BODY1504"],["情景对话 4 — NHA TRANG: chuyến bay bị hủy do bão, đổi vé tại sân bay",null,null,"Qíngjǐng duìhuà",null,"BODY1505-C"],["旅客: 你好，我的航班被取消了，VN1556，河内到芽庄。 (Chào bạn, chuyến bay của tôi bị hủy, VN1556, Hà Nội đi Nha Trang.)",null,null,"Lǚkè: nǐhǎo, wǒ de hángbān bèi qǔxiāo le, VN1556, Hénèi dào Yázhuāng.",null,"BODY1506"],["柜台: 非常抱歉，因为芽庄有台风，今天所有去芽庄的航班都取消了。 (Rất xin lỗi, vì Nha Trang có bão, hôm nay mọi chuyến đi Nha Trang đều hủy.)",null,null,"Guìtái: fēicháng bàoqiàn, yīnwèi Yázhuāng yǒu táifēng, jīntiān suǒyǒu qù Yázhuāng de hángbān dōu qǔxiāo le.",null,"BODY1507"],["旅客: 那怎么办？我订了芽庄的酒店，还有明天的出海行程。 (Vậy làm sao? Tôi đã đặt khách sạn ở Nha Trang, còn lịch ra đảo ngày mai.)",null,null,"Lǚkè: nà zěnmebàn? Wǒ dìng le Yázhuāng de jiǔdiàn, háiyǒu míngtiān de chūhǎi xíngchéng.",null,"BODY1508"],["柜台: 我们可以帮您免费改签到明天下午的航班，或者全额退票。 (Bên em có thể đổi miễn phí sang chuyến chiều mai, hoặc hoàn vé toàn bộ.)",null,null,"Guìtái: wǒmen kěyǐ bāng nín miǎnfèi gǎiqiān dào míngtiān xiàwǔ de hángbān, huòzhě quán'é tuìpiào.",null,"BODY1509"],["旅客: 明天上午有没有航班？ (Sáng mai có chuyến nào không?)",null,null,"Lǚkè: míngtiān shàngwǔ yǒuméiyǒu hángbān?",null,"BODY1510"],["柜台: 上午的已经满了，最早是下午两点的。 (Buổi sáng kín rồi, sớm nhất là 2h chiều.)",null,null,"Guìtái: shàngwǔ de yǐjīng mǎn le, zuìzǎo shì xiàwǔ liǎngdiǎn de.",null,"BODY1511"],["旅客: 还有其他办法吗？比如先飞到金兰机场附近的城市？ (Còn cách nào khác không? Như bay trước đến thành phố gần sân bay Cam Ranh?)",null,null,"Lǚkè: háiyǒu qítā bànfǎ ma? Bǐrú xiān fēi dào Jīnlán Jīchǎng fùjìn de chéngshì?",null,"BODY1512"],["柜台: 可以改到明天上午九点去大叻的航班，然后坐车去芽庄，大概三个半小时。 (Có thể đổi sang chuyến 9h sáng mai đi Đà Lạt, rồi đi xe xuống Nha Trang, khoảng 3 tiếng rưỡi.)",null,null,"Guìtái: kěyǐ gǎi dào míngtiān shàngwǔ jiǔdiǎn qù Dàlè de hángbān, ránhòu zuòchēqù Yázhuāng, dàgài sāngè bànxiǎoshí.",null,"BODY1513"],["旅客: 那太远了，还是坐明天下午两点的吧。今天晚上我住哪儿？ (Xa quá, thôi đi chuyến 2h chiều mai. Tối nay tôi ở đâu?)",null,null,"Lǚkè: nà tài yuǎn le, háishì zuò míngtiān xiàwǔ liǎngdiǎn de ba. Jīntiān wǎnshàng wǒ zhù nǎr?",null,"BODY1514"],["柜台: 因为是天气原因，按照规定，航空公司不负责酒店。 (Vì lý do thời tiết, theo quy định hãng không chịu trách nhiệm khách sạn.)",null,null,"Guìtái: yīnwèi shì tiānqì yuányīn, ànzhào guīdìng, hángkōnggōngsī bù fùzé jiǔdiàn.",null,"BODY1515"],["旅客: 我理解。那芽庄的酒店今晚的房费，你们能开一个航班取消的证明吗？我要拿去跟酒店和保险公司说明。 (Tôi hiểu. Vậy tiền phòng tối nay ở Nha Trang, các bạn cấp giấy xác nhận chuyến bay bị hủy được không? Tôi cần trình khách sạn và bảo hiểm.)",null,null,"Lǚkè: wǒ lǐjiě. Nà Yázhuāng de jiǔdiàn jīnwǎn de fángfèi, nǐmen néng kāi yīgè hángbān qǔxiāo de zhèngmíng ma? Wǒ yào ná qù gēn jiǔdiàn hé bǎoxiǎngōngsī shuōmíng.",null,"BODY1516"],["柜台: 可以，我马上给您打印。 (Được, em in cho anh/chị ngay.)",null,null,"Guìtái: kěyǐ, wǒ mǎshàng gěi nín dǎyìn.",null,"BODY1517"],["旅客: 谢谢。(gọi cho khách sạn) 你好，我是今天入住的陈先生，航班因为台风取消了，能不能把预订往后推一天？ (Chào bạn, tôi là anh Trần nhận phòng hôm nay, chuyến bay hủy do bão, lùi đặt phòng sang một ngày được không?)",null,null,"Lǚkè: xièxie. | Nǐhǎo, wǒ shì jīntiān rùzhù de Chén xiānsheng, hángbān yīnwèi táifēng qǔxiāo le, néng bùnéng bǎ yùdìng wǎnghòu tuī yītiān?",null,"BODY1518"],["酒店: 没问题，台风的情况我们可以免费帮您改，明天见。 (Không vấn đề, trường hợp bão bên em đổi miễn phí, hẹn gặp mai.)",null,null,"Jiǔdiàn: méi wèntí, táifēng de qíngkuàng wǒmen kěyǐ miǎnfèi bāng nín gǎi, míngtiān jiàn.",null,"BODY1519"],["旅客: 太好了。明天的出海行程也麻烦你们帮我改到后天。 (Tốt quá. Lịch ra đảo ngày mai cũng phiền đổi giúp sang ngày kia.)",null,null,"Lǚkè: tàihǎole. Míngtiān de chūhǎi xíngchéng yě máfan nǐmen bāng wǒ gǎi dào hòutiān.",null,"BODY1520"],["酒店: 好的，我们联系船公司，确认以后给您发消息。 (Vâng, bên em liên hệ công ty tàu, xác nhận xong nhắn anh.)",null,null,"Jiǔdiàn: hǎo de, wǒmen liánxì chuán gōngsī, quèrèn yǐhòu gěi nín fāxiāoxi.",null,"BODY1521"],["情景对话 5 — Hành lý thất lạc tại sân bay Cam Ranh (Nha Trang)",null,null,"Qíngjǐng duìhuà",null,"BODY1522-C"],["旅客: 你好，我等了半个小时，我的行李一直没出来。 (Chào bạn, tôi chờ nửa tiếng mà hành lý vẫn chưa ra.)",null,null,"Lǚkè: nǐhǎo, wǒ děng le bàngè xiǎoshí, wǒ de xíngli yīzhí méi chūlái.",null,"BODY1523"],["工作人员: 请问您的航班号和行李牌号码是多少？ (Xin cho biết số hiệu chuyến bay và số thẻ hành lý?)",null,null,"Gōngzuòrényuán: qǐngwèn nín de hángbānhào hé xínglipái hàomǎ shì duōshǎo?",null,"BODY1524"],["旅客: 航班是从广州来的CZ3047，行李牌在这儿。 (Chuyến CZ3047 từ Quảng Châu, thẻ hành lý đây.)",null,null,"Lǚkè: hángbān shìcóng Guǎngzhōu lái de CZ3047, xínglipái zài zhèr.",null,"BODY1525"],["工作人员: 我查一下……您的行李在广州转机的时候没有装上飞机。 (Để em kiểm tra… Hành lý của anh/chị chưa được chất lên máy bay khi quá cảnh ở Quảng Châu.)",null,null,"Gōngzuòrényuán: wǒ chá yīxià…… nín de xíngli zài Guǎngzhōu zhuǎnjī de shíhou méiyǒu zhuāng shàng fēijī.",null,"BODY1526"],["旅客: 啊？那什么时候能到？ (Hả? Vậy khi nào về đến?)",null,null,"Lǚkè: a? Nà shénme shíhou néng dào?",null,"BODY1527"],["工作人员: 明天的航班会带过来，我们会直接送到您的酒店。 (Chuyến bay mai sẽ mang sang, bên em giao thẳng đến khách sạn của anh/chị.)",null,null,"Gōngzuòrényuán: míngtiān de hángbān huì dài guòlái, wǒmen huì zhíjiē sòngdào nín de jiǔdiàn.",null,"BODY1528"],["旅客: 可是我的衣服和洗漱用品都在行李里，今晚怎么办？ (Nhưng quần áo, đồ vệ sinh cá nhân đều trong vali, tối nay làm sao?)",null,null,"Lǚkè: kěshì wǒ de yīfu hé xǐshù yòngpǐn dōu zài xíngli lǐ, jīnwǎn zěnmebàn?",null,"BODY1529"],["工作人员: 我们可以给您一个应急包，里面有牙刷、毛巾和T恤。另外您可以先买必需品，保留发票，我们会报销。 (Bên em có túi khẩn cấp gồm bàn chải, khăn, áo phông. Ngoài ra anh/chị có thể mua đồ thiết yếu trước, giữ hóa đơn, bên em hoàn tiền.)",null,null,"Gōngzuòrényuán: wǒmen kěyǐ gěi nín yīgè yìngjí bāo, lǐmiàn yǒu yáshuā, máojīn hé Txù. Lìngwài nín kěyǐ xiānmǎi bìxūpǐn, bǎoliú fāpiào, wǒmen huì bàoxiāo.",null,"BODY1530"],["旅客: 最多可以报销多少？ (Tối đa hoàn được bao nhiêu?)",null,null,"Lǚkè: zuì duō kěyǐ bàoxiāo duōshǎo?",null,"BODY1531"],["工作人员: 每天最多一百五十万盾。 (Mỗi ngày tối đa 1 triệu 500.)",null,null,"Gōngzuòrényuán: měitiān zuì duō yībǎiwǔshíwàn dùn.",null,"BODY1532"],["旅客: 如果明天还找不到呢？ (Nếu mai vẫn không tìm thấy thì sao?)",null,null,"Lǚkè: rúguǒ míngtiān hái zhǎo bùdào ne?",null,"BODY1533"],["工作人员: 超过二十一天没找到的话，按照规定会按重量赔偿。 (Quá 21 ngày không tìm thấy, theo quy định sẽ bồi thường theo trọng lượng.)",null,null,"Gōngzuòrényuán: chāoguò èrshíyītiān méi zhǎodào dehuà, ànzhào guīdìng huì àn zhòngliàng péicháng.",null,"BODY1534"],["旅客: 好的。麻烦给我一份行李丢失登记单，还有你们的联系电话。 (Được. Phiền cho tôi phiếu đăng ký thất lạc hành lý và số điện thoại liên hệ.)",null,null,"Lǚkè: hǎo de. Máfan gěi wǒ yīfèn xíngli diūshī dēngjìdān, háiyǒu nǐmen de liánxìdiànhuà.",null,"BODY1535"],["工作人员: 这是登记单和电话。行李一到，我们第一时间通知您。 (Đây là phiếu và số điện thoại. Hành lý về, bên em báo ngay.)",null,null,"Gōngzuòrényuán: zhè shì dēngjìdān hé diànhuà. Xíngli yī dào, wǒmen dìyī shíjiān tōngzhī nín.",null,"BODY1536"],["情景对话 6 — Đổi vé tàu Hà Nội – Đà Nẵng tại ga",null,null,"Qíngjǐng duìhuà",null,"BODY1537-C"],["旅客: 你好，我想改签一下火车票，原来是明天晚上七点的SE1次。 (Chào bạn, tôi muốn đổi vé tàu, vé cũ là tàu SE1 7h tối mai.)",null,null,"Lǚkè: nǐhǎo, wǒ xiǎng gǎiqiān yīxià huǒchēpiào, yuánlái shì míngtiān wǎnshàng qīdiǎn de SE1 cì.",null,"BODY1538"],["售票员: 您想改到什么时候？ (Anh/chị muốn đổi sang khi nào?)",null,null,"Shòupiàoyuán: nín xiǎng gǎi dào shénme shíhou?",null,"BODY1539"],["旅客: 改到后天晚上同一个时间，还是去岘港，四人软卧。 (Sang tối ngày kia cùng giờ, vẫn đi Đà Nẵng, giường nằm khoang 4.)",null,null,"Lǚkè: gǎi dào hòutiān wǎnshàng tóngyīgè shíjiān, háishì qù Xiàngǎng, sì rén ruǎnwò.",null,"BODY1540"],["售票员: 后天的四人软卧只剩上铺了，可以吗？ (Giường khoang 4 ngày kia chỉ còn tầng trên, được không?)",null,null,"Shòupiàoyuán: hòutiān de sì rén ruǎnwò zhǐ shèng shàngpù le, kěyǐ ma?",null,"BODY1541"],["旅客: 两张上铺也可以。改签要手续费吗？ (2 giường tầng trên cũng được. Đổi vé có mất phí không?)",null,null,"Lǚkè: liǎngzhāng shàngpù yě kěyǐ. Gǎiqiān yào shǒuxùfèi ma?",null,"BODY1542"],["售票员: 提前二十四小时以上改签，每张收两万盾手续费。 (Đổi trước 24h trở lên, mỗi vé phí 20 nghìn.)",null,null,"Shòupiàoyuán: tíqián èrshísì xiǎoshí yǐshàng gǎiqiān, měizhāng shōu liǎngwàn dùn shǒuxùfèi.",null,"BODY1543"],["旅客: 好的。火车上有餐车吗？ (Được. Trên tàu có toa ăn không?)",null,null,"Lǚkè: hǎo de. Huǒchē shàng yǒu cānchē ma?",null,"BODY1544"],["售票员: 有，也可以订盒饭。到岘港大概要十六个小时。 (Có, cũng có thể đặt cơm hộp. Đến Đà Nẵng khoảng 16 tiếng.)",null,null,"Shòupiàoyuán: yǒu, yě kěyǐ dìng héfàn. Dào Xiàngǎng dàgài yào shíliùgè xiǎoshí.",null,"BODY1545"],["旅客: 听说路上会经过海云岭，风景很美？ (Nghe nói trên đường qua đèo Hải Vân, cảnh rất đẹp?)",null,null,"Lǚkè: tīngshuō lùshàng huì jīngguò Hǎiyún Lǐng, fēngjǐng hěn měi?",null,"BODY1546"],["售票员: 对，第二天早上快到岘港的时候，靠海的那边能看到海。 (Đúng, sáng hôm sau gần đến Đà Nẵng, phía sát biển nhìn ra biển được.)",null,null,"Shòupiàoyuán: duì, dì'èrtiān zǎoshang kuài dào Xiàngǎng de shíhou, kàohǎi de nàbiān néng kàndào hǎi.",null,"BODY1547"],["旅客: 太好了。这是我原来的票和身份证。 (Tuyệt quá. Đây là vé cũ và CCCD của tôi.)",null,null,"Lǚkè: tàihǎole. Zhè shì wǒ yuánlái de piào hé shēnfènzhèng.",null,"BODY1548"],["售票员: 改好了，这是新票，请核对一下日期和车厢号。 (Đổi xong, đây là vé mới, xin kiểm tra ngày và số toa.)",null,null,"Shòupiàoyuán: gǎi hǎo le, zhè shì xīn piào, qǐng héduì yīxià rìqī hé chēxiāng hào.",null,"BODY1549"],["情景对话 7 — (HSK5) Chuyến bay trễ 6 tiếng: thương lượng bồi thường",null,null,"Qíngjǐng duìhuà",null,"BODY1550-C"],["旅客: 你好，我们的航班已经延误六个小时了，到现在也没有人跟我们解释原因。 (Chào bạn, chuyến bay đã trễ 6 tiếng, đến giờ không ai giải thích lý do.)",null,null,"Lǚkè: nǐhǎo, wǒmen de hángbān yǐjīng yánwù liùgè xiǎoshí le, dào xiànzài yě méiyǒu rén gēn wǒmen jiěshì yuányīn.",null,"BODY1551"],["地勤: 非常抱歉，飞机出现了机械故障，正在维修。 (Rất xin lỗi, máy bay gặp sự cố kỹ thuật, đang sửa chữa.)",null,null,"Dìqín: fēicháng bàoqiàn, fēijī chūxiàn le jīxiègùzhàng, zhèngzài wéixiū.",null,"BODY1552"],["旅客: 机械故障是航空公司的原因，不是天气原因吧？ (Sự cố kỹ thuật là lỗi của hãng, không phải do thời tiết đúng không?)",null,null,"Lǚkè: jīxiègùzhàng shì hángkōnggōngsī de yuányīn, bùshì tiānqì yuányīn ba?",null,"BODY1553"],["地勤: 是的。 (Đúng ạ.)",null,null,"Dìqín: shì de.",null,"BODY1554"],["旅客: 按照规定，因为航空公司原因延误超过四个小时，应该提供餐食和经济补偿。可是我们只拿到了一瓶水。 (Theo quy định, trễ trên 4 tiếng do hãng phải cung cấp bữa ăn và bồi thường. Nhưng chúng tôi chỉ nhận được một chai nước.)",null,null,"Lǚkè: ànzhào guīdìng, yīnwèi hángkōnggōngsī yuányīn yánwù chāoguò sìgè xiǎoshí, yīnggāi tígōng cānshí hé jīngjì bǔcháng. Kěshì wǒmen zhǐ nádào le yīpíng shuǐ.",null,"BODY1555"],["地勤: 我马上给大家安排晚餐券，可以在二楼餐厅用。 (Em sắp xếp ngay phiếu ăn tối cho mọi người, dùng ở nhà hàng tầng 2.)",null,null,"Dìqín: wǒ mǎshàng gěi dàjiā ānpái wǎncān quàn, kěyǐ zài èrlóu cāntīng yòng.",null,"BODY1556"],["旅客: 谢谢。那飞机什么时候能起飞？ (Cảm ơn. Vậy khi nào máy bay cất cánh được?)",null,null,"Lǚkè: xièxie. Nà fēijī shénme shíhou néng qǐfēi?",null,"BODY1557"],["地勤: 现在还不确定，最晚可能要到明天早上。 (Hiện chưa chắc, muộn nhất có thể đến sáng mai.)",null,null,"Dìqín: xiànzài hái bù quèdìng, zuì wǎn kěnéng yào dào míngtiān zǎoshang.",null,"BODY1558"],["旅客: 如果要到明天的话，你们必须安排酒店和接送。 (Nếu đến mai thì các bạn phải bố trí khách sạn và đưa đón.)",null,null,"Lǚkè: rúguǒ yào dào míngtiān dehuà, nǐmen bìxū ānpái jiǔdiàn hé jiēsòng.",null,"BODY1559"],["地勤: 是的，如果十二点前还不能起飞，我们会安排酒店。 (Vâng, nếu trước 12h đêm chưa cất cánh được, bên em sẽ bố trí khách sạn.)",null,null,"Dìqín: shì de, rúguǒ shí'èrdiǎn qián hái bùnéng qǐfēi, wǒmen huì ānpái jiǔdiàn.",null,"BODY1560"],["旅客: 另外，我明天上午十点在芽庄有一个很重要的合同要签，这次延误已经造成了损失。赔偿标准是多少？ (Ngoài ra, 10h sáng mai tôi có hợp đồng rất quan trọng phải ký ở Nha Trang, lần trễ này đã gây thiệt hại. Mức bồi thường là bao nhiêu?)",null,null,"Lǚkè: lìngwài, wǒ míngtiān shàngwǔ shídiǎn zài Yázhuāng yǒu yīgè hěn zhòngyào de hétong yào qiān, zhècì yánwù yǐjīng zàochéng le sǔnshī. Péichángbiāozhǔn shì duōshǎo?",null,"BODY1561"],["地勤: 延误超过四个小时，每位旅客赔偿四十万盾，或者一张八十万盾的代金券。 (Trễ trên 4 tiếng, mỗi hành khách bồi thường 400 nghìn, hoặc voucher 800 nghìn.)",null,null,"Dìqín: yánwù chāoguò sìgè xiǎoshí, měiwèi lǚkè péicháng sìshíwàn dùn, huòzhě yīzhāng bāshíwàn dùn de dàijīnquàn.",null,"BODY1562"],["旅客: 我可以接受代金券，但前提是你们帮我改签到今晚别的航空公司最早的航班。 (Tôi chấp nhận voucher, nhưng với điều kiện các bạn đổi giúp tôi sang chuyến sớm nhất tối nay của hãng khác.)",null,null,"Lǚkè: wǒ kěyǐ jiēshòu dàijīnquàn, dàn qiántí shì nǐmen bāng wǒ gǎiqiān dào jīnwǎn biéde hángkōnggōngsī zuìzǎo de hángbān.",null,"BODY1563"],["地勤: 这个我需要请示一下值班经理。 (Việc này em phải xin ý kiến quản lý ca trực.)",null,null,"Dìqín: zhège wǒ xūyào qǐngshì yīxià zhíbān jīnglǐ.",null,"BODY1564"],["值班经理: 先生，我们查了，今晚十一点有一班越捷的航班还有座位，我们可以免费帮您转签。 (Thưa anh, bên tôi kiểm tra rồi, 11h tối nay chuyến Vietjet còn chỗ, có thể chuyển miễn phí cho anh.)",null,null,"Zhíbān jīnglǐ: xiānsheng, wǒmen chá le, jīnwǎn shíyīdiǎn yǒu yībān Yuèjié de hángbān háiyǒu zuòwèi, wǒmen kěyǐ miǎnfèi bāng nín zhuǎn qiān.",null,"BODY1565"],["旅客: 好，那就这样办，代金券也请一起给我。 (Được, cứ thế làm, voucher cũng xin đưa luôn.)",null,null,"Lǚkè: hǎo, nà jiùzhèyàngbàn, dàijīnquàn yě qǐng yīqǐ gěi wǒ.",null,"BODY1566"],["值班经理: 没问题，再次向您道歉，给您带来不便了。 (Không vấn đề, một lần nữa xin lỗi vì sự bất tiện.)",null,null,"Zhíbān jīnglǐ: méi wèntí, zàicì xiàng nín dàoqiàn, gěi nín dàilái bùbiàn le.",null,"BODY1567"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY1568-C"],["1. Hỏi: 请你给中国朋友介绍一下你的家乡或者你最喜欢的城市。 (Giới thiệu quê bạn hoặc thành phố bạn thích nhất cho bạn TQ.)",null,null,"Qǐng nǐ gěi Zhōngguó péngyou jièshào yīxià nǐ de jiāxiāng huòzhě nǐ zuì xǐhuan de chéngshì.",null,"BODY1569"],["Đáp: 我最喜欢会安。会安古镇以灯笼和老房子出名，晚上河上有很多放花灯的人。你可以穿越南长衫拍照，还可以做一套量身定做的衣服，一天就能做好。 (Tôi thích Hội An nhất. Phố cổ Hội An nổi tiếng với đèn lồng và nhà cổ, tối trên sông nhiều người thả hoa đăng. Bạn có thể mặc áo dài chụp ảnh, còn may đồ đo ni, một ngày là xong.)",null,null,"Wǒ zuì xǐhuan Huì'ān. Huì'āngǔzhèn yǐ dēnglóng hé lǎofángzi chūmíng, wǎnshàng hé shàng yǒu hěnduō fàng huādēng de rén. Nǐ kěyǐ chuān Yuènán chángshān pāizhào, hái kěyǐ zuòyītào liàngshēndìngzuò de yīfu, yītiān jiù néng zuòhǎo.",null,"BODY1570"],["2. Hỏi: 跟团和自由行，你更喜欢哪个？为什么？ (Đi tour hay tự túc, bạn thích kiểu nào? Vì sao?)",null,null,"Gēn tuán hé zìyóu xíng, nǐ gèng xǐhuan nǎge? Wèishénme?",null,"BODY1571"],["Đáp: 我更喜欢自由行，时间比较自由。不过带父母出去的时候我会跟团，因为不用担心交通和住宿。 (Thích tự túc vì thời gian tự do. Nhưng đưa bố mẹ đi thì đi tour, không phải lo đi lại, chỗ ở.)",null,null,"Wǒ gèng xǐhuan zìyóu xíng, shíjiān bǐjiào zìyóu. Bùguò dài fùmǔ chūqù de shíhou wǒhuì gēn tuán, yīnwèi bùyòng dānxīn jiāotōng hé zhùsù.",null,"BODY1572"],["3. Hỏi: 如果你的行李在国外丢了，你会怎么做？ (Nếu hành lý bị thất lạc ở nước ngoài, bạn sẽ làm gì?)",null,null,"Rúguǒ nǐ de xíngli zài guówài diū le, nǐ huì zěnme zuò?",null,"BODY1573"],["Đáp: 我会先去行李服务台登记，拿到登记单和电话，然后买必需品并保留发票，最后联系保险公司。 (Đến quầy hành lý đăng ký, lấy phiếu và số điện thoại, mua đồ thiết yếu giữ hóa đơn, cuối cùng liên hệ bảo hiểm.)",null,null,"Wǒhuì xiān qù xíngli fúwùtái dēngjì, nádào dēngjìdān hé diànhuà, ránhòu mǎi bìxūpǐn bìng bǎoliú fāpiào, zuìhòu liánxì bǎoxiǎngōngsī.",null,"BODY1574"],["4. Hỏi: (HSK5) 你觉得越南的旅游业还有哪些需要改进的地方？ (Bạn thấy du lịch VN còn điểm nào cần cải thiện?)",null,null,"Nǐ juéde Yuènán de lǚyóuyè háiyǒu nǎxiē xūyào gǎijìn de dìfang?",null,"BODY1575"],["Đáp: 我觉得最大的问题是有些地方对外国游客乱要价，这会影响越南的形象。另外，很多景点的中文标识还不够，可以增加中文导游和中文菜单。 (Vấn đề lớn nhất là có nơi chặt chém khách nước ngoài, ảnh hưởng hình ảnh VN. Ngoài ra nhiều điểm thiếu biển chỉ dẫn tiếng Trung, có thể thêm hướng dẫn viên và thực đơn tiếng Trung.)",null,null,"Wǒ juéde zuìdà de wèntí shì yǒuxiē dìfang duì wàiguóyóukè luàn yàojià, zhè huì yǐngxiǎng Yuènán de xíngxiàng. Lìngwài, hěnduō jǐngdiǎn de Zhōngwén biāoshí hái bùgòu, kěyǐ zēngjiā Zhōngwén dǎoyóu hé Zhōngwén càidān.",null,"BODY1576"],["情景模拟 ROLE-PLAY — Khách sạn ở Đà Nẵng hết phòng dù đã đặt. Vòng 2 (bất ngờ): khách sạn thay thế ở xa và hạng thấp hơn",null,null,"Qíngjǐng mónǐ",null,"BODY1577-C"],["HS: 你好，我预订了两晚的海景房，姓阮，预订号是DN8899。 (Chào bạn, tôi đặt 2 đêm phòng hướng biển, họ Nguyễn, mã DN8899.)",null,null,"Nǐhǎo, wǒ yùdìng le liǎng wǎn de hǎijǐngfáng, xìng ruǎn, yùdìng hào shì DN8899.",null,"BODY1578"],["GV: 不好意思，今天客人太多，海景房已经满了。 (Xin lỗi, hôm nay đông khách quá, phòng hướng biển kín rồi.)",null,null,"Bùhǎoyìsi, jīntiān kèrén tài duō, hǎijǐngfáng yǐjīng mǎn le.",null,"BODY1579"],["HS: 可是我一个月前就预订了，还付了全款，这是确认单。 (Nhưng tôi đặt từ một tháng trước, đã trả đủ tiền, đây là phiếu xác nhận.)",null,null,"Kěshì wǒ yīgèyuè qián jiù yùdìng le, hái fù le quánkuǎn, zhè shì quèrèn dān.",null,"BODY1580"],["GV: 我们可以给您安排一间普通房。 (Bên em có thể xếp cho anh/chị phòng thường.)",null,null,"Wǒmen kěyǐ gěi nín ānpái yījiān pǔtōng fáng.",null,"BODY1581"],["HS: 普通房比海景房便宜多了，那差价怎么算？ (Phòng thường rẻ hơn phòng hướng biển nhiều, vậy tiền chênh tính sao?)",null,null,"Pǔtōng fáng bǐ hǎijǐngfáng piányi duō le, nà chājià zěnme suàn?",null,"BODY1582"],["GV (biến cố): 普通房也没有了，只能安排您去附近的另一家酒店，三星的。 (Phòng thường cũng hết, chỉ có thể xếp anh/chị sang khách sạn khác gần đây, 3 sao.)",null,null,"Pǔtōng fáng yě méiyǒu le, zhǐnéng ānpái nín qù fùjìn de lìngyījiā jiǔdiàn, Sānxīng de.",null,"BODY1583"],["HS: 我订的是五星酒店，换成三星的我不能接受。按照规定，超额预订应该安排同等级的酒店。 (Tôi đặt khách sạn 5 sao, đổi sang 3 sao tôi không chấp nhận. Theo quy định, nhận đặt quá phòng phải bố trí khách sạn cùng hạng.)",null,null,"Wǒ dìng de shì wǔxīng jiǔdiàn, huànchéng Sānxīng de wǒ bùnéng jiēshòu. Ànzhào guīdìng, chāo'é yùdìng yīnggāi ānpái tóng děngjí de jiǔdiàn.",null,"BODY1584"],["GV: 那我问一下我们的姐妹酒店，也是五星的，不过离海边远一点。 (Vậy để em hỏi khách sạn liên kết, cũng 5 sao, nhưng xa biển hơn chút.)",null,null,"Nà wǒ wèn yīxià wǒmen de jiěmèi jiǔdiàn, yě shì wǔxīng de, bùguò lí hǎibiān yuǎn yīdiǎn.",null,"BODY1585"],["HS: 我可以接受，但前提是你们安排车接送，并且退还今晚的房费。 (Tôi chấp nhận, nhưng với điều kiện các bạn bố trí xe đưa đón và hoàn tiền phòng tối nay.)",null,null,"Wǒ kěyǐ jiēshòu, dàn qiántí shì nǐmen ānpái chē jiēsòng, bìngqiě tuìhuán jīnwǎn de fángfèi.",null,"BODY1586"],["GV: 车可以安排，房费我们退一半可以吗？ (Xe sắp xếp được, tiền phòng bên em hoàn một nửa được không?)",null,null,"Chē kěyǐ ānpái, fángfèi wǒmen tuì yībàn kěyǐ ma?",null,"BODY1587"],["HS: 一半可以，另外明天海景房空出来的话，请第一时间帮我换回来。 (Một nửa cũng được, ngoài ra mai phòng hướng biển trống thì đổi lại cho tôi ngay.)",null,null,"Yībàn kěyǐ, lìngwài míngtiān hǎijǐngfáng kòng chūlái dehuà, qǐng dìyī shíjiān bāng wǒ huànhuílái.",null,"BODY1588"],["GV: 没问题，明天中午之前一定帮您安排。 (Không vấn đề, trước trưa mai nhất định sắp xếp cho anh/chị.)",null,null,"Méi wèntí, míngtiān zhōngwǔ zhīqián yīdìng bāng nín ānpái.",null,"BODY1589"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY1590-C"],["✗ 我的航班推迟了三个小时。 (nghe được nhưng chưa chuẩn) → ✓ 我的航班延误了三个小时。",null,null,"Wǒ de hángbān tuīchí le sāngè xiǎoshí. | Wǒ de hángbān yánwù le sāngè xiǎoshí.",null,"BODY1591"],["✗ 我想改变机票。 → ✓ 我想改签机票。/ 我想改一下机票。",null,null,"Wǒ xiǎng gǎibiàn jīpiào. | Wǒ xiǎng gǎiqiān jīpiào. / | Wǒ xiǎng gǎi yīxià jīpiào.",null,"BODY1592"],["✗ 我订房间了在网上。 → ✓ 我在网上订了房间。",null,null,"Wǒ dìngfángjiān le zài wǎngshàng. | Wǒ zài wǎngshàng dìng le fángjiān.",null,"BODY1593"],["✗ 下龙湾很有名为岛屿。 → ✓ 下龙湾以岛屿出名。/ 下龙湾的岛屿很有名。",null,null,"Xiàlóng Wān hěn yǒu míngwéi dǎoyǔ. | Xiàlóng Wān yǐ dǎoyǔ chūmíng. / | Xiàlóng Wān de dǎoyǔ hěn yǒumíng.",null,"BODY1594"],["✗ 我的行李丢了在机场。 → ✓ 我的行李在机场丢了。",null,null,"Wǒ de xíngli diū le zài jīchǎng. | Wǒ de xíngli zài jīchǎng diū le.",null,"BODY1595"],["✗ 你们要赔偿给我。 → ✓ 你们应该给我赔偿。/ 你们应该赔偿我的损失。",null,null,"Nǐmen yào péicháng gěi wǒ. | Nǐmen yīnggāi gěi wǒ péicháng. / | Nǐmen yīnggāi péicháng wǒ de sǔnshī.",null,"BODY1596"],["Tên địa danh: 河内 Hà Nội, 下龙湾 Vịnh Hạ Long, 广宁 Quảng Ninh, 岘港 Đà Nẵng, 会安 Hội An, 巴拿山 Bà Nà, 芽庄 Nha Trang, 金兰机场 sân bay Cam Ranh, 大叻 Đà Lạt, 胡志明市 TP.HCM.",null,null,"Hénèi | Xiàlóng Wān | Guǎngníng | Xiàngǎng | Huì'ān | Bāná Shān | Yázhuāng | Jīnlán Jīchǎng | Dàlè | Húzhìmíng Shì",null,"BODY1597"],["Phát âm: 改签 gǎiqiān; 延误 yánwù; 赔偿 péicháng; 押金 yājīn; 岘港 Xiàngǎng.",null,null,"Gǎiqiān | Yánwù | Péicháng | Yājīn | Xiàngǎng",null,"BODY1598"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY1599-C"],["(1) Ghi âm giới thiệu 1 trong 4 điểm đến (Hà Nội / Hạ Long / Đà Nẵng – Hội An / Nha Trang) cho bạn TQ, 2 phút: nổi tiếng về gì → đi thế nào → chơi gì → ăn gì → lưu ý.",null,null,null,null,"BODY1600"],["(2) Ghi âm sự cố và phương án giải quyết 2 phút (chuyến bay hủy / mất hành lý / khách sạn hết phòng).",null,null,null,null,"BODY1601"],["HSK5: phần sự cố phải có thương lượng bồi thường với điều kiện 我可以接受……但前提是…….",null,null,"Wǒ kěyǐ jiēshòu…… dàn qiántí shì…… .",null,"BODY1602"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY1603"],["Buổi 09 — 人际关系与社交 Quan hệ xã hội",null,null,"Rénjìguānxi yǔ shèjiāo",null,"BODY1604-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY1605-C"],["HSK4: Kể chuyện bạn bè, đồng nghiệp; mời mọc, hỏi thăm, giữ quan hệ. HSK5: Giải quyết mâu thuẫn và giữ ranh giới trong công việc.",null,null,null,null,"BODY1606"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY1608-C"],["1. Hỏi: 你在公司跟谁关系最好？为什么？ (Ở công ty bạn thân với ai nhất? Vì sao?)",null,null,"Nǐ zài gōngsī gēn shuí guānxi zuìhǎo? Wèishénme?",null,"BODY1609"],["Đáp: 我跟坐我旁边的阿玲关系最好，我们是同一年入职的，经常一起吃午饭，有什么事都互相帮忙。 (Tôi thân nhất với A Linh ngồi cạnh, cùng năm vào làm, hay ăn trưa cùng, có việc gì đều giúp nhau.)",null,null,"Wǒ gēn zuò wǒ pángbiān de Ā Líng guānxi zuìhǎo, wǒmen shì tóngyī nián rùzhí de, jīngcháng yīqǐ chī wǔfàn, yǒu shénme shì dōu hùxiāng bāngmáng.",null,"BODY1610"],["2. Hỏi: 你最好的朋友是怎么认识的？ (Bạn thân nhất của bạn quen thế nào?)",null,null,"Nǐ zuìhǎo de péngyou shì zěnme rènshi de?",null,"BODY1611"],["Đáp: 我们是大学室友，住在一起四年，毕业以后虽然不在一个城市，但是每年都会见面。 (Bọn tôi là bạn cùng phòng đại học, ở cùng 4 năm, ra trường tuy không cùng thành phố nhưng năm nào cũng gặp.)",null,null,"Wǒmen shì dàxué shìyǒu, zhùzàiyīqǐ sìnián, bìyè yǐhòu suīrán bù zài yīgè chéngshì, dànshì měinián dōu huì jiànmiàn.",null,"BODY1612"],["3. Hỏi: 你跟同事吵过架吗？ (Bạn từng cãi nhau với đồng nghiệp chưa?)",null,null,"Nǐ gēn tóngshì chǎoguò jià ma?",null,"BODY1613"],["Đáp: 没有大吵过，不过有过误会。后来我们坐下来好好聊了一次，就没事了。 (Chưa cãi to, nhưng từng có hiểu lầm. Sau ngồi nói chuyện đàng hoàng một lần là ổn.)",null,null,"Méiyǒu dà chǎoguò, bùguò yǒu guò wùhuì. Hòulái wǒmen zuòxià lái hǎohǎo liáo le yīcì, jiù méishì le.",null,"BODY1614"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY1615-C"],["1. 相处 (chung sống, cư xử với nhau): 我跟新同事相处得很好。/ 他这个人很好相处。 (Tôi hòa hợp với đồng nghiệp mới. / Người này rất dễ chơi.)",null,null,"Xiāngchǔ | Wǒ gēn xīn tóngshì xiāngchǔ de hěn hǎo. / | Tā zhège rén hěn hǎo xiāngchǔ.",null,"BODY1616"],["2. 误会 (hiểu lầm): 你误会我了，我不是那个意思。 (Bạn hiểu lầm tôi rồi, tôi không có ý đó.)",null,null,"Wùhuì | Nǐ wùhuì wǒ le, wǒ bùshì nàge yìsi.",null,"BODY1617"],["3. 信任 (tin tưởng): 经理很信任他，重要的客户都交给他。 (Giám đốc rất tin anh ấy, khách quan trọng đều giao cho anh ấy.)",null,null,"Xìnrèn | Jīnglǐ hěn xìnrèn tā, zhòngyào de kèhù dōu jiāogěi tā.",null,"BODY1618"],["4. 尊重 (tôn trọng): 不管意见一不一样，都要互相尊重。 (Dù ý kiến khác nhau cũng phải tôn trọng nhau.)",null,null,"Zūnzhòng | Bùguǎn yìjiàn yī bù yīyàng, dōu yào hùxiāng zūnzhòng.",null,"BODY1619"],["5. 合得来 / 合不来 (hợp / không hợp tính): 我们俩性格很合得来。 (Hai chúng tôi rất hợp tính.)",null,null,"Hédelái | Hébùlái | Wǒmen liǎ xìnggé hěn hédelái.",null,"BODY1620"],["6. 化解误会 (hóa giải hiểu lầm): 一顿饭就把误会化解了。 (Một bữa cơm đã hóa giải hiểu lầm.)",null,null,"Huàjiě wùhuì | Yīdùnfàn jiù bǎ wùhuì huàjiě le.",null,"BODY1621"],["7. 聚会 (tụ tập, họp mặt): 周末我们大学同学有个聚会。 (Cuối tuần lớp đại học có buổi họp mặt.)",null,null,"Jùhuì | Zhōumò wǒmen dàxué tóngxué yǒu gè jùhuì.",null,"BODY1622"],["8. 联系 / 保持联系 (liên lạc / giữ liên lạc): 毕业以后我们一直保持联系。 (Ra trường chúng tôi vẫn giữ liên lạc.)",null,null,"Liánxì | Bǎochíliánxì | Bìyè yǐhòu wǒmen yīzhí bǎochíliánxì.",null,"BODY1623"],["9. 帮忙 / 帮个忙 (giúp đỡ / giúp một tay): 你能帮我个忙吗？ (Bạn giúp tôi một tay được không?)",null,null,"Bāngmáng | Bāng gè máng | Nǐ néng bāng wǒ gè máng ma?",null,"BODY1624"],["
