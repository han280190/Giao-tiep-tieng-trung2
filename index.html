<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máy chiếu bài giảng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Serif+JP:wght@500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s)"></script>
<style>
/* Layout: a lesson library (grid of seal-stamped lesson cards) that opens into a classroom deck — one section per screen, header band with sticker, content scrolls inside the stage */
:root{
  --paper:#f4f6f2; --card:#ffffff; --ink:#1c2328; --muted:#5b6866; --line:#d9dfd9;
  --seal:#b5322a; --seal-soft:#f8e5e1; --jade:#2a7660; --jade-soft:#e0efe8;
  --gold:#a8771f; --gold-soft:#f6ecd6; --shadow:0 1px 2px rgba(28,35,40,.06),0 6px 18px rgba(28,35,40,.07);
  --f-zh:"Noto Serif SC","Noto Serif JP","Songti SC","SimSun",serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-py:"Noto Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111615; --card:#1a2120; --ink:#e8ece9; --muted:#9daaa6; --line:#2b3432;
  --seal:#e46d60; --seal-soft:#3a2020; --jade:#5fc2a1; --jade-soft:#18332b;
  --gold:#ddb05a; --gold-soft:#352a14; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111615; --card:#1a2120; --ink:#e8ece9; --muted:#9daaa6; --line:#2b3432;
  --seal:#e46d60; --seal-soft:#3a2020; --jade:#5fc2a1; --jade-soft:#18332b;
  --gold:#ddb05a; --gold-soft:#352a14; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
body.lang-ja{--f-zh:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
body.lang-en{--f-zh:var(--f-body)}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px;border-radius:6px}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.seal{flex:none;width:38px;height:38px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--f-zh);font-weight:900;font-size:15px;line-height:1;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);border:0}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbtn .zhk{font-family:var(--f-zh);font-weight:700}
.timer{font-variant-numeric:tabular-nums}
.timer.run{border-color:var(--jade);color:var(--jade)}
.timer.done{background:var(--seal);border-color:var(--seal);color:#fff}

.stage{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.slide{max-width:1120px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.slide.in{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.slide.in{animation:none}.flip-inner{transition:none!important}.stage{scroll-behavior:auto}}

.head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--seal);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .min{color:var(--muted);letter-spacing:.04em;text-transform:none;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.h-zh{font-family:var(--f-zh);font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.15;margin:6px 0 0;text-wrap:balance}
.h-py{font-family:var(--f-py);font-style:italic;color:var(--muted);font-size:15px;margin-top:2px}
.h-vi{font-size:clamp(18px,2.4vw,24px);font-weight:600;margin-top:6px;text-wrap:balance}
.lead{color:var(--muted);max-width:72ch;margin:6px 0 0}
.sticker{font-size:44px;line-height:1;width:84px;height:84px;display:grid;place-items:center;background:var(--card);border-radius:50%;box-shadow:var(--shadow);border:3px solid var(--card);outline:1px dashed var(--line);outline-offset:4px;transform:rotate(8deg);user-select:none}

.zl{display:flex;flex-direction:column;gap:2px;min-width:0}
.zh{font-family:var(--f-zh);font-weight:500;font-size:clamp(19px,2.2vw,24px);line-height:1.6;display:flex;gap:8px;align-items:flex-start}
.zh .t{flex:1;min-width:0;overflow-wrap:anywhere}
.py{font-family:var(--f-py);font-style:italic;color:var(--jade);font-size:14.5px;line-height:1.5}
.vi{color:var(--muted);font-size:15px}
body.no-py .py{display:none}
body.no-vi .vi{display:none}
.say{flex:none;border:1px solid var(--line);background:var(--card);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:14px;margin-top:3px}
.say:hover{border-color:var(--jade)}
.say.on{background:var(--jade);color:#fff;border-color:var(--jade)}
.blank{color:var(--seal);font-weight:700;letter-spacing:-.1em}
mark{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--gold)}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:6px;padding:2px 8px;background:var(--jade-soft);color:var(--jade)}
.tag.h5{background:var(--gold-soft);color:var(--gold)}
.tag.red{background:var(--seal-soft);color:var(--seal)}
h3.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px 16px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow span.st{background:var(--jade-soft);border-radius:999px;padding:4px 12px;font-size:14px}
.flow span.ar{color:var(--muted)}

/* cover */
.cover{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-block:12px}
.bigseal{width:150px;height:150px;border-radius:14px;background:var(--seal);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-5deg);box-shadow:inset 0 0 0 5px rgba(255,255,255,.28),var(--shadow);font-family:var(--f-zh)}
.bigseal .n{font-size:58px;font-weight:900;line-height:1}
.bigseal .k{font-size:15px;letter-spacing:.2em;margin-top:6px;font-weight:700}
.cover h1{font-family:var(--f-zh);font-weight:900;font-size:clamp(36px,7vw,78px);line-height:1.08;margin:0;text-wrap:balance}
.cover .py{font-size:18px}
.cover .vi-t{font-size:clamp(20px,3vw,30px);font-weight:700;margin-top:8px}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.scene{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;transition:transform .15s,border-color .15s}
.scene:hover{transform:translateY(-2px);border-color:var(--seal)}
.scene .em{font-size:34px;line-height:1}
.scene b{display:block;font-size:15px}
.scene small{color:var(--muted);font-size:13px}
.howto{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.howto kbd{font-family:var(--f-py);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--card);color:var(--ink);font-size:12px}

/* goals */
.goal{display:flex;gap:16px;align-items:flex-start}
.goal .lv{font-family:var(--f-zh);font-weight:900;font-size:28px;color:var(--jade);line-height:1;white-space:nowrap}
.goal.h5 .lv{color:var(--gold)}
.goal p{margin:6px 0 0;font-size:17px}
.tl{display:flex;width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:92px}
.seg{border:0;border-right:1px solid var(--paper);padding:10px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0;background:var(--c);color:var(--ink)}
.seg:last-child{border-right:0}
.seg:hover{filter:brightness(.96)}
.seg b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.seg span{font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.tl-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;margin-top:6px}
@media (max-width:720px){.tl{flex-direction:column;min-height:0}.seg{flex:none!important;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--paper)}.seg b{width:44px}}

/* QA */
.qa{display:flex;flex-direction:column;gap:12px}
.qa .qnum{font-family:var(--f-zh);font-weight:900;color:var(--seal);font-size:22px;line-height:1;flex:none}
.qa .top{display:flex;gap:12px}
.ans{border-top:1px dashed var(--line);padding-top:12px;display:flex;gap:12px}
.ans .lab{flex:none;font-size:12px;font-weight:700;color:var(--jade);letter-spacing:.06em;padding-top:8px}
.ans.hid .zl{filter:blur(7px);user-select:none;pointer-events:none}
.ans .zh{font-size:clamp(17px,1.9vw,20px)}
.picked{outline:3px solid var(--seal);outline-offset:3px}
.fu{display:flex;gap:8px;flex-wrap:wrap}
.fu span{font-family:var(--f-zh);font-weight:700;background:var(--seal-soft);color:var(--seal);border-radius:999px;padding:4px 12px;font-size:16px}

/* vocab flip */
.flip{perspective:1200px;min-height:236px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;min-height:236px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--jade-soft);border-color:transparent}
.face .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.face .w{font-family:var(--f-zh);font-weight:900;font-size:clamp(28px,3.4vw,36px);line-height:1.2;margin-top:auto;overflow-wrap:anywhere}
.face .w.long{font-size:clamp(20px,2.2vw,24px)}
.face .m{font-size:15px;font-weight:500}
.face .hint{font-size:12px;color:var(--muted);margin-top:auto}
.face.back .zh{font-size:18px}

/* patterns */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
.pat{display:grid;grid-template-columns:48px 1fr;gap:14px}
.pat .pn{font-family:var(--f-zh);font-weight:900;font-size:30px;color:var(--line);line-height:1}
.pat .pz{font-family:var(--f-zh);font-weight:700;font-size:clamp(20px,2.4vw,26px);line-height:1.4;overflow-wrap:anywhere}
.exs{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-left:14px;border-left:2px solid var(--jade-soft)}
.exs .zh{font-size:clamp(17px,1.9vw,20px)}

/* dialogue */
.cast{display:flex;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px}
.who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--paper)}
.who small{color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:14px}
.line{display:flex;gap:10px;align-items:flex-end;max-width:min(860px,100%)}
.line.r{flex-direction:row-reverse;align-self:flex-end}
.line .av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--card);border:1px solid var(--line)}
.line .stk{flex:none;width:40px;height:52px;color:var(--ink);opacity:.85;margin-bottom:-2px}
.line .stk svg{display:block;width:100%;height:100%;overflow:visible}
.line .stk .ac{color:var(--seal)}
/* stick-figure animation: every part turns around its own joint (SVG user units) */
.stk *{transform-box:view-box}
.stk .all{transform-origin:20px 47px;animation:stk-sway 3.2s ease-in-out infinite var(--d)}
.stk .up{transform-origin:20px 35px}
.stk .hd{transform-origin:20px 19px}
.stk .aL{transform-origin:15px 23px}.stk .aR{transform-origin:25px 23px}
.stk .lL{transform-origin:17.5px 35.5px}.stk .lR{transform-origin:22.5px 35.5px}
.stk .eye{transform-origin:20px 10px;animation:stk-blink 4.2s infinite var(--d)}
.stk .mo{transform-origin:20px 14px}
.stk .qm{animation:stk-hop 1.2s ease-in-out infinite var(--d)}
.p-stand .hd{animation:stk-nod 3.2s ease-in-out infinite var(--d)}
.p-talk .aR{animation:stk-talk 1.1s ease-in-out infinite alternate var(--d)}
.p-talk .hd{animation:stk-nod 2.2s ease-in-out infinite var(--d)}
.p-wave .aR{animation:stk-wave .45s ease-in-out infinite alternate}
.p-wave .all{animation:stk-sway 1.6s ease-in-out infinite var(--d)}
.p-ask .hd{animation:stk-tilt 1.8s ease-in-out infinite alternate var(--d)}
.p-thanks .up{animation:stk-bow 2.4s ease-in-out infinite var(--d)}
.p-happy .all{animation:stk-jump .7s cubic-bezier(.3,0,.5,1) infinite alternate}
.p-happy .aL{animation:stk-armL .35s ease-in-out infinite alternate}
.p-happy .aR{animation:stk-armR .35s ease-in-out infinite alternate}
.p-happy .lL{animation:stk-armR .7s ease-in-out infinite alternate}.p-happy .lR{animation:stk-armL .7s ease-in-out infinite alternate}
.p-point .aR{animation:stk-point 1s ease-in-out infinite alternate var(--d)}
/* while this line is being read aloud the mouth moves */
.line:has(.say.on) .stk .mo{animation:stk-mouth .22s ease-in-out infinite alternate}
.line:has(.say.on) .stk .all{animation-duration:1.2s}
@keyframes stk-sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes stk-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes stk-nod{0%,100%{transform:rotate(0)}30%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}}
@keyframes stk-talk{from{transform:rotate(18deg)}to{transform:rotate(-22deg)}}
@keyframes stk-wave{from{transform:rotate(-14deg)}to{transform:rotate(22deg)}}
@keyframes stk-tilt{from{transform:rotate(-9deg)}to{transform:rotate(7deg)}}
@keyframes stk-bow{0%,25%,100%{transform:rotate(0)}50%,70%{transform:rotate(22deg)}}
@keyframes stk-jump{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes stk-armL{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
@keyframes stk-armR{from{transform:rotate(0)}to{transform:rotate(14deg)}}
@keyframes stk-point{from{transform:rotate(0)}to{transform:rotate(-12deg)}}
@keyframes stk-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes stk-mouth{from{transform:scale(1,1)}to{transform:scale(1.15,2.2)}}
@media (prefers-reduced-motion:reduce){.stk *{animation:none!important}}

.bub{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;box-shadow:var(--shadow)}
.line.r .bub{border-radius:16px 16px 4px 16px;background:var(--jade-soft);border-color:transparent}
.line.c3 .bub{background:var(--gold-soft);border-color:transparent}
.bub .sp{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.line.masked .bub .zl{filter:blur(8px);user-select:none}
.line.masked .bub{cursor:pointer}
.line.masked .bub::after{content:"Bấm để xem";display:block;font-size:12px;color:var(--seal);font-weight:600;margin-top:2px}
.chat .nar{align-self:center;color:var(--muted);font-size:14px;font-style:italic;text-align:center;max-width:70ch}
.seg-ctl{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg-ctl button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:500;border-right:1px solid var(--line)}
.seg-ctl button:last-child{border-right:0}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
[data-playall].on{background:var(--jade);color:#fff;border-color:var(--jade)}

/* speech */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.step{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.step .em{font-size:28px}
.step b{display:block;font-size:14px}
.step small{color:var(--muted);font-size:12.5px}
.speech .zh{font-size:clamp(20px,2.3vw,25px);line-height:1.9}
.speech .py{font-size:15px;margin-top:10px}

/* twists */
.twist{border:2px dashed var(--seal);background:var(--seal-soft);border-radius:14px;padding:16px;text-align:left;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.twist .cover-t{font-weight:700;color:var(--seal);font-size:16px;display:flex;align-items:center;gap:10px}
.twist .cover-t span{font-size:30px}
.twist.open{border-style:solid;background:var(--card)}

/* fixes */
.fix{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.wrong,.right{display:flex;gap:10px;align-items:baseline}
.wrong .x,.right .x{font-weight:900;font-size:18px;flex:none;width:22px}
.wrong .x{color:var(--seal)}
.right .x{color:var(--jade)}
.wrong .zh{text-decoration:line-through;text-decoration-color:var(--seal);text-decoration-thickness:2px;color:var(--muted);font-size:20px}
.right .zh{font-size:20px;font-weight:700}
.fix.hid .right .zl{filter:blur(7px);user-select:none}
.fix .fnote{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.up{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.up .arrow{font-size:28px;color:var(--gold)}
@media (max-width:720px){.up{grid-template-columns:1fr}.up .arrow{transform:rotate(90deg);justify-self:center}}

/* homework */
.hw{display:flex;flex-direction:column;gap:12px}
.hw label{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-size:16px}

<script>
/* ================= embedded sample (the 10 lessons already provided) ================= */
const SAMPLE = { name: "24 bài tiếng Trung (file 19/10/2026)", rows: [["Giao tiếp tiếng trung",null,null,null,null,"TITLE"],["Buổi 01 — 自我介绍与破冰 Giới thiệu bản thân",null,null,"Zìwǒjièshào yǔ pòbīng",null,"BODY1-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY2-C"],["HSK4: Giới thiệu 90 giây; trả lời 8 câu về cá nhân, công việc, mục tiêu. HSK5: Giới thiệu 3 phút; giải thích lựa chọn nghề nghiệp, kế hoạch và phản biện.",null,null,null,null,"BODY3"],["Phân bổ 90': Warm-up 8' → Từ vựng 12' → Mẫu câu 15' → Hội thoại tình huống 25' → Luyện hỏi đáp 10' → Role-play 12' → Sửa lỗi 6' → Giao bài 2'.",null,null,null,null,"BODY4"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY5-C"],["1. Hỏi: 你第一次跟中国人说中文是什么时候？当时说了什么？ (Lần đầu bạn nói tiếng Trung với người TQ là khi nào? Lúc đó nói gì?)",null,null,"Nǐ dìyīcì gēn Zhōngguórén shuō Zhōngwén shì shénme shíhou? Dāngshí shuō le shénme?",null,"BODY6"],["Đáp: 我第一次跟中国人说中文是在公司的一次会议上。当时我太紧张了，只说了一句\"你好，很高兴认识你\"。 (Lần đầu là trong một cuộc họp ở công ty. Lúc đó tôi quá căng thẳng, chỉ nói được \"Xin chào, rất vui được làm quen\".)",null,null,"Wǒ dìyīcì gēn Zhōngguórén shuō Zhōngwén shì zài gōngsī de yīcì huìyì shàng. Dāngshí wǒ tàijǐnzhāng le, zhǐ shuō le yījù \"nǐhǎo, hěn gāoxìng rènshi nǐ\".",null,"BODY7"],["2. Hỏi: 你平时在工作上用中文做什么？ (Bình thường bạn dùng tiếng Trung làm gì trong công việc?)",null,null,"Nǐ píngshí zài gōngzuò shàng yòng Zhōngwén zuò shénme?",null,"BODY8"],["Đáp: 我平时用中文回复客户的微信，有时候也要打电话跟供应商确认交货时间。 (Tôi thường trả lời WeChat của khách, đôi khi gọi điện xác nhận thời gian giao hàng với nhà cung cấp.)",null,null,"Wǒ píngshí yòng Zhōngwén huífù kèhù de wēi xìn, yǒushíhou yě yào dǎdiànhuà gēn gōngyìngshāng quèrèn jiāohuò shíjiān.",null,"BODY9"],["3. Hỏi: 如果用三个词形容自己，你会选哪三个？为什么？ (Nếu dùng 3 từ miêu tả bản thân, bạn chọn 3 từ nào? Vì sao?)",null,null,"Rúguǒ yòng sāngè cí xíngróng zìjǐ, nǐ huì xuǎn nǎ sāngè? Wèishénme?",null,"BODY10"],["Đáp: 我会选\"认真、耐心、爱笑\"。因为我做事很仔细，跟客户沟通很有耐心，而且同事都说我每天都笑眯眯的。 (Tôi chọn \"nghiêm túc, kiên nhẫn, hay cười\"... đồng nghiệp đều nói ngày nào tôi cũng tươi cười.)",null,null,"Wǒhuì xuǎn \"rènzhēn, nàixīn, ài xiào\". Yīnwèi wǒ zuòshì hěn zǐxì, gēn kèhù gōutōng hěn yǒu nàixīn, érqiě tóngshì dōu shuō wǒ měitiān dōu xiàomīmī de.",null,"BODY11"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY12-C"],["1. 目前 (hiện tại – trang trọng hơn 现在): 我目前在一家物流公司做进出口业务。 (Hiện tôi làm mảng xuất nhập khẩu ở một công ty logistics.)",null,null,"Mùqián | Xiànzài | Wǒ mùqián zài yījiā wùliú gōngsī zuò jìnchūkǒu yèwù.",null,"BODY13"],["2. 负责 (phụ trách): 我主要负责跟中国供应商对接。/ 这个项目由我负责。 (Tôi chủ yếu phụ trách làm việc với NCC Trung Quốc. / Dự án này do tôi phụ trách.)",null,null,"Fùzé | Wǒ zhǔyào fùzé gēn Zhōngguó gōngyìngshāng duìjiē. / | Zhège xiàngmù yóu wǒ fùzé.",null,"BODY14"],["3. 从事 (làm trong lĩnh vực): 我从事销售工作已经五年了。 (Tôi làm sales đã 5 năm.)",null,null,"Cóngshì | Wǒ cóngshì xiāoshòu gōngzuò yǐjīng wǔnián le.",null,"BODY15"],["4. 擅长 (giỏi về, sở trường): 我比较擅长沟通，不太擅长做表格。 (Tôi khá giỏi giao tiếp, không giỏi làm bảng biểu lắm.)",null,null,"Shàncháng | Wǒ bǐjiào shàncháng gōutōng, bù tài shàncháng zuò biǎogé.",null,"BODY16"],["5. 积累经验 (tích lũy kinh nghiệm): 在上一家公司，我积累了很多管理仓库的经验。 (Ở công ty trước tôi tích lũy nhiều kinh nghiệm quản lý kho.)",null,null,"Jīlěi jīngyàn | Zài shàng yījiā gōngsī, wǒ jīlěi le hěnduō guǎnlǐ cāngkù de jīngyàn.",null,"BODY17"],["6. 打交道 (giao thiệp, làm việc với): 我每天都要跟中国客户打交道。 (Ngày nào tôi cũng phải làm việc với khách Trung Quốc.)",null,null,"Dǎjiāodao | Wǒ měitiān dōu yào gēn Zhōngguó kèhù dǎjiāodao.",null,"BODY18"],["7. 毕业于 / 是……毕业的 (tốt nghiệp từ): 我毕业于外贸大学。/ 我是河内百科大学毕业的。 (Tôi tốt nghiệp ĐH Ngoại thương. / Tôi tốt nghiệp ĐH Bách khoa Hà Nội.)",null,null,"Bìyè yú | Shì…… bìyè de | Wǒ bìyè yú Wàimào Dàxué. / | Wǒ shì Hénèi Bǎikē Dàxué bìyè de.",null,"BODY19"],["8. 来自 / 老家在 (đến từ / quê ở): 我来自海防，现在在河内工作。 (Tôi đến từ Hải Phòng, hiện làm việc ở Hà Nội.)",null,null,"Láizì | Lǎojiā zài | Wǒ láizì Hǎifáng, xiànzài zài Hénèi gōngzuò.",null,"BODY20"],["9. 入职 (vào làm): 我是2021年入职的，到现在快四年了。 (Tôi vào làm năm 2021, đến nay gần 4 năm.)",null,null,"Rùzhí | Wǒ shì 2021 nián rùzhí de, dào xiànzài kuài sìnián le.",null,"BODY21"],["10. 担任 (đảm nhiệm chức vụ): 我现在担任采购主管。 (Hiện tôi là trưởng nhóm mua hàng.)",null,null,"Dānrèn | Wǒ xiànzài dānrèn cǎigòu zhǔguǎn.",null,"BODY22"],["11. 叫我……就可以了 (cứ gọi tôi là … là được): 我的越南名字比较难念，叫我小兰就可以了。 (Tên tiếng Việt hơi khó đọc, cứ gọi tôi là Tiểu Lan.)",null,null,"Jiào wǒ…… jiù kěyǐ le | Wǒ de Yuènán míngzi bǐjiào nán niàn, jiào wǒ Xiǎo Lán jiù kěyǐ le.",null,"BODY23"],["12. 请多指教 / 请多关照 (mong được chỉ bảo / giúp đỡ): 我是新来的，以后请大家多多指教。 (Tôi là người mới, mong mọi người chỉ bảo nhiều.)",null,null,"Qǐng duō zhǐjiào | Qǐngduōguānzhào | Wǒ shì xīn lái de, yǐhòu qǐng dàjiā duōduōzhǐjiào.",null,"BODY24"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY25-C"],["1. 我目前在……工作，担任…… (Hiện tôi làm ở…, giữ chức…)",null,null,"Wǒ mùqián zài…… gōngzuò, dānrèn……",null,"BODY26"],["Ví dụ: 我目前在北宁的一家电子厂工作，担任采购专员。 (Hiện tôi làm ở một nhà máy điện tử tại Bắc Ninh, là chuyên viên mua hàng.)",null,null,"Wǒ mùqián zài Běiníng de yījiā diànzichǎng gōngzuò, dānrèn cǎigòu zhuānyuán.",null,"BODY27"],["Ví dụ: 我目前在一家越南银行工作，担任客户经理。 (Hiện tôi làm ở một ngân hàng Việt Nam, là chuyên viên quan hệ khách hàng.)",null,null,"Wǒ mùqián zài yījiā Yuènán yínháng gōngzuò, dānrèn kèhùjīnglǐ.",null,"BODY28"],["2. 我在……行业做了……年，主要负责…… (Tôi làm ngành … được … năm, chủ yếu phụ trách …)",null,null,"Wǒ zài…… hángyè zuò le…… nián, zhǔyào fùzé……",null,"BODY29"],["Ví dụ: 我在物流行业做了六年，主要负责海运进出口。 (Tôi làm logistics 6 năm, chủ yếu phụ trách xuất nhập khẩu đường biển.)",null,null,"Wǒ zài wùliúhángyè zuò le liùnián, zhǔyào fùzé hǎiyùn jìnchūkǒu.",null,"BODY30"],["Ví dụ: 我在服装行业做了三年，主要负责跟工厂确认生产进度。 (Tôi làm ngành may mặc 3 năm, chủ yếu xác nhận tiến độ sản xuất với xưởng.)",null,null,"Wǒ zài fúzhuānghángyè zuò le sānnián, zhǔyào fùzé gēn gōngchǎng quèrèn shēngchǎn jìndù.",null,"BODY31"],["3. 我之所以……，是因为…… (Sở dĩ tôi … là vì …)",null,null,"Wǒ zhīsuǒyǐ……, shìyīnwèi……",null,"BODY32"],["Ví dụ: 我之所以学中文，是因为我们公司百分之八十的客户都是中国人。 (Sở dĩ tôi học tiếng Trung là vì 80% khách của công ty là người TQ.)",null,null,"Wǒ zhīsuǒyǐ xué Zhōngwén, shìyīnwèi wǒmen gōngsī bǎifēnzhībāshí de kèhù dōu shì Zhōngguórén.",null,"BODY33"],["Ví dụ: 我之所以选择做销售，是因为我喜欢跟人打交道。 (Sở dĩ tôi chọn làm sales vì tôi thích giao tiếp với người khác.)",null,null,"Wǒ zhīsuǒyǐ xuǎnzé zuò xiāoshòu, shìyīnwèi wǒ xǐhuan gēn rén dǎjiāodao.",null,"BODY34"],["4. 一开始……，后来…… (Lúc đầu …, về sau …)",null,null,"Yī kāishǐ……, hòulái……",null,"BODY35"],["Ví dụ: 一开始我只是觉得中文好听，后来发现工作上特别有用。 (Lúc đầu chỉ thấy tiếng Trung hay, sau phát hiện rất có ích cho công việc.)",null,null,"Yī kāishǐ wǒ zhǐshì juéde Zhōngwén hǎotīng, hòulái fāxiàn gōngzuò shàng tèbié yǒuyòng.",null,"BODY36"],["Ví dụ: 一开始我在仓库做普通员工，后来慢慢升到了仓库主管。 (Lúc đầu tôi làm nhân viên kho bình thường, sau dần lên được trưởng kho.)",null,null,"Yī kāishǐ wǒ zài cāngkù zuò pǔtōngyuángōng, hòulái mànmàn shēng dào le cāngkù zhǔguǎn.",null,"BODY37"],["5. 除了……以外，我还…… (Ngoài … ra, tôi còn …)",null,null,"Chúle…… yǐwài, wǒ hái……",null,"BODY38"],["Ví dụ: 除了工作以外，我还喜欢踢足球和爬山。 (Ngoài công việc, tôi còn thích đá bóng và leo núi.)",null,null,"Chúle gōngzuò yǐwài, wǒ hái xǐhuan tīzúqiú hé páshān.",null,"BODY39"],["Ví dụ: 除了中文以外，我还会说一点儿日语。 (Ngoài tiếng Trung, tôi còn nói được một chút tiếng Nhật.)",null,null,"Chúle Zhōngwén yǐwài, wǒ hái huì shuō yīdiǎnr Rìyǔ.",null,"BODY40"],["6. 对我来说，最大的困难是…… (Với tôi, khó khăn lớn nhất là …)",null,null,"Duì wǒ láishuō, zuìdà de kùnnán shì……",null,"BODY41"],["Ví dụ: 对我来说，最大的困难是听不懂南方口音。 (Với tôi khó nhất là nghe giọng miền Nam TQ.)",null,null,"Duì wǒ láishuō, zuìdà de kùnnán shì tīngbùdǒng nánfāng kǒuyīn.",null,"BODY42"],["Ví dụ: 对我来说，最大的困难是开会的时候反应不过来。 (Với tôi khó nhất là khi họp phản ứng không kịp.)",null,null,"Duì wǒ láishuō, zuìdà de kùnnán shì kāihuì de shíhou fǎnyìng bù guòlái.",null,"BODY43"],["7. 虽然……，但是…… (Tuy … nhưng …)",null,null,"Suīrán……, dànshì……",null,"BODY44"],["Ví dụ: 虽然我的中文还不太流利，但是我很愿意多说多练。 (Tuy tiếng Trung chưa trôi chảy nhưng tôi rất sẵn lòng nói nhiều luyện nhiều.)",null,null,"Suīrán wǒ de Zhōngwén hái bù tài liúlì, dànshì wǒ hěn yuànyì duō shuō duō liàn.",null,"BODY45"],["Ví dụ: 虽然这份工作压力很大，但是我学到了很多东西。 (Tuy công việc áp lực lớn nhưng tôi học được rất nhiều.)",null,null,"Suīrán zhèfèn gōngzuò yālì hěndà, dànshì wǒ xuédào le hěnduō dōngxi.",null,"BODY46"],["8. 我希望通过……，能…… (Tôi hy vọng thông qua …, có thể …)",null,null,"Wǒ xīwàng tōngguò……, néng……",null,"BODY47"],["Ví dụ: 我希望通过这个课程，能用中文跟客户开会，不用再找翻译。 (Hy vọng qua khóa học này có thể họp với khách bằng tiếng Trung, không cần phiên dịch.)",null,null,"Wǒ xīwàng tōngguò zhège kèchéng, néng yòng Zhōngwén gēn kèhù kāihuì, bùyòng zài zhǎo fānyì.",null,"BODY48"],["Ví dụ: 我希望通过这次面试，能有机会加入贵公司。 (Hy vọng qua buổi phỏng vấn này có cơ hội gia nhập quý công ty.)",null,null,"Wǒ xīwàng tōngguò zhècì miànshì, néng yǒu jīhuì jiārù guì gōngsī.",null,"BODY49"],["9. 如果有机会的话，我想…… (Nếu có cơ hội, tôi muốn …)",null,null,"Rúguǒ yǒu jīhuì dehuà, wǒ xiǎng……",null,"BODY50"],["Ví dụ: 如果有机会的话，我想去中国总公司工作一段时间。 (Nếu có cơ hội tôi muốn sang tổng công ty ở TQ làm một thời gian.)",null,null,"Rúguǒ yǒu jīhuì dehuà, wǒ xiǎng qù Zhōngguó zǒnggōngsī gōngzuò yīduànshíjiān.",null,"BODY51"],["Ví dụ: 如果有机会的话，我想自己带一个团队。 (Nếu có cơ hội tôi muốn tự dẫn dắt một đội.)",null,null,"Rúguǒ yǒu jīhuì dehuà, wǒ xiǎng zìjǐ dài yīgè tuánduì.",null,"BODY52"],["10. (HSK5) 正是因为……，我才…… (Chính vì …, tôi mới …)",null,null,"Zhèngshì yīnwèi……, wǒ cái……",null,"BODY53"],["Ví dụ: 正是因为第一份工作很辛苦，我才学会了怎么处理压力。 (Chính vì công việc đầu tiên vất vả, tôi mới học được cách xử lý áp lực.)",null,null,"Zhèngshì yīnwèi dìyīfèn gōngzuò hěn xīnkǔ, wǒ cái xuéhuì le zěnme chǔlǐ yālì.",null,"BODY54"],["Ví dụ: 正是因为经常跟中国客户打交道，我的中文才进步得这么快。 (Chính vì thường làm việc với khách TQ, tiếng Trung của tôi mới tiến bộ nhanh vậy.)",null,null,"Zhèngshì yīnwèi jīngcháng gēn Zhōngguó kèhù dǎjiāodao, wǒ de Zhōngwén cái jìnbù de zhème kuài.",null,"BODY55"],["11. (HSK5) 与其说……，不如说…… (Nói là … chi bằng nói là …)",null,null,"Yǔqíshuō……, bùrúshuō……",null,"BODY56"],["Ví dụ: 与其说我选择了销售，不如说是销售选择了我。 (Nói tôi chọn nghề sales, chi bằng nói nghề sales đã chọn tôi.)",null,null,"Yǔqíshuō wǒ xuǎnzé le xiāoshòu, bùrúshuōshì xiāoshòu xuǎnzé le wǒ.",null,"BODY57"],["Ví dụ: 与其说这是一份工作，不如说这是一次学习的机会。 (Nói đây là một công việc, chi bằng nói là một cơ hội học hỏi.)",null,null,"Yǔqíshuō zhè shì yīfèn gōngzuò, bùrúshuō zhè shì yīcì xuéxí de jīhuì.",null,"BODY58"],["情景对话 1 — Làm quen ở buổi tiệc / quán cà phê (thân mật, ~5 phút)",null,null,"Qíngjǐng duìhuà",null,"BODY59-C"],["A: 你好！你也是来参加小陈生日聚会的吗？ (Chào bạn! Bạn cũng đến dự sinh nhật Tiểu Trần à?)",null,null,"Nǐhǎo! Nǐ yě shì lái cānjiā Xiǎo Chén shēngrì jùhuì de ma?",null,"BODY60"],["B: 对啊！我是她的同事。我叫王磊，叫我小王就行。你呢？ (Đúng rồi! Mình là đồng nghiệp của cô ấy. Mình tên Vương Lỗi, gọi Tiểu Vương là được. Còn bạn?)",null,null,"Duì a! Wǒ shì tā de tóngshì. Wǒ jiào Wáng Lěi, jiào wǒ Xiǎo Wáng jiù xíng. Nǐ ne?",null,"BODY61"],["A: 我叫阿明，是小陈的大学同学。你是中国人吧？ (Mình là Minh, bạn đại học của Tiểu Trần. Bạn là người TQ nhỉ?)",null,null,"Wǒ jiào Ā Míng, shì Xiǎo Chén de dàxué tóngxué. Nǐ shì Zhōngguórén ba?",null,"BODY62"],["B: 对，我是广西人，来越南工作两年了。 (Đúng, mình người Quảng Tây, sang VN làm việc 2 năm rồi.)",null,null,"Duì, wǒ shì Guǎngxī rén, lái Yuènán gōngzuò liǎngnián le.",null,"BODY63"],["A: 两年了！那你应该很习惯越南的生活了吧？ (2 năm rồi! Chắc bạn quen cuộc sống VN rồi nhỉ?)",null,null,"Liǎngnián le! Nà nǐ yīnggāi hěn xíguàn Yuènán de shēnghuó le ba?",null,"BODY64"],["B: 差不多吧。就是摩托车太多了，到现在我还不太敢过马路。 (Cũng gần quen. Chỉ là xe máy nhiều quá, đến giờ mình vẫn chưa dám qua đường lắm.)",null,null,"Chàbuduō ba. Jiùshì mótuōchē tài duō le, dào xiànzài wǒ hái bù tài gǎn guò mǎlù.",null,"BODY65"],["A: 哈哈，我们越南人也觉得过马路是一门技术。你在哪家公司工作？ (Haha, người Việt bọn mình cũng thấy qua đường là cả một kỹ năng. Bạn làm ở công ty nào?)",null,null,"Hāhā, wǒmen Yuènánrén yě juéde guò mǎlù shì yīmén jìshù. Nǐ zài nǎjiā gōngsī gōngzuò?",null,"BODY66"],["B: 我在一家中国的电子公司做技术员，工厂在北宁。你是做哪一行的？ (Mình làm kỹ thuật viên ở một công ty điện tử TQ, nhà máy ở Bắc Ninh. Bạn làm ngành gì?)",null,null,"Wǒ zài yījiā Zhōngguó de diànzi gōngsī zuò jìshùyuán, gōngchǎng zài Běiníng. Nǐ shì zuò nǎ yīháng de?",null,"BODY67"],["A: 我在一家货代公司做销售，主要负责中国线的客户，所以每天都要说中文。 (Mình làm sales ở công ty giao nhận, phụ trách khách tuyến TQ nên ngày nào cũng nói tiếng Trung.)",null,null,"Wǒ zài yījiā huòdài gōngsī zuò xiāoshòu, zhǔyào fùzé Zhōngguó xiàn de kèhù, suǒyǐ měitiān dōu yàoshuō Zhōngwén.",null,"BODY68"],["B: 怪不得你中文说得这么好！学了多久了？ (Thảo nào bạn nói tiếng Trung giỏi vậy! Học bao lâu rồi?)",null,null,"Guàibude nǐ Zhōngwén shuō de zhème hǎo! Xué le duōjiǔ le?",null,"BODY69"],["A: 哪里哪里，学了三年多，还差得远呢。特别是说快了我就听不懂。 (Đâu có, học hơn 3 năm, còn kém lắm. Nhất là nói nhanh là mình không nghe kịp.)",null,null,"Nǎlǐ nǎlǐ, xué le sānnián duō, hái chàdeyuǎn ne. Tèbié shì shuō kuài le wǒ jiù tīngbùdǒng.",null,"BODY70"],["B: 没关系，你可以多跟我聊天，我说慢一点。 (Không sao, bạn cứ nói chuyện với mình nhiều, mình nói chậm thôi.)",null,null,"Méiguānxi, nǐ kěyǐ duō gēn wǒ liáotiān, wǒ shuō màn yīdiǎn.",null,"BODY71"],["A: 太好了！那你学越南语了吗？ (Hay quá! Thế bạn có học tiếng Việt không?)",null,null,"Tàihǎole! Nà nǐ xué Yuènányǔ le ma?",null,"BODY72"],["B: 学了一点儿，只会说\"xin chào\"、\"cảm ơn\"，还有\"bao nhiêu tiền\"。 (Học chút ít, chỉ biết \"xin chào\", \"cảm ơn\" với \"bao nhiêu tiền\".)",null,null,"Xué le yīdiǎnr, zhǐ huì shuō | \", Háiyǒu\"",null,"BODY73"],["A: 哈哈，最重要的三句你都会了！周末你一般做什么？ (Haha, 3 câu quan trọng nhất bạn biết cả rồi! Cuối tuần bạn thường làm gì?)",null,null,"Hāhā, zuì zhòngyào de sānjù nǐ dōu huì le! Zhōumò nǐ yībān zuò shénme?",null,"BODY74"],["B: 我喜欢到处吃东西，河内的小吃我还没吃够。 (Mình thích đi ăn khắp nơi, đồ ăn vặt Hà Nội mình ăn mãi chưa chán.)",null,null,"Wǒ xǐhuan dàochù chī dōngxi, Hénèi de xiǎochī wǒ hái méi chī gòu.",null,"BODY75"],["A: 那下次我带你去老城区吃烤肉米线，是我们本地人常去的店。 (Lần sau mình dẫn bạn đi phố cổ ăn bún chả, quán người địa phương hay ăn.)",null,null,"Nà xiàcì wǒ dàinǐqù lǎochéngqū chī kǎoròumǐxiàn, shì wǒmen běndìrén cháng qù de diàn.",null,"BODY76"],["B: 好啊！我们加个微信吧，你扫我还是我扫你？ (Được đấy! Kết bạn WeChat nhé, bạn quét mình hay mình quét bạn?)",null,null,"Hǎo a! Wǒmen jiā gè wēi xìn ba, nǐ sǎo wǒ háishì wǒ sǎo nǐ?",null,"BODY77"],["A: 我扫你吧。好了，我发了好友申请，我叫\"阿明-越南\"。 (Mình quét bạn nhé. Xong rồi, mình gửi lời mời rồi, tên mình là \"Minh-Việt Nam\".)",null,null,"Wǒ sǎo nǐ ba. Hǎo le, wǒ fā le hǎoyǒu shēnqǐng, wǒ jiào \"Ā Míng | Yuènán \".",null,"BODY78"],["B: 收到了！很高兴认识你，下次一起去吃！ (Nhận rồi! Rất vui được quen bạn, lần sau cùng đi ăn nhé!)",null,null,"Shōudào le! Hěn gāoxìng rènshi nǐ, xiàcì yīqǐ qù chī!",null,"BODY79"],["情景对话 2 — Phỏng vấn xin việc (trang trọng, ~7 phút)",null,null,"Qíngjǐng duìhuà",null,"BODY80-C"],["面试官: 你好，请坐。先请你简单介绍一下自己吧。 (Chào bạn, mời ngồi. Mời bạn giới thiệu ngắn gọn về bản thân.)",null,null,"Miànshìguān: nǐhǎo, qǐng zuò. Xiān qǐng nǐ jiǎndān jièshào yīxià zìjǐ ba.",null,"BODY81"],["应聘者: 您好！我叫陈文强，今年二十九岁，毕业于外贸大学国际贸易专业。我在物流行业有五年的工作经验，目前在一家货代公司负责中国线的客户。 (Chào anh/chị! Tôi là Trần Văn Cường, 29 tuổi, tốt nghiệp ĐH Ngoại thương chuyên ngành Thương mại quốc tế. Tôi có 5 năm kinh nghiệm logistics, hiện phụ trách khách tuyến TQ ở một công ty giao nhận.)",null,null,"Yìngpìnzhě: nínhǎo! Wǒ jiào Chén Wénqiáng, jīnnián èrshíjiǔsuì, bìyè yú Wàimào Dàxué guójìmàoyì zhuānyè. Wǒ zài wùliúhángyè yǒu wǔnián de gōngzuò jīngyàn, mùqián zài yījiā huòdài gōngsī fùzé Zhōngguó xiàn de kèhù.",null,"BODY82"],["面试官: 你现在主要负责哪些工作？ (Hiện bạn phụ trách những công việc gì?)",null,null,"Miànshìguān: nǐ xiànzài zhǔyào fùzé nǎxiē gōngzuò?",null,"BODY83"],["应聘者: 我主要负责三方面：第一是开发新客户，第二是给客户报价和订舱，第三是跟进货物到港和清关。 (Tôi phụ trách 3 mảng: phát triển khách mới; báo giá và đặt chỗ tàu; theo dõi hàng đến cảng và thông quan.)",null,null,"Yìngpìnzhě: wǒ zhǔyào fùzé sān fāngmiàn: dìyī shì kāifāxīn kèhù, dì'èr shì gěi kèhù bàojià hé dìng cāng, dìsān shì gēnjìn huòwù dào gǎng hé qīng guān.",null,"BODY84"],["面试官: 你为什么想离开现在的公司？ (Vì sao bạn muốn rời công ty hiện tại?)",null,null,"Miànshìguān: nǐ wèishénme xiǎng líkāi xiànzài de gōngsī?",null,"BODY85"],["应聘者: 我在现在的公司学到了很多，但是公司规模比较小，发展空间有限。我希望找一个更大的平台，接触更多的业务。 (Tôi học được nhiều ở công ty hiện tại nhưng quy mô nhỏ, cơ hội phát triển hạn chế. Tôi muốn tìm môi trường lớn hơn, tiếp xúc nhiều nghiệp vụ hơn.)",null,null,"Yìngpìnzhě: wǒ zài xiànzài de gōngsī xuédào le hěnduō, dànshì gōngsī guīmó bǐjiào xiǎo, fāzhǎn kōngjiān yǒuxiàn. Wǒ xīwàng zhǎo yīgè gèng dà de píngtái, jiēchù gèng duō de yèwù.",null,"BODY86"],["面试官: 你为什么选择我们公司？ (Vì sao bạn chọn công ty chúng tôi?)",null,null,"Miànshìguān: nǐ wèishénme xuǎnzé wǒmen gōngsī?",null,"BODY87"],["应聘者: 贵公司是越南最大的中越物流公司之一，跟中国的业务很多。我觉得我的中文和行业经验正好能用上。 (Quý công ty là một trong những công ty logistics Việt–Trung lớn nhất VN, nhiều nghiệp vụ với TQ. Tôi thấy tiếng Trung và kinh nghiệm ngành của tôi vừa hay phát huy được.)",null,null,"Yìngpìnzhě: guì gōngsī shì Yuènán zuìdà de zhōng yuè wùliú gōngsī zhīyī, gēn Zhōngguó de yèwù hěnduō. Wǒ juéde wǒ de Zhōngwén hé hángyè jīngyàn zhènghǎo néng yòng shàng.",null,"BODY88"],["面试官: 你觉得自己最大的优点是什么？ (Bạn thấy ưu điểm lớn nhất của mình là gì?)",null,null,"Miànshìguān: nǐ juéde zìjǐ zuìdà de yōudiǎn shì shénme?",null,"BODY89"],["应聘者: 我最大的优点是责任心强。比如有一次客户的货在海关被扣了，我连续两天跟海关和客户沟通，最后在交期之前把货放出来了。 (Ưu điểm lớn nhất là tinh thần trách nhiệm. Ví dụ có lần hàng khách bị giữ ở hải quan, tôi liên tục 2 ngày trao đổi với hải quan và khách, cuối cùng thông quan trước hạn giao.)",null,null,"Yìngpìnzhě: wǒ zuìdà de yōudiǎn shì zérènxīn qiáng. Bǐrú yǒu yīcì kèhù de huò zài hǎiguān bèikòu le, wǒ liánxù liǎngtiān gēn hǎiguān hé kèhù gōutōng, zuìhòu zài jiāo qī zhīqián bǎ huò fàng chūlái le.",null,"BODY90"],["面试官: 那你的缺点呢？ (Còn nhược điểm?)",null,null,"Miànshìguān: nà nǐ de quēdiǎn ne?",null,"BODY91"],["应聘者: 我有时候太追求细节，做事比较慢。现在我在学习先抓重点，再完善细节。 (Đôi khi tôi quá cầu toàn nên làm hơi chậm. Giờ tôi đang học nắm trọng điểm trước rồi mới hoàn thiện chi tiết.)",null,null,"Yìngpìnzhě: wǒ yǒushíhou tài zhuīqiú xìjié, zuòshì bǐjiàomàn. Xiànzài wǒ zài xuéxí xiānzhuā zhòngdiǎn, zài wánshàn xìjié.",null,"BODY92"],["面试官: 我们这个岗位经常要出差和加班，你能接受吗？ (Vị trí này hay phải đi công tác và tăng ca, bạn có chấp nhận được không?)",null,null,"Miànshìguān: wǒmen zhège gǎngwèi jīngcháng yào chūchāi hé jiābān, nǐ néng jiēshòu ma?",null,"BODY93"],["应聘者: 可以的。只要是工作需要，我都会配合，不过希望能提前安排，这样我可以照顾好家里。 (Được ạ. Miễn công việc cần tôi đều phối hợp, nhưng mong được sắp xếp trước để tôi lo việc nhà.)",null,null,"Yìngpìnzhě: kěyǐ de. Zhǐyào shì gōngzuò xūyào, wǒ dōu huì pèihé, bùguò xīwàng néng tíqián ānpái, zhèyàng wǒ kěyǐ zhàogu hǎo jiālǐ.",null,"BODY94"],["面试官: 你对薪资有什么期望？ (Bạn kỳ vọng mức lương thế nào?)",null,null,"Miànshìguān: nǐ duì xīnzī yǒu shénme qīwàng?",null,"BODY95"],["应聘者: 我现在的月薪是两千五百万盾，希望新的工作能在这个基础上提高百分之二十左右，当然也可以根据贵公司的标准再商量。 (Lương hiện tại 25 triệu/tháng, mong công việc mới tăng khoảng 20%, tất nhiên có thể bàn thêm theo tiêu chuẩn của quý công ty.)",null,null,"Yìngpìnzhě: wǒ xiànzài de yuèxīn shì liǎngqiānwǔbǎi wàn dùn, xīwàng xīn de gōngzuò néng zài zhège jīchǔ shàng tígāo bǎifēnzhī'èrshí zuǒyòu, dāngrán yě kěyǐ gēnjù guì gōngsī de biāozhǔn zài shāngliang.",null,"BODY96"],["面试官: 五年以后，你希望自己是什么样的？ (5 năm nữa bạn muốn mình như thế nào?)",null,null,"Miànshìguān: wǔnián yǐhòu, nǐ xīwàng zìjǐ shì shénmeyàng de?",null,"BODY97"],["应聘者: 我希望五年以后能成为部门主管，带一个团队，负责公司在华南地区的市场。 (Tôi mong 5 năm nữa trở thành trưởng bộ phận, dẫn một đội, phụ trách thị trường Hoa Nam.)",null,null,"Yìngpìnzhě: wǒ xīwàng wǔnián yǐhòu néng chéngwéi bùmén zhǔguǎn, dài yīgè tuánduì, fùzé gōngsī zài Huánándìqū de shìchǎng.",null,"BODY98"],["面试官: 好的。你有什么问题想问我们吗？ (Được. Bạn có câu hỏi gì cho chúng tôi không?)",null,null,"Miànshìguān: hǎo de. Nǐ yǒu shénme wèntí xiǎng wèn wǒmen ma?",null,"BODY99"],["应聘者: 请问这个岗位的团队有几个人？试用期大概多久？ (Xin hỏi đội của vị trí này mấy người? Thử việc khoảng bao lâu?)",null,null,"Yìngpìnzhě: qǐngwèn zhège gǎngwèi de tuánduì yǒu jǐgè rén? Shìyòngqī dàgài duōjiǔ?",null,"BODY100"],["面试官: 团队一共六个人，试用期两个月。我们会在一周之内通知你结果。 (Đội 6 người, thử việc 2 tháng. Trong một tuần chúng tôi sẽ báo kết quả.)",null,null,"Miànshìguān: tuánduì yīgòng liùgè rén, shìyòngqī liǎnggè yuè. Wǒmen huì zài yīzhōu zhīnèi tōngzhī nǐ jiéguǒ.",null,"BODY101"],["应聘者: 好的，谢谢您给我这次机会，期待您的消息！ (Vâng, cảm ơn anh/chị đã cho tôi cơ hội này, mong tin của anh/chị!)",null,null,"Yìngpìnzhě: hǎo de, xièxienín gěi wǒ zhècì jīhuì, qīdài nín de xiāoxi!",null,"BODY102"],["情景对话 3 — Ngày đầu đi làm: ra mắt phòng ban và trò chuyện với đồng nghiệp",null,null,"Qíngjǐng duìhuà",null,"BODY103-C"],["经理: 大家停一下，给大家介绍一位新同事。 (Mọi người dừng tay chút, giới thiệu với mọi người một đồng nghiệp mới.)",null,null,"Jīnglǐ: dàjiā tíng yīxià, gěi dàjiā jièshào yīwèi xīn tóngshì.",null,"BODY104"],["新员工: 大家好，我叫黎氏芳，大家可以叫我小芳。我是新来的采购助理，以后在采购部工作。 (Chào mọi người, tôi là Lê Thị Phương, cứ gọi tôi Tiểu Phương. Tôi là trợ lý mua hàng mới, sau này làm ở phòng mua hàng.)",null,null,"Xīn yuángōng: dàjiā hǎo, wǒ jiào Lí Shìfāng, dàjiā kěyǐ jiào wǒ Xiǎo Fāng. Wǒ shì xīn lái de cǎigòu zhùlǐ, yǐhòu zài cǎigòubù gōngzuò.",null,"BODY105"],["新员工: 我之前在一家家具公司做了三年采购，对跟供应商谈价格比较有经验。 (Trước đây tôi làm mua hàng 3 năm ở công ty nội thất, khá có kinh nghiệm đàm phán giá với NCC.)",null,null,"Xīn yuángōng: wǒ zhīqián zài yījiā jiājùgōngsī zuò le sānnián cǎigòu, duì gēn gōngyìngshāng tán jiàgé bǐjiào yǒu jīngyàn.",null,"BODY106"],["新员工: 我刚来，很多流程还不熟悉，有不懂的地方会向大家请教，以后请大家多多关照！ (Tôi mới đến, nhiều quy trình chưa quen, có gì không hiểu sẽ hỏi mọi người, mong mọi người giúp đỡ!)",null,null,"Xīn yuángōng: wǒ gāng lái, hěnduō liúchéng hái bù shúxi, yǒu bù dǒng de dìfang huì xiàng dàjiā qǐngjiào, yǐhòu qǐng dàjiā duōduōguānzhào!",null,"BODY107"],["同事: 欢迎欢迎！我叫阿玲，坐你旁边，有什么问题随时问我。 (Chào mừng! Mình là A Linh, ngồi cạnh bạn, có gì cứ hỏi mình.)",null,null,"Tóngshì: huānyíng huānyíng! Wǒ jiào Ā Líng, zuò nǐ pángbiān, yǒu shénme wèntí suíshí wèn wǒ.",null,"BODY108"],["新员工: 谢谢玲姐！请问我们部门平时几点开会？ (Cảm ơn chị Linh! Phòng mình thường họp lúc mấy giờ ạ?)",null,null,"Xīn yuángōng: xièxie Língjiě! Qǐngwèn wǒmen bùmén píngshí jǐdiǎn kāihuì?",null,"BODY109"],["同事: 每天早上八点半开十五分钟的晨会，周五下午还有一个周会。 (Mỗi sáng 8h30 họp đầu ngày 15 phút, chiều thứ 6 còn họp tuần.)",null,null,"Tóngshì: měitiān zǎoshang bādiǎnbàn kāi shíwǔfēnzhōng de chénhuì, zhōuwǔ xiàwǔ háiyǒu yīgè zhōu huì.",null,"BODY110"],["新员工: 好的。那采购申请一般是在系统里做，还是用纸质的？ (Vâng. Đề xuất mua hàng thường làm trên hệ thống hay bằng giấy ạ?)",null,null,"Xīn yuángōng: hǎo de. Nà cǎigòu shēnqǐng yībān shì zài xìtǒng lǐ zuò, háishì yòng zhǐzhì de?",null,"BODY111"],["同事: 都在系统里。下午我给你开个账号，再教你怎么用。 (Đều trên hệ thống. Chiều chị mở tài khoản rồi chỉ em cách dùng.)",null,null,"Tóngshì: dōu zài xìtǒng lǐ. Xiàwǔ wǒ gěi nǐ kāi gè zhànghào, zài jiào nǐ zěnme yòng.",null,"BODY112"],["新员工: 太麻烦你了。中午大家一般在哪儿吃饭？ (Phiền chị quá. Buổi trưa mọi người thường ăn ở đâu ạ?)",null,null,"Xīn yuángōng: tài máfan nǐ le. Zhōngwǔ dàjiā yībān zài nǎr chīfàn?",null,"BODY113"],["同事: 公司有食堂，不过我们经常去外面吃。今天中午一起吧，我请你，算是欢迎你！ (Công ty có căng-tin, nhưng bọn chị hay ra ngoài ăn. Trưa nay đi cùng nhé, chị mời, coi như chào mừng em!)",null,null,"Tóngshì: gōngsī yǒu shítáng, bùguò wǒmen jīngcháng qù wàimiàn chī. Jīntiān zhōngwǔ yīqǐ ba, wǒ qǐng nǐ, suànshì huānyíng nǐ!",null,"BODY114"],["新员工: 那怎么好意思！下次我请大家喝咖啡。 (Sao ngại thế ạ! Lần sau em mời mọi người cà phê.)",null,null,"Xīn yuángōng: nà zěnme hǎoyìsi! Xiàcì wǒ qǐng dàjiā hēkāfēi.",null,"BODY115"],["情景对话 4 — Gặp khách hàng / đối tác lần đầu, trao danh thiếp",null,null,"Qíngjǐng duìhuà",null,"BODY116-C"],["A: 王总，您好！欢迎来越南！我是ABC公司的销售经理阮文海，这是我的名片。 (Chào Vương tổng! Chào mừng ngài đến VN! Tôi là Nguyễn Văn Hải, giám đốc kinh doanh công ty ABC, đây là danh thiếp của tôi.)",null,null,"Wáng zǒng, nínhǎo! Huānyíng lái Yuènán! Wǒ shì ABC gōngsī de xiāoshòu jīnglǐ Ruǎn Wénhǎi, zhè shì wǒ de míngpiàn.",null,"BODY117"],["B: 你好你好，阮经理。这是我的名片。你的中文说得很地道啊！ (Chào anh Nguyễn. Đây là danh thiếp của tôi. Anh nói tiếng Trung chuẩn quá!)",null,null,"Nǐhǎo nǐhǎo, Ruǎn jīnglǐ. Zhè shì wǒ de míngpiàn. Nǐ de Zhōngwén shuō de hěn dìdào a!",null,"BODY118"],["A: 您过奖了。我在广州留过两年学，所以会说一点儿。 (Ngài quá khen. Tôi từng du học Quảng Châu 2 năm nên biết chút ít.)",null,null,"Nín guòjiǎng le. Wǒ zài Guǎngzhōu liú guò liǎngnián xué, suǒyǐ huì shuō yīdiǎnr.",null,"BODY119"],["B: 难怪！一路上听李经理提起你，说你很专业。 (Thảo nào! Trên đường đi nghe giám đốc Lý nhắc đến anh, nói anh rất chuyên nghiệp.)",null,null,"Nánguài! Yīlùshàng tīng Lǐ jīnglǐ tíqǐ nǐ, shuō nǐ hěn zhuānyè.",null,"BODY120"],["A: 李经理太客气了。这次是我第一次负责贵公司的项目，以后由我跟您直接对接。 (Giám đốc Lý quá lời rồi. Đây là lần đầu tôi phụ trách dự án của quý công ty, sau này tôi làm việc trực tiếp với ngài.)",null,null,"Lǐ jīnglǐ tài kèqi le. Zhècì shì wǒ dìyīcì fùzé guì gōngsī de xiàngmù, yǐhòu yóu wǒ gēn nín zhíjiē duìjiē.",null,"BODY121"],["B: 好啊。你们公司在越南做了多少年了？ (Tốt. Công ty các anh làm ở VN bao nhiêu năm rồi?)",null,null,"Hǎo a. Nǐmen gōngsī zài Yuènán zuò le duōshǎo nián le?",null,"BODY122"],["A: 我们成立十二年了，有三个工厂，主要做塑料包装，百分之六十的产品出口到中国和日本。 (Chúng tôi thành lập 12 năm, có 3 nhà máy, chủ yếu làm bao bì nhựa, 60% sản phẩm xuất sang TQ và Nhật.)",null,null,"Wǒmen chénglì shí'èrnián le, yǒu sāngè gōngchǎng, zhǔyào zuò sùliàobāozhuāng, bǎifēnzhīliùshí de chǎnpǐn chūkǒu dào Zhōngguó hé Rìběn.",null,"BODY123"],["B: 规模不小啊。这次来，我主要想看看你们的生产线和质量管理。 (Quy mô không nhỏ đâu. Lần này tôi chủ yếu muốn xem dây chuyền và quản lý chất lượng.)",null,null,"Guīmó bùxiǎo a. Zhècì lái, wǒ zhǔyào xiǎng kànkan nǐmen de shēngchǎnxiàn hé zhìliàng guǎnlǐ.",null,"BODY124"],["A: 没问题，我们已经安排好了，明天上午带您去北宁工厂参观，下午开会讨论报价。 (Không vấn đề, chúng tôi đã sắp xếp: sáng mai đưa ngài thăm nhà máy Bắc Ninh, chiều họp bàn báo giá.)",null,null,"Méi wèntí, wǒmen yǐjīng ānpái hǎo le, míngtiān shàngwǔ dài nín qù Běiníng gōngchǎng cānguān, xiàwǔ kāihuìtǎolùn bàojià.",null,"BODY125"],["B: 安排得很周到，谢谢。 (Sắp xếp chu đáo quá, cảm ơn.)",null,null,"Ānpái de hěn zhōudào, xièxie.",null,"BODY126"],["A: 应该的。您这几天在越南有任何需要，随时给我打电话或者发微信。 (Đó là việc nên làm. Mấy ngày ở VN ngài cần gì cứ gọi hoặc nhắn WeChat cho tôi.)",null,null,"Yīnggāi de. Nín zhè jǐtiān zài Yuènán yǒu rènhé xūyào, suíshí gěi wǒ dǎdiànhuà huòzhě fā wēi xìn.",null,"BODY127"],["B: 好的，希望我们合作愉快！ (Được, mong chúng ta hợp tác vui vẻ!)",null,null,"Hǎo de, xīwàng wǒmen hézuòyúkuài!",null,"BODY128"],["A: 合作愉快！今天晚上我们为您准备了一顿越南菜，给您接风。 (Hợp tác vui vẻ! Tối nay chúng tôi chuẩn bị một bữa món Việt để đón tiếp ngài.)",null,null,"Hézuòyúkuài! Jīntiān wǎnshàng wǒmen wèi nín zhǔnbèi le yīdùn Yuènán cài, gěi nín jiēfēng.",null,"BODY129"],["BÀI NÓI MẪU — HS nghe, nhại lại, rồi thay bằng thông tin của mình",null,null,null,null,"BODY130-C"],["HSK4 (90 giây): 大家好，我叫阮文明，今年三十岁，老家在南定，现在住在河内。我毕业于河内工业大学，目前在一家中越合资的电子厂工作，担任仓库主管。我主要负责管理进出库、盘点库存和安排发货。我在这家公司已经工作四年了。我之所以学中文，是因为我每天都要跟中国同事打交道，有时候听不懂他们说的话，觉得很着急。除了工作以外，我还喜欢踢足球和看书。我希望通过这个课程，能用中文流利地开会和写邮件。谢谢大家！",null,null,"Dàjiā hǎo, wǒ jiào Ruǎn Wénmíng, jīnnián sānshísuì, lǎojiā zài Nándìng, xiànzài zhù zài Hénèi. Wǒ bìyè yú Hénèi Gōngyè Dàxué, mùqián zài yījiā zhōng yuè hézī de diànzichǎng gōngzuò, dānrèn cāngkù zhǔguǎn. Wǒ zhǔyào fùzéguǎnlǐ jìnchū kù, pándiǎn kùcún hé ānpái fāhuò. Wǒ zài zhèjiā gōngsī yǐjīng gōngzuò sìnián le. Wǒ zhīsuǒyǐ xué Zhōngwén, shìyīnwèi wǒ měitiān dōu yào gēn Zhōngguó tóngshì dǎjiāodao, yǒushíhou tīngbùdǒng tāmen shuō dehuà, juéde hěnzháojí. Chúle gōngzuò yǐwài, wǒ hái xǐhuan tīzúqiú hé kànshū. Wǒ xīwàng tōngguò zhège kèchéng, néng yòng Zhōngwén liúlìde kāihuì hé xiě yóujiàn. Xièxie dàjiā!",null,"BODY131"],["HSK5 (3 phút): 大家好，我叫范氏玉，大家可以叫我小玉。我是岘港人，大学读的是会计专业，可是毕业以后我并没有做会计，而是进了一家外贸公司做销售。说实话，一开始我很不习惯，因为我性格比较内向，一跟陌生人说话就紧张。后来，我的主管给了我一个机会，让我负责一个中国客户。为了跟客户沟通，我每天晚上都自学中文。半年以后，那个客户的订单翻了一倍。正是因为这次经历，我才发现自己其实很适合做销售。现在我在这一行已经做了六年，目前担任销售主管，带一个五个人的团队。我觉得自己最大的优势是能站在客户的角度思考问题，不足是有时候太想让每个人都满意。接下来的两年，我打算考过HSK5，并且希望能负责公司在华南地区的市场。谢谢大家！",null,null,"Dàjiā hǎo, wǒ jiào Fàn Shìyù, dàjiā kěyǐ jiào wǒ Xiǎo Yù. Wǒ shì Xiàngǎng rén, dàxué dú de shì kuàijìzhuānyè, kěshì bìyè yǐhòu wǒ bìng méiyǒu zuò kuàijì, érshì jìn le yījiā wàimàogōngsī zuò xiāoshòu. Shuōshíhuà, yī kāishǐ wǒ hěn bù xíguàn, yīnwèi wǒ xìnggé bǐjiào nèixiàng, yī gēn mòshēngrén shuōhuà jiù jǐnzhāng. Hòulái, wǒ de zhǔguǎn gěi le wǒ yīgè jīhuì, ràng wǒ fùzé yīgè Zhōngguó kèhù. Wèile gēn kèhù gōutōng, wǒ měitiānwǎnshàng dōu zìxué Zhōngwén. Bànnián yǐhòu, nàge kèhù de dìngdān fān le yībèi. Zhèngshì yīnwèi zhècì jīnglì, wǒ cái fāxiànzìjǐ qíshí hěn shìhé zuò xiāoshòu. Xiànzài wǒ zài zhèyīháng yǐjīng zuò le liùnián, mùqián dānrèn xiāoshòuzhǔguǎn, dài yīgè wǔgè rén de tuánduì. Wǒ juéde zìjǐ zuìdà de yōushì shì néng zhàn zài kèhù de jiǎodù sīkǎowèntí, bùzú shì yǒushíhou tài xiǎng ràng měigè rén dōu mǎnyì. Jiēxiàlái de liǎngnián, wǒ dǎsuàn kǎo guò HSK5, bìngqiě xīwàng néng fùzé gōngsī zài Huánándìqū de shìchǎng. Xièxie dàjiā!",null,"BODY132"],["引导练习 GUIDED SPEAKING — 8 câu hỏi phản xạ (GV hỏi thêm: 为什么？具体来说呢？能举个例子吗？)",null,null,"Yǐndǎo liànxí | Wèishénme? Jùtǐláishuō ne? Néng jǔ gè lìzi ma?",null,"BODY133-C"],["1. Hỏi: 你是哪里人？你的家乡有什么特别的？ (Bạn người ở đâu? Quê bạn có gì đặc biệt?)",null,null,"Nǐ shì nǎlǐ rén? Nǐ de jiāxiāng yǒu shénme tèbié de?",null,"BODY134"],["Đáp: 我是宁平人。我的家乡山水特别美，有长安名胜区，很多电影都在那儿拍过。 (Tôi người Ninh Bình. Quê tôi non nước rất đẹp, có quần thể Tràng An, nhiều bộ phim quay ở đó.)",null,null,"Wǒ shì Níngpíngrén. Wǒ de jiāxiāng shānshuǐ tèbié měi, yǒu Cháng'ānmíngshèngqū, hěnduō diànyǐng dōu zài nàr pāi guò.",null,"BODY135"],["2. Hỏi: 你现在做什么工作？一天大概做哪些事？ (Bạn làm gì? Một ngày làm những việc gì?)",null,null,"Nǐ xiànzài zuò shénme gōngzuò? Yītiān dàgài zuò nǎxiē shì?",null,"BODY136"],["Đáp: 我是采购员。早上先看供应商的邮件，然后跟仓库确认库存，下午主要是询价和下订单。 (Tôi là nhân viên mua hàng. Sáng xem email NCC, rồi xác nhận tồn kho với kho, chiều chủ yếu hỏi giá và đặt hàng.)",null,null,"Wǒ shì cǎigòuyuán. Zǎoshang xiān kàn gōngyìngshāng de yóujiàn, ránhòu gēn cāngkù quèrèn kùcún, xiàwǔ zhǔyào shì xúnjià hé xià dìngdān.",null,"BODY137"],["3. Hỏi: 你为什么选择这份工作？ (Vì sao chọn công việc này?)",null,null,"Nǐ wèishénme xuǎnzé zhèfèn gōngzuò?",null,"BODY138"],["Đáp: 我之所以选择做采购，是因为我对数字比较敏感，也喜欢跟人谈判。 (Sở dĩ chọn mua hàng vì tôi nhạy với con số và thích đàm phán.)",null,null,"Wǒ zhīsuǒyǐ xuǎnzé zuò cǎigòu, shìyīnwèi wǒ duì shùzì bǐjiào mǐngǎn, yě xǐhuan gēn rén tánpàn.",null,"BODY139"],["4. Hỏi: 你的工作最有意思的地方是什么？最累的地方呢？ (Điều thú vị nhất và mệt nhất của công việc?)",null,null,"Nǐ de gōngzuò zuì yǒuyìsi de dìfang shì shénme? Zuì lèi de dìfang ne?",null,"BODY140"],["Đáp: 最有意思的是每次谈下一个好价格都很有成就感；最累的是供应商延误的时候，生产部天天催我。 (Thú vị nhất là mỗi lần đàm phán được giá tốt rất có cảm giác thành tựu; mệt nhất là khi NCC giao trễ, sản xuất ngày nào cũng giục tôi.)",null,null,"Zuì yǒuyìsi de shì měicì tán xià yīgè hǎo jiàgé dōu hěn yǒu chéngjiùgǎn; zuì lèi de shì gōngyìngshāng yánwù de shíhou, shēngchǎn bù tiāntiān cuī wǒ.",null,"BODY141"],["5. Hỏi: 你学中文多久了？怎么学的？ (Học tiếng Trung bao lâu, học thế nào?)",null,null,"Nǐ xué Zhōngwén duōjiǔ le? Zěnme xué de?",null,"BODY142"],["Đáp: 学了两年。一开始在中心上课，后来主要靠看中国电视剧和跟客户聊天。 (Học 2 năm. Lúc đầu học ở trung tâm, sau chủ yếu xem phim TQ và nói chuyện với khách.)",null,null,"Xué le liǎngnián. Yī kāishǐ zài zhōngxīn shàngkè, hòulái zhǔyào kào kàn Zhōngguó diànshìjù hé gēn kèhù liáotiān.",null,"BODY143"],["6. Hỏi: 学中文对你的工作有什么帮助？举个例子。 (Tiếng Trung giúp gì cho công việc? Ví dụ.)",null,null,"Xué Zhōngwén duì nǐ de gōngzuò yǒu shénme bāngzhù? Jǔ gè lìzi.",null,"BODY144"],["Đáp: 帮助很大。比如以前跟供应商谈价格要靠翻译，现在我自己就能谈，上个月还多谈下了百分之三的折扣。 (Rất lớn. Trước đàm phán giá phải nhờ phiên dịch, giờ tự đàm được, tháng trước còn đàm thêm được 3% chiết khấu.)",null,null,"Bāngzhù hěndà. Bǐrú yǐqián gēn gōngyìngshāng tán jiàgé yào kào fānyì, xiànzài wǒ zìjǐ jiù néng tán, shànggèyuè hái duō tán xià le bǎifēnzhīsān de zhékòu.",null,"BODY145"],["7. Hỏi: 你周末一般做什么？ (Cuối tuần thường làm gì?)",null,null,"Nǐ zhōumò yībān zuò shénme?",null,"BODY146"],["Đáp: 周末我不是在家陪孩子，就是跟朋友去郊外骑车。 (Cuối tuần không ở nhà với con thì cũng đi đạp xe ngoại ô với bạn.)",null,null,"Zhōumò wǒ bùshì zàijiā péi háizi, jiùshì gēn péngyou qù jiāowài qíchē.",null,"BODY147"],["8. Hỏi: 一年以后，你希望自己的中文达到什么水平？ (1 năm nữa muốn tiếng Trung đạt trình độ nào?)",null,null,"Yīnián yǐhòu, nǐ xīwàng zìjǐ de Zhōngwén dádào shénme shuǐpíng?",null,"BODY148"],["Đáp: 我希望一年以后能考过HSK5，开会的时候不用翻译，能直接表达自己的意见。 (Mong 1 năm nữa đỗ HSK5, họp không cần phiên dịch, tự nêu ý kiến được.)",null,null,"Wǒ xīwàng yīnián yǐhòu néng kǎo guò HSK5, kāihuì de shíhou bùyòng fānyì, néng zhíjiē biǎodá zìjǐ de yìjiàn.",null,"BODY149"],["情景模拟 ROLE-PLAY — Vòng 1: người mới quen ở hội chợ. Vòng 2 (bất ngờ): người đó là nhà tuyển dụng → đổi sang giọng trang trọng",null,null,"Qíngjǐng mónǐ",null,"BODY150-C"],["B: 你好，你也是来参加展会的吗？ (Chào bạn, bạn cũng đến dự hội chợ à?)",null,null,"Nǐhǎo, nǐ yě shì lái cānjiā zhǎnhuì de ma?",null,"BODY151"],["A: 对，我是来看看包装机械的。我叫小海，在一家食品厂做采购。 (Đúng, tôi đến xem máy đóng gói. Tôi là Tiểu Hải, làm mua hàng ở nhà máy thực phẩm.)",null,null,"Duì, wǒ shì lái kànkan bāozhuāng jīxiè de. Wǒ jiào Xiǎo Hǎi, zài yījiā shípǐnchǎng zuò cǎigòu.",null,"BODY152"],["B: 你做采购多久了？ (Bạn làm mua hàng bao lâu rồi?)",null,null,"Nǐ zuò cǎigòu duōjiǔ le?",null,"BODY153"],["A: 四年了，之前在仓库做了两年。 (4 năm rồi, trước đó làm kho 2 năm.)",null,null,"Sìnián le, zhīqián zài cāngkù zuò le liǎngnián.",null,"BODY154"],["B: 哦？那你对供应链挺熟悉的。我们公司正好在招采购主管。 (Ồ? Vậy bạn khá rành chuỗi cung ứng. Công ty tôi đang tuyển trưởng nhóm mua hàng.)",null,null,"Ó? Nà nǐ duì gōngyìngliàn tǐng shúxi de. Wǒmen gōngsī zhènghǎo zài zhāo cǎigòu zhǔguǎn.",null,"BODY155"],["A: 是吗？那太巧了！请问贵公司是做哪方面的？ (Vậy sao? Trùng hợp quá! Xin hỏi quý công ty làm lĩnh vực gì?)",null,null,"Shì ma? Nà tàiqiǎo le! Qǐngwèn guì gōngsī shì zuò nǎ fāngmiàn de?",null,"BODY156"],["B: 我们是做冷冻海鲜出口的，工厂在海防。 (Chúng tôi xuất khẩu hải sản đông lạnh, nhà máy ở Hải Phòng.)",null,null,"Wǒmen shì zuò lěngdòng hǎixiān chūkǒu de, gōngchǎng zài Hǎifáng.",null,"BODY157"],["A: 方便的话，我可以简单介绍一下我的经历吗？ (Nếu tiện, tôi xin giới thiệu ngắn về kinh nghiệm được không?)",null,null,"Fāngbiàn dehuà, wǒ kěyǐ jiǎndān jièshào yīxià wǒ de jīnglì ma?",null,"BODY158"],["B: 当然可以，说说你最成功的一次采购经历吧。 (Tất nhiên, kể lần mua hàng thành công nhất của bạn đi.)",null,null,"Dāngrán kěyǐ, shuōshuo nǐ zuì chénggōng de yīcì cǎigòu jīnglì ba.",null,"BODY159"],["A: 去年原材料涨价，我找了三家新的供应商比价，最后帮公司节省了百分之八的成本。 (Năm ngoái nguyên liệu tăng giá, tôi tìm 3 NCC mới so giá, cuối cùng giúp công ty tiết kiệm 8% chi phí.)",null,null,"Qùnián yuáncáiliào zhǎngjià, wǒ zhǎo le sānjiā xīn de gōngyìngshāng bǐjià, zuìhòu bāng gōngsī jiéshěng le bǎifēnzhībā de chéngběn.",null,"BODY160"],["B: 不错。那你为什么考虑换工作呢？ (Không tệ. Thế sao bạn tính đổi việc?)",null,null,"Bùcuò. Nà nǐ wèishénme kǎolǜ huàn gōngzuò ne?",null,"BODY161"],["A: 现在的公司很稳定，但我希望能负责更大的采购项目，承担更多的责任。 (Công ty hiện tại ổn định, nhưng tôi muốn phụ trách dự án mua hàng lớn hơn, gánh nhiều trách nhiệm hơn.)",null,null,"Xiànzài de gōngsī hěn wěndìng, dàn wǒ xīwàng néng fùzé gèng dà de cǎigòu xiàngmù, chéngdān gèng duō de zérèn.",null,"BODY162"],["B: 好，这是我的名片，有兴趣的话把简历发给我。 (Được, đây là danh thiếp của tôi, có hứng thú thì gửi CV cho tôi.)",null,null,"Hǎo, zhè shì wǒ de míngpiàn, yǒu xìngqù dehuà bǎ jiǎnlì fāgěi wǒ.",null,"BODY163"],["A: 谢谢您！我今天晚上就把简历发给您。 (Cảm ơn anh/chị! Tối nay tôi gửi CV ngay.)",null,null,"Xièxienín! Wǒ jīntiān wǎnshàng jiù bǎ jiǎnlì fāgěinín.",null,"BODY164"],["Biến cố GV có thể thêm: 你的期望薪资是多少？/ 你为什么只在上一家公司做了一年？/ 你能接受去海防工作吗？",null,null,"Nǐ de qīwàng xīnzī shì duōshǎo? / | Nǐ wèishénme zhǐ zài shàng yījiā gōngsī zuò le yīnián? / | Nǐ néng jiēshòu qù Hǎifáng gōngzuò ma?",null,"BODY165"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY166-C"],["✗ 我工作在ABC公司。 → ✓ 我在ABC公司工作。 (Trạng ngữ nơi chốn 在… đứng TRƯỚC động từ.)",null,null,"Wǒ gōngzuò zài ABC gōngsī. | Wǒ zài ABC gōngsī gōngzuò. | Zài…",null,"BODY167"],["✗ 我做工作销售。 → ✓ 我做销售工作。/ 我是做销售的。",null,null,"Wǒ zuò gōngzuò xiāoshòu. | Wǒ zuò xiāoshòu gōngzuò. / | Wǒ shì zuò xiāoshòu de.",null,"BODY168"],["✗ 我有五年经验在销售。 → ✓ 我有五年的销售经验。",null,null,"Wǒ yǒu wǔnián jīngyàn zài xiāoshòu. | Wǒ yǒu wǔnián de xiāoshòu jīngyàn.",null,"BODY169"],["✗ 我毕业河内大学。 → ✓ 我毕业于河内大学。/ 我是河内大学毕业的。",null,null,"Wǒ bìyè Hénèi dàxué. | Wǒ bìyè yú Hénèi dàxué. / | Wǒ shì Hénèi dàxuébìyè de.",null,"BODY170"],["✗ 我很兴趣中文。 → ✓ 我对中文很感兴趣。",null,null,"Wǒ hěn xìngqù Zhōngwén. | Wǒ duì Zhōngwén hěngǎnxìngqù.",null,"BODY171"],["✗ 我学中文两年。 → ✓ 我学了两年中文。/ 我学中文学了两年。",null,null,"Wǒ xué Zhōngwén liǎngnián. | Wǒ xué le liǎngnián Zhōngwén. / | Wǒ xué zhōng wénxué le liǎngnián.",null,"BODY172"],["✗ 认识你我很高兴。 (cứng, dịch từ tiếng Việt) → ✓ 很高兴认识你。",null,null,"Rènshi nǐ wǒ hěn gāoxìng. | Hěn gāoxìng rènshi nǐ.",null,"BODY173"],["Phát âm: 负责 fùzé (z không bật hơi); 从事 cóngshì (sh uốn lưỡi); 经验 jīngyàn.",null,null,"Fùzé | Cóngshì | Jīngyàn",null,"BODY174"],["Nâng cấp HSK5: 我很喜欢我的工作 → 我对现在的工作很有热情，每天都觉得很有成就感。",null,null,"Wǒ hěn xǐhuan wǒ de gōngzuò | Wǒ duì xiànzài de gōngzuò hěn yǒu rèqíng, měitiān dōu juédehěnyǒu chéngjiùgǎn.",null,"BODY175"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY176-C"],["Ghi âm 2 phiên bản giới thiệu: (1) thân mật – nói với bạn mới quen, 60–90 giây; (2) trang trọng – phỏng vấn, HSK4 90 giây / HSK5 3 phút. Dùng ít nhất 5 cụm từ + 3 mẫu câu của buổi học.",null,null,null,null,"BODY177"],["Luyện cặp: 2 HS đóng lại Hội thoại 1 và 2, sau đó thay toàn bộ thông tin bằng thông tin thật của mình.",null,null,null,null,"BODY178"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY178"],["Buổi 02 — 日常生活与时间安排 Sinh hoạt và lịch trình",null,null,"Rìchángshēnghuó yǔ shíjiān ānpái",null,"BODY180-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY181-C"],["HSK4: Mô tả lịch một ngày; xin đổi lịch hẹn; xử lý tình huống ở siêu thị, nhà hàng, hỏi đường. HSK5: Xử lý 2 cuộc họp trùng nhau, thương lượng ưu tiên.",null,null,null,null,"BODY182"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY184-C"],["1. Hỏi: 你今天几点起床的？起床以后做了什么？ (Hôm nay mấy giờ bạn dậy? Dậy xong làm gì?)",null,null,"Nǐ jīntiān jǐdiǎn qǐchuáng de? Qǐchuáng yǐhòu zuò le shénme?",null,"BODY185"],["Đáp: 我今天六点半就起床了，先洗脸刷牙，然后送孩子去学校，八点到公司。 (Hôm nay 6h30 tôi đã dậy, đánh răng rửa mặt, rồi đưa con đi học, 8h đến công ty.)",null,null,"Wǒ jīntiān liùdiǎnbàn jiù qǐchuáng le, xiān xǐliǎn shuāyá, ránhòu sòng háizi qù xuéxiào, bādiǎn dào gōngsī.",null,"BODY186"],["2. Hỏi: 你一个星期去几次超市？一般买什么？ (Một tuần đi siêu thị mấy lần? Thường mua gì?)",null,null,"Nǐ yīgè xīngqī qù jǐcì chāoshì? Yībān mǎi shénme?",null,"BODY187"],["Đáp: 我一般周末去一次，主要买水果、牛奶和一些日用品。 (Thường cuối tuần đi một lần, chủ yếu mua hoa quả, sữa và đồ dùng hằng ngày.)",null,null,"Wǒ yībān zhōumò qù yīcì, zhǔyào mǎi shuǐguǒ, niúnǎi hé yīxiē rìyòngpǐn.",null,"BODY188"],["3. Hỏi: 你最近一次迟到是什么时候？为什么？ (Lần gần nhất bạn đi muộn là khi nào? Vì sao?)",null,null,"Nǐ zuìjìn yīcì chídào shì shénme shíhou? Wèishénme?",null,"BODY189"],["Đáp: 上个星期一，因为下大雨，路上堵车堵了一个小时。 (Thứ 2 tuần trước, vì mưa to, tắc đường mất một tiếng.)",null,null,"Shànggèxīngqī yī, yīnwèi xià dàyǔ, lùshàng dǔchē dǔ le yīgè xiǎoshí.",null,"BODY190"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY191-C"],["1. 平时 (bình thường, ngày thường): 我平时七点出门，周末会睡到九点。 (Ngày thường 7h tôi ra khỏi nhà, cuối tuần ngủ đến 9h.)",null,null,"Píngshí | Wǒ píngshí qīdiǎn chūmén, zhōumò huì shuì dào jiǔdiǎn.",null,"BODY192"],["2. 偶尔 (thỉnh thoảng): 我偶尔在外面吃午饭，大部分时间自己带饭。 (Thỉnh thoảng tôi ăn trưa ngoài, phần lớn tự mang cơm.)",null,null,"Ǒu'ěr | Wǒ ǒu'ěr zài wàimiàn chī wǔfàn, dàbùfen shíjiān zìjǐ dàifàn.",null,"BODY193"],["3. 提前 (sớm hơn, trước): 会议提前到九点了，大家别迟到。 (Họp dời sớm lên 9h, mọi người đừng muộn.)",null,null,"Tíqián | Huìyì tíqián dào jiǔdiǎn le, dàjiā bié chídào.",null,"BODY194"],["4. 推迟 (lùi lại, hoãn): 因为客户的航班延误，见面推迟到下午三点。 (Vì chuyến bay của khách trễ, buổi gặp lùi đến 3h chiều.)",null,null,"Tuīchí | Yīnwèi kèhù de hángbān yánwù, jiànmiàn tuīchí dào xiàwǔ sāndiǎn.",null,"BODY195"],["5. 临时 (đột xuất): 老板临时叫我去开会，我晚点给你回电话。 (Sếp đột xuất gọi đi họp, lát tôi gọi lại.)",null,null,"Línshí | Lǎobǎn línshí jiào wǒ qù kāihuì, wǒ wǎndiǎn gěi nǐ huí diànhuà.",null,"BODY196"],["6. 来得及 / 来不及 (kịp / không kịp): 现在出发还来得及吗？——恐怕来不及了。 (Giờ đi còn kịp không? — E là không kịp rồi.)",null,null,"Láidejí | Láibùjí | Xiànzài chūfā hái láidejí ma? -- Kǒngpà láibùjí le.",null,"BODY197"],["7. 调整计划 (điều chỉnh kế hoạch): 天气不好，我们得调整一下周末的计划。 (Thời tiết xấu, phải điều chỉnh kế hoạch cuối tuần.)",null,null,"Tiáozhěngjìhuà | Tiānqì bùhǎo, wǒmen děi tiáozhěng yīxià zhōumò de jìhuà.",null,"BODY198"],["8. 约好 (đã hẹn): 我跟朋友约好了周六晚上一起吃饭。 (Tôi đã hẹn bạn tối thứ 7 ăn cơm.)",null,null,"Yuē hǎo | Wǒ gēn péngyou yuē hǎo le zhōuliù wǎnshàng yīqǐ chīfàn.",null,"BODY199"],["9. 有空 (rảnh): 你明天下午有空吗？ (Chiều mai bạn rảnh không?)",null,null,"Yǒukòng | Nǐ míngtiān xiàwǔ yǒukòng ma?",null,"BODY200"],["10. 撞 / 时间冲突 (trùng lịch): 这两个会撞了，我只能参加一个。 (Hai cuộc họp trùng nhau, tôi chỉ dự được một.)",null,null,"Zhuàng | Shíjiān chōngtū | Zhè liǎnggè huì zhuàng le, wǒ zhǐnéng cānjiā yīgè.",null,"BODY201"],["11. 准时 (đúng giờ): 明天的会请大家准时参加。 (Họp ngày mai mời mọi người đúng giờ.)",null,null,"Zhǔnshí | Míngtiān de huì qǐng dàjiā zhǔnshí cānjiā.",null,"BODY202"],["12. 顺便 (tiện thể): 我下班去超市，顺便帮你买瓶水。 (Tan làm tôi đi siêu thị, tiện mua cho bạn chai nước.)",null,null,"Shùnbiàn | Wǒ xiàbān qù chāoshì, shùnbiàn bāng nǐ mǎi píng shuǐ.",null,"BODY203"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY204-C"],["1. 本来打算……，结果…… (Định … ai ngờ / kết quả lại …)",null,null,"Běnlái dǎsuàn……, jiéguǒ……",null,"BODY205"],["Ví dụ: 我本来打算周末去海边，结果下了两天雨，只好在家看电影。 (Định cuối tuần đi biển, ai ngờ mưa 2 ngày, đành ở nhà xem phim.)",null,null,"Wǒ běnlái dǎsuàn zhōumò qù hǎibiān, jiéguǒ xià le liǎngtiān yǔ, zhǐhǎo zàijiā kàn diànyǐng.",null,"BODY206"],["Ví dụ: 我本来打算六点下班，结果客户临时打电话来，一直忙到八点。 (Định 6h tan làm, ai ngờ khách gọi đột xuất, bận đến 8h.)",null,null,"Wǒ běnlái dǎsuàn liùdiǎn xiàbān, jiéguǒ kèhù línshí dǎdiànhuà lái, yīzhí máng dào bādiǎn.",null,"BODY207"],["Ví dụ: 我们本来打算坐火车去，结果票卖完了，只能坐大巴。 (Định đi tàu, ai ngờ hết vé, đành đi xe khách.)",null,null,"Wǒmen běnlái dǎsuàn zuòhuǒchē qù, jiéguǒ piào màiwán le, zhǐnéng zuò dàbā.",null,"BODY208"],["2. 要不改到……吧 (Hay là đổi sang … nhé)",null,null,"Yào bù gǎi dào…… ba",null,"BODY209"],["Ví dụ: 明天上午我要见客户，要不改到下午两点吧？ (Sáng mai tôi gặp khách, hay đổi sang 2h chiều nhé?)",null,null,"Míngtiān shàngwǔ wǒ yào jiàn kèhù, yào bù gǎi dào xiàwǔ liǎngdiǎn ba?",null,"BODY210"],["Ví dụ: 今天雨太大了，要不改到下个周末吧。 (Hôm nay mưa to quá, hay đổi sang cuối tuần sau nhé.)",null,null,"Jīntiān yǔ tài dà le, yào bù gǎi dào xià gè zhōumò ba.",null,"BODY211"],["Ví dụ: 线下见面不太方便，要不改到线上开会吧？ (Gặp trực tiếp không tiện, hay đổi sang họp online nhé?)",null,null,"Xiànxià jiànmiàn bù tài fāngbiàn, yào bù gǎi dào xiàn shàng kāihuì ba?",null,"BODY212"],["3. 先……，然后……，最后…… (Trước tiên …, sau đó …, cuối cùng …)",null,null,"Xiān……, ránhòu……, zuìhòu……",null,"BODY213"],["Ví dụ: 我每天早上先看邮件，然后开晨会，最后安排当天的工作。 (Mỗi sáng tôi xem email, rồi họp đầu ngày, cuối cùng sắp xếp việc trong ngày.)",null,null,"Wǒ měitiān zǎoshang xiān kàn yóujiàn, ránhòu kāi chénhuì, zuìhòu ānpái dàngtiān de gōngzuò.",null,"BODY214"],["Ví dụ: 下班以后我先去健身房，然后去超市买菜，最后回家做饭。 (Tan làm tôi đi gym, rồi đi siêu thị mua đồ, cuối cùng về nhà nấu cơm.)",null,null,"Xiàbān yǐhòu wǒ xiān qù jiànshēnfáng, ránhòu qù chāoshì mǎicài, zuìhòu huíjiā zuòfàn.",null,"BODY215"],["4. 一……就…… (Hễ / vừa … là …)",null,null,"Yī…… jiù……",null,"BODY216"],["Ví dụ: 我一到公司就打开电脑查订单。 (Vừa đến công ty là tôi mở máy tra đơn.)",null,null,"Wǒ yī dào gōngsī jiù dǎkāi diànnǎo chá dìngdān.",null,"BODY217"],["Ví dụ: 一下雨，河内就堵车。 (Hễ mưa là Hà Nội tắc đường.)",null,null,"Yī xiàyǔ, Hénèi jiù dǔchē.",null,"BODY218"],["5. 不是……就是…… (Không … thì cũng …)",null,null,"Bùshì…… jiùshì……",null,"BODY219"],["Ví dụ: 我周末不是在家陪孩子，就是去超市买东西。 (Cuối tuần không ở nhà với con thì cũng đi siêu thị.)",null,null,"Wǒ zhōumò bùshì zàijiā péi háizi, jiùshì qù chāoshì mǎi dōngxi.",null,"BODY220"],["Ví dụ: 这几天不是开会就是出差，忙得没时间吃饭。 (Mấy hôm nay không họp thì đi công tác, bận đến không có thời gian ăn.)",null,null,"Zhè jǐtiān bùshì kāihuì jiùshì chūchāi, máng de méi shíjiān chīfàn.",null,"BODY221"],["6. 趁……，…… (Nhân lúc …, …)",null,null,"Chèn……,……",null,"BODY222"],["Ví dụ: 趁中午休息，我去银行办了点事。 (Nhân lúc nghỉ trưa, tôi ra ngân hàng làm chút việc.)",null,null,"Chèn zhōngwǔ xiūxi, wǒ qù yínháng bàn le diǎn shì.",null,"BODY223"],["Ví dụ: 趁超市打折，我多买了几瓶洗发水。 (Nhân lúc siêu thị giảm giá, tôi mua thêm mấy chai dầu gội.)",null,null,"Chèn chāoshì dǎzhé, wǒ duō mǎi le jǐpíng xǐfàshuǐ.",null,"BODY224"],["7. 既然……，就…… (Đã … thì …)",null,null,"Jìrán……, jiù……",null,"BODY225"],["Ví dụ: 既然你今天没空，那我们就改到明天吧。 (Đã hôm nay bạn bận thì mình đổi sang mai nhé.)",null,null,"Jìrán nǐ jīntiān méikòng, nà wǒmen jiù gǎi dào míngtiān ba.",null,"BODY226"],["Ví dụ: 既然来了河内，就一定要尝尝烤肉米线。 (Đã đến Hà Nội thì nhất định phải nếm bún chả.)",null,null,"Jìrán lái le Hénèi, jiù yīdìng yào chángchang kǎoròumǐxiàn.",null,"BODY227"],["8. 万一……的话，…… (Lỡ / nhỡ … thì …)",null,null,"Wànyī…… dehuà,……",null,"BODY228"],["Ví dụ: 万一路上堵车的话，你们就先开始，不用等我。 (Lỡ tắc đường thì mọi người cứ bắt đầu, không cần đợi tôi.)",null,null,"Wàn yīlùshàng dǔchē dehuà, nǐmen jiù xiān kāishǐ, bùyòng děng wǒ.",null,"BODY229"],["Ví dụ: 万一餐厅没位子的话，我们就去旁边那家。 (Nhỡ nhà hàng hết chỗ thì mình sang quán bên cạnh.)",null,null,"Wànyī cāntīng méi wèizi dehuà, wǒmen jiù qù pángbiān nà jiā.",null,"BODY230"],["9. 离……还有…… (Cách … còn …)",null,null,"Lí…… háiyǒu……",null,"BODY231"],["Ví dụ: 离开会还有十分钟，来得及。 (Còn 10 phút nữa mới họp, kịp.)",null,null,"Líkāi huì háiyǒu shífēnzhōng, láidejí.",null,"BODY232"],["Ví dụ: 这儿离机场还有二十公里。 (Đây cách sân bay còn 20km.)",null,null,"Zhèr lí jīchǎng háiyǒu èrshígōnglǐ.",null,"BODY233"],["10. (HSK5) 考虑到……，我建议…… (Xét đến …, tôi đề nghị …)",null,null,"Kǎolǜ dào……, wǒ jiànyì……",null,"BODY234"],["Ví dụ: 考虑到客户明天就回国，我建议先跟客户开会，内部会议往后推。 (Xét đến việc khách mai về nước, tôi đề nghị họp khách trước, họp nội bộ lùi lại.)",null,null,"Kǎolǜ dào kèhù míngtiān jiù huíguó, wǒ jiànyì xiān gēn kèhù kāihuì, nèibù huìyì wǎnghòu tuī.",null,"BODY235"],["Ví dụ: 考虑到周五下午容易堵车，我建议把出发时间提前到一点。 (Xét đến việc chiều thứ 6 dễ tắc đường, tôi đề nghị dời giờ xuất phát lên 1h.)",null,null,"Kǎolǜ dào zhōuwǔ xiàwǔ róngyì dǔchē, wǒ jiànyì bǎ chūfā shíjiān tíqián dào yīdiǎn.",null,"BODY236"],["11. (HSK5) 与其……，不如…… (Thay vì … chi bằng …)",null,null,"Yǔqí……, bùrú……",null,"BODY237"],["Ví dụ: 与其两个会都迟到，不如先去更重要的那个，另一个请同事帮忙记录。 (Thay vì muộn cả 2 cuộc họp, chi bằng dự cuộc quan trọng hơn, cuộc kia nhờ đồng nghiệp ghi lại.)",null,null,"Yǔqí liǎnggè huì dōu chídào, bùrú xiān qù gèng zhòngyào de nàge, lìng yīgè qǐng tóngshì bāngmáng jìlù.",null,"BODY238"],["Ví dụ: 与其每天在外面吃，不如周末多买点菜自己做。 (Thay vì ngày nào cũng ăn ngoài, chi bằng cuối tuần mua nhiều đồ tự nấu.)",null,null,"Yǔqí měitiān zài wàimiàn chī, bùrú zhōumò duō mǎidiǎn cài zìjǐ zuò.",null,"BODY239"],["情景对话 1 — Ở SIÊU THỊ 在超市 (khách hàng ↔ nhân viên, ~4 phút)",null,null,"Qíngjǐng duìhuà | Zài chāoshì",null,"BODY240-C"],["顾客: 你好，请问进口水果在哪个区？ (Chào bạn, xin hỏi hoa quả nhập khẩu ở khu nào?)",null,null,"Gùkè: nǐhǎo, qǐngwèn jìnkǒu shuǐguǒ zài nǎge qū?",null,"BODY241"],["店员: 在一楼最里面，生鲜区的旁边。您要买什么水果？ (Ở trong cùng tầng 1, cạnh khu đồ tươi sống. Anh/chị muốn mua quả gì?)",null,null,"Diànyuán: zài yīlóu zuì lǐmiàn, shēngxiān qū de pángbiān. Nín yào mǎi shénme shuǐguǒ?",null,"BODY242"],["顾客: 我想买点葡萄。这个葡萄多少钱一斤？ (Tôi muốn mua ít nho. Nho này bao nhiêu tiền một cân?)",null,null,"Gùkè: wǒ xiǎng mǎidiǎn pútao. Zhège pútao duōshǎo qián yījīn?",null,"BODY243"],["店员: 这是澳大利亚的，十二万盾一斤。今天会员打九折。 (Đây là nho Úc, 120 nghìn một cân. Hôm nay thành viên giảm 10%.)",null,null,"Diànyuán: zhè shì Àodàlìyà de, shí'èrwàn dùn yījīn. Jīntiān huìyuán dǎ jiǔzhé.",null,"BODY244"],["顾客: 有点贵。有没有便宜一点的？ (Hơi đắt. Có loại rẻ hơn không?)",null,null,"Gùkè: yǒudiǎn guì. Yǒuméiyǒu piányi yīdiǎn de?",null,"BODY245"],["店员: 旁边那种是越南宁顺的，六万盾一斤，也很甜。 (Loại bên cạnh là nho Ninh Thuận, 60 nghìn một cân, cũng rất ngọt.)",null,null,"Diànyuán: pángbiān nàzhǒng shì Yuènán Níngshùn de, liùwàn dùn yījīn, yě hěntián.",null,"BODY246"],["顾客: 那我要宁顺的，两斤。麻烦帮我称一下。 (Vậy tôi lấy nho Ninh Thuận, 2 cân. Phiền cân giúp tôi.)",null,null,"Gùkè: nà wǒ yào Níngshùn de, liǎngjīn. Máfan bāng wǒ chēngyīxià.",null,"BODY247"],["店员: 好的，一共二点一斤，十二万六千盾。还需要别的吗？ (Vâng, tổng 2,1 cân, 126 nghìn. Cần gì nữa không ạ?)",null,null,"Diànyuán: hǎo de, yīgòng èrdiǎn yījīn, shí'èrwàn liùqiān dùn. Hái xūyào biéde ma?",null,"BODY248"],["顾客: 我还要买牛奶。这个牛奶什么时候过期？ (Tôi còn muốn mua sữa. Sữa này khi nào hết hạn?)",null,null,"Gùkè: wǒ háiyào mǎi niúnǎi. Zhège niúnǎi shénme shíhou guòqī?",null,"BODY249"],["店员: 生产日期是昨天，保质期七天，要放冰箱。 (Ngày sản xuất hôm qua, hạn dùng 7 ngày, phải để tủ lạnh.)",null,null,"Diànyuán: shēngchǎnrìqī shì zuótiān, bǎozhìqī qītiān, yào fàng bīngxiāng.",null,"BODY250"],["顾客: 好。洗衣液现在有活动吗？ (Được. Nước giặt bây giờ có khuyến mãi không?)",null,null,"Gùkè: hǎo. Xǐyī yè xiànzài yǒu huódòng ma?",null,"BODY251"],["店员: 有，买一大瓶送一小瓶，在二楼日用品区。 (Có, mua 1 chai lớn tặng 1 chai nhỏ, ở khu đồ dùng tầng 2.)",null,null,"Diànyuán: yǒu, mǎi yīdà píng sòng yīxiǎo píng, zài èrlóu rìyòngpǐn qū.",null,"BODY252"],["顾客: (ở quầy thanh toán) 你好，可以扫码付款吗？ (Chào bạn, quét mã thanh toán được không?)",null,null,"Gùkè: nǐhǎo, kěyǐ sǎo mǎ fùkuǎn ma?",null,"BODY253"],["收银员: 可以，扫这个二维码。您有会员卡吗？ (Được, quét mã QR này. Anh/chị có thẻ thành viên không?)",null,null,"Shōuyínyuán: kěyǐ, sǎo zhège èrwéimǎ. Nín yǒu huìyuánkǎ ma?",null,"BODY254"],["顾客: 有，这是我的会员卡。另外再给我一个袋子。 (Có, đây là thẻ thành viên. Cho tôi thêm một cái túi.)",null,null,"Gùkè: yǒu, zhè shì wǒ de huìyuánkǎ. Lìngwài zài gěi wǒ yīgè dàizi.",null,"BODY255"],["收银员: 好的，袋子两千盾。一共四十八万五千盾。 (Vâng, túi 2 nghìn. Tổng cộng 485 nghìn.)",null,null,"Shōuyínyuán: hǎo de, dàizi liǎngqiān dùn. Yīgòng sìshí bāwànwǔqiān dùn.",null,"BODY256"],["顾客: 不好意思，这个洗衣液好像算错了，标签上写的是十二万。 (Xin lỗi, nước giặt này hình như tính sai, nhãn ghi 120 nghìn.)",null,null,"Gùkè: bùhǎoyìsi, zhège xǐyī yè hǎoxiàng suàncuò le, biāoqiān shàng xiě de shì shí'èrwàn.",null,"BODY257"],["收银员: 我看一下……对不起，是我扫错了，我马上帮您改。 (Để tôi xem… Xin lỗi, tôi quét nhầm, tôi sửa ngay.)",null,null,"Shōuyínyuán: wǒ kàn yīxià…… duìbuqǐ, shì wǒ sǎo cuò le, wǒ mǎshàng bāng nín gǎi.",null,"BODY258"],["顾客: 没关系。麻烦给我一张小票。 (Không sao. Phiền cho tôi biên lai.)",null,null,"Gùkè: méiguānxi. Máfan gěi wǒ yīzhāng xiǎopiào.",null,"BODY259"],["收银员: 给您。小票请保管好，七天内凭小票可以退换。 (Gửi anh/chị. Giữ kỹ biên lai, trong 7 ngày có biên lai được đổi trả.)",null,null,"Shōuyínyuán: gěi nín. Xiǎopiào qǐng bǎoguǎn hǎo, qītiān nèi píng xiǎopiào kěyǐ tuìhuàn.",null,"BODY260"],["情景对话 2 — Ở NHÀ HÀNG 在餐厅 (đặt bàn → gọi món → yêu cầu → thanh toán, ~5 phút)",null,null,"Qíngjǐng duìhuà | Zài cāntīng",null,"BODY261-C"],["顾客: (gọi điện) 你好，我想订一张今晚七点的桌子，六个人。 (Chào bạn, tôi muốn đặt một bàn 7h tối nay, 6 người.)",null,null,"Gùkè: nǐhǎo, wǒ xiǎng dìng yīzhāng jīnwǎn qīdiǎn de zhuōzi, liùgè rén.",null,"BODY262"],["服务员: 好的，请问您贵姓？要大厅还是包间？ (Vâng, xin hỏi quý danh? Muốn ngồi sảnh hay phòng riêng?)",null,null,"Fúwùyuán: hǎo de, qǐngwèn nín guìxìng? Yào dàtīng háishì bāojiān?",null,"BODY263"],["顾客: 我姓阮。有包间的话最好，我们要请客户吃饭。 (Tôi họ Nguyễn. Có phòng riêng thì tốt nhất, chúng tôi mời khách ăn.)",null,null,"Gùkè: wǒ xìng ruǎn. Yǒu bāojiān dehuà zuìhǎo, wǒmen yào qǐng kèhù chīfàn.",null,"BODY264"],["服务员: 有的，包间最低消费三百万盾。给您留到七点十五分。 (Có ạ, phòng riêng chi tiêu tối thiểu 3 triệu. Giữ phòng đến 7h15.)",null,null,"Fúwùyuán: yǒu de, bāojiān zuìdī xiāofèi sānbǎiwàn dùn. Gěi nín liú dào qīdiǎn shíwǔfēn.",null,"BODY265"],["服务员: (tối đến) 欢迎光临！请问有预订吗？ (Kính chào quý khách! Có đặt trước không ạ?)",null,null,"Fúwùyuán: huānyíngguānglín! Qǐngwèn yǒu yùdìng ma?",null,"BODY266"],["顾客: 有，姓阮，六位，订的是包间。 (Có, họ Nguyễn, 6 người, đặt phòng riêng.)",null,null,"Gùkè: yǒu, xìng ruǎn, liùwèi, dìng de shì bāojiān.",null,"BODY267"],["服务员: 这边请。这是菜单，有中文的。 (Mời đi lối này. Đây là thực đơn, có tiếng Trung.)",null,null,"Fúwùyuán: zhèbiān qǐng. Zhè shì càidān, yǒu Zhōngwén de.",null,"BODY268"],["顾客: 你们店的招牌菜是什么？我们有中国客人，想点几道有特色的越南菜。 (Món đặc trưng của quán là gì? Chúng tôi có khách TQ, muốn gọi vài món Việt đặc sắc.)",null,null,"Gùkè: nǐmen diàn de zhāopáicài shì shénme? Wǒmen yǒu Zhōngguó kèrén, xiǎng diǎn jǐdào yǒu tèsè de Yuènán cài.",null,"BODY269"],["服务员: 推荐您试试我们的烤鱼、炸春卷和香茅牛肉，很多中国客人都喜欢。 (Mời thử chả cá, nem rán và bò xào sả, nhiều khách TQ rất thích.)",null,null,"Fúwùyuán: tuījiàn nín shìshi wǒmen de kǎoyú, zháchūnjuǎn hé xiāngmáoniúròu, hěnduō Zhōngguó kèrén dōu xǐhuan.",null,"BODY270"],["顾客: 好。香茅牛肉辣不辣？ (Được. Bò xào sả có cay không?)",null,null,"Gùkè: hǎo. Xiāngmáoniúròu là bù là?",null,"BODY271"],["服务员: 有一点点辣，可以给您做成不辣的。 (Hơi cay một chút, có thể làm không cay.)",null,null,"Fúwùyuán: yǒu yīdiǎndiǎn là, kěyǐ gěi nín zuòchéng bù là de.",null,"BODY272"],["顾客: 那就做不辣的。另外，我们有一位客人不吃香菜，所有的菜都别放香菜。 (Vậy làm không cay. Ngoài ra có một vị khách không ăn rau mùi, tất cả các món đừng cho rau mùi.)",null,null,"Gùkè: nà jiù zuò bù là de. Lìngwài, wǒmen yǒu yīwèi kèrén bùchī xiāngcài, suǒyǒu de cài dōu bié fàng xiāngcài.",null,"BODY273"],["服务员: 好的，记下了。这些菜大概够六个人吃吗？要不要再加一个汤？ (Vâng, đã ghi lại. Ngần này đủ 6 người không? Có thêm một món canh không ạ?)",null,null,"Fúwùyuán: hǎo de, jìxià le. Zhèxiē cài dàgài gòu liùgè rén chī ma? Yào bùyào zài jiā yīgè tāng?",null,"BODY274"],["顾客: 再来一个酸鱼汤，先点这些，不够再加。饮料要一壶茶和六瓶冰啤酒。 (Thêm canh chua cá, gọi chừng này trước, không đủ gọi thêm. Đồ uống cho một ấm trà và 6 chai bia lạnh.)",null,null,"Gùkè: zàiláiyīgè suānyútāng, xiān diǎn zhèxiē, bùgòu zài jiā. Yǐnliào yào yī hú chá hé liùpíng bīng píjiǔ.",null,"BODY275"],["顾客: (30 phút sau) 服务员，我们的汤点了半个小时了还没上，能帮我们催一下吗？ (Bạn ơi, canh gọi nửa tiếng rồi chưa lên, giục giúp được không?)",null,null,"Gùkè: fúwùyuán, wǒmen de tāng diǎn le bàngè xiǎoshí le hái méi shàng, néng bāng wǒmen cuī yīxià ma?",null,"BODY276"],["服务员: 不好意思，今天客人比较多，我马上去厨房催。 (Xin lỗi, hôm nay đông khách, tôi xuống bếp giục ngay.)",null,null,"Fúwùyuán: bùhǎoyìsi, jīntiān kèrén bǐjiào duō, wǒ mǎshàng qù chúfáng cuī.",null,"BODY277"],["顾客: 麻烦再加一副碗筷，又来了一位朋友。 (Phiền thêm một bộ bát đũa, có thêm một người bạn đến.)",null,null,"Gùkè: máfan zài jiā yīfù wǎnkuài, yòu lái le yīwèi péngyou.",null,"BODY278"],["顾客: (ăn xong) 服务员，买单！剩下的烤鱼帮我们打包。 (Bạn ơi, tính tiền! Chả cá còn lại gói giúp mang về.)",null,null,"Gùkè: fúwùyuán, mǎidān! Shèngxià de kǎoyú bāng wǒmen dǎbāo.",null,"BODY279"],["服务员: 好的，一共三百五十万盾。您刷卡还是付现金？ (Vâng, tổng 3 triệu 500. Quẹt thẻ hay tiền mặt ạ?)",null,null,"Fúwùyuán: hǎo de, yīgòng sānbǎiwǔshíwàn dùn. Nín shuākǎ háishì fùxiànjīn?",null,"BODY280"],["顾客: 刷卡。麻烦开一张公司的发票，这是公司的税号。 (Quẹt thẻ. Phiền xuất hóa đơn công ty, đây là mã số thuế.)",null,null,"Gùkè: shuākǎ. Máfan kāi yīzhāng gōngsī de fāpiào, zhè shì gōngsī de shuìhào.",null,"BODY281"],["服务员: 好的，请稍等。欢迎下次再来！ (Vâng, xin chờ chút. Hẹn gặp lại quý khách!)",null,null,"Fúwùyuán: hǎo de, qǐngshāoděng. Huānyíng xiàcì zài lái!",null,"BODY282"],["情景对话 3 — Mời khách TQ ăn món Việt (nói chuyện trên bàn ăn)",null,null,"Qíngjǐng duìhuà",null,"BODY283-C"],["A: 王总，这是越南有名的牛肉粉，汤是熬了十几个小时的。 (Vương tổng, đây là phở bò nổi tiếng VN, nước dùng ninh hơn chục tiếng.)",null,null,"Wáng zǒng, zhè shì Yuènán yǒumíng de niúròufěn, tāng shì áo le shíjǐgè xiǎoshí de.",null,"BODY284"],["B: 闻着就很香！要怎么吃？ (Ngửi đã thấy thơm! Ăn thế nào?)",null,null,"Wén zhe jiù hěn xiāng! Yào zěnme chī?",null,"BODY285"],["A: 可以挤一点柠檬，再加点辣椒。不习惯的话，香菜和生菜可以不放。 (Có thể vắt chút chanh, thêm ớt. Không quen thì không cho rau mùi, rau sống.)",null,null,"Kěyǐ jǐ yīdiǎn níngméng, zài jiādiǎn làjiāo. Bù xíguàn dehuà, xiāngcài hé shēngcài kěyǐ bù fàng.",null,"BODY286"],["B: 我先尝尝原味的……嗯，很鲜，一点也不油。 (Tôi nếm vị nguyên bản trước… Ừm, rất ngọt, không ngấy chút nào.)",null,null,"Wǒ xiān chángchang yuánwèi de…… ń, hěn xiān, yīdiǎn yě bù yóu.",null,"BODY287"],["A: 越南菜一般比较清淡，多用香草和鱼露。 (Món Việt thường thanh, dùng nhiều rau thơm và nước mắm.)",null,null,"Yuènán cài yībān bǐjiào qīngdàn, duōyòng xiāngcǎo hé yúlù.",null,"BODY288"],["B: 跟我们广西的米粉有点像，但是汤不一样。 (Hơi giống bún Quảng Tây chỗ chúng tôi, nhưng nước dùng khác.)",null,null,"Gēn wǒmen Guǎngxī de mǐfěn yǒudiǎnxiàng, dànshì tāng bù yīyàng.",null,"BODY289"],["A: 对，很多中国朋友都这么说。您再尝尝这个春卷，蘸这个酱。 (Đúng, nhiều bạn TQ cũng nói vậy. Ngài nếm nem này, chấm nước chấm này.)",null,null,"Duì, hěnduō Zhōngguó péngyou dōu zhème shuō. Nín zài chángchang zhège chūnjuǎn, zhàn zhège jiàng.",null,"BODY290"],["B: 好吃！这是用什么做的？ (Ngon! Làm bằng gì vậy?)",null,null,"Hǎochī! Zhè shì yòng shénme zuò de?",null,"BODY291"],["A: 里面是猪肉、木耳、粉丝和胡萝卜，外面是米纸，炸得很脆。 (Bên trong thịt lợn, mộc nhĩ, miến, cà rốt, bên ngoài bánh đa nem, rán giòn.)",null,null,"Lǐmiàn shì zhūròu, mù'ěr, fěnsī hé húluóbo, wàimiàn shì mǐ zhǐ, zhà de hěn cuì.",null,"BODY292"],["B: 来，我敬你一杯，谢谢你的安排！ (Nào, tôi mời anh một ly, cảm ơn anh đã sắp xếp!)",null,null,"Lái, wǒ jìng nǐ yībēi, xièxie nǐ de ānpái!",null,"BODY293"],["A: 不客气，干杯！祝我们合作顺利！ (Không có gì, cạn ly! Chúc hợp tác thuận lợi!)",null,null,"Bù kèqi, gānbēi! Zhù wǒmen hézuò shùnlì!",null,"BODY294"],["情景对话 4 — HỎI ĐƯỜNG 问路 (khách du lịch ↔ người địa phương, ~3 phút)",null,null,"Qíngjǐng duìhuà | Wènlù",null,"BODY295-C"],["游客: 不好意思，打扰一下，请问去还剑湖怎么走？ (Xin lỗi làm phiền, cho hỏi đi Hồ Hoàn Kiếm thế nào?)",null,null,"Yóukè: bùhǎoyìsi, dǎrǎo yīxià, qǐngwèn qù Huánjiàn Hú zěnme zǒu?",null,"BODY296"],["路人: 还剑湖啊？你走路去还是打车去？ (Hồ Hoàn Kiếm à? Bạn đi bộ hay đi taxi?)",null,null,"Lù rén: Huánjiàn Hú a? Nǐ zǒulù qù háishì dǎchē qù?",null,"BODY297"],["游客: 走路能到吗？远不远？ (Đi bộ đến được không? Có xa không?)",null,null,"Yóukè: zǒulù néng dào ma? Yuǎn bùyuǎn?",null,"BODY298"],["路人: 不太远，走路大概十五分钟。 (Không xa lắm, đi bộ khoảng 15 phút.)",null,null,"Lù rén: bù tài yuǎn, zǒulù dàgài shíwǔfēnzhōng.",null,"BODY299"],["游客: 那我走路去吧，顺便看看街景。 (Vậy tôi đi bộ, tiện ngắm phố.)",null,null,"Yóukè: nà wǒ zǒulù qù ba, shùnbiàn kànkan jiējǐng.",null,"BODY300"],["路人: 你沿着这条路一直往前走，走到第二个红绿灯往左拐。 (Bạn đi thẳng đường này, đến đèn đỏ thứ hai rẽ trái.)",null,null,"Lù rén: nǐ yánzhe zhè tiáo lù yīzhí wǎngqiánzǒu, zǒu dào dì'èrgè hónglǜdēng wǎng zuǒ guǎi.",null,"BODY301"],["游客: 第二个红绿灯往左拐，然后呢？ (Đèn đỏ thứ hai rẽ trái, rồi sao nữa?)",null,null,"Yóukè: dì'èrgè hónglǜdēng wǎng zuǒ guǎi, ránhòu ne?",null,"BODY302"],["路人: 拐过去以后再走两百米左右，会看到一个很大的十字路口，过了马路就是湖了。 (Rẽ xong đi thêm khoảng 200m sẽ thấy ngã tư rất lớn, qua đường là đến hồ.)",null,null,"Lù rén: guǎiguòqù yǐhòu zài zǒu liǎngbǎimǐ zuǒyòu, huì kàndào yīgè hěndà de shízìlùkǒu, guò le mǎlù jiùshì hú le.",null,"BODY303"],["游客: 不好意思，您说得有点快，能再说一遍吗？ (Xin lỗi, bạn nói hơi nhanh, nói lại được không?)",null,null,"Yóukè: bùhǎoyìsi, nín shuō de yǒudiǎn kuài, néng zàishuō yībiàn ma?",null,"BODY304"],["路人: 没问题。一直走，第二个红绿灯左拐，再走两百米，过马路就到了。 (Được thôi. Đi thẳng, đèn đỏ thứ hai rẽ trái, đi tiếp 200m, qua đường là đến.)",null,null,"Lù rén: méi wèntí. Yīzhí zǒu, dì'èrgè hónglǜdēng zuǒ guǎi, zài zǒu liǎngbǎimǐ, guò mǎlù jiù dào le.",null,"BODY305"],["游客: 明白了。附近有取款机吗？我想取点现金。 (Hiểu rồi. Gần đây có ATM không? Tôi muốn rút ít tiền mặt.)",null,null,"Yóukè: míngbai le. Fùjìn yǒu qǔkuǎnjī ma? Wǒ xiǎng qǔ diǎn xiànjīn.",null,"BODY306"],["路人: 有，就在前面那家银行门口，在药店的对面。 (Có, ngay cửa ngân hàng phía trước, đối diện hiệu thuốc.)",null,null,"Lù rén: yǒu, jiù zài qiánmiàn nà jiā yínháng ménkǒu, zài yàodiàn de duìmiàn.",null,"BODY307"],["游客: 还有，晚上我想去看水上木偶戏，剧院在哪儿？ (Còn nữa, tối nay tôi muốn xem múa rối nước, nhà hát ở đâu?)",null,null,"Yóukè: háiyǒu, wǎnshàng wǒ xiǎng qù kàn shuǐshàngmù'ǒuxì, jùyuàn zài nǎr?",null,"BODY308"],["路人: 就在湖的北边，你到了湖边问一下，大家都知道。 (Ở ngay phía bắc hồ, đến hồ hỏi một câu, ai cũng biết.)",null,null,"Lù rén: jiù zài hú de běibiān, nǐ dào le húbiān wèn yīxià, dàjiā dōu zhīdao.",null,"BODY309"],["游客: 太感谢了！您的中文说得真好。 (Cảm ơn nhiều! Tiếng Trung của bạn hay thật.)",null,null,"Yóukè: tài gǎnxiè le! Nín de Zhōngwén shuō de zhēn hǎo.",null,"BODY310"],["路人: 不客气，我在中国留过学。祝你玩得开心！ (Không có gì, tôi từng du học TQ. Chúc bạn đi chơi vui!)",null,null,"Lù rén: bù kèqi, wǒ zài Zhōngguó liú guò xué. Zhù nǐ wán de kāixīn!",null,"BODY311"],["情景对话 5 — Gọi xe / đi taxi 打车",null,null,"Qíngjǐng duìhuà | Dǎchē",null,"BODY312-C"],["乘客: 师傅，去内排机场，大概要多久？ (Bác tài, đi sân bay Nội Bài khoảng bao lâu?)",null,null,"Chéngkè: shīfu, qù Nèipái Jīchǎng, dàgài yào duōjiǔ?",null,"BODY313"],["司机: 现在不堵车的话四十分钟左右。 (Giờ không tắc thì khoảng 40 phút.)",null,null,"Sījī: xiànzài bùdǔchē dehuà sìshífēnzhōng zuǒyòu.",null,"BODY314"],["乘客: 我的航班是十点的，来得及吗？ (Chuyến bay của tôi lúc 10h, kịp không?)",null,null,"Chéngkè: wǒ de hángbān shì shídiǎn de, láidejí ma?",null,"BODY315"],["司机: 来得及，放心吧。您是国内航班还是国际航班？ (Kịp, yên tâm. Bay nội địa hay quốc tế?)",null,n
