sè yào duōjiǔ?",null,"BODY434"],["小芳: 印刷厂说两个星期就可以。在新包装到之前，我们可以先在箱子上贴一个红色的标签。 (Xưởng in nói 2 tuần là được. Trước khi có bao bì mới, có thể dán nhãn đỏ lên thùng trước.)",null,null,"Xiǎo Fāng: yìnshuāchǎng shuō liǎnggè xīngqī jiù kěyǐ. Zài xīn bāozhuāng dào zhīqián, wǒmen kěyǐ xiān zài xiāngzi shàng tiē yīgè hóngsè de biāoqiān.",null,"BODY435"],["经理: 好，这个方法简单有效。你写一个简单的方案，我今天就批。 (Được, cách này đơn giản hiệu quả. Bạn viết phương án ngắn, hôm nay tôi duyệt.)",null,null,"Jīnglǐ: hǎo, zhège fāngfǎ jiǎndān yǒuxiào. Nǐ xiě yīgè jiǎndān de fāng'àn, wǒ jīntiān jiù pī.",null,"BODY436"],["小芳: 好的，下午给您。 (Vâng, chiều em gửi anh.)",null,null,"Xiǎo Fāng: hǎo de, xiàwǔ gěi nín.",null,"BODY437"],["情景对话 2 — Đơn hàng liên tục trễ: tìm nguyên nhân gốc thay vì chỉ tăng ca (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY438-C"],["经理: 这个月已经第四次延误了。每次都是加班赶货，大家都很累，有没有更好的办法？ (Tháng này là lần trễ thứ 4 rồi. Lần nào cũng tăng ca chạy hàng, ai cũng mệt, có cách nào tốt hơn không?)",null,null,"Jīnglǐ: zhège yuè yǐjīng dìsìcì yánwù le. Měicì dōu shì jiābān gǎn huò, dàjiā dōu hěn lèi, yǒuméiyǒu gènghǎo de bànfǎ?",null,"BODY439"],["小黄: 我觉得每次加班赶货是治标不治本，我们需要找到根本原因。 (Em thấy lần nào cũng tăng ca là chữa ngọn không chữa gốc, chúng ta cần tìm nguyên nhân gốc.)",null,null,"Xiǎo Huáng: wǒ juéde měicì jiābān gǎn huò shì zhìbiāobùzhìběn, wǒmen xūyào zhǎodào gēnběnyuányīn.",null,"BODY440"],["经理: 你觉得根本原因是什么？ (Bạn thấy nguyên nhân gốc là gì?)",null,null,"Jīnglǐ: nǐ juéde gēnběnyuányīn shì shénme?",null,"BODY441"],["小黄: 我分析了这四次延误。表面上是生产慢，实际上是物料到得晚，四次里面有三次都是在等物料。 (Em phân tích 4 lần trễ. Bề ngoài là sản xuất chậm, thực chất là vật tư về muộn, 4 lần thì 3 lần là chờ vật tư.)",null,null,"Xiǎo Huáng: wǒ fēnxī le zhè sìcì yánwù. Biǎomiàn shàng shì shēngchǎn màn, shíjìshàng shì wùliào dào de wǎn, sìcì lǐmiàn yǒu sāncì dōu shì zài děng wùliào.",null,"BODY442"],["采购: 物料晚到是因为计划部给我们需求的时间太晚了，供应商根本来不及。 (Vật tư về muộn vì kế hoạch gửi nhu cầu cho chúng tôi quá muộn, NCC không kịp.)",null,null,"Cǎigòu: wùliào wǎn dào shìyīnwèi jìhuà bù gěi wǒmen xūqiú de shíjiān tàiwǎn le, gōngyìngshāng gēnběn láibùjí.",null,"BODY443"],["小黄: 对，这就是问题的关键。现在计划部是每周一才给采购下需求，可是很多物料的采购周期要十天。 (Đúng, đó là mấu chốt. Hiện kế hoạch thứ 2 hằng tuần mới gửi nhu cầu cho mua hàng, nhưng nhiều vật tư chu kỳ mua mất 10 ngày.)",null,null,"Xiǎo Huáng: duì, zhè jiùshì wèntí de guānjiàn. Xiànzài jìhuà bù shì měizhōu yī cái gěi cǎigòu xià xūqiú, kěshì hěnduō wùliào de cǎigòu zhōuqī yào shítiān.",null,"BODY444"],["经理: 那你的建议是？ (Vậy đề xuất của bạn là?)",null,null,"Jīnglǐ: nà nǐ de jiànyì shì?",null,"BODY445"],["小黄: 建议从需求预测入手。第一，销售部每个月月底给计划部下个月的订单预测；第二，常用的十种物料设一个安全库存，保持两周的用量。 (Đề nghị bắt đầu từ dự báo nhu cầu. Một, cuối mỗi tháng phòng kinh doanh gửi kế hoạch dự báo đơn tháng sau; hai, đặt tồn kho an toàn cho 10 loại vật tư thường dùng, duy trì lượng dùng 2 tuần.)",null,null,"Xiǎo Huáng: jiànyì cóng xūqiúyùcè rùshǒu. Dìyī, xiāoshòubù měigè yuè yuèdǐ gěi jìhuà bùxià gè yuè de dìngdān yùcè; dì'èr, chángyòng de shízhǒng wùliào shè yīgè ānquán kùcún, bǎochí liǎngzhōu de yòngliàng.",null,"BODY446"],["销售: 预测我们可以给，但是不一定准，客户经常临时加单。 (Dự báo chúng tôi có thể gửi, nhưng chưa chắc chính xác, khách hay đột xuất thêm đơn.)",null,null,"Xiāoshòu: yùcè wǒmen kěyǐ gěi, dànshì bù yīdìng zhǔn, kèhù jīngcháng línshí jiā dān.",null,"BODY447"],["小黄: 我明白，所以才需要安全库存。预测不准的部分，用安全库存来补。 (Em hiểu, nên mới cần tồn kho an toàn. Phần dự báo không chính xác, dùng tồn an toàn bù.)",null,null,"Xiǎo Huáng: wǒ míngbai, suǒyǐ cái xūyào ānquán kùcún. Yùcè bùzhǔn de bùfen, yòng ānquán kùcún lái bǔ.",null,"BODY448"],["财务: 安全库存要占多少资金？ (Tồn kho an toàn chiếm bao nhiêu vốn?)",null,null,"Cáiwù: ānquán kùcún yào zhàn duōshǎo zījīn?",null,"BODY449"],["小黄: 我算过，大概八亿盾。但是这个月四次加班的加班费加上空运费，一共已经花了三亿多。 (Em tính rồi, khoảng 800 triệu. Nhưng tiền tăng ca 4 lần cộng phí hàng không tháng này đã tốn tổng hơn 300 triệu.)",null,null,"Xiǎo Huáng: wǒ suàn guò, dàgài bāyì dùn. Dànshì zhège yuè sìcì jiābān de jiābānfèi jiāshàng kōngyùn fèi, yīgòng yǐjīng huā le sān yìduō.",null,"BODY450"],["经理: 也就是说，安全库存三个月就能把成本省回来？ (Tức là tồn kho an toàn 3 tháng là tiết kiệm lại được chi phí?)",null,null,"Jīnglǐ: yějiùshìshuō, ānquán kùcún sāngè yuè jiù néng bǎ chéngběn shěng huílái?",null,"BODY451"],["小黄: 对，而且大家不用天天加班了。 (Đúng, mà mọi người không phải ngày nào cũng tăng ca nữa.)",null,null,"Xiǎo Huáng: duì, érqiě dàjiā bùyòng tiāntiān jiābān le.",null,"BODY452"],["经理: 好，这个思路很清楚。下周一开始试行，一个月以后我们看看效果。 (Được, hướng suy nghĩ rất rõ ràng. Thứ 2 tuần sau bắt đầu thử, một tháng sau xem hiệu quả.)",null,null,"Jīnglǐ: hǎo, zhège sīlù hěn qīngchu. Xiàzhōuyī kāishǐ shìxíng, yīgèyuè yǐhòu wǒmen kànkan xiàoguǒ.",null,"BODY453"],["情景对话 3 — Đề xuất cải tiến kho với sếp: đưa hai phương án để chọn",null,null,"Qíngjǐng duìhuà",null,"BODY454-C"],["小海: 经理，关于仓库找货太慢的问题，我准备了两个方案，想听听您的意见。 (Giám đốc, về chuyện kho tìm hàng quá chậm, em chuẩn bị 2 phương án, muốn nghe ý kiến anh.)",null,null,"Xiǎo Hǎi: jīnglǐ, guānyú cāngkù zhǎo huò tàimàn de wèntí, wǒ zhǔnbèi le liǎnggè fāng'àn, xiǎng tīngtīng nín de yìjiàn.",null,"BODY455"],["经理: 好，你说吧。 (Được, em nói đi.)",null,null,"Jīnglǐ: hǎo, nǐ shuō ba.",null,"BODY456"],["小海: 先说一下现状：现在仓库有两千多种物料，工人找一种物料平均要十五分钟，每天光找货就浪费了二十多个小时。 (Trước hết hiện trạng: kho hiện có hơn 2.000 loại vật tư, công nhân tìm một loại trung bình 15 phút, mỗi ngày chỉ tìm hàng đã lãng phí hơn 20 tiếng.)",null,null,"Xiǎo Hǎi: xiān shuō yīxià xiànzhuàng: xiànzài cāngkù yǒu liǎngqiānduōzhǒng wùliào, gōngrén zhǎo yīzhǒng wùliào píngjūn yào shíwǔfēnzhōng, měitiān guāng zhǎo huò jiù làngfèi le èrshíduōgè xiǎoshí.",null,"BODY457"],["经理: 这么多！原因是什么？ (Nhiều vậy! Nguyên nhân là gì?)",null,null,"Jīnglǐ: zhème duō! Yuányīn shì shénme?",null,"BODY458"],["小海: 主要原因是货架没有编号，东西放在哪儿全靠老员工记；其次是系统里的位置信息跟实际不一样。 (Nguyên nhân chính là kệ không đánh số, đồ để đâu toàn nhờ nhân viên cũ nhớ; tiếp theo là thông tin vị trí trong hệ thống khác thực tế.)",null,null,"Xiǎo Hǎi: zhǔyào yuányīn shì huòjià méiyǒu biānhào, dōngxi fàngzài nǎr quán kào lǎo yuángōng jì; qícì shì xìtǒng lǐ de wèizhì xìnxī gēn shíjì bù yīyàng.",null,"BODY459"],["小海: 方案一：给所有货架编号，每个物料贴二维码，扫码就能知道位置。投入大概一亿盾，一个月能完成。 (Phương án một: đánh số toàn bộ kệ, mỗi vật tư dán mã QR, quét là biết vị trí. Đầu tư khoảng 100 triệu, một tháng hoàn thành.)",null,null,"Xiǎo Hǎi: fāng'àn yī: gěi suǒyǒu huòjià biānhào, měigè wùliào tiē èrwéimǎ, sǎo mǎ jiù néng zhīdao wèizhì. Tóurù dàgài yīyì dùn, yīgèyuè néng wánchéng.",null,"BODY460"],["小海: 方案二：买一套智能仓储系统，自动管理库位。投入大概十五亿，要半年才能上线。 (Phương án hai: mua hệ thống kho thông minh, tự động quản lý vị trí. Đầu tư khoảng 1,5 tỷ, nửa năm mới đưa vào dùng.)",null,null,"Xiǎo Hǎi: fāng'àn èr: mǎi yītào zhìnéng cāngchǔ xìtǒng, zìdòng guǎnlǐ kù wèi. Tóurù dàgài shíwǔ yì, yào bànnián cáinéng shàngxiàn.",null,"BODY461"],["经理: 你推荐哪个？ (Em đề xuất cái nào?)",null,null,"Jīnglǐ: nǐ tuījiàn nǎge?",null,"BODY462"],["小海: 我推荐先做方案一。这个方案的好处是成本低、见效快，一个月就能把找货时间降到三分钟以内。不过需要注意，每次物料换位置，都要及时更新系统。 (Em đề xuất làm phương án một trước. Lợi ích là chi phí thấp, hiệu quả nhanh, một tháng là giảm thời gian tìm hàng xuống dưới 3 phút. Nhưng cần lưu ý mỗi lần vật tư đổi vị trí phải cập nhật hệ thống kịp thời.)",null,null,"Xiǎo Hǎi: wǒ tuījiàn xiān zuò fāng'àn yī. Zhège fāng'àn de hǎochù shì chéngběndī, jiànxiàokuài, yīgèyuè jiù néng bǎ zhǎo huò shíjiān jiàngdào sānfēnzhōng yǐnèi. Bùguò xūyào zhùyì, měicì wùliào huàn wèizhì, dōu yào jíshí gèngxīn xìtǒng.",null,"BODY463"],["经理: 那方案二呢？ (Còn phương án hai?)",null,null,"Jīnglǐ: nà fāng'àn èr ne?",null,"BODY464"],["小海: 方案二从长远来看更好，但是现在投入太大。我建议明年公司扩建新仓库的时候再考虑。 (Phương án hai lâu dài tốt hơn, nhưng giờ đầu tư quá lớn. Em đề nghị năm sau khi công ty mở rộng kho mới hãy cân nhắc.)",null,null,"Xiǎo Hǎi: fāng'àn èr cóng chángyuǎn láikàn gènghǎo, dànshì xiànzài tóurù tài dà. Wǒ jiànyì míngnián gōngsī kuòjiàn xīn cāngkù de shíhou zài kǎolǜ.",null,"BODY465"],["经理: 有道理。方案一需要多少人？ (Có lý. Phương án một cần bao nhiêu người?)",null,null,"Jīnglǐ: yǒu dàolǐ. Fāng'àn yī xūyào duōshǎo rén?",null,"BODY466"],["小海: 需要四个人做两个周末，不影响平时的发货。 (Cần 4 người làm 2 cuối tuần, không ảnh hưởng giao hàng ngày thường.)",null,null,"Xiǎo Hǎi: xūyào sìgè rén zuò liǎnggè zhōumò, bù yǐngxiǎng píngshí de fāhuò.",null,"BODY467"],["经理: 好，批准方案一。做完以后统计一下效果，下个月汇报给我。 (Được, duyệt phương án một. Làm xong thống kê hiệu quả, tháng sau báo cáo tôi.)",null,null,"Jīnglǐ: hǎo, pīzhǔn fāng'àn yī. Zuò wán yǐhòu tǒngjì yīxià xiàoguǒ, xiàgèyuè huìbào gěi wǒ.",null,"BODY468"],["情景对话 4 — Khách đòi giải pháp khi đơn hàng bị trễ (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY469-C"],["客户: 阮经理，我们的订单又晚了，你们到底有没有解决问题的办法？ (Giám đốc Nguyễn, đơn của chúng tôi lại trễ, các anh rốt cuộc có cách giải quyết không?)",null,null,"Kèhù: Ruǎn jīnglǐ, wǒmen de dìngdān yòu wǎn le, nǐmen dàodǐ yǒuméiyǒu jiějuéwèntí de bànfǎ?",null,"BODY470"],["阮经理: 王总，非常抱歉。这次我们做了详细的分析，今天想跟您说一下原因和我们的改进方案。 (Vương tổng, rất xin lỗi. Lần này chúng tôi đã phân tích chi tiết, hôm nay muốn trình bày với ngài nguyên nhân và phương án cải tiến.)",null,null,"Ruǎn jīnglǐ: Wáng zǒng, fēicháng bàoqiàn. Zhècì wǒmen zuò le xiángxì de fēnxī, jīntiān xiǎng gēn nín shuō yīxià yuányīn hé wǒmen de gǎijìn fāng'àn.",null,"BODY471"],["客户: 你说吧。 (Anh nói đi.)",null,null,"Kèhù: nǐ shuō ba.",null,"BODY472"],["阮经理: 主要原因是我们的一台关键设备老化，这三个月坏了五次，每次修理要两到三天。 (Nguyên nhân chính là một máy then chốt bị lão hóa, 3 tháng hỏng 5 lần, mỗi lần sửa 2–3 ngày.)",null,null,"Ruǎn jīnglǐ: zhǔyào yuányīn shì wǒmen de yītái guānjiànshèbèi lǎohuà, zhè sāngè yuè huài le wǔcì, měicì xiūlǐ yào liǎng dào sāntiān.",null,"BODY473"],["客户: 那你们打算怎么办？ (Vậy các anh định làm thế nào?)",null,null,"Kèhù: nà nǐmen dǎsuàn zěnmebàn?",null,"BODY474"],["阮经理: 针对这个问题，我们有两个措施：一是短期的，我们已经从别的工厂借了一台同样的设备，下周就能到；二是长期的，我们已经订购了一台新设备，下个月底安装好。 (Về vấn đề này chúng tôi có 2 biện pháp: một là ngắn hạn, đã mượn một máy tương tự từ nhà máy khác, tuần sau về; hai là dài hạn, đã đặt mua máy mới, cuối tháng sau lắp xong.)",null,null,"Ruǎn jīnglǐ: zhēnduì zhège wèntí, wǒmen yǒu liǎnggè cuòshī: yī shì duǎnqī de, wǒmen yǐjīng cóng biéde gōngchǎng jiè le yītái tóngyàng de shèbèi, xiàzhōu jiù néng dào; èr shì chángqī de, wǒmen yǐjīng dìnggòu le yītái xīn shèbèi, xià gè yuèdǐ ānzhuāng hǎo.",null,"BODY475"],["客户: 借来的设备能保证质量吗？ (Máy mượn có đảm bảo chất lượng không?)",null,null,"Kèhù: jièlái de shèbèi néng bǎozhèngzhìliàng ma?",null,"BODY476"],["阮经理: 能。我们会先试生产两百件，品质部全检合格以后才正式用。 (Được. Chúng tôi sẽ chạy thử 200 cái, QC kiểm 100% đạt mới chính thức dùng.)",null,null,"Ruǎn jīnglǐ: néng. Wǒmen huì xiān shìshēngchǎn liǎngbǎi jiàn, pǐnzhì bù quán jiǎn hégé yǐhòu cái zhèngshì yòng.",null,"BODY477"],["客户: 那我这批晚了的货呢？ (Còn lô hàng bị trễ của tôi?)",null,null,"Kèhù: nà wǒ zhè pī wǎn le de huò ne?",null,"BODY478"],["阮经理: 这批货我们会在三天内交一半，剩下的一半七天内交完。为了不影响您的生产，第一批我们用空运，运费由我们承担。 (Lô này trong 3 ngày giao một nửa, nửa còn lại trong 7 ngày. Để không ảnh hưởng sản xuất của ngài, đợt đầu đi hàng không, phí vận chuyển chúng tôi chịu.)",null,null,"Ruǎn jīnglǐ: zhè pīhuò wǒmen huì zài sāntiān nèi jiāo yībàn, shèngxià de yībàn qītiān nèi jiāowán. Wèile bù yǐngxiǎng nín de shēngchǎn, dìyīpī wǒmen yòng kōngyùn, yùnfèi yóu wǒmen chéngdān.",null,"BODY479"],["客户: 万一新设备到了以后也有问题呢？ (Lỡ máy mới về cũng có vấn đề thì sao?)",null,null,"Kèhù: wànyī xīn shèbèi dào le yǐhòu yě yǒu wèntí ne?",null,"BODY480"],["阮经理: 万一新设备出问题，我们的备用方案是继续用借来的那台，借期我们已经谈好了，最长可以借三个月。 (Lỡ máy mới có vấn đề, phương án dự phòng là tiếp tục dùng máy mượn, thời hạn mượn đã thỏa thuận, tối đa 3 tháng.)",null,null,"Ruǎn jīnglǐ: wànyī xīn shèbèi chū wèntí, wǒmen de bèiyòng fāng'àn shì jìxù yòng jièlái de nà tái, jièqī wǒmen yǐjīng tán hǎo le, zuìcháng kěyǐ jiè sāngè yuè.",null,"BODY481"],["客户: 好，你们考虑得比较周到。希望这是最后一次延误。 (Được, các anh tính toán khá chu đáo. Mong đây là lần trễ cuối cùng.)",null,null,"Kèhù: hǎo, nǐmen kǎolǜ de bǐjiào zhōudào. Xīwàng zhè shì zuìhòu yīcì yánwù.",null,"BODY482"],["阮经理: 一定。以后每周五我会给您发一份生产进度报告，有任何风险提前告诉您。 (Nhất định. Sau này thứ 6 hằng tuần tôi gửi ngài báo cáo tiến độ sản xuất, có rủi ro gì báo trước.)",null,null,"Ruǎn jīnglǐ: yīdìng. Yǐhòu měizhōuwǔ wǒhuì gěi nín fā yīfèn shēngchǎn jìndù bàogào, yǒu rènhé fēngxiǎn tíqián gàosunín.",null,"BODY483"],["情景对话 5 — (HSK5) Thuyết trình đề xuất với ban giám đốc: đánh giá khả thi, rủi ro và dự phòng",null,null,"Qíngjǐng duìhuà",null,"BODY484-C"],["小林: 各位领导好，今天我想汇报一个关于降低人工成本的方案。 (Kính chào các lãnh đạo, hôm nay tôi xin báo cáo một phương án giảm chi phí nhân công.)",null,null,"Xiǎo Lín: gèwèi lǐngdǎo hǎo, jīntiān wǒ xiǎng huìbào yīgè guānyú jiàngdī réngōngchéngběn de fāng'àn.",null,"BODY485"],["小林: 先说背景：明年一月越南的最低工资要上调百分之六，按照我们现在八百个工人计算，一年的人工成本会增加大概三十亿盾。 (Bối cảnh: tháng 1 năm sau lương tối thiểu VN tăng 6%, theo 800 công nhân hiện nay, chi phí nhân công một năm tăng khoảng 3 tỷ.)",null,null,"Xiǎo Lín: xiān shuō bèijǐng: míngnián yīyuè Yuènán de zuìdīgōngzī yào shàngtiáo bǎifēnzhīliù, ànzhào wǒmen xiànzài bābǎigè gōngrén jìsuàn, yīnián de réngōngchéngběn huì zēngjiā dàgài sānshí yì dùn.",null,"BODY486"],["总经理: 你的方案是什么？ (Phương án của bạn là gì?)",null,null,"Zǒngjīnglǐ: nǐ de fāng'àn shì shénme?",null,"BODY487"],["小林: 我建议从包装工序入手。包装线现在有一百二十个工人，工作重复性高，最适合用自动化设备代替。 (Tôi đề nghị bắt đầu từ công đoạn đóng gói. Chuyền đóng gói hiện có 120 công nhân, công việc lặp lại cao, phù hợp nhất để thay bằng thiết bị tự động.)",null,null,"Xiǎo Lín: wǒ jiànyì cóng bāozhuāng gōngxù rùshǒu. Bāozhuāng xiàn xiànzài yǒu yībǎi'èrshígè gōngrén, gōngzuò chóngfùxìng gāo, zuì shìhé yòng zìdònghuà shèbèi dàitì.",null,"BODY488"],["小林: 具体来说，购买四台自动包装机，可以减少六十个岗位。设备投入一共四十亿，每年能节省人工成本二十亿，两年就能收回投资。 (Cụ thể, mua 4 máy đóng gói tự động, giảm được 60 vị trí. Đầu tư thiết bị tổng 4 tỷ, mỗi năm tiết kiệm 2 tỷ nhân công, 2 năm thu hồi vốn.)",null,null,"Xiǎo Lín: jùtǐláishuō, gòumǎi sìtái zìdòng bāozhuāngjī, kěyǐ jiǎnshǎo liùshígè gǎngwèi. Shèbèi tóurù yīgòng sìshíyì, měinián néng jiéshěng réngōngchéngběn èrshíyì, liǎngnián jiù néng shōuhuí tóuzī.",null,"BODY489"],["财务总监: 两年回本听起来不错，可是四十亿是一次性投入，今年的现金流比较紧张。 (2 năm hoàn vốn nghe hay, nhưng 4 tỷ là đầu tư một lần, dòng tiền năm nay khá eo hẹp.)",null,null,"Cáiwùzǒngjiān: liǎngnián huí běn tīng qǐlái bùcuò, kěshì sìshíyì shì yīcìxìng tóurù, jīnnián de xiànjīnliú bǐjiào jǐnzhāng.",null,"BODY490"],["小林: 我理解。从可行性来看，我们可以分两期：第一期先买两台，二十亿，明年一季度上线；第二期根据第一期的效果，下半年再买两台。 (Tôi hiểu. Xét khả thi, có thể chia 2 giai đoạn: giai đoạn một mua trước 2 máy, 2 tỷ, quý 1 năm sau vận hành; giai đoạn hai dựa vào hiệu quả giai đoạn một, nửa cuối năm mua thêm 2 máy.)",null,null,"Xiǎo Lín: wǒ lǐjiě. Cóng kěxíngxìng láikàn, wǒmen kěyǐ fēn liǎngqī: dìyīqī xiānmǎi liǎngtái, èrshíyì, míngnián yījìdù shàngxiàn; dì'èrqī gēnjù dìyīqī de xiàoguǒ, xiàbànnián zài mǎi liǎngtái.",null,"BODY491"],["人事总监: 减少六十个岗位，工人会不会有意见？会不会影响士气？ (Giảm 60 vị trí, công nhân có ý kiến không? Có ảnh hưởng tinh thần không?)",null,null,"Rénshì zǒngjiān: jiǎnshǎo liùshígè gǎngwèi, gōngrén huì bùhuì yǒu yìjiàn? Huì bùhuì yǐngxiǎng shìqì?",null,"BODY492"],["小林: 这是我评估的最大风险。从风险来看，我们不打算裁员，而是把这六十个人调到明年要扩建的二号车间。人事部的数据显示，二号车间明年正好需要七十个人。 (Đây là rủi ro lớn nhất tôi đánh giá. Xét rủi ro, chúng tôi không định cắt giảm, mà điều 60 người này sang xưởng 2 mở rộng năm sau. Số liệu nhân sự cho thấy xưởng 2 năm sau vừa cần 70 người.)",null,null,"Xiǎo Lín: zhè shì wǒ pínggū de zuìdà fēngxiǎn. Cóng fēngxiǎn láikàn, wǒmen bù dǎsuàn cáiyuán, érshì bǎ zhè liùshígè rén diào dào míngnián yào kuòjiàn de èrhào chējiān. Rénshìbù de shùjù xiǎnshì, èrhào chējiān míngnián zhènghǎo xūyào qīshí gèrén.",null,"BODY493"],["人事总监: 这样的话，不但不用裁员，还能节省招聘和培训的成本。 (Như vậy không những không phải cắt giảm mà còn tiết kiệm chi phí tuyển dụng, đào tạo.)",null,null,"Rénshì zǒngjiān: zhèyàngdehuà, bùdàn bùyòng cáiyuán, hái néng jiéshěng zhāopìn hé péixùn de chéngběn.",null,"BODY494"],["总经理: 设备方面有什么风险？ (Về thiết bị có rủi ro gì?)",null,null,"Zǒngjīnglǐ: shèbèi fāngmiàn yǒu shénme fēngxiǎn?",null,"BODY495"],["小林: 主要有两个风险：一是新设备调试期可能不稳定；二是我们的技术员还不会维护。万一设备出问题，我们的备用方案是：调试期的前三个月保留三十个包装工人，同时请供应商派工程师驻厂一个月，培训我们的技术员。 (Chủ yếu 2 rủi ro: một là thời gian chạy thử máy mới có thể không ổn định; hai là kỹ thuật viên chưa biết bảo trì. Lỡ máy có vấn đề, phương án dự phòng: 3 tháng đầu giữ lại 30 công nhân đóng gói, đồng thời mời NCC cử kỹ sư túc trực tại nhà máy một tháng đào tạo kỹ thuật viên.)",null,null,"Xiǎo Lín: zhǔyào yǒu liǎnggè fēngxiǎn: yī shì xīn shèbèi tiáoshìqī kěnéng bù wěndìng; èr shì wǒmen de jìshùyuán hái bùhuì wéihù. Wànyī shèbèi chū wèntí, wǒmen de bèiyòng fāng'àn shì: tiáoshìqī de qián sāngè yuè bǎoliú sānshígè bāozhuānggōngrén, tóngshí qǐng gōngyìngshāng pài gōngchéngshī zhùchǎng yīgèyuè, péixùn wǒmen de jìshùyuán.",null,"BODY496"],["财务总监: 第一期二十亿，我们可以考虑用设备租赁的方式，减少一次性付款的压力。 (Giai đoạn một 2 tỷ, có thể cân nhắc thuê tài chính thiết bị để giảm áp lực trả một lần.)",null,null,"Cáiwùzǒngjiān: dìyīqī èrshíyì, wǒmen kěyǐ kǎolǜ yòng shèbèi zūlìn de fāngshì, jiǎnshǎo yīcìxìng fùkuǎn de yālì.",null,"BODY497"],["小林: 这个建议很好，我会再去了解一下租赁的条件和成本，下周补充到方案里。 (Đề xuất rất hay, tôi sẽ tìm hiểu thêm điều kiện và chi phí thuê, tuần sau bổ sung vào phương án.)",null,null,"Xiǎo Lín: zhège jiànyì hěn hǎo, wǒhuì zài qù liǎojiě yīxià zūlìn de tiáojiàn hé chéngběn, xiàzhōu bǔchōng dào fāng'àn lǐ.",null,"BODY498"],["总经理: 好。我觉得这个方案思路很清楚，风险也考虑到了。原则上同意第一期，小林下周把租赁的部分补充完整，再正式提交。 (Được. Tôi thấy phương án rất rõ ràng, rủi ro cũng đã tính đến. Về nguyên tắc đồng ý giai đoạn một, tuần sau Tiểu Lâm bổ sung đầy đủ phần thuê tài chính rồi nộp chính thức.)",null,null,"Zǒngjīnglǐ: hǎo. Wǒ juéde zhège fāng'àn sīlù hěn qīngchu, fēngxiǎn yě kǎolǜ dào le. Yuánzéshàng tóngyì dìyīqī, Xiǎo Lín xiàzhōu bǎ zūlìn de bùfen bǔchōng wánzhěng, zài zhèngshì tíjiāo.",null,"BODY499"],["小林: 谢谢各位领导！ (Cảm ơn các lãnh đạo!)",null,null,"Xiǎo Lín: xièxie gèwèi lǐngdǎo!",null,"BODY500"],["BÀI NÓI MẪU — Đề xuất cải tiến 3 phút theo khung 5 bước (HSK5)",null,null,null,null,"BODY501-C"],["我想提一个关于减少会议时间的建议。先说现象：我统计了一下，我们部门每个人每周平均要开八个小时的会，占了工作时间的五分之一。主要原因有两个：第一，很多会议没有议程，讨论起来很容易跑题；第二，很多人被邀请参加跟自己关系不大的会议。针对这个问题，我有两个建议：一是所有会议必须提前一天发议程，没有议程的会可以不参加；二是会议时间默认改成三十分钟，超过一个小时需要经理批准。从可行性来看，这两个建议不需要任何投入，下周就可以开始；从风险来看，可能有的同事一开始不习惯，所以我建议先在我们部门试一个月。万一效果不好，我们再调整。我预计每个人每周能节省三个小时，用来做更重要的工作。谢谢大家！",null,null,"Wǒ xiǎng tí yīgè guānyú jiǎnshǎo huìyì shíjiān de jiànyì. Xiān shuō xiànxiàng: wǒ tǒngjì le yīxià, wǒmen bùmén měigè rén měizhōu píngjūn yào kāi bāgè xiǎoshí de huì, zhàn le gōngzuò shíjiān de wǔfēnzhīyī. Zhǔyào yuányīn yǒu liǎnggè: dìyī, hěnduō huìyì méiyǒu yìchéng, tǎolùn qǐlái hěn róngyì pǎotí; dì'èr, hěnduō rén bèi yāoqǐng cānjiā gēn zìjǐ guānxibùdà de huìyì. Zhēnduì zhège wèntí, wǒ yǒu liǎnggè jiànyì: yī shì suǒyǒu huìyì bìxū tíqián yītiān fā yìchéng, méiyǒu yìchéng de huì kěyǐ bù cānjiā; èr shì huìyì shíjiān mòrèn gǎichéng sānshífēnzhōng, chāoguò yīgè xiǎoshí xūyào jīnglǐ pīzhǔn. Cóng kěxíngxìng láikàn, zhè liǎnggè jiànyì bù xūyào rènhé tóurù, xiàzhōu jiù kěyǐ kāishǐ; cóng fēngxiǎn láikàn, kěnéng yǒu de tóngshì yī kāishǐ bù xíguàn, suǒyǐ wǒ jiànyì xiān zài wǒmen bùmén shì yīgèyuè. Wànyī xiàoguǒ bùhǎo, wǒmen zài tiáozhěng. Wǒ yùjì měigè rén měizhōu néng jiéshěng sāngè xiǎoshí, yònglái zuò gèng zhòngyào de gōngzuò. Xièxie dàjiā!",null,"BODY502"],["引导练习 GUIDED SPEAKING — GV đưa một vấn đề, HS phân tích 2 nguyên nhân + 2 giải pháp",null,null,"Yǐndǎo liànxí",null,"BODY503-C"],["1. Hỏi: 公司的新员工离职率很高，你觉得是什么原因？怎么解决？ (Tỷ lệ nghỉ việc của nhân viên mới rất cao, bạn thấy nguyên nhân gì? Giải quyết thế nào?)",null,null,"Gōngsī de xīn yuángōng lízhí lǜ hěn gāo, nǐ juéde shì shénme yuányīn? Zěnme jiějué?",null,"BODY504"],["Đáp: 我觉得主要原因是入职培训不够，新人不知道怎么做；其次是没有人带。我建议：一是做一周的系统培训；二是每个新人安排一个老员工当师傅，带三个月。 (Nguyên nhân chính là đào tạo đầu vào không đủ, người mới không biết làm; tiếp theo là không có người kèm. Đề xuất: một là đào tạo bài bản một tuần; hai là mỗi người mới có một nhân viên cũ kèm 3 tháng.)",null,null,"Wǒ juéde zhǔyào yuányīn shì rùzhí péixùn bùgòu, xīnrén bù zhīdao zěnme zuò; qícì shì méiyǒu rén dài. Wǒ jiànyì: yī shì zuò yīzhōu de xìtǒng péixùn; èr shì měigè xīnrén ānpái yīgè lǎo yuángōng dāng shīfu, dài sāngè yuè.",null,"BODY505"],["2. Hỏi: 客户总是说我们的报价太慢，怎么改进？ (Khách luôn nói báo giá của chúng ta quá chậm, cải tiến thế nào?)",null,null,"Kèhù zǒngshì shuō wǒmen de bàojià tàimàn, zěnme gǎijìn?",null,"BODY506"],["Đáp: 表面上是销售不够努力，实际上是报价需要经过三个部门，流程太长。建议从流程入手：常规产品做一个价格表，销售可以直接报价；特殊产品才需要走审批。 (Bề ngoài là sales chưa cố gắng, thực chất báo giá phải qua 3 phòng, quy trình quá dài. Đề nghị bắt đầu từ quy trình: sản phẩm thông thường lập bảng giá, sales báo giá trực tiếp; sản phẩm đặc biệt mới cần duyệt.)",null,null,"Biǎomiàn shàng shì xiāoshòu bùgòu nǔlì, shíjìshàng shì bàojià xūyào jīngguò sāngè bùmén, liúchéng tài zhǎng. Jiànyì cóng liúchéng rùshǒu: chángguī chǎnpǐn zuò yīgè jiàgébiǎo, xiāoshòu kěyǐ zhíjiē bàojià; tèshū chǎnpǐn cái xūyào zǒu shěnpī.",null,"BODY507"],["3. Hỏi: (HSK5) 公司想开拓胡志明市的市场，你会怎么评估这个计划的风险？ (Công ty muốn mở rộng thị trường TP.HCM, bạn đánh giá rủi ro kế hoạch thế nào?)",null,null,"Gōngsī xiǎng kāituò Húzhìmíng Shì de shìchǎng, nǐ huì zěnme pínggū zhège jìhuà de fēngxiǎn?",null,"BODY508"],["Đáp: 我会从三个方面评估：一是市场风险，南部的竞争对手多不多；二是成本风险，开办事处的投入多久能收回；三是人员风险，能不能招到合适的销售。针对每个风险，我都会准备一个备用方案，比如先跟当地的代理商合作，而不是直接开办事处。 (Đánh giá từ 3 mặt: rủi ro thị trường – đối thủ miền Nam nhiều không; rủi ro chi phí – mở văn phòng bao lâu thu hồi vốn; rủi ro nhân sự – tuyển được sales phù hợp không. Với mỗi rủi ro chuẩn bị một phương án dự phòng, như hợp tác với đại lý địa phương trước thay vì mở văn phòng ngay.)",null,null,"Wǒhuì cóng sāngè fāngmiàn pínggū: yī shì shìchǎng fēngxiǎn, nánbù de jìngzhēngduìshǒu duōbùduō; èr shì chéngběn fēngxiǎn, kāi bànshìchù de tóurù duōjiǔ néng shōuhuí; sān shì rényuán fēngxiǎn, néng bùnéng zhāo dào héshì de xiāoshòu. Zhēnduì měigè fēngxiǎn, wǒ dōu huì zhǔnbèi yīgè bèiyòng fāng'àn, bǐrú xiān gēn dāngdì de dàilǐshāng hézuò, ér bùshì zhíjiē kāi bànshìchù.",null,"BODY509"],["情景模拟 ROLE-PLAY — Đơn hàng trễ, khách (GV) đòi giải pháp ngay. Vòng 2 (bất ngờ): giải pháp đầu tiên bị khách bác bỏ, HS phải đưa phương án dự phòng",null,null,"Qíngjǐng mónǐ",null,"BODY510-C"],["GV: 你们的货已经晚了一个星期，我们的生产线下周就要停了，你们必须马上给我一个解决方案！ (Hàng các anh đã trễ một tuần, chuyền của chúng tôi tuần sau sẽ dừng, các anh phải đưa ngay giải pháp!)",null,null,"Nǐmen de huò yǐjīng wǎn le yīgè xīngqī, wǒmen de shēngchǎnxiàn xiàzhōu jiùyào tíng le, nǐmen bìxū mǎshàng gěi wǒ yīgè jiějuéfāng'àn!",null,"BODY511"],["HS: 王总，非常抱歉。我先说一下原因：主要是我们的原材料供应商遇到了停电，停产了五天。 (Vương tổng, rất xin lỗi. Tôi xin nói nguyên nhân trước: chủ yếu NCC nguyên liệu của chúng tôi bị mất điện, dừng sản xuất 5 ngày.)",null,null,"Wáng zǒng, fēicháng bàoqiàn. Wǒ xiān shuō yīxià yuányīn: zhǔyào shì wǒmen de yuáncáiliào gōngyìngshāng yùdào le tíngdiàn, tíngchǎn le wǔtiān.",null,"BODY512"],["GV: 原因我不关心，我只想知道什么时候能到。 (Nguyên nhân tôi không quan tâm, chỉ muốn biết khi nào hàng đến.)",null,null,"Yuányīn wǒ bù guānxīn, wǒ zhǐ xiǎng zhīdao shénme shíhou néng dào.",null,"BODY513"],["HS: 明白。针对您的情况，我们的方案是：我们仓库现在有两千件库存，明天就先发给您，够您用五天；剩下的八千件下周五之前交完。 (Hiểu rồi. Với tình hình của ngài, phương án của chúng tôi: kho hiện có 2.000 cái tồn, mai gửi trước cho ngài, đủ dùng 5 ngày; 8.000 cái còn lại giao xong trước thứ 6 tuần sau.)",null,null,"Míngbai. Zhēnduì nín de qíngkuàng, wǒmen de fāng'àn shì: wǒmen cāngkù xiànzài yǒu liǎngqiān jiàn kùcún, míngtiān jiù xiān fāgěinín, gòu nín yòng wǔtiān; shèngxià de bāqiān jiàn xià zhōuwǔ zhīqián jiāowán.",null,"BODY514"],["GV (biến cố): 两千件不够，我们一天要用六百件，五天以后就没了，下周五太晚了！ (2.000 cái không đủ, một ngày chúng tôi dùng 600 cái, 5 ngày là hết, thứ 6 tuần sau quá muộn!)",null,null,"Liǎngqiān jiàn bùgòu, wǒmen yītiān yào yòng liùbǎi jiàn, wǔtiān yǐhòu jiù méi le, xià zhōuwǔ tàiwǎn le!",null,"BODY515"],["HS: 我明白了。那我们的备用方案是：一是从我们胡志明市的分仓再调一千五百件，空运过来，后天能到；二是剩下的货我们安排两班倒生产，交期提前到下周三。这样您的生产线不会停。 (Tôi hiểu. Vậy phương án dự phòng: một là điều thêm 1.500 cái từ kho chi nhánh TP.HCM, đi hàng không, ngày kia đến; hai là số còn lại sản xuất 2 ca, giao sớm đến thứ 4 tuần sau. Như vậy chuyền của ngài không dừng.)",null,null,"Wǒ míngbai le. Nà wǒmen de bèiyòng fāng'àn shì: yī shìcóng wǒmen Húzhìmíng Shì de fēn cāng zài diào yīqiānwǔbǎijiàn, kōngyùn guòlái, hòutiān néng dào; èr shì shèngxià de huò wǒmen ānpái liǎngbāndǎo shēngchǎn, jiāo qī tíqián dào xià zhōusān. Zhèyàng nín de shēngchǎnxiàn bùhuì tíng.",null,"BODY516"],["GV: 空运的费用谁出？ (Phí hàng không ai chịu?)",null,null,"Kōngyùn de fèiyòng shuí chū?",null,"BODY517"],["HS: 全部由我们承担。另外，为了避免以后再发生这种情况，我们会给贵公司常用的型号保持一个星期的安全库存。 (Chúng tôi chịu toàn bộ. Ngoài ra, để tránh tái diễn, chúng tôi sẽ duy trì tồn kho an toàn một tuần cho các mã quý công ty hay dùng.)",null,null,"Quánbù yóu wǒmen chéngdān. Lìngwài, wèile bìmiǎn yǐhòu zài fāshēng zhèzhǒng qíngkuàng, wǒmen huì gěi guì gōngsī chángyòng de xínghào bǎochí yīgè xīngqī de ānquán kùcún.",null,"BODY518"],["GV: 好，这样还可以。 (Được, vậy tạm ổn.)",null,null,"Hǎo, zhèyàng hái kěyǐ.",null,"BODY519"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY520-C"],["✗ 这个问题的原因是因为…… (lặp 原因 và 因为) → ✓ 这个问题的原因是……/ 这个问题是因为……",null,null,"Zhège wèntí de yuányīn shìyīnwèi…… | Yuányīn | Yīnwèi | Zhège wèntí de yuányīn shì…… / | Zhège wèntí shìyīnwèi……",null,"BODY521"],["✗ 我有两个解决。 → ✓ 我有两个解决办法 / 两个方案。",null,null,"Wǒ yǒu liǎnggè jiějué. | Wǒ yǒu liǎnggè jiějuébànfǎ | Liǎnggè fāng'àn.",null,"BODY522"],["✗ 我们应该解决这个问题从培训。 → ✓ 我们应该从培训入手解决这个问题。",null,null,"Wǒmen yīnggāi jiějué zhège wèntí cóng péixùn. | Wǒmen yīnggāi cóng péixùn rùshǒu jiějué zhège wèntí.",null,"BODY523"],["✗ 这个方案很可行性。 → ✓ 这个方案很可行。/ 这个方案的可行性很高。",null,null,"Zhège fāng'àn hěn kěxíngxìng. | Zhège fāng'àn hěn kěxíng. / | Zhège fāng'àn de kěxíngxìng hěn gāo.",null,"BODY524"],["✗ 如果有问题，我们有计划B。 → ✓ 万一出问题，我们的备用方案是……",null,null,"Rúguǒ yǒu wèntí, wǒmen yǒu jìhuà B. | Wànyīchū wèntí, wǒmen de bèiyòng fāng'àn shì……",null,"BODY525"],["✗ 数据说…… → ✓ 数据显示……/ 从数据来看……",null,null,"Shùjù shuō…… | Shùjù xiǎnshì…… / | Cóng shùjù láikàn……",null,"BODY526"],["Nâng cấp HSK5: 我觉得这样比较好 → 从投入和回报来看，这个方案两年就能收回成本，可行性比较高。",null,null,"Wǒ juéde zhèyàng bǐjiào hǎo | Cóng tóurù hé huíbào láikàn, zhège fāng'àn liǎngnián jiù néng shōuhuí chéngběn, kěxíngxìng bǐjiào gāo.",null,"BODY527"],["Phát âm: 根本 gēnběn; 可行性 kěxíngxìng; 优化 yōuhuà; 实施 shíshī; 评估 pínggū.",null,null,"Gēnběn | Kěxíngxìng | Yōuhuà | Shíshī | Pínggū",null,"BODY528"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY529-C"],["Ghi âm một đề xuất cải tiến 3 phút cho công ty mình theo khung 5 bước: hiện tượng (có số liệu) → nguyên nhân → giải pháp → khả thi & rủi ro → kế hoạch thực hiện.",null,null,null,null,"BODY530"],["HSK4: rút gọn còn 2 phút: vấn đề → 2 nguyên nhân → 2 giải pháp.",null,null,null,null,"BODY531"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY532"],["Buổi 19 — 口语化表达与地道说法 Khẩu ngữ tự nhiên",null,null,"Kǒuyǔhuà biǎodá yǔ dìdao shuōfǎ",null,"BODY533-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY534-C"],["HSK4: Dùng đúng ngữ cảnh 8–10 cụm khẩu ngữ thân mật. HSK5: Đổi sắc thái cùng một ý theo đối tượng (bạn bè – đồng nghiệp – cấp trên – khách hàng).",null,null,null,null,"BODY535"],["Nguyên tắc dùng khẩu ngữ: ① Chỉ dùng với người quen, ngang hàng → ② Với cấp trên/khách hàng chuyển sang cách nói lịch sự → ③ Không dùng tiếng lóng mạng (内卷, 躺平…) trong văn bản chính thức.",null,null,"Nèi juǎn | Tǎngpíng…",null,"BODY536"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY537-C"],["1. Hỏi: 你觉得课本里的中文和中国人平时说的中文一样吗？ (Bạn thấy tiếng Trung trong sách và tiếng Trung người TQ nói hằng ngày có giống nhau không?)",null,null,"Nǐ juéde kèběn lǐ de Zhōngwén hé Zhōngguórén píngshí shuō de Zhōngwén yīyàng ma?",null,"BODY538"],["Đáp: 不太一样。中国同事说话的时候经常用一些课本里没有的词，比如\"靠谱\"\"搞定\"，我一开始完全听不懂。 (Không giống lắm. Đồng nghiệp TQ hay dùng những từ không có trong sách như \"靠谱\", \"搞定\", lúc đầu tôi hoàn toàn không hiểu.)",null,null,"Bù tài yīyàng. Zhōngguó tóngshì shuōhuà de shíhou jīngcháng yòng yīxiē kèběn lǐ méiyǒu de cí, bǐrú \"kàopǔ\" \"gǎodìng\", wǒ yī kāishǐ wánquán tīngbùdǒng. | \"Kàopǔ\" | \"Gǎodìng\"",null,"BODY539"],["2. Hỏi: 你跟中国朋友聊微信的时候，有没有看不懂的说法？ (Khi nhắn WeChat với bạn TQ, có cách nói nào bạn không hiểu không?)",null,null,"Nǐ gēn Zhōngguó péngyou liáo wēi xìn de shíhou, yǒuméiyǒu kànbùdǒng de shuōfǎ?",null,"BODY540"],["Đáp: 有。有一次朋友发了\"666\"，我还以为是电话号码，后来才知道是\"很厉害\"的意思。 (Có. Có lần bạn gửi \"666\", tôi tưởng là số điện thoại, sau mới biết nghĩa là \"giỏi quá\".)",null,null,"Yǒu. Yǒu yīcì péngyou fā le \"666\", wǒ hái yǐwéi shì diànhuàhàomǎ, hòulái cái zhīdao shì \"hěn lìhai\" de yìsi.",null,"BODY541"],["3. Hỏi: 跟老板说话和跟朋友说话，你的越南语有什么不一样？ (Nói với sếp và nói với bạn, tiếng Việt của bạn khác nhau thế nào?)",null,null,"Gēn lǎobǎn shuōhuà hé gēn péngyou shuōhuà, nǐ de Yuènányǔ yǒu shénme bù yīyàng?",null,"BODY542"],["Đáp: 跟老板说话我会用\"dạ, vâng\"，比较客气；跟朋友就很随便，有时候还会开玩笑。中文应该也一样吧。 (Nói với sếp tôi dùng \"dạ, vâng\", khá lễ phép; với bạn thì rất thoải mái, đôi khi còn đùa. Tiếng Trung chắc cũng vậy.)",null,null,"Gēn lǎobǎn shuōhuà wǒhuì yòng | , Bǐjiào kèqi; gēn péngyou jiù hěn suíbiàn, yǒushíhou hái huì kāiwánxiào. Zhōngwén yīnggāi yě yīyàng ba.",null,"BODY543"],["语言输入 INPUT — Cụm khẩu ngữ trọng tâm (nghĩa + sắc thái + câu ví dụ)",null,null,"Yǔyán shūrù",null,"BODY544-C"],["1. 没辙 (hết cách, bó tay): 电脑又坏了，我真没辙了。 (Máy tính lại hỏng, tôi bó tay thật rồi.)",null,null,"Méizhé | Diànnǎo yòuhuàile, wǒ zhēn méizhé le.",null,"BODY545"],["2. 靠谱 / 不靠谱 (đáng tin, ổn / không đáng tin): 小林做事特别靠谱，交给他你放心。 (Tiểu Lâm làm việc rất đáng tin, giao cho cậu ấy bạn cứ yên tâm.)",null,null,"Kàopǔ | Bùkàopǔ | Xiǎo Lín zuòshì tèbié kàopǔ, jiāogěi tā nǐ fàngxīn.",null,"BODY546"],["3. 搞定 (xong xuôi, giải quyết xong): 放心吧，这事儿我已经搞定了。 (Yên tâm, việc này tôi giải quyết xong rồi.)",null,null,"Gǎodìng | Fàngxīn ba, zhè shìr wǒ yǐjīng gǎodìng le.",null,"BODY547"],["4. 差不多 (gần như, tàm tạm): 报告写得差不多了，明天就能交。 (Báo cáo viết gần xong, mai nộp được.)",null,null,"Chàbuduō | Bàogào xiě de chàbuduō le, míngtiān jiù néng jiāo.",null,"BODY548"],["5. 说白了 (nói thẳng ra, nói trắng ra): 说白了，他就是不想加班。 (Nói thẳng ra, anh ta chỉ là không muốn tăng ca.)",null,null,"Shuōbáile | Shuōbáile, tā jiùshì bùxiǎng jiābān.",null,"BODY549"],["6. 别提了 (đừng nhắc nữa – khi chuyện rất tệ): 别提了，昨天的会开了四个小时。 (Đừng nhắc nữa, cuộc họp hôm qua kéo dài 4 tiếng.)",null,null,"Biétí le | Biétí le, zuótiān de huì kāi le sìgè xiǎoshí.",null,"BODY550"],["7. 小菜一碟 (dễ như ăn bánh): 翻译这封邮件？小菜一碟！ (Dịch email này à? Dễ như ăn bánh!)",null,null,"Xiǎocàiyīdié | Fānyì zhè fēng yóujiàn? Xiǎocàiyīdié!",null,"BODY551"],["8. 够呛 (gay go, khó mà): 这么多活儿，今天做完够呛。 (Nhiều việc thế này, hôm nay làm xong thì khó lắm.)",null,null,"Gòuqiàng | Zhème duō huór, jīntiān zuò wán gòuqiàng.",null,"BODY552"],["9. 放鸽子 (cho leo cây): 他说好七点来，结果放我鸽子了。 (Hẹn 7h đến, rốt cuộc cho tôi leo cây.)",null,null,"Fànggēzi | Tā shuōhǎo qīdiǎn lái, jiéguǒ fàng wǒ gēzi le.",null,"BODY553"],["10. 甩锅 / 背锅 (đổ lỗi / gánh tội thay): 出了问题他就甩锅，每次都是我背锅。 (Có chuyện là anh ta đổ lỗi, lần nào tôi cũng gánh tội thay.)",null,null,"Shuǎiguō | Bēiguō | Chū le wèntí tā jiù shuǎiguō, měicì dōu shì wǒ bēiguō.",null,"BODY554"],["11. 拿手 (sở trường, ruột): 做PPT是她的拿手好戏。 (Làm PPT là sở trường của cô ấy.)",null,null,"Náshǒu | Zuò PPT shì tā de náshǒuhǎoxì.",null,"BODY555"],["12. 一言难尽 (khó nói hết bằng vài lời): 这个项目的事儿，真是一言难尽。 (Chuyện dự án này đúng là khó nói hết.)",null,null,"Yīyánnánjìn | Zhège xiàngmù de shìr, zhēnshì yīyánnánjìn.",null,"BODY556"],["13. 有两下子 (có nghề, khá đấy): 没想到你中文这么好，真有两下子！ (Không ngờ tiếng Trung bạn giỏi vậy, có nghề thật!)",null,null,"Yǒuliǎngxiàzi | Méixiǎngdào nǐ Zhōngwén zhème hǎo, zhēn yǒuliǎngxiàzi!",null,"BODY557"],["14. 打工人 / 摸鱼 / 内卷 / 躺平 (dân làm thuê / lười, trốn việc trong giờ / cạnh tranh quá mức / buông xuôi – tiếng lóng mạng): 打工人的周一，真不想上班。/ 现在每个行业都很卷。 (Thứ Hai của dân làm thuê, thật không muốn đi làm. / Giờ ngành nào cũng cạnh tranh khốc liệt.)",null,null,"Dǎ gōngrén | Mōyú | Nèi juǎn | Tǎngpíng | Dǎ gōngrén de zhōuyī, zhēn bùxiǎng shàngbān. / | Xiànzài měigè hángyè dōu hěnjuǎn.",null,"BODY558"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY559-C"],["1. 这事儿……了 (Chuyện này … rồi – văn nói)",null,null,"Zhè shìr…… le",null,"BODY560"],["Ví dụ: 这事儿搞定了，你不用担心了。 (Chuyện này xong rồi, bạn khỏi lo.)",null,null,"Zhè shìr gǎodìng le, nǐ bùyòng dānxīn le.",null,"BODY561"],["Ví dụ: 这事儿黄了，客户不跟我们合作了。 (Chuyện này hỏng rồi, khách không hợp tác với mình nữa.)",null,null,"Zhè shìr huáng le, kèhù bù gēn wǒmen hézuò le.",null,"BODY562"],["2. 说白了，…… (Nói thẳng ra, …)",null,null,"Shuōbáile,……",null,"BODY563"],["Ví dụ: 说白了，客户就是想要更便宜的价格。 (Nói thẳng ra, khách chỉ muốn giá rẻ hơn.)",null,null,"Shuōbáile, kèhù jiùshì xiǎngyào gèng piányi de jiàgé.",null,"BODY564"],["Ví dụ: 说白了，这个方案就是换汤不换药。 (Nói thẳng ra, phương án này là bình mới rượu cũ.)",null,null,"Shuōbáile, zhège fāng'àn jiùshì huàntāngbùhuànyào.",null,"BODY565"],["3. 别提了，…… (Đừng nhắc nữa, …)",null,null,"Biétí le,……",null,"BODY566"],["Ví dụ: 别提了，路上堵了两个小时，我差点没赶上飞机。 (Đừng nhắc nữa, tắc đường 2 tiếng, suýt lỡ máy bay.)",null,null,"Biétí le, lùshàng dǔ le liǎnggè xiǎoshí, wǒ chàdiǎn méi gǎnshàng fēijī.",null,"BODY567"],["Ví dụ: 别提了，周末本来想休息，结果老板一直打电话。 (Đừng nhắc nữa, cuối tuần định nghỉ, ai ngờ sếp gọi liên tục.)",null,null,"Biétí le, zhōumò běnlái xiǎng xiūxi, jiéguǒ lǎobǎn yīzhí dǎdiànhuà.",null,"BODY568"],["4. ……还行吧 / 还凑合 (… cũng tạm được)",null,null,"…… Hái xíng ba | Hái còuhe",null,"BODY569"],["Ví dụ: 新工作怎么样？——还行吧，就是有点远。 (Việc mới thế nào? — Cũng tạm, chỉ hơi xa.)",null,null,"Xīn gōngzuò zěnmeyàng? -- Hái xíng ba, jiùshì yǒudiǎn yuǎn.",null,"BODY570"],["Ví dụ: 这家店的菜还凑合，不过服务挺好的。 (Đồ ăn quán này tạm được, nhưng phục vụ khá tốt.)",null,null,"Zhèjiā diàn de cài hái còuhe, bùguò fúwù tǐng hǎo de.",null,"BODY571"],["5. 挺……的 (khá …, … đấy – văn nói)",null,null,"Tǐng…… de",null,"BODY572"],["Ví dụ: 你们公司的待遇挺不错的嘛！ (Đãi ngộ công ty bạn khá tốt đấy chứ!)",null,null,"Nǐmen gōngsī de dàiyù tǐngbùcuò de ma!",null,"BODY573"],["Ví dụ: 今天挺累的，我先回去了。 (Hôm nay khá mệt, tôi về trước nhé.)",null,null,"Jīntiān tǐng lèi de, wǒ xiānhuíqù le.",null,"BODY574"],["6. 不就是……嘛 (Chẳng phải chỉ là … thôi sao)",null,null,"Bù jiùshì…… ma",null,"BODY575"],["Ví dụ: 不就是一个报告嘛，晚上加个班就写完了。 (Chẳng phải chỉ là một báo cáo thôi sao, tối tăng ca là xong.)",null,null,"Bù jiùshì yīgè bàogào ma, wǎnshàng jiā gè bān jiù xiě wán le.",null,"BODY576"],["Ví dụ: 不就是迟到五分钟嘛，别生气了。 (Chỉ là muộn 5 phút thôi mà, đừng giận nữa.)",null,null,"Bù jiùshì chídào wǔfēnzhōng ma, biéshēngqì le.",null,"BODY577"],["7. 得了吧，…… (Thôi đi, … – không tin / phản bác nhẹ)",null,null,"Déleba,……",null,"BODY578"],["Ví dụ: 得了吧，你说\"马上\"每次都要半个小时。 (Thôi đi, bạn nói \"ngay\" lần nào cũng mất nửa tiếng.)",null,null,"Déleba, nǐ shuō \"mǎshàng\" měicì dōu yào bàngè xiǎoshí.",null,"BODY579"],["Ví dụ: 得了吧，他要是会做饭，我就会开飞机了。 (Thôi đi, anh ta mà biết nấu ăn thì tôi biết lái máy bay.)",null,null,"Déleba, tā yàoshì huì zuòfàn, wǒ jiù huì kāi fēijī le.",null,"BODY580"],["8. 真是的！/ 你看你！ (Thật là! / Bạn xem bạn kìa! – trách nhẹ)",null,null,"Zhēnshì de! / | Nǐ kàn nǐ!",null,"BODY581"],["Ví dụ: 真是的，又忘带钥匙了。 (Thật là, lại quên mang chìa khóa.)",null,null,"Zhēnshì de, yòu wàngdài yàoshi le.",null,"BODY582"],["Ví dụ: 你看你，又把咖啡洒在文件上了。 (Bạn xem bạn kìa, lại làm đổ cà phê lên tài liệu.)",null,null,"Nǐ kàn nǐ, yòu bǎ kāfēi sǎ zài wénjiàn shàng le.",null,"BODY583"],["9. (HSK5) 同一个意思，换种说法：随便 → 正式",null,null,"Tóngyīgè yìsi, huàn zhǒng shuōfǎ: suíbiàn | Zhèngshì",null,"BODY584"],["Ví dụ: 搞定了 → 已经处理好了 → 已经妥善处理完毕。 (Xong rồi → Đã xử lý xong → Đã xử lý thỏa đáng.)",null,null,"Gǎodìng le | Yǐjīng chǔlǐ hǎo le | Yǐjīng tuǒshànchǔlǐ wánbì.",null,"BODY585"],["Ví dụ: 这人不靠谱 → 他做事不太稳定 → 该供应商的交付能力有待提高。 (Người này không đáng tin → Anh ấy làm việc không ổn định lắm → Năng lực giao hàng của NCC này cần cải thiện.)",null,null,"Zhè rén bùkàopǔ | Tā zuòshì bù tài wěndìng | Gāi gōngyìngshāng de jiāofù nénglì yǒudài tígāo.",null,"BODY586"],["10. (HSK5) 话虽这么说，可是…… (Nói thì nói vậy, nhưng …)",null,null,"Huà suī zhème shuō, kěshì……",null,"BODY587"],["Ví dụ: 话虽这么说，可是老板的决定我们也没辙。 (Nói thì nói vậy, nhưng quyết định của sếp mình cũng bó tay.)",null,null,"Huà suī zhème shuō, kěshì lǎobǎn de juédìng wǒmen yě méizhé.",null,"BODY588"],["Ví dụ: 话虽这么说，可是躺平也不是办法啊。 (Nói thì nói vậy, nhưng buông xuôi cũng không phải cách.)",null,null,"Huà suī zhème shuō, kěshì tǎngpíng yě bùshì bànfǎ a.",null,"BODY589"],["情景对话 1 — Hai đồng nghiệp than thở sau giờ làm (khẩu ngữ thân mật, HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY590-C"],["阿明: 哎，下班了！今天累死我了。 (Ôi, tan làm rồi! Hôm nay mệt chết đi được.)",null,null,"Ā Míng: āi, xiàbān le! Jīntiān lèisǐ wǒ le.",null,"BODY591"],["小林: 怎么了？又被老板叫去开会了？ (Sao vậy? Lại bị sếp gọi đi họp à?)",null,null,"Xiǎo Lín: zěnme le? Yòu bèi lǎobǎn jiào qù kāihuì le?",null,"BODY592"],["阿明: 别提了，一个会开了三个小时，说来说去还是那几件事。 (Đừng nhắc nữa, một cuộc họp 3 tiếng, nói tới nói lui vẫn mấy chuyện đó.)",null,null,"Ā Míng: biétí le, yīgè huì kāi le sāngè xiǎoshí, shuōláishuōqù háishì nà jǐjiànshì.",null,"BODY593"],["小林: 哈哈，打工人的日常嘛。那个报价你搞定了没？ (Haha, thường ngày của dân làm thuê mà. Cái báo giá bạn xong chưa?)",null,null,"Xiǎo Lín: hāhā, dǎ gōngrén de rìcháng ma. Nàge bàojià nǐ gǎodìng le méi?",null,"BODY594"],["阿明: 差不多了，就差一个价格还没确认。供应商那边一直不回消息，我真没辙了。 (Gần xong, chỉ còn một giá chưa xác nhận. Bên NCC mãi không trả lời, tôi bó tay thật.)",null,null,"Ā Míng: chàbuduō le, jiù chà yīgè jiàgé hái méi quèrèn. Gōngyìngshāng nàbiān yīzhí bù huí xiāoxi, wǒ zhēn méizhé le.",null,"BODY595"],["小林: 你说的是那个姓黄的？那个人不太靠谱，上次也放了我鸽子。 (Bạn nói ông họ Hoàng đó à? Người đó không đáng tin lắm, lần trước cũng cho tôi leo cây.)",null,null,"Xiǎo Lín: nǐ shuō de shì nàge xìnghuáng de? Nàge rén bù tài kàopǔ, shàngcì yě fàng le wǒ gēzi.",null,"BODY596"],["阿明: 真的？那我得找个备胎了。 (Thật à? Vậy tôi phải tìm phương án dự phòng rồi.)",null,null,"Ā Míng: zhēnde? Nà wǒ děi zhǎo gè bèitāi le.",null,"BODY597"],["小林: 我认识一个供应商，人挺靠谱的，回消息特别快，我把他微信推给你。 (Tôi quen một NCC, người khá đáng tin, trả lời rất nhanh, tôi gửi WeChat của anh ấy cho bạn.)",null,null,"Xiǎo Lín: wǒ rènshi yīgè gōngyìngshāng, rén tǐng kàopǔ de, huí xiāoxi tèbié kuài, wǒ bǎ tā wēi xìn tuī gěi nǐ.",null,"BODY598"],["阿明: 太好了，你真是我的救星！ (Tuyệt quá, bạn đúng là cứu tinh của tôi!)",null,null,"Ā Míng: tàihǎole, nǐ zhēnshì wǒ de jiùxīng!",null,"BODY599"],["小林: 小菜一碟。走，去吃点东西吧，我饿坏了。 (Chuyện nhỏ. Đi, đi ăn chút gì đi, tôi đói lả rồi.)",null,null,"Xiǎo Lín: xiǎocàiyīdié. Zǒu, qù chī diǎn dōngxi ba, wǒ èhuài le.",null,"BODY600"],["阿明: 去哪儿？还是公司楼下那家？ (Đi đâu? Vẫn quán dưới công ty à?)",null,null,"Ā Míng: qù nǎr? Háishì gōngsī lóuxià nà jiā?",null,"BODY601"],["小林: 那家的菜还凑合，就是太咸了。我们换一家，对面新开了一家烤肉，听说挺不错的。 (Đồ ăn quán đó tạm được, chỉ là mặn quá. Đổi quán đi, đối diện mới mở quán thịt nướng, nghe nói khá ngon.)",null,null,"Xiǎo Lín: nà jiā de cài hái còuhe, jiùshì tài xián le. Wǒmen huàn yījiā, duìmiàn xīn kāi le yījiā kǎoròu, tīngshuō tǐngbùcuò de.",null,"BODY602"],["阿明: 行，走着！今天我请客。 (Được, đi thôi! Hôm nay tôi mời.)",null,null,"Ā Míng: xíng, zǒu zhe! Jīntiān wǒ qǐngkè.",null,"BODY603"],["小林: 得了吧，上次就是你请的，这次AA。 (Thôi đi, lần trước bạn mời rồi, lần này chia đôi.)",null,null,"Xiǎo Lín: déleba, shàngcì jiùshì nǐ qǐng de, zhècì AA.",null,"BODY604"],["阿明: 好好好，听你的。 (Được được, nghe bạn.)",null,null,"Ā Míng: hǎohǎo hǎo, tīng nǐ de.",null,"BODY605"],["情景对话 2 — Cùng một ý: nói với bạn bè vs nói với sếp (đổi sắc thái, HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY606-C"],["Tình huống A — 跟同事说（随便）: 阿玲，那个客户的事儿我搞定了，他们同意下周付款。 (A Linh, chuyện ông khách đó mình xong rồi, họ đồng ý tuần sau thanh toán.)",null,null,"Gēn tóngshì shuō(suíbiàn) | Ā Líng, nàge kèhù de shìr wǒ gǎodìng le, tāmen tóngyì xiàzhōu fùkuǎn.",null,"BODY607"],["Tình huống A — 跟经理说（正式）: 经理，关于王总那边货款的事情，我已经处理好了，他们同意下周三之前付清。 (Giám đốc, về khoản tiền hàng bên Vương tổng, em đã xử lý xong, họ đồng ý thanh toán đủ trước thứ 4 tuần sau.)",null,null,"Gēn jīnglǐ shuō(zhèngshì) | Jīnglǐ, guānyú Wáng zǒng nàbiān huòkuǎn de shìqing, wǒ yǐjīng chǔlǐ hǎo le, tāmen tóngyì xià zhōusān zhīqián fùqīng.",null,"BODY608"],["Tình huống B — 跟同事说（随便）: 这个新来的实习生挺靠谱的，教一遍就会了。 (Bạn thực tập mới này khá đáng tin, dạy một lần là biết.)",null,null,"Gēn tóngshì shuō(suíbiàn) | Zhège xīn lái de shíxíshēng tǐng kàopǔ de, jiào yībiàn jiù huì le.",null,"BODY609"],["Tình huống B — 跟经理说（正式）: 新来的实习生学习能力很强，工作也很认真，我觉得可以考虑让他转正。 (Thực tập sinh mới học rất nhanh, làm việc nghiêm túc, em thấy có thể cân nhắc cho lên chính thức.)",null,null,"Gēn jīnglǐ shuō(zhèngshì) | Xīn lái de shíxíshēng xuéxí nénglì hěn qiáng, gōngzuò yě hěn rènzhēn, wǒ juéde kěyǐ kǎolǜ ràng tā zhuǎnzhèng.",null,"BODY610"],["Tình huống C — 跟同事说（随便）: 别提了，供应商又放我们鸽子了，货今天到不了。 (Đừng nhắc nữa, NCC lại cho mình leo cây, hôm nay hàng không về được.)",null,null,"Gēn tóngshì shuō(suíbiàn) | Biétí le, gōngyìngshāng yòu fàng wǒmen gēzi le, huò jīntiān dào bùliǎo.",null,"BODY611"],["Tình huống C — 跟经理说（正式）: 经理，供应商通知我们今天的货可能会延误，我正在跟他们确认新的到货时间。 (Giám đốc, NCC báo hàng hôm nay có thể trễ, em đang xác nhận lại thời gian hàng về với họ.)",null,null,"Gēn jīnglǐ shuō(zhèngshì) | Jīnglǐ, gōngyìngshāng tōngzhī wǒmen jīntiān de huò kěnéng huì yánwù, wǒ zhèngzài gēn tāmen quèrèn xīn de dàohuò shíjiān.",null,"BODY612"],["Tình huống D — 跟同事说（随便）: 说白了，这个方案就是太贵了，老板肯定不会批。 (Nói thẳng ra, phương án này đắt quá, sếp chắc chắn không duyệt.)",null,null,"Gēn tóngshì shuō(suíbiàn) | Shuōbáile, zhège fāng'àn jiùshì tàiguì le, lǎobǎn kěndìng bùhuì pī.",null,"BODY613"],["Tình huống D — 跟经理说（正式）: 这个方案的效果不错，不过成本可能超出了今年的预算，我们是不是可以考虑分阶段实施？ (Phương án này hiệu quả tốt, nhưng chi phí có thể vượt ngân sách năm nay, chúng ta có thể cân nhắc triển khai theo giai đoạn không ạ?)",null,null,"Gēn jīnglǐ shuō(zhèngshì) | Zhège fāng'àn de xiàoguǒ bùcuò, bùguò chéngběn kěnéng chāochū le jīnnián de yùsuàn, wǒmen shìbùshì kěyǐ kǎolǜ fēnjiēduàn shíshī?",null,"BODY614"],["Tình huống E — 跟同事说（随便）: 这活儿今天干完够呛，我得加班了。 (Việc này hôm nay làm xong thì gay, mình phải tăng ca rồi.)",null,null,"Gēn tóngshì shuō(suíbiàn) | Zhè huór jīntiān gànwán gòuqiàng, wǒ děi jiābān le.",null,"BODY615"],["Tình huống E — 跟经理说（正式）: 按现在的进度，今天完成可能有点困难，我今晚会加班，明天上午一定交给您。 (Theo tiến độ hiện tại, hôm nay hoàn thành có thể hơi khó, tối nay em tăng ca, sáng mai nhất định gửi anh.)",null,null,"Gēn jīnglǐ shuō(zhèngshì) | Àn xiànzài de jìndù, jīntiān wánchéng kěnéng yǒudiǎn kùnnán, wǒ jīnwǎn huì jiābān, míngtiān shàngwǔ yīdìng jiāogěi nín.",null,"BODY616"],["情景对话 3 — Nhắn WeChat với bạn Trung Quốc (ngôn ngữ chat, HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY617-C"],["小王: 在吗？周末有空不？ (Có đó không? Cuối tuần rảnh không?)",null,null,"Xiǎo Wáng: zài ma? Zhōumò yǒukòng bù?",null,"BODY618"],["阿明: 在呢！周六没事儿，咋了？ (Có đây! Thứ 7 rảnh, sao thế?)",null,null,"Ā Míng: zài ne! Zhōuliù méishìr, zǎ le?",null,"BODY619"],["小王: 我们几个中国同事想去还剑湖那边逛逛，你来当导游呗！ (Mấy đồng nghiệp TQ bọn mình muốn đi dạo bên Hồ Gươm, bạn làm hướng dẫn viên đi!)",null,null,"Xiǎo Wáng: wǒmen jǐgè Zhōngguó tóngshì xiǎng qù Huánjiàn Hú nàbiān guàngguàng, nǐ lái dāng dǎoyóu bei!",null,"BODY620"],["阿明: 没问题，包在我身上！几点？ (Không vấn đề, cứ giao cho mình! Mấy giờ?)",null,null,"Ā Míng: méi wèntí, bāo zài wǒ shēnshang! Jǐdiǎn?",null,"BODY621"],["小王: 下午三点吧，太早了太热。 (3h chiều nhé, sớm quá nóng.)",null,null,"Xiǎo Wáng: xiàwǔ sāndiǎn ba, tài zǎo le tài rè.",null,"BODY622"],["阿明: 行。晚上带你们去吃地道的烤肉米线，保证好吃。 (Được. Tối dẫn các bạn đi ăn bún chả chuẩn vị, đảm bảo ngon.)",null,null,"Ā Míng: xíng. Wǎnshàng dài nǐmen qù chī dìdao de kǎoròumǐxiàn, bǎozhèng hǎochī.",null,"BODY623"],["小王: 太好了！你中文现在越来越溜了，666！ (Tuyệt! Tiếng Trung của bạn giờ ngày càng trôi chảy, đỉnh thật!)",null,null,"Xiǎo Wáng: tàihǎole! Nǐ Zhōngwén xiànzài yuèláiyuè liū le, 666!",null,"BODY624"],["阿明: 哈哈，过奖了，还差得远呢。 (Haha, quá khen, còn kém lắm.)",null,null,"Ā Míng: hāhā, guòjiǎng le, hái chàdeyuǎn ne.",null,"BODY625"],["小王: 对了，上次你说的那家咖啡店叫啥来着？ (À, lần trước bạn nói quán cà phê đó tên gì ấy nhỉ?)",null,null,"Xiǎo Wáng: duì le, shàngcì nǐ shuō de nà jiā kāfēidiàn jiào shá láizhe?",null,"BODY626"],["阿明: 你说的是鸡蛋咖啡那家吧？我们周六顺便去。 (Bạn nói quán cà phê trứng đó hả? Thứ 7 mình tiện ghé luôn.)",null,null,"Ā Míng: nǐ shuō de shì jīdànkāfēi nà jiā ba? Wǒmen zhōuliù shùnbiànqù.",null,"BODY627"],["小王: 好嘞！那就这么定了，周六见！ (Được thôi! Vậy chốt thế, hẹn thứ 7!)",null,null,"Xiǎo Wáng: hǎolei! Nà jiù zhème dìng le, zhōuliù jiàn!",null,"BODY628"],["阿明: 不见不散！ (Không gặp không về!)",null,null,"Ā Míng: bùjiànbùsàn!",null,"BODY629"],["Giải thích ngôn ngữ chat: 在吗？= có đó không; 不？= 吗？(khẩu ngữ); 咋了 = 怎么了; 呗 = thôi/đi (rủ rê); 包在我身上 = cứ giao cho tôi; 溜 = trôi chảy; 666 = giỏi quá; 啥 = 什么; 来着 = nhỉ (cố nhớ lại); 好嘞 = được thôi; 不见不散 = không gặp không về.",null,null,"Zài ma? | Bù? | Ma? | Zǎ le | Zěnme le | Bei | Bāo zài wǒ shēnshang | Liū | Shá | Shénme | Láizhe | Hǎolei | Bùjiànbùsàn",null,"BODY630"],["情景对话 4 — Tiếng lóng nơi công sở (内卷, 摸鱼, 甩锅, 背锅) trong buổi trà chiều",null,null,"Qíngjǐng duìhuà | Nèi juǎn | Mōyú | Shuǎiguō | Bēiguō",null,"BODY631-C"],["小芳: 你看新闻了吗？说现在年轻人都想躺平了。 (Bạn xem tin chưa? Nói giờ giới trẻ đều muốn buông xuôi.)",null,null,"Xiǎo Fāng: nǐ kàn xīnwén le ma? Shuō xiànzài niánqīngrén dōu xiǎng tǎngpíng le.",null,"BODY632"],["阿玲: 能不躺平吗？现在每个行业都这么卷，加班加到十点，工资还不涨。 (Không buông xuôi sao được? Giờ ngành nào cũng cạnh tranh khốc liệt, tăng ca đến 10h, lương vẫn không tăng.)",null,null,"Ā Líng: néng bù tǎngpíng ma? Xiànzài měigè hángyè dōu zhèmejuǎn, jiābān jiā dào shídiǎn, gōngzī hái bù zhǎng.",null,"BODY633"],["小芳: 我们部门也是。小海昨天加班到十二点，就因为隔壁部门做错了数据，最后还让他背锅。 (Phòng mình cũng vậy. Tiểu Hải hôm qua tăng ca đến 12h, chỉ vì phòng bên cạnh làm sai số liệu, cuối cùng còn bắt cậu ấy gánh tội thay.)",null,null,"Xiǎo Fāng: wǒmen bùmén yě shì. Xiǎo Hǎi zuótiān jiābān dào shí'èrdiǎn, jiù yīnwèi gébì bùmén zuò cuò le shùjù, zuìhòu hái ràng tā bēiguō.",null,"BODY634"],["阿玲: 又是他们甩锅？真是的！上次也是这样。 (Lại là họ đổ lỗi? Thật là! Lần trước cũng thế.)",null,null,"Ā Líng: yòu shì tāmen shuǎiguō? Zhēnshì de! Shàngcì yě shì zhèyàng.",null,"BODY635"],["小芳: 说白了，就是没人想承担责任。 (Nói thẳng ra, là không ai muốn chịu trách nhiệm.)",null,null,"Xiǎo Fāng: shuōbáile, jiùshì méi rén xiǎng chéngdānzérèn.",null,"BODY636"],["阿玲: 不过话虽这么说，可是躺平也不是办法啊，房贷还得还呢。 (Nhưng nói thì nói vậy, buông xuôi cũng không phải cách, nợ nhà vẫn phải trả.)",null,null,"Ā Líng: bùguò huà suī zhème shuō, kěshì tǎngpíng yě bùshì bànfǎ a, fángdài hái děi hái ne.",null,"BODY637"],["小芳: 哈哈，对。我现在就是\"上班摸鱼，下班学习\"，晚上学中文，准备以后跳槽。 (Haha, đúng. Mình giờ là \"đi làm thì lười, tan làm thì học\", tối học tiếng Trung, chuẩn bị sau này nhảy việc.)",null,null,"Xiǎo Fāng: hāhā, duì. Wǒ xiànzài jiùshì \"shàngbān mōyú, xiàbān xuéxí\", wǎnshàng xué Zhōngwén, zhǔnbèi yǐhòu tiàocáo.",null,"BODY638"],["阿玲: 你小声点！被经理听到就完了。 (Bạn nói nhỏ thôi! Giám đốc nghe thấy là toi.)",null,null,"Ā Líng: nǐ xiǎoshēngdiǎn! Bèi jīnglǐ tīngdào jiù wán le.",null,"BODY639"],["小芳: 开玩笑的啦，我工作还是很认真的。 (Đùa thôi mà, mình làm việc vẫn rất nghiêm túc.)",null,null,"Xiǎo Fāng: kāiwánxiào de la, wǒ gōngzuò háishì hěn rènzhēn de.",null,"BODY640"],["阿玲: 我知道，你可是我们部门最靠谱的。 (Mình biết, bạn là người đáng tin nhất phòng mình mà.)",null,null,"Ā Líng: wǒ zhīdao, nǐ kěshì wǒmen bùmén zuì kàopǔ de.",null,"BODY641"],["Lưu ý GV: 摸鱼, 躺平, 内卷, 甩锅 chỉ dùng khi nói đùa với đồng nghiệp thân; không dùng khi nói với sếp, khách hàng hoặc trong email.",null,null,"Mōyú | Tǎngpíng | Nèi juǎn | Shuǎiguō",null,"BODY642"],["情景对话 5 — Đi ăn với bạn Trung Quốc: khen, mời, từ chối uống thêm (khẩu ngữ trên bàn ăn)",null,null,"Qíngjǐng duìhuà",null,"BODY643-C"],["小王: 来来来，别客气，多吃点！ (Nào nào, đừng khách sáo, ăn nhiều vào!)",null,null,"Xiǎo Wáng: láiláilái, bié kèqi, duō chī diǎn!",null,"BODY644"],["阿明: 我已经吃撑了，这家的烤鱼也太好吃了吧！ (Mình no căng rồi, chả cá quán này ngon quá trời!)",null,null,"Ā Míng: wǒ yǐjīng chīchēng le, zhèjiā de kǎoyú yě tài hǎochī le ba!",null,"BODY645"],["小王: 是吧？我就说这家靠谱。再来一杯！干了！ (Đúng chưa? Mình đã bảo quán này được mà. Thêm ly nữa! Cạn!)",null,null,"Xiǎo Wáng: shì ba? Wǒ jiù shuō zhèjiā kàopǔ. Zài lái yībēi! Gānle!",null,"BODY646"],["阿明: 别别别，我真喝不了了，明天还得开车上班呢。 (Thôi thôi, mình thật không uống được nữa, mai còn phải lái xe đi làm.)",null,null,"Ā Míng: bié bié bié, wǒ zhēn hē bùliǎo le, míngtiān hái děi kāichē shàngbān ne.",null,"BODY647"],["小王: 就一杯，不喝就是不给面子啊！ (Một ly thôi, không uống là không nể mặt đấy!)",null,null,"Xiǎo Wáng: jiù yībēi, bù hē jiùshì bù gěimiànzi a!",null,"BODY648"],["阿明: 哥，真不是不给面子，我以茶代酒，敬你一杯，行不？ (Anh, thật không phải không nể mặt, em lấy trà thay rượu, mời anh một ly, được không?)",null,null,"Ā Míng: gē, zhēn bùshì bù gěimiànzi, wǒ yǐchádàijiǔ, jìng nǐ yībēi, xíng bù?",null,"BODY649"],["小王: 哈哈，行吧，你这中文说得真有两下子，连\"以茶代酒\"都会。 (Haha, thôi được, tiếng Trung của em đúng là có nghề, đến \"lấy trà thay rượu\" cũng biết.)",null,null,"Xiǎo Wáng: hāhā, xíng ba, nǐ zhè Zhōngwén shuō de zhēn yǒuliǎngxiàzi, lián \"yǐchádàijiǔ\" dōu huì.",null,"BODY650"],["阿明: 跟你们混久了，学会了不少。 (Chơi với các anh lâu, học được không ít.)",null,null,"Ā Míng: gēn nǐmen hùn jiǔ le, xuéhuì le bùshǎo.",null,"BODY651"],["小王: 下次来我家，我给你做我们湖南的剁椒鱼头，那才叫地道！ (Lần sau đến nhà anh, anh nấu cá đầu ớt băm kiểu Hồ Nam, đó mới là chuẩn vị!)",null,null,"Xiǎo Wáng: xiàcì lái wǒjiā, wǒ gěi nǐ zuò wǒmen Húnán de duòjiāo yútóu, nà cái jiào dìdao!",null,"BODY652"],["阿明: 好啊，一言为定！不过我不太能吃辣，你手下留情。 (Được, nói là làm! Nhưng em không ăn cay giỏi lắm, anh nương tay nhé.)",null,null,"Ā Míng: hǎo a, yīyánwéidìng! Bùguò wǒ bùtàinéng chī là, nǐ shǒuxiàliúqíng.",null,"BODY653"],["小王: 放心，我少放点辣椒。 (Yên tâm, anh cho ít ớt thôi.)",null,null,"Xiǎo Wáng: fàngxīn, wǒ shǎo fàng diǎn làjiāo.",null,"BODY654"],["情景对话 6 — (HSK5) Kể cùng một sự cố cho 3 đối tượng: bạn thân – sếp – khách hàng",null,null,"Qíngjǐng duìhuà",null,"BODY655-C"],["Bối cảnh: Kho giao nhầm hàng cho khách, bạn (nhân viên kinh doanh) phải kể lại.",null,null,null,null,"BODY656"],["跟好朋友说: 别提了，今天倒霉透了！仓库那帮人把货发错了，客户打电话来把我骂了一顿。说白了，又是我背锅。 (Đừng nhắc nữa, hôm nay xui tận mạng! Đám bên kho giao nhầm hàng, khách gọi điện mắng mình một trận. Nói thẳng ra, lại là mình gánh tội thay.)",null,null,"Gēn hǎo péngyou shuō: biétí le, jīntiān dǎoméi tòu le! Cāngkù nà bāng rén bǎ huò fācuò le, kèhù dǎdiànhuà lái bǎ wǒ mà le yīdùn. Shuōbáile, yòu shì wǒ bēiguō.",null,"BODY657"],["朋友回应: 真是的，你们仓库太不靠谱了！晚上出来喝一杯，放松一下。 (Thật là, kho bên bạn không đáng tin quá! Tối ra làm một ly, thư giãn chút.)",null,null,"Péngyou huíyìng: zhēnshì de, nǐmen cāngkù tài bùkàopǔ le! Wǎnshàng chūlái hēyībēi, fàngsōng yīxià.",null,"BODY658"],["跟经理说: 经理，今天出了一个问题，需要跟您汇报一下。仓库把王总的两个型号发反了，客户比较不满意。我已经安排明天补发正确的货，也跟仓库一起查了原因，主要是两个型号的包装太像了。 (Giám đốc, hôm nay có một vấn đề cần báo cáo anh. Kho giao ngược 2 mã cho Vương tổng, khách khá không hài lòng. Em đã sắp xếp mai gửi bù hàng đúng, cũng cùng kho tra nguyên nhân, chủ yếu do bao bì 2 mã quá giống nhau.)",null,null,"Gēn jīnglǐ shuō: jīnglǐ, jīntiān chū le yīgè wèntí, xūyào gēn nín huìbào yīxià. Cāngkù bǎ Wáng zǒng de liǎnggè xínghào fā fǎn le, kèhù bǐjiào bù mǎnyì. Wǒ yǐjīng ānpái míngtiān bǔfā zhèngquè de huò, yě gēn cāngkù yīqǐ chá le yuányīn, zhǔyào shì liǎnggè xínghào de bāozhuāng tài xiàng le.",null,"BODY659"],["经理回应: 处理得很及时。以后这两个型号的包装要做区分。 (Xử lý rất kịp thời. Sau này bao bì 2 mã này phải phân biệt.)",null,null,"Jīnglǐ huíyìng: chǔlǐ de hěn jíshí. Yǐhòu zhè liǎnggè xínghào de bāozhuāng yào zuò qūfēn.",null,"BODY660"],["跟客户说: 王总，非常抱歉，由于我们内部的失误，给您发错了型号，给您带来了不便。正确的货明天上午送到，运费由我们承担。我们已经采取措施，保证以后不会再发生类似的问题。 (Vương tổng, rất xin lỗi, do sai sót nội bộ chúng tôi đã giao nhầm mã, gây bất tiện cho ngài. Hàng đúng sáng mai giao tới, phí vận chuyển chúng tôi chịu. Chúng tôi đã có biện pháp đảm bảo sau này không tái diễn.)",null,null,"Gēn kèhù shuō: Wáng zǒng, fēicháng bàoqiàn, yóuyú wǒmen nèibù de shīwù, gěi nín fācuò le xínghào, gěi nín dàilái le bùbiàn. Zhèngquè de huò míngtiān shàngwǔ sòngdào, yùnfèi yóu wǒmen chéngdān. Wǒmen yǐjīng cǎiqǔcuòshī, bǎozhèng yǐhòu bùhuì zài fāshēng lèisì de wèntí.",null,"BODY661"],["客户回应: 好，希望下次注意。 (Được, mong lần sau chú ý.)",null,null,"Kèhù huíyìng: hǎo, xīwàng xiàcì zhùyì.",null,"BODY662"],["Phân tích GV: cùng một sự việc — với bạn: 别提了 / 倒霉透了 / 背锅 (cảm xúc, khẩu ngữ); với sếp: 汇报 / 原因 / 已经安排 (sự thật + hành động); với khách: 非常抱歉 / 由于我们内部的失误 / 采取措施 (xin lỗi + cam kết, không đổ lỗi cho kho).",null,null,"Biétí le | Dǎoméi tòu le | Bēiguō | Huìbào | Yuányīn | Yǐjīng ānpái | Fēicháng bàoqiàn | Yóuyú wǒmen nèibù de shīwù | Cǎiqǔcuòshī",null,"BODY663"],["引导练习 GUIDED SPEAKING — GV nói một câu khẩu ngữ, HS chuyển sang câu trang trọng (và ngược lại)",null,null,"Yǐndǎo liànxí",null,"BODY664-C"],["1. Hỏi: 把\"这事儿黄了\"换成跟老板说的话。 (Đổi \"chuyện này hỏng rồi\" thành câu nói với sếp.)",null,null,"Bǎ \"zhè shìr huáng le\" huànchéng gēn lǎobǎn shuō dehuà.",null,"BODY665"],["Đáp: 经理，这个合作可能没办法继续了，客户决定选择别的供应商。 (Giám đốc, lần hợp tác này có lẽ không tiếp tục được, khách quyết định chọn NCC khác.)",null,null,"Jīnglǐ, zhège hézuò kěnéng méi bànfǎ jìxù le, kèhù juédìng xuǎnzé biéde gōngyìngshāng.",null,"BODY666"],["2. Hỏi: 把\"他这个人不靠谱\"换成比较客气的说法。 (Đổi \"người này không đáng tin\" thành cách nói lịch sự hơn.)",null,null,"Bǎ \"tā zhège rén bùkàopǔ\" huànchéng bǐjiào kèqi de shuōfǎ.",null,"BODY667"],["Đáp: 他做事有时候不太稳定，重要的事情最好再确认一下。 (Anh ấy làm việc đôi khi không ổn định lắm, việc quan trọng tốt nhất xác nhận lại.)",null,null,"Tā zuòshì yǒushíhou bù tài wěndìng, zhòngyào de shìqing zuìhǎo zài quèrèn yīxià.",null,"BODY668"],["3. Hỏi: 把\"我已经妥善处理完毕\"换成跟朋友说的话。 (Đổi \"tôi đã xử lý thỏa đáng\" thành câu nói với bạn.)",null,null,"Bǎ \"wǒ yǐjīng tuǒshànchǔlǐ wánbì\" huànchéng gēn péngyou shuō dehuà.",null,"BODY669"],["Đáp: 放心，搞定了！ (Yên tâm, xong rồi!)",null,null,"Fàngxīn, gǎodìng le!",null,"BODY670"],["4. Hỏi: 朋友说\"今天又加班，累死了\"，你怎么用口语回应？ (Bạn than \"hôm nay lại tăng ca, mệt chết\", bạn đáp bằng khẩu ngữ thế nào?)",null,null,"Péngyou shuō \"jīntiān yòu jiābān, lèisǐ le\", nǐ zěnme yòng kǒuyǔ huíyìng?",null,"BODY671"],["Đáp: 打工人太难了！别想了，周末出来吃顿好的，我请！ (Dân làm thuê khổ quá! Đừng nghĩ nữa, cuối tuần ra ăn bữa ngon, mình mời!)",null,null,"Dǎ gōngrén tài nán le! Bié xiǎng le, zhōumò chūlái chī dùn hǎo de, wǒ qǐng!",null,"BODY672"],["5. Hỏi: (HSK5) 你觉得外国人学中文，要不要学网络流行语？为什么？ (Bạn thấy người nước ngoài học tiếng Trung có nên học từ lóng mạng không? Vì sao?)",null,null,"Nǐ juéde wàiguórén xué Zhōngwén, yào bùyào xué wǎngluò liúxíngyǔ? Wèishénme?",null,"BODY673"],["Đáp: 我觉得要学，但是要知道什么时候用。学了能听懂中国同事和朋友的话，聊天更自然；不过在正式场合、写邮件的时候，最好不要用，不然会显得不专业。 (Nên học nhưng phải biết khi nào dùng. Học rồi hiểu được đồng nghiệp, bạn bè TQ, trò chuyện tự nhiên hơn; nhưng ở dịp trang trọng, viết email thì tốt nhất đừng dùng, kẻo thiếu chuyên nghiệp.)",null,null,"Wǒ juéde yào xué, dànshì yào zhīdao shénme shíhou yòng. Xué le néng tīngdǒng Zhōngguó tóngshì hé péngyou dehuà, liáotiān gèng zìrán; bùguò zài zhèngshì chǎnghé, xiě yóujiàn de shíhou, zuìhǎo bùyào yòng, bùrán huì xiǎnde bù zhuānyè.",null,"BODY674"],["情景模拟 ROLE-PLAY — Cùng một ý nói với bạn và với cấp trên. Vòng 2 (bất ngờ): GV đột ngột đổi vai từ bạn thân sang sếp giữa chừng",null,null,"Qíngjǐng mónǐ",null,"BODY675-C"],["GV (朋友): 哎，你那个报告写完了没？ (Này, cái báo cáo của bạn viết xong chưa?)",null,null,"Péngyou | Āi, nǐ nàge bàogào xiě wán le méi?",null,"BODY676"],["HS: 别提了，写了一半，数据还没拿到，财务那边太磨叽了。 (Đừng nhắc nữa, viết được nửa, chưa có số liệu, bên tài chính lề mề quá.)",null,null,"Biétí le, xiě le yībàn, shùjù hái méinádào, cáiwù nàbiān tài mòji le.",null,"BODY677"],["GV (朋友): 那今天能搞定吗？ (Vậy hôm nay xong được không?)",null,null,"Péngyou | Nà jīntiān néng gǎodìng ma?",null,"BODY678"],["HS: 够呛，估计得加班了。 (Gay đấy, chắc phải tăng ca rồi.)",null,null,"Gòuqiàng, gūjì de jiābān le.",null,"BODY679"],["GV (biến cố, đổi vai thành 经理): 小阮，报告什么时候能给我？ (Tiểu Nguyễn, báo cáo khi nào gửi tôi được?)",null,null,"Jīnglǐ | Xiǎo Ruǎn, bàogào shénme shíhou néng gěi wǒ?",null,"BODY680"],["HS: 经理，报告已经完成了一半，现在还在等财务部的数据。如果下午能拿到数据，今晚我加班完成，明天上午九点前发给您。 (Giám đốc, báo cáo đã xong một nửa, đang chờ số liệu phòng tài chính. Nếu chiều có số liệu, tối nay em tăng ca hoàn thành, trước 9h sáng mai gửi anh.)",null,null,"Jīnglǐ, bàogào yǐjīng wánchéng le yībàn, xiànzài hái zài děng cáiwùbù de shùjù. Rúguǒ xiàwǔ néng nádào shùjù, jīnwǎn wǒ jiābān wánchéng, míngtiān shàngwǔ jiǔdiǎn qián fāgěinín.",null,"BODY681"],["GV (经理): 财务那边需要我帮你催一下吗？ (Bên tài chính có cần tôi giục giúp không?)",null,null,"Jīnglǐ | Cáiwù nàbiān xūyào wǒ bāng nǐ cuī yīxià ma?",null,"BODY682"],["HS: 如果方便的话，麻烦您帮我跟财务经理说一声，谢谢您。 (Nếu tiện, phiền anh nói giúp với giám đốc tài chính một tiếng, cảm ơn anh.)",null,null,"Rúguǒ fāngbiàn dehuà, máfan nín bāng wǒ gēn cáiwùjīnglǐ shuō yīshēng, xièxienín.",null,"BODY683"],["GV (đổi lại thành 朋友): 嘿，经理走了。你刚才说话好正式啊！ (Này, giám đốc đi rồi. Lúc nãy bạn nói chuyện trang trọng ghê!)",null,null,"Péngyou | Hēi, jīnglǐ zǒu le. Nǐ gāngcái shuōhuà hǎo zhèngshì a!",null,"BODY684"],["HS: 那当然，跟老板说话可不能随便。走，下班喝杯奶茶去！ (Đương nhiên, nói với sếp sao tùy tiện được. Đi, tan làm uống trà sữa đi!)",null,null,"Nà dāngrán, gēn lǎobǎn shuōhuà kě bùnéng suíbiàn. Zǒu, xiàbān hēbēi nǎichá qù!",null,"BODY685"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai ngữ cảnh → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY686-C"],["✗ (跟客户说) 放心，搞定了！ → ✓ 请您放心，我们已经处理好了。",null,null,"Gēn kèhù shuō | Fàngxīn, gǎodìng le! | Qǐng nín fàngxīn, wǒmen yǐjīng chǔlǐ hǎo le.",null,"BODY687"],["✗ (跟经理说) 这个供应商不靠谱。 → ✓ 这个供应商的交货不太稳定，建议我们多找一家备选。",null,null,"Gēn jīnglǐ shuō | Zhège gōngyìngshāng bùkàopǔ. | Zhège gōngyìngshāng de jiāohuò bù tài wěndìng, jiànyì wǒmen duō zhǎo yījiā bèixuǎn.",null,"BODY688"],["✗ (写邮件) 这事儿黄了。 → ✓ 很遗憾，这次合作未能达成。",null,null,"Xiě yóujiàn | Zhè shìr huáng le. | Hěn yíhàn, zhècì hézuò wèinéng dáchéng.",null,"BODY689"],["✗ 我很没辙。 → ✓ 我真没辙了。/ 我没辙了。 (没辙 không đi với 很.)",null,null,"Wǒ hěn méizhé. | Wǒ zhēn méizhé le. / | Wǒ méizhé le. | Méizhé | Hěn .",null,"BODY690"],["✗ 他放鸽子我。 → ✓ 他放我鸽子了。/ 他放了我的鸽子。 (Tân ngữ chen giữa 放 và 鸽子.)",null,null,"Tā fànggēzi wǒ. | Tā fàng wǒ gēzi le. / | Tā fàng le wǒ de gēzi. | Fàng | Gēzi .",null,"BODY691"],["✗ 这个很小菜一碟。 → ✓ 这个是小菜一碟。/ 小菜一碟！",null,null,"Zhège hěn xiǎocàiyīdié. | Zhège shì xiǎocàiyīdié. / | Xiǎocàiyīdié!",null,"BODY692"],["Lưu ý: âm 儿 hóa (这事儿, 一点儿, 哪儿) là giọng miền Bắc TQ; người miền Nam TQ ít dùng — HS nghe hiểu là đủ, không bắt buộc nói.",null,null,"Ér | Zhè shìr | Yīdiǎnr | Nǎr",null,"BODY693"],["Phát âm: 没辙 méizhé; 靠谱 kàopǔ; 搞定 gǎodìng; 够呛 gòuqiàng; 甩锅 shuǎiguō.",null,null,"Méizhé | Kàopǔ | Gǎodìng | Gòuqiàng | Shuǎiguō",null,"BODY694"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY695-C"],["Ghi âm 10 câu khẩu ngữ trong ngữ cảnh thật (mỗi câu kèm 1 tình huống), sau đó chọn 3 câu và nói lại bằng cách trang trọng dành cho sếp hoặc khách hàng.",null,null,null,null,"BODY696"],["HSK5: ghi âm Hội thoại 6 với một sự cố của chính mình, kể cho 3 đối tượng: bạn thân – sếp – khách hàng.",null,null,null,null,"BODY697"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY698"],["Buổi 20 — 即兴问答与快速反应 Phản xạ tức thời",null,null,"Jíxìng wèndá yǔ kuàisùfǎnyìng",null,"BODY699-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY700-C"],["HSK4: Trả lời 15 câu hỏi ngẫu nhiên, mỗi câu 30–60 giây, không im lặng quá 3 giây. HSK5: Trả lời câu hỏi bất ngờ 1–2 phút có cấu trúc, phản biện khi bị hỏi vặn.",null,null,null,null,"BODY701"],["Công thức trả lời nhanh 3 bước: ① 争取时间 Câu \"câu giờ\" tự nhiên (2–3 giây) → ② 直接回答 Trả lời thẳng ý chính → ③ 补充理由或例子 Bổ sung 1 lý do hoặc 1 ví dụ.",null,null,"Zhēngqǔshíjiān | Zhíjiē huídá | Bǔchōng lǐyóu huò lìzi",null,"BODY702"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY703-C"],["1. Hỏi: 如果现在给你一百万美元，你第一件事做什么？ (Nếu bây giờ cho bạn 1 triệu đô, việc đầu tiên bạn làm gì?)",null,null,"Rúguǒ xiànzài gěi nǐ yībǎiwànměiyuán, nǐ dìyījiàn shì zuò shénme?",null,"BODY704"],["Đáp: 让我想想……我会先给父母在老家买一套新房子，因为他们辛苦了一辈子。 (Để tôi nghĩ đã… Tôi sẽ mua trước cho bố mẹ một căn nhà mới ở quê, vì họ vất vả cả đời.)",null,null,"Ràng wǒ xiǎngxiang…… wǒhuì xiān gěi fùmǔ zài lǎojiā mǎi yītào xīnfángzi, yīnwèi tāmen xīnkǔ le yībèizi.",null,"BODY705"],["2. Hỏi: 你最怕什么？ (Bạn sợ nhất điều gì?)",null,null,"Nǐ zuì pà shénme?",null,"BODY706"],["Đáp: 怎么说呢……我最怕在很多人面前说中文说错，不过现在好多了。 (Nói sao nhỉ… Tôi sợ nhất nói sai tiếng Trung trước nhiều người, nhưng giờ đỡ nhiều rồi.)",null,null,"Zěnme shuō ne…… wǒ zuì pà zài hěnduō rén miànqián shuō Zhōngwén shuōcuò, bùguò xiànzài hǎoduō le.",null,"BODY707"],["3. Hỏi: 用一句话介绍你的城市。 (Giới thiệu thành phố của bạn bằng một câu.)",null,null,"Yòng yījù huà jièshào nǐ de chéngshì.",null,"BODY708"],["Đáp: 海防是一个有很多凤凰花的港口城市，海鲜又新鲜又便宜。 (Hải Phòng là thành phố cảng nhiều hoa phượng, hải sản vừa tươi vừa rẻ.)",null,null,"Hǎifáng shì yīgè yǒu hěnduō fènghuánghuā de gǎngkǒuchéngshì, hǎixiān yòu xīnxiān yòu piányi.",null,"BODY709"],["语言输入 INPUT — Câu \"câu giờ\" và nối ý tự nhiên",null,null,"Yǔyán shūrù",null,"BODY710-C"],["1. 让我想想 (để tôi nghĩ đã): 让我想想……应该是三年前的事了。 (Để tôi nghĩ… chắc là chuyện 3 năm trước.)",null,null,"Ràng wǒ xiǎngxiang | Ràng wǒ xiǎngxiang…… yīnggāi shì sānnián qián de shì le.",null,"BODY711"],["2. 怎么说呢 (nói sao nhỉ): 怎么说呢，这个问题有点复杂。 (Nói sao nhỉ, vấn đề này hơi phức tạp.)",null,null,"Zěnme shuō ne | Zěnme shuō ne, zhège wèntí yǒudiǎn fùzá.",null,"BODY712"],["3. 具体来说 (cụ thể mà nói): 具体来说，我每天要处理三十多封邮件。 (Cụ thể là mỗi ngày tôi xử lý hơn 30 email.)",null,null,"Jùtǐláishuō | Jùtǐláishuō, wǒ měitiān yào chǔlǐ sānshíduōfēng yóujiàn.",null,"BODY713"],["4. 这得看情况 (cái này còn tùy): 加不加班，这得看情况，月底一般比较忙。 (Có tăng ca không thì tùy, cuối tháng thường bận.)",null,null,"Zhè děi kàn qíngkuàng | Jiā bù jiābān, zhè děi kàn qíngkuàng, yuèdǐ yībān bǐjiàománg.",null,"BODY714"],["5. 好问题 (câu hỏi hay): 好问题！我还真没仔细想过。 (Câu hỏi hay! Tôi thật chưa nghĩ kỹ.)",null,null,"Hǎo wèntí | Hǎo wèntí! Wǒ hái zhēn méi zǐxì xiǎng guò.",null,"BODY715"],["6. 说实话 (nói thật): 说实话，我更喜欢在家吃饭。 (Nói thật, tôi thích ăn ở nhà hơn.)",null,null,"Shuōshíhuà | Shuōshíhuà, wǒ gèng xǐhuan zàijiā chīfàn.",null,"BODY716"],["7. 这么说吧 (nói thế này nhé): 这么说吧，如果没有中文，我现在的工作根本做不了。 (Nói thế này, nếu không có tiếng Trung, công việc hiện tại tôi không làm được.)",null,null,"Zhème shuō ba | Zhème shuō ba, rúguǒ méiyǒu Zhōngwén, wǒ xiànzài de gōngzuò gēnběn zuòbùliǎo.",null,"BODY717"],["8. 一方面……另一方面 (một mặt … mặt khác): 一方面工资不错，另一方面离家也近。 (Một mặt lương tốt, mặt khác gần nhà.)",null,null,"Yīfāngmiàn…… lìngyīfāngmiàn | Yīfāngmiàn gōngzī bùcuò, lìngyīfāngmiàn líjiā yě jìn.",null,"BODY718"],["9. 打个比方 (lấy ví dụ so sánh): 打个比方，学语言就像健身，三天不练就退步。 (Ví như học ngôn ngữ giống tập gym, 3 ngày không tập là thụt lùi.)",null,null,"Dǎgèbǐfāng | Dǎgèbǐfāng, xué yǔyán jiù xiàng jiànshēn, sāntiān bù liànjiù tuìbù.",null,"BODY719"],["10. 您的意思是……吗？ (Ý anh/chị là … phải không? – xác nhận câu hỏi): 您的意思是问我为什么离职吗？ (Ý anh/chị là hỏi vì sao tôi nghỉ việc phải không?)",null,null,"Nín de yìsi shì…… ma? | Nín de yìsi shì wèn wǒ wèishénme lízhí ma?",null,"BODY720"],["11. 不好意思，能再说一遍吗？ (Xin lỗi, nói lại được không?): 不好意思，最后一个词我没听清，能再说一遍吗？ (Xin lỗi, từ cuối tôi nghe không rõ, nói lại được không?)",null,null,"Bùhǎoyìsi, néng zàishuō yībiàn ma? | Bùhǎoyìsi, zuìhòu yīgè cí wǒ méi tīng qīng, néng zàishuō yībiàn ma?",null,"BODY721"],["12. 总之 (tóm lại): 总之，我觉得这是一个很好的机会。 (Tóm lại, tôi thấy đây là cơ hội rất tốt.)",null,null,"Zǒngzhī | Zǒngzhī, wǒ juéde zhè shì yīgè hěn hǎo de jīhuì.",null,"BODY722"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY723-C"],["1. 我还没仔细想过，不过…… (Tôi chưa nghĩ kỹ, nhưng …)",null,null,"Wǒ hái méi zǐxì xiǎng guò, bùguò……",null,"BODY724"],["Ví dụ: 我还没仔细想过，不过如果有机会去中国工作，我应该会去。 (Tôi chưa nghĩ kỹ, nhưng nếu có cơ hội sang TQ làm việc, chắc tôi sẽ đi.)",null,null,"Wǒ hái méi zǐxì xiǎng guò, bùguò rúguǒ yǒu jīhuì qù Zhōngguó gōngzuò, wǒ yīnggāi huì qù.",null,"BODY725"],["Ví dụ: 我还没仔细想过退休以后做什么，不过我很想开一家小咖啡店。 (Tôi chưa nghĩ kỹ nghỉ hưu sẽ làm gì, nhưng rất muốn mở một quán cà phê nhỏ.)",null,null,"Wǒ hái méi zǐxì xiǎng guò tuìxiū yǐhòu zuò shénme, bùguò wǒ hěn xiǎngkāi yījiā xiǎo kāfēidiàn.",null,"BODY726"],["2. 这得看情况：如果……，就……；如果……，就…… (Còn tùy: nếu …, thì …; nếu …, thì …)",null,null,"Zhè děi kàn qíngkuàng: rúguǒ……, jiù……; rúguǒ……, jiù……",null,"BODY727"],["Ví dụ: 这得看情况：如果是短途，我就坐大巴；如果超过五百公里，我就坐飞机。 (Còn tùy: đi gần thì đi xe khách; quá 500km thì đi máy bay.)",null,null,"Zhè děi kàn qíngkuàng: rúguǒ shì duǎntú, wǒ jiù zuò dàbā; rúguǒ chāoguò wǔbǎigōnglǐ, wǒ jiù zuòfēijī.",null,"BODY728"],["Ví dụ: 这得看情况：如果是客户的急事，我周末也会回复；如果不急，就周一再说。 (Còn tùy: việc gấp của khách cuối tuần tôi cũng trả lời; không gấp thì để thứ 2.)",null,null,"Zhè děi kàn qíngkuàng: rúguǒ shì kèhù de jíshì, wǒ zhōumò yě huì huífù; rúguǒ bù jí, jiù zhōuyī zàishuō.",null,"BODY729"],["3. 如果一定要选的话，我会选……，因为…… (Nếu nhất định phải chọn, tôi chọn …, vì …)",null,null,"Rúguǒ yīdìng yào xuǎn dehuà, wǒhuì xuǎn……, yīnwèi……",null,"BODY730"],["Ví dụ: 如果一定要选的话，我会选夏天，因为可以去海边游泳。 (Nếu nhất định phải chọn, tôi chọn mùa hè, vì được đi biển bơi.)",null,null,"Rúguǒ yīdìng yào xuǎn dehuà, wǒhuì xuǎn xiàtiān, yīnwèi kěyǐ qù hǎibiān yóuyǒng.",null,"BODY731"],["Ví dụ: 如果一定要选的话，我会选工资低一点但是能学到东西的工作。 (Nếu nhất định chọn, tôi chọn việc lương thấp hơn nhưng học được nhiều.)",null,null,"Rúguǒ yīdìng yào xuǎn dehuà, wǒhuì xuǎn gōngzī dī yīdiǎn dànshì néng xuédào dōngxi de gōngzuò.",null,"BODY732"],["4. 说到……，我想起…… (Nói đến …, tôi nhớ đến …)",null,null,"Shuō dào……, wǒ xiǎngqǐ……",null,"BODY733"],["Ví dụ: 说到旅行，我想起去年在会安迷路的事。 (Nói đến du lịch, tôi nhớ chuyện năm ngoái lạc đường ở Hội An.)",null,null,"Shuō dào lǚxíng, wǒ xiǎngqǐ qùnián zài Huì'ān mílù de shì.",null,"BODY734"],["Ví dụ: 说到压力，我想起刚入职的时候每天都紧张得睡不着。 (Nói đến áp lực, tôi nhớ hồi mới vào làm ngày nào cũng căng thẳng mất ngủ.)",null,null,"Shuō dào yālì, wǒ xiǎngqǐ gāng rùzhí de shíhou měitiān dōu jǐnzhāng de shuìbùzhe.",null,"BODY735"],["5. 对我来说，最重要的是…… (Với tôi, quan trọng nhất là …)",null,null,"Duì wǒ láishuō, zuì zhòngyào de shì……",null,"BODY736"],["Ví dụ: 对我来说，最重要的是家人健康。 (Với tôi, quan trọng nhất là gia đình khỏe mạnh.)",null,null,"Duì wǒ láishuō, zuì zhòngyào de shì jiārén jiànkāng.",null,"BODY737"],["Ví dụ: 对我来说，选工作最重要的是团队氛围。 (Với tôi, chọn việc quan trọng nhất là không khí đội nhóm.)",null,null,"Duì wǒ láishuō, xuǎn gōngzuò zuì zhòngyào de shì tuánduì fēnwéi.",null,"BODY738"],["6. 有的人觉得……，但是我觉得…… (Có người thấy …, nhưng tôi thấy …)",null,null,"Yǒu de rén juéde……, dànshì wǒ juéde……",null,"BODY739"],["Ví dụ: 有的人觉得网购不安全，但是我觉得只要选大平台就没问题。 (Có người thấy mua online không an toàn, nhưng tôi thấy chỉ cần chọn sàn lớn là không vấn đề.)",null,null,"Yǒu de rén juéde wǎng gòu bù ānquán, dànshì wǒ juéde zhǐyào xuǎn dà píngtái jiù méi wèntí.",null,"BODY740"],["Ví dụ: 有的人觉得年纪大了学不好外语，但是我觉得关键是方法。 (Có người thấy lớn tuổi học ngoại ngữ không tốt, nhưng tôi thấy quan trọng là phương pháp.)",null,null,"Yǒu de rén juéde niánjì dà le xué bùhǎo wàiyǔ, dànshì wǒ juéde guānjiàn shì fāngfǎ.",null,"BODY741"],["7. 打个比方，……就像…… (Ví như, … giống như …)",null,null,"Dǎgèbǐfāng,…… jiù xiàng……",null,"BODY742"],["Ví dụ: 打个比方，管理一个团队就像踢足球，每个人都有自己的位置。 (Ví như quản lý một đội giống đá bóng, mỗi người có vị trí riêng.)",null,null,"Dǎgèbǐfāng, guǎnlǐ yīgè tuánduì jiù xiàng tīzúqiú, měigè rén dōu yǒu zìjǐ de wèizhì.",null,"BODY743"],["Ví dụ: 打个比方，客户关系就像朋友关系，要经常联系。 (Ví như quan hệ khách hàng giống quan hệ bạn bè, phải liên lạc thường xuyên.)",null,null,"Dǎgèbǐfāng, kèhùguānxi jiù xiàng péngyou guānxi, yào jīngcháng liánxì.",null,"BODY744"],["8. 总之，…… (Tóm lại, …)",null,null,"Zǒngzhī,……",null,"BODY745"],["Ví dụ: 总之，我觉得年轻人应该多出去看看世界。 (Tóm lại, tôi thấy người trẻ nên ra ngoài nhìn thế giới nhiều hơn.)",null,null,"Zǒngzhī, wǒ juéde niánqīngrén yīnggāi duō chūqù kànkan shìjiè.",null,"BODY746"],["9. (HSK5) 您这个问题问得很好，我想从两个方面来回答：…… (Câu hỏi của anh/chị rất hay, tôi muốn trả lời từ 2 mặt: …)",null,null,"Nín zhège wèntí wèn de hěn hǎo, wǒ xiǎng cóng liǎnggè fāngmiàn lái huídá:……",null,"BODY747"],["Ví dụ: 您这个问题问得很好，我想从两个方面来回答：从个人来看，……；从公司来看，……。 (Câu hỏi rất hay, tôi trả lời từ 2 mặt: về cá nhân, …; về công ty, …)",null,null,"Nín zhège wèntí wèn de hěn hǎo, wǒ xiǎng cóng liǎnggè fāngmiàn lái huídá: cóng gèrén láikàn,……; cóng gōngsī láikàn,…….",null,"BODY748"],["10. (HSK5) 我理解您的疑问，不过我想补充一点…… (Tôi hiểu thắc mắc của anh/chị, nhưng tôi muốn bổ sung một điểm …)",null,null,"Wǒ lǐjiě nín de yíwèn, bùguò wǒ xiǎng bǔchōng yīdiǎn……",null,"BODY749"],["Ví dụ: 我理解您的疑问，不过我想补充一点：虽然我只做了两年，但是我负责的都是最大的客户。 (Tôi hiểu thắc mắc, nhưng xin bổ sung: tuy tôi mới làm 2 năm, nhưng toàn phụ trách khách lớn nhất.)",null,null,"Wǒ lǐjiě nín de yíwèn, bùguò wǒ xiǎng bǔchōng yīdiǎn: suīrán wǒ zhǐ zuò le liǎngnián, dànshì wǒ fùzé de dōu shì zuìdà de kèhù.",null,"BODY750"],["15 CÂU HỎI NHANH (HSK4) — Mỗi câu trả lời 30–60 giây theo công thức 3 bước",null,null,null,null,"BODY751-C"],["1. Hỏi: 你早上起床以后第一件事做什么？ (Sáng dậy việc đầu tiên bạn làm gì?)",null,null,"Nǐ zǎoshang qǐchuáng yǐhòu dìyījiàn shì zuò shénme?",null,"BODY752"],["Đáp: 说实话，我第一件事是看手机，看看有没有客户的消息。不过我在努力改这个习惯。 (Nói thật, việc đầu tiên là xem điện thoại, xem có tin nhắn khách không. Nhưng tôi đang cố bỏ thói quen này.)",null,null,"Shuōshíhuà, wǒ dìyījiàn shì shì kàn shǒujī, kànkan yǒuméiyǒu kèhù de xiāoxi. Bùguò wǒ zài nǔlì gǎi zhège xíguàn.",null,"BODY753"],["2. Hỏi: 你最喜欢的越南菜是什么？为什么？ (Món Việt bạn thích nhất là gì? Vì sao?)",null,null,"Nǐ zuì xǐhuan de Yuènán cài shì shénme? Wèishénme?",null,"BODY754"],["Đáp: 我最喜欢牛肉粉，因为汤很香，而且早上吃一碗，一整天都有精神。 (Tôi thích phở bò nhất, vì nước dùng thơm, sáng ăn một bát cả ngày tỉnh táo.)",null,null,"Wǒ zuì xǐhuan niúròufěn, yīnwèi tāng hěn xiāng, érqiě zǎoshang chī yīwǎn, yīzhěngtiān dōu yǒu jīngshén.",null,"BODY755"],["3. Hỏi: 你觉得自己是外向的人还是内向的人？ (Bạn thấy mình hướng ngoại hay hướng nội?)",null,null,"Nǐ juéde zìjǐ shì wàixiàng de rén háishì nèixiàng de rén?",null,"BODY756"],["Đáp: 这得看情况。跟熟人在一起我很外向，话很多；跟陌生人在一起就比较安静。 (Còn tùy. Với người quen tôi rất hướng ngoại, nói nhiều; với người lạ thì khá trầm.)",null,null,"Zhè děi kàn qíngkuàng. Gēn shúrén zài yīqǐ wǒ hěn wàixiàng, huà hěnduō; gēn mòshēngrén zài yīqǐ jiù bǐjiào ānjìng.",null,"BODY757"],["4. Hỏi: 你上一次哭是什么时候？ (Lần gần nhất bạn khóc là khi nào?)",null,null,"Nǐ shàng yīcì kū shì shénme shíhou?",null,"BODY758"],["Đáp: 让我想想……应该是去年我妹妹结婚的时候，太感动了。 (Để tôi nghĩ… chắc là đám cưới em gái năm ngoái, cảm động quá.)",null,null,"Ràng wǒ xiǎngxiang…… yīnggāi shì qùnián wǒ mèimei jiéhūn de shíhou, tài gǎndòng le.",null,"BODY759"],["5. Hỏi: 如果可以去任何一个国家生活一年，你选哪儿？ (Nếu được sống một năm ở bất kỳ nước nào, bạn chọn đâu?)",null,null,"Rúguǒ kěyǐ qù rènhé yīgè guójiā shēnghuó yīnián, nǐ xuǎn nǎr?",null,"BODY760"],["Đáp: 如果一定要选的话，我会选中国，因为可以每天说中文，中文肯定进步很快。 (Nếu nhất định chọn, tôi chọn TQ, vì được nói tiếng Trung hằng ngày, chắc chắn tiến bộ nhanh.)",null,null,"Rúguǒ yīdìng yào xuǎn dehuà, wǒhuì xuǎn Zhōngguó, yīnwèi kěyǐ měitiān shuō Zhōngwén, Zhōngwén kěndìng jìnbù hěnkuài.",null,"BODY761"],["6. Hỏi: 你觉得钱重要吗？ (Bạn thấy tiền có quan trọng không?)",null,null,"Nǐ juéde qián zhòngyào ma?",null,"BODY762"],["Đáp: 当然重要，但不是最重要的。对我来说，最重要的是健康和家人。 (Tất nhiên quan trọng, nhưng không phải quan trọng nhất. Với tôi quan trọng nhất là sức khỏe và gia đình.)",null,null,"Dāngrán zhòngyào, dàn bùshì zuì zhòngyào de. Duì wǒ láishuō, zuì zhòngyào de shì jiànkāng hé jiārén.",null,"BODY763"],["7. Hỏi: 你的手机里最常用的软件是什么？ (Ứng dụng bạn dùng nhiều nhất trên điện thoại là gì?)",null,null,"Nǐ de shǒujī lǐ zuì chángyòng de ruǎnjiàn shì shénme?",null,"BODY764"],["Đáp: 是Zalo和微信。Zalo跟越南朋友聊天，微信跟中国客户联系。 (Là Zalo và WeChat. Zalo nhắn với bạn Việt, WeChat liên lạc khách TQ.)",null,null,"Shì Z | Hé wēi xìn. Z | Gēn Yuènán péngyou liáotiān, wēi xìn gēn Zhōngguó kèhù liánxì.",null,"BODY765"],["8. Hỏi: 周末你更喜欢在家还是出去？ (Cuối tuần bạn thích ở nhà hay ra ngoài?)",null,null,"Zhōumò nǐ gèng xǐhuan zàijiā háishì chūqù?",null,"BODY766"],["Đáp: 一方面，上了一周的班很累，想在家休息；另一方面，孩子总是吵着要出去玩，所以一般是上午在家，下午出去。 (Một mặt đi làm cả tuần mệt, muốn ở nhà nghỉ; mặt khác con cứ đòi đi chơi, nên thường sáng ở nhà, chiều ra ngoài.)",null,null,"Yīfāngmiàn, shàng le yīzhōu de bān hěn lèi, xiǎng zàijiā xiūxi; lìngyīfāngmiàn, háizi zǒngshì chǎo zhe yào chūqùwán, suǒyǐ yībān shì shàngwǔ zàijiā, xiàwǔ chūqù.",null,"BODY767"],["9. Hỏi: 你学中文遇到的最大困难是什么？ (Khó khăn lớn nhất khi học tiếng Trung là gì?)",null,null,"Nǐ xué Zhōngwén yùdào de zuìdà kùnnán shì shénme?",null,"BODY768"],["Đáp: 怎么说呢……最大的困难是声调。我说\"买\"和\"卖\"经常说反，客户都被我搞糊涂了。 (Nói sao nhỉ… khó nhất là thanh điệu. \"Mua\" và \"bán\" tôi hay nói ngược, khách bị tôi làm rối luôn.)",null,null,"Zěnme shuō ne…… zuìdà de kùnnán shì shēngdiào. Wǒ shuō \"mǎi\" hé \"mài\" jīngcháng shuō fǎn, kèhù dōu bèi wǒ gǎohútú le.",null,"BODY769"],["10. Hỏi: 你最近看过的一部电影是什么？ (Bộ phim gần nhất bạn xem là gì?)",null,null,"Nǐ zuìjìn kànguò de yībù diànyǐng shì shénme?",null,"BODY770"],["Đáp: 我最近看了一部中国电影，讲的是一个快递员的故事，挺感人的，也学到了不少口语。 (Gần đây tôi xem một phim TQ, kể về một shipper, khá cảm động, cũng học được không ít khẩu ngữ.)",null,null,"Wǒ zuìjìn kàn le yībù Zhōngguó diànyǐng, jiǎng de shì yīgè kuàidì yuán de gùshì, tǐng gǎnrén de, yě xuédào le bùshǎo kǒuyǔ.",null,"BODY771"],["11. Hỏi: 你觉得十年以后的河内会是什么样？ (Bạn thấy 10 năm nữa Hà Nội sẽ thế nào?)",null,null,"Nǐ juéde shínián yǐhòu de Hénèi huì shì shénmeyàng?",null,"BODY772"],["Đáp: 我还没仔细想过，不过我希望地铁更多，摩托车少一点，空气也能好一点。 (Tôi chưa nghĩ kỹ, nhưng mong có nhiều tàu điện hơn, ít xe máy hơn, không khí cũng tốt hơn.)",null,null,"Wǒ hái méi zǐxì xiǎng guò, bùguò wǒ xīwàng dìtiě gèng duō, mótuōchē shǎo yīdiǎn, kōngqì yě néng hǎo yīdiǎn.",null,"BODY773"],["12. Hỏi: 你会做饭吗？拿手菜是什么？ (Bạn biết nấu ăn không? Món ruột là gì?)",null,null,"Nǐ huì zuòfàn ma? Náshǒucài shì shénme?",null,"BODY774"],["Đáp: 会一点。我的拿手菜是红烧肉，每次家里来客人我都会做。 (Biết chút ít. Món ruột là thịt kho, mỗi lần nhà có khách tôi đều nấu.)",null,null,"Huì yīdiǎn. Wǒ de náshǒucài shì hóngshāoròu, měicì jiālǐ lái kèrén wǒ dōu huì zuò.",null,"BODY775"],["13. Hỏi: 你觉得什么样的老板是好老板？ (Bạn thấy sếp thế nào là sếp tốt?)",null,null,"Nǐ juéde shénmeyàng de lǎobǎn shì hǎo lǎobǎn?",null,"BODY776"],["Đáp: 对我来说，好老板是愿意听员工意见、出了问题不甩锅的人。 (Với tôi, sếp tốt là người chịu nghe ý kiến nhân viên, có chuyện không đổ lỗi.)",null,null,"Duì wǒ láishuō, hǎo lǎobǎn shì yuànyì tīng yuángōng yìjiàn, chū le wèntí bù shuǎiguō de rén.",null,"BODY777"],["14. Hỏi: 你有什么坏习惯？ (Bạn có thói quen xấu gì?)",null,null,"Nǐ yǒu shénme huàixíguàn?",null,"BODY778"],["Đáp: 说实话，我睡觉前总是刷短视频，一刷就是一个小时，第二天起不来。 (Nói thật, trước khi ngủ tôi luôn lướt video ngắn, lướt là cả tiếng, hôm sau dậy không nổi.)",null,null,"Shuōshíhuà, wǒ shuìjiào qián zǒngshì shuā duǎn shìpín, yī shuā jiùshì yīgè xiǎoshí, dì'èrtiān qǐbùlái.",null,"BODY779"],["15. Hỏi: 用三个词形容你的工作。 (Dùng 3 từ miêu tả công việc của bạn.)",null,null,"Yòng sāngè cí xíngróng nǐ de gōngzuò.",null,"BODY780"],["Đáp: 忙、有挑战、有意思。忙是因为客户多；有挑战是因为每天都有新问题；有意思是因为能认识很多不同的人。 (Bận, thử thách, thú vị. Bận vì nhiều khách; thử thách vì ngày nào cũng có vấn đề mới; thú vị vì quen được nhiều người khác nhau.)",null,null,"Máng, yǒu tiǎozhàn, yǒuyìsi. Máng shìyīnwèi kèhù duō; yǒu tiǎozhàn shìyīnwèi měitiān dōu yǒu xīn wèntí; yǒuyìsi shìyīnwèi néng rènshi hěnduō bùtóng de rén.",null,"BODY781"],["情景对话 1 — Gặp sếp Trung Quốc trong thang máy: small talk 1 phút (HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY782-C"],["总经理: 早啊，小阮！ (Chào buổi sáng, Tiểu Nguyễn!)",null,null,"Zǒngjīnglǐ: zǎo a, Xiǎo Ruǎn!",null,"BODY783"],["小阮: 李总早！您今天来得真早。 (Chào Lý tổng! Hôm nay ngài đến sớm thật.)",null,null,"Xiǎo Ruǎn: Lǐ zǒng zǎo! Nín jīntiān láide zhēn zǎo.",null,"BODY784"],["总经理: 九点要跟总部开视频会。最近工作怎么样？ (9h phải họp video với tổng bộ. Dạo này công việc thế nào?)",null,null,"Zǒngjīnglǐ: jiǔdiǎn yào gēn zǒngbù kāi shìpín huì. Zuìjìn gōngzuò zěnmeyàng?",null,"BODY785"],["小阮: 挺忙的，不过很充实。上个月我们开发了两个新客户。 (Khá bận, nhưng rất đầy đủ. Tháng trước chúng em phát triển được 2 khách mới.)",null,null,"Xiǎo Ruǎn: tǐng máng de, bùguò hěn chōngshí. Shànggèyuè wǒmen kāifā le liǎnggè xīn kèhù.",null,"BODY786"],["总经理: 不错不错。你中文进步很大啊，在哪儿学的？ (Tốt lắm. Tiếng Trung của em tiến bộ nhiều đấy, học ở đâu?)",null,null,"Zǒngjīnglǐ: bùcuò bùcuò. Nǐ Zhōngwén jìnbù hěndà a, zài nǎr xué de?",null,"BODY787"],["小阮: 谢谢李总！我每周上两次课，平时也跟中国同事多聊天。 (Cảm ơn Lý tổng! Em học 2 buổi/tuần, bình thường cũng nói chuyện nhiều với đồng nghiệp TQ.)",null,null,"Xiǎo Ruǎn: xièxie Lǐ zǒng! Wǒ měizhōu shàng liǎngcì kè, píngshí yě gēn Zhōngguó tóngshì duō liáotiān.",null,"BODY788"],["总经理: 好习惯。周末有没有去哪儿玩？ (Thói quen tốt. Cuối tuần có đi đâu chơi không?)",null,null,"Zǒngjīnglǐ: hǎo xíguàn. Zhōumò yǒuméiyǒu qù nǎr wán?",null,"BODY789"],["小阮: 去了一趟宁平，带孩子爬了一个山洞，风景特别美。李总去过吗？ (Đi một chuyến Ninh Bình, đưa con đi hang động, cảnh rất đẹp. Lý tổng đi chưa ạ?)",null,null,"Xiǎo Ruǎn: qù le yītàng Níngpíng, dài háizi pá le yīgè shāndòng, fēngjǐng tèbié měi. Lǐ zǒng qùguò ma?",null,"BODY790"],["总经理: 还没去过，一直想去。 (Chưa, luôn muốn đi.)",null,null,"Zǒngjīnglǐ: hái méi qùguò, yīzhí xiǎng qù.",null,"BODY791"],["小阮: 那下次我给您推荐一个路线，开车两个小时就到了。 (Vậy lần sau em giới thiệu ngài một lộ trình, lái xe 2 tiếng là đến.)",null,null,"Xiǎo Ruǎn: nà xiàcì wǒ gěi nín tuījiàn yīgè lùxiàn, kāichē liǎnggè xiǎoshí jiù dào le.",null,"BODY792"],["总经理: 好啊！我到了，回头聊。 (Được đấy! Tôi đến tầng rồi, nói chuyện sau.)",null,null,"Zǒngjīnglǐ: hǎo a! Wǒ dào le, huítóu liáo.",null,"BODY793"],["小阮: 好的，李总您慢走！ (Vâng, Lý tổng đi ạ!)",null,null,"Xiǎo Ruǎn: hǎo de, Lǐ zǒng nín mànzǒu!",null,"BODY794"],["情景对话 2 — Phỏng vấn: câu hỏi bất ngờ, phải phản ứng ngay (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY795-C"],["面试官: 我们来做个小测试。如果你现在是我们公司的产品，你怎么把自己卖给我？ (Làm một bài kiểm tra nhỏ. Nếu giờ bạn là sản phẩm của công ty chúng tôi, bạn \"bán\" mình cho tôi thế nào?)",null,null,"Miànshìguān: wǒmen lái zuò gè xiǎo cèshì. Rúguǒ nǐ xiànzài shì wǒmen gōngsī de chǎnpǐn, nǐ zěnme bǎ zìjǐ mài gěi wǒ?",null,"BODY796"],["应聘者: 好问题！让我想想……我会说：这款产品有三个特点：第一，中文和越南语双语，沟通没有障碍；第二，有五年的物流经验，上手快；第三，\"售后服务\"特别好，遇到问题不推卸责任。 (Câu hỏi hay! Để tôi nghĩ… Tôi sẽ nói: sản phẩm này có 3 đặc điểm: một, song ngữ Trung – Việt, giao tiếp không rào cản; hai, 5 năm kinh nghiệm logistics, bắt nhịp nhanh; ba, \"dịch vụ hậu mãi\" rất tốt, có chuyện không đùn đẩy trách nhiệm.)",null,null,"Yìngpìnzhě: hǎo wèntí! Ràng wǒ xiǎngxiang…… wǒhuì shuō: zhè kuǎn chǎnpǐn yǒu sāngè tèdiǎn: dìyī, Zhōngwén hé Yuènányǔ shuāngyǔ, gōutōng méiyǒu zhàng'ài; dì'èr, yǒu wǔnián de wùliú jīngyàn, shàng shǒukuài; dìsān, \"shòuhòufúwù\" tèbié hǎo, yùdào wèntí bù tuīxièzérèn.",null,"BODY797"],["面试官: 哈哈，有意思。那这款产品有什么缺点？ (Haha, thú vị. Vậy sản phẩm này có nhược điểm gì?)",null,null,"Miànshìguān: hāhā, yǒuyìsi. Nà zhè kuǎn chǎnpǐn yǒu shénme quēdiǎn?",null,"BODY798"],["应聘者: 说实话，\"价格\"可能比市场上的同类产品高一点，不过性价比绝对高。 (Nói thật, \"giá\" có thể cao hơn sản phẩm cùng loại trên thị trường chút, nhưng chắc chắn đáng tiền.)",null,null,"Yìngpìnzhě: shuōshíhuà, \"jiàgé\" kěnéng bǐ shìchǎng shàng de tónglèichǎnpǐn gāo yīdiǎn, bùguò xìngjiàbǐ juéduì gāo.",null,"BODY799"],["面试官: 如果你的同事一直不配合你的工作，你会怎么做？ (Nếu đồng nghiệp mãi không phối hợp công việc với bạn, bạn làm gì?)",null,null,"Miànshìguān: rúguǒ nǐ de tóngshì yīzhí bù pèihé nǐ de gōngzuò, nǐ huì zěnme zuò?",null,"BODY800"],["应聘者: 这得看情况。我会先私下找他聊一聊，了解他是不是有什么难处。如果是工作安排的问题，我会请经理帮忙协调。 (Còn tùy. Tôi sẽ nói chuyện riêng với anh ấy trước, tìm hiểu có khó khăn gì không. Nếu là vấn đề phân công, tôi nhờ giám đốc điều phối.)",null,null,"Yìngpìnzhě: zhè děi kàn qíngkuàng. Wǒhuì xiān sīxià zhǎo tā liáo yī liáo, liǎojiě tā shìbùshì yǒu shénme nánchù. Rúguǒ shì gōngzuò ānpái de wèntí, wǒhuì qǐng jīnglǐ bāngmáng xiétiáo.",null,"BODY801"],["面试官: 你觉得你上一个老板会怎么评价你？ (Bạn nghĩ sếp cũ sẽ đánh giá bạn thế nào?)",null,null,"Miànshìguān: nǐ juéde nǐ shàng yīgè lǎobǎn huì zěnme píngjià nǐ?",null,"BODY802"],["应聘者: 我想他会说我做事靠谱、反应快，不过有时候太着急，希望一天把所有事都做完。 (Tôi nghĩ anh ấy sẽ nói tôi làm việc đáng tin, phản ứng nhanh, nhưng đôi khi quá nóng vội, muốn làm xong mọi việc trong một ngày.)",null,null,"Yìngpìnzhě: wǒ xiǎng tā huì shuō wǒ zuòshì kàopǔ, fǎnyìng kuài, bùguò yǒushíhou tài zháojí, xīwàng yītiān bǎ suǒyǒu shì dōu zuò wán.",null,"BODY803"],["面试官: 最后一个问题：为什么我们应该选你，而不是别的候选人？ (Câu cuối: vì sao chúng tôi nên chọn bạn mà không phải ứng viên khác?)",null,null,"Miànshìguān: zuìhòu yīgè wèntí: wèishénme wǒmen yīnggāi xuǎn nǐ, ér bùshì biéde hòuxuǎnrén?",null,"BODY804"],["应聘者: 您这个问题问得很好。我想从两个方面来回答：从能力来看，我的经验正好符合这个岗位的要求；从态度来看，我非常想加入贵公司，因为我一直在关注你们在越南的发展。总之，我相信我能很快为公司创造价值。 (Câu hỏi rất hay. Tôi trả lời từ 2 mặt: về năng lực, kinh nghiệm của tôi vừa đúng yêu cầu vị trí; về thái độ, tôi rất muốn gia nhập quý công ty vì luôn theo dõi sự phát triển của công ty ở VN. Tóm lại, tôi tin mình sẽ nhanh chóng tạo ra giá trị cho công ty.)",null,null,"Yìngpìnzhě: nín zhège wèntí wèn de hěn hǎo. Wǒ xiǎng cóng liǎnggè fāngmiàn lái huídá: cóng nénglì láikàn, wǒ de jīngyàn zhènghǎo fúhé zhège gǎngwèi de yāoqiú; cóng tàidù láikàn, wǒ fēicháng xiǎng jiārù guì gōngsī, yīnwèi wǒ yīzhí zài guānzhù nǐmen zài Yuènán de fāzhǎn. Zǒngzhī, wǒ xiāngxìn wǒ néng hěnkuài wèi gōngsī chuàngzào jiàzhí.",null,"BODY805"],["面试官: 好，今天就到这里，谢谢你。 (Được, hôm nay đến đây, cảm ơn bạn.)",null,null,"Miànshìguān: hǎo, jīntiān jiù dào zhèlǐ, xièxie nǐ.
