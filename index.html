。 (Về lâu dài, học tiếng Trung giúp ích lớn cho sự nghiệp của tôi.)",null,null,"Cóng chángyuǎn láikàn, xué Zhōngwén duì wǒ de zhíyè fāzhǎn bāngzhù hěndà.",null,"BODY569"],["6. 与其……，不如…… (Thay vì …, chi bằng …)",null,null,"Yǔqí……, bùrú……",null,"BODY570"],["Ví dụ: 与其每年花钱修旧机器，不如直接买一台新的。 (Thay vì năm nào cũng tốn tiền sửa máy cũ, chi bằng mua luôn máy mới.)",null,null,"Yǔqí měinián huāqián xiū jiù jīqì, bùrú zhíjiē mǎi yītái xīn de.",null,"BODY571"],["Ví dụ: 与其租房，不如贷款买一套小一点的房子。 (Thay vì thuê nhà, chi bằng vay mua một căn nhỏ.)",null,null,"Yǔqí zūfáng, bùrú dàikuǎn mǎi yītào xiǎo yīdiǎn de fángzi.",null,"BODY572"],["7. 如果只看……，那……；可是如果考虑到……，…… (Nếu chỉ nhìn …, thì …; nhưng nếu xét đến …, …)",null,null,"Rúguǒ zhǐ kàn……, nà……; kěshì rúguǒ kǎolǜ dào……,……",null,"BODY573"],["Ví dụ: 如果只看价格，那肯定选A；可是如果考虑到售后服务，B更好。 (Nếu chỉ xét giá thì chắc chắn chọn A; nhưng xét đến hậu mãi thì B tốt hơn.)",null,null,"Rúguǒ zhǐ kàn jiàgé, nà kěndìng xuǎn A; kěshì rúguǒ kǎolǜ dào shòuhòufúwù, B gènghǎo.",null,"BODY574"],["Ví dụ: 如果只看工资，那应该去胡志明市；可是如果考虑到家庭，还是留在河内比较好。 (Nếu chỉ xét lương thì nên vào TP.HCM; nhưng xét đến gia đình thì ở lại Hà Nội tốt hơn.)",null,null,"Rúguǒ zhǐ kàn gōngzī, nà yīnggāi qù Húzhìmíng Shì; kěshì rúguǒ kǎolǜ dào jiātíng, háishì liúzài Hénèi bǐjiào hǎo.",null,"BODY575"],["8. 综合考虑……，我决定…… (Cân nhắc tổng thể …, tôi quyết định …)",null,null,"Zōnghé kǎolǜ……, wǒ juédìng……",null,"BODY576"],["Ví dụ: 综合考虑价格、交期和质量，我决定选第二家供应商。 (Cân nhắc tổng thể giá, thời gian giao và chất lượng, tôi quyết định chọn NCC thứ hai.)",null,null,"Zōnghé kǎolǜ jiàgé, jiāo qī hé zhìliàng, wǒ juédìng xuǎn dì'èrjiā gōngyìngshāng.",null,"BODY577"],["Ví dụ: 综合考虑孩子上学和上班的距离，我们决定搬到西湖附近。 (Cân nhắc tổng thể chuyện con đi học và khoảng cách đi làm, chúng tôi quyết định chuyển đến gần Hồ Tây.)",null,null,"Zōnghé kǎolǜ háizi shàngxué hé shàngbān de jùlí, wǒmen juédìng bān dào Xīhú fùjìn.",null,"BODY578"],["9. (HSK5) 宁可……，也不…… (Thà …, cũng không …)",null,null,"Nìngkě……, yě bù……",null,"BODY579"],["Ví dụ: 我宁可多花一点钱，也不想冒质量的风险。 (Tôi thà bỏ thêm chút tiền chứ không muốn mạo hiểm về chất lượng.)",null,null,"Wǒ nìngkě duō huā yīdiǎn qián, yě bùxiǎng mào zhìliàng de fēngxiǎn.",null,"BODY580"],["Ví dụ: 我宁可晚两天交货，也不能把不合格的产品发给客户。 (Tôi thà giao muộn 2 ngày chứ không thể giao hàng không đạt cho khách.)",null,null,"Wǒ nìngkě wǎn liǎngtiān jiāohuò, yě bùnéng bǎ bù hégé de chǎnpǐn fāgěi kèhù.",null,"BODY581"],["10. (HSK5) 在……和……之间，我们更看重…… (Giữa … và …, chúng tôi coi trọng … hơn)",null,null,"Zài…… hé…… zhījiān, wǒmen gèng kànzhòng……",null,"BODY582"],["Ví dụ: 在价格和质量之间，我们更看重质量，因为一次退货的损失比省下的钱多得多。 (Giữa giá và chất lượng, chúng tôi coi trọng chất lượng hơn, vì một lần trả hàng thiệt hại hơn nhiều so với số tiền tiết kiệm.)",null,null,"Zài jiàgé hé zhìliàng zhījiān, wǒmen gèng kànzhòng zhìliàng, yīnwèi yīcì tuìhuò de sǔnshī bǐ shěng xià de qián duōdeduō.",null,"BODY583"],["Ví dụ: 在速度和成本之间，这个项目更看重速度，因为客户下个月就要。 (Giữa tốc độ và chi phí, dự án này coi trọng tốc độ hơn vì khách tháng sau đã cần.)",null,null,"Zài sùdù hé chéngběn zhījiān, zhège xiàngmù gèng kànzhòng sùdù, yīnwèi kèhù xiàgèyuè jiùyào.",null,"BODY584"],["情景对话 1 — Chọn căn hộ thuê: gần công ty hay rộng và rẻ (hai vợ chồng, HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY585-C"],["妻子: 老公，我们看的这两套房子，你觉得哪套好？ (Anh ơi, hai căn mình xem, anh thấy căn nào tốt?)",null,null,"Qīzi: lǎogōng, wǒmen kàn de zhè liǎngtào fángzi, nǐ juéde nǎ tào hǎo?",null,"BODY586"],["丈夫: 两套各有优缺点。第一套在市中心，离我们公司都很近，走路十分钟就到了。 (Hai căn mỗi căn có ưu nhược. Căn thứ nhất ở trung tâm, gần công ty cả hai, đi bộ 10 phút là đến.)",null,null,"Zhàngfu: liǎngtào gè yǒu yōuquēdiǎn. Dìyītào zài shìzhōngxīn, lí wǒmen gōngsī dōu hěn jìn, zǒulù shífēnzhōng jiù dào le.",null,"BODY587"],["妻子: 可是第一套太小了，只有五十平米，而且一个月要一千五百万盾。 (Nhưng căn đầu nhỏ quá, chỉ 50m², mỗi tháng 15 triệu.)",null,null,"Qīzi: kěshì dìyītào tàixiǎo le, zhǐyǒu wǔshí píngmǐ, érqiě yīgèyuè yào yīqiānwǔbǎiwàn dùn.",null,"BODY588"],["丈夫: 对，第二套比第一套大多了，有八十平米，房租才一千两百万。 (Đúng, căn thứ hai rộng hơn nhiều, 80m², tiền thuê chỉ 12 triệu.)",null,null,"Zhàngfu: duì, dì'èrtào bǐ dìyītào dàduō le, yǒu bāshí píngmǐ, fángzū cái yīqiānliǎng bǎiwàn.",null,"BODY589"],["妻子: 但是第二套离公司远，骑摩托车要四十分钟，下雨天更麻烦。 (Nhưng căn thứ hai xa công ty, đi xe máy 40 phút, trời mưa càng phiền.)",null,null,"Qīzi: dànshì dì'èrtào lí gōngsī yuǎn, qí mótuōchē yào sìshífēnzhōng, xiàyǔtiān gèng máfan.",null,"BODY590"],["丈夫: 如果只看房租和面积，那肯定选第二套；可是如果考虑到每天的时间，第一套更方便。 (Nếu chỉ xét tiền thuê và diện tích thì chắc chắn chọn căn hai; nhưng xét thời gian mỗi ngày thì căn một tiện hơn.)",null,null,"Zhàngfu: rúguǒ zhǐ kàn fángzū hé miànjī, nà kěndìng xuǎn dì'èrtào; kěshì rúguǒ kǎolǜ dào měitiān de shíjiān, dìyītào gèng fāngbiàn.",null,"BODY591"],["妻子: 我们算一下：每天来回多花一个多小时，一个月就是三十个小时。 (Mình tính thử: mỗi ngày đi về mất thêm hơn một tiếng, một tháng là 30 tiếng.)",null,null,"Qīzi: wǒmen suàn yīxià: měitiān láihuí duō huā yīgèduō xiǎoshí, yīgèyuè jiùshì sānshígè xiǎoshí.",null,"BODY592"],["丈夫: 而且油钱一个月也要多花五十万左右。 (Mà tiền xăng mỗi tháng cũng tốn thêm khoảng 500 nghìn.)",null,null,"Zhàngfu: érqiě yóuqián yīgèyuè yě yào duō huā wǔshíwànzuǒyòu.",null,"BODY593"],["妻子: 那其实两套的价格差不多了。 (Vậy thực ra giá hai căn gần như ngang nhau.)",null,null,"Qīzi: nà qíshí liǎngtào de jiàgé chàbuduō le.",null,"BODY594"],["丈夫: 对。不过明年孩子出生以后，五十平米肯定不够住。 (Đúng. Nhưng sang năm con chào đời, 50m² chắc chắn không đủ.)",null,null,"Zhàngfu: duì. Bùguò míngnián háizi chūshēng yǐhòu, wǔshí píngmǐ kěndìng bùgòu zhù.",null,"BODY595"],["妻子: 这倒是。从长远来看，大一点的房子更合适。 (Cũng đúng. Về lâu dài, nhà rộng hơn phù hợp hơn.)",null,null,"Qīzi: zhè dǎo shì. Cóng chángyuǎn láikàn, dà yīdiǎn de fángzi gèng héshì.",null,"BODY596"],["丈夫: 那我们能不能找一套在中间的？离公司二十分钟，七十平米左右。 (Vậy mình tìm căn ở giữa được không? Cách công ty 20 phút, khoảng 70m².)",null,null,"Zhàngfu: nà wǒmen néng bùnéng zhǎo yītào zài zhōngjiān de? Lí gōngsī èrshífēnzhōng, qīshí píngmǐ zuǒyòu.",null,"BODY597"],["妻子: 好主意！我周末再去看看嘉林那边的房子。 (Ý hay! Cuối tuần em đi xem thêm nhà bên Gia Lâm.)",null,null,"Qīzi: hǎo zhǔyì! Wǒ zhōumò zài qù kànkan Jiālín nàbiān de fángzi.",null,"BODY598"],["丈夫: 好，综合考虑以后再决定，不着急。 (Được, cân nhắc tổng thể rồi quyết định, không vội.)",null,null,"Zhàngfu: hǎo, zōnghé kǎolǜ yǐhòu zài juédìng, bù zháojí.",null,"BODY599"],["情景对话 2 — So sánh 2 lời mời làm việc (bạn bè tư vấn, HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY600-C"],["A: 我收到两个工作邀请，不知道选哪个，你帮我参谋一下。 (Mình nhận được 2 lời mời làm việc, không biết chọn cái nào, bạn tham mưu giúp mình.)",null,null,"Wǒ shōudào liǎnggè gōngzuò yāoqǐng, bù zhīdao xuǎn nǎge, nǐ bāng wǒ cānmóu yīxià.",null,"BODY601"],["B: 好啊，说说看。 (Được, kể đi.)",null,null,"Hǎo a, shuōshuokàn.",null,"BODY602"],["A: 第一个是一家中国大公司，工资两千八百万，但是每天要加班，周六也要上班。 (Cái thứ nhất là công ty lớn TQ, lương 28 triệu, nhưng ngày nào cũng tăng ca, thứ 7 cũng đi làm.)",null,null,"Dìyīgè shì yījiā Zhōngguó dà gōngsī, gōngzī liǎngqiān bābǎiwàn, dànshì měitiān yào jiābān, zhōuliù yě yào shàngbān.",null,"BODY603"],["A: 第二个是一家越南公司，工资两千二百万，周末双休，基本不加班。 (Cái thứ hai là công ty VN, lương 22 triệu, nghỉ cả thứ 7 chủ nhật, hầu như không tăng ca.)",null,null,"Dì'èrgè shì yījiā Yuènán gōngsī, gōngzī liǎngqiān èrbǎiwàn, zhōumò shuāngxiū, jīběn bù jiābān.",null,"BODY604"],["B: 第一个比第二个多六百万，确实不少。 (Cái thứ nhất hơn cái thứ hai 6 triệu, đúng là không ít.)",null,null,"Dìyīgè bǐ dì'èrgè duō liùbǎiwàn, quèshí bùshǎo.",null,"BODY605"],["A: 是啊，可是我算了一下，如果按小时算，第一个其实没有第二个那么高。 (Đúng vậy, nhưng mình tính rồi, nếu tính theo giờ thì cái thứ nhất thực ra không cao bằng cái thứ hai.)",null,null,"Shì a, kěshì wǒ suànle yīxià, rúguǒ àn xiǎoshí suàn, dìyīgè qíshí méiyǒu dì'èrgè nàme gāo.",null,"BODY606"],["B: 那发展空间呢？ (Còn cơ hội phát triển?)",null,null,"Nà fāzhǎn kōngjiān ne?",null,"BODY607"],["A: 中国公司的发展空间更大，两年就有机会升主管，而且可以天天说中文。 (Công ty TQ cơ hội lớn hơn, 2 năm có cơ hội lên trưởng nhóm, lại được nói tiếng Trung hằng ngày.)",null,null,"Zhōngguó gōngsī de fāzhǎn kōngjiān gèng dà, liǎngnián jiù yǒu jīhuì shēng zhǔguǎn, érqiě kěyǐ tiāntiān shuō Zhōngwén.",null,"BODY608"],["B: 越南公司呢？ (Còn công ty VN?)",null,null,"Yuènán gōngsī ne?",null,"BODY609"],["A: 越南公司比较稳定，但是升职慢，用中文的机会也少。 (Công ty VN ổn định hơn, nhưng thăng chức chậm, ít cơ hội dùng tiếng Trung.)",null,null,"Yuènán gōngsī bǐjiàowěndìng, dànshì shēngzhí màn, yòng Zhōngwén de jīhuì yě shǎo.",null,"BODY610"],["B: 你现在最看重什么？ (Hiện bạn coi trọng điều gì nhất?)",null,null,"Nǐ xiànzài zuì kànzhòng shénme?",null,"BODY611"],["A: 我才二十七岁，还没结婚，我觉得现在最重要的是学东西、积累经验。 (Mình mới 27 tuổi, chưa kết hôn, mình thấy giờ quan trọng nhất là học hỏi, tích lũy kinh nghiệm.)",null,null,"Wǒ cái èrshíqīsuì, hái méi jiéhūn, wǒ juéde xiànzài zuì zhòngyào de shì xué dōngxi, jīlěi jīngyàn.",null,"BODY612"],["B: 那答案不是很清楚了吗？趁年轻多吃点苦，以后的选择会更多。 (Vậy chẳng phải đáp án rõ rồi sao? Nhân lúc trẻ chịu khó chút, sau này sẽ nhiều lựa chọn hơn.)",null,null,"Nà dá'àn bùshì hěn qīngchu le ma? Chèn niánqīng duō chī diǎn kǔ, yǐhòu de xuǎnzé huì gèng duō.",null,"BODY613"],["A: 你说得对。与其在舒服的地方慢慢走，不如去有挑战的地方跑一跑。 (Bạn nói đúng. Thay vì đi chậm ở chỗ thoải mái, chi bằng chạy ở chỗ có thử thách.)",null,null,"Nǐ shuōdeduì. Yǔqí zài shūfu de dìfang mànmàn zǒu, bùrú qù yǒu tiǎozhàn de dìfang pǎo yī pǎo.",null,"BODY614"],["B: 不过要注意身体，别太拼了。 (Nhưng phải chú ý sức khỏe, đừng liều quá.)",null,null,"Bùguò yào zhùyì shēntǐ, bié tài pīn le.",null,"BODY615"],["情景对话 3 — Mua máy móc: mua mới hay sửa máy cũ (trong phòng sản xuất)",null,null,"Qíngjǐng duìhuà",null,"BODY616-C"],["经理: 三号机又坏了，这个月已经第三次了。我们是继续修，还是买一台新的？ (Máy số 3 lại hỏng, tháng này lần thứ ba rồi. Mình tiếp tục sửa hay mua máy mới?)",null,null,"Jīnglǐ: sānhào jī yòuhuàile, zhège yuè yǐjīng dìsāncì le. Wǒmen shì jìxù xiū, háishì mǎi yītái xīn de?",null,"BODY617"],["技术员: 这次是主板坏了，修的话要八千万盾，大概一个星期。 (Lần này hỏng bo mạch chính, sửa mất 80 triệu, khoảng một tuần.)",null,null,"Jìshùyuán: zhècì shì zhǔbǎn huài le, xiū dehuà yào bāqiānwàn dùn, dàgài yīgè xīngqī.",null,"BODY618"],["经理: 新的多少钱？ (Máy mới bao nhiêu?)",null,null,"Jīnglǐ: xīn de duōshǎo qián?",null,"BODY619"],["采购: 我问了两家：日本的要十二亿，中国的要七亿。 (Tôi hỏi 2 nơi: máy Nhật 1,2 tỷ, máy TQ 700 triệu.)",null,null,"Cǎigòu: wǒ wèn le liǎngjiā: Rìběn de yào shí'èryì, Zhōngguó de yào qīyì.",null,"BODY620"],["经理: 差这么多！两台机器有什么区别？ (Chênh nhiều vậy! Hai máy khác nhau thế nào?)",null,null,"Jīnglǐ: chà zhème duō! Liǎngtái jīqì yǒu shénme qūbié?",null,"BODY621"],["采购: 日本的精度更高，寿命大概十五年；中国的精度差不多能满足我们的要求，寿命十年左右。 (Máy Nhật độ chính xác cao hơn, tuổi thọ khoảng 15 năm; máy TQ độ chính xác cơ bản đáp ứng yêu cầu, tuổi thọ khoảng 10 năm.)",null,null,"Cǎigòu: Rìběn de jīngdù gèng gāo, shòumìng dàgài shíwǔnián; Zhōngguó de jīngdù chàbuduō néng mǎnzú wǒmen de yāoqiú, shòumìng shínián zuǒyòu.",null,"BODY622"],["技术员: 还有一点：日本的售后服务在越南有工程师，二十四小时就能到；中国的工程师要从深圳过来，最快三天。 (Còn một điểm: hậu mãi máy Nhật có kỹ sư ở VN, 24h là đến; kỹ sư máy TQ phải từ Thâm Quyến sang, nhanh nhất 3 ngày.)",null,null,"Jìshùyuán: háiyǒu yīdiǎn: Rìběn de shòuhòufúwù zài Yuènán yǒu gōngchéngshī, èrshísì xiǎoshí jiù néng dào; Zhōngguó de gōngchéngshī yào cóng Shēnzhèn guòlái, zuìkuài sāntiān.",null,"BODY623"],["经理: 三天的话，停产损失太大了。 (3 ngày thì thiệt hại dừng sản xuất quá lớn.)",null,null,"Jīnglǐ: sāntiān dehuà, tíngchǎn sǔnshī tài dà le.",null,"BODY624"],["财务: 我想补充一点：旧机器今年已经修了四次，一共花了两亿。如果继续修，明年可能还要花更多。 (Tôi bổ sung: máy cũ năm nay sửa 4 lần, tổng tốn 200 triệu. Nếu tiếp tục sửa, năm sau có thể tốn nhiều hơn.)",null,null,"Cáiwù: wǒ xiǎng bǔchōng yīdiǎn: jiù jīqì jīnnián yǐjīng xiū le sìcì, yīgòng huā le liǎngyì. Rúguǒ jìxù xiū, míngnián kěnéng háiyào huā gèng duō.",null,"BODY625"],["经理: 那修是最不划算的。现在就是在日本和中国的之间选。 (Vậy sửa là không hời nhất. Giờ là chọn giữa máy Nhật và máy TQ.)",null,null,"Jīnglǐ: nà xiū shì zuì bùhuásuàn de. Xiànzài jiùshì zài Rìběn hé Zhōngguó de zhījiān xuǎn.",null,"BODY626"],["采购: 如果只看价格，中国的便宜五亿；可是如果考虑到售后服务和寿命，日本的每年的成本其实差不多。 (Nếu chỉ xét giá, máy TQ rẻ hơn 500 triệu; nhưng xét hậu mãi và tuổi thọ, chi phí mỗi năm của máy Nhật thực ra tương đương.)",null,null,"Cǎigòu: rúguǒ zhǐ kàn jiàgé, Zhōngguó de piányi wǔyì; kěshì rúguǒ kǎolǜ dào shòuhòufúwù hé shòumìng, Rìběn de měinián de chéngběn qíshí chàbuduō.",null,"BODY627"],["财务: 我算过：日本的每年八千万，中国的每年七千万，只差一千万。 (Tôi tính rồi: máy Nhật mỗi năm 80 triệu, máy TQ mỗi năm 70 triệu, chỉ chênh 10 triệu.)",null,null,"Cáiwù: wǒ suàn guò: Rìběn de měinián bāqiānwàn, Zhōngguó de měinián qīqiānwàn, zhǐ chà yīqiānwàn.",null,"BODY628"],["技术员: 而且停产一天我们就损失一亿多，在稳定性方面，我宁可多花点钱。 (Mà dừng sản xuất một ngày thiệt hại hơn 100 triệu, về mặt ổn định tôi thà bỏ thêm tiền.)",null,null,"Jìshùyuán: érqiě tíngchǎn yītiān wǒmen jiù sǔnshī yīyìduō, zài wěndìngxìng fāngmiàn, wǒ nìngkě duō huā diǎn qián.",null,"BODY629"],["经理: 好，综合考虑价格、寿命和售后服务，我决定买日本的。采购部这周把合同谈下来，看看能不能再降一点价。 (Được, cân nhắc tổng thể giá, tuổi thọ và hậu mãi, tôi quyết định mua máy Nhật. Phòng mua hàng tuần này chốt hợp đồng, xem có giảm giá thêm được không.)",null,null,"Jīnglǐ: hǎo, zōnghé kǎolǜ jiàgé, shòumìng hé shòuhòufúwù, wǒ juédìng mǎi Rìběn de. Cǎigòubù zhè zhōu bǎ hétong tán xiàlái, kànkan néng bùnéng zài jiàng yīdiǎn jià.",null,"BODY630"],["采购: 好的，我试试让他们送一年的免费保养。 (Vâng, tôi thử đề nghị họ tặng một năm bảo dưỡng miễn phí.)",null,null,"Cǎigòu: hǎo de, wǒ shìshi ràng tāmen sòng yīnián de miǎnfèi bǎoyǎng.",null,"BODY631"],["情景对话 4 — Chọn địa điểm tổ chức du lịch công ty: Đà Nẵng hay Nha Trang",null,null,"Qíngjǐng duìhuà",null,"BODY632-C"],["人事: 今年公司旅游，我们准备了两个地方：岘港和芽庄，大家投票之前我先介绍一下。 (Du lịch công ty năm nay chuẩn bị 2 nơi: Đà Nẵng và Nha Trang, trước khi bỏ phiếu tôi giới thiệu trước.)",null,null,"Rénshì: jīnnián gōngsī lǚyóu, wǒmen zhǔnbèi le liǎnggè dìfang: Xiàngǎng hé Yázhuāng, dàjiā tóupiào zhīqián wǒ xiān jièshào yīxià.",null,"BODY633"],["人事: 岘港的优点是景点多，可以去巴拿山、会安古镇，还可以吃到很多特色菜；缺点是十月以后经常下雨。 (Đà Nẵng ưu điểm nhiều điểm tham quan, đi Bà Nà, phố cổ Hội An, ăn nhiều đặc sản; nhược điểm sau tháng 10 hay mưa.)",null,null,"Rénshì: Xiàngǎng de yōudiǎn shì jǐngdiǎn duō, kěyǐ qù Bāná Shān, Huì'āngǔzhèn, hái kěyǐ chī dào hěnduō tèsècài; quēdiǎn shì shíyuè yǐhòu jīngcháng xiàyǔ.",null,"BODY634"],["人事: 芽庄的优点是海特别漂亮，可以出海潜水，酒店也比岘港便宜一点；缺点是景点没有岘港那么多。 (Nha Trang ưu điểm biển rất đẹp, ra đảo lặn biển, khách sạn rẻ hơn Đà Nẵng chút; nhược điểm điểm tham quan không nhiều bằng Đà Nẵng.)",null,null,"Rénshì: Yázhuāng de yōudiǎn shì hǎi tèbié piàoliang, kěyǐ chūhǎi qiánshuǐ, jiǔdiàn yě bǐ Xiàngǎng piányi yīdiǎn; quēdiǎn shì jǐngdiǎn méiyǒu Xiàngǎng nàme duō.",null,"BODY635"],["小林: 价格差多少？ (Giá chênh bao nhiêu?)",null,null,"Xiǎo Lín: jiàgé chà duōshǎo?",null,"BODY636"],["人事: 四天三夜，岘港每人六百万，芽庄每人五百五十万，差不多。 (4 ngày 3 đêm, Đà Nẵng 6 triệu/người, Nha Trang 5,5 triệu/người, gần như nhau.)",null,null,"Rénshì: sìtiān sānyè, Xiàngǎng měirén liùbǎiwàn, Yázhuāng měirén wǔbǎiwǔshíwàn, chàbuduō.",null,"BODY637"],["小芳: 我们公司有很多带孩子的同事，岘港的活动更丰富，孩子们会更喜欢。 (Công ty nhiều đồng nghiệp mang con theo, Đà Nẵng hoạt động phong phú hơn, bọn trẻ sẽ thích hơn.)",null,null,"Xiǎo Fāng: wǒmen gōngsī yǒu hěnduō dài háizi de tóngshì, Xiàngǎng de huódòng gèng fēngfù, háizi men huì gèng xǐhuan.",null,"BODY638"],["阿海: 可是我们去年刚去过会安，今年想换个地方。 (Nhưng năm ngoái vừa đi Hội An, năm nay muốn đổi chỗ.)",null,null,"Ā Hǎi: kěshì wǒmen qùnián gāng qùguò Huì'ān, jīnnián xiǎng huàn gè dìfang.",null,"BODY639"],["小林: 我也比较想去芽庄，在海边什么都不做，好好放松几天。 (Tôi cũng muốn đi Nha Trang, ở biển không làm gì, thư giãn mấy ngày.)",null,null,"Xiǎo Lín: wǒ yě bǐjiào xiǎng qù Yázhuāng, zài hǎibiān shénme dōu bù zuò, hǎohǎo fàngsōng jǐtiān.",null,"BODY640"],["人事: 旅游时间是十一月，岘港下雨的可能性比较大，这一点大家要考虑。 (Thời gian du lịch là tháng 11, khả năng Đà Nẵng mưa khá cao, mọi người cần cân nhắc.)",null,null,"Rénshì: lǚyóu shíjiān shì shíyīyuè, Xiàngǎng xiàyǔ de kěnéngxìng bǐjiào dà, zhè yīdiǎn dàjiā yào kǎolǜ.",null,"BODY641"],["小芳: 那芽庄十一月天气怎么样？ (Vậy Nha Trang tháng 11 thời tiết thế nào?)",null,null,"Xiǎo Fāng: nà Yázhuāng shíyīyuè tiānqì zěnmeyàng?",null,"BODY642"],["人事: 芽庄十一月也是雨季，不过比岘港好一点。 (Nha Trang tháng 11 cũng là mùa mưa, nhưng đỡ hơn Đà Nẵng chút.)",null,null,"Rénshì: Yázhuāng shíyīyuè yě shì yǔjì, bùguò bǐ Xiàngǎng hǎo yīdiǎn.",null,"BODY643"],["阿海: 与其十一月去海边，不如改到明年四月去，那时候两个地方天气都很好。 (Thay vì tháng 11 đi biển, chi bằng dời sang tháng 4 năm sau, lúc đó hai nơi đều đẹp trời.)",null,null,"Ā Hǎi: yǔqí shíyīyuè qù hǎibiān, bùrú gǎi dào míngnián sìyuè qù, nà shíhou liǎnggè dìfang tiānqì dōu hěn hǎo.",null,"BODY644"],["人事: 这是个好建议。那我们分两步：先投票决定时间，再投票决定地方。 (Gợi ý hay. Vậy làm 2 bước: bỏ phiếu chọn thời gian trước, rồi bỏ phiếu chọn địa điểm.)",null,null,"Rénshì: zhè shì gè hǎo jiànyì. Nà wǒmen fēn liǎngbù: xiān tóupiàojuédìng shíjiān, zài tóupiàojuédìng dìfang.",null,"BODY645"],["情景对话 5 — (HSK5) Chọn nhà cung cấp dựa trên 4 tiêu chí",null,null,"Qíngjǐng duìhuà",null,"BODY646-C"],["经理: 新产品的包装盒，我们现在有三家供应商可以选。小阮，你做了比较，先说说你的分析。 (Hộp đóng gói sản phẩm mới, giờ có 3 NCC để chọn. Tiểu Nguyễn, bạn đã so sánh, nói phân tích của bạn trước.)",null,null,"Jīnglǐ: xīn chǎnpǐn de bāozhuānghé, wǒmen xiànzài yǒu sānjiā gōngyìngshāng kěyǐ xuǎn. Xiǎo Ruǎn, nǐ zuò le bǐjiào, xiān shuōshuo nǐ de fēnxī.",null,"BODY647"],["小阮: 好的。我按照四个标准做了比较：价格、质量、交期和服务，每项满分十分。 (Vâng. Tôi so sánh theo 4 tiêu chí: giá, chất lượng, thời gian giao và dịch vụ, mỗi mục tối đa 10 điểm.)",null,null,"Xiǎo Ruǎn: hǎo de. Wǒ ànzhào sìgè biāozhǔn zuò le bǐjiào: jiàgé, zhìliàng, jiāo qī hé fúwù, měi xiàng mǎnfēn shífēn.",null,"BODY648"],["小阮: A公司是越南本地的，价格最便宜，单价两千五百盾，价格我给九分；但是样品测试有两次不合格，质量只有六分。 (Công ty A là công ty VN, giá rẻ nhất, đơn giá 2.500 đồng, giá tôi cho 9 điểm; nhưng mẫu thử 2 lần không đạt, chất lượng chỉ 6 điểm.)",null,null,"Xiǎo Ruǎn: A gōngsī shì Yuènán běndì de, jiàgé zuì piányi, dānjià liǎngqiānwǔbǎi dùn, jiàgé wǒ gěi jiǔfēn; dànshì yàngpǐn cèshì yǒu liǎngcì bù hégé, zhìliàng zhǐyǒu liùfēn.",null,"BODY649"],["小阮: B公司在广州，质量最好，八次测试全部合格，给十分；可是交期要二十五天，加上海运，交期只有五分。 (Công ty B ở Quảng Châu, chất lượng tốt nhất, 8 lần thử đều đạt, cho 10 điểm; nhưng giao mất 25 ngày, cộng đường biển, thời gian giao chỉ 5 điểm.)",null,null,"Xiǎo Ruǎn: B gōngsī zài Guǎngzhōu, zhìliàng zuìhǎo, bācì cèshì quánbù hégé, gěi shífēn; kěshì jiāo qī yào èrshíwǔ tiān, jiāshàng hǎiyùn, jiāo qī zhǐyǒu wǔfēn.",null,"BODY650"],["小阮: C公司是中资在北宁的工厂，单价三千盾，比A贵一点，质量八分，交期七天，九分，服务也很好，有专门的人跟我们对接。 (Công ty C là nhà máy vốn TQ ở Bắc Ninh, đơn giá 3.000 đồng, đắt hơn A chút, chất lượng 8 điểm, giao 7 ngày, 9 điểm, dịch vụ rất tốt, có người chuyên trách làm việc với chúng ta.)",null,null,"Xiǎo Ruǎn: C gōngsī shì zhōngzī zài Běiníng de gōngchǎng, dānjià sānqiān dùn, bǐ A guì yīdiǎn, zhìliàng bāfēn, jiāo qī qītiān, jiǔfēn, fúwù yě hěn hǎo, yǒu zhuānmén de rén gēn wǒmen duìjiē.",null,"BODY651"],["经理: 总分呢？ (Tổng điểm?)",null,null,"Jīnglǐ: zǒngfēn ne?",null,"BODY652"],["小阮: A是二十九分，B是三十分，C是三十四分。 (A 29 điểm, B 30 điểm, C 34 điểm.)",null,null,"Xiǎo Ruǎn: A shì èrshíjiǔ fēn, B shì sānshífēn, C shì sānshísì fēn.",null,"BODY653"],["财务: 但是C比A每个贵五百盾，一年一百万个，就是多花五亿。 (Nhưng C đắt hơn A mỗi cái 500 đồng, một năm 1 triệu cái là tốn thêm 500 triệu.)",null,null,"Cáiwù: dànshì C bǐ A měigè guì wǔbǎi dùn, yīnián yībǎiwàngè, jiùshì duō huā wǔyì.",null,"BODY654"],["小阮: 我理解。不过在价格和质量之间，我们更看重质量。上次用便宜的包装，客户退了一个柜，损失了八亿多。 (Tôi hiểu. Nhưng giữa giá và chất lượng, chúng ta coi trọng chất lượng hơn. Lần trước dùng bao bì rẻ, khách trả một container, thiệt hại hơn 800 triệu.)",null,null,"Xiǎo Ruǎn: wǒ lǐjiě. Bùguò zài jiàgé hé zhìliàng zhījiān, wǒmen gèng kànzhòng zhìliàng. Shàngcì yòng piányi de bāozhuāng, kèhù tuì le yīgè guì, sǔnshī le bāyì duō.",null,"BODY655"],["生产: 我支持C。交期七天的话，我们的库存压力会小很多，仓库也不用租了。 (Tôi ủng hộ C. Giao 7 ngày thì áp lực tồn kho giảm nhiều, kho cũng không cần thuê nữa.)",null,null,"Shēngchǎn: wǒ zhīchí C. Jiāo qī qītiān dehuà, wǒmen de kùcún yālì huì xiǎo hěnduō, cāngkù yě bùyòng zū le.",null,"BODY656"],["经理: B的质量最好，为什么不选B？ (B chất lượng tốt nhất, sao không chọn B?)",null,null,"Jīnglǐ: B de zhìliàng zuìhǎo, wèishénme bù xuǎn B?",null,"BODY657"],["小阮: B的风险在于交期和运输，二十五天太长了，万一海运延误，我们的生产就停了。从长远来看，C的综合表现最稳定。 (Rủi ro của B ở thời gian giao và vận chuyển, 25 ngày quá dài, lỡ đường biển trễ là sản xuất dừng. Về lâu dài, C thể hiện tổng thể ổn định nhất.)",null,null,"Xiǎo Ruǎn: B de fēngxiǎn zàiyú jiāo qī hé yùnshū, èrshíwǔ tiān tài zhǎng le, wànyī hǎiyùn yánwù, wǒmen de shēngchǎn jiù tíng le. Cóng chángyuǎn láikàn, C de zōnghé biǎoxiàn zuì wěndìng.",null,"BODY658"],["经理: 有没有办法降低风险？ (Có cách nào giảm rủi ro không?)",null,null,"Jīnglǐ: yǒuméiyǒu bànfǎ jiàngdī fēngxiǎn?",null,"BODY659"],["小阮: 我建议主要用C，占百分之八十的量；B作为备用供应商，占百分之二十，这样不会只依赖一家。 (Tôi đề nghị dùng C là chính, chiếm 80% sản lượng; B làm NCC dự phòng, chiếm 20%, như vậy không phụ thuộc một nhà.)",null,null,"Xiǎo Ruǎn: wǒ jiànyì zhǔyào yòng C, zhàn bǎifēnzhībāshí de liàng; B zuòwéi bèiyòng gōngyìngshāng, zhàn bǎifēnzhī'èrshí, zhèyàng bùhuì zhǐ yīlài yījiā.",null,"BODY660"],["财务: 这样的话，总成本比全部用A多三亿左右，我可以接受。 (Như vậy tổng chi phí hơn dùng toàn bộ A khoảng 300 triệu, tôi chấp nhận được.)",null,null,"Cáiwù: zhèyàngdehuà, zǒngchéngběn bǐ quánbù yòng A duō sān yìzuǒyòu, wǒ kěyǐ jiēshòu.",null,"BODY661"],["经理: 好。综合考虑四个标准和风险，我们决定：C为主要供应商，B为备用。小阮，你负责跟C谈价格，看能不能降到两千八百盾。 (Được. Cân nhắc tổng thể 4 tiêu chí và rủi ro, chúng ta quyết định: C là NCC chính, B dự phòng. Tiểu Nguyễn, bạn phụ trách đàm phán giá với C, xem giảm được xuống 2.800 đồng không.)",null,null,"Jīnglǐ: hǎo. Zōnghé kǎolǜ sìgè biāozhǔn hé fēngxiǎn, wǒmen juédìng: C wéizhǔyào gōngyìngshāng, B wéibèiyòng. Xiǎo Ruǎn, nǐ fùzé gēn C tán jiàgé, kàn néng bùnéng jiàngdào liǎng qiānbābǎi dùn.",null,"BODY662"],["小阮: 好的，如果我们签一年的合同，我想应该有机会。 (Vâng, nếu ký hợp đồng một năm, tôi nghĩ có cơ hội.)",null,null,"Xiǎo Ruǎn: hǎo de, rúguǒ wǒmen qiān yīnián de hétong, wǒ xiǎng yīnggāi yǒu jīhuì.",null,"BODY663"],["引导练习 GUIDED SPEAKING — GV đưa 2 lựa chọn, HS so sánh theo 4 bước và chốt quyết định",null,null,"Yǐndǎo liànxí",null,"BODY664-C"],["1. Hỏi: 坐飞机和坐火车从河内去岘港，你选哪个？为什么？ (Đi máy bay hay tàu hỏa từ Hà Nội vào Đà Nẵng, bạn chọn gì? Vì sao?)",null,null,"Zuòfēijī hé zuòhuǒchē cóng Hénèi qù Xiàngǎng, nǐ xuǎn nǎge? Wèishénme?",null,"BODY665"],["Đáp: 两个各有优缺点。飞机快，一个多小时就到了，但是比较贵；火车要十六个小时，但是便宜，还能看海云岭的风景。如果出差，我选飞机；如果旅游，我选火车。 (Mỗi cái có ưu nhược. Máy bay nhanh, hơn 1 tiếng là đến nhưng đắt; tàu 16 tiếng nhưng rẻ, lại ngắm được cảnh đèo Hải Vân. Đi công tác chọn máy bay; đi du lịch chọn tàu.)",null,null,"Liǎnggè gè yǒu yōuquēdiǎn. Fēijī kuài, yīgèduō xiǎoshí jiù dào le, dànshì bǐjiào guì; huǒchē yào shíliùgè xiǎoshí, dànshì piányi, hái néng kàn Hǎiyún Lǐng de fēngjǐng. Rúguǒ chūchāi, wǒ xuǎn fēijī; rúguǒ lǚyóu, wǒ xuǎn huǒchē.",null,"BODY666"],["2. Hỏi: 在大公司工作和在小公司工作，哪个更好？ (Làm công ty lớn hay công ty nhỏ tốt hơn?)",null,null,"Zài dà gōngsī gōngzuò hé zài xiǎo gōngsī gōngzuò, nǎge gènghǎo?",null,"BODY667"],["Đáp: 大公司比小公司稳定，流程也更规范；但是小公司比大公司能学到更多东西，因为一个人要做很多事。我觉得刚毕业的人更适合去大公司打基础。 (Công ty lớn ổn định hơn, quy trình bài bản hơn; nhưng công ty nhỏ học được nhiều hơn vì một người làm nhiều việc. Tôi thấy người mới ra trường hợp vào công ty lớn để xây nền tảng.)",null,null,"Dà gōngsī bǐ xiǎo gōngsī wěndìng, liúchéng yě gèng guīfàn; dànshì xiǎo gōngsī bǐ dà gōngsī néng xuédào gèng duō dōngxi, yīnwèi yīgè rén yào zuò hěnduō shì. Wǒ juéde gāng bìyè de rén gèng shìhé qù dà gōngsī dǎjīchǔ.",null,"BODY668"],["3. Hỏi: (HSK5) 公司要扩大产能，是自己建新工厂好，还是外包给别的工厂好？ (Công ty muốn mở rộng công suất, tự xây nhà máy mới hay thuê ngoài tốt hơn?)",null,null,"Gōngsī yào kuòdà chǎnnéng, shì zìjǐ jiànxīn gōngchǎng hǎo, háishì wài bāo gěi biéde gōngchǎng hǎo?",null,"BODY669"],["Đáp: 短期来看，外包更快，投入也少；但是从长远来看，质量和交期不容易控制，核心技术也有泄露的风险。我建议先外包一部分非核心的产品，同时开始准备建新工厂。 (Ngắn hạn thuê ngoài nhanh hơn, đầu tư ít; nhưng lâu dài khó kiểm soát chất lượng và thời gian giao, công nghệ lõi có rủi ro rò rỉ. Tôi đề nghị thuê ngoài một phần sản phẩm không cốt lõi, đồng thời chuẩn bị xây nhà máy mới.)",null,null,"Duǎnqī láikàn, wài bāo gèng kuài, tóurù yě shǎo; dànshì cóng chángyuǎn láikàn, zhìliàng hé jiāo qī bù róngyì kòngzhì, héxīnjìshù yě yǒu xièlòu de fēngxiǎn. Wǒ jiànyì xiān wài bāo yībùfen fēihéxīn de chǎnpǐn, tóngshí kāishǐ zhǔnbèi jiànxīn gōngchǎng.",null,"BODY670"],["情景模拟 ROLE-PLAY — Hai phương án lợi hại trái ngược: GV đưa dữ liệu, HS phân tích và chốt. Vòng 2 (bất ngờ): GV thêm một dữ kiện làm đảo ngược kết luận",null,null,"Qíngjǐng mónǐ",null,"BODY671-C"],["GV: 我们要选一个物流公司。甲公司便宜百分之二十，但是去年丢过两次货；乙公司贵，但是从来没出过问题。你选哪个？ (Chúng ta cần chọn một công ty vận chuyển. Công ty Giáp rẻ hơn 20% nhưng năm ngoái làm mất hàng 2 lần; công ty Ất đắt nhưng chưa từng có vấn đề. Bạn chọn bên nào?)",null,null,"Wǒmen yào xuǎn yīgè wùliú gōngsī. Jiǎgōngsī piányi bǎifēnzhī'èrshí, dànshì qùnián diū guò liǎngcì huò; Yǐgōngsī guì, dànshì cónglái méi chūguò wèntí. Nǐ xuǎn nǎge?",null,"BODY672"],["HS: 两家各有优缺点。如果只看价格，那甲公司更划算；可是如果考虑到我们的货很贵，丢一次的损失比省下的钱多得多。 (Hai bên đều có ưu nhược. Nếu chỉ xét giá thì Giáp hời hơn; nhưng xét hàng của chúng ta giá trị cao, mất một lần thiệt hại hơn hẳn số tiền tiết kiệm.)",null,null,"Liǎngjiā gè yǒu yōuquēdiǎn. Rúguǒ zhǐ kàn jiàgé, nà Jiǎgōngsī gèng huásuàn; kěshì rúguǒ kǎolǜ dào wǒmen de huò hěn guì, diū yīcì de sǔnshī bǐ shěng xià de qián duōdeduō.",null,"BODY673"],["GV: 一年能省多少钱？ (Một năm tiết kiệm được bao nhiêu?)",null,null,"Yīnián néng shěng duōshǎo qián?",null,"BODY674"],["HS: 按我们每年四十亿的运费算，能省八亿。可是上次丢的那批货就值十二亿。 (Theo phí vận chuyển mỗi năm 4 tỷ, tiết kiệm được 800 triệu. Nhưng lô hàng bị mất lần trước trị giá 1,2 tỷ.)",null,null,"Àn wǒmen měinián sìshíyì de yùnfèi suàn, néng shěng bāyì. Kěshì shàngcì diū de nà pīhuò jiù zhí shí'èryì.",null,"BODY675"],["GV: 所以你选乙？ (Vậy bạn chọn Ất?)",null,null,"Suǒyǐ nǐ xuǎn yǐ?",null,"BODY676"],["HS: 对，在价格和安全之间，我更看重安全。我宁可多花点钱，也不想冒丢货的风险。 (Đúng, giữa giá và an toàn, tôi coi trọng an toàn hơn. Tôi thà bỏ thêm tiền chứ không muốn mạo hiểm mất hàng.)",null,null,"Duì, zài jiàgé hé ānquán zhījiān, wǒ gèng kànzhòng ānquán. Wǒ nìngkě duō huā diǎn qián, yě bùxiǎng mào diū huò de fēngxiǎn.",null,"BODY677"],["GV (biến cố): 可是甲公司说，以后丢货他们百分之百赔偿，而且可以买保险。 (Nhưng công ty Giáp nói sau này mất hàng họ bồi thường 100%, lại có thể mua bảo hiểm.)",null,null,"Kěshì Jiǎgōngsī shuō, yǐhòu diū huò tāmen bǎifēnzhībǎi péicháng, érqiě kěyǐ mǎi bǎoxiǎn.",null,"BODY678"],["HS: 这样的话情况就不一样了。保险一年大概多少钱？ (Vậy thì tình hình khác rồi. Bảo hiểm một năm khoảng bao nhiêu?)",null,null,"Zhèyàngdehuà qíngkuàng jiù bù yīyàng le. Bǎoxiǎn yīnián dàgài duōshǎo qián?",null,"BODY679"],["GV: 大概两亿。 (Khoảng 200 triệu.)",null,null,"Dàgài liǎngyì.",null,"BODY680"],["HS: 那即使加上保险，甲公司每年还是能省六亿。不过赔偿虽然能拿到钱，客户收不到货的影响还是很大。我建议这样：普通产品交给甲公司，贵重产品继续用乙公司。 (Vậy kể cả cộng bảo hiểm, Giáp mỗi năm vẫn tiết kiệm 600 triệu. Nhưng bồi thường thì lấy được tiền, khách không nhận được hàng vẫn ảnh hưởng lớn. Tôi đề nghị: hàng thông thường giao Giáp, hàng giá trị cao tiếp tục dùng Ất.)",null,null,"Nà jíshǐ jiāshàng bǎoxiǎn, Jiǎgōngsī měinián háishì néng shěng liùyì. Bùguò péicháng suīrán néng nádào qián, kèhù shōubùdào huò de yǐngxiǎng háishì hěndà. Wǒ jiànyì zhèyàng: pǔtōng chǎnpǐn jiāogěi Jiǎgōngsī, guìzhòng chǎnpǐn jìxù yòng Yǐgōngsī.",null,"BODY681"],["GV: 好，这个方案两边的好处都考虑到了。 (Được, phương án này tính đến lợi ích cả hai bên.)",null,null,"Hǎo, zhège fāng'àn liǎngbiān de hǎochù dōu kǎolǜ dào le.",null,"BODY682"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY683-C"],["✗ 这个比那个很便宜。 → ✓ 这个比那个便宜多了。/ 这个比那个便宜一点。 (Câu so sánh 比 không dùng 很/非常.)",null,null,"Zhège bǐ nàge hěn piányi. | Zhège bǐ nàge piányi duō le. / | Zhège bǐ nàge piányi yīdiǎn. | Bǐ | Hěn / fēicháng .",null,"BODY684"],["✗ 这个不比那个贵。 (nghĩa khác) → ✓ 这个没有那个贵。 (không đắt bằng)",null,null,"Zhège bù bǐ nàge guì. | Zhège méiyǒu nàge guì.",null,"BODY685"],["✗ A和B一样好吗？我觉得A比B更比较好。 → ✓ 我觉得A比B更好。",null,null,"A hé B yīyàng hǎo ma? Wǒ juéde A bǐ B gèng bǐjiào hǎo. | Wǒ juéde A bǐ B gènghǎo.",null,"BODY686"],["✗ 我选择A因为它便宜。 → ✓ 我选A，是因为它便宜。/ 我之所以选A，是因为它便宜。",null,null,"Wǒ xuǎnzé A yīnwèi tā piányi. | Wǒ xuǎn A, shìyīnwèi tā piányi. / | Wǒ zhīsuǒyǐ xuǎn A, shìyīnwèi tā piányi.",null,"BODY687"],["✗ 两个都有好和坏。 → ✓ 两个各有优缺点。",null,null,"Liǎnggè dōu yǒu hǎo hé huài. | Liǎnggè gè yǒu yōuquēdiǎn.",null,"BODY688"],["✗ 便宜多五亿。 → ✓ 便宜五亿。/ 多花五亿。",null,null,"Piányi duō wǔyì. | Piányi wǔyì. / | Duō huā wǔyì.",null,"BODY689"],["Phát âm: 优缺点 yōuquēdiǎn; 权衡 quánhéng; 取舍 qǔshě; 综合 zōnghé; 宁可 nìngkě.",null,null,"Yōuquēdiǎn | Quánhéng | Qǔshě | Zōnghé | Nìngkě",null,"BODY690"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY691-C"],["Ghi âm phân tích 2 lựa chọn thật trong công việc hoặc cuộc sống (2–3 phút) theo 4 bước: liệt kê lựa chọn → tiêu chí → so sánh ưu nhược → quyết định và lý do.",null,null,null,null,"BODY692"],["HSK5: làm bảng chấm điểm 4 tiêu chí cho 2–3 phương án và trình bày như Hội thoại 5.",null,null,null,null,"BODY693"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY694"],["Buổi 15 — 职业发展与跳槽 Phát triển nghề nghiệp",null,null,"Zhíyè fāzhǎn yǔ tiàocáo",null,"BODY695-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY696-C"],["HSK4: Nói về công việc lý tưởng, mục tiêu nghề nghiệp. HSK5: Thương lượng lương, phân tích việc nhảy việc, xin thăng chức.",null,null,null,null,"BODY697"],["Khung thương lượng lương 4 bước: ① 了解对方预算 Tìm hiểu ngân sách bên kia → ② 用数据说明价值 Dùng số liệu chứng minh giá trị → ③ 提出期望范围 Đưa khoảng kỳ vọng → ④ 灵活谈总待遇 Linh hoạt bàn tổng đãi ngộ.",null,null,"Liǎojiě duìfāng yùsuàn | Yòng shùjù shuōmíng jiàzhí | Tíchū qīwàng fànwéi | Línghuó tán zǒng dàiyù",null,"BODY698"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY700-C"],["1. Hỏi: 你小时候的梦想是做什么？ (Hồi nhỏ ước mơ của bạn là làm gì?)",null,null,"Nǐ xiǎoshíhou de mèngxiǎng shì zuò shénme?",null,"BODY701"],["Đáp: 我小时候想当医生，后来发现自己一看到血就头晕，只好放弃了。 (Hồi nhỏ tôi muốn làm bác sĩ, sau phát hiện thấy máu là chóng mặt, đành bỏ.)",null,null,"Wǒ xiǎoshíhou xiǎng dāng yīshēng, hòulái fāxiànzìjǐ yī kàndàoxiě jiù tóuyūn, zhǐhǎo fàngqì le.",null,"BODY702"],["2. Hỏi: 你现在的工作是你想要的吗？ (Công việc hiện tại có phải là điều bạn muốn không?)",null,null,"Nǐ xiànzài de gōngzuò shì nǐ xiǎngyào de ma?",null,"BODY703"],["Đáp: 差不多吧。我喜欢跟人打交道，现在做销售正好能发挥我的优势。 (Gần như vậy. Tôi thích giao tiếp, làm sales hiện giờ vừa phát huy được thế mạnh.)",null,null,"Chàbuduō ba. Wǒ xǐhuan gēn rén dǎjiāodao, xiànzài zuò xiāoshòu zhènghǎo néng fāhuī wǒ de yōushì.",null,"BODY704"],["3. Hỏi: 你换过几次工作？为什么换？ (Bạn đổi việc mấy lần? Vì sao đổi?)",null,null,"Nǐ huàn guò jǐcì gōngzuò? Wèishénme huàn?",null,"BODY705"],["Đáp: 换过两次。第一次是因为公司倒闭了，第二次是因为想找一个能用中文的工作。 (Đổi 2 lần. Lần đầu vì công ty phá sản, lần hai vì muốn tìm việc dùng được tiếng Trung.)",null,null,"Huàn guò liǎngcì. Dìyīcì shìyīnwèi gōngsī dǎobì le, dì'èrcì shìyīnwèi xiǎng zhǎo yīgè néng yòng Zhōngwén de gōngzuò.",null,"BODY706"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY707-C"],["1. 晋升 / 升职 (thăng chức): 他工作三年就晋升为部门经理了。 (Anh ấy làm 3 năm đã thăng lên trưởng phòng.)",null,null,"Jìnshēng | Shēngzhí | Tā gōngzuò sānnián jiù jìnshēngwéi bùménjīnglǐ le.",null,"BODY708"],["2. 跳槽 (nhảy việc): 很多年轻人两三年就跳一次槽。 (Nhiều bạn trẻ 2–3 năm nhảy việc một lần.)",null,null,"Tiàocáo | Hěnduō niánqīngrén liǎngsānnián jiù tiào yīcì cáo.",null,"BODY709"],["3. 待遇 (đãi ngộ): 这家公司的待遇不错，除了工资还有年终奖。 (Đãi ngộ công ty này khá tốt, ngoài lương còn có thưởng cuối năm.)",null,null,"Dàiyù | Zhèjiā gōngsī de dàiyù bùcuò, chúle gōngzī háiyǒu niánzhōngjiǎng.",null,"BODY710"],["4. 薪资 / 薪水 (lương): 这个岗位的薪资范围是两千万到三千万。 (Khung lương vị trí này từ 20 đến 30 triệu.)",null,null,"Xīnzī | Xīnshuǐ | Zhège gǎngwèi de xīnzī fànwéi shì liǎngqiānwàn dào sānqiānwàn.",null,"BODY711"],["5. 福利 (phúc lợi): 公司的福利包括医疗保险、年假和员工旅游。 (Phúc lợi công ty gồm bảo hiểm y tế, nghỉ phép năm và du lịch.)",null,null,"Fúlì | Gōngsī de fúlì bāokuò yīliáobǎoxiǎn, nián jià hé yuángōng lǚyóu.",null,"BODY712"],["6. 发展空间 (cơ hội phát triển): 我离开是因为现在的公司没有发展空间了。 (Tôi rời đi vì công ty hiện tại không còn cơ hội phát triển.)",null,null,"Fāzhǎn kōngjiān | Wǒ líkāi shìyīnwèi xiànzài de gōngsī méiyǒu fāzhǎn kōngjiān le.",null,"BODY713"],["7. 职业规划 (kế hoạch nghề nghiệp): 你有没有做过三年的职业规划？ (Bạn đã lập kế hoạch nghề nghiệp 3 năm chưa?)",null,null,"Zhíyèguīhuà | Nǐ yǒuméiyǒu zuò guò sānnián de zhíyèguīhuà?",null,"BODY714"],["8. 辞职 / 离职 (nghỉ việc, từ chức): 我上个月向公司提出了辞职。 (Tháng trước tôi đã nộp đơn nghỉ việc.)",null,null,"Cízhí | Lízhí | Wǒ shànggèyuè xiàng gōngsī tíchū le cízhí.",null,"BODY715"],["9. 试用期 (thời gian thử việc): 试用期三个月，转正以后工资加百分之十五。 (Thử việc 3 tháng, lên chính thức lương tăng 15%.)",null,null,"Shìyòngqī | Shìyòngqī sāngè yuè, zhuǎnzhèng yǐhòu gōngzī jiā bǎifēnzhīshíwǔ.",null,"BODY716"],["10. 年终奖 (thưởng cuối năm / thưởng Tết): 去年的年终奖是两个月的工资。 (Thưởng cuối năm năm ngoái bằng 2 tháng lương.)",null,null,"Niánzhōngjiǎng | Qùnián de niánzhōngjiǎng shì liǎnggè yuè de gōngzī.",null,"BODY717"],["11. 猎头 (headhunter): 最近有个猎头打电话给我，介绍了一个新机会。 (Gần đây có headhunter gọi cho tôi, giới thiệu một cơ hội mới.)",null,null,"Liètóu | Zuìjìn yǒu gè liètóu dǎdiànhuà gěi wǒ, jièshào le yīgè xīn jīhuì.",null,"BODY718"],["12. 能力 / 优势 (năng lực / thế mạnh): 我的优势是中文好，而且懂供应链。 (Thế mạnh của tôi là giỏi tiếng Trung lại hiểu chuỗi cung ứng.)",null,null,"Nénglì | Yōushì | Wǒ de yōushì shì Zhōngwén hǎo, érqiě dǒng gōngyìngliàn.",null,"BODY719"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY720-C"],["1. 薪水固然重要，但…… (Lương tất nhiên quan trọng, nhưng …)",null,null,"Xīnshuǐ gùrán zhòngyào, dàn……",null,"BODY721"],["Ví dụ: 薪水固然重要，但我更看重能不能学到东西。 (Lương tất nhiên quan trọng, nhưng tôi coi trọng việc có học được gì không hơn.)",null,null,"Xīnshuǐ gùrán zhòngyào, dàn wǒ gèng kànzhòng néng bùnéng xuédào dōngxi.",null,"BODY722"],["Ví dụ: 薪水固然重要，但如果每天加班到十点，再高的工资也没意思。 (Lương tất nhiên quan trọng, nhưng ngày nào cũng tăng ca đến 10h thì lương cao mấy cũng vô nghĩa.)",null,null,"Xīnshuǐ gùrán zhòngyào, dàn rúguǒ měitiān jiābān dào shídiǎn, zài gāo de gōngzī yě méiyìsi.",null,"BODY723"],["2. 我理想的工作是…… (Công việc lý tưởng của tôi là …)",null,null,"Wǒ lǐxiǎng de gōngzuò shì……",null,"BODY724"],["Ví dụ: 我理想的工作是能经常出差、跟不同国家的人打交道的工作。 (Công việc lý tưởng của tôi là được đi công tác thường xuyên, làm việc với người nhiều nước.)",null,null,"Wǒ lǐxiǎng de gōngzuò shì néng jīngcháng chūchāi, gēn bùtóng guójiā de rén dǎjiāodao de gōngzuò.",null,"BODY725"],["Ví dụ: 我理想的工作是时间比较自由，能自己安排工作节奏。 (Công việc lý tưởng của tôi là thời gian tự do, tự sắp xếp nhịp làm việc.)",null,null,"Wǒ lǐxiǎng de gōngzuò shì shíjiān bǐjiào zìyóu, néng zìjǐ ānpái gōngzuò jiézòu.",null,"BODY726"],["3. 我打算在……年之内，成为…… (Tôi dự định trong vòng … năm, trở thành …)",null,null,"Wǒ dǎsuàn zài…… nián zhīnèi, chéngwéi……",null,"BODY727"],["Ví dụ: 我打算在三年之内，成为采购主管。 (Tôi dự định trong 3 năm trở thành trưởng nhóm mua hàng.)",null,null,"Wǒ dǎsuàn zài sānnián zhīnèi, chéngwéi cǎigòu zhǔguǎn.",null,"BODY728"],["Ví dụ: 我打算在五年之内，有自己的贸易公司。 (Tôi dự định trong 5 năm có công ty thương mại riêng.)",null,null,"Wǒ dǎsuàn zài wǔnián zhīnèi, yǒu zìjǐ de màoyì gōngsī.",null,"BODY729"],["4. 之所以想换工作，主要是因为…… (Sở dĩ muốn đổi việc, chủ yếu vì …)",null,null,"Zhīsuǒyǐ xiǎng huàn gōngzuò, zhǔyào shìyīnwèi……",null,"BODY730"],["Ví dụ: 我之所以想换工作，主要是因为现在的公司已经三年没有涨工资了。 (Sở dĩ tôi muốn đổi việc chủ yếu vì công ty hiện tại 3 năm không tăng lương.)",null,null,"Wǒ zhīsuǒyǐ xiǎng huàn gōngzuò, zhǔyào shìyīnwèi xiànzài de gōngsī yǐjīng sānnián méiyǒu zhǎnggōngzī le.",null,"BODY731"],["Ví dụ: 我之所以想换工作，主要是因为想离家近一点，多陪陪孩子。 (Sở dĩ tôi muốn đổi việc chủ yếu vì muốn gần nhà hơn, ở bên con nhiều hơn.)",null,null,"Wǒ zhīsuǒyǐ xiǎng huàn gōngzuò, zhǔyào shìyīnwèi xiǎng líjiājìn yīdiǎn, duō péipéi háizi.",null,"BODY732"],["5. 我的期望薪资是……左右，具体可以根据……再商量 (Mức lương kỳ vọng của tôi khoảng …, cụ thể có thể bàn thêm dựa trên …)",null,null,"Wǒ de qīwàng xīnzī shì…… zuǒyòu, jùtǐ kěyǐ gēnjù…… zài shāngliang",null,"BODY733"],["Ví dụ: 我的期望薪资是三千万左右，具体可以根据工作内容再商量。 (Lương kỳ vọng khoảng 30 triệu, cụ thể có thể bàn thêm dựa trên nội dung công việc.)",null,null,"Wǒ de qīwàng xīnzī shì sānqiānwàn zuǒyòu, jùtǐ kěyǐ gēnjù gōngzuò nèiróng zài shāngliang.",null,"BODY734"],["Ví dụ: 我的期望薪资是月薪两千五百万左右，具体可以根据福利再商量。 (Lương kỳ vọng khoảng 25 triệu/tháng, cụ thể bàn thêm theo phúc lợi.)",null,null,"Wǒ de qīwàng xīnzī shì yuèxīn liǎngqiānwǔbǎi wànzuǒyòu, jùtǐ kěyǐ gēnjù fúlì zài shāngliang.",null,"BODY735"],["6. 如果……的话，我可以接受…… (Nếu …, tôi có thể chấp nhận …)",null,null,"Rúguǒ…… dehuà, wǒ kěyǐ jiēshòu……",null,"BODY736"],["Ví dụ: 如果有年终奖的话，我可以接受月薪低一点。 (Nếu có thưởng cuối năm, tôi chấp nhận lương tháng thấp hơn chút.)",null,null,"Rúguǒ yǒu niánzhōngjiǎng dehuà, wǒ kěyǐ jiēshòu yuèxīn dī yīdiǎn.",null,"BODY737"],["Ví dụ: 如果半年以后能调薪的话，我可以接受现在的工资。 (Nếu sau nửa năm được điều chỉnh lương, tôi chấp nhận mức lương hiện tại.)",null,null,"Rúguǒ bànnián yǐhòu néng tiáoxīn dehuà, wǒ kěyǐ jiēshòu xiànzài de gōngzī.",null,"BODY738"],["7. 在过去的……年里，我…… (Trong … năm qua, tôi …)",null,null,"Zài guòqù de…… nián lǐ, wǒ……",null,"BODY739"],["Ví dụ: 在过去的两年里，我帮公司开发了十五个新客户，销售额增加了三十亿。 (Trong 2 năm qua, tôi giúp công ty phát triển 15 khách mới, doanh số tăng 3 tỷ.)",null,null,"Zài guòqù de liǎngnián lǐ, wǒ bāng gōngsī kāifā le shíwǔgè xīn kèhù, xiāoshòu'é zēngjiā le sānshí yì.",null,"BODY740"],["Ví dụ: 在过去的一年里，我把仓库的盘点误差从百分之二降到了百分之零点三。 (Trong một năm qua, tôi giảm sai lệch kiểm kê kho từ 2% xuống 0,3%.)",null,null,"Zài guòqù de yīnián lǐ, wǒ bǎ cāngkù de pándiǎn wùchā cóng bǎifēnzhī'èr jiàngdào le bǎifēnzhīlíngdiǎn sān.",null,"BODY741"],["8. 与其……，不如…… (Thay vì …, chi bằng …)",null,null,"Yǔqí……, bùrú……",null,"BODY742"],["Ví dụ: 与其每天抱怨工资低，不如多学一门技能，提高自己的价值。 (Thay vì ngày nào cũng than lương thấp, chi bằng học thêm một kỹ năng, nâng giá trị bản thân.)",null,null,"Yǔqí měitiān bàoyuàn gōngzī dī, bùrú duō xué yīmén jìnéng, tígāo zìjǐ de jiàzhí.",null,"BODY743"],["Ví dụ: 与其马上跳槽，不如先跟老板谈一谈加薪的事。 (Thay vì nhảy việc ngay, chi bằng nói chuyện tăng lương với sếp trước.)",null,null,"Yǔqí mǎshàng tiàocáo, bùrú xiān gēn lǎobǎn tányītán jiāxīn de shì.",null,"BODY744"],["9. (HSK5) 这个数字跟我的期望还有一定的差距，…… (Con số này còn khoảng cách nhất định so với kỳ vọng của tôi, …)",null,null,"Zhège shùzì gēn wǒ de qīwàng háiyǒu yīdìng de chājù,……",null,"BODY745"],["Ví dụ: 这个数字跟我的期望还有一定的差距，能不能再考虑一下？ (Con số này còn cách kỳ vọng của tôi, có thể cân nhắc thêm không?)",null,null,"Zhège shùzì gēn wǒ de qīwàng háiyǒu yīdìng de chājù, néng bùnéng zài kǎolǜyīxià?",null,"BODY746"],["Ví dụ: 这个数字跟我的期望还有一定的差距，不过如果福利好的话，我们可以继续谈。 (Con số này còn cách kỳ vọng, nhưng nếu phúc lợi tốt thì có thể tiếp tục bàn.)",null,null,"Zhège shùzì gēn wǒ de qīwàng háiyǒu yīdìng de chājù, bùguò rúguǒ fúlì hǎo dehuà, wǒmen kěyǐ jìxù tán.",null,"BODY747"],["10. (HSK5) 不管最后怎么决定，我都…… (Dù cuối cùng quyết định thế nào, tôi đều …)",null,null,"Bùguǎn zuìhòu zěnme juédìng, wǒ dōu……",null,"BODY748"],["Ví dụ: 不管最后怎么决定，我都很感谢公司这几年对我的培养。 (Dù quyết định cuối cùng thế nào, tôi đều rất cảm ơn công ty mấy năm qua đã đào tạo tôi.)",null,null,"Bùguǎn zuìhòu zěnme juédìng, wǒ dōu hěn gǎnxiè gōngsī zhè jǐnián duì wǒ de péiyǎng.",null,"BODY749"],["Ví dụ: 不管最后结果怎么样，我都会把手上的工作交接好。 (Dù kết quả thế nào, tôi đều bàn giao công việc đầy đủ.)",null,null,"Bùguǎn zuìhòu jiéguǒ zěnmeyàng, wǒ dōu huì bǎ shǒushàng de gōngzuò jiāojiē hǎo.",null,"BODY750"],["情景对话 1 — Nói về công việc lý tưởng và kế hoạch nghề nghiệp (bạn bè, HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY751-C"],["A: 你在这家公司做了多久了？ (Bạn làm công ty này bao lâu rồi?)",null,null,"Nǐ zài zhèjiā gōngsī zuò le duōjiǔ le?",null,"BODY752"],["B: 快四年了，从助理做到了现在的销售主管。 (Gần 4 năm, từ trợ lý lên trưởng nhóm sales hiện giờ.)",null,null,"Kuài sìnián le, cóng zhùlǐ zuòdào le xiànzài de xiāoshòuzhǔguǎn.",null,"BODY753"],["A: 升得挺快的！你满意现在的工作吗？ (Thăng chức nhanh đấy! Bạn hài lòng công việc hiện tại không?)",null,null,"Shēng de tǐngkuài de! Nǐ mǎnyì xiànzài de gōngzuò ma?",null,"BODY754"],["B: 还可以吧。工资和同事都不错，就是每天做的事情差不多，有点没意思了。 (Cũng được. Lương và đồng nghiệp đều ổn, chỉ là ngày nào cũng làm việc giống nhau, hơi chán.)",null,null,"Hái kěyǐ ba. Gōngzī hé tóngshì dōu bùcuò, jiùshì měitiān zuò de shìqing chàbuduō, yǒudiǎn méiyìsi le.",null,"BODY755"],["A: 那你理想的工作是什么样的？ (Vậy công việc lý tưởng của bạn thế nào?)",null,null,"Nà nǐ lǐxiǎng de gōngzuò shì shénmeyàng de?",null,"BODY756"],["B: 我理想的工作是能负责整个市场，不只是卖产品，还能参与公司的发展计划。 (Công việc lý tưởng là phụ trách cả thị trường, không chỉ bán hàng mà còn tham gia kế hoạch phát triển công ty.)",null,null,"Wǒ lǐxiǎng de gōngzuò shì néng fùzé zhěnggè shìchǎng, bù zhǐshì mài chǎnpǐn, hái néng cānyù gōngsī de fāzhǎn jìhuà.",null,"BODY757"],["A: 那就是市场经理那种岗位？ (Tức là vị trí kiểu giám đốc marketing?)",null,null,"Nà jiùshì shìchǎng jīnglǐ nàzhǒng gǎngwèi?",null,"BODY758"],["B: 对。我打算在三年之内成为区域经理，负责越南北部的市场。 (Đúng. Tôi dự định trong 3 năm trở thành quản lý khu vực, phụ trách thị trường miền Bắc.)",null,null,"Duì. Wǒ dǎsuàn zài sānnián zhīnèi chéngwéi qūyùjīnglǐ, fùzé Yuènán běibù de shìchǎng.",null,"BODY759"],["A: 你们公司有这个机会吗？ (Công ty bạn có cơ hội đó không?)",null,null,"Nǐmen gōngsī yǒu zhège jīhuì ma?",null,"BODY760"],["B: 有，不过现在的区域经理才三十五岁，短期内可能不会走。 (Có, nhưng quản lý khu vực hiện tại mới 35 tuổi, ngắn hạn chắc không đi.)",null,null,"Yǒu, bùguò xiànzài de qūyùjīnglǐ cái sānshíwǔsuì, duǎnqīnèi kěnéng bùhuì zǒu.",null,"BODY761"],["A: 那你会考虑跳槽吗？ (Vậy bạn có tính nhảy việc không?)",null,null,"Nà nǐ huì kǎolǜ tiàocáo ma?",null,"BODY762"],["B: 暂时不会。与其现在就走，不如先把能力提高。我在读一个市场营销的课程，还在准备考HSK6。 (Tạm thời không. Thay vì đi ngay, chi bằng nâng năng lực trước. Tôi đang học khóa marketing, còn chuẩn bị thi HSK6.)",null,null,"Zànshí bùhuì. Yǔqí xiànzài jiù zǒu, bùrú xiān bǎ nénglì tígāo. Wǒ zàidú yīgè shìchǎngyíngxiāo de kèchéng, hái zài zhǔnbèikǎo HSK6.",null,"BODY763"],["A: 你规划得真清楚！我连明年想做什么都还没想好。 (Bạn lập kế hoạch rõ ràng thật! Mình còn chưa nghĩ ra năm sau muốn làm gì.)",null,null,"Nǐ guīhuà de zhēn qīngchu! Wǒ lián míngnián xiǎng zuò shénme dōuháiméi xiǎng hǎo.",null,"BODY764"],["B: 你可以先想想自己最擅长什么、最喜欢做什么，然后再看哪些岗位适合你。 (Bạn có thể nghĩ xem mình giỏi gì nhất, thích làm gì nhất, rồi xem vị trí nào hợp.)",null,null,"Nǐ kěyǐ xiān xiǎngxiang zìjǐ zuì shàncháng shénme, zuì xǐhuan zuò shénme, ránhòu zài kàn nǎxiē gǎngwèi shìhé nǐ.",null,"BODY765"],["A: 好，这个周末我好好想一想。 (Được, cuối tuần này mình nghĩ kỹ.)",null,null,"Hǎo, zhège zhōumò wǒ hǎohǎo xiǎngyīxiǎng.",null,"BODY766"],["情景对话 2 — Đồng nghiệp tâm sự muốn nhảy việc, phân tích lợi hại (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY767-C"],["小芳: 阿玲，跟你说个秘密，我在考虑跳槽。 (A Linh, nói với bạn một bí mật, mình đang tính nhảy việc.)",null,null,"Xiǎo Fāng: Ā Líng, gēn nǐ shuō gè mìmì, wǒ zài kǎolǜ tiàocáo.",null,"BODY768"],["阿玲: 真的？为什么？我们部门不是挺好的吗？ (Thật à? Sao vậy? Phòng mình chẳng phải khá tốt sao?)",null,null,"Ā Líng: zhēnde? Wèishénme? Wǒmen bùmén bùshì tǐng hǎo de ma?",null,"BODY769"],["小芳: 同事是挺好的，可是我们公司已经两年没涨工资了，物价却一直在涨。 (Đồng nghiệp thì tốt, nhưng công ty hai năm không tăng lương, mà vật giá cứ tăng.)",null,null,"Xiǎo Fāng: tóngshì shì tǐng hǎo de, kěshì wǒmen gōngsī yǐjīng liǎngnián méi zhǎnggōngzī le, wùjià què yīzhí zài zhǎng.",null,"BODY770"],["阿玲: 你找到新的工作了吗？ (Bạn tìm được việc mới chưa?)",null,null,"Ā Líng: nǐ zhǎodào xīn de gōngzuò le ma?",null,"BODY771"],["小芳: 有一个猎头介绍了一家中国的电子厂，工资比现在高百分之三十。 (Có headhunter giới thiệu một nhà máy điện tử TQ, lương cao hơn hiện tại 30%.)",null,null,"Xiǎo Fāng: yǒu yīgè liètóu jièshào le yījiā Zhōngguó de diànzichǎng, gōngzī bǐ xiànzài gāo bǎifēnzhīsānshí.",null,"BODY772"],["阿玲: 高这么多！那边的情况你了解吗？ (Cao vậy! Tình hình bên đó bạn biết không?)",null,null,"Ā Líng: gāo zhème duō! Nàbiān de qíngkuàng nǐ liǎojiě ma?",null,"BODY773"],["小芳: 了解了一点，听说加班比较多，而且在北宁，我每天要开车一个小时。 (Biết chút ít, nghe nói tăng ca khá nhiều, lại ở Bắc Ninh, mỗi ngày phải lái xe một tiếng.)",null,null,"Xiǎo Fāng: liǎojiě le yīdiǎn, tīngshuō jiābān bǐjiào duō, érqiě zài Běiníng, wǒ měitiān yào kāichē yīgè xiǎoshí.",null,"BODY774"],["阿玲: 薪水固然重要，但是你也要考虑一下时间和身体。 (Lương tất nhiên quan trọng, nhưng bạn cũng phải cân nhắc thời gian và sức khỏe.)",null,null,"Ā Líng: xīnshuǐ gùrán zhòngyào, dànshì nǐ yě yào kǎolǜyīxià shíjiān hé shēntǐ.",null,"BODY775"],["小芳: 我也在犹豫。不过那边的岗位是采购主管，比现在高一级。 (Mình cũng đang phân vân. Nhưng vị trí bên đó là trưởng nhóm mua hàng, cao hơn hiện tại một bậc.)",null,null,"Xiǎo Fāng: wǒ yě zài yóuyù. Bùguò nàbiān de gǎngwèi shì cǎigòu zhǔguǎn, bǐ xiànzài gāo yījí.",null,"BODY776"],["阿玲: 这一点确实很吸引人。你跟我们经理谈过加薪吗？ (Điểm này đúng là hấp dẫn. Bạn đã nói với giám đốc mình chuyện tăng lương chưa?)",null,null,"Ā Líng: zhè yīdiǎn quèshí hěn xīyǐn rén. Nǐ gēn wǒmen jīnglǐ tán guò jiāxīn ma?",null,"BODY777"],["小芳: 还没有，我怕说了以后关系很尴尬。 (Chưa, mình sợ nói ra quan hệ sẽ ngại.)",null,null,"Xiǎo Fāng: hái méiyǒu, wǒ pà shuō le yǐhòu guānxi hěn gāngà.",null,"BODY778"],["阿玲: 我觉得与其直接走，不如先跟经理谈一谈。你去年做的降成本项目帮公司省了不少钱，这些都是你的筹码。 (Mình thấy thay vì đi luôn, chi bằng nói chuyện với giám đốc trước. Dự án giảm chi phí năm ngoái bạn làm giúp công ty tiết kiệm không ít, đó đều là lợi thế của bạn.)",null,null,"Ā Líng: wǒ juéde yǔqí zhíjiē zǒu, bùrú xiān gēn jīnglǐ tányītán. Nǐ qùnián zuò de jiàng chéngběn xiàngmù bāng gōngsī shěng le bùshǎo qián, zhèxiē dōu shì nǐ de chóumǎ.",null,"BODY779"],["小芳: 如果经理不同意呢？ (Lỡ giám đốc không đồng ý thì sao?)",null,null,"Xiǎo Fāng: rúguǒ jīnglǐ bù tóngyì ne?",null,"BODY780"],["阿玲: 那你再决定也不晚。至少你试过了，不会后悔。 (Thì lúc đó quyết định cũng chưa muộn. Ít ra bạn đã thử, không hối hận.)",null,null,"Ā Líng: nà nǐ zài juédìng yě bù wǎn. Zhìshǎo nǐ shì guò le, bùhuì hòuhuǐ.",null,"BODY781"],["小芳: 有道理。我准备一下，下周找经理聊。 (Có lý. Mình chuẩn bị, tuần sau tìm giám đốc nói chuyện.)",null,null,"Xiǎo Fāng: yǒu dàolǐ. Wǒ zhǔnbèi yīxià, xiàzhōu zhǎo jīnglǐ liáo.",null,"BODY782"],["阿玲: 加油！不管最后怎么决定，我都支持你。 (Cố lên! Dù quyết định thế nào mình cũng ủng hộ bạn.)",null,null,"Ā Líng: jiāyóu! Bùguǎn zuìhòu zěnme juédìng, wǒ dōu zhīchí nǐ.",null,"BODY783"],["情景对话 3 — Xin sếp tăng lương / thăng chức (dùng số liệu chứng minh giá trị)",null,null,"Qíngjǐng duìhuà",null,"BODY784-C"],["小芳: 经理，您现在有空吗？我想跟您聊一下我的职业发展。 (Giám đốc, giờ anh rảnh không? Em muốn nói chuyện về phát triển nghề nghiệp của em.)",null,null,"Xiǎo Fāng: jīnglǐ, nín xiànzài yǒukòng ma? Wǒ xiǎng gēn nín liáo yīxià wǒ de zhíyè fāzhǎn.",null,"BODY785"],["经理: 好啊，坐吧。 (Được, ngồi đi.)",null,null,"Jīnglǐ: hǎo a, zuò ba.",null,"BODY786"],["小芳: 我来公司已经四年了，非常感谢您一直以来的指导。 (Em vào công ty 4 năm rồi, rất cảm ơn anh luôn chỉ dẫn.)",null,null,"Xiǎo Fāng: wǒ lái gōngsī yǐjīng sìnián le, fēicháng gǎnxiènín yīzhí yǐlái de zhǐdǎo.",null,"BODY787"],["小芳: 在过去的一年里，我主要做了三件事：第一，开发了五家新供应商；第二，主导了降成本项目，帮公司节省了十二亿；第三，把采购周期从二十天缩短到了十二天。 (Trong một năm qua em làm chủ yếu 3 việc: một, phát triển 5 NCC mới; hai, chủ trì dự án giảm chi phí, giúp công ty tiết kiệm 1,2 tỷ; ba, rút ngắn chu kỳ mua hàng từ 20 xuống 12 ngày.)",null,null,"Xiǎo Fāng: zài guòqù de yīnián lǐ, wǒ zhǔyào zuò le sānjiàn shì: dìyī, kāifā le wǔjiā xīn gōngyìngshāng; dì'èr, zhǔdǎo le jiàng chéngběn xiàngmù, bāng gōngsī jiéshěng le shí'èryì; dìsān, bǎ cǎigòu zhōuqī cóng èrshítiān suōduǎn dào le shí'èrtiān.",null,"BODY788"],["经理: 你这一年的表现确实很好，大家都看到了。 (Năm nay em thể hiện rất tốt, mọi người đều thấy.)",null,null,"Jīnglǐ: nǐ zhè yīnián de biǎoxiàn quèshí hěn hǎo, dàjiā dōu kàndào le.",null,"BODY789"],["小芳: 谢谢经理。我这两年的工资一直没有调整，而且我了解了一下，市场上同样岗位的工资比我现在高百分之二十左右。 (Cảm ơn anh. Hai năm nay lương em chưa điều chỉnh, em có tìm hiểu, lương vị trí tương tự trên thị trường cao hơn hiện tại khoảng 20%.)",null,null,"Xiǎo Fāng: xièxie jīnglǐ. Wǒ zhè liǎngnián de gōngzī yīzhí méiyǒu tiáozhěng, érqiě wǒ liǎojiě le yīxià, shìchǎng shàng tóngyàng gǎngwèi de gōngzī bǐ wǒ xiànzài gāo bǎifēnzhī'èrshí zuǒyòu.",null,"BODY790"],["经理: 你的意思是希望加薪？ (Ý em là muốn tăng lương?)",null,null,"Jīnglǐ: nǐ de yìsi shì xīwàng jiāxīn?",null,"BODY791"],["小芳: 是的。我希望能把工资调整到市场的水平。另外，如果有机会的话，我也希望能承担更多的管理工作。 (Vâng. Em mong được điều chỉnh lương lên mức thị trường. Ngoài ra nếu có cơ hội, em cũng muốn đảm nhận thêm công việc quản lý.)",null,null,"Xiǎo Fāng: shì de. Wǒ xīwàng néng bǎ gōngzī tiáozhěng dào shìchǎng de shuǐpíng. Lìngwài, rúguǒ yǒu jīhuì dehuà, wǒ yě xīwàng néng chéngdān gèng duō de guǎnlǐgōngzuò.",null,"BODY792"],["经理: 我理解。不过今年公司的预算比较紧，一次加百分之二十有点难。 (Tôi hiểu. Nhưng năm nay ngân sách công ty khá eo hẹp, tăng một lần 20% hơi khó.)",null,null,"Jīnglǐ: wǒ lǐjiě. Bùguò jīnnián gōngsī de yùsuàn bǐjiào jǐn, yīcì jiā bǎifēnzhī'èrshí yǒudiǎn nán.",null,"BODY793"],["小芳: 我明白公司的情况。那能不能先加百分之十，半年以后根据我的表现再考虑？ (Em hiểu tình hình công ty. Vậy tăng trước 10% được không, sau nửa năm dựa vào thể hiện của em rồi xét tiếp?)",null,null,"Xiǎo Fāng: wǒ míngbai gōngsī de qíngkuàng. Nà néng bùnéng xiān jiā bǎifēnzhīshí, bànnián yǐhòu gēnjù wǒ de biǎoxiàn zài kǎolǜ?",null,"BODY794"],["经理: 这个我可以向上面申请。另外，明年我们打算成立一个采购小组，你有兴趣当组长吗？ (Cái này tôi có thể xin cấp trên. Ngoài ra sang năm chúng ta định lập một nhóm mua hàng, em có hứng thú làm nhóm trưởng không?)",null,null,"Jīnglǐ: zhège wǒ kěyǐ xiàng shàngmiàn shēnqǐng. Lìngwài, míngnián wǒmen dǎsuàn chénglì yīgè cǎigòu xiǎozǔ, nǐ yǒu xìngqù dāng zǔzhǎng ma?",null,"BODY795"],["小芳: 当然有兴趣！这正是我想要的发展方向。 (Tất nhiên có ạ! Đó chính là hướng phát triển em mong muốn.)",null,null,"Xiǎo Fāng: dāngrán yǒu xìngqù! Zhè zhèngshì wǒ xiǎngyào de fāzhǎn fāngxiàng.",null,"BODY796"],["经理: 好，那这两件事我一起去申请，下周给你答复。 (Được, vậy tôi xin cả hai việc cùng lúc, tuần sau trả lời em.)",null,null,"Jīnglǐ: hǎo, nà zhè liǎngjiànshì wǒ yīqǐ qù shēnqǐng, xiàzhōu gěi nǐ dáfù.",null,"BODY797"],["小芳: 太感谢您了！不管最后结果怎么样，我都会继续努力的。 (Cảm ơn anh nhiều! Dù kết quả thế nào em đều sẽ tiếp tục cố gắng.)",null,null,"Xiǎo Fāng: tài gǎnxiènín le! Bùguǎn zuìhòu jiéguǒ zěnmeyàng, wǒ dōu huì jìxù nǔlì de.",null,"BODY798"],["情景对话 4 — Xin nghỉ việc một cách chuyên nghiệp và bàn giao công việc",null,null,"Qíngjǐng duìhuà",null,"BODY799-C"],["小海: 经理，有件事想跟您当面说。 (Giám đốc, có việc em muốn nói trực tiếp với anh.)",null,null,"Xiǎo Hǎi: jīnglǐ, yǒujiànshì xiǎng gēn nín dāngmiàn shuō.",null,"BODY800"],["经理: 什么事？看你这么严肃。 (Việc gì? Thấy em nghiêm túc thế.)",null,null,"Jīnglǐ: shénme shì? Kàn nǐ zhème yánsù.",null,"BODY801"],["小海: 我考虑了很久，决定下个月底离职。这是我的辞职信。 (Em cân nhắc rất lâu, quyết định cuối tháng sau nghỉ việc. Đây là đơn xin nghỉ của em.)",null,null,"Xiǎo Hǎi: wǒ kǎolǜ le hěn jiǔ, juédìng xià gè yuèdǐ lízhí. Zhè shì wǒ de cízhíxìn.",null,"BODY802"],["经理: 太突然了！能告诉我原因吗？ (Đột ngột quá! Có thể cho tôi biết lý do không?)",null,null,"Jīnglǐ: tài tūrán le! Néng gàosu wǒ yuányīn ma?",null,"BODY803"],["小海: 主要是家里的原因。我父母年纪大了，身体不太好，我想回岘港工作，离他们近一点。 (Chủ yếu là lý do gia đình. Bố mẹ em lớn tuổi, sức khỏe không tốt, em muốn về Đà Nẵng làm việc để gần bố mẹ.)",null,null,"Xiǎo Hǎi: zhǔyào shì jiālǐ de yuányīn. Wǒ fùmǔ niánjì dà le, shēntǐ bùtàihǎo, wǒ xiǎng huí Xiàngǎng gōngzuò, lí tāmen jìn yīdiǎn.",null,"BODY804"],["经理: 原来是这样。这个理由我完全理解。公司在岘港没有分公司，真可惜。 (Ra vậy. Lý do này tôi hoàn toàn hiểu. Công ty không có chi nhánh ở Đà Nẵng, tiếc thật.)",null,null,"Jīnglǐ: yuánlái shì zhèyàng. Zhège lǐyóu wǒ wánquán lǐjiě. Gōngsī zài Xiàngǎng méiyǒu fēngōngsī, zhēn kěxī.",null,"BODY805"],["小海: 是啊。这几年在这里学到了很多，我真的很感谢您和公司。 (Vâng. Mấy năm qua ở đây học được rất nhiều, em thật sự cảm ơn anh và công ty.)",null,null,"Xiǎo Hǎi: shì a. Zhè jǐnián zài zhèlǐ xuédào le hěnduō, wǒ zhēnde hěn gǎnxiènín hé gōngsī.",null,"BODY806"],["经理: 你手上的工作怎么安排？ (Việc trong tay em sắp xếp thế nào?)",null,null,"Jīnglǐ: nǐ shǒushàng de gōngzuò zěnme ānpái?",null,"BODY807"],["小海: 按照公司规定，我会提前一个月通知。这一个月我会把所有的工作都交接好，包括客户资料、正在进行的订单和供应商的联系方式。 (Theo quy định, em báo trước một tháng. Tháng này em bàn giao đầy đủ, gồm hồ sơ khách, đơn đang thực hiện và thông tin liên hệ NCC.)",null,null,"Xiǎo Hǎi: ànzhào gōngsī guīdìng, wǒhuì tíqián yīgèyuè tōngzhī. Zhè yīgèyuè wǒhuì bǎ suǒyǒu de gōngzuò dōu jiāojiē hǎo, bāokuò kèhùzīliào, zhèngzài jìnxíng de dìngdān hé gōngyìngshāng de liánxìfāngshì.",null,"BODY808"],["经理: 你觉得谁可以接你的工作？ (Em thấy ai có thể tiếp nhận công việc của em?)",null,null,"Jīnglǐ: nǐ juéde shuí kěyǐ jiē nǐ de gōngzuò?",null,"BODY809"],["小海: 我推荐小林，他跟了我一年，对客户都很熟悉。这个月我会带他去拜访几个大客户。 (Em đề cử Tiểu Lâm, cậu ấy theo em một năm, rất quen khách. Tháng này em sẽ dẫn cậu ấy đi thăm vài khách lớn.)",null,null,"Xiǎo Hǎi: wǒ tuījiàn Xiǎo Lín, tā gēn le wǒ yīnián, duì kèhù dōu hěn shúxi. Zhège yuè wǒhuì dài tā qù bàifǎng jǐgè dà kèhù.",null,"BODY810"],["经理: 好，你考虑得很周到。以后如果想回来，我们随时欢迎。 (Được, em chu đáo lắm. Sau này muốn quay lại, chúng tôi luôn chào đón.)",null,null,"Jīnglǐ: hǎo, nǐ kǎolǜ de hěn zhōudào. Yǐhòu rúguǒ xiǎng huílái, wǒmen suíshíhuānyíng.",null,"BODY811"],["小海: 谢谢经理！以后在岘港如果有什么需要帮忙的，随时联系我。 (Cảm ơn giám đốc! Sau này ở Đà Nẵng cần giúp gì cứ liên hệ em.)",null,null,"Xiǎo Hǎi: xièxie jīnglǐ! Yǐhòu zài Xiàngǎng rúguǒ yǒu shénme xūyào bāngmáng de, suíshí liánxì wǒ.",null,"BODY812"],["情景对话 5 — (HSK5) Thương lượng lương với nhà tuyển dụng đề nghị lương thấp",null,null,"Qíngjǐng duìhuà",null,"BODY813-C"],["人事经理: 陈先生，经过两轮面试，我们对你很满意，想给你发录用通知。 (Anh Trần, qua 2 vòng phỏng vấn, chúng tôi rất hài lòng về anh, muốn gửi thư mời nhận việc.)",null,null,"Rénshì jīnglǐ: Chén xiānsheng, jīngguò liǎnglún miànshì, wǒmen duì nǐ hěn mǎnyì, xiǎng gěi nǐ fā lùyòng tōngzhī.",null,"BODY814"],["陈先生: 谢谢！我也很希望加入贵公司。 (Cảm ơn! Tôi cũng rất mong gia nhập quý công ty.)",null,null,"Chén xiānsheng: xièxie! Wǒ yě hěn xīwàng jiārù guì gōngsī.",null,"BODY815"],["人事经理: 这个岗位我们能给的月薪是两千五百万盾。 (Vị trí này mức lương tháng chúng tôi có thể trả là 25 triệu.)",null,null,"Rénshì jīnglǐ: zhège gǎngwèi wǒmen néng gěi de yuèxīn shì liǎngqiānwǔbǎi wàn dùn.",null,"BODY816"],["陈先生: 谢谢您的诚意。不过这个数字跟我的期望还有一定的差距。我现在的月薪是两千六百万，我的期望是三千二百万左右。 (Cảm ơn thành ý. Nhưng con số này còn cách kỳ vọng của tôi. Lương hiện tại của tôi là 26 triệu, kỳ vọng khoảng 32 triệu.)",null,null,"Chén xiānsheng: xièxienín de chéngyì. Bùguò zhège shùzì gēn wǒ de qīwàng háiyǒu yīdìng de chājù. Wǒ xiànzài de yuèxīn shì liǎngqiān liùbǎiwàn, wǒ de qīwàng shì sānqiān èrbǎiwàn zuǒyòu.",null,"BODY817"],["人事经理: 三千二百万超出了这个岗位的预算。你能说说你的理由吗？ (32 triệu vượt ngân sách vị trí này. Anh có thể nói lý do không?)",null,null,"Rénshì jīnglǐ: sānqiān èrbǎiwàn chāochū le zhège gǎngwèi de yùsuàn. Nǐ néng shuōshuo nǐ de lǐyóu ma?",null,"BODY818"],["陈先生: 当然。第一，我有六年的物流经验，其中四年负责中国线，客户资源可以直接带过来；第二，我的中文已经达到HSK5，可以直接跟总部沟通，不需要翻译；第三，我在上一家公司负责的线路，一年的销售额是一百二十亿。 (Tất nhiên. Một, tôi có 6 năm kinh nghiệm logistics, 4 năm phụ trách tuyến TQ, nguồn khách có thể mang sang ngay; hai, tiếng Trung đã đạt HSK5, trao đổi trực tiếp với tổng bộ không cần phiên dịch; ba, tuyến tôi phụ trách ở công ty cũ doanh số một năm 12 tỷ.)",null,null,"Chén xiānsheng: dāngrán. Dìyī, wǒ yǒu liùnián de wùliú jīngyàn, qízhōng sìnián fùzé Zhōngguó xiàn, kèhùzīyuán kěyǐ zhíjiē dài guòlái; dì'èr, wǒ de Zhōngwén yǐjīng dádào HSK5, kěyǐ zhíjiē gēn zǒngbù gōutōng, bù xūyào fānyì; dìsān, wǒ zài shàng yījiā gōngsī fùzé de xiànlù, yīnián de xiāoshòu'é shì yībǎi'èrshí yì.",null,"BODY819"],["人事经理: 你的经验确实很符合我们的要求。不过薪资方面，我们有统一的标准，最多只能到两千八百万。 (Kinh nghiệm của anh đúng là rất phù hợp. Nhưng về lương chúng tôi có tiêu chuẩn chung, tối đa chỉ được 28 triệu.)",null,null,"Rénshì jīnglǐ: nǐ de jīngyàn quèshí hěn fúhé wǒmen de yāoqiú. Bùguò xīnzī fāngmiàn, wǒmen yǒu tǒngyī de biāozhǔn, zuì duō zhǐnéng dào liǎngqiān bābǎiwàn.",null,"BODY820"],["陈先生: 我理解公司有自己的标准。除了月薪以外，贵公司还有哪些福利？ (Tôi hiểu công ty có tiêu chuẩn riêng. Ngoài lương tháng, quý công ty còn phúc lợi gì?)",null,null,"Chén xiānsheng: wǒ lǐjiě gōngsī yǒu zìjǐ de biāozhǔn. Chúle yuèxīn yǐwài, guì gōngsī háiyǒu nǎxiē fúlì?",null,"BODY821"],["人事经理: 我们有十三薪，年终奖根据业绩一般是一到三个月，另外有私人医疗保险和每年十五天年假。 (Chúng tôi có lương tháng 13, thưởng cuối năm theo hiệu quả thường 1–3 tháng, ngoài ra có bảo hiểm y tế tư nhân và 15 ngày phép năm.)",null,null,"Rénshì jīnglǐ: wǒmen yǒu shísān xīn, niánzhōngjiǎng gēnjù yèjì yībān shì yī dào sāngè yuè, lìngwài yǒu sīrén yīliáobǎoxiǎn hé měinián shíwǔtiān nián jià.",null,"BODY822"],["陈先生: 如果是这样的话，我可以接受两千八百万的月薪，但是希望能加一条：试用期结束以后，根据我的业绩重新评估一次薪资。 (Nếu vậy, tôi có thể chấp nhận lương 28 triệu, nhưng mong thêm một điều: hết thử việc, đánh giá lại lương một lần dựa trên thành tích.)",null,null,"Chén xiānsheng: rúguǒ shì zhèyàngdehuà, wǒ kěyǐ jiēshòu liǎngqiān bābǎiwàn de yuèxīn, dànshì xīwàng néng jiā yītiáo: shìyòngqī jiéshù yǐhòu, gēnjù wǒ de yèjì chóngxīn pínggū yīcì xīnzī.",null,"BODY823"],["人事经理: 试用期是三个月，三个月以后重新评估，这个我可以跟老板申请。 (Thử việc 3 tháng, sau 3 tháng đánh giá lại, cái này tôi có thể xin sếp.)",null,null,"Rénshì jīnglǐ: shìyòngqī shì sāngè yuè, sāngè yuè yǐhòu chóngxīn pínggū, zhège wǒ kěyǐ gēn lǎobǎn shēnqǐng.",null,"BODY824"],["陈先生: 另外，试用期的工资能不能按全额发？因为我会放弃现在公司的年终奖。 (Ngoài ra, lương thử việc có thể trả đủ 100% không? Vì tôi sẽ bỏ thưởng cuối năm ở công ty hiện tại.)",null,null,"Chén xiānsheng: lìngwài, shìyòngqī de gōngzī néng bùnéng àn quán'é fā? Yīnwèi wǒhuì fàngqì xiànzài gōngsī de niánzhōngjiǎng.",null,"BODY825"],["人事经理: 一般试用期是百分之八十五，不过考虑到你的情况，我们可以按全额发。 (Thường thử việc là 85%, nhưng xét trường hợp của anh, chúng tôi có thể trả đủ.)",null,null,"Rénshì jīnglǐ: yībān shìyòngqī shì bǎifēnzhībāshíwǔ, bùguò kǎolǜ dào nǐ de qíngkuàng, wǒmen kěyǐ àn quán'é fā.",null,"BODY826"],["陈先生: 太好了，谢谢您！那我们确认一下：月薪两千八百万，十三薪，试用期三个月全额工资，三个月以后重新评估薪资。 (Tuyệt quá, cảm ơn chị! Vậy xác nhận lại: lương 28 triệu, lương tháng 13, thử việc 3 tháng hưởng đủ lương, sau 3 tháng đánh giá lại lương.)",null,null,"Chén xiānsheng: tàihǎole, xièxienín! Nà wǒmen quèrèn yīxià: yuèxīn liǎngqiān bābǎiwàn, shísān xīn, shìyòngqī sāngè yuè quán'é gōngzī, sāngè yuè yǐhòu chóngxīn pínggū xīnzī.",null,"BODY827"],["人事经理: 对。我今天把书面的录用通知发到你的邮箱，你看一下，没问题的话一周之内回复我们。 (Đúng. Hôm nay tôi gửi thư mời bằng văn bản vào email anh, anh xem, không vấn đề thì trong một tuần phản hồi chúng tôi.)",null,null,"Rénshì jīnglǐ: duì. Wǒ jīntiān bǎ shūmiàn de lùyòng tōngzhī fādào nǐ de yóuxiāng, nǐ kàn yīxià, méi wèntí dehuà yīzhōu zhīnèi huífù wǒmen.",null,"BODY828"],["陈先生: 好的，期待和大家一起工作！ (Vâng, mong được làm việc cùng mọi người!)",null,null,"Chén xiānsheng: hǎo de, qīdài hé dàjiā yīqǐ gōngzuò!",null,"BODY829"],["情景对话 6 — (HSK5) Công ty cũ giữ lại (counter-offer): phân tích có nên ở lại",null,null,"Qíngjǐng duìhuà",null,"BODY830-C"],["经理: 小芳，听说你收到了别的公司的录用通知？ (Tiểu Phương, nghe nói em nhận được thư mời của công ty khác?)",null,null,"Jīnglǐ: Xiǎo Fāng, tīngshuō nǐ shōudào le biéde gōngsī de lùyòng tōngzhī?",null,"BODY831"],["小芳: 是的，经理。我本来打算这周跟您说的。 (Vâng, giám đốc. Em định tuần này nói với anh.)",null,null,"Xiǎo Fāng: shì de, jīnglǐ. Wǒ běnlái dǎsuàn zhè zhōu gēn nín shuō de.",null,"BODY832"],["经理: 我们不想失去你。如果你留下来，公司可以给你加薪百分之二十五，明年一月升为采购主管。 (Chúng tôi không muốn mất em. Nếu em ở lại, công ty tăng lương 25%, tháng 1 năm sau lên trưởng nhóm mua hàng.)",null,null,"Jīnglǐ: wǒmen bùxiǎng shīqù nǐ. Rúguǒ nǐ liúxiàlái, gōngsī kěyǐ gěi nǐ jiāxīn bǎifēnzhī'èrshíwǔ, míngnián yīyuè shēngwéi cǎigòu zhǔguǎn.",null,"BODY833"],["小芳: 谢谢公司的认可，我真的很感动。不过我想问一下：为什么之前我提加薪的时候，公司说预算不够？ (Cảm ơn công ty đã ghi nhận, em thật sự cảm động. Nhưng em muốn hỏi: sao trước đây em đề xuất tăng lương thì công ty bảo không đủ ngân sách?)",null,null,"Xiǎo Fāng: xièxie gōngsī de rènkě, wǒ zhēnde hěn gǎndòng. Bùguò wǒ xiǎng wèn yīxià: wèishénme zhīqián wǒ tí jiāxīn de shíhou, gōngsī shuō yùsuàn bùgòu?",null,"BODY834"],["经理: 说实话，是我们没有及时看到你的价值，这是我的问题。 (Thật lòng mà nói, là chúng tôi chưa kịp thời nhìn thấy giá trị của em, đó là lỗi của tôi.)",null,null,"Jīnglǐ: shuōshíhuà, shì wǒmen méiyǒu jíshí kàndào nǐ de jiàzhí, zhè shì wǒ de wèntí.",null,"BODY835"],["小芳: 我理解。我需要时间考虑一下，因为另一家公司在北宁，离我家比较远。 (Em hiểu. Em cần thời gian cân nhắc, vì công ty kia ở Bắc Ninh, khá xa nhà em.)",null,null,"Xiǎo Fāng: wǒ lǐjiě. Wǒ xūyào shíjiān kǎolǜyīxià, yīnwèi lìngyījiā gōngsī zài Běiníng, lí wǒjiā bǐjiào yuǎn.",null,"BODY836"],["经理: 你可以把两边的情况都列出来比较一下。 (Em có thể liệt kê tình hình hai bên ra so sánh.)",null,null,"Jīnglǐ: nǐ kěyǐ bǎ liǎngbiān de qíngkuàng dōu lièchūlái bǐjiào yīxià.",null,"BODY837"],["小芳: (nói với bạn sau đó) 现在两边的工资差不多了。新公司的优点是平台大，可以接触国际采购；缺点是远，而且什么都要重新开始。 (Giờ lương hai bên gần bằng nhau. Công ty mới ưu điểm là môi trường lớn, tiếp xúc mua hàng quốc tế; nhược điểm là xa, cái gì cũng phải bắt đầu lại.)",null,null,"Xiǎo Fāng: xiànzài liǎngbiān de gōngzī chàbuduō le. Xīn gōngsī de yōudiǎn shì píngtái dà, kěyǐ jiēchù guójì cǎigòu; quēdiǎn shì yuǎn, érqiě shénme dōu yào chóngxīn kāishǐ.",null,"BODY838"],["阿玲: 留下来呢？ (Còn ở lại?)",null,null,"Ā Líng: liúxiàlái ne?",null,"BODY839"],["小芳: 留下来的优点是熟悉，马上就能当主管；缺点是我担心公司以后还会像以前一样，不主动给我机会。 (Ở lại ưu điểm là quen thuộc, làm trưởng nhóm ngay; nhược điểm là em lo sau này công ty vẫn như trước, không chủ động cho cơ hội.)",null,null,"Xiǎo Fāng: liúxiàlái de yōudiǎn shì shúxi, mǎshàng jiù néng dāng zhǔguǎn; quēdiǎn shì wǒ dānxīn gōngsī yǐhòu hái huì xiàng yǐqián yīyàng, bù zhǔdòng gěi wǒ jīhuì.",null,"BODY840"],["阿玲: 很多人说，接受公司挽留的人，一两年以后还是会走。 (Nhiều người nói người nhận lời giữ lại của công ty, 1–2 năm sau vẫn đi.)",null,null,"Ā Líng: hěnduō rén shuō, jiēshòu gōngsī wǎnliú de rén, yīliǎngnián yǐhòu háishì huì zǒu.",null,"BODY841"],["小芳: 这个说法不能一概而论。关键是公司是真的改变了，还是只是怕我走。 (Câu đó không thể vơ đũa cả nắm. Quan trọng là công ty thật sự thay đổi hay chỉ sợ em đi.)",null,null,"Xiǎo Fāng: zhège shuōfǎ bùnéng yīgài'érlùn. Guānjiàn shì gōngsī shì zhēnde gǎibiàn le, háishì zhǐshì pà wǒ zǒu.",null,"BODY842"],["阿玲: 那你怎么判断？ (Vậy bạn đánh giá thế nào?)",null,null,"Ā Líng: nà nǐ zěnme pànduàn?",null,"BODY843"],["小芳: 我打算请经理把升职的时间和职责写进书面的协议里，如果公司愿意，说明是真心的。 (Em định nhờ giám đốc ghi thời gian thăng chức và trách nhiệm vào văn bản thỏa thuận, nếu công ty đồng ý thì chứng tỏ thật lòng.)",null,null,"Xiǎo Fāng: wǒ dǎsuàn qǐng jīnglǐ bǎ shēngzhí de shíjiān hé zhízé xiě jìn shūmiàn de xiéyì lǐ, rúguǒ gōngsī yuànyì, shuōmíng shì zhēnxīn de.",null,"BODY844"],["阿玲: 好主意！这样你做什么决定都不会后悔。 (Ý hay! Như vậy dù quyết định gì bạn cũng không hối hận.)",null,null,"Ā Líng: hǎo zhǔyì! Zhèyàng nǐ zuò shénme juédìng dōu bùhuì hòuhuǐ.",null,"BODY845"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY846-C"],["1. Hỏi: 五年以后，你希望自己在做什么？ (5 năm nữa bạn muốn mình đang làm gì?)",null,null,"Wǔnián yǐhòu, nǐ xīwàng zìjǐ zài zuò shénme?",null,"BODY847"],["Đáp: 五年以后，我希望成为一家中资企业的供应链经理，管理一个十人左右的团队，并且能用中文跟总部开会。 (5 năm nữa tôi mong là quản lý chuỗi cung ứng ở một doanh nghiệp vốn TQ, quản lý đội khoảng 10 người, họp với tổng bộ bằng tiếng Trung.)",null,null,"Wǔnián yǐhòu, wǒ xīwàng chéngwéi yījiā zhōngzīqǐyè de gōngyìngliàn jīnglǐ, guǎnlǐ yīgè shí rén zuǒyòu de tuánduì, bìngqiě néng yòng Zhōngwén gēn zǒngbù kāihuì.",null,"BODY848"],["2. Hỏi: 选工作的时候，你最看重哪三点？ (Khi chọn việc, bạn coi trọng 3 điểm nào nhất?)",null,null,"Xuǎn gōngzuò de shíhou, nǐ zuì kànzhòng nǎ sāndiǎn?",null,"BODY849"],["Đáp: 我最看重三点：第一是发展空间，第二是团队氛围，第三才是工资。 (Tôi coi trọng 3 điểm: một là cơ hội phát triển, hai là không khí đội nhóm, ba mới là lương.)",null,null,"Wǒ zuì kànzhòng sāndiǎn: dìyī shì fāzhǎn kōngjiān, dì'èr shì tuánduì fēnwéi, dìsān cái shì gōngzī.",null,"BODY850"],["3. Hỏi: 你觉得跳槽太频繁有什么坏处？ (Bạn thấy nhảy việc quá thường xuyên có hại gì?)",null,null,"Nǐ juéde tiàocáo tài pínfán yǒu shénme huàichù?",null,"BODY851"],["Đáp: 坏处是公司会觉得你不稳定，而且每次都要重新开始，很难积累深的经验和人脉。 (Hại là công ty thấy bạn không ổn định, mỗi lần đều bắt đầu lại, khó tích lũy kinh nghiệm sâu và quan hệ.)",null,null,"Huàichù shì gōngsī huì juéde nǐ bù wěndìng, érqiě měicì dōu yào chóngxīn kāishǐ, hěn nán jīlěi shēn de jīngyàn hé rén mài.",null,"BODY852"],["4. Hỏi: (HSK5) 面试的时候，如果对方问你\"你的期望薪资是多少\"，你怎么回答比较好？ (Khi phỏng vấn, nếu họ hỏi \"Mức lương kỳ vọng bao nhiêu\", trả lời thế nào thì tốt?)",null,null,"Miànshì de shíhou, rúguǒ duìfāng wèn nǐ \"nǐ de qīwàng xīnzī shì duōshǎo\", nǐ zěnme huídá bǐjiào hǎo?",null,"BODY853"],["Đáp: 我会先反问这个岗位的薪资范围，然后根据自己的经验给一个区间，比如\"三千万到三千五百万之间\"，同时说明可以根据总的福利再商量，这样既有底线又有弹性。 (Hỏi ngược lại khung lương vị trí, rồi dựa kinh nghiệm đưa một khoảng như \"từ 30 đến 35 triệu\", đồng thời nói có thể bàn thêm theo tổng phúc lợi, như vậy vừa có giới hạn vừa linh hoạt.)",null,null,"Wǒhuì xiān fǎnwèn zhège gǎngwèi de xīnzī fànwéi, ránhòu gēnjù zìjǐ de jīngyàn gěi yīgè qūjiān, bǐrú \"sānqiānwàn dào sānqiānwǔbǎi wàn zhījiān\", tóngshí shuōmíng kěyǐ gēnjù zǒng de fúlì zài shāngliang, zhèyàng jìyǒu dǐxiàn yòu yǒu tánxìng.",null,"BODY854"],["情景模拟 ROLE-PLAY — GV (nhà tuyển dụng) đề nghị lương thấp; HS thương lượng theo 4 bước. Vòng 2 (bất ngờ): GV nói \"đây là con số cuối cùng\"",null,null,"Qíngjǐng mónǐ",null,"BODY855-C"],["GV: 我们这个岗位的月薪是两千万盾。 (Vị trí này lương tháng 20 triệu.)",null,null,"Wǒmen zhège gǎngwèi de yuèxīn shì liǎngqiānwàn dùn.",null,"BODY856"],["HS: 谢谢。请问这个岗位的薪资范围是多少？除了月薪还有哪些福利？ (Cảm ơn. Xin hỏi khung lương vị trí này bao nhiêu? Ngoài lương tháng còn phúc lợi gì?)",null,null,"Xièxie. Qǐngwèn zhège gǎngwèi de xīnzī fànwéi shì duōshǎo? Chúle yuèxīn háiyǒu nǎxiē fúlì?",null,"BODY857"],["GV: 范围是一千八百万到两千三百万，有年终奖和保险。 (Khung từ 18 đến 23 triệu, có thưởng cuối năm và bảo hiểm.)",null,null,"Fànwéi shì yīqiānbābǎi wàn dào liǎngqiān sānbǎiwàn, yǒu niánzhōngjiǎng hé bǎoxiǎn.",null,"BODY858"],["HS: 我有五年的相关经验，中文HSK5，上一份工作帮公司开发了二十个中国客户。我的期望是两千五百万左右。 (Tôi có 5 năm kinh nghiệm liên quan, tiếng Trung HSK5, công việc trước giúp công ty phát triển 20 khách TQ. Kỳ vọng của tôi khoảng 25 triệu.)",null,null,"Wǒ yǒu wǔnián de xiāngguān jīngyàn, Zhōngwén HSK5, shàng yīfèn gōngzuò bāng gōngsī kāifā le èrshígè Zhōngguó kèhù. Wǒ de qīwàng shì liǎngqiānwǔbǎi wànzuǒyòu.",null,"BODY859"],["GV: 两千五百万超出了我们的范围。 (25 triệu vượt khung của chúng tôi.)",null,null,"Liǎngqiānwǔbǎi wàn chāochū le wǒmen de fànwéi.",null,"BODY860"],["HS: 我理解。那能不能按范围的最高，两千三百万？我相信我能很快给公司带来业绩。 (Tôi hiểu. Vậy theo mức cao nhất của khung, 23 triệu được không? Tôi tin mình sẽ nhanh chóng mang lại thành tích cho công ty.)",null,null,"Wǒ lǐjiě. Nà néng bùnéng àn fànwéi de zuìgāo, liǎngqiān sānbǎiwàn? Wǒ xiāngxìn wǒ néng hěnkuài gěi gōngsī dàilái yèjì.",null,"BODY861"],["GV (biến cố): 两千两百万，这是我们最后的数字了。 (22 triệu, đây là con số cuối cùng của chúng tôi.)",null,null,"Liǎngqiānliǎng bǎiwàn, zhè shì wǒmen zuìhòu de shùzì le.",null,"BODY862"],["HS: 好的，我尊重公司的决定。如果月薪是两千两百万的话，我希望能在其他方面灵活一点：比如试用期按全额发，或者半年以后根据业绩调整一次薪资，您看可以吗？ (Vâng, tôi tôn trọng quyết định của công ty. Nếu lương 22 triệu, mong linh hoạt ở mặt khác: như thử việc trả đủ lương, hoặc sau nửa năm điều chỉnh lương theo thành tích, chị thấy được không?)",null,null,"Hǎo de, wǒ zūnzhòng gōngsī de juédìng. Rúguǒ yuèxīn shì liǎngqiānliǎng bǎiwàn dehuà, wǒ xīwàng néng zài qítā fāngmiàn línghuó yīdiǎn: bǐrú shìyòngqī àn quán'é fā, huòzhě bànnián yǐhòu gēnjù yèjì tiáozhěng yīcì xīnzī, nín kàn kěyǐ ma?",null,"BODY863"],["GV: 半年调整一次可以，试用期还是按百分之八十五。 (Điều chỉnh sau nửa năm thì được, thử việc vẫn 85%.)",null,null,"Bànnián tiáozhěng yīcì kěyǐ, shìyòngqī háishì àn bǎifēnzhībāshíwǔ.",null,"BODY864"],["HS: 好，那我接受。麻烦您把这些条件写在录用通知里。 (Được, vậy tôi đồng ý. Phiền chị ghi các điều kiện này vào thư mời nhận việc.)",null,null,"Hǎo, nà wǒ jiēshòu. Máfan nín bǎ zhèxiē tiáojiàn xiě zài lùyòng tōngzhī lǐ.",null,"BODY865"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY866-C"],["✗ 我想要更多钱。 (thô, thiếu chuyên nghiệp) → ✓ 我希望薪资能调整到市场的水平。",null,null,"Wǒ xiǎngyào gèng duō qián. | Wǒ xīwàng xīnzī néng tiáozhěng dào shìchǎng de shuǐpíng.",null,"BODY867"],["✗ 我跳槽了三次。 → ✓ 我跳了三次槽。/ 我换过三次工作。 (跳槽 là động từ ly hợp.)",null,null,"Wǒ tiàocáo le sāncì. | Wǒ tiào le sāncì cáo. / | Wǒ huàn guò sāncì gōngzuò. | Tiàocáo",null,"BODY868"],["✗ 我辞职公司。 → ✓ 我从公司辞职了。/ 我向公司提出了辞职。",null,null,"Wǒ cízhí gōngsī. | Wǒ cóng gōngsī cízhí le. / | Wǒ xiàng gōngsī tíchū le cízhí.",null,"BODY869"],["✗ 我的工资是很低。 → ✓ 我的工资比较低。",null,null,"Wǒ de gōngzī shì hěn dī. | Wǒ de gōngzī bǐjiào dī.",null,"BODY870"],["✗ 我要升职经理。 → ✓ 我希望升为经理。/ 我想晋升为经理。",null,null,"Wǒ yào shēngzhí jīnglǐ. | Wǒ xīwàng shēngwéi jīnglǐ. / | Wǒ xiǎng jìnshēngwéi jīnglǐ.",null,"BODY871"],["✗ 公司对我很好，但是我要走。 (cộc) → ✓ 我很感谢公司的培养，不过因为……，我决定……",null,null,"Gōngsī duì wǒ hěn hǎo, dànshì wǒ yào zǒu. | Wǒ hěn gǎnxiè gōngsī de péiyǎng, bùguò yīnwèi……, wǒ juédìng……",null,"BODY872"],["Lưu ý văn hóa: khi nói về lương với người TQ, nên nói 月薪 (lương tháng) hay 年薪 (lương năm) cho rõ; 13薪 = lương tháng 13; 税前/税后 = trước thuế/sau thuế.",null,null,"Yuèxīn | Niánxīn | 13 xīn | Shuìqián / shuìhòu",null,"BODY873"],["Phát âm: 跳槽 tiàocáo; 待遇 dàiyù; 薪资 xīnzī; 晋升 jìnshēng; 猎头 liètóu.",null,null,"Tiàocáo | Dàiyù | Xīnzī | Jìnshēng | Liètóu",null,"BODY874"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY875-C"],["Ghi âm lời thương lượng lương 3 phút (tự đóng 2 vai) theo 4 bước: hỏi khung lương → chứng minh giá trị bằng số liệu → đưa kỳ vọng → linh hoạt bàn tổng đãi ngộ.",null,null,null,null,"BODY876"],["HSK4: thay bằng bài nói 2 phút \"Công việc lý tưởng và kế hoạch 3 năm của tôi\".",null,null,null,null,"BODY877"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY878"],["Buổi 16 — 工作压力与冲突处理 Áp lực và mâu thuẫn",null,null,"Gōngzuò yālì yǔ chōngtū chǔlǐ",null,"BODY1-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY2-C"],["HSK4: Mô tả áp lực công việc và cách giải tỏa; xin hỗ trợ khi quá tải. HSK5: Hòa giải xung đột liên phòng ban, dẫn dắt hai bên đến thỏa hiệp.",null,null,null,null,"BODY3"],["Khung hòa giải mâu thuẫn 4 bước: ① 冷静 Làm dịu cảm xúc → ② 了解事实 Làm rõ sự thật → ③ 找共同目标 Tìm mục tiêu chung → ④ 妥协方案 Đưa phương án thỏa hiệp.",null,null,"Lěngjìng | Liǎojiě shìshí | Zhǎo gòngtóng mùbiāo | Tuǒxié fāng'àn",null,"BODY4"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY5-C"],["1. Hỏi: 你最近工作压力大吗？主要是什么压力？ (Gần đây bạn áp lực công việc lớn không? Chủ yếu là áp lực gì?)",null,null,"Nǐ zuìjìn gōngzuò yālì dà ma? Zhǔyào shì shénme yālì?",null,"BODY6"],["Đáp: 挺大的。年底了，每个客户都在催货，我每天晚上都要加班到九点。 (Khá lớn. Cuối năm rồi, khách nào cũng giục hàng, tối nào tôi cũng tăng ca đến 9h.)",null,null,"Tǐng dà de. Niándǐ le, měigè kèhù dōu zài cuī huò, wǒ měitiānwǎnshàng dōu yào jiābān dào jiǔdiǎn.",null,"BODY7"],["2. Hỏi: 压力大的时候，你一般怎么放松？ (Khi áp lực lớn, bạn thường thư giãn thế nào?)",null,null,"Yālì dà de shíhou, nǐ yībān zěnme fàngsōng?",null,"BODY8"],["Đáp: 我会去跑步，或者跟朋友出去吃顿饭，聊聊天，第二天心情就好多了。 (Tôi đi chạy bộ, hoặc đi ăn với bạn, nói chuyện, hôm sau tâm trạng tốt hơn nhiều.)",null,null,"Wǒhuì qù pǎobù, huòzhě gēn péngyou chūqù chī dùnfàn, liáoliaotiān, dì'èrtiān xīnqíng jiù hǎoduō le.",null,"BODY9"],["3. Hỏi: 你跟同事吵过架吗？后来怎么解决的？ (Bạn từng cãi nhau với đồng nghiệp chưa? Sau đó giải quyết thế nào?)",null,null,"Nǐ gēn tóngshì chǎoguò jià ma? Hòulái zěnme jiějué de?",null,"BODY10"],["Đáp: 吵过一次，因为一个订单的问题。后来我们找经理一起开了个会，把事情说清楚就好了。 (Cãi một lần vì chuyện một đơn hàng. Sau đó cùng giám đốc họp một buổi, nói rõ mọi chuyện là ổn.)",null,null,"Chǎoguò yīcì, yīnwèi yīgè dìngdān de wèntí. Hòulái wǒmen zhǎo jīnglǐ yīqǐ kāilegè huì, bǎ shìqing shuō qīngchu jiù hǎo le.",null,"BODY11"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY12-C"],["1. 压力 (áp lực): 这个月的销售目标太高了，大家压力都很大。 (Chỉ tiêu tháng này quá cao, ai cũng áp lực.)",null,null,"Yālì | Zhège yuè de xiāoshòu mùbiāo tài gāo le, dàjiā yālì dōu hěndà.",null,"BODY13"],["2. 焦虑 (lo âu, bồn chồn): 一想到明天要跟老板汇报，我就很焦虑。 (Cứ nghĩ đến mai phải báo cáo sếp là tôi lo lắng.)",null,null,"Jiāolǜ | Yī xiǎngdào míngtiān yào gēn lǎobǎn huìbào, wǒ jiù hěn jiāolǜ.",null,"BODY14"],["3. 推卸责任 (đùn đẩy trách nhiệm): 出了问题，大家不要互相推卸责任。 (Có chuyện thì mọi người đừng đùn đẩy trách nhiệm.)",null,null,"Tuīxièzérèn | Chū le wèntí, dàjiā bùyào hùxiāng tuīxièzérèn.",null,"BODY15"],["4. 情绪 (cảm xúc, tâm trạng): 开会的时候要控制好自己的情绪。 (Lúc họp phải kiểm soát tốt cảm xúc của mình.)",null,null,"Qíngxù | Kāihuì de shíhou yào kòngzhì hǎo zìjǐ de qíngxù.",null,"BODY16"],["5. 协调 (điều phối, dàn xếp): 这件事需要经理出面协调。 (Việc này cần giám đốc đứng ra dàn xếp.)",null,null,"Xiétiáo | Zhèjiàn shì xūyào jīnglǐ chūmiàn xiétiáo.",null,"BODY17"],["6. 妥协 (thỏa hiệp): 双方各让一步，最后达成了妥协。 (Hai bên mỗi bên lùi một bước, cuối cùng thỏa hiệp được.)",null,null,"Tuǒxié | Shuāngfāng gè ràng yībù, zuìhòu dáchéng le tuǒxié.",null,"BODY18"],["7. 难处 (cái khó, khó khăn riêng): 每个部门都有自己的难处。 (Phòng nào cũng có cái khó riêng.)",null,null,"Nánchù | Měigè bùmén dōu yǒu zìjǐ de nánchù.",null,"BODY19"],["8. 忙不过来 (bận không xuể): 最近订单太多，我一个人忙不过来。 (Gần đây đơn quá nhiều, một mình tôi làm không xuể.)",null,null,"Mángbùguòlái | Zuìjìn dìngdān tài duō, wǒ yīgè rén mángbùguòlái.",null,"BODY20"],["9. 发脾气 (nổi nóng): 他压力一大就容易发脾气。 (Anh ấy hễ áp lực là dễ nổi nóng.)",null,null,"Fāpíqì | Tā yālì yīdà jiù róngyì fāpíqì.",null,"BODY21"],["10. 误会 (hiểu lầm): 我们之间可能有点误会，坐下来谈谈吧。 (Giữa chúng ta có lẽ có hiểu lầm, ngồi xuống nói chuyện nhé.)",null,null,"Wùhuì | Wǒmen zhījiān kěnéng yǒudiǎn wùhuì, zuòxià lái tántán ba.",null,"BODY22"],["11. 换位思考 (đặt mình vào vị trí người khác): 如果大家都能换位思考，矛盾就会少很多。 (Nếu ai cũng biết đặt mình vào vị trí người khác, mâu thuẫn sẽ ít đi nhiều.)",null,null,"Huànwèi sīkǎo | Rúguǒ dàjiā dōu néng huànwèi sīkǎo, máodùn jiù huì shǎo hěnduō.",null,"BODY23"],["12. 就事论事 (bàn đúng vào việc, không công kích cá nhân): 我们就事论事，不要说别的。 (Chúng ta bàn đúng việc, đừng nói chuyện khác.)",null,null,"Jiùshìlùnshì | Wǒmen jiùshìlùnshì, bùyào shuō biéde.",null,"BODY24"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY25-C"],["1. 我理解你的难处，不过…… (Tôi hiểu cái khó của bạn, nhưng …)",null,null,"Wǒ lǐjiě nǐ de nánchù, bùguò……",null,"BODY26"],["Ví dụ: 我理解你的难处，不过客户明天就要货，我们必须想办法。 (Tôi hiểu cái khó của bạn, nhưng mai khách cần hàng, chúng ta phải nghĩ cách.)",null,null,"Wǒ lǐjiě nǐ de nánchù, bùguò kèhù míngtiān jiùyào huò, wǒmen bìxū xiǎng bànfǎ.",null,"BODY27"],["Ví dụ: 我理解你的难处，不过这个流程是公司规定的，不能跳过。 (Tôi hiểu cái khó của bạn, nhưng quy trình này công ty quy định, không bỏ qua được.)",null,null,"Wǒ lǐjiě nǐ de nánchù, bùguò zhège liúchéng shì gōngsī guīdìng de, bùnéng tiào guò.",null,"BODY28"],["2. 与其……，不如…… (Thay vì …, chi bằng …)",null,null,"Yǔqí……, bùrú……",null,"BODY29"],["Ví dụ: 与其在这里争谁对谁错，不如先把问题解决了。 (Thay vì tranh ai đúng ai sai, chi bằng giải quyết vấn đề trước.)",null,null,"Yǔqí zài zhèlǐ zhēng shuí duì shuícuò, bùrú xiān bǎ wèntí jiějué le.",null,"BODY30"],["Ví dụ: 与其一个人扛着，不如跟经理说清楚，请他多派一个人。 (Thay vì một mình gánh, chi bằng nói rõ với giám đốc, xin thêm một người.)",null,null,"Yǔqí yīgè rén kángzhe, bùrú gēn jīnglǐ shuō qīngchu, qǐng tā duōpài yīgè rén.",null,"BODY31"],["3. 最近……压力特别大，主要是因为…… (Gần đây … áp lực đặc biệt lớn, chủ yếu vì …)",null,null,"Zuìjìn…… yālì tèbié dà, zhǔyào shìyīnwèi……",null,"BODY32"],["Ví dụ: 最近工作压力特别大，主要是因为同时负责三个项目。 (Gần đây áp lực công việc rất lớn, chủ yếu vì phụ trách 3 dự án cùng lúc.)",null,null,"Zuìjìn gōngzuò yālì tèbié dà, zhǔyào shìyīnwèi tóngshí fùzé sāngè xiàngmù.",null,"BODY33"],["Ví dụ: 最近我们部门压力特别大，主要是因为走了两个老员工。 (Gần đây phòng tôi áp lực rất lớn, chủ yếu vì nghỉ mất 2 nhân viên lâu năm.)",null,null,"Zuìjìn wǒmen bùmén yālì tèbié dà, zhǔyào shìyīnwèi zǒu le liǎnggè lǎo yuángōng.",null,"BODY34"],["4. 一……就…… (Hễ … là …)",null,null,"Yī…… jiù……",null,"BODY35"],["Ví dụ: 我一压力大就睡不着觉。 (Tôi hễ áp lực là mất ngủ.)",null,null,"Wǒ yī yālì dà jiù shuìbùzhe jué.",null,"BODY36"],["Ví dụ: 他一听到\"加班\"两个字就头疼。 (Anh ấy hễ nghe hai chữ \"tăng ca\" là đau đầu.)",null,null,"Tā yī tīngdào \"jiābān\" liǎnggè zì jiù tóuténg.",null,"BODY37"],["5. 先别急，我们先把……弄清楚 (Đừng vội, chúng ta làm rõ … trước)",null,null,"Xiān biéjí, wǒmen xiān bǎ…… nòngqīngchu",null,"BODY38"],["Ví dụ: 先别急，我们先把事情的经过弄清楚。 (Đừng vội, làm rõ diễn biến sự việc trước.)",null,null,"Xiān biéjí, wǒmen xiān bǎ shìqing de jīngguò nòngqīngchu.",null,"BODY39"],["Ví dụ: 先别急，我们先把数据弄清楚，再看是谁的问题。 (Đừng vội, làm rõ số liệu trước rồi xem lỗi ở ai.)",null,null,"Xiān biéjí, wǒmen xiān bǎ shùjù nòngqīngchu, zài kàn shì shéi de wèntí.",null,"BODY40"],["6. 我们的目标是一样的，都是…… (Mục tiêu của chúng ta là giống nhau, đều là …)",null,null,"Wǒmen de mùbiāo shì yīyàng de, dōu shì……",null,"BODY41"],["Ví dụ: 我们的目标是一样的，都是让客户按时收到合格的产品。 (Mục tiêu giống nhau, đều là để khách nhận hàng đạt chuẩn đúng hạn.)",null,null,"Wǒmen de mùbiāo shì yīyàng de, dōu shì ràng kèhù ànshí shōudào hégé de chǎnpǐn.",null,"BODY42"],["Ví dụ: 我们的目标是一样的，都是希望公司的成本降下来。 (Mục tiêu giống nhau, đều mong chi phí công ty giảm xuống.)",null,null,"Wǒmen de mùbiāo shì yīyàng de, dōu shì xīwàng gōngsī de chéngběn jiàngxiàlái.",null,"BODY43"],["7. 能不能各让一步：……，…… (Có thể mỗi bên lùi một bước không: …, …)",null,null,"Néng bùnéng gè ràng yībù:……,……",null,"BODY44"],["Ví dụ: 能不能各让一步：采购部提前三天下单，生产部把交期缩短两天？ (Mỗi bên lùi một bước được không: mua hàng đặt sớm 3 ngày, sản xuất rút ngắn thời gian giao 2 ngày?)",null,null,"Néng bùnéng gè ràng yībù: cǎigòubù tíqián sāntiān xiàdān, shēngchǎn bù bǎ jiāo qī suōduǎn liǎngtiān?",null,"BODY45"],["Ví dụ: 能不能各让一步：这个月你们先加班，下个月公司给你们多放两天假？ (Mỗi bên lùi một bước: tháng này các bạn tăng ca trước, tháng sau công ty cho nghỉ thêm 2 ngày?)",null,null,"Néng bùnéng gè ràng yībù: zhège yuè nǐmen xiān jiābān, xiàgèyuè gōngsī gěi nǐmen duō fàng liǎngtiān jià?",null,"BODY46"],["8. 说实话，我现在真的有点…… (Nói thật, giờ tôi thật sự hơi …)",null,null,"Shuōshíhuà, wǒ xiànzài zhēnde yǒudiǎn……",null,"BODY47"],["Ví dụ: 说实话，我现在真的有点忙不过来了。 (Nói thật, giờ tôi thật sự hơi quá tải.)",null,null,"Shuōshíhuà, wǒ xiànzài zhēnde yǒudiǎn mángbùguòlái le.",null,"BODY48"],["Ví dụ: 说实话，我现在真的有点累，想休息几天。 (Nói thật, giờ tôi hơi mệt, muốn nghỉ vài ngày.)",null,null,"Shuōshíhuà, wǒ xiànzài zhēnde yǒudiǎnlèi, xiǎng xiūxi jǐtiān.",null,"BODY49"],["9. (HSK5) 不管是谁的责任，现在最重要的是…… (Dù là trách nhiệm của ai, quan trọng nhất bây giờ là …)",null,null,"Bùguǎnshìshéi de zérèn, xiànzài zuì zhòngyào de shì……",null,"BODY50"],["Ví dụ: 不管是谁的责任，现在最重要的是先给客户一个交代。 (Dù trách nhiệm của ai, quan trọng nhất là có lời giải thích với khách trước.)",null,null,"Bùguǎnshìshéi de zérèn, xiànzài zuì zhòngyào de shì xiān gěi kèhù yīgè jiāodài.",null,"BODY51"],["Ví dụ: 不管是谁的责任，现在最重要的是保证下周的货能按时发出去。 (Dù lỗi ai, quan trọng nhất là đảm bảo hàng tuần sau giao đúng hạn.)",null,null,"Bùguǎnshìshéi de zérèn, xiànzài zuì zhòngyào de shì bǎozhèng xiàzhōu de huò néng ànshí fāchū qù.",null,"BODY52"],["10. (HSK5) 这件事双方都有一定的责任：一方面……，另一方面…… (Việc này hai bên đều có trách nhiệm nhất định: một mặt …, mặt khác …)",null,null,"Zhèjiàn shì shuāngfāng dōu yǒu yīdìng de zérèn: yīfāngmiàn……, lìngyīfāngmiàn……",null,"BODY53"],["Ví dụ: 这件事双方都有一定的责任：一方面采购没有及时更新规格，另一方面技术部也没有确认图纸。 (Hai bên đều có trách nhiệm: một mặt mua hàng không cập nhật quy cách kịp thời, mặt khác kỹ thuật cũng không xác nhận bản vẽ.)",null,null,"Zhèjiàn shì shuāngfāng dōu yǒu yīdìng de zérèn: yīfāngmiàn cǎigòu méiyǒu jíshí gèngxīn guīgé, lìngyīfāngmiàn jìshùbù yě méiyǒu quèrèn túzhǐ.",null,"BODY54"],["情景对话 1 — Tâm sự với đồng nghiệp về áp lực công việc (HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY55-C"],["阿玲: 小芳，你最近怎么了？看起来特别累。 (Tiểu Phương, dạo này sao vậy? Trông bạn mệt lắm.)",null,null,"Ā Líng: Xiǎo Fāng, nǐ zuìjìn zěnme le? Kànqǐlái tèbié lèi.",null,"BODY56"],["小芳: 别提了，最近工作压力特别大，每天晚上都睡不好。 (Đừng nhắc nữa, dạo này áp lực công việc cực lớn, tối nào cũng ngủ không ngon.)",null,null,"Xiǎo Fāng: biétí le, zuìjìn gōngzuò yālì tèbié dà, měitiānwǎnshàng dōu shuì bùhǎo.",null,"BODY57"],["阿玲: 是因为年底的订单吗？ (Vì đơn hàng cuối năm à?)",null,null,"Ā Líng: shìyīnwèi niándǐ de dìngdān ma?",null,"BODY58"],["小芳: 对，一方面订单多，另一方面我们部门走了一个人，他的工作都交给我了。 (Đúng, một mặt đơn nhiều, mặt khác phòng mình nghỉ một người, việc của anh ấy giao hết cho mình.)",null,null,"Xiǎo Fāng: duì, yīfāngmiàn dìngdān duō, lìngyīfāngmiàn wǒmen bùmén zǒu le yīgè rén, tā de gōngzuò dōu jiāogěi wǒ le.",null,"BODY59"],["阿玲: 那你一个人做两个人的工作？ (Vậy bạn một mình làm việc của hai người?)",null,null,"Ā Líng: nà nǐ yīgè rén zuò liǎnggè rén de gōngzuò?",null,"BODY60"],["小芳: 是啊，我一想到明天还有十几封邮件没回，就很焦虑。 (Đúng vậy, cứ nghĩ mai còn hơn chục email chưa trả lời là bồn chồn.)",null,null,"Xiǎo Fāng: shì a, wǒ yī xiǎngdào míngtiān háiyǒu shíjǐfēng yóujiàn méi huí, jiù hěn jiāolǜ.",null,"BODY61"],["阿玲: 你跟经理说过吗？ (Bạn đã nói với giám đốc chưa?)",null,null,"Ā Líng: nǐ gēn jīnglǐ shuō guò ma?",null,"BODY62"],["小芳: 还没有。我怕经理觉得我能力不够。 (Chưa. Mình sợ giám đốc nghĩ mình năng lực kém.)",null,null,"Xiǎo Fāng: hái méiyǒu. Wǒ pà jīnglǐ juéde wǒ nénglì bùgòu.",null,"BODY63"],["阿玲: 与其一个人扛着，不如跟经理说清楚。你可以把手上的工作列出来，让他看看工作量有多大。 (Thay vì một mình gánh, chi bằng nói rõ với giám đốc. Bạn có thể liệt kê việc trong tay, để anh ấy thấy khối lượng lớn thế nào.)",null,null,"Ā Líng: yǔqí yīgè rén kángzhe, bùrú gēn jīnglǐ shuō qīngchu. Nǐ kěyǐ bǎ shǒushàng de gōngzuò lièchūlái, ràng tā kànkan gōngzuòliàng yǒu duō dà.",null,"BODY64"],["小芳: 你说得有道理。 (Bạn nói có lý.)",null,null,"Xiǎo Fāng: nǐ shuō de yǒu dàolǐ.",null,"BODY65"],["阿玲: 而且你也要注意身体。下班以后别再看工作群了，周末出去走走。 (Mà bạn cũng phải chú ý sức khỏe. Tan làm đừng xem nhóm công việc nữa, cuối tuần ra ngoài đi dạo.)",null,null,"Ā Líng: érqiě nǐ yě yào zhùyì shēntǐ. Xiàbān yǐhòu bié zài kàn gōngzuò qún le, zhōumò chūqù zǒuzou.",null,"BODY66"],["小芳: 我以前每周都去游泳，最近三个星期都没去了。 (Trước mình tuần nào cũng đi bơi, ba tuần nay không đi rồi.)",null,null,"Xiǎo Fāng: wǒ yǐqián měizhōu dōu qù yóuyǒng, zuìjìn sāngè xīngqī dōu méi qù le.",null,"BODY67"],["阿玲: 那这个周末我陪你去吧，游完我们去喝杯咖啡。 (Vậy cuối tuần này mình đi cùng bạn, bơi xong đi uống cà phê.)",null,null,"Ā Líng: nà zhège zhōumò wǒ péinǐqù ba, yóu wán wǒmen qù
