ull,"Sījī: láidejí, fàngxīn ba. Nín shì guónèi hángbān háishì guójìhángbān?",null,"BODY316"],["乘客: 国际航班，去广州，在二号航站楼。 (Quốc tế, đi Quảng Châu, ở nhà ga T2.)",null,null,"Chéngkè: guójìhángbān, qù Guǎngzhōu, zài èrhào hángzhànlóu.",null,"BODY317"],["司机: 好的。您的行李放后备箱吧。 (Được. Hành lý để cốp sau nhé.)",null,null,"Sījī: hǎo de. Nín de xíngli fàng hòubèixiāng ba.",null,"BODY318"],["乘客: 前面好像堵车了，能不能走别的路？ (Phía trước hình như tắc, đi đường khác được không?)",null,null,"Chéngkè: qiánmiàn hǎoxiàng dǔchē le, néng bùnéng zǒu biéde lù?",null,"BODY319"],["司机: 可以，我们走高架，稍微远一点，但是快。 (Được, mình đi đường trên cao, xa hơn chút nhưng nhanh.)",null,null,"Sījī: kěyǐ, wǒmen zǒu gāojià, shāowēi yuǎn yīdiǎn, dànshì kuài.",null,"BODY320"],["乘客: 好，麻烦了。到了大概多少钱？ (Được, phiền bác. Đến nơi khoảng bao nhiêu tiền?)",null,null,"Chéngkè: hǎo, máfan le. Dào le dàgài duōshǎo qián?",null,"BODY321"],["司机: 打表的话大概三十五万盾，加上过路费。 (Tính đồng hồ khoảng 350 nghìn, cộng phí cầu đường.)",null,null,"Sījī: dǎ biǎo dehuà dàgài sānshíwǔwàn dùn, jiāshàng guòlùfèi.",null,"BODY322"],["乘客: 在出发层门口停一下就行。可以转账吗？ (Dừng ở cửa tầng khởi hành là được. Chuyển khoản được không?)",null,null,"Chéngkè: zài chūfā céng ménkǒu tíng yīxià jiù xíng. Kěyǐ zhuǎnzhàng ma?",null,"BODY323"],["司机: 可以，扫这个码。祝您一路顺风！ (Được, quét mã này. Chúc thượng lộ bình an!)",null,null,"Sījī: kěyǐ, sǎo zhège mǎ. Zhùnín yīlùshùnfēng!",null,"BODY324"],["情景对话 6 — Kể lịch trình một ngày (đồng nghiệp hỏi chuyện)",null,null,"Qíngjǐng duìhuà",null,"BODY325-C"],["A: 你每天看起来都很有精神，你一般几点起床？ (Ngày nào trông bạn cũng tỉnh táo, bạn thường dậy mấy giờ?)",null,null,"Nǐ měitiān kànqǐlái dōu hěn yǒu jīngshén, nǐ yībān jǐdiǎn qǐchuáng?",null,"BODY326"],["B: 我平时六点就起床了，先跑步二十分钟，然后吃早饭。 (Thường 6h tôi đã dậy, chạy bộ 20 phút rồi ăn sáng.)",null,null,"Wǒ píngshí liùdiǎn jiù qǐchuáng le, xiān pǎobù èrshífēnzhōng, ránhòu chī zǎofàn.",null,"BODY327"],["A: 这么早！那你几点出门？ (Sớm thế! Thế mấy giờ bạn ra khỏi nhà?)",null,null,"Zhème zǎo! Nà nǐ jǐdiǎn chūmén?",null,"BODY328"],["B: 七点半出门，骑摩托车来公司，路上大概半个小时。一下雨就要一个小时。 (7h30 ra khỏi nhà, đi xe máy đến công ty, khoảng nửa tiếng. Hễ mưa là mất một tiếng.)",null,null,"Qīdiǎn bàn chūmén, qí mótuōchē lái gōngsī, lùshàng dàgài bàngè xiǎoshí. Yī xiàyǔ jiùyào yīgè xiǎoshí.",null,"BODY329"],["A: 到了公司你一般先做什么？ (Đến công ty bạn thường làm gì trước?)",null,null,"Dào le gōngsī nǐ yībān xiān zuò shénme?",null,"BODY330"],["B: 我一到公司就先看邮件，回复客户的问题，九点开晨会。 (Vừa đến là tôi xem email, trả lời khách, 9h họp đầu ngày.)",null,null,"Wǒ yī dào gōngsī jiù xiān kàn yóujiàn, huífù kèhù de wèntí, jiǔdiǎn kāi chénhuì.",null,"BODY331"],["A: 中午你在哪儿吃饭？ (Trưa bạn ăn ở đâu?)",null,null,"Zhōngwǔ nǐ zài nǎr chīfàn?",null,"BODY332"],["B: 我偶尔跟同事出去吃，大部分时间自己带饭，吃完午睡二十分钟。 (Thỉnh thoảng ăn ngoài với đồng nghiệp, phần lớn mang cơm, ăn xong ngủ trưa 20 phút.)",null,null,"Wǒ ǒu'ěr gēn tóngshì chūqù chī, dàbùfen shíjiān zìjǐ dàifàn, chī wán wǔshuì èrshífēnzhōng.",null,"BODY333"],["A: 下午呢？ (Còn buổi chiều?)",null,null,"Xiàwǔ ne?",null,"BODY334"],["B: 下午不是跟供应商打电话，就是跟进订单，有时候还要去仓库看货。 (Chiều không gọi cho NCC thì theo dõi đơn, có khi còn xuống kho xem hàng.)",null,null,"Xiàwǔ bùshì gēn gōngyìngshāng dǎdiànhuà, jiùshì gēnjìn dìngdān, yǒushíhou háiyào qù cāngkù kànhuò.",null,"BODY335"],["A: 你几点下班？晚上做什么？ (Mấy giờ bạn tan làm? Tối làm gì?)",null,null,"Nǐ jǐdiǎn xiàbān? Wǎnshàng zuò shénme?",null,"BODY336"],["B: 五点半下班。如果不加班，我会先去超市买菜，然后回家做饭，晚上八点到九点学中文。 (5h30 tan làm. Không tăng ca thì đi siêu thị mua đồ, về nấu cơm, tối 8–9h học tiếng Trung.)",null,null,"Wǔdiǎn bàn xiàbān. Rúguǒ bù jiābān, wǒhuì xiān qù chāoshì mǎicài, ránhòu huíjiā zuòfàn, wǎnshàng bādiǎn dào jiǔdiǎn xué Zhōngwén.",null,"BODY337"],["A: 你的生活真有规律！我就不行了，每天晚上都刷手机到一点。 (Cuộc sống của bạn thật điều độ! Tôi thì chịu, tối nào cũng lướt điện thoại đến 1h.)",null,null,"Nǐ de shēnghuó zhēn yǒu guīlǜ! Wǒ jiù bùxíng le, měitiānwǎnshàng dōu shuā shǒujī dào yīdiǎn.",null,"BODY338"],["B: 我以前也是，后来发现早睡早起精神好多了，你也试试吧！ (Trước tôi cũng vậy, sau thấy ngủ sớm dậy sớm tỉnh táo hơn nhiều, bạn thử xem!)",null,null,"Wǒ yǐqián yě shì, hòulái fāxiàn zǎoshuìzǎoqǐ jīngshén hǎoduō le, nǐ yě shìshi ba!",null,"BODY339"],["情景对话 7 — Hẹn và đổi lịch hẹn 约时间 / 改时间",null,null,"Qíngjǐng duìhuà | Yuē shíjiān | Gǎi shíjiān",null,"BODY340-C"],["A: 李经理，您好！我想跟您约个时间，聊一下新产品的报价。 (Chào giám đốc Lý! Tôi muốn hẹn ngài một buổi bàn về báo giá sản phẩm mới.)",null,null,"Lǐ jīnglǐ, nínhǎo! Wǒ xiǎng gēn nín yuē gè shíjiān, liáo yīxià xīn chǎnpǐn de bàojià.",null,"BODY341"],["B: 好啊，你这周什么时候方便？ (Được, tuần này khi nào anh tiện?)",null,null,"Hǎo a, nǐ zhè zhōu shénme shíhou fāngbiàn?",null,"BODY342"],["A: 周三下午三点可以吗？我去您公司。 (Chiều thứ 4 lúc 3h được không? Tôi đến công ty ngài.)",null,null,"Zhōusān xiàwǔ sāndiǎn kěyǐ ma? Wǒ qù nín gōngsī.",null,"BODY343"],["B: 周三下午我要开会，要不改到周四上午吧？ (Chiều thứ 4 tôi họp, hay đổi sang sáng thứ 5 nhé?)",null,null,"Zhōusān xiàwǔ wǒ yào kāihuì, yào bù gǎi dào zhōusì shàngwǔ ba?",null,"BODY344"],["A: 周四上午我也可以。那就十点，怎么样？ (Sáng thứ 5 tôi cũng được. Vậy 10h nhé, được không?)",null,null,"Zhōusì shàngwǔ wǒ yě kěyǐ. Nà jiù shídiǎn, zěnmeyàng?",null,"BODY345"],["B: 行，那就这么定了，周四上午十点。 (Được, chốt vậy, 10h sáng thứ 5.)",null,null,"Xíng, nà jiù zhème dìng le, zhōusì shàngwǔ shídiǎn.",null,"BODY346"],["A: (thứ 4 gọi lại) 李经理，真不好意思，明天上午我们老板临时安排我去海防工厂，能不能再改个时间？ (Giám đốc Lý, thật ngại quá, sáng mai sếp đột xuất cử tôi đi nhà máy Hải Phòng, đổi giờ thêm lần nữa được không?)",null,null,"Lǐ jīnglǐ, zhēn bùhǎoyìsi, míngtiān shàngwǔ wǒmen lǎobǎn línshí ānpái wǒ qù Hǎifáng gōngchǎng, néng bùnéng zài gǎi gè shíjiān?",null,"BODY347"],["B: 没关系，那你什么时候回来？ (Không sao, thế khi nào anh về?)",null,null,"Méiguānxi, nà nǐ shénme shíhou huílái?",null,"BODY348"],["A: 我明天晚上就回来。周五下午两点以后我都有空，您看呢？ (Tối mai tôi về. Chiều thứ 6 sau 2h tôi đều rảnh, ngài thấy sao?)",null,null,"Wǒ míngtiān wǎnshàng jiù huílái. Zhōuwǔ xiàwǔ liǎngdiǎn yǐhòu wǒ dōu yǒukòng, nín kàn ne?",null,"BODY349"],["B: 周五下午两点到四点我一直在开会，四点以后可以。 (Chiều thứ 6 từ 2h đến 4h tôi họp liên tục, sau 4h thì được.)",null,null,"Zhōuwǔ xiàwǔ liǎngdiǎn dào sìdiǎn wǒ yīzhí zài kāihuì, sìdiǎn yǐhòu kěyǐ.",null,"BODY350"],["A: 那就周五下午四点半吧。万一您那边会议推迟了，我可以在楼下等。 (Vậy 4h30 chiều thứ 6. Lỡ cuộc họp bên ngài kéo dài, tôi có thể đợi dưới sảnh.)",null,null,"Nà jiù zhōuwǔ xiàwǔ sìdiǎn bàn ba. Wànyī nín nàbiān huìyì tuīchí le, wǒ kěyǐ zài lóuxià děng.",null,"BODY351"],["B: 好的。你把资料提前发给我，我先看一下。 (Được. Anh gửi tài liệu trước cho tôi, tôi xem trước.)",null,null,"Hǎo de. Nǐ bǎ zīliào tíqián fāgěi wǒ, wǒ xiān kàn yīxià.",null,"BODY352"],["A: 没问题，我今天下班之前发到您的邮箱。给您添麻烦了！ (Không vấn đề, hôm nay trước khi tan làm tôi gửi vào email ngài. Làm phiền ngài rồi!)",null,null,"Méi wèntí, wǒ jīntiān xiàbān zhīqián fādào nín de yóuxiāng. Gěi nín tiānmáfan le!",null,"BODY353"],["B: 不麻烦，周五见。 (Không phiền, hẹn thứ 6.)",null,null,"Bù máfan, zhōuwǔ jiàn.",null,"BODY354"],["情景对话 8 — (HSK5) Hai cuộc họp trùng giờ, thương lượng ưu tiên",null,null,"Qíngjǐng duìhuà",null,"BODY355-C"],["秘书: 阮主管，明天上午十点总经理要开季度会议，您必须参加。 (Trưởng nhóm Nguyễn, 10h sáng mai tổng giám đốc họp quý, anh bắt buộc phải dự.)",null,null,"Mìshū: Ruǎn zhǔguǎn, míngtiān shàngwǔ shídiǎn zǒngjīnglǐ yào kāi jìdù huìyì, nín bìxū cānjiā.",null,"BODY356"],["阮主管: 明天十点？可是我十点已经约了中国客户来工厂验货，两个会撞了。 (10h mai? Nhưng 10h tôi đã hẹn khách TQ đến nhà máy kiểm hàng, hai cuộc trùng nhau rồi.)",null,null,"Ruǎn zhǔguǎn: míngtiān shídiǎn? Kěshì wǒ shídiǎn yǐjīng yuē le Zhōngguó kèhù lái gōngchǎng yànhuò, liǎnggè huì zhuàng le.",null,"BODY357"],["秘书: 季度会议的时间是上周就定好的，不太好改。 (Họp quý đã chốt từ tuần trước, khó đổi lắm.)",null,null,"Mìshū: jìdù huìyì de shíjiān shì shàngzhōu jiù dìng hǎo de, bùtàihǎo gǎi.",null,"BODY358"],["阮主管: 我理解。不过考虑到客户明天下午就回国了，验货只能明天上午做。 (Tôi hiểu. Nhưng xét đến việc khách chiều mai đã về nước, kiểm hàng chỉ làm được sáng mai.)",null,null,"Ruǎn zhǔguǎn: wǒ lǐjiě. Bùguò kǎolǜ dào kèhù míngtiān xiàwǔ jiù huíguó le, yànhuò zhǐnéng míngtiān shàngwǔ zuò.",null,"BODY359"],["秘书: 那您看怎么办比较好？ (Vậy anh thấy làm thế nào thì hợp lý?)",null,null,"Mìshū: nà nín kàn zěnmebàn bǐjiào hǎo?",null,"BODY360"],["阮主管: 我建议这样：我先陪客户验货，大概九点开始，十一点能结束。季度会议我的部分能不能安排在最后？ (Tôi đề nghị: tôi đi kiểm hàng với khách trước, khoảng 9h bắt đầu, 11h xong. Phần của tôi trong họp quý có thể xếp cuối không?)",null,null,"Ruǎn zhǔguǎn: wǒ jiànyì zhèyàng: wǒ xiān péi kèhù yànhuò, dàgài jiǔdiǎn kāishǐ, shíyīdiǎn néng jiéshù. Jìdù huìyì wǒ de bùfen néng bùnéng ānpái zài zuìhòu?",null,"BODY361"],["秘书: 会议是十点到十二点，您的汇报本来排在第二个。 (Họp từ 10h đến 12h, phần báo cáo của anh vốn xếp thứ hai.)",null,null,"Mìshū: huìyì shì shídiǎn dào shí'èrdiǎn, nín de huìbào běnlái pái zài dì'èrgè.",null,"BODY362"],["阮主管: 与其让大家等我，不如把我的汇报换到十一点半。前面的内容我请副主管小林替我参加，会后他再跟我同步。 (Thay vì để mọi người đợi, chi bằng chuyển phần báo cáo của tôi sang 11h30. Phần trước tôi nhờ phó nhóm Tiểu Lâm dự thay, họp xong anh ấy cập nhật lại.)",null,null,"Ruǎn zhǔguǎn: yǔqí ràng dàjiā děng wǒ, bùrú bǎ wǒ de huìbào huàn dào shíyīdiǎnbàn. Qiánmiàn de nèiróng wǒ qǐng fù zhǔguǎn Xiǎo Lín tì wǒ cānjiā, huìhòu tā zài gēn wǒ tóngbù.",null,"BODY363"],["秘书: 这个方案应该可以，我去跟总经理确认一下。 (Phương án này chắc được, tôi đi xác nhận với tổng giám đốc.)",null,null,"Mìshū: zhège fāng'àn yīnggāi kěyǐ, wǒ qù gēn zǒngjīnglǐ quèrèn yīxià.",null,"BODY364"],["阮主管: 麻烦你了。如果总经理不同意，我就请客户提前到八点半，我们抓紧时间。 (Phiền chị. Nếu tổng giám đốc không đồng ý, tôi sẽ mời khách đến sớm 8h30, tranh thủ thời gian.)",null,null,"Ruǎn zhǔguǎn: máfan nǐ le. Rúguǒ zǒngjīnglǐ bù tóngyì, wǒ jiù qǐng kèhù tíqián dào bādiǎnbàn, wǒmen zhuājǐnshíjiān.",null,"BODY365"],["秘书: (10 phút sau) 总经理同意了，您的汇报改到十一点半。 (Tổng giám đốc đồng ý rồi, báo cáo của anh dời sang 11h30.)",null,null,"Mìshū: zǒngjīnglǐ tóngyì le, nín de huìbào gǎi dào shíyīdiǎnbàn.",null,"BODY366"],["阮主管: 太好了，谢谢！我会准时到的。 (Tốt quá, cảm ơn! Tôi sẽ đến đúng giờ.)",null,null,"Ruǎn zhǔguǎn: tàihǎole, xièxie! Wǒhuì zhǔnshí dào de.",null,"BODY367"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY368-C"],["1. Hỏi: 你的工作日和周末有什么不一样？ (Ngày làm việc và cuối tuần khác nhau thế nào?)",null,null,"Nǐ de gōngzuòrì hé zhōumò yǒu shénme bù yīyàng?",null,"BODY369"],["Đáp: 工作日我每天六点起床，忙得没时间吃早饭；周末我睡到八点，然后跟家人去喝咖啡。 (Ngày thường 6h dậy, bận đến không kịp ăn sáng; cuối tuần ngủ đến 8h rồi đi cà phê với gia đình.)",null,null,"Gōngzuòrì wǒ měitiān liùdiǎn qǐchuáng, máng de méi shíjiān chī zǎofàn; zhōumò wǒ shuì dào bādiǎn, ránhòu gēn jiārén qù hēkāfēi.",null,"BODY370"],["2. Hỏi: 你一般在哪儿买菜？超市还是菜市场？为什么？ (Thường mua đồ ăn ở siêu thị hay chợ? Vì sao?)",null,null,"Nǐ yībān zài nǎr mǎicài? Chāoshì háishì càishìchǎng? Wèishénme?",null,"BODY371"],["Đáp: 我一般去菜市场，因为菜更新鲜，还可以讲价；不过日用品我会在超市买。 (Thường đi chợ vì rau tươi hơn, còn mặc cả được; đồ dùng thì mua ở siêu thị.)",null,null,"Wǒ yībān qù càishìchǎng, yīnwèi cài gèng xīnxiān, hái kěyǐ jiǎngjià; bùguò rìyòngpǐn wǒhuì zài chāoshì mǎi.",null,"BODY372"],["3. Hỏi: 带中国客户去吃饭，你会选什么餐厅？点什么菜？ (Đưa khách TQ đi ăn, chọn nhà hàng nào? Gọi món gì?)",null,null,"Dài Zhōngguó kèhù qù chīfàn, nǐ huì xuǎn shénme cāntīng? Diǎn shénme cài?",null,"BODY373"],["Đáp: 我会选一家有包间的越南菜餐厅，点牛肉粉、春卷和烤鱼，不点太辣或者味道太重的。 (Chọn nhà hàng món Việt có phòng riêng, gọi phở, nem, chả cá, không gọi món quá cay hay nặng mùi.)",null,null,"Wǒhuì xuǎn yījiā yǒu bāojiān de Yuènán cài cāntīng, diǎn niúròufěn, chūnjuǎn hé kǎoyú, bù diǎn tài là huòzhě wèidào tàizhòng de.",null,"BODY374"],["4. Hỏi: 请你告诉我从你家到公司怎么走。 (Chỉ đường từ nhà bạn đến công ty.)",null,null,"Qǐng nǐ gàosu wǒ cóng nǐjiā dào gōngsī zěnme zǒu.",null,"BODY375"],["Đáp: 从我家出来往右拐，一直走到大路，然后上高架，过了桥第一个路口往左拐，公司就在加油站对面。 (Ra khỏi nhà rẽ phải, đi thẳng ra đường lớn, lên cầu cạn, qua cầu đến ngã tư đầu tiên rẽ trái, công ty đối diện cây xăng.)",null,null,"Cóng wǒjiā chūlái wǎngyòu guǎi, yīzhí zǒu dào dàlù, ránhòu shàng gāojià, guò le qiáo dìyīgè lùkǒu wǎng zuǒ guǎi, gōngsī jiù zài jiāyóuzhàn duìmiàn.",null,"BODY376"],["5. Hỏi: (HSK5) 如果老板和客户同时约你，你怎么安排？ (Nếu sếp và khách cùng hẹn một lúc, bạn sắp xếp thế nào?)",null,null,"Rúguǒ lǎobǎn hé kèhù tóngshí yuē nǐ, nǐ zěnme ānpái?",null,"BODY377"],["Đáp: 我会先看哪件事更紧急、更难改时间。一般客户的时间更难调整，所以我会先跟老板解释，请他把会往后推，或者请同事先帮我参加。 (Xem việc nào gấp hơn, khó đổi hơn. Thường lịch khách khó đổi hơn nên tôi giải thích với sếp, xin lùi họp hoặc nhờ đồng nghiệp dự trước.)",null,null,"Wǒhuì xiān kàn nǎ jiàn shì gèng jǐnjí, gèng nán gǎi shíjiān. Yībān kèhù de shíjiān gèng nán tiáozhěng, suǒyǐ wǒhuì xiān gēn lǎobǎn jiěshì, qǐng tā bǎ huì wǎnghòu tuī, huòzhě qǐng tóng shìxiān bāng wǒ cānjiā.",null,"BODY378"],["情景模拟 ROLE-PLAY — GV đổi lịch 3 lần liên tiếp; HS phản hồi lịch sự, đề xuất giờ mới, chốt lại",null,null,"Qíngjǐng mónǐ",null,"BODY379-C"],["GV: 小林，明天上午十点的会能不能提前到九点？ (Tiểu Lâm, họp 10h sáng mai dời lên 9h được không?)",null,null,"Xiǎo Lín, míngtiān shàngwǔ shídiǎn de huì néng bùnéng tíqián dào jiǔdiǎn?",null,"BODY380"],["HS: 九点我要送孩子上学，可能来不及。要不九点半吧？ (9h tôi phải đưa con đi học, e không kịp. Hay 9h30 nhé?)",null,null,"Jiǔdiǎn wǒ yào sòng háizi shàngxué, kěnéng láibùjí. Yào bù jiǔdiǎnbàn ba?",null,"BODY381"],["GV: 九点半王总不在，那改到下午吧。 (9h30 Vương tổng không có mặt, vậy đổi sang chiều.)",null,null,"Jiǔdiǎnbàn Wáng zǒng bù zài, nà gǎi dào xiàwǔ ba.",null,"BODY382"],["HS: 下午两点以后我都可以，您看三点怎么样？ (Chiều sau 2h tôi đều được, 3h thì sao ạ?)",null,null,"Xiàwǔ liǎngdiǎn yǐhòu wǒ dōu kěyǐ, nín kàn sāndiǎn zěnmeyàng?",null,"BODY383"],["GV: 不好意思，客户临时说下午要来工厂参观。 (Xin lỗi, khách đột xuất bảo chiều đến thăm nhà máy.)",null,null,"Bùhǎoyìsi, kèhù línshí shuō xiàwǔ yào lái gōngchǎng cānguān.",null,"BODY384"],["HS: 没问题。那我们改成后天上午，或者今晚线上开十五分钟，您看哪个更方便？ (Không vấn đề. Vậy đổi sang sáng ngày kia, hoặc tối nay họp online 15 phút, ngài thấy cái nào tiện hơn?)",null,null,"Méi wèntí. Nà wǒmen gǎichéng hòutiān shàngwǔ, huòzhě jīnwǎn xiàn shàng kāi shíwǔfēnzhōng, nín kàn nǎge gèng fāngbiàn?",null,"BODY385"],["GV: 那就后天上午吧。 (Vậy sáng ngày kia.)",null,null,"Nà jiù hòutiān shàngwǔ ba.",null,"BODY386"],["HS: 好的，那就后天上午十点，我会再发邮件跟大家确认一下。 (Vâng, vậy 10h sáng ngày kia, tôi sẽ gửi email xác nhận lại với mọi người.)",null,null,"Hǎo de, nà jiù hòutiān shàngwǔ shídiǎn, wǒhuì zài fāyóujiàn gēn dàjiā quèrèn yīxià.",null,"BODY387"],["Role-play phụ (HS bốc thăm): nhà hàng làm mất đặt bàn / siêu thị tính sai tiền / hỏi đường bị chỉ sai phải hỏi lại / tài xế đi nhầm đường.",null,null,null,null,"BODY388"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY389-C"],["✗ 我去超市在下午。 → ✓ 我下午去超市。 (Thời gian đứng TRƯỚC động từ.)",null,null,"Wǒ qù chāoshì zài xiàwǔ. | Wǒ xiàwǔ qù chāoshì.",null,"BODY390"],["✗ 我起床七点每天。 → ✓ 我每天七点起床。",null,null,"Wǒ qǐchuáng qīdiǎn měitiān. | Wǒ měitiān qīdiǎn qǐchuáng.",null,"BODY391"],["✗ 会议延误到三点。 → ✓ 会议推迟到三点。 (延误 dùng cho chuyến bay/tàu; 推迟 dùng cho lịch hẹn, cuộc họp.)",null,null,"Huìyì yánwù dào sāndiǎn. | Huìyì tuīchí dào sāndiǎn. | Yánwù | Tuīchí",null,"BODY392"],["✗ 我来不得及。 → ✓ 我来不及了。",null,null,"Wǒ láibùdejí. | Wǒ láibùjí le.",null,"BODY393"],["✗ 我的两个会议重复了。 → ✓ 我的两个会撞了 / 时间冲突了。",null,null,"Wǒ de liǎnggè huìyì chóngfù le. | Wǒ de liǎnggè huì zhuàng le | Shíjiān chōngtū le.",null,"BODY394"],["✗ 给我菜单。 (cộc lốc) → ✓ 麻烦给我们看一下菜单。",null,null,"Gěi wǒ càidān. | Máfan gěi wǒmen kàn yīxià càidān.",null,"BODY395"],["✗ 向左转在红绿灯。 → ✓ 到红绿灯往左拐。",null,null,"Xiàngzuǒzhuǎn zài hónglǜdēng. | Dào hónglǜdēng wǎng zuǒ guǎi.",null,"BODY396"],["Lưu ý: ở chợ/siêu thị TQ hay tính theo 斤 (500g): 这个多少钱一斤？",null,null,"Jīn | Zhège duōshǎo qián yījīn?",null,"BODY397"],["Phát âm: 推迟 tuīchí; 超市 chāoshì; 打包 dǎbāo; 买单 mǎidān; 红绿灯 hónglǜdēng.",null,null,"Tuīchí | Chāoshì | Dǎbāo | Mǎidān | Hónglǜdēng",null,"BODY398"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY399-C"],["(1) Ghi âm \"ngày bận rộn nhất trong tuần\" 2 phút, dùng 先……然后……最后…… và 一……就…….",null,null,"Xiān…… ránhòu…… zuìhòu…… | Yī…… jiù…… .",null,"BODY400"],["(2) Hai HS đóng lại Hội thoại siêu thị HOẶC nhà hàng, sau đó tự đổi tình huống (đổi món, đổi giá, thêm một sự cố).",null,null,null,null,"BODY401"],["(3) Viết đường đi từ nhà đến công ty bằng tiếng Trung, buổi sau nói lại không nhìn.",null,null,null,null,"BODY402"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY403"],["Buổi 03 — 兴趣爱好与生活方式 Sở thích và lối sống",null,null,"Xìngqù'àihào yǔ shēnghuó fāngshì",null,"BODY404-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY405-C"],["HSK4: Kể sở thích và trải nghiệm liên quan. HSK5: Tranh luận sự phụ thuộc điện thoại và lối sống.",null,null,null,null,"BODY406"],["Khi nói về một sở thích, HS trả lời đủ 4 ý: sở thích gì → bắt đầu thế nào → làm cụ thể gì → mang lại gì.",null,null,null,null,"BODY407"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY409-C"],["1. Hỏi: 你下班以后一般做什么放松？ (Tan làm bạn thường làm gì để thư giãn?)",null,null,"Nǐ xiàbān yǐhòu yībān zuò shénme fàngsōng?",null,"BODY410"],["Đáp: 我下班以后一般去健身房锻炼一个小时，出出汗，压力就小多了。 (Tôi thường đi gym một tiếng, ra mồ hôi là áp lực giảm hẳn.)",null,null,"Wǒ xiàbān yǐhòu yībān qù jiànshēnfáng duànliàn yīgè xiǎoshí, chū chūhàn, yālì jiù xiǎo duō le.",null,"BODY411"],["2. Hỏi: 你小时候的爱好和现在一样吗？ (Sở thích hồi nhỏ và bây giờ có giống nhau không?)",null,null,"Nǐ xiǎoshíhou de àihào hé xiànzài yīyàng ma?",null,"BODY412"],["Đáp: 不一样。小时候我喜欢画画，现在工作太忙没时间画了，反而喜欢上了跑步。 (Không giống. Hồi nhỏ thích vẽ, giờ bận quá không vẽ nữa, lại thích chạy bộ.)",null,null,"Bù yīyàng. Xiǎoshíhou wǒ xǐhuan huàhuà, xiànzài gōngzuò tài máng méi shíjiān huà le, fǎn'ér xǐhuan shàng le pǎobù.",null,"BODY413"],["3. Hỏi: 你每天看手机多长时间？ (Mỗi ngày bạn xem điện thoại bao lâu?)",null,null,"Nǐ měitiān kàn shǒujī duōchángshíjiān?",null,"BODY414"],["Đáp: 说实话，除了工作，每天至少还有三个小时在刷短视频。 (Thật lòng mà nói, ngoài công việc, mỗi ngày ít nhất 3 tiếng lướt video ngắn.)",null,null,"Shuōshíhuà, chúle gōngzuò, měitiān zhìshǎo háiyǒu sāngè xiǎoshí zài shuā duǎn shìpín.",null,"BODY415"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY416-C"],["1. 对……感兴趣 (hứng thú với): 我从大学开始就对摄影很感兴趣。 (Từ đại học tôi đã hứng thú với nhiếp ảnh.)",null,null,"Duì…… gǎnxìngqù | Wǒ cóng dàxué kāishǐ jiù duì shèyǐng hěngǎnxìngqù.",null,"BODY417"],["2. 坚持 (kiên trì): 我坚持每天早上跑步，已经两年了。 (Tôi kiên trì chạy bộ mỗi sáng đã 2 năm.)",null,null,"Jiānchí | Wǒ jiānchí měitiān zǎoshang pǎobù, yǐjīng liǎngnián le.",null,"BODY418"],["3. 放松 (thư giãn): 周末我喜欢去郊外爬山，放松一下。 (Cuối tuần tôi thích ra ngoại ô leo núi thư giãn.)",null,null,"Fàngsōng | Zhōumò wǒ xǐhuan qù jiāowài páshān, fàngsōng yīxià.",null,"BODY419"],["4. 培养习惯 (tạo thói quen): 我想培养每天读二十页书的习惯。 (Tôi muốn tạo thói quen mỗi ngày đọc 20 trang sách.)",null,null,"Péiyǎng xíguàn | Wǒ xiǎng péiyǎng měitiān dú èrshíyè shū de xíguàn.",null,"BODY420"],["5. 沉迷 (nghiện, sa đà – nghĩa xấu): 我弟弟沉迷手机游戏，每天玩到半夜。 (Em trai tôi nghiện game điện thoại, ngày nào cũng chơi đến nửa đêm.)",null,null,"Chénmí | Wǒ dìdi chénmí shǒujīyóuxì, měitiān wán dào bànyè.",null,"BODY421"],["6. 自律 (kỷ luật bản thân): 健身最需要的不是力气，而是自律。 (Tập gym cần nhất không phải sức mà là kỷ luật.)",null,null,"Zìlǜ | Jiànshēn zuì xūyào de bùshì lìqì, érshì zìlǜ.",null,"BODY422"],["7. 迷上 / 爱上 (bắt đầu mê – nghĩa tốt): 去年我突然迷上了弹吉他。 (Năm ngoái tôi tự nhiên mê đánh guitar.)",null,null,"Mí shàng | Ài shàng | Qùnián wǒ tūrán mí shàng le tánjítā.",null,"BODY423"],["8. 球迷 (fan bóng đá): 我是曼联的老球迷了，看了十几年。 (Tôi là fan lâu năm của MU, xem hơn chục năm.)",null,null,"Qiúmí | Wǒ shì Mànlián de lǎo qiúmí le, kàn le shíjǐnián.",null,"BODY424"],["9. 业余时间 (thời gian rảnh ngoài giờ làm): 我业余时间在一个乐队当吉他手。 (Lúc rảnh tôi làm tay guitar cho một ban nhạc.)",null,null,"Yèyúshíjiān | Wǒ yèyúshíjiān zài yīgè yuèduì dāng jítāshǒu.",null,"BODY425"],["10. 解压 (giải tỏa áp lực): 对我来说，唱歌是最好的解压方式。 (Với tôi hát là cách giải tỏa áp lực tốt nhất.)",null,null,"Jiěyā | Duì wǒ láishuō, chànggē shì zuìhǎo de jiěyā fāngshì.",null,"BODY426"],["11. 三天打鱼，两天晒网 (bữa đực bữa cái): 我学钢琴三天打鱼两天晒网，学了一年还只会一首歌。 (Tôi học piano bữa đực bữa cái, một năm vẫn chỉ biết một bài.)",null,null,"Sāntiāndǎyú, liǎngtiānshàiwǎng | Wǒ xué gāngqín sāntiāndǎyú liǎngtiānshàiwǎng, xué le yīnián hái zhǐ huì yīshǒugē.",null,"BODY427"],["12. 上瘾 (nghiện): 爬山会上瘾，爬过一次就想爬第二次。 (Leo núi gây nghiện, leo một lần là muốn leo lần hai.)",null,null,"Shàngyǐn | Páshān huì shàngyǐn, pá guò yīcì jiù xiǎng pá dì'èrcì.",null,"BODY428"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY429-C"],["1. 比起……，我更喜欢…… (So với …, tôi thích … hơn)",null,null,"Bǐqǐ……, wǒ gèng xǐhuan……",null,"BODY430"],["Ví dụ: 比起在家看电视，我更喜欢出去爬山。 (So với ở nhà xem TV, tôi thích ra ngoài leo núi hơn.)",null,null,"Bǐqǐ zàijiā kàndiànshì, wǒ gèng xǐhuan chūqù páshān.",null,"BODY431"],["Ví dụ: 比起看比赛，我更喜欢自己上场踢。 (So với xem thi đấu, tôi thích tự ra sân đá hơn.)",null,null,"Bǐqǐ kàn bǐsài, wǒ gèng xǐhuan zìjǐ shàngchǎng tī.",null,"BODY432"],["Ví dụ: 比起流行歌，我更喜欢唱老歌。 (So với nhạc trẻ, tôi thích hát nhạc xưa hơn.)",null,null,"Bǐqǐ liúxínggē, wǒ gèng xǐhuan chàng lǎogē.",null,"BODY433"],["2. 不仅……，还…… (Không chỉ … mà còn …)",null,null,"Bùjǐn……, hái……",null,"BODY434"],["Ví dụ: 踢足球不仅能锻炼身体，还能认识很多朋友。 (Đá bóng không chỉ rèn sức khỏe mà còn quen nhiều bạn.)",null,null,"Tīzúqiú bùjǐn néng duànliànshēntǐ, hái néng rènshi hěnduō péngyou.",null,"BODY435"],["Ví dụ: 学吉他不仅让我放松，还让我在公司年会上出了名。 (Học guitar không chỉ giúp tôi thư giãn mà còn giúp tôi nổi tiếng ở tiệc tất niên công ty.)",null,null,"Xué jítā bùjǐn ràng wǒ fàngsōng, hái ràng wǒ zài gōngsī nián huìshàng chūlemíng.",null,"BODY436"],["3. 自从……以后，…… (Từ khi …, …)",null,null,"Zìcóng…… yǐhòu,……",null,"BODY437"],["Ví dụ: 自从开始跑步以后，我的睡眠好多了。 (Từ khi bắt đầu chạy bộ, giấc ngủ tốt hơn nhiều.)",null,null,"Zìcóng kāishǐ pǎobù yǐhòu, wǒ de shuìmián hǎoduō le.",null,"BODY438"],["Ví dụ: 自从有了孩子以后，我只能看球赛的回放了。 (Từ khi có con, tôi chỉ xem được phát lại các trận bóng.)",null,null,"Zìcóng yǒu le háizi yǐhòu, wǒ zhǐnéng kànqiúsài de huífàng le.",null,"BODY439"],["4. 一有时间就…… (Hễ có thời gian là …)",null,null,"Yī yǒu shíjiān jiù……",null,"BODY440"],["Ví dụ: 我一有时间就去书店看书。 (Hễ rảnh là tôi ra hiệu sách đọc sách.)",null,null,"Wǒ yī yǒu shíjiān jiù qù shūdiàn kànshū.",null,"BODY441"],["Ví dụ: 他一有时间就背着包去徒步。 (Anh ấy hễ rảnh là đeo ba lô đi trekking.)",null,null,"Tā yī yǒu shíjiān jiù bèizhe bāo qù túbù.",null,"BODY442"],["5. 越……越…… (Càng … càng …)",null,null,"Yuè…… yuè……",null,"BODY443"],["Ví dụ: 吉他越练越有意思。 (Guitar càng tập càng thú vị.)",null,null,"Jítā yuè liàn yuè yǒuyìsi.",null,"BODY444"],["Ví dụ: 山越高，风景越美，可是也越累。 (Núi càng cao cảnh càng đẹp, nhưng cũng càng mệt.)",null,null,"Shānyuè gāo, fēngjǐng yuè měi, kěshì yě yuèlèi.",null,"BODY445"],["6. 每当……的时候，我就…… (Mỗi khi …, tôi lại …)",null,null,"Měidāng…… de shíhou, wǒ jiù……",null,"BODY446"],["Ví dụ: 每当压力大的时候，我就去KTV唱几首歌。 (Mỗi khi áp lực lớn tôi lại đi karaoke hát vài bài.)",null,null,"Měidāng yālì dà de shíhou, wǒ jiù qù KTV chàng jǐshǒugē.",null,"BODY447"],["Ví dụ: 每当越南队比赛的时候，我们全家就坐在一起看。 (Mỗi khi đội tuyển VN đá, cả nhà tôi lại ngồi xem cùng nhau.)",null,null,"Měidāng Yuènán duì bǐsài de shíhou, wǒmen quánjiā jiù zuòzài yīqǐ kàn.",null,"BODY448"],["7. 本来……，没想到…… (Ban đầu …, không ngờ …)",null,null,"Běnlái……, méixiǎngdào……",null,"BODY449"],["Ví dụ: 我本来只是陪朋友去学唱歌，没想到自己也爱上了。 (Ban đầu chỉ đi cùng bạn học hát, không ngờ chính mình cũng mê.)",null,null,"Wǒ běnlái zhǐshì péi péngyou qù xué chànggē, méixiǎngdào zìjǐ yě ài shàng le.",null,"BODY450"],["Ví dụ: 我本来以为爬山很无聊，没想到这么有意思。 (Cứ tưởng leo núi chán lắm, không ngờ thú vị vậy.)",null,null,"Wǒ běnlái yǐwéi páshān hěn wúliáo, méixiǎngdào zhème yǒuyìsi.",null,"BODY451"],["8. 说起……，我…… (Nói đến …, tôi …)",null,null,"Shuōqǐ……, wǒ……",null,"BODY452"],["Ví dụ: 说起足球，我可以聊一个晚上。 (Nói đến bóng đá, tôi có thể nói cả buổi tối.)",null,null,"Shuōqǐ zúqiú, wǒ kěyǐ liáo yīgè wǎnshàng.",null,"BODY453"],["Ví dụ: 说起做饭，我最拿手的是越南春卷。 (Nói đến nấu ăn, món ruột của tôi là nem rán.)",null,null,"Shuōqǐ zuòfàn, wǒ zuì náshǒu de shì Yuènán chūnjuǎn.",null,"BODY454"],["9. ……让我…… (… khiến / giúp tôi …)",null,null,"…… Ràng wǒ……",null,"BODY455"],["Ví dụ: 爬山让我学会了坚持。 (Leo núi giúp tôi học được sự kiên trì.)",null,null,"Páshān ràng wǒ xuéhuì le jiānchí.",null,"BODY456"],["Ví dụ: 唱歌让我变得更自信了。 (Hát giúp tôi tự tin hơn.)",null,null,"Chànggē ràng wǒ biànde gèng zìxìn le.",null,"BODY457"],["10. (HSK5) 与其……，不如…… (Thay vì …, chi bằng …)",null,null,"Yǔqí……, bùrú……",null,"BODY458"],["Ví dụ: 与其周末躺在床上刷手机，不如出去走走。 (Thay vì cuối tuần nằm lướt điện thoại, chi bằng ra ngoài dạo.)",null,null,"Yǔqí zhōumò tǎng zài chuángshàng shuā shǒujī, bùrú chūqù zǒuzou.",null,"BODY459"],["Ví dụ: 与其花钱买很贵的吉他，不如先买一把便宜的练练手。 (Thay vì mua cây guitar đắt tiền, chi bằng mua cây rẻ tập trước.)",null,null,"Yǔqí huāqiánmǎi hěn guì de jítā, bùrú xiānmǎi yībǎ piányi de liànlianshǒu.",null,"BODY460"],["11. (HSK5) 一方面……，另一方面…… (Một mặt …, mặt khác …)",null,null,"Yīfāngmiàn……, lìngyīfāngmiàn……",null,"BODY461"],["Ví dụ: 手机一方面让生活更方便，另一方面也让人越来越难集中注意力。 (Một mặt điện thoại giúp cuộc sống tiện hơn, mặt khác khiến người ta khó tập trung.)",null,null,"Shǒujī yīfāngmiàn ràng shēnghuó gèng fāngbiàn, lìngyīfāngmiàn yě ràng rén yuèláiyuè nán jízhōng zhùyìlì.",null,"BODY462"],["Ví dụ: 健身一方面能保持身材，另一方面也能缓解工作压力。 (Tập gym một mặt giữ dáng, mặt khác giảm áp lực công việc.)",null,null,"Jiànshēn yīfāngmiàn néng bǎochíshēncái, lìngyīfāngmiàn yě néng huǎnjiě gōngzuò yālì.",null,"BODY463"],["情景对话 1 — XEM & ĐÁ BÓNG 看球 / 踢球 (hai đồng nghiệp nói chuyện sáng thứ Hai)",null,null,"Qíngjǐng duìhuà | Kàn qiú | Tīqiú",null,"BODY464-C"],["A: 小王，你眼睛怎么这么红？昨晚没睡好吗？ (Tiểu Vương, mắt sao đỏ thế? Tối qua ngủ không ngon à?)",null,null,"Xiǎo Wáng, nǐ yǎnjing zěnme zhème hóng? Zuówǎn méi shuì hǎo ma?",null,"BODY465"],["B: 别提了，熬夜看球了，凌晨三点才睡。 (Đừng nhắc nữa, thức xem bóng, 3h sáng mới ngủ.)",null,null,"Biétí le, áoyè kàn qiú le, língchén sāndiǎn cái shuì.",null,"BODY466"],["A: 看的哪场？英超吗？ (Xem trận nào? Ngoại hạng Anh à?)",null,null,"Kàn de nǎ chǎng? Yīngchāo ma?",null,"BODY467"],["B: 对，曼联对利物浦。我是曼联的老球迷了。 (Đúng, MU gặp Liverpool. Tôi là fan lâu năm của MU.)",null,null,"Duì, Mànlián duì Lìwùpǔ. Wǒ shì Mànlián de lǎo qiúmí le.",null,"BODY468"],["A: 结果怎么样？ (Kết quả thế nào?)",null,null,"Jiéguǒ zěnmeyàng?",null,"BODY469"],["B: 太精彩了！上半场零比一落后，下半场连进两个球，最后一分钟逆转！ (Quá hay! Hiệp một thua 0–1, hiệp hai ghi liền 2 bàn, phút cuối lội ngược dòng!)",null,null,"Tàijīngcǎi le! Shàngbànchǎng líng bǐ yī luòhòu, xiàbànchǎng lián jìn liǎnggè qiú, zuìhòu yīfēnzhōng nìzhuǎn!",null,"BODY470"],["A: 哇，那你肯定很激动吧！ (Wow, chắc bạn phấn khích lắm!)",null,null,"Wa, nà nǐ kěndìng hěn jīdòng ba!",null,"BODY471"],["B: 我在家里叫得太大声，把孩子都吵醒了，被老婆骂了一顿。 (Tôi hét to quá đánh thức cả con, bị vợ mắng cho một trận.)",null,null,"Wǒ zài jiālǐ jiào de tài dàshēng, bǎ háizi dōu chǎoxǐng le, bèi lǎopo mà le yīdùn.",null,"BODY472"],["A: 哈哈！你最喜欢哪个球员？ (Haha! Bạn thích cầu thủ nào nhất?)",null,null,"Hāhā! Nǐ zuì xǐhuan nǎge qiúyuán?",null,"BODY473"],["B: 以前是C罗，现在喜欢B费，他的传球特别有想象力。 (Trước là Ronaldo, giờ thích Bruno Fernandes, chuyền bóng rất sáng tạo.)",null,null,"Yǐqián shì C luó, xiànzài xǐhuan B fèi, tā de chuánqiú tèbié yǒu xiǎngxiànglì.",null,"BODY474"],["A: 你自己也踢球吗？ (Bạn có tự đá bóng không?)",null,null,"Nǐ zìjǐ yě tīqiú ma?",null,"BODY475"],["B: 踢啊，每周四晚上跟几个同事踢五人制，我踢后卫。你要不要一起来？ (Có chứ, tối thứ 5 hằng tuần đá sân 5 với mấy đồng nghiệp, tôi đá hậu vệ. Bạn đi cùng không?)",null,null,"Tī a, měizhōu sì wǎnshàng gēn jǐgè tóngshì tī wǔrénzhì, wǒ tī hòuwèi. Nǐ yào bùyào yī qǐlái?",null,"BODY476"],["A: 我很久没踢了，怕跑不动。 (Lâu rồi tôi không đá, sợ chạy không nổi.)",null,null,"Wǒ hěnjiǔméi tī le, pà pǎobùdòng.",null,"BODY477"],["B: 没关系，我们就是踢着玩，主要是出出汗。踢完还一起去吃火锅。 (Không sao, đá cho vui thôi, chủ yếu ra mồ hôi. Đá xong còn đi ăn lẩu.)",null,null,"Méiguānxi, wǒmen jiùshì tī zhe wán, zhǔyào shì chū chūhàn. Tī wán hái yīqǐ qù chīhuǒguō.",null,"BODY478"],["A: 那好，这周四我去试试。在哪个球场？ (Vậy được, thứ 5 này tôi thử. Sân nào?)",null,null,"Nà hǎo, zhè zhōusì wǒ qù shìshi. Zài nǎge qiúchǎng?",null,"BODY479"],["B: 公司后面那个，七点开始，记得带球鞋。 (Sân sau công ty, 7h bắt đầu, nhớ mang giày.)",null,null,"Gōngsī hòumiàn nàge, qīdiǎn kāishǐ, jìde dài qiúxié.",null,"BODY480"],["A: 说起来，下个月越南队有比赛，我们要不要一起去美亭体育场看？ (Nhắc mới nhớ, tháng sau đội tuyển VN có trận, mình có đi sân Mỹ Đình xem không?)",null,null,"Shuō qǐlái, xiàgèyuè Yuènán duì yǒu bǐsài, wǒmen yào bùyào yīqǐ qù Měitíng Tǐyùchǎng kàn?",null,"BODY481"],["B: 好主意！现场的气氛跟在家看完全不一样，赢了的话全城的人都会上街庆祝。 (Ý hay! Không khí ở sân khác hẳn xem ở nhà, thắng là cả thành phố xuống đường ăn mừng.)",null,null,"Hǎo zhǔyì! Xiànchǎng de qìfēn gēn zàijiā kàn wánquán bù yīyàng, yíng le dehuà quánchéng de rén dōu huì shàngjiē qìngzhù.",null,"BODY482"],["情景对话 2 — LEO NÚI / TREKKING 爬山 (bạn hỏi kinh nghiệm leo Fansipan)",null,null,"Qíngjǐng duìhuà | Páshān",null,"BODY483-C"],["A: 听说你上个月去爬番西邦了？ (Nghe nói tháng trước bạn đi leo Fansipan?)",null,null,"Tīngshuō nǐ shànggèyuè qù pá Fānxībāng le?",null,"BODY484"],["B: 对，番西邦是印度支那最高的山，海拔三千一百多米。 (Đúng, Fansipan là đỉnh cao nhất Đông Dương, hơn 3.100m.)",null,null,"Duì, Fānxībāng shì Yìndùzhīnà zuìgāo de shān, hǎibá sānqiān yībǎiduōmǐ.",null,"BODY485"],["A: 不是可以坐缆车上去吗？ (Không phải có cáp treo lên được à?)",null,null,"Bùshì kěyǐ zuò lǎnchē shàngqù ma?",null,"BODY486"],["B: 可以，但是我们选择徒步，走了两天一夜，晚上在山上的营地过夜。 (Được, nhưng bọn tôi chọn đi bộ, 2 ngày 1 đêm, tối ngủ lán trại trên núi.)",null,null,"Kěyǐ, dànshì wǒmen xuǎnzé túbù, zǒu le liǎngtiān yīyè, wǎnshàng zài shānshàng de yíngdì guòyè.",null,"BODY487"],["A: 天哪，那一定很累吧？ (Trời, chắc mệt lắm nhỉ?)",null,null,"Tiān nǎ, nà yīdìng hěn lèi ba?",null,"BODY488"],["B: 特别累。爬到一半的时候我真的想放弃了，腿都在抖。 (Cực mệt. Leo được nửa đường tôi thật sự muốn bỏ, chân run lẩy bẩy.)",null,null,"Tèbié lèi. Pá dào yībàn de shíhou wǒ zhēnde xiǎng fàngqì le, tuǐ dōu zài dǒu.",null,"BODY489"],["A: 那你是怎么坚持下来的？ (Vậy bạn kiên trì bằng cách nào?)",null,null,"Nà nǐ shì zěnme jiānchí xiàlái de?",null,"BODY490"],["B: 幸亏向导一直鼓励我，说再走一个小时就到营地了。结果走了三个小时！ (May mà hướng dẫn viên luôn động viên, bảo đi thêm 1 tiếng là đến lán. Rốt cuộc đi mất 3 tiếng!)",null,null,"Xìngkuī xiàngdǎo yīzhí gǔlì wǒ, shuō zài zǒu yīgè xiǎoshí jiù dào yíngdì le. Jiéguǒ zǒu le sāngè xiǎoshí!",null,"BODY491"],["A: 哈哈，向导都这么说。爬到山顶的时候是什么感觉？ (Haha, hướng dẫn viên ai cũng nói vậy. Lên đến đỉnh cảm giác thế nào?)",null,null,"Hāhā, xiàngdǎo dōu zhème shuō. Pá dào shāndǐng de shíhou shì shénme gǎnjué?",null,"BODY492"],["B: 站在山顶看云海的那一刻，所有的累都值了。 (Khoảnh khắc đứng trên đỉnh ngắm biển mây, mọi mệt mỏi đều đáng.)",null,null,"Zhàn zài shāndǐng kàn yúnhǎi de nàyīkè, suǒyǒu de lèi dōu zhí le.",null,"BODY493"],["A: 我也想去，要准备什么？ (Tôi cũng muốn đi, phải chuẩn bị gì?)",null,null,"Wǒ yě xiǎng qù, yào zhǔnbèi shénme?",null,"BODY494"],["B: 最好提前一个月开始跑步，锻炼体力。装备的话，登山鞋、雨衣、头灯、充电宝都不能少。 (Tốt nhất chạy bộ trước một tháng rèn thể lực. Đồ thì giày leo núi, áo mưa, đèn đội đầu, sạc dự phòng không thể thiếu.)",null,null,"Zuìhǎo tíqián yīgèyuè kāishǐ pǎobù, duànliàn tǐlì. Zhuāngbèi dehuà, dēngshānxié, yǔyī, tóudēng, chōngdiàn bǎo dōu bùnéng shǎo.",null,"BODY495"],["A: 山上冷不冷？ (Trên núi có lạnh không?)",null,null,"Shānshàng lěngbùlěng?",null,"BODY496"],["B: 晚上只有五六度，一定要带厚外套。而且山上天气变化很快，一会儿晴一会儿下雨。 (Ban đêm chỉ 5–6 độ, phải mang áo khoác dày. Thời tiết trên núi đổi rất nhanh, lúc nắng lúc mưa.)",null,null,"Wǎnshàng zhǐyǒu wǔliù dù, yīdìng yào dài hòu wàitào. Érqiě shānshàng tiānqì biànhuà hěnkuài, yīhuìr qíng yīhuìr xiàyǔ.",null,"BODY497"],["A: 我从来没爬过高山，直接去番西邦会不会太难？ (Tôi chưa leo núi cao bao giờ, đi thẳng Fansipan có khó quá không?)",null,null,"Wǒ cónglái méi pá guò gāoshān, zhíjiē qù Fānxībāng huì bùhuì tài nán?",null,"BODY498"],["B: 第一次的话，我建议你先去巴维山或者三岛练练，难度不大，一天就能来回。 (Lần đầu thì nên đi Ba Vì hoặc Tam Đảo tập trước, không khó, một ngày đi về được.)",null,null,"Dìyīcì dehuà, wǒ jiànyì nǐ xiān qù Bāwéi Shān huòzhě Sāndǎo liànlian, nándù bù dà, yītiān jiù néng láihuí.",null,"BODY499"],["A: 好，那下个周末你带我去三岛吧！ (Được, cuối tuần sau bạn dẫn tôi đi Tam Đảo nhé!)",null,null,"Hǎo, nà xià gè zhōumò nǐ dàiwǒqù Sāndǎo ba!",null,"BODY500"],["B: 没问题！爬山会上瘾的，你爬过一次就停不下来了。 (Không vấn đề! Leo núi gây nghiện đấy, leo một lần là không dừng được.)",null,null,"Méi wèntí! Páshān huì shàngyǐn de, nǐ pá guò yīcì jiù tíngbùxiàlái le.",null,"BODY501"],["情景对话 3 — HỌC ĐÀN 学吉他 / 学钢琴",null,null,"Qíngjǐng duìhuà | Xué jítā | Xué gāngqín",null,"BODY502-C"],["A: 你朋友圈里经常发弹吉他的视频，你学了多久了？ (Bạn hay đăng video đánh guitar lên trang cá nhân, học bao lâu rồi?)",null,null,"Nǐ péngyou quānlǐ jīngcháng fā tánjítā de shìpín, nǐ xué le duōjiǔ le?",null,"BODY503"],["B: 一年多了，每周上一次课，平时自己在家练。 (Hơn một năm, mỗi tuần học một buổi, bình thường tự tập ở nhà.)",null,null,"Yīnián duō le, měizhōu shàng yīcì kè, píngshí zìjǐ zàijiā liàn.",null,"BODY504"],["A: 你怎么突然想学吉他了？ (Sao tự nhiên bạn muốn học guitar?)",null,null,"Nǐ zěnme tūrán xiǎng xué jítā le?",null,"BODY505"],["B: 我之所以学吉他，是因为想在朋友聚会的时候给大家弹唱。以前每次聚会我只能听别人唱。 (Sở dĩ học guitar là vì muốn đàn hát cho mọi người khi tụ tập. Trước đây lần nào cũng chỉ ngồi nghe người khác hát.)",null,null,"Wǒ zhīsuǒyǐ xué jítā, shìyīnwèi xiǎng zài péngyou jùhuì de shíhou gěi dàjiā tánchàng. Yǐqián měicì jùhuì wǒ zhǐnéng tīng biérén chàng.",null,"BODY506"],["A: 难不难学？ (Có khó học không?)",null,null,"Nán bùnán xué?",null,"BODY507"],["B: 刚开始特别难，手指很疼，按弦按得都起茧了。 (Mới đầu cực khó, ngón tay rất đau, bấm dây đến chai cả tay.)",null,null,"Gāng kāishǐ tèbié nán, shǒuzhǐ hěn téng, àn xián àn de dōu qǐ jiǎn le.",null,"BODY508"],["A: 那你没想过放弃吗？ (Thế bạn không nghĩ đến chuyện bỏ à?)",null,null,"Nà nǐ méi xiǎng guò fàngqì ma?",null,"BODY509"],["B: 想过啊！最难的是换和弦，换得太慢，节奏就乱了。那段时间我差点就不学了。 (Có chứ! Khó nhất là chuyển hợp âm, chuyển chậm là loạn nhịp. Thời gian đó tôi suýt bỏ.)",null,null,"Xiǎng guò a! Zuì nán de shì huàn héxián, huàn de tàimàn, jiézòu jiù luàn le. Nà duànshíjiān wǒ chàdiǎn jiù bù xué le.",null,"BODY510"],["A: 后来呢？ (Sau đó thì sao?)",null,null,"Hòulái ne?",null,"BODY511"],["B: 老师让我每天只练十五分钟，但是一天都不能停。坚持了一个月，突然就会了。 (Thầy bảo mỗi ngày chỉ tập 15 phút nhưng không được nghỉ ngày nào. Kiên trì một tháng, tự nhiên biết luôn.)",null,null,"Lǎoshī ràng wǒ měitiān zhǐ liàn shíwǔfēnzhōng, dànshì yītiān dōu bùnéng tíng. Jiānchí le yīgèyuè, tūrán jiù huì le.",null,"BODY512"],["A: 现在能弹多少首歌？ (Giờ đàn được bao nhiêu bài?)",null,null,"Xiànzài néng tán duōshǎo shǒugē?",null,"BODY513"],["B: 十几首吧，上个月还在公司年会上表演了，同事们都很吃惊。 (Khoảng hơn chục bài, tháng trước còn biểu diễn ở tiệc công ty, đồng nghiệp ai cũng bất ngờ.)",null,null,"Shíjǐ shǒu ba, shànggèyuè hái zài gōngsī nián huìshàng biǎoyǎn le, tóngshì men dōu hěn chījīng.",null,"BODY514"],["A: 我小时候妈妈逼我学钢琴，我特别讨厌，学了两年就不学了。 (Hồi nhỏ mẹ ép tôi học piano, tôi ghét lắm, học 2 năm thì bỏ.)",null,null,"Wǒ xiǎoshíhou māma bī wǒ xué gāngqín, wǒ tèbié tǎoyàn, xué le liǎngnián jiù bù xué le.",null,"BODY515"],["B: 很多人都这样。被逼着学和自己想学完全不一样。你现在想不想再学？ (Nhiều người vậy lắm. Bị ép học khác hẳn tự muốn học. Giờ bạn có muốn học lại không?)",null,null,"Hěnduō rén dōu zhèyàng. Bèi bī zhe xué hé zìjǐ xiǎng xué wánquán bù yīyàng. Nǐ xiànzài xiǎng bùxiǎng zài xué?",null,"BODY516"],["A: 有点想，可是我怕三天打鱼两天晒网。 (Hơi muốn, nhưng sợ bữa đực bữa cái.)",null,null,"Yǒudiǎn xiǎng, kěshì wǒ pà sāntiāndǎyú liǎngtiānshàiwǎng.",null,"BODY517"],["B: 那你跟我一起报名吧，有人一起练就比较容易坚持。 (Vậy đăng ký cùng tôi đi, có người tập cùng dễ kiên trì hơn.)",null,null,"Nà nǐ gēn wǒ yīqǐ bàomíng ba, yǒurén yīqǐ liànjiù bǐjiào róngyì jiānchí.",null,"BODY518"],["情景对话 4 — CA HÁT / KARAOKE 唱K (sau bữa ăn với khách TQ)",null,null,"Qíngjǐng duìhuà | Chàng K",null,"BODY519-C"],["客户: 吃得太饱了！你们越南人吃完饭一般做什么？ (No quá! Người Việt ăn xong thường làm gì?)",null,null,"Kèhù: chī de tàibǎo le! Nǐmen Yuènánrén chīwánfàn yībān zuò shénme?",null,"BODY520"],["A: 我们很喜欢唱卡拉OK，附近就有一家，王总有兴趣吗？ (Chúng tôi rất thích hát karaoke, gần đây có một quán, Vương tổng có hứng thú không?)",null,null,"Wǒmen hěn xǐhuan chàng kǎlā OK, fùjìn jiù yǒu yījiā, Wáng zǒng yǒu xìngqù ma?",null,"BODY521"],["客户: 好啊！我们中国人也喜欢唱K。 (Được đấy! Người TQ chúng tôi cũng thích hát karaoke.)",null,null,"Kèhù: hǎo a! Wǒmen Zhōngguórén yě xǐhuan chàng K.",null,"BODY522"],["A: (ở phòng hát) 王总，您想唱什么？我帮您点歌。 (Vương tổng muốn hát bài gì? Tôi chọn giúp.)",null,null,"Wáng zǒng, nín xiǎng chàng shénme? Wǒ bāng nín diǎngē.",null,"BODY523"],["客户: 先来一首《月亮代表我的心》吧，经典老歌。 (Bài \"Ánh trăng nói hộ lòng tôi\" trước đi, bài kinh điển.)",null,null,"Kèhù: xiān lái yīshǒu«Yuèliang Dàibiǎo Wǒde Xīn» ba, jīngdiǎn lǎogē.",null,"BODY524"],["A: 这首我也会！越南人很多都会唱，还有越南语版本呢。 (Bài này tôi cũng biết! Nhiều người Việt biết hát, còn có bản tiếng Việt nữa.)",null,null,"Zhè shǒu wǒ yě huì! Yuènánrén hěnduō dōu huì chàng, háiyǒu Yuènányǔ bǎnběn ne.",null,"BODY525"],["客户: 真的吗？那我们一起唱，你唱越南语，我唱中文。 (Thật à? Vậy mình cùng hát, anh hát tiếng Việt, tôi hát tiếng Trung.)",null,null,"Kèhù: zhēnde ma? Nà wǒmen yīqǐ chàng, nǐ chàng Yuènányǔ, wǒ chàng Zhōngwén.",null,"BODY526"],["客户: (hát xong) 你唱得真好！是不是专门学过？ (Anh hát hay thật! Có học bài bản không?)",null,null,"Kèhù: nǐ chàng de zhēn hǎo! Shìbùshì zhuānmén xué guò?",null,"BODY527"],["A: 学过半年声乐，老师说我气息不够，要多练腹式呼吸。 (Học thanh nhạc nửa năm, thầy bảo hơi chưa đủ, phải luyện thở bụng nhiều.)",null,null,"Xué guò bànnián shēngyuè, lǎoshī shuō wǒ qìxī bùgòu, yào duō liàn fù shì hūxī.",null,"BODY528"],["客户: 你还会唱别的中文歌吗？ (Anh còn biết hát bài tiếng Trung nào khác không?)",null,null,"Kèhù: nǐ hái huì chàng biéde Zhōngwén gē ma?",null,"BODY529"],["A: 我还会唱周杰伦的《晴天》。我唱中文歌是为了练发音，效果特别好。 (Tôi biết hát \"Tình Thiên\" của Châu Kiệt Luân. Tôi hát bài tiếng Trung để luyện phát âm, hiệu quả rất tốt.)",null,null,"Wǒ hái huì chàng Zhōu Jiélún de«Qíngtiān». Wǒ chàng Zhōngwén gē shì wèile liàn fāyīn, xiàoguǒ tèbié hǎo.",null,"BODY530"],["客户: 好办法！这首太高了，我唱不上去，你来吧。 (Cách hay đấy! Bài này cao quá tôi không lên được, anh hát đi.)",null,null,"Kèhù: hǎo bànfǎ! Zhè shǒu tài gāo le, wǒ chàng bù shàngqù, nǐ lái ba.",null,"BODY531"],["A: 好，那我献丑了！ (Vâng, vậy tôi xin mạn phép!)",null,null,"Hǎo, nà wǒ xiànchǒu le!",null,"BODY532"],["情景对话 5 — GYM / CHẠY BỘ 健身 / 跑步",null,null,"Qíngjǐng duìhuà | Jiànshēn | Pǎobù",null,"BODY533-C"],["A: 你最近瘦了好多，是怎么做到的？ (Dạo này bạn gầy đi nhiều, làm cách nào vậy?)",null,null,"Nǐ zuìjìn shòu le hǎoduō, shì zěnme zuòdào de?",null,"BODY534"],["B: 我半年前开始健身，每周去三次健身房，还请了一个私人教练。 (Nửa năm trước tôi bắt đầu tập gym, tuần 3 buổi, còn thuê PT.)",null,null,"Wǒ bànniánqián kāishǐ jiànshēn, měizhōu qù sāncì jiànshēnfáng, hái qǐng le yīgè sīrén jiàoliàn.",null,"BODY535"],["A: 请教练贵不贵？ (Thuê PT có đắt không?)",null,null,"Qǐng jiàoliàn guì bù guì?",null,"BODY536"],["B: 一节课五十万盾，有点贵，但是他帮我制定了训练计划和饮食计划，效果很明显。 (Một buổi 500 nghìn, hơi đắt nhưng anh ấy lập giáo án và chế độ ăn, hiệu quả rõ rệt.)",null,null,"Yījiékè wǔshíwàn dùn, yǒudiǎn guì, dànshì tā bāng wǒ zhìdìng le xùnliàn jìhuà hé yǐnshí jìhuà, xiàoguǒ hěn míngxiǎn.",null,"BODY537"],["A: 除了健身，你还做别的运动吗？ (Ngoài gym, bạn còn tập gì khác không?)",null,null,"Chúle jiànshēn, nǐ hái zuò biéde yùndòng ma?",null,"BODY538"],["B: 我周末早上去西湖跑步，一次跑十公里。 (Sáng cuối tuần tôi chạy ở Hồ Tây, mỗi lần 10km.)",null,null,"Wǒ zhōumò zǎoshang qù Xīhú pǎobù, yīcì pǎo shígōnglǐ.",null,"BODY539"],["A: 十公里！我跑两公里就不行了。 (10km! Tôi chạy 2km đã chịu.)",null,null,"Shígōnglǐ! Wǒ pǎo liǎnggōnglǐ jiù bùxíng le.",null,"BODY540"],["B: 跑步最难的是开始的前两个星期，过了这个阶段就会上瘾。 (Chạy khó nhất là 2 tuần đầu, qua giai đoạn đó sẽ nghiện.)",null,null,"Pǎobù zuì nán de shì kāishǐ de qián liǎnggè xīngqī, guò le zhège jiēduàn jiù huì shàngyǐn.",null,"BODY541"],["A: 你参加过马拉松吗？ (Bạn từng chạy marathon chưa?)",null,null,"Nǐ cānjiā guò mǎlāsōng ma?",null,"BODY542"],["B: 去年参加了岘港国际马拉松，跑了半程，二十一公里，用了两个小时。 (Năm ngoái chạy marathon quốc tế Đà Nẵng, nửa chặng 21km, mất 2 tiếng.)",null,null,"Qùnián cānjiā le Xiàngǎngguójìmǎlāsōng, pǎo le bànchéng, èrshíyī gōnglǐ, yòng le liǎnggè xiǎoshí.",null,"BODY543"],["A: 太厉害了！健身对你的工作有帮助吗？ (Giỏi quá! Tập luyện có giúp gì cho công việc không?)",null,null,"Tài lìhai le! Jiànshēn duì nǐ de gōngzuò yǒu bāngzhù ma?",null,"BODY544"],["B: 帮助很大。自从开始健身以后，我的精神状态好多了，下午开会也不犯困了。 (Rất nhiều. Từ khi tập, tinh thần tốt hơn hẳn, chiều họp cũng không buồn ngủ.)",null,null,"Bāngzhù hěndà. Zìcóng kāishǐ jiànshēn yǐhòu, wǒ de jīngshénzhuàngtài hǎoduō le, xiàwǔ kāihuì yě bù fànkùn le.",null,"BODY545"],["A: 那我也想试试，你下次去健身房叫上我吧。 (Vậy tôi cũng muốn thử, lần sau đi gym rủ tôi nhé.)",null,null,"Nà wǒ yě xiǎng shìshi, nǐ xiàcì qù jiànshēnfáng jiào shàng wǒ ba.",null,"BODY546"],["B: 好啊，不过你要坚持，健身最需要的是自律。 (Được, nhưng bạn phải kiên trì, tập gym cần nhất là kỷ luật.)",null,null,"Hǎo a, bùguò nǐ yào jiānchí, jiànshēn zuì xūyào de shì zìlǜ.",null,"BODY547"],["情景对话 6 — ĐỌC SÁCH / NẤU ĂN (nói chuyện nhẹ khi nghỉ trưa)",null,null,"Qíngjǐng duìhuà",null,"BODY548-C"],["A: 你中午不午睡，一直在看什么书？ (Trưa bạn không ngủ, đọc sách gì vậy?)",null,null,"Nǐ zhōngwǔ bù wǔshuì, yīzhí zài kàn shénme shū?",null,"BODY549"],["B: 一本关于时间管理的书，叫《高效能人士的七个习惯》，对我的工作很有帮助。 (Cuốn về quản lý thời gian, \"7 thói quen của người thành đạt\", rất có ích cho công việc.)",null,null,"Yīběn guānyú shíjiān guǎnlǐ de shū, jiào«Gāo Xiàonéng Rénshìde Qī Gè Xíguàn», duì wǒ de gōngzuò hěn yǒu bāngzhù.",null,"BODY550"],["A: 你一个月读几本书？ (Một tháng bạn đọc mấy cuốn?)",null,null,"Nǐ yīgèyuè dú jǐběnshū?",null,"BODY551"],["B: 我给自己定了目标，每个月至少两本。每天睡前读二十页，不看手机。 (Tôi đặt mục tiêu mỗi tháng ít nhất 2 cuốn. Mỗi tối trước khi ngủ đọc 20 trang, không xem điện thoại.)",null,null,"Wǒ gěi zìjǐ dìng le mùbiāo, měigè yuè zhìshǎo liǎngběn. Měitiān shuì qián dú èrshíyè, bù kàn shǒujī.",null,"BODY552"],["A: 我也想培养读书的习惯，可是一拿起书就想睡觉。 (Tôi cũng muốn tạo thói quen đọc sách, nhưng cầm sách lên là buồn ngủ.)",null,null,"Wǒ yě xiǎng péiyǎng dúshū de xíguàn, kěshì yī ná qǐ shū jiù xiǎng shuìjiào.",null,"BODY553"],["B: 你可以先从感兴趣的书开始，比如小说或者美食书。 (Bạn có thể bắt đầu từ sách mình thích, như tiểu thuyết hay sách ẩm thực.)",null,null,"Nǐ kěyǐ xiān cóng gǎnxìngqù de shū kāishǐ, bǐrú xiǎoshuō huòzhě měishí shū.",null,"BODY554"],["A: 说起美食，我周末最喜欢做饭了，上周还学会了做红烧肉。 (Nói đến ẩm thực, cuối tuần tôi thích nấu ăn nhất, tuần trước còn học được món thịt kho tàu.)",null,null,"Shuōqǐ měishí, wǒ zhōumò zuì xǐhuan zuòfàn le, shàngzhōu hái xuéhuì le zuò hóngshāoròu.",null,"BODY555"],["B: 真的？你是跟谁学的？ (Thật à? Bạn học từ ai?)",null,null,"Zhēnde? Nǐ shì gēn shuí xué de?",null,"BODY556"],["A: 在网上看视频学的，第一次做得太咸了，第二次就好多了。 (Xem video trên mạng học, lần đầu làm mặn quá, lần hai đỡ hơn nhiều.)",null,null,"Zài wǎngshàng kàn shìpín xué de, dìyīcì zuò de tài xián le, dì'èrcì jiù hǎoduō le.",null,"BODY557"],["B: 下次做了带一点来公司，让我们尝尝！ (Lần sau làm mang ít lên công ty cho bọn mình nếm thử nhé!)",null,null,"Xiàcì zuò le dài yīdiǎn lái gōngsī, ràng wǒmen chángchang!",null,"BODY558"],["情景对话 7 — (HSK5) Tranh luận: 手机让生活更好还是更糟？ (Điện thoại làm cuộc sống tốt hơn hay tệ hơn?)",null,null,"Qíngjǐng duìhuà | Shǒujī ràng shēnghuó gènghǎo háishì gèngzāo?",null,"BODY559-C"],["A: 我觉得手机让我们的生活方便多了。工作、付款、叫车、学习，一部手机全搞定。 (Tôi thấy điện thoại khiến cuộc sống tiện hơn nhiều. Làm việc, thanh toán, gọi xe, học tập, một chiếc điện thoại lo hết.)",null,null,"Wǒ juéde shǒujī ràng wǒmen de shēnghuó fāngbiàn duō le. Gōngzuò, fùkuǎn, jiào chē, xuéxí, yībù shǒujī quán gǎodìng.",null,"BODY560"],["B: 这个说法有一定道理，但是你有没有发现，大家一闲下来就刷短视频，越刷越停不下来？ (Nói vậy có lý, nhưng bạn có thấy mọi người hễ rảnh là lướt video ngắn, càng lướt càng không dừng được?)",null,null,"Zhège shuōfǎ yǒu yīdìng dàolǐ, dànshì nǐ yǒuméiyǒu fāxiàn, dàjiā yī xiánxiàlái jiù shuā duǎn shìpín, yuè shuā yuè tíngbùxiàlái?",null,"BODY561"],["A: 那是个人的问题，不是手机的问题。我就是在网上学会做饭和弹吉他的。 (Đó là vấn đề cá nhân, không phải do điện thoại. Tôi học nấu ăn và đánh guitar trên mạng đấy.)",null,null,"Nà shì gèrén de wèntí, bùshì shǒujī de wèntí. Wǒ jiùshì zài wǎngshàng xuéhuì zuòfàn hé tánjítā de.",null,"BODY562"],["B: 我理解你的意思，不过像你这么自律的人并不多。很多年轻人每天看手机超过八个小时。 (Tôi hiểu ý bạn, nhưng người tự giác như bạn không nhiều. Nhiều bạn trẻ xem điện thoại hơn 8 tiếng mỗi ngày.)",null,null,"Wǒ lǐjiě nǐ de yìsi, bùguò xiàng nǐ zhème zìlǜ de rén bìngbùduō. Hěnduō niánqīngrén měitiān kàn shǒujī chāoguò bāgè xiǎoshí.",null,"BODY563"],["A: 可是手机也让我们跟远方的家人联系更方便了。我爸妈在老家，每天都能视频。 (Nhưng điện thoại cũng giúp liên lạc với gia đình ở xa dễ hơn. Bố mẹ tôi ở quê, ngày nào cũng gọi video được.)",null,null,"Kěshì shǒujī yě ràng wǒmen gēn yuǎnfāng de jiārén liánxì gèng fāngbiàn le. Wǒ bàmā zài lǎojiā, měitiān dōu néng shìpín.",null,"BODY564"],["B: 没错，可是反过来，一家人坐在一起吃饭的时候，却各看各的手机，感情反而越来越淡了。 (Đúng, nhưng ngược lại, cả nhà ngồi ăn cùng nhau lại mỗi người một điện thoại, tình cảm ngày càng nhạt.)",null,null,"Méicuò, kěshì fǎnguòlái, yījiārén zuòzài yīqǐ chīfàn de shíhou, què gè kàn gè de shǒujī, gǎnqíng fǎn'ér yuèláiyuè dàn le.",null,"BODY565"],["A: 这种情况确实存在，可是不能一概而论。 (Tình trạng đó đúng là có, nhưng không thể vơ đũa cả nắm.)",null,null,"Zhèzhǒng qíngkuàng quèshí cúnzài, kěshì bùnéng yīgài'érlùn.",null,"BODY566"],["B: 还有睡眠的问题。睡前看手机会影响睡眠，第二天上班没精神，效率反而更低。 (Còn vấn đề giấc ngủ. Xem điện thoại trước khi ngủ ảnh hưởng giấc ngủ, hôm sau đi làm uể oải, hiệu quả còn thấp hơn.)",null,null,"Háiyǒu shuìmián de wèntí. Shuì qián kàn shǒujī huì yǐngxiǎng shuìmián, dì'èrtiān shàngbān méi jīngshén, xiàolǜ fǎn'ér gèng dī.",null,"BODY567"],["A: 那你觉得应该怎么办？不用手机吗？ (Vậy bạn thấy nên làm sao? Không dùng điện thoại à?)",null,null,"Nà nǐ juéde yīnggāi zěnmebàn? Bùyòng shǒujī ma?",null,"BODY568"],["B: 当然不是。我认为问题不在手机本身，而在于我们会不会管理自己。 (Tất nhiên không. Tôi cho rằng vấn đề không phải ở điện thoại mà ở chỗ ta có biết quản lý bản thân không.)",null,null,"Dāngrán bùshì. Wǒ rènwéi wèntí bù zài shǒujī běnshēn, ér zàiyú wǒmen huì bùhuì guǎnlǐ zìjǐ.",null,"BODY569"],["A: 这一点我同意。比如我给自己规定，晚上十点以后不刷短视频。 (Điểm này tôi đồng ý. Như tôi tự quy định sau 10h tối không lướt video.)",null,null,"Zhè yīdiǎn wǒ tóngyì. Bǐrú wǒ gěi zìjǐ guīdìng, wǎnshàng shídiǎn yǐhòu bù shuā duǎn shìpín.",null,"BODY570"],["B: 我也打算试试，吃饭的时候把手机放在另一个房间。 (Tôi cũng định thử, khi ăn cơm để điện thoại ở phòng khác.)",null,null,"Wǒ yě dǎsuàn shìshi, chīfàn de shíhou bǎ shǒujī fàngzài lìng yīgè fángjiān.",null,"BODY571"],["A: 看来我们的结论是一样的：手机是工具，关键在于怎么用。 (Xem ra kết luận của chúng ta giống nhau: điện thoại là công cụ, quan trọng là dùng thế nào.)",null,null,"Kànlái wǒmen de jiélùn shì yīyàng de: shǒujī shì gōngjù, guānjiànzàiyú zěnme yòng.",null,"BODY572"],["引导练习 GUIDED SPEAKING — HS trả lời 1–2 phút theo 4 ý",null,null,"Yǐndǎo liànxí",null,"BODY573-C"],["1. Hỏi: 你最大的爱好是什么？是怎么开始的？ (Sở thích lớn nhất là gì? Bắt đầu thế nào?)",null,null,"Nǐ zuìdà de àihào shì shénme? Shì zěnme kāishǐ de?",null,"BODY574"],["Đáp: 我最大的爱好是摄影。大学的时候我爸送了我一台旧相机，从那以后我就迷上了拍照。 (Sở thích lớn nhất là chụp ảnh. Hồi đại học bố tặng tôi chiếc máy ảnh cũ, từ đó tôi mê chụp ảnh.)",null,null,"Wǒ zuìdà de àihào shì shèyǐng. Dàxué de shíhou wǒ bà sòng le wǒ yītái jiù xiàngjī, cóngnàyǐhòu wǒ jiù mí shàng le pāizhào.",null,"BODY575"],["2. Hỏi: 这个爱好花钱吗？一个月大概花多少？ (Sở thích này tốn tiền không? Mỗi tháng khoảng bao nhiêu?)",null,null,"Zhège àihào huāqián ma? Yīgèyuè dàgài huā duōshǎo?",null,"BODY576"],["Đáp: 一开始不太花钱，后来想换好一点的镜头，花了差不多两千万盾。平时一个月几十万就够了。 (Ban đầu không tốn mấy, sau muốn đổi ống kính tốt hơn, mất gần 20 triệu. Bình thường mỗi tháng vài trăm nghìn là đủ.)",null,null,"Yī kāishǐ bù tài huāqián, hòulái xiǎng huàn hǎo yīdiǎn de jìngtóu, huā le chàbuduō liǎngqiānwàn dùn. Píngshí yīgèyuè jǐshíwàn jiù gòu le.",null,"BODY577"],["3. Hỏi: 你的爱好对工作有帮助吗？ (Sở thích có giúp ích công việc không?)",null,null,"Nǐ de àihào duì gōngzuò yǒu bāngzhù ma?",null,"BODY578"],["Đáp: 有帮助。公司做产品宣传的时候，常常让我帮忙拍产品照片。 (Có. Khi công ty làm quảng bá sản phẩm, hay nhờ tôi chụp ảnh sản phẩm.)",null,null,"Yǒu bāngzhù. Gōngsī zuò chǎnpǐn xuānchuán de shíhou, chángcháng ràng wǒ bāngmáng pāi chǎnpǐn zhàopiàn.",null,"BODY579"],["4. Hỏi: 你有没有想放弃的时候？后来怎么办？ (Có lúc nào muốn bỏ không? Sau đó làm sao?)",null,null,"Nǐ yǒuméiyǒu xiǎng fàngqì de shíhou? Hòulái zěnmebàn?",null,"BODY580"],["Đáp: 有。工作最忙的那半年，我一张照片都没拍。后来我参加了一个摄影群，大家每周一起出去拍，我就又坚持下来了。 (Có. Nửa năm bận nhất tôi không chụp tấm nào. Sau tôi vào một nhóm nhiếp ảnh, mỗi tuần cùng đi chụp, tôi lại duy trì được.)",null,null,"Yǒu. Gōngzuò zuì máng de nà bànnián, wǒ yīzhāng zhàopiàn dōu méi pāi. Hòulái wǒ cānjiā le yīgè shèyǐng qún, dàjiā měizhōu yīqǐ chūqù pāi, wǒ jiù yòu jiānchí xiàlái le.",null,"BODY581"],["5. Hỏi: 如果给你一个月假期，你会怎么过？ (Nếu được nghỉ một tháng, bạn sẽ sống thế nào?)",null,null,"Rúguǒ gěi nǐ yīgèyuè jiàqī, nǐ huì zěnme guò?",null,"BODY582"],["Đáp: 我会背着相机从河内骑摩托车到河江，一路拍梯田和少数民族的村子。 (Tôi sẽ đeo máy ảnh đi xe máy từ Hà Nội lên Hà Giang, dọc đường chụp ruộng bậc thang và bản làng.)",null,null,"Wǒhuì bèizhe xiàngjī cóng Hénèi qí mótuōchē dào Héjiāng, yīlù pāi tītián hé shǎoshùmínzú de cūnzi.",null,"BODY583"],["情景模拟 ROLE-PLAY — HS thuyết phục GV thử sở thích mới. GV đưa lý do từ chối bất ngờ (没时间 / 太贵 / 怕受伤 / 年纪大了)",null,null,"Qíngjǐng mónǐ | Méi shíjiān | Tàiguì | Pà shòushāng | Niánjì dà le",null,"BODY584-C"],["HS: 老师，这个周末跟我们去三岛爬山吧！ (Cô/thầy ơi, cuối tuần này đi Tam Đảo leo núi với bọn em đi!)",null,null,"Lǎoshī, zhège zhōumò gēn wǒmen qù Sāndǎo páshān ba!",null,"BODY585"],["GV: 我平时不运动，怕爬不上去。 (Tôi bình thường không vận động, sợ leo không nổi.)",null,null,"Wǒ píngshí bù yùndòng, pà pá bù shàngqù.",null,"BODY586"],["HS: 别担心，三岛的路不难，我们可以走慢一点，累了就休息。 (Đừng lo, đường Tam Đảo không khó, mình đi chậm, mệt thì nghỉ.)",null,null,"Bié dānxīn, Sāndǎo de lù bùnán, wǒmen kěyǐ zǒu màn yīdiǎn, lèi le jiù xiūxi.",null,"BODY587"],["GV: 可是我周末要备课，没时间。 (Nhưng cuối tuần tôi phải soạn bài, không có thời gian.)",null,null,"Kěshì wǒ zhōumò yào bèikè, méi shíjiān.",null,"BODY588"],["HS: 我们早上六点出发，下午四点就回来了，不影响您晚上备课。 (Mình 6h sáng đi, 4h chiều về, không ảnh hưởng tối soạn bài.)",null,null,"Wǒmen zǎoshang liùdiǎn chūfā, xiàwǔ sìdiǎn jiù huílái le, bù yǐngxiǎng nín wǎnshàng bèikè.",null,"BODY589"],["GV: 听说山上的路很滑，我怕摔倒。 (Nghe nói đường núi trơn, tôi sợ ngã.)",null,null,"Tīngshuō shānshàng de lù hěn huá, wǒ pà shuāidǎo.",null,"BODY590"],["HS: 我们会带登山杖，而且我们有三个人，一直在您旁边。 (Bọn em mang gậy leo núi, lại có 3 người luôn ở cạnh.)",null,null,"Wǒmen huì dài dēngshān zhàng, érqiě wǒmen yǒu sāngè rén, yīzhí zài nín pángbiān.",null,"BODY591"],["GV: 那要准备什么呢？ (Vậy phải chuẩn bị gì?)",null,null,"Nà yào zhǔnbèi shénme ne?",null,"BODY592"],["HS: 一双舒服的运动鞋、一瓶水、一件外套就够了，其他的我们来准备。 (Một đôi giày thể thao êm, một chai nước, một áo khoác là đủ, còn lại bọn em lo.)",null,null,"Yīshuāng shūfu de yùndòngxié, yīpíng shuǐ, yījiàn wàitào jiù gòu le, qítā de wǒmen lái zhǔnbèi.",null,"BODY593"],["GV: 好吧，那我就试一次。 (Thôi được, vậy tôi thử một lần.)",null,null,"Hǎo ba, nà wǒ jiù shì yīcì.",null,"BODY594"],["HS: 太好了！您一定不会后悔的，山上的空气和风景比在家待着强多了！ (Tuyệt quá! Chắc chắn không hối hận đâu, không khí và cảnh trên núi hơn hẳn ở nhà!)",null,null,"Tàihǎole! Nín yīdìng bùhuì hòuhuǐ de, shānshàng de kōngqì hé fēngjǐng bǐ zàijiā dāizhe qiáng duō le!",null,"BODY595"],["Biến thể: thuyết phục học guitar / đi xem bóng ở sân Mỹ Đình / tham gia nhóm chạy bộ của công ty.",null,null,null,null,"BODY596"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY597-C"],["✗ 我的爱好是看足球。 → ✓ 我的爱好是看球 / 看足球比赛。",null,null,"Wǒ de àihào shì kàn zúqiú. | Wǒ de àihào shì kàn qiú | Kàn zúqiúbǐsài.",null,"BODY598"],["✗ 我很喜欢踢足球很多。 → ✓ 我非常喜欢踢足球。",null,null,"Wǒ hěn xǐhuan tīzúqiú hěnduō. | Wǒ fēicháng xǐhuan tīzúqiú.",null,"BODY599"],["✗ 我玩吉他。 → ✓ 我弹吉他。 (Đàn dây/phím dùng 弹; sáo dùng 吹; trống dùng 打.)",null,null,"Wǒ wán jítā. | Wǒ tánjítā. | Tán | Chuī | Dǎ .",null,"BODY600"],["✗ 我打足球。 → ✓ 我踢足球。 (Bóng rổ/cầu lông dùng 打; bóng đá dùng 踢.)",null,null,"Wǒ dǎ zúqiú. | Wǒ tīzúqiú. | Dǎ | Tī .",null,"BODY601"],["✗ 我对爬山有兴趣很大。 → ✓ 我对爬山很感兴趣。",null,null,"Wǒ duì páshān yǒu xìngqù hěndà. | Wǒ duì páshān hěngǎnxìngqù.",null,"BODY602"],["✗ 我坚持跑步每天。 → ✓ 我每天坚持跑步。",null,null,"Wǒ jiānchí pǎobù měitiān. | Wǒ měitiān jiānchí pǎobù.",null,"BODY603"],["✗ 我沉迷爬山。 (sai sắc thái – 沉迷 mang nghĩa xấu) → ✓ 我迷上了爬山 / 我爱上了爬山。",null,null,"Wǒ chénmí páshān. | Chénmí | Wǒ mí shàng le páshān | Wǒ ài shàng le páshān.",null,"BODY604"],["Phát âm: 吉他 jítā; 钢琴 gāngqín; 健身 jiànshēn; 自律 zìlǜ.",null,null,"Jítā | Gāngqín | Jiànshēn | Zìlǜ",null,"BODY605"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY606-C"],["Ghi âm lời thuyết phục 2 phút: thuyết phục một người bạn/đồng nghiệp thử sở thích của mình, nói đủ 4 ý, dùng ít nhất 3 mẫu câu (比起……更……/ 不仅……还……/ 自从……以后).",null,null,"Bǐqǐ…… gèng…… / | Bùjǐn…… hái…… / | Zìcóng…… yǐhòu",null,"BODY607"],["HSK5: thêm 1 phút nêu quan điểm về việc phụ thuộc điện thoại.",null,null,null,null,"BODY608"],["Luyện cặp: chọn 1 hội thoại sở thích gần với mình, đóng lại rồi thay bằng chuyện thật của mình.",null,null,null,null,"BODY609"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY610"],["Buổi 04 — 过去经历与难忘的事 Kể trải nghiệm",null,null,"Guòqù jīnglì yǔ nánwàng de shì",null,"BODY611-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY612-C"],["HSK4: Kể câu chuyện theo trình tự thời gian. HSK5: Phân tích một quyết định sai lầm và bài học.",null,null,null,null,"BODY613"],["Khung kể chuyện 5 bước: 背景 bối cảnh (khi nào, ở đâu, với ai) → 经过 diễn biến → 意外 sự cố / cao trào → 结果 kết quả → 感受 cảm nhận, bài học.",null,null,"Bèijǐng | Jīngguò | Yìwài | Jiéguǒ | Gǎnshòu",null,"BODY614"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY616-C"],["1. Hỏi: 你还记得你的第一份工作吗？第一天发生了什么？ (Còn nhớ công việc đầu tiên không? Ngày đầu xảy ra chuyện gì?)",null,null,"Nǐ hái jìde nǐ de dìyīfèn gōngzuò ma? Dìyītiān fāshēng le shénme?",null,"BODY617"],["Đáp: 记得。第一天我就迟到了，因为找不到公司的大门，在外面转了二十分钟。 (Nhớ chứ. Ngày đầu tôi đã đi muộn vì không tìm được cổng công ty, loanh quanh bên ngoài 20 phút.)",null,null,"Jìde. Dìyītiān wǒ jiù chídào le, yīnwèi zhǎo bùdào gōngsī de dàmén, zài wàimiàn zhuǎn le èrshífēnzhōng.",null,"BODY618"],["2. Hỏi: 你去过的地方里，哪里让你印象最深？ (Trong những nơi đã đến, nơi nào ấn tượng nhất?)",null,null,"Nǐ qùguò de dìfang lǐ, nǎlǐ ràng nǐ yìnxiàng zuìshēn?",null,"BODY619"],["Đáp: 下龙湾让我印象最深。我们在船上住了一晚，早上起来看到海上的日出，特别美。 (Vịnh Hạ Long ấn tượng nhất. Bọn tôi ngủ trên du thuyền một đêm, sáng dậy ngắm bình minh trên biển, đẹp vô cùng.)",null,null,"Xiàlóng Wān ràng wǒ yìnxiàng zuìshēn. Wǒmen zài chuánshàng zhù le yī wǎn, zǎoshang qǐlái kàndào hǎishàng de rìchū, tèbié měi.",null,"BODY620"],["3. Hỏi: 你有没有做过让自己后悔的事？ (Bạn có từng làm việc khiến mình hối hận không?)",null,null,"Nǐ yǒuméiyǒu zuò guò ràng zìjǐ hòuhuǐ de shì?",null,"BODY621"],["Đáp: 有。大学的时候我没有好好学英语，现在工作上需要的时候才后悔。 (Có. Hồi đại học tôi không chịu học tiếng Anh, giờ công việc cần mới hối hận.)",null,null,"Yǒu. Dàxué de shíhou wǒ méiyǒu hǎohǎoxué Yīngyǔ, xiànzài gōngzuò shàng xūyào de shíhou cái hòuhuǐ.",null,"BODY622"],["语言输入 INPUT — Từ / cụm dùng khi kể chuyện",null,null,"Yǔyán shūrù",null,"BODY623-C"],["1. 印象深刻 (ấn tượng sâu sắc): 那次去中国出差让我印象特别深刻。 (Chuyến công tác TQ lần đó khiến tôi ấn tượng sâu sắc.)",null,null,"Yìnxiàng shēnkè | Nàcì qù Zhōngguó chūchāi ràng wǒ yìnxiàng tèbié shēnkè.",null,"BODY624"],["2. 没想到 (không ngờ): 没想到客户第二天就决定下单了。 (Không ngờ hôm sau khách đã quyết định đặt hàng.)",null,null,"Méixiǎngdào | Méixiǎngdào kèhù dì'èrtiān jiù juédìng xiàdān le.",null,"BODY625"],["3. 突然 (đột nhiên): 正在开会的时候，突然停电了。 (Đang họp thì đột nhiên mất điện.)",null,null,"Tūrán | Zhèngzài kāihuì de shíhou, tūrán tíngdiàn le.",null,"BODY626"],["4. 幸亏 (may mà): 幸亏我带了备用电脑，不然报告就做不了了。 (May mà mang máy dự phòng, không thì không làm được báo cáo.)",null,null,"Xìngkuī | Xìngkuī wǒ dài le bèiyòng diànnǎo, bùrán bàogào jiù zuòbùliǎo le.",null,"BODY627"],["5. 后悔 (hối hận): 我很后悔当时没有听同事的建议。 (Tôi rất hối hận lúc đó không nghe lời khuyên đồng nghiệp.)",null,null,"Hòuhuǐ | Wǒ hěn hòuhuǐ dāngshí méiyǒu tīng tóngshì de jiànyì.",null,"BODY628"],["6. 吸取教训 (rút ra bài học): 这次我吸取了教训，每次发货前都会再检查一遍。 (Lần này tôi rút kinh nghiệm, mỗi lần giao hàng đều kiểm tra lại.)",null,null,"Xīqǔjiàoxùn | Zhècì wǒ xīqǔ le jiàoxùn, měicì fāhuò qián dōu huì zài jiǎnchá yībiàn.",null,"BODY629"],["7. 当时 (lúc đó): 当时我才二十二岁，什么都不懂。 (Lúc đó tôi mới 22 tuổi, chẳng biết gì.)",null,null,"Dāngshí | Dāngshí wǒ cái èrshí'èrsuì, shénme dōu bù dǒng.",null,"BODY630"],["8. 后来 (về sau): 后来我才知道，那个客户是老板的朋友。 (Về sau tôi mới biết khách đó là bạn của sếp.)",null,null,"Hòulái | Hòulái wǒ cái zhīdao, nàge kèhù shì lǎobǎn de péngyou.",null,"BODY631"],["9. 结果 (rốt cuộc): 我们等了三个小时，结果航班还是取消了。 (Đợi 3 tiếng, rốt cuộc chuyến bay vẫn bị hủy.)",null,null,"Jiéguǒ | Wǒmen děng le sāngè xiǎoshí, jiéguǒ hángbān háishì qǔxiāo le.",null,"BODY632"],["10. 好不容易 (vất vả lắm mới): 我们好不容易才找到那家酒店。 (Vất vả lắm mới tìm được khách sạn đó.)",null,null,"Hǎobùróngyì | Wǒmen hǎobùróngyì cái zhǎodào nà jiā jiǔdiàn.",null,"BODY633"],["11. 差点儿 (suýt nữa): 我差点儿错过了飞机。 (Tôi suýt lỡ chuyến bay.)",null,null,"Chàdiǎnr | Wǒ chàdiǎnr cuòguò le fēijī.",null,"BODY634"],["12. 从那以后 (từ đó về sau): 从那以后，我出门一定会多带一个充电宝。 (Từ đó, ra ngoài tôi nhất định mang thêm sạc dự phòng.)",null,null,"Cóngnàyǐhòu | Cóngnàyǐhòu, wǒ chūmén yīdìng huì duō dài yīgè chōngdiàn bǎo.",null,"BODY635"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY636-C"],["1. 有一次，…… (Có một lần, …)",null,null,"Yǒu yīcì,……",null,"BODY637"],["Ví dụ: 有一次，我一个人去广州出差，下了飞机才发现手机没电了。 (Có lần tôi đi công tác Quảng Châu một mình, xuống máy bay mới biết điện thoại hết pin.)",null,null,"Yǒu yīcì, wǒ yīgè rén qù Guǎngzhōu chūchāi, xià le fēijī cái fāxiàn shǒujī méi diàn le.",null,"BODY638"],["Ví dụ: 有一次，客户半夜十二点给我打电话，说货少了一箱。 (Có lần khách gọi cho tôi lúc 12h đêm, nói thiếu một thùng hàng.)",null,null,"Yǒu yīcì, kèhù bànyè shí'èrdiǎn gěi wǒ dǎdiànhuà, shuō huò shǎo le yīxiāng.",null,"BODY639"],["2. 正在……的时候，突然…… (Đang … thì đột nhiên …)",null,null,"Zhèngzài…… de shíhou, tūrán……",null,"BODY640"],["Ví dụ: 我正在给客户做演示的时候，投影仪突然坏了。 (Đang thuyết trình cho khách thì máy chiếu đột nhiên hỏng.)",null,null,"Wǒ zhèngzài gěi kèhù zuò yǎnshì de shíhou, tóuyǐngyí tūrán huài le.",null,"BODY641"],["Ví dụ: 我们正在吃饭的时候，突然下起了大雨。 (Đang ăn cơm thì đột nhiên mưa to.)",null,null,"Wǒmen zhèngzài chīfàn de shíhou, tūrán xià qǐ le dàyǔ.",null,"BODY642"],["3. 刚……就…… (Vừa … đã …)",null,null,"Gāng…… jiù……",null,"BODY643"],["Ví dụ: 我刚到酒店就接到了老板的电话。 (Vừa đến khách sạn đã nhận điện thoại sếp.)",null,null,"Wǒ gāng dào jiǔdiàn jiù jiēdào le lǎobǎn de diànhuà.",null,"BODY644"],["Ví dụ: 他刚入职三个月就升职了。 (Anh ấy vừa vào làm 3 tháng đã được thăng chức.)",null,null,"Tā gāng rùzhí sāngè yuè jiù shēngzhí le.",null,"BODY645"],["4. 幸亏……，不然…… (May mà …, không thì …)",null,null,"Xìngkuī……, bùrán……",null,"BODY646"],["Ví dụ: 幸亏有一个好心人帮我，不然我就找不到路了。 (May có người tốt bụng giúp, không thì tôi không tìm được đường.)",null,null,"Xìngkuī yǒu yīgè hǎoxīnrén bāng wǒ, bùrán wǒ jiù zhǎo bùdào lù le.",null,"BODY647"],["Ví dụ: 幸亏我提前备份了文件，不然一个星期的工作就白做了。 (May tôi sao lưu trước, không thì công sức một tuần đổ sông đổ biển.)",null,null,"Xìngkuī wǒ tíqián bèifèn le wénjiàn, bùrán yīgè xīngqī de gōngzuò jiù bái zuò le.",null,"BODY648"],["5. 本来以为……，没想到…… (Cứ tưởng …, không ngờ …)",null,null,"Běnlái yǐwéi……, méixiǎngdào……",null,"BODY649"],["Ví dụ: 我本来以为面试会很难，没想到面试官很友好。 (Cứ tưởng phỏng vấn khó, không ngờ người phỏng vấn rất thân thiện.)",null,null,"Wǒ běnlái yǐwéi miànshì huì hěn nán, méixiǎngdào miànshìguān hěn yǒuhǎo.",null,"BODY650"],["Ví dụ: 我本来以为这个客户不会再下单了，没想到他一次订了两个柜。 (Cứ tưởng khách này không đặt nữa, không ngờ đặt một lúc 2 container.)",null,null,"Wǒ běnlái yǐwéi zhège kèhù bùhuì zài xiàdān le, méixiǎngdào tā yīcì dìng le liǎnggè guì.",null,"BODY651"],["6. 先是……，接着……，最后…… (Đầu tiên …, tiếp đó …, cuối cùng …)",null,null,"Xiānshì……, jiēzhe……, zuìhòu……",null,"BODY652"],["Ví dụ: 先是航班延误，接着行李丢了，最后酒店又没有我的预订。 (Đầu tiên chuyến bay trễ, tiếp đó mất hành lý, cuối cùng khách sạn không có đặt phòng của tôi.)",null,null,"Xiānshì hángbān yánwù, jiēzhe xíngli diū le, zuìhòu jiǔdiàn yòu méiyǒu wǒ de yùdìng.",null,"BODY653"],["Ví dụ: 先是停电，接着网络断了，最后会议只好改到第二天。 (Đầu tiên mất điện, rồi mất mạng, cuối cùng họp đành dời sang hôm sau.)",null,null,"Xiānshì tíngdiàn, jiēzhe wǎngluò duàn le, zuìhòu huìyì zhǐhǎo gǎi dào dì'èrtiān.",null,"BODY654"],["7. 直到……才…… (Mãi đến … mới …)",null,null,"Zhídào…… cái……",null,"BODY655"],["Ví dụ: 直到下了飞机我才发现护照不见了。 (Mãi đến khi xuống máy bay tôi mới phát hiện mất hộ chiếu.)",null,null,"Zhídào xià le fēijī wǒ cái fāxiàn hùzhào bùjiàn le.",null,"BODY656"],["Ví dụ: 直到工作以后，我才明白父母的辛苦。 (Mãi đến khi đi làm, tôi mới hiểu bố mẹ vất vả thế nào.)",null,null,"Zhídào gōngzuò yǐhòu, wǒ cái míngbai fùmǔ de xīnkǔ.",null,"BODY657"],["8. 早知道……，我就…… (Biết trước …, tôi đã …)",null,null,"Zǎo zhīdao……, wǒ jiù……",null,"BODY658"],["Ví dụ: 早知道会堵车，我就提前一个小时出发了。 (Biết trước tắc đường, tôi đã đi sớm một tiếng.)",null,null,"Zǎo zhīdao huì dǔchē, wǒ jiù tíqián yīgè xiǎoshí chūfā le.",null,"BODY659"],["Ví dụ: 早知道这家公司这么乱，我就不跳槽了。 (Biết trước công ty này loạn thế, tôi đã không nhảy việc.)",null,null,"Zǎo zhīdao zhèjiā gōngsī zhème luàn, wǒ jiù bù tiàocáo le.",null,"BODY660"],["9. 经过这件事，我明白了…… (Qua chuyện này, tôi hiểu rằng …)",null,null,"Jīngguò zhèjiàn shì, wǒ míngbai le……",null,"BODY661"],["Ví dụ: 经过这件事，我明白了做事一定要留后路。 (Qua chuyện này tôi hiểu làm gì cũng phải có đường lùi.)",null,null,"Jīngguò zhèjiàn shì, wǒ míngbai le zuòshì yīdìng yào liúhòulù.",null,"BODY662"],["Ví dụ: 经过这件事，我明白了跟客户沟通一定要用书面确认。 (Qua chuyện này tôi hiểu trao đổi với khách phải xác nhận bằng văn bản.)",null,null,"Jīngguò zhèjiàn shì, wǒ míngbai le gēn kèhù gōutōng yīdìng yào yòng shūmiàn quèrèn.",null,"BODY663"],["10. (HSK5) 如果当时……，也许…… (Nếu lúc đó …, có lẽ …)",null,null,"Rúguǒ dāngshí……, yěxǔ……",null,"BODY664"],["Ví dụ: 如果当时我多问一句，也许就不会发错货了。 (Nếu lúc đó tôi hỏi thêm một câu, có lẽ đã không giao nhầm hàng.)",null,null,"Rúguǒ dāngshí wǒ duō wèn yījù, yěxǔ jiù bùhuì fācuò huò le.",null,"BODY665"],["Ví dụ: 如果当时我坚持学下去，也许现在钢琴已经弹得很好了。 (Nếu lúc đó tôi kiên trì học, có lẽ giờ đã đàn piano giỏi rồi.)",null,null,"Rúguǒ dāngshí wǒ jiānchí xué xiàqù, yěxǔ xiànzài gāngqín yǐjīng tán de hěn hǎo le.",null,"BODY666"],["11. (HSK5) 回过头来看，…… (Nhìn lại, …)",null,null,"Huíguòtóulái kàn,……",null,"BODY667"],["Ví dụ: 回过头来看，那次失败其实是我职业生涯的转折点。 (Nhìn lại, lần thất bại đó thực ra là bước ngoặt sự nghiệp của tôi.)",null,null,"Huíguòtóulái kàn, nàcì shībài qíshí shì wǒ zhíyèshēngyá de zhuǎnzhédiǎn.",null,"BODY668"],["Ví dụ: 回过头来看，那段最辛苦的日子让我成长得最快。 (Nhìn lại, quãng thời gian vất vả nhất giúp tôi trưởng thành nhanh nhất.)",null,null,"Huíguòtóulái kàn, nàduàn zuì xīnkǔ de rìzi ràng wǒ chéngzhǎng de zuìkuài.",null,"BODY669"],["情景对话 1 — Chuyến du lịch đáng nhớ: Sa Pa gặp mưa",null,null,"Qíngjǐng duìhuà",null,"BODY670-C"],["A: 国庆节你去哪儿玩了？ (Nghỉ lễ bạn đi chơi đâu?)",null,null,"Guóqìng Jié nǐ qù nǎr wán le?",null,"BODY671"],["B: 我和三个朋友去了沙坝，本来打算去爬番西邦。 (Tôi với 3 người bạn đi Sa Pa, định leo Fansipan.)",null,null,"Wǒ hé sāngè péngyou qù le Shābà, běnlái dǎsuàn qù pá Fānxībāng.",null,"BODY672"],["A: 爬上去了吗？ (Leo lên được không?)",null,null,"Páshàngqù le ma?",null,"BODY673"],["B: 没有。没想到第二天早上突然下起了大雨，缆车也停了。 (Không. Không ngờ sáng hôm sau đột nhiên mưa to, cáp treo cũng dừng.)",null,null,"Méiyǒu. Méixiǎngdào dì'èrtiān zǎoshang tūrán xià qǐ le dàyǔ, lǎnchē yě tíng le.",null,"BODY674"],["A: 啊，那太可惜了！你们怎么办？ (Ôi, tiếc quá! Thế các bạn làm sao?)",null,null,"A, nà tài kěxī le! Nǐmen zěnmebàn?",null,"BODY675"],["B: 当时我们都很失望，坐在酒店里不知道做什么。 (Lúc đó ai cũng thất vọng, ngồi trong khách sạn không biết làm gì.)",null,null,"Dāngshí wǒmen dōu hěn shīwàng, zuòzài jiǔdiàn lǐ bù zhīdao zuò shénme.",null,"BODY676"],["A: 然后呢？ (Rồi sao nữa?)",null,null,"Ránhòu ne?",null,"BODY677"],["B: 后来酒店老板推荐我们去附近的一个少数民族村子，叫猫猫村。 (Sau đó chủ khách sạn giới thiệu đi một bản dân tộc gần đó, bản Cát Cát.)",null,null,"Hòulái jiǔdiàn lǎobǎn tuījiàn wǒmen qù fùjìn de yīgè shǎoshùmínzú cūnzi, jiào Māomāo Cūn.",null,"BODY678"],["A: 下雨还去？路好走吗？ (Mưa vẫn đi à? Đường dễ đi không?)",null,null,"Xiàyǔ hái qù? Lù hǎo zǒu ma?",null,"BODY679"],["B: 不好走，我们穿着雨衣走了半个小时，鞋子全湿了。 (Không dễ, mặc áo mưa đi nửa tiếng, giày ướt hết.)",null,null,"Bùhǎo zǒu, wǒmen chuānzhe yǔyī zǒu le bàngè xiǎoshí, xiézi quánshī le.",null,"BODY680"],["A: 那村子怎么样？ (Bản làng thế nào?)",null,null,"Nà cūnzi zěnmeyàng?",null,"BODY681"],["B: 特别有意思！村里的人很热情，请我们喝自己酿的米酒，还教我们织布。 (Rất thú vị! Người trong bản rất nhiệt tình, mời uống rượu tự nấu, còn dạy dệt vải.)",null,null,"Tèbié yǒuyìsi! Cūnlǐ de rén hěn rèqíng, qǐng wǒmen hē zìjǐ niàng de mǐjiǔ, hái jiào wǒmen zhībù.",null,"BODY682"],["A: 听起来比爬山还好玩。 (Nghe còn vui hơn leo núi.)",null,null,"Tīng qǐlái bǐ páshān hái hǎowán.",null,"BODY683"],["B: 是啊！那天虽然没爬成山，但是成了我这次旅行最难忘的一天。 (Đúng vậy! Hôm đó tuy không leo được núi nhưng thành ngày đáng nhớ nhất chuyến đi.)",null,null,"Shì a! Nàtiān suīrán méi pá chéngshān, dànshì chéng le wǒ zhècì lǚxíng zuì nánwàng de yītiān.",null,"BODY684"],["A: 下次还想去爬番西邦吗？ (Lần sau còn muốn leo Fansipan không?)",null,null,"Xiàcì hái xiǎng qù pá Fānxībāng ma?",null,"BODY685"],["B: 当然想！经过这件事我明白了，计划被打乱了不一定是坏事。 (Muốn chứ! Qua chuyện này tôi hiểu kế hoạch bị đảo lộn chưa chắc đã là chuyện xấu.)",null,null,"Dāngrán xiǎng! Jīngguò zhèjiàn shì wǒ míngbai le, jìhuà bèidǎluàn le bù yīdìng shì huàishì.",null,"BODY686"],["情景对话 2 — Lần đầu đi công tác Trung Quốc: không gọi được taxi",null,null,"Qíngjǐng duìhuà",null,"BODY687-C"],["A: 你第一次去中国是什么时候？ (Lần đầu bạn sang TQ là khi nào?)",null,null,"Nǐ dìyīcì qù Zhōngguó shì shénme shíhou?",null,"BODY688"],["B: 三年前，公司派我去深圳参加一个电子展。 (3 năm trước, công ty cử tôi đi Thâm Quyến dự triển lãm điện tử.)",null,null,"Sānnián qián, gōngsī pài wǒ qù Shēnzhèn cānjiā yīgè diànzizhǎn.",null,"BODY689"],["A: 那时候你的中文怎么样？ (Hồi đó tiếng Trung của bạn thế nào?)",null,null,"Nà shíhou nǐ de Zhōngwén zěnmeyàng?",null,"BODY690"],["B: 不太好，只会说一些简单的句子。刚到机场我就遇到麻烦了。 (Không tốt lắm, chỉ nói được vài câu đơn giản. Vừa đến sân bay đã gặp rắc rối.)",null,null,"Bùtàihǎo, zhǐ huì shuō yīxiē jiǎndān de jùzi. Gāng dào jīchǎng wǒ jiù yùdào máfan le.",null,"BODY691"],["A: 什么麻烦？ (Rắc rối gì?)",null,null,"Shénme máfan?",null,"BODY692"],["B: 我叫不到出租车。司机都要扫码付款，可是我的手机没有中国的支付软件。 (Tôi không gọi được taxi. Tài xế đều đòi quét mã, mà điện thoại tôi không có app thanh toán TQ.)",null,null,"Wǒ jiào bùdào chūzūchē. Sījī dōu yào sǎo mǎ fùkuǎn, kěshì wǒ de shǒujī méiyǒu Zhōngguó de zhīfù ruǎnjiàn.",null,"BODY693"],["A: 你没带现金吗？ (Bạn không mang tiền mặt à?)",null,null,"Nǐ méi dài xiànjīn ma?",null,"BODY694"],["B: 带了，可是好几个司机都说找不开一百块。我急得满头大汗。 (Có mang, nhưng mấy tài xế đều bảo không có tiền thối tờ 100 tệ. Tôi cuống đến toát mồ hôi.)",null,null,"Dài le, kěshì hǎojǐgè sījī dōu shuō zhǎo bù kāi yībǎikuài. Wǒ jí de mǎntóudàhán.",null,"BODY695"],["A: 后来呢？ (Sau đó thì sao?)",null,null,"Hòulái ne?",null,"BODY696"],["B: 幸亏旁边有一位大姐看出来我是外国人，主动帮我叫了车，还用她的手机帮我付了钱。 (May có một chị bên cạnh nhận ra tôi là người nước ngoài, chủ động gọi xe giúp, còn trả tiền bằng điện thoại của chị ấy.)",null,null,"Xìngkuī pángbiān yǒu yīwèi dàjiě kàn chūlái wǒ shì wàiguórén, zhǔdòng bāng wǒ jiào le chē, hái yòng tā de shǒujī bāng wǒ fù le qián.",null,"BODY697"],["A: 真是个好人！你把钱还给她了吗？ (Đúng là người tốt! Bạn trả tiền lại cho chị ấy chưa?)",null,null,"Zhēnshì gè hǎorén! Nǐ bǎ qián huángěi tā le ma?",null,"BODY698"],["B: 还了，我给了她一百块现金，她还非要找我钱。 (Trả rồi, tôi đưa chị 100 tệ tiền mặt, chị còn nhất quyết thối lại.)",null,null,"Hái le, wǒ gěi le tā yībǎikuài xiànjīn, tā hái fēi yào zhǎo wǒ qián.",null,"BODY699"],["A: 这次经历对你有什么影响？ (Trải nghiệm này ảnh hưởng gì đến bạn?)",null,null,"Zhècì jīnglì duì nǐ yǒu shénme yǐngxiǎng?",null,"BODY700"],["B: 从那以后，每次出国之前，我都会先把当地的支付软件和地图软件准备好。 (Từ đó, mỗi lần ra nước ngoài, tôi đều cài sẵn app thanh toán và bản đồ địa phương.)",null,null,"Cóngnàyǐhòu, měicì chūguó zhīqián, wǒ dōu huì xiān bǎ dāngdì de zhīfù ruǎnjiàn hé dìtú ruǎnjiàn zhǔnbèi hǎo.",null,"BODY701"],["A: 而且你的中文也进步了很多吧？ (Mà tiếng Trung của bạn cũng tiến bộ nhiều nhỉ?)",null,null,"Érqiě nǐ de Zhōngwén yě jìnbù le hěnduō ba?",null,"BODY702"],["B: 对，那次回来以后，我就下决心报名学中文了。 (Đúng, lần đó về tôi quyết tâm đăng ký học tiếng Trung.)",null,null,"Duì, nàcì huílái yǐhòu, wǒ jiù xiàjuéxīn bàomíng xué Zhōngwén le.",null,"BODY703"],["情景对话 3 — Sự cố công việc: kho giao nhầm hàng",null,null,"Qíngjǐng duìhuà",null,"BODY704-C"],["经理: 小阮，听说上个月王总那边的货出问题了？ (Tiểu Nguyễn, nghe nói tháng trước hàng bên Vương tổng có vấn đề?)",null,null,"Jīnglǐ: Xiǎo Ruǎn, tīngshuō shànggèyuè Wáng zǒng nàbiān de huò chū wèntí le?",null,"BODY705"],["小阮: 是的，经理。仓库把两个订单的货装反了，王总收到的是另一个客户的货。 (Vâng, giám đốc. Kho xếp nhầm hàng hai đơn, Vương tổng nhận phải hàng của khách khác.)",null,null,"Xiǎo Ruǎn: shì de, jīnglǐ. Cāngkù bǎ liǎnggè dìngdān de huò zhuāng fǎn le, Wáng zǒng shōudào de shì lìng yīgè kèhù de huò.",null,"BODY706"],["经理: 王总什么反应？ (Vương tổng phản ứng thế nào?)",null,null,"Jīnglǐ: Wáng zǒng shénme fǎnyìng?",null,"BODY707"],["小阮: 非常生气，打电话来说要取消合作。当时我压力特别大。 (Rất tức giận, gọi điện đòi hủy hợp tác. Lúc đó tôi áp lực vô cùng.)",null,null,"Xiǎo Ruǎn: fēicháng shēngqì, dǎdiànhuà láishuō yào qǔxiāo hézuò. Dāngshí wǒ yālì tèbié dà.",null,"BODY708"],["经理: 你是怎么处理的？ (Bạn xử lý thế nào?)",null,null,"Jīnglǐ: nǐ shì zěnme chǔlǐ de?",null,"BODY709"],["小阮: 我先跟王总道歉，然后马上去仓库核对，确认是我们装错了。 (Tôi xin lỗi Vương tổng trước, rồi xuống kho đối chiếu ngay, xác nhận là bên mình xếp nhầm.)",null,null,"Xiǎo Ruǎn: wǒ xiān gēn Wáng zǒng dàoqiàn, ránhòu mǎshàng qù cāngkù héduì, quèrèn shì wǒmen zhuāngcuò le.",null,"BODY710"],["经理: 接着呢？ (Tiếp theo?)",null,null,"Jīnglǐ: jiēzhe ne?",null,"BODY711"],["小阮: 接着我们安排了加急物流，第二天就把正确的货送到了，运费由我们承担。 (Tiếp đó bên mình gửi chuyển phát nhanh, hôm sau đã giao đúng hàng, phí vận chuyển mình chịu.)",null,null,"Xiǎo Ruǎn: jiēzhe wǒmen ānpái le jiājí wùliú, dì'èrtiān jiù bǎ zhèngquè de huò sòngdào le, yùnfèi yóu wǒmen chéngdān.",null,"BODY712"],["经理: 那另一个客户呢？ (Còn khách kia thì sao?)",null,null,"Jīnglǐ: nà lìng yīgè kèhù ne?",null,"BODY713"],["小阮: 另一个客户还没发现，我们在他收货之前就联系他了，他很理解。 (Khách kia chưa phát hiện, mình liên hệ trước khi họ nhận hàng, họ rất thông cảm.)",null,null,"Xiǎo Ruǎn: lìng yīgè kèhù hái méi fāxiàn, wǒmen zài tā shōuhuò zhīqián jiù liánxì tā le, tā hěn lǐjiě.",null,"BODY714"],["经理: 最后王总还继续合作吗？ (Cuối cùng Vương tổng có tiếp tục hợp tác không?)",null,null,"Jīnglǐ: zuìhòu Wáng zǒng hái jìxù hézuò ma?",null,"BODY715"],["小阮: 继续合作了。他虽然有点不满意，但是觉得我们处理得很快。 (Vẫn hợp tác. Tuy hơi không hài lòng nhưng thấy bên mình xử lý rất nhanh.)",null,null,"Xiǎo Ruǎn: jìxù hézuò le. Tā suīrán yǒudiǎn bù mǎnyì, dànshì juéde wǒmen chǔlǐ de hěnkuài.",null,"BODY716"],["经理: 这件事以后，我们要怎么避免？ (Sau chuyện này, mình phải tránh thế nào?)",null,null,"Jīnglǐ: zhèjiàn shì yǐhòu, wǒmen yào zěnme bìmiǎn?",null,"BODY717"],["小阮: 我建议改一下流程：每次装柜之前，业务员和仓管都要一起拍照确认。 (Tôi đề nghị sửa quy trình: mỗi lần đóng container, nhân viên kinh doanh và thủ kho cùng chụp ảnh xác nhận.)",null,null,"Xiǎo Ruǎn: wǒ jiànyì gǎi yīxià liúchéng: měicì zhuāng guì zhīqián, yèwùyuán hé cāng guǎn dōu yào yīqǐ pāizhào quèrèn.",null,"BODY718"],["经理: 好主意，你写一个方案，下周一开会讨论。 (Ý hay, bạn viết phương án, thứ 2 tuần sau họp bàn.)",null,null,"Jīnglǐ: hǎo zhǔyì, nǐ xiě yīgè fāng'àn, xiàzhōuyī kāihuìtǎolùn.",null,"BODY719"],["情景对话 4 — (HSK5) Quyết định sai lầm: nhảy việc vì lương",null,null,"Qíngjǐng duìhuà",null,"BODY720-C"],["A: 你之前好像换过一次工作，后来又回来了？ (Hình như trước đây bạn từng đổi việc rồi lại quay về?)",null,null,"Nǐ zhīqián hǎoxiàng huàn guò yīcì gōngzuò, hòulái yòu huílái le?",null,"BODY721"],["B: 对。回过头来看，那是我职业生涯中最大的错误。 (Đúng. Nhìn lại, đó là sai lầm lớn nhất sự nghiệp của tôi.)",null,null,"Duì. Huíguòtóulái kàn, nà shì wǒ zhíyèshēngyá zhōng zuìdà de cuòwù.",null,"BODY722"],["A: 为什么这么说？当时为什么要走？ (Sao lại nói vậy? Lúc đó sao lại đi?)",null,null,"Wèishénme zhème shuō? Dāngshí wèishénme yào zǒu?",null,"BODY723"],["B: 当时一家公司给我开的工资比原来高百分之三十，我没怎么考虑就答应了。 (Lúc đó một công ty trả lương cao hơn 30%, tôi chẳng cân nhắc mấy đã nhận lời.)",null,null,"Dāngshí yījiā gōngsī gěi wǒ kāi de gōngzī bǐ yuánlái gāo bǎifēnzhīsānshí, wǒ méi zěnme kǎolǜ jiù dāying le.",null,"BODY724"],["A: 工资高很多啊，不心动也难。 (Lương cao hơn nhiều vậy, khó mà không động lòng.)",null,null,"Gōngzī gāo hěnduō a, bù xīndòng yě nán.",null,"BODY725"],["B: 是啊。可是入职以后才发现，那家公司管理很混乱，加班是家常便饭。 (Đúng thế. Nhưng vào làm mới phát hiện công ty quản lý rất lộn xộn, tăng ca như cơm bữa.)",null,null,"Shì a. Kěshì rùzhí yǐhòu cái fāxiàn, nà jiā gōngsī guǎnlǐ hěn hùnluàn, jiābān shì jiāchángbiànfàn.",null,"BODY726"],["A: 加班有加班费吗？ (Tăng ca có tiền tăng ca không?)",null,null,"Jiābān yǒu jiābānfèi ma?",null,"BODY727"],["B: 说好的有，可是一直拖着不发，答应的年终奖也没有了。 (Nói là có, nhưng cứ khất mãi không trả, thưởng cuối năm đã hứa cũng không có.)",null,null,"Shuōhǎo de yǒu, kěshì yīzhí tuō zhe bù fā, dāying de niánzhōngjiǎng yě méiyǒu le.",null,"BODY728"],["A: 那你坚持了多久？ (Vậy bạn trụ được bao lâu?)",null,null,"Nà nǐ jiānchí le duōjiǔ?",null,"BODY729"],["B: 八个月。最后实在受不了，就联系了以前的经理，没想到他很欢迎我回去。 (8 tháng. Cuối cùng không chịu nổi, liên hệ giám đốc cũ, không ngờ ông ấy rất hoan nghênh tôi quay lại.)",null,null,"Bāgè yuè. Zuìhòu shízài shòubùliǎo, jiù liánxì le yǐqián de jīnglǐ, méixiǎngdào tā hěn huānyíng wǒ huíqù.",null,"BODY730"],["A: 如果重新选择，你会怎么做？ (Nếu được chọn lại, bạn sẽ làm thế nào?)",null,null,"Rúguǒ chóngxīn xuǎnzé, nǐ huì zěnme zuò?",null,"BODY731"],["B: 如果当时我多花点时间了解那家公司，比如问问在那儿工作过的朋友，也许就不会做这个决定了。 (Nếu lúc đó tôi chịu tìm hiểu công ty kỹ hơn, như hỏi bạn bè từng làm ở đó, có lẽ đã không quyết định vậy.)",null,null,"Rúguǒ dāngshí wǒ duō huā diǎn shíjiān liǎojiě nà jiā gōngsī, bǐrú wènwen zài nàr gōngzuò guò de péngyou, yěxǔ jiù bùhuì zuò zhège juédìng le.",null,"BODY732"],["A: 这件事让你学到了什么？ (Chuyện này dạy bạn điều gì?)",null,null,"Zhèjiàn shì ràng nǐ xuédào le shénme?",null,"BODY733"],["B: 工资固然重要，但公司的文化和发展空间更重要。 (Lương tất nhiên quan trọng, nhưng văn hóa và cơ hội phát triển còn quan trọng hơn.)",null,null,"Gōngzī gùrán zhòngyào, dàn gōngsī de wénhuà hé fāzhǎn kōngjiān gèng zhòngyào.",null,"BODY734"],["A: 那你现在做决定的时候会怎么做？ (Vậy giờ khi quyết định bạn làm thế nào?)",null,null,"Nà nǐ xiànzài zuò juédìng de shíhou huì zěnme zuò?",null,"BODY735"],["B: 我会把优缺点都列出来，至少考虑一个星期，还会问问家人和前辈的意见。 (Tôi liệt kê ưu nhược điểm, cân nhắc ít nhất một tuần, còn hỏi ý kiến gia đình và người đi trước.)",null,null,"Wǒhuì bǎ yōuquēdiǎn dōu lièchūlái, zhìshǎo kǎolǜ yīgè xīngqī, hái huì wènwen jiārén hé qiánbèi de yìjiàn.",null,"BODY736"],["情景对话 5 — Kỷ niệm thời sinh viên: cuộc thi hùng biện tiếng Trung",null,null,"Qíngjǐng duìhuà",null,"BODY737-C"],["A: 你大学的时候参加过什么比赛吗？ (Hồi đại học bạn tham gia cuộc thi gì không?)",null,null,"Nǐ dàxué de shíhou cānjiā guò shénme bǐsài ma?",null,"BODY738"],["B: 参加过中文演讲比赛，那是我第一次上台。 (Có tham gia thi hùng biện tiếng Trung, đó là lần đầu tôi lên sân khấu.)",null,null,"Cānjiā guò Zhōngwén yǎnjiǎngbǐsài, nà shì wǒ dìyīcì shàngtái.",null,"BODY739"],["A: 准备了多久？ (Chuẩn bị bao lâu?)",null,null,"Zhǔnbèi le duōjiǔ?",null,"BODY740"],["B: 整整一个月，每天对着镜子练。 (Tròn một tháng, ngày nào cũng tập trước gương.)",null,null,"Zhěngzhěng yīgèyuè, měitiān duì zhe jìngzi liàn.",null,"BODY741"],["A: 比赛那天顺利吗？ (Hôm thi suôn sẻ không?)",null,null,"Bǐsài nàtiān shùnlì ma?",null,"BODY742"],["B: 一点也不顺利！一上台，我看到下面坐着几百个人，脑子突然一片空白。 (Chẳng suôn sẻ chút nào! Vừa lên sân khấu, thấy mấy trăm người bên dưới, đầu óc tự nhiên trống rỗng.)",null,null,"Yīdiǎn yě bù shùnlì! Yīshàngtái, wǒ kàndào xiàmiàn zuò zhe jǐbǎigè rén, nǎozi tūrán yīpiànkòngbái.",null,"BODY743"],["A: 天哪！那怎么办？ (Trời! Vậy làm sao?)",null,null,"Tiān nǎ! Nà zěnmebàn?",null,"BODY744"],["B: 我站在台上愣了十几秒，忘了一半的内容，后来只好按照自己的理解说下去。 (Tôi đứng sững hơn chục giây, quên nửa bài, sau đành nói theo cách hiểu của mình.)",null,null,"Wǒ zhàn zài táishàng lèng le shíjǐmiǎo, wàng le yībàn de nèiróng, hòulái zhǐhǎo ànzhào zìjǐ de lǐjiě shuō xiàqù.",null,"BODY745"],["A: 结果呢？ (Kết quả thế nào?)",null,null,"Jiéguǒ ne?",null,"BODY746"],["B: 没想到最后还拿了三等奖！评委说我虽然忘词了，但是反应很快，说得很自然。 (Không ngờ cuối cùng còn được giải ba! Giám khảo bảo tuy quên lời nhưng phản ứng nhanh, nói tự nhiên.)",null,null,"Méixiǎngdào zuìhòu hái ná le sānděngjiǎng! Píngwěi shuō wǒ suīrán wàngcí le, dànshì fǎnyìng hěnkuài, shuō de hěn zìrán.",null,"BODY747"],["A: 太厉害了！这次比赛对你有什么影响？ (Giỏi quá! Cuộc thi ảnh hưởng gì đến bạn?)",null,null,"Tài lìhai le! Zhècì bǐsài duì nǐ yǒu shénme yǐngxiǎng?",null,"BODY748"],["B: 它让我明白，紧张不可怕，重要的是不放弃。现在我开会发言也不怎么紧张了。 (Nó cho tôi hiểu căng thẳng không đáng sợ, quan trọng là không bỏ cuộc. Giờ phát biểu trong họp tôi cũng không mấy căng thẳng.)",null,null,"Tā ràng wǒ míngbai, jǐnzhāng bù kěpà, zhòngyào de shì bù fàngqì. Xiànzài wǒ kāihuì fāyán yě bùzěnme jǐnzhāng le.",null,"BODY749"],["CÂU GV DÙNG ĐỂ NGẮT / ĐẨY CÂU CHUYỆN — HS phải phản ứng ngay",null,null,null,null,"BODY750-C"],["然后呢？/ 后来怎么样了？ (Rồi sao nữa? / Sau đó thế nào?)",null,null,"Ránhòu ne? / | Hòulái zěnmeyàng le?",null,"BODY751"],["为什么会这样？ (Sao lại như vậy?)",null,null,"Wèishénme huì zhèyàng?",null,"BODY752"],["你当时是什么感觉？ (Lúc đó bạn cảm thấy thế nào?)",null,null,"Nǐ dāngshí shì shénme gǎnjué?",null,"BODY753"],["如果是现在的你，你会怎么做？ (Nếu là bạn bây giờ, bạn sẽ làm gì?)",null,null,"Rúguǒ shì xiànzài de nǐ, nǐ huì zěnme zuò?",null,"BODY754"],["等一下，你刚才说的\"他\"是谁？ (Khoan, \"anh ấy\" vừa rồi là ai?)",null,null,"Děng yīxià, nǐ gāngcái shuō de \"tā\" shì shuí?",null,"BODY755"],["Câu HS dùng để giữ lượt / quay lại mạch: 我接着说……/ 说到哪儿了？哦，对了……/ 是这样的……/ 简单来说就是……",null,null,"Wǒ jiēzhe shuō…… / | Shuō dào nǎr le? Ó, duì le…… / | Shì zhèyàng de…… / | Jiǎndān láishuō jiùshì……",null,"BODY756"],["引导练习 GUIDED SPEAKING — HS chọn 1 đề, kể 1–2 phút theo khung 5 bước",null,null,"Yǐndǎo liànxí",null,"BODY757-C"],["1. Hỏi: 说说一次让你很开心的经历。 (Kể một trải nghiệm khiến bạn rất vui.)",null,null,"Shuōshuo yīcì ràng nǐ hěn kāixīn de jīnglì.",null,"BODY758"],["Đáp: 去年我生日那天，同事们偷偷给我准备了一个蛋糕。我本来以为大家都忘了，没想到下班的时候灯突然关了，大家唱着生日歌走进来，我感动得差点哭了。 (Sinh nhật tôi năm ngoái, đồng nghiệp lén chuẩn bị bánh kem. Tôi cứ tưởng mọi người quên, không ngờ lúc tan làm đèn đột nhiên tắt, mọi người hát mừng sinh nhật bước vào, tôi xúc động suýt khóc.)",null,null,"Qùnián wǒ shēngrì nàtiān, tóngshì men tōutōu gěi wǒ zhǔnbèi le yīgè dàngāo. Wǒ běnlái yǐwéi dàjiā dōu wàng le, méixiǎngdào xiàbān de shíhou dēng tūrán guān le, dàjiā chàng zhe shēngrìgē zǒujìn lái, wǒ gǎndòng de chàdiǎn kū le.",null,"BODY759"],["2. Hỏi: 说说一次让你很尴尬的经历。 (Kể một lần rất xấu hổ.)",null,null,"Shuōshuo yīcì ràng nǐ hěn gāngà de jīnglì.",null,"BODY760"],["Đáp: 有一次开视频会议，我以为摄像头关了，就一边开会一边吃泡面，结果客户都看到了。 (Có lần họp video, tôi tưởng camera tắt nên vừa họp vừa ăn mì, rốt cuộc khách thấy hết.)",null,null,"Yǒu yīcì kāi shìpínhuìyì, wǒ yǐwéi shèxiàngtóu guān le, jiù yībiān kāihuì yībiān chī pàomiàn, jiéguǒ kèhù dōu kàndào le.",null,"BODY761"],["3. Hỏi: 说说你在工作中遇到的一个大麻烦。 (Kể một rắc rối lớn trong công việc.)",null,null,"Shuōshuo nǐ zài gōngzuò zhōng yùdào de yīgè dà máfan.",null,"BODY762"],["Đáp: 有一次公司系统突然崩溃，所有订单数据都看不到了。幸亏我每天都把重要订单导出一份表格，不然那天的货一件都发不了。 (Có lần hệ thống công ty sập, không xem được dữ liệu đơn hàng. May tôi ngày nào cũng xuất bảng đơn quan trọng, không thì hôm đó không giao được món nào.)",null,null,"Yǒu yīcì gōngsī xìtǒng tūrán bēngkuì, suǒyǒu dìngdān shùjù dōu kànbùdào le. Xìngkuī wǒ měitiān dōu bǎ zhòngyào dìngdān dǎochū yīfèn biǎogé, bùrán nàtiān de huò yījiàn dōu fā bùliǎo.",null,"BODY763"],["4. Hỏi: (HSK5) 说说一个你后悔的决定，以及你学到了什么。 (Kể một quyết định bạn hối hận và điều học được.)",null,null,"Shuōshuo yīgè nǐ hòuhuǐ de juédìng, yǐjí nǐ xuédào le shénme.",null,"BODY764"],["Đáp: 我后悔当初为了省钱没买旅游保险。那次在泰国生病住院，花了两千多万盾。从那以后，不管去哪儿我都先买保险。 (Tôi hối hận lúc đó vì tiết kiệm mà không mua bảo hiểm du lịch. Lần ấy ốm nằm viện ở Thái Lan mất hơn 20 triệu. Từ đó đi đâu tôi cũng mua bảo hiểm trước.)",null,null,"Wǒ hòuhuǐ dāngchū wèile shěngqián méi mǎi lǚyóu bǎoxiǎn. Nàcì zài Tàiguó shēngbìng zhùyuàn, huā le liǎngqiānduōwàn dùn. Cóngnàyǐhòu, bùguǎn qù nǎr wǒ dōu xiānmǎi bǎoxiǎn.",null,"BODY765"],["情景模拟 ROLE-PLAY — HS kể, GV liên tục ngắt bằng 然后呢？为什么？; vòng 2 GV cố tình hiểu sai chi tiết, HS phải giải thích lại",null,null,"Qíngjǐng mónǐ | Ránhòu ne? Wèishénme?",null,"BODY766-C"],["HS: 有一次我去芽庄出差，结果酒店把我的房间给了别人。 (Có lần tôi đi công tác Nha Trang, rốt cuộc khách sạn đưa phòng của tôi cho người khác.)",null,null,"Yǒu yīcì wǒ qù Yázhuāng chūchāi, jiéguǒ jiǔdiàn bǎ wǒ de fángjiān gěi le biérén.",null,"BODY767"],["GV: 为什么会这样？ (Sao lại vậy?)",null,null,"Wèishénme huì zhèyàng?",null,"BODY768"],["HS: 他们说我的预订没有付定金，所以系统自动取消了。 (Họ nói tôi đặt phòng chưa đặt cọc nên hệ thống tự hủy.)",null,null,"Tāmen shuō wǒ de yùdìng méiyǒu fùdìngjīn, suǒyǐ xìtǒng zìdòng qǔxiāo le.",null,"BODY769"],["GV: 然后呢？你怎么办？ (Rồi sao? Bạn làm thế nào?)",null,null,"Ránhòu ne? Nǐ zěnmebàn?",null,"BODY770"],["HS: 我先给订房网站打电话，他们确认是酒店的问题，因为我已经付过钱了。 (Tôi gọi trang đặt phòng trước, họ xác nhận lỗi do khách sạn vì tôi đã trả tiền rồi.)",null,null,"Wǒ xiān gěi dìngfángwǎng zhàn dǎdiànhuà, tāmen quèrèn shì jiǔdiàn de wèntí, yīnwèi wǒ yǐjīng fù guò qián le.",null,"BODY771"],["GV: 那你当时是什么感觉？ (Lúc đó bạn cảm thấy thế nào?)",null,null,"Nà nǐ dāngshí shì shénme gǎnjué?",null,"BODY772"],["HS: 特别生气，因为已经晚上十一点了，第二天早上还要见客户。 (Rất tức, vì đã 11h đêm, sáng hôm sau còn gặp khách.)",null,null,"Tèbié shēngqì, yīnwèi yǐjīng wǎnshàng shíyīdiǎn le, dì'èrtiān zǎoshang háiyào jiàn kèhù.",null,"BODY773"],["GV: 后来酒店给你换了一家吗？ (Sau đó khách sạn đổi cho bạn khách sạn khác à?)",null,null,"Hòulái jiǔdiàn gěi nǐ huàn le yījiā ma?",null,"BODY774"],["HS: 不是，后来酒店给我升级到了海景房。 (Không, sau đó khách sạn nâng hạng cho tôi lên phòng hướng biển.)",null,null,"Bùshì, hòulái jiǔdiàn gěi wǒ shēngjí
