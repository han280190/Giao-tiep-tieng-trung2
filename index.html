 kèhù kěnéng huì xiān tuīcí yīliǎngcì, zhè shì kèqi, nǐ zài jiānchí yīxià jiù hǎo le.",null,"BODY283"],["小芳: 原来推辞也是礼貌的一部分。我记下来了，谢谢！ (Hóa ra từ chối cũng là một phần lịch sự. Mình ghi lại rồi, cảm ơn!)",null,null,"Xiǎo Fāng: yuánlái tuīcí yě shì lǐmào de yībùfen. Wǒ jìxiàlái le, xièxie!",null,"BODY284"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY285-C"],["1. Hỏi: 请比较一下越南和中国的饮食习惯。 (So sánh thói quen ăn uống của VN và TQ.)",null,null,"Qǐng bǐjiào yīxià Yuènán hé Zhōngguó de yǐnshíxíguàn.",null,"BODY286"],["Đáp: 在越南通常吃得比较清淡，喜欢用鱼露和很多生菜；而在中国，各个地方差别很大，四川菜很辣，广东菜比较清淡。另外，越南人一般最后喝汤，中国很多地方先喝汤。 (Ở VN thường ăn thanh, thích nước mắm và nhiều rau sống; còn ở TQ mỗi vùng khác nhau nhiều, món Tứ Xuyên rất cay, món Quảng Đông thanh hơn. Ngoài ra người Việt thường húp canh sau cùng, nhiều nơi TQ uống canh trước.)",null,null,"Zài Yuènán tōngcháng chī de bǐjiào qīngdàn, xǐhuan yòng yúlù hé hěnduō shēngcài; ér zài Zhōngguó, gègè dìfang chābié hěndà, Sìchuāncài hěn là, Guǎngdōngcài bǐjiào qīngdàn. Lìngwài, Yuènánrén yībān zuìhòu hētāng, Zhōngguó hěnduō dìfang xiān hētāng.",null,"BODY287"],["2. Hỏi: 如果你有一个中国朋友第一次来越南，你会给他什么建议？ (Nếu bạn TQ lần đầu đến VN, bạn sẽ khuyên gì?)",null,null,"Rúguǒ nǐ yǒu yīgè Zhōngguó péngyou dìyīcì lái Yuènán, nǐ huì gěi tā shénme jiànyì?",null,"BODY288"],["Đáp: 我会建议他：第一，过马路要慢慢走，摩托车会让你；第二，吃饭的时候试试生菜和鱼露；第三，问年龄不是不礼貌，是为了称呼。入乡随俗就好。 (Một, qua đường đi từ từ, xe máy sẽ tránh; hai, ăn cơm thử rau sống và nước mắm; ba, hỏi tuổi không phải bất lịch sự mà để xưng hô. Nhập gia tùy tục là được.)",null,null,"Wǒhuì jiànyì tā: dìyī, guò mǎlù yào mànmàn zǒu, mótuōchē huì ràng nǐ; dì'èr, chīfàn de shíhou shìshi shēngcài hé yúlù; dìsān, wèn niánlíng bùshì bù lǐmào, shì wèile chēnghu. Rùxiāngsuísú jiù hǎo.",null,"BODY289"],["3. Hỏi: 你遇到过因为文化差异造成的误会吗？ (Bạn từng gặp hiểu lầm do khác biệt văn hóa chưa?)",null,null,"Nǐ yùdào guò yīnwèi wénhuàchāyì zàochéng de wùhuì ma?",null,"BODY290"],["Đáp: 遇到过。中国同事第一次说\"改天请你吃饭\"，我一直等他约我，后来才知道那只是客套话。 (Có. Lần đầu đồng nghiệp TQ nói \"hôm nào mời bạn ăn cơm\", tôi cứ chờ anh ấy hẹn, sau mới biết đó chỉ là lời khách sáo.)",null,null,"Yùdào guò. Zhōngguó tóngshì dìyīcì shuō \"gǎitiān qǐng nǐ chīfàn\", wǒ yīzhí děng tā yuē wǒ, hòulái cái zhīdao nà zhǐshì kètàohuà.",null,"BODY291"],["4. Hỏi: (HSK5) 在中越合资企业里，怎么减少文化冲突？ (Trong doanh nghiệp liên doanh Việt – Trung, làm sao giảm xung đột văn hóa?)",null,null,"Zài zhōng yuè hézīqǐyè lǐ, zěnme jiǎnshǎo wénhuàchōngtū?",null,"BODY292"],["Đáp: 我觉得有三点：第一，新来的中国管理人员最好先接受一个简单的越南文化培训；第二，规定要写清楚，不要只靠口头说；第三，多组织一些两国员工一起参加的活动，比如聚餐、运动会，大家熟了，误会自然就少了。 (Ba điểm: một, quản lý TQ mới sang nên được đào tạo ngắn về văn hóa VN; hai, quy định phải viết rõ, không chỉ nói miệng; ba, tổ chức nhiều hoạt động chung cho nhân viên hai nước như liên hoan, hội thao, quen nhau rồi hiểu lầm tự nhiên ít đi.)",null,null,"Wǒ juéde yǒu sāndiǎn: dìyī, xīn lái de Zhōngguó guǎnlǐrényuán zuìhǎo xiān jiēshòu yīgè jiǎndān de Yuènán wénhuà péixùn; dì'èr, guīdìng yào xiě qīngchu, bùyào zhǐ kào kǒutóu shuō; dìsān, duō zǔzhī yīxiē liǎng guó yuángōng yīqǐ cānjiā de huódòng, bǐrú jùcān, yùndònghuì, dàjiā shú le, wùhuì zìrán jiù shǎo le.",null,"BODY293"],["情景模拟 ROLE-PLAY — Đối tác TQ (GV) hiểu nhầm lời từ chối của HS. Vòng 2 (bất ngờ): đối tác thấy \"mất mặt\" và định hủy hợp tác",null,null,"Qíngjǐng mónǐ",null,"BODY294-C"],["GV: 小阮，上次我们说的那个新项目，你们考虑得怎么样了？ (Tiểu Nguyễn, dự án mới lần trước bàn, các bạn cân nhắc thế nào rồi?)",null,null,"Xiǎo Ruǎn, shàngcì wǒmen shuō de nàge xīn xiàngmù, nǐmen kǎolǜ de zěnmeyàng le?",null,"BODY295"],["HS: 王总，我们还在考虑，可能需要一点时间。 (Vương tổng, chúng tôi vẫn đang cân nhắc, có thể cần chút thời gian.)",null,null,"Wáng zǒng, wǒmen hái zài kǎolǜ, kěnéng xūyào yīdiǎn shíjiān.",null,"BODY296"],["GV: 好，那我们先按这个计划准备材料，下周就开始生产。 (Được, vậy chúng tôi chuẩn bị vật liệu theo kế hoạch này, tuần sau bắt đầu sản xuất.)",null,null,"Hǎo, nà wǒmen xiān àn zhège jìhuà zhǔnbèi cáiliào, xiàzhōu jiù kāishǐ shēngchǎn.",null,"BODY297"],["HS: 王总，等一下，为了避免误会，我想说清楚：我们公司这次的预算不够，所以这个项目今年可能做不了。 (Vương tổng, khoan đã, để tránh hiểu lầm tôi xin nói rõ: ngân sách công ty chúng tôi lần này không đủ, nên dự án này năm nay có thể không làm được.)",null,null,"Wáng zǒng, děng yīxià, wèile bìmiǎn wùhuì, wǒ xiǎng shuō qīngchu: wǒmen gōngsī zhècì de yùsuàn bùgòu, suǒyǐ zhège xiàngmù jīnnián kěnéng zuòbùliǎo.",null,"BODY298"],["GV (biến cố): 什么？我已经跟我们老板说你们会合作了，你这样让我很没面子！ (Cái gì? Tôi đã nói với sếp là các bạn sẽ hợp tác, bạn làm vậy khiến tôi rất mất mặt!)",null,null,"Shénme? Wǒ yǐjīng gēn wǒmen lǎobǎn shuō nǐmen huì hézuò le, nǐ zhèyàng ràng wǒ hěn méimiànzi!",null,"BODY299"],["HS: 非常抱歉，是我上次说得不够清楚，让您误会了，这是我的问题。 (Rất xin lỗi, lần trước tôi nói chưa đủ rõ khiến ngài hiểu lầm, là lỗi của tôi.)",null,null,"Fēicháng bàoqiàn, shì wǒ shàngcì shuō de bùgòu qīngchu, ràng nín wùhuì le, zhè shì wǒ de wèntí.",null,"BODY300"],["HS: 我们真的很想跟贵公司合作，只是今年的预算已经用完了。能不能这样：这个项目我们放到明年一月第一个启动；同时，今年我们先下一个小订单，让您跟老板有一个交代？ (Chúng tôi thật sự muốn hợp tác với quý công ty, chỉ là ngân sách năm nay đã hết. Thế này được không: dự án này chúng tôi đưa lên khởi động đầu tiên vào tháng 1 năm sau; đồng thời năm nay đặt trước một đơn nhỏ, để ngài có lời giải thích với sếp?)",null,null,"Wǒmen zhēnde hěn xiǎng gēn guì gōngsī hézuò, zhǐshì jīnnián de yùsuàn yǐjīng yòng wán le. Néng bùnéng zhèyàng: zhège xiàngmù wǒmen fàngdào míngnián yīyuè dìyīgè qǐdòng; tóngshí, jīnnián wǒmen xiān xià yīgè xiǎo dìngdān, ràng nín gēn lǎobǎn yǒu yīgè jiāodài?",null,"BODY301"],["GV: 小订单是多少？ (Đơn nhỏ là bao nhiêu?)",null,null,"Xiǎo dìngdān shì duōshǎo?",null,"BODY302"],["HS: 大概五千件，我们这个月就可以下单。另外，我可以给您老板写一封邮件，说明我们明年的合作计划。 (Khoảng 5.000 cái, tháng này có thể đặt. Ngoài ra tôi có thể viết email cho sếp ngài, trình bày kế hoạch hợp tác năm sau của chúng tôi.)",null,null,"Dàgài wǔqiān jiàn, wǒmen zhège yuè jiù kěyǐ xiàdān. Lìngwài, wǒ kěyǐ gěi nín lǎobǎn xiě yīfēng yóujiàn, shuōmíng wǒmen míngnián de hézuò jìhuà.",null,"BODY303"],["GV: 好吧，这样我也好跟老板说了。以后有什么情况，你直接告诉我，不用担心我不高兴。 (Thôi được, như vậy tôi cũng dễ nói với sếp. Sau này có gì bạn cứ nói thẳng, đừng lo tôi không vui.)",null,null,"Hǎo ba, zhèyàng wǒ yěhǎo gēn lǎobǎn shuō le. Yǐhòu yǒu shénme qíngkuàng, nǐ zhíjiē gàosu wǒ, bùyòng dānxīn wǒ bù gāoxìng.",null,"BODY304"],["HS: 明白了，谢谢王总的理解！ (Hiểu rồi, cảm ơn Vương tổng đã thông cảm!)",null,null,"Míngbai le, xièxie Wáng zǒng de lǐjiě!",null,"BODY305"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY306-C"],["✗ 中国人很不礼貌，说话很大声。 (định kiến) → ✓ 中国人说话声音比较大，这是习惯，不是不礼貌。",null,null,"Zhōngguórén hěn bù lǐmào, shuōhuà hěn dàshēng. | Zhōngguórén shuōhuà shēngyīn bǐjiào dà, zhè shì xíguàn, bùshì bù lǐmào.",null,"BODY307"],["✗ 我送给你一个钟。 → ✓ 我送你一点越南咖啡，一点小心意。",null,null,"Wǒ sònggěi nǐ yīgè zhōng. | Wǒ sòng nǐ yīdiǎn Yuènán kāfēi, yīdiǎn xiǎo xīnyì.",null,"BODY308"],["✗ 在越南人常常…… → ✓ 在越南，人们常常……/ 越南人常常……",null,null,"Zài Yuènánrén chángcháng…… | Zài Yuènán, rénmen chángcháng…… / | Yuènánrén chángcháng……",null,"BODY309"],["✗ 文化不同很大。 → ✓ 文化差异很大。/ 两国的文化有很大的不同。",null,null,"Wénhuà bùtóng hěndà. | Wénhuàchāyì hěndà. / | Liǎng guó de wénhuà yǒu hěndà de bùtóng.",null,"BODY310"],["✗ 我们不同意。 (với đối tác TQ, quá thẳng) → ✓ 这个方案我们可能还需要再考虑一下，主要是因为……",null,null,"Wǒmen bù tóngyì. | Zhège fāng'àn wǒmen kěnéng hái xūyào zài kǎolǜyīxià, zhǔyào shìyīnwèi……",null,"BODY311"],["✗ 好的好的好的。 (khi chưa hiểu) → ✓ 不好意思，这一点我还不太明白，您能再解释一下吗？",null,null,"Hǎo de hǎo de hǎo de. | Bùhǎoyìsi, zhè yīdiǎn wǒ hái bù tài míngbai, nín néng zài jiěshìyīxià ma?",null,"BODY312"],["Phát âm: 委婉 wěiwǎn; 入乡随俗 rùxiāng suísú; 面子 miànzi; 禁忌 jìnjì; 敬酒 jìngjiǔ.",null,null,"Wěiwǎn | Rùxiāngsuísú | Miànzi | Jìnjì | Jìngjiǔ",null,"BODY313"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY314-C"],["Ghi âm 3 phút: \"Lời khuyên cho chuyên gia Trung Quốc mới sang làm việc ở Việt Nam\" — ít nhất 5 lời khuyên (ăn uống, giao thông, công sở, quà tặng, cách góp ý), mỗi lời khuyên dùng 在越南通常……而在中国…….",null,null,"Zài Yuènán tōngcháng…… ér zài Zhōngguó…… .",null,"BODY315"],["HSK5: thêm 1 tình huống hiểu nhầm văn hóa có thật trong công ty mình và cách đã/sẽ xử lý.",null,null,null,null,"BODY316"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY317"],["Buổi 23 — 综合情景模拟 Mô phỏng tổng hợp",null,null,"Zōnghé qíngjǐng mónǐ",null,"BODY318-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY319-C"],["HSK4: Hoàn thành chuỗi tình huống liên tục: nhận việc → báo cáo tiến độ → xử lý sự cố. HSK5: Hoàn thành chuỗi: nhận yêu cầu khách → họp nội bộ → đàm phán → xử lý khiếu nại.",null,null,null,null,"BODY320"],["Cách học buổi này: toàn bộ buổi là 1 \"ngày làm việc\" mô phỏng, xoay quanh 1 khách hàng (công ty Hoa Thịnh – TQ) và 1 đơn hàng 20.000 chiếc quạt điện; GV đóng nhiều vai và liên tục thêm biến cố.",null,null,null,null,"BODY321"],["Ôn tập kỹ năng: 确认 xác nhận (Buổi 6) · 汇报 báo cáo (Buổi 12) · 协商 thương lượng (Buổi 10, 17) · 投诉 khiếu nại (Buổi 11) · 方案 phương án (Buổi 18) · 进度 tiến độ (Buổi 6).",null,null,"Quèrèn | Huìbào | Xiéshāng | Tóusù | Fāng'àn | Jìndù",null,"BODY322"],["热身 WARM-UP — Hỏi nhanh ôn tập các buổi trước",null,null,"Rèshēn",null,"BODY323-C"],["1. Hỏi: 用三十秒介绍一下你自己和你的工作。 (Giới thiệu bản thân và công việc trong 30 giây.)",null,null,"Yòng sānshímiǎo jièshào yīxià nǐ zìjǐ hé nǐ de gōngzuò.",null,"BODY324"],["Đáp: 大家好，我叫阮文海，在一家电器公司做销售主管，主要负责中国客户。我在这个行业做了六年，最擅长的是跟客户谈判。 (Chào mọi người, tôi là Nguyễn Văn Hải, trưởng nhóm sales ở công ty điện máy, chủ yếu phụ trách khách TQ. Tôi làm ngành này 6 năm, giỏi nhất là đàm phán với khách.)",null,null,"Dàjiā hǎo, wǒ jiào Ruǎn Wénhǎi, zài yījiā diànqì gōngsī zuò xiāoshòuzhǔguǎn, zhǔyào fùzé Zhōngguó kèhù. Wǒ zài zhège hángyè zuò le liùnián, zuì shàncháng de shì gēn kèhù tánpàn.",null,"BODY325"],["2. Hỏi: 经理突然给你一个很急的任务，你第一句话会问什么？ (Sếp đột nhiên giao việc rất gấp, câu đầu tiên bạn hỏi gì?)",null,null,"Jīnglǐ tūrán gěi nǐ yīgè hěn jí de rènwù, nǐ dìyījù huà huì wèn shénme?",null,"BODY326"],["Đáp: 我会问：\"经理，这个任务最晚什么时候要？具体需要包括哪些内容？\" (Tôi sẽ hỏi: \"Giám đốc, việc này muộn nhất khi nào cần? Cụ thể cần gồm những nội dung gì?\")",null,null,"Wǒhuì wèn: \"jīnglǐ, zhège rènwù zuì wǎn shénme shíhou yào? Jùtǐ xūyào bāokuò nǎxiē nèiróng?\"",null,"BODY327"],["3. Hỏi: 客户打电话来很生气，你第一句话说什么？ (Khách gọi đến rất giận, câu đầu tiên bạn nói gì?)",null,null,"Kèhù dǎdiànhuà lái hěn shēngqì, nǐ dìyījù huà shuō shénme?",null,"BODY328"],["Đáp: \"非常抱歉，我完全理解您的心情，您先说说具体是什么情况，我马上帮您处理。\" (\"Rất xin lỗi, tôi hoàn toàn hiểu tâm trạng của anh/chị, anh/chị nói cụ thể tình hình, tôi xử lý ngay.\")",null,null,"Fēicháng bàoqiàn, wǒ wánquán lǐjiě nín de xīnqíng, nín xiān shuōshuo jùtǐ shì shénme qíngkuàng, wǒ mǎshàng bāng nín chǔlǐ.",null,"BODY329"],["语言输入 INPUT — Ôn tập cụm từ cốt lõi của cả khóa",null,null,"Yǔyán shūrù",null,"BODY330-C"],["1. 确认 (xác nhận): 麻烦您确认一下数量和交货地址。 (Phiền anh xác nhận số lượng và địa chỉ giao hàng.)",null,null,"Quèrèn | Máfan nín quèrèn yīxià shùliàng hé jiāohuò dìzhǐ.",null,"BODY331"],["2. 汇报 (báo cáo lên cấp trên): 我先向您汇报一下目前的进度。 (Tôi xin báo cáo tiến độ hiện tại.)",null,null,"Huìbào | Wǒ xiān xiàng nín huìbào yīxià mùqián de jìndù.",null,"BODY332"],["3. 协商 (thương lượng): 交货期的问题我们可以再协商。 (Vấn đề thời gian giao có thể thương lượng thêm.)",null,null,"Xiéshāng | Jiāohuòqī de wèntí wǒmen kěyǐ zài xiéshāng.",null,"BODY333"],["4. 投诉 (khiếu nại): 客户投诉产品的包装有破损。 (Khách khiếu nại bao bì sản phẩm bị hỏng.)",null,null,"Tóusù | Kèhù tóusù chǎnpǐn de bāozhuāng yǒu pòsǔn.",null,"BODY334"],["5. 方案 (phương án): 针对这个问题，我准备了两个方案。 (Về vấn đề này tôi chuẩn bị 2 phương án.)",null,null,"Fāng'àn | Zhēnduì zhège wèntí, wǒ zhǔnbèi le liǎnggè fāng'àn.",null,"BODY335"],["6. 进度 (tiến độ): 目前进度是百分之六十，预计周五完成。 (Tiến độ hiện 60%, dự kiến thứ 6 xong.)",null,null,"Jìndù | Mùqián jìndù shì bǎifēnzhīliùshí, yùjì zhōuwǔ wánchéng.",null,"BODY336"],["7. 跟进 (theo dõi): 这个订单由我负责跟进到底。 (Đơn này do tôi theo dõi đến cùng.)",null,null,"Gēnjìn | Zhège dìngdān yóu wǒ fùzé gēnjìn dàodǐ.",null,"BODY337"],["8. 协调 (điều phối): 我来协调生产部和仓库。 (Tôi sẽ điều phối sản xuất và kho.)",null,null,"Xiétiáo | Wǒ lái xiétiáo shēngchǎn bù hé cāngkù.",null,"BODY338"],["9. 让步 (nhượng bộ): 如果贵方能预付，我们可以在价格上让步。 (Nếu quý bên trả trước, chúng tôi nhượng bộ về giá.)",null,null,"Ràngbù | Rúguǒ guìfāng néng yùfù, wǒmen kěyǐ zài jiàgé shàng ràngbù.",null,"BODY339"],["10. 补救措施 (biện pháp khắc phục): 我们已经采取了补救措施。 (Chúng tôi đã áp dụng biện pháp khắc phục.)",null,null,"Bǔjiùcuòshī | Wǒmen yǐjīng cǎiqǔ le bǔjiùcuòshī.",null,"BODY340"],["11. 风险 (rủi ro): 这个计划最大的风险是原材料延误。 (Rủi ro lớn nhất kế hoạch này là nguyên liệu về trễ.)",null,null,"Fēngxiǎn | Zhège jìhuà zuìdà de fēngxiǎn shì yuáncáiliào yánwù.",null,"BODY341"],["12. 达成一致 (thống nhất): 双方在价格上达成了一致。 (Hai bên đã thống nhất về giá.)",null,null,"Dáchéng yīzhì | Shuāngfāng zài jiàgé shàng dáchéng le yīzhì.",null,"BODY342"],["句型 MẪU CÂU — Khung câu dùng xuyên suốt buổi mô phỏng",null,null,"Jùxíng",null,"BODY343-C"],["1. 先确认一下……，再…… (Xác nhận … trước, rồi …)",null,null,"Xiān quèrèn yīxià……, zài……",null,"BODY344"],["Ví dụ: 先确认一下客户的具体要求，再做报价。 (Xác nhận yêu cầu cụ thể của khách trước, rồi làm báo giá.)",null,null,"Xiān quèrèn yīxià kèhù de jùtǐ yāoqiú, zài zuò bàojià.",null,"BODY345"],["Ví dụ: 先确认一下仓库有没有库存，再答复客户。 (Xác nhận kho còn tồn không trước, rồi trả lời khách.)",null,null,"Xiān quèrèn yīxià cāngkù yǒuméiyǒu kùcún, zài dáfù kèhù.",null,"BODY346"],["2. 下一步，我们…… (Bước tiếp theo, chúng ta …)",null,null,"Xià yībù, wǒmen……",null,"BODY347"],["Ví dụ: 下一步，我们需要跟生产部确认产能。 (Bước tiếp theo, cần xác nhận công suất với sản xuất.)",null,null,"Xià yībù, wǒmen xūyào gēn shēngchǎn bù quèrèn chǎnnéng.",null,"BODY348"],["Ví dụ: 下一步，我们安排工程师去客户工厂看看。 (Bước tiếp theo, cử kỹ sư đến nhà máy khách xem.)",null,null,"Xià yībù, wǒmen ānpái gōngchéngshī qù kèhù gōngchǎng kànkan.",null,"BODY349"],["3. 建议…… (Đề nghị …)",null,null,"Jiànyì……",null,"BODY350"],["Ví dụ: 建议我们先寄样品，等客户确认以后再大批量生产。 (Đề nghị gửi mẫu trước, khách xác nhận rồi mới sản xuất hàng loạt.)",null,null,"Jiànyì wǒmen xiānjì yàngpǐn, děng kèhù quèrèn yǐhòu zài dàpīliàngshēngchǎn.",null,"BODY351"],["Ví dụ: 建议这次的运费由我们承担，保住这个客户。 (Đề nghị phí vận chuyển lần này mình chịu, giữ khách này.)",null,null,"Jiànyì zhècì de yùnfèi yóu wǒmen chéngdān, bǎozhù zhège kèhù.",null,"BODY352"],["4. 目前……，但是有一个风险：…… (Hiện tại …, nhưng có một rủi ro: …)",null,null,"Mùqián……, dànshì yǒu yīgè fēngxiǎn:……",null,"BODY353"],["Ví dụ: 目前生产很顺利，但是有一个风险：电机的供应商说可能会晚三天。 (Hiện sản xuất suôn sẻ, nhưng có rủi ro: NCC động cơ nói có thể trễ 3 ngày.)",null,null,"Mùqián shēngchǎn hěn shùnlì, dànshì yǒu yīgè fēngxiǎn: diànjī de gōngyìngshāng shuō kěnéng huì wǎn sāntiān.",null,"BODY354"],["5. 如果贵方能……，我们可以…… (Nếu quý bên …, chúng tôi có thể …)",null,null,"Rúguǒ guìfāng néng……, wǒmen kěyǐ……",null,"BODY355"],["Ví dụ: 如果贵方能接受分两批交货，我们可以保证第一批提前一周到。 (Nếu quý bên chấp nhận giao 2 đợt, chúng tôi đảm bảo đợt đầu đến sớm một tuần.)",null,null,"Rúguǒ guìfāng néng jiēshòu fēn liǎngpī jiāohuò, wǒmen kěyǐ bǎozhèng dìyīpī tíqián yīzhōu dào.",null,"BODY356"],["6. 经过核实，问题出在……，我们的处理方案是…… (Qua xác minh, vấn đề nằm ở …, phương án xử lý là …)",null,null,"Jīngguò héshí, wèntí chū zài……, wǒmen de chǔlǐ fāng'àn shì……",null,"BODY357"],["Ví dụ: 经过核实，问题出在运输过程中，我们的处理方案是免费补发三百台。 (Qua xác minh, vấn đề trong quá trình vận chuyển, phương án là gửi bù miễn phí 300 chiếc.)",null,null,"Jīngguò héshí, wèntí chū zài yùnshū guòchéng zhōng, wǒmen de chǔlǐ fāng'àn shì miǎnfèi bǔfā sānbǎi tái.",null,"BODY358"],["7. 我总结一下：第一……；第二……；第三…… (Tôi tổng kết: một …; hai …; ba …)",null,null,"Wǒ zǒngjié yīxià: dìyī……; dì'èr……; dìsān……",null,"BODY359"],["Ví dụ: 我总结一下：第一，订单两万台；第二，单价十二点五美元；第三，四十五天交货。 (Tổng kết: một, đơn 20.000 chiếc; hai, đơn giá 12,5 USD; ba, giao trong 45 ngày.)",null,null,"Wǒ zǒngjié yīxià: dìyī, dìngdān liǎng wàntái; dì'èr, dānjià shí'èrdiǎn wǔměiyuán; dìsān, sìshíwǔtiān jiāohuò.",null,"BODY360"],["8. (HSK5) 综合考虑……，我认为最好的办法是…… (Cân nhắc tổng thể …, tôi cho rằng cách tốt nhất là …)",null,null,"Zōnghé kǎolǜ……, wǒ rènwéi zuìhǎo de bànfǎ shì……",null,"BODY361"],["Ví dụ: 综合考虑成本、交期和客户关系，我认为最好的办法是空运一部分货。 (Cân nhắc tổng thể chi phí, thời gian giao và quan hệ khách, cách tốt nhất là gửi hàng không một phần.)",null,null,"Zōnghé kǎolǜ chéngběn, jiāo qī hé kèhùguānxi, wǒ rènwéi zuìhǎo de bànfǎ shì kōngyùn yībùfen huò.",null,"BODY362"],["9. (HSK5) 不管是谁的责任，我们现在最重要的是…… (Dù là trách nhiệm của ai, quan trọng nhất bây giờ là …)",null,null,"Bùguǎnshìshéi de zérèn, wǒmen xiànzài zuì zhòngyào de shì……",null,"BODY363"],["Ví dụ: 不管是谁的责任，我们现在最重要的是保证客户的生产线不停。 (Dù lỗi ai, quan trọng nhất là đảm bảo chuyền của khách không dừng.)",null,null,"Bùguǎnshìshéi de zérèn, wǒmen xiànzài zuì zhòngyào de shì bǎozhèng kèhù de shēngchǎnxiàn bùtíng.",null,"BODY364"],["情景对话 1 — Chặng 1: Nhận yêu cầu từ khách hàng qua điện thoại",null,null,"Qíngjǐng duìhuà",null,"BODY365-C"],["客户(刘总): 小阮，你好！我们华盛公司明年想在越南市场推一款新的电风扇，想请你们帮忙生产。 (Tiểu Nguyễn, chào bạn! Công ty Hoa Thịnh chúng tôi năm sau muốn tung một mẫu quạt điện mới ở thị trường VN, muốn nhờ các bạn sản xuất.)",null,null,"Kèhù | Liú zǒng | Xiǎo Ruǎn, nǐhǎo! Wǒmen Huáshèng gōngsī míngnián xiǎng zài Yuènán shìchǎng tuī yīkuǎn xīn de diànfēngshàn, xiǎng qǐng nǐmen bāngmáng shēngchǎn.",null,"BODY366"],["小阮: 刘总您好！谢谢您想到我们。请问大概需要多少数量？ (Lưu tổng chào ngài! Cảm ơn ngài đã nghĩ đến chúng tôi. Xin hỏi khoảng bao nhiêu chiếc?)",null,null,"Xiǎo Ruǎn: Liú zǒng nínhǎo! Xièxienín xiǎngdào wǒmen. Qǐngwèn dàgài xūyào duōshǎo shùliàng?",null,"BODY367"],["客户: 第一批两万台，如果卖得好，明年一共十万台。 (Đợt đầu 20.000 chiếc, nếu bán tốt, cả năm sau 100.000 chiếc.)",null,null,"Kèhù: dìyīpī liǎng wàntái, rúguǒ mài de hǎo, míngnián yīgòng shíwàntái.",null,"BODY368"],["小阮: 好的。我先确认一下几个具体的要求：产品是用你们的设计，还是我们的现有型号？ (Vâng. Tôi xác nhận trước vài yêu cầu cụ thể: sản phẩm dùng thiết kế của quý bên hay mẫu hiện có của chúng tôi?)",null,null,"Xiǎo Ruǎn: hǎo de. Wǒ xiān quèrèn yīxià jǐgè jùtǐ de yāoqiú: chǎnpǐn shì yòng nǐmen de shèjì, háishì wǒmen de xiànyǒu xínghào?",null,"BODY369"],["客户: 用你们的FS-16型号，但是颜色和标志要按我们的要求改。 (Dùng mẫu FS-16 của các bạn, nhưng màu và logo phải đổi theo yêu cầu của chúng tôi.)",null,null,"Kèhù: yòng nǐmen de FS - 16 xínghào, dànshì yánsè hé biāozhì yào àn wǒmen de yāoqiú gǎi.",null,"BODY370"],["小阮: 明白。交货时间呢？ (Rõ. Thời gian giao thì sao?)",null,null,"Xiǎo Ruǎn: míngbai. Jiāohuò shíjiān ne?",null,"BODY371"],["客户: 越南的夏天四月就开始热了，所以最晚三月十五号要到我们的仓库。 (Mùa hè VN tháng 4 đã nóng, nên muộn nhất 15/3 phải về kho chúng tôi.)",null,null,"Kèhù: Yuènán de xiàtiān sìyuè jiù kāishǐ rè le, suǒyǐ zuì wǎn sānyuè shíwǔhào yào dào wǒmen de cāngkù.",null,"BODY372"],["小阮: 好的。付款方式和价格您有什么想法？ (Vâng. Về thanh toán và giá ngài có ý kiến gì?)",null,null,"Xiǎo Ruǎn: hǎo de. Fùkuǎn fāngshì hé jiàgé nín yǒu shénme xiǎngfǎ?",null,"BODY373"],["客户: 价格你们先报，付款我们希望是月结六十天。 (Giá các bạn báo trước, thanh toán chúng tôi mong công nợ 60 ngày.)",null,null,"Kèhù: jiàgé nǐmen xiān bào, fùkuǎn wǒmen xīwàng shì yuè jié liùshítiān.",null,"BODY374"],["小阮: 好的，我总结一下：FS-16型号，两万台，改颜色和标志，三月十五号前交到贵方仓库，付款方式希望月结六十天。对吗？ (Vâng, tôi tổng kết: mẫu FS-16, 20.000 chiếc, đổi màu và logo, giao kho quý bên trước 15/3, thanh toán mong công nợ 60 ngày. Đúng không ạ?)",null,null,"Xiǎo Ruǎn: hǎo de, wǒ zǒngjié yīxià: FS - 16 xínghào, liǎng wàntái, gǎi yánsè hé biāozhì, sānyuè shíwǔhào qián jiāodào guìfāng cāngkù, fùkuǎn fāngshì xīwàng yuè jié liùshítiān. Duì ma?",null,"BODY375"],["客户: 对，没错。 (Đúng, chính xác.)",null,null,"Kèhù: duì, méicuò.",null,"BODY376"],["小阮: 我今天跟生产部和采购部确认一下，明天下班之前把正式报价发给您。 (Hôm nay tôi xác nhận với sản xuất và mua hàng, trước giờ tan làm mai gửi báo giá chính thức.)",null,null,"Xiǎo Ruǎn: wǒ jīntiān gēn shēngchǎn bù hé cǎigòubù quèrèn yīxià, míngtiān xiàbān zhīqián bǎ zhèngshì bàojià fāgěinín.",null,"BODY377"],["客户: 好，等你的消息。 (Được, chờ tin bạn.)",null,null,"Kèhù: hǎo, děng nǐ de xiāoxi.",null,"BODY378"],["情景对话 2 — Chặng 2: Họp nội bộ, báo cáo và điều phối",null,null,"Qíngjǐng duìhuà",null,"BODY379-C"],["小阮: 经理，我先汇报一下：华盛公司刘总想订两万台FS-16，改颜色和标志，三月十五号前交货，付款希望月结六十天。 (Giám đốc, tôi xin báo cáo: Lưu tổng công ty Hoa Thịnh muốn đặt 20.000 chiếc FS-16, đổi màu và logo, giao trước 15/3, thanh toán mong công nợ 60 ngày.)",null,null,"Xiǎo Ruǎn: jīnglǐ, wǒ xiān huìbào yīxià: Huáshèng gōngsī Liú zǒng xiǎng dìng liǎng wàntái FS - 16, gǎi yánsè hé biāozhì, sānyuè shíwǔhào qián jiāohuò, fùkuǎn xīwàng yuè jié liùshítiān.",null,"BODY380"],["经理: 量不小啊。生产部能做吗？ (Số lượng không nhỏ. Sản xuất làm được không?)",null,null,"Jīnglǐ: liàng bùxiǎo a. Shēngchǎn bù néng zuò ma?",null,"BODY381"],["生产: 我们一个月能生产三万台，不过一二月有春节，工人放假十天，产能只有平时的六成。 (Một tháng làm được 30.000 chiếc, nhưng tháng 1–2 có Tết, công nhân nghỉ 10 ngày, công suất chỉ 60% bình thường.)",null,null,"Shēngchǎn: wǒmen yīgèyuè néng shēngchǎn sān wàntái, bùguò yī èryuè yǒu Chūn Jié, gōngrén fàngjià shítiān, chǎnnéng zhǐyǒu píngshí de liùchéng.",null,"BODY382"],["采购: 我想补充一点：改颜色的话，塑料外壳要重新开模，模具需要二十天。 (Tôi bổ sung: đổi màu thì vỏ nhựa phải làm khuôn mới, khuôn cần 20 ngày.)",null,null,"Cǎigòu: wǒ xiǎng bǔchōng yīdiǎn: gǎi yánsè dehuà, sùliào wàiké yào chóngxīn kāimú, mújù xūyào èrshítiān.",null,"BODY383"],["经理: 那时间上来得及吗？ (Vậy thời gian có kịp không?)",null,null,"Jīnglǐ: nà shíjiān shàng láidejí ma?",null,"BODY384"],["小阮: 我算了一下：如果这个月底签合同，模具二十天，十二月中旬可以开始生产，春节前能做一万五千台，春节后再做五千台，二月底就能全部完成。 (Tôi tính rồi: nếu cuối tháng này ký hợp đồng, khuôn 20 ngày, giữa tháng 12 bắt đầu sản xuất, trước Tết làm được 15.000 chiếc, sau Tết làm thêm 5.000, cuối tháng 2 xong hết.)",null,null,"Xiǎo Ruǎn: wǒ suànle yīxià: rúguǒ zhège yuèdǐ qiānhétong, mújù èrshítiān, shí'èryuè zhōngxún kěyǐ kāishǐ shēngchǎn, Chūn Jié qián néng zuò yīwànwǔqiān tái, Chūn Jié hòu zài zuò wǔqiān tái, èr yuèdǐ jiù néng quánbù wánchéng.",null,"BODY385"],["经理: 时间可以。风险在哪里？ (Thời gian được. Rủi ro ở đâu?)",null,null,"Jīnglǐ: shíjiān kěyǐ. Fēngxiǎn zài nǎlǐ?",null,"BODY386"],["小阮: 目前最大的风险是电机。电机供应商春节前订单很多，可能会延误。 (Rủi ro lớn nhất hiện nay là động cơ. NCC động cơ trước Tết nhiều đơn, có thể trễ.)",null,null,"Xiǎo Ruǎn: mùqián zuìdà de fēngxiǎn shì diànjī. Diànjī gōngyìngshāng Chūn Jié qián dìngdān hěnduō, kěnéng huì yánwù.",null,"BODY387"],["采购: 我建议现在就提前下电机的订单，先备一万台的库存。 (Tôi đề nghị đặt đơn động cơ ngay bây giờ, dự trữ trước 10.000 chiếc.)",null,null,"Cǎigòu: wǒ jiànyì xiànzài jiù tíqián xià diànjī de dìngdān, xiān bèi yī wàntái de kùcún.",null,"BODY388"],["财务: 付款月结六十天，再加上提前备料，我们的资金压力比较大。我建议至少要求百分之三十的预付款。 (Thanh toán công nợ 60 ngày, cộng chuẩn bị vật tư sớm, áp lực vốn khá lớn. Tôi đề nghị ít nhất yêu cầu trả trước 30%.)",null,null,"Cáiwù: fùkuǎn yuè jié liùshítiān, zài jiāshàng tíqián bèiliào, wǒmen de zījīn yālì bǐjiào dà. Wǒ jiànyì zhìshǎo yāoqiú bǎifēnzhīsānshí de yùfùkuǎn.",null,"BODY389"],["经理: 好。我总结一下：第一，小阮按两万台报价，单价目标十三美元；第二，付款要求百分之三十预付，剩下的月结四十五天；第三，采购这周先下电机订单。大家有没有问题？ (Được. Tôi tổng kết: một, Tiểu Nguyễn báo giá 20.000 chiếc, đơn giá mục tiêu 13 USD; hai, thanh toán yêu cầu trả trước 30%, còn lại công nợ 45 ngày; ba, mua hàng tuần này đặt đơn động cơ trước. Mọi người có câu hỏi gì không?)",null,null,"Jīnglǐ: hǎo. Wǒ zǒngjié yīxià: dìyī, Xiǎo Ruǎn àn liǎng wàntái bàojià, dānjià mùbiāo shísān měiyuán; dì'èr, fùkuǎn yāoqiú bǎifēnzhīsānshí yùfù, shèngxià de yuè jié sìshíwǔtiān; dìsān, cǎigòu zhè zhōu xiān xià diànjī dìngdān. Dàjiā yǒuméiyǒu wèntí?",null,"BODY390"],["全体: 没有。 (Không ạ.)",null,null,"Quántǐ: méiyǒu.",null,"BODY391"],["情景对话 3 — Chặng 3: Đàm phán giá và điều kiện với khách",null,null,"Qíngjǐng duìhuà",null,"BODY392-C"],["客户: 小阮，报价我们看了，十三美元有点高。我们的预算是十二美元。 (Tiểu Nguyễn, báo giá chúng tôi xem rồi, 13 USD hơi cao. Ngân sách chúng tôi là 12 USD.)",null,null,"Kèhù: Xiǎo Ruǎn, bàojià wǒmen kàn le, shísān měiyuán yǒudiǎn gāo. Wǒmen de yùsuàn shì shí'èr měiyuán.",null,"BODY393"],["小阮: 刘总，十三美元已经包括了重新开模的费用，模具大概要两万美元。 (Lưu tổng, 13 USD đã gồm phí làm khuôn mới, khuôn khoảng 20.000 USD.)",null,null,"Xiǎo Ruǎn: Liú zǒng, shísān měiyuán yǐjīng bāokuò le chóngxīn kāimú de fèiyòng, mújù dàgài yào liǎng wànměiyuán.",null,"BODY394"],["客户: 模具费我们可以单独付，这样单价能降到多少？ (Phí khuôn chúng tôi có thể trả riêng, vậy đơn giá giảm xuống bao nhiêu?)",null,null,"Kèhù: mújù fèi wǒmen kěyǐ dāndú fù, zhèyàng dānjià néng jiàngdào duōshǎo?",null,"BODY395"],["小阮: 如果模具费贵方单独承担，单价可以降到十二点六美元。 (Nếu quý bên chịu riêng phí khuôn, đơn giá giảm xuống 12,6 USD.)",null,null,"Xiǎo Ruǎn: rúguǒ mújù fèi guìfāng dāndú chéngdān, dānjià kěyǐ jiàngdào shí'èrdiǎn liù měiyuán.",null,"BODY396"],["客户: 还是比预算高。另外，付款方式我们希望月结六十天，不想预付。 (Vẫn cao hơn ngân sách. Ngoài ra thanh toán chúng tôi mong công nợ 60 ngày, không muốn trả trước.)",null,null,"Kèhù: háishì bǐ yùsuàn gāo. Lìngwài, fùkuǎn fāngshì wǒmen xīwàng yuè jié liùshítiān, bùxiǎng yùfù.",null,"BODY397"],["小阮: 我理解。不过这次订单要提前备一万台的电机，我们的资金压力很大。如果贵方能预付百分之三十，我们可以把单价降到十二点五美元。 (Tôi hiểu. Nhưng đơn này phải dự trữ trước 10.000 động cơ, áp lực vốn chúng tôi rất lớn. Nếu quý bên trả trước 30%, chúng tôi giảm đơn giá xuống 12,5 USD.)",null,null,"Xiǎo Ruǎn: wǒ lǐjiě. Bùguò zhècì dìngdān yào tíqián bèi yī wàntái de diànjī, wǒmen de zījīn yālì hěndà. Rúguǒ guìfāng néng yùfù bǎifēnzhīsānshí, wǒmen kěyǐ bǎ dānjià jiàngdào shí'èrdiǎn wǔměiyuán.",null,"BODY398"],["客户: 百分之三十太多了，百分之二十吧。 (30% nhiều quá, 20% đi.)",null,null,"Kèhù: bǎifēnzhīsānshí tài duō le, bǎifēnzhī'èrshí ba.",null,"BODY399"],["小阮: 百分之二十的话，单价是十二点六美元。我们可以在价格上让步，不过作为交换，希望贵方签全年十万台的框架协议。 (20% thì đơn giá 12,6 USD. Chúng tôi có thể nhượng bộ về giá, nhưng đổi lại mong quý bên ký thỏa thuận khung cả năm 100.000 chiếc.)",null,null,"Xiǎo Ruǎn: bǎifēnzhī'èrshí dehuà, dānjià shì shí'èrdiǎn liù měiyuán. Wǒmen kěyǐ zài jiàgé shàng ràngbù, bùguò zuòwéi jiāohuàn, xīwàng guìfāng qiān quánnián shíwàntái de kuāngjià xiéyì.",null,"BODY400"],["客户: 十万台要看第一批卖得怎么样。 (100.000 chiếc phải xem đợt đầu bán thế nào.)",null,null,"Kèhù: shíwàntái yào kàn dìyīpī mài de zěnmeyàng.",null,"BODY401"],["小阮: 那这样：先签第一批两万台，单价十二点五美元，预付百分之三十；如果明年全年订单超过八万台，我们按十二点二美元给贵方返还差价。 (Vậy thế này: ký đợt đầu 20.000 chiếc, đơn giá 12,5 USD, trả trước 30%; nếu đơn cả năm sau vượt 80.000 chiếc, chúng tôi hoàn chênh lệch theo giá 12,2 USD.)",null,null,"Xiǎo Ruǎn: nà zhèyàng: xiānqiān dìyīpī liǎng wàntái, dānjià shí'èrdiǎn wǔměiyuán, yùfù bǎifēnzhīsānshí; rúguǒ míngnián quánnián dìngdān chāoguò bā wàntái, wǒmen àn shí'èrdiǎn èr měiyuán gěi guìfāng fǎnhuán chājià.",null,"BODY402"],["客户: 嗯……这个方案比较有诚意。剩下的百分之七十呢？ (Ừm… phương án này khá thành ý. 70% còn lại thì sao?)",null,null,"Kèhù: ń…… zhège fāng'àn bǐjiào yǒu chéngyì. Shèngxià de bǎifēnzhīqīshí ne?",null,"BODY403"],["小阮: 月结四十五天。 (Công nợ 45 ngày.)",null,null,"Xiǎo Ruǎn: yuè jié sìshíwǔtiān.",null,"BODY404"],["客户: 好，成交！ (Được, chốt!)",null,null,"Kèhù: hǎo, chéngjiāo!",null,"BODY405"],["小阮: 谢谢刘总！我们确认一下今天谈好的条件：第一批两万台，单价十二点五美元，模具费贵方单独承担，预付百分之三十，余款月结四十五天，三月十五号前交到贵方仓库；全年超过八万台按十二点二美元返还差价。我今天把合同草稿发给您。 (Cảm ơn Lưu tổng! Xác nhận điều kiện hôm nay: đợt đầu 20.000 chiếc, đơn giá 12,5 USD, phí khuôn quý bên chịu riêng, trả trước 30%, còn lại công nợ 45 ngày, giao kho quý bên trước 15/3; cả năm vượt 80.000 chiếc hoàn chênh lệch theo 12,2 USD. Hôm nay tôi gửi dự thảo hợp đồng cho ngài.)",null,null,"Xiǎo Ruǎn: xièxie Liú zǒng! Wǒmen quèrèn yīxià jīntiān tán hǎo de tiáojiàn: dìyīpī liǎng wàntái, dānjià shí'èrdiǎn wǔměiyuán, mújù fèi guìfāng dāndú chéngdān, yùfù bǎifēnzhīsānshí, yúkuǎn yuè jié sìshíwǔtiān, sānyuè shíwǔhào qián jiāodào guìfāng cāngkù; quánnián chāoguò bā wàntái àn shí'èrdiǎn èr měiyuán fǎnhuán chājià. Wǒ jīntiān bǎ hétong cǎogǎo fāgěinín.",null,"BODY406"],["情景对话 4 — Chặng 4: Báo cáo tiến độ và sự cố giữa chừng (biến cố: NCC động cơ giao trễ)",null,null,"Qíngjǐng duìhuà",null,"BODY407-C"],["经理: 小阮，华盛的订单进度怎么样了？ (Tiểu Nguyễn, đơn Hoa Thịnh tiến độ thế nào rồi?)",null,null,"Jīnglǐ: Xiǎo Ruǎn, Huáshèng de dìngdān jìndù zěnmeyàng le?",null,"BODY408"],["小阮: 目前进度是百分之四十，已经生产了八千台。但是有一个风险：电机供应商昨天通知我们，剩下的电机要晚十天才能到。 (Hiện tiến độ 40%, đã sản xuất 8.000 chiếc. Nhưng có rủi ro: hôm qua NCC động cơ báo số động cơ còn lại phải trễ 10 ngày mới đến.)",null,null,"Xiǎo Ruǎn: mùqián jìndù shì bǎifēnzhīsìshí, yǐjīng shēngchǎn le bāqiān tái. Dànshì yǒu yīgè fēngxiǎn: diànjī gōngyìngshāng zuótiān tōngzhī wǒmen, shèngxià de diànjī yào wǎn shítiān cáinéng dào.",null,"BODY409"],["经理: 晚十天会影响交期吗？ (Trễ 10 ngày có ảnh hưởng thời gian giao không?)",null,null,"Jīnglǐ: wǎn shítiān huì yǐngxiǎng jiāo qī ma?",null,"BODY410"],["小阮: 会。按现在的计划，我们最晚要二月二十号开始包装，如果电机晚十天，就来不及了。 (Có ạ. Theo kế hoạch hiện tại, muộn nhất 20/2 phải bắt đầu đóng gói, động cơ trễ 10 ngày thì không kịp.)",null,null,"Xiǎo Ruǎn: huì. Àn xiànzài de jìhuà, wǒmen zuì wǎn yào èryuè èrshí hào kāishǐ bāozhuāng, rúguǒ diànjī wǎn shítiān, jiù láibùjí le.",null,"BODY411"],["经理: 你有什么方案？ (Bạn có phương án gì?)",null,null,"Jīnglǐ: nǐ yǒu shénme fāng'àn?",null,"BODY412"],["小阮: 我准备了两个方案：方案一，找另一家电机供应商先补五千台，价格贵百分之八，但是一个星期就能到；方案二，跟客户商量分两批交货，第一批一万五千台三月十五号前交，剩下的三月底交。 (Tôi chuẩn bị 2 phương án: một, tìm NCC động cơ khác bù trước 5.000 chiếc, giá đắt hơn 8% nhưng một tuần là có; hai, bàn với khách giao 2 đợt, đợt một 15.000 chiếc trước 15/3, số còn lại cuối tháng 3.)",null,null,"Xiǎo Ruǎn: wǒ zhǔnbèi le liǎnggè fāng'àn: fāng'àn yī, zhǎo lìngyījiā diànjī gōngyìngshāng xiān bǔ wǔqiān tái, jiàgé guì bǎifēnzhībā, dànshì yīgè xīngqī jiù néng dào; fāng'àn èr, gēn kèhù shāngliang fēn liǎngpī jiāohuò, dìyīpī yīwànwǔqiān tái sānyuè shíwǔhào qián jiāo, shèngxià de sānyuèdǐ jiāo.",null,"BODY413"],["经理: 你推荐哪个？ (Bạn đề xuất cái nào?)",null,null,"Jīnglǐ: nǐ tuījiàn nǎge?",null,"BODY414"],["小阮: 综合考虑成本和客户关系，我推荐方案一。多花的成本大概一万美元，但是能保证按时交货，客户明年还有八万台的订单。 (Cân nhắc tổng thể chi phí và quan hệ khách, tôi đề xuất phương án một. Chi phí thêm khoảng 10.000 USD nhưng đảm bảo giao đúng hạn, năm sau khách còn đơn 80.000 chiếc.)",null,null,"Xiǎo Ruǎn: zōnghé kǎolǜ chéngběn hé kèhùguānxi, wǒ tuījiàn fāng'àn yī. Duō huā de chéngběn dàgài yī wànměiyuán, dànshì néng bǎozhèng ànshí jiāohuò, kèhù míngnián háiyǒu bā wàntái de dìngdān.",null,"BODY415"],["经理: 新供应商的质量能保证吗？ (Chất lượng NCC mới có đảm bảo không?)",null,null,"Jīnglǐ: xīn gōngyìngshāng de zhìliàng néng bǎozhèng ma?",null,"BODY416"],["小阮: 他们是我们的备选供应商，去年做过测试，质量合格。我会让品质部到货以后全检。 (Họ là NCC dự phòng của chúng ta, năm ngoái đã thử nghiệm, chất lượng đạt. Hàng về tôi sẽ cho QC kiểm 100%.)",null,null,"Xiǎo Ruǎn: tāmen shì wǒmen de bèixuǎn gōngyìngshāng, qùnián zuò guò cèshì, zhìliàng hégé. Wǒhuì ràng pǐnzhì bù dàohuò yǐhòu quán jiǎn.",null,"BODY417"],["经理: 好，批准方案一。这件事要不要告诉客户？ (Được, duyệt phương án một. Việc này có cần báo khách không?)",null,null,"Jīnglǐ: hǎo, pīzhǔn fāng'àn yī. Zhèjiàn shì yào bùyào gàosu kèhù?",null,"BODY418"],["小阮: 我建议告诉客户。虽然不影响交期，但是让客户知道我们遇到问题马上就解决了，他们会更信任我们。 (Tôi đề nghị báo khách. Tuy không ảnh hưởng thời gian giao, nhưng để khách biết gặp vấn đề chúng ta giải quyết ngay, họ sẽ tin tưởng hơn.)",null,null,"Xiǎo Ruǎn: wǒ jiànyì gàosu kèhù. Suīrán bù yǐngxiǎng jiāo qī, dànshì ràng kèhù zhīdao wǒmen yùdào wèntí mǎshàng jiù jiějué le, tāmen huì gèng xìnrèn wǒmen.",null,"BODY419"],["经理: 有道理，你今天就给刘总打个电话。 (Có lý, hôm nay bạn gọi cho Lưu tổng.)",null,null,"Jīnglǐ: yǒu dàolǐ, nǐ jīntiān jiù gěi Liú zǒng dǎ gè diànhuà.",null,"BODY420"],["情景对话 5 — Chặng 5: Khách khiếu nại sau khi nhận hàng",null,null,"Qíngjǐng duìhuà",null,"BODY421-C"],["客户: 小阮，货我们收到了，但是有三百多台的外壳有划痕，我们的门店没法卖。 (Tiểu Nguyễn, hàng chúng tôi nhận rồi, nhưng hơn 300 chiếc vỏ bị trầy, cửa hàng không bán được.)",null,null,"Kèhù: Xiǎo Ruǎn, huò wǒmen shōudào le, dànshì yǒu sānbǎiduō tái de wàiké yǒu huàhén, wǒmen de méndiàn méifǎ mài.",null,"BODY422"],["小阮: 刘总，非常抱歉！给您添麻烦了。能麻烦您发几张照片给我吗？我先核实一下。 (Lưu tổng, rất xin lỗi! Gây phiền phức cho ngài rồi. Phiền ngài gửi vài ảnh cho tôi được không? Tôi xác minh trước.)",null,null,"Xiǎo Ruǎn: Liú zǒng, fēicháng bàoqiàn! Gěi nín tiānmáfan le. Néng máfan nín fājǐzhāng zhàopiàn gěi wǒ ma? Wǒ xiān héshí yīxià.",null,"BODY423"],["客户: 已经发到你微信上了，一共三百二十台。 (Gửi qua WeChat bạn rồi, tổng 320 chiếc.)",null,null,"Kèhù: yǐjīng fādào nǐ wēi xìn shàng le, yīgòng sānbǎi èrshí tái.",null,"BODY424"],["小阮: 收到了。我马上跟品质部和物流公司核实，两个小时以后给您回电话。 (Nhận rồi. Tôi xác minh ngay với QC và công ty vận chuyển, 2 tiếng sau gọi lại ngài.)",null,null,"Xiǎo Ruǎn: shōudào le. Wǒ mǎshàng gēn pǐnzhì bù hé wùliú gōngsī héshí, liǎnggè xiǎoshí yǐhòu gěi nín huí diànhuà.",null,"BODY425"],["小阮: (2 giờ sau) 刘总，经过核实，问题出在运输过程中。出厂的时候我们都检查过，但是有一辆货车在路上急刹车，里面的箱子倒了。 (Lưu tổng, qua xác minh, vấn đề do quá trình vận chuyển. Lúc xuất xưởng chúng tôi đều kiểm tra, nhưng một xe tải phanh gấp trên đường, thùng bên trong bị đổ.)",null,null,"Xiǎo Ruǎn: Liú zǒng, jīngguò héshí, wèntí chū zài yùnshū guòchéng zhōng. Chūchǎng de shíhou wǒmen dōu jiǎnchá guò, dànshì yǒu yīliàng huòchē zài lùshàng jíshāchē, lǐmiàn de xiāngzi dào le.",null,"BODY426"],["客户: 不管是谁的责任，我们下周就要开始卖了。 (Dù trách nhiệm ai, tuần sau chúng tôi phải bắt đầu bán rồi.)",null,null,"Kèhù: bùguǎnshìshéi de zérèn, wǒmen xiàzhōu jiùyào kāishǐ mài le.",null,"BODY427"],["小阮: 我理解。不管是谁的责任，我们现在最重要的是保证您按时上市。我们的处理方案是：第一，三天内免费补发三百二十台新的；第二，有划痕的那些，我们派人去您仓库拉回来；第三，以后每箱都加一层泡沫，防止运输中损坏。 (Tôi hiểu. Dù lỗi ai, quan trọng nhất là đảm bảo ngài ra mắt đúng hạn. Phương án xử lý: một, trong 3 ngày gửi bù miễn phí 320 chiếc mới; hai, những chiếc trầy chúng tôi cử người đến kho ngài chở về; ba, sau này mỗi thùng thêm một lớp xốp chống hỏng khi vận chuyển.)",null,null,"Xiǎo Ruǎn: wǒ lǐjiě. Bùguǎnshìshéi de zérèn, wǒmen xiànzài zuì zhòngyào de shì bǎozhèng nín ànshí shàngshì. Wǒmen de chǔlǐ fāng'àn shì: dìyī, sāntiān nèi miǎnfèi bǔfā sānbǎi èrshí tái xīn de; dì'èr, yǒu huàhén de nàxiē, wǒmen pài rén qù nín cāngkù lāhuílái; dìsān, yǐhòu měixiāng dōu jiā yīcéng pàomò, fángzhǐ yùnshū zhōng sǔnhuài.",null,"BODY428"],["客户: 补发的运费呢？ (Phí vận chuyển gửi bù?)",null,null,"Kèhù: bǔfā de yùnfèi ne?",null,"BODY429"],["小阮: 全部由我们承担，物流公司的赔偿由我们去跟他们谈，您不用操心。 (Chúng tôi chịu toàn bộ, bồi thường của công ty vận chuyển chúng tôi tự đàm phán, ngài không phải bận tâm.)",null,null,"Xiǎo Ruǎn: quánbù yóu wǒmen chéngdān, wùliú gōngsī de péicháng yóu wǒmen qù gēn tāmen tán, nín bùyòng cāoxīn.",null,"BODY430"],["客户: 好，你们处理得很快，我很满意。 (Được, các bạn xử lý rất nhanh, tôi rất hài lòng.)",null,null,"Kèhù: hǎo, nǐmen chǔlǐ de hěnkuài, wǒ hěn mǎnyì.",null,"BODY431"],["小阮: 谢谢刘总的理解。补发的货到了以后，我再给您打电话确认。祝新品大卖！ (Cảm ơn Lưu tổng đã thông cảm. Hàng bù đến tôi sẽ gọi lại xác nhận. Chúc sản phẩm mới bán chạy!)",null,null,"Xiǎo Ruǎn: xièxie Liú zǒng de lǐjiě. Bǔfā de huò dào le yǐhòu, wǒ zài gěi nín dǎdiànhuà quèrèn. Zhù xīnpǐn dà mài!",null,"BODY432"],["情景对话 6 — (HSK5) Chặng 6: Họp tổng kết dự án, rút kinh nghiệm",null,null,"Qíngjǐng duìhuà",null,"BODY433-C"],["经理: 华盛的第一批订单已经顺利完成了，今天我们开个总结会。小阮，你先说说。 (Đơn đợt đầu của Hoa Thịnh đã hoàn thành suôn sẻ, hôm nay họp tổng kết. Tiểu Nguyễn nói trước.)",null,null,"Jīnglǐ: Huáshèng de dìyīpī dìngdān yǐjīng shùnlìwánchéng le, jīntiān wǒmen kāi gè zǒngjiéhuì. Xiǎo Ruǎn, nǐ xiān shuōshuo.",null,"BODY434"],["小阮: 好的。我先汇报一下结果：两万台全部按时交货，客户满意度很高，上个星期刘总已经追加了三万台的订单。 (Vâng. Tôi báo cáo kết quả trước: 20.000 chiếc đều giao đúng hạn, khách rất hài lòng, tuần trước Lưu tổng đã đặt thêm 30.000 chiếc.)",null,null,"Xiǎo Ruǎn: hǎo de. Wǒ xiān huìbào yīxià jiéguǒ: liǎng wàntái quánbù ànshí jiāohuò, kèhù mǎnyìdù hěn gāo, shànggèxīngqī Liú zǒng yǐjīng zhuījiā le sān wàntái de dìngdān.",null,"BODY435"],["经理: 很好！遇到的问题呢？ (Rất tốt! Còn vấn đề gặp phải?)",null,null,"Jīnglǐ: hěn hǎo! Yùdào de wèntí ne?",null,"BODY436"],["小阮: 主要有两个问题：第一，电机供应商延误，我们临时换了备选供应商，多花了一万美元；第二，运输过程中有三百二十台损坏，补发又花了大概四千美元。 (Chủ yếu 2 vấn đề: một, NCC động cơ trễ, chúng ta tạm đổi sang NCC dự phòng, tốn thêm 10.000 USD; hai, trong vận chuyển hỏng 320 chiếc, gửi bù tốn khoảng 4.000 USD.)",null,null,"Xiǎo Ruǎn: zhǔyào yǒu liǎnggè wèntí: dìyī, diànjī gōngyìngshāng yánwù, wǒmen línshí huàn le bèixuǎn gōngyìngshāng, duō huā le yī wànměiyuán; dì'èr, yùnshū guòchéng zhōng yǒu sānbǎi èrshí tái sǔnhuài, bǔfā yòu huā le dàgài sìqiān měiyuán.",null,"BODY437"],["采购: 电机的问题，根本原因是我们只依赖一家供应商。我建议以后关键零件至少要有两家供应商，比例七比三。 (Vấn đề động cơ, nguyên nhân gốc là chỉ phụ thuộc một NCC. Tôi đề nghị sau này linh kiện then chốt ít nhất 2 NCC, tỷ lệ 7:3.)",null,null,"Cǎigòu: diànjī de wèntí, gēnběnyuányīn shì wǒmen zhǐ yīlài yījiā gōngyìngshāng. Wǒ jiànyì yǐhòu guānjiàn língjiàn zhìshǎo yào yǒu liǎngjiā gōngyìngshāng, bǐlì qī bǐ sān.",null,"BODY438"],["仓库: 运输的问题，我们已经改了包装，加了泡沫，另外也跟物流公司签了新的赔偿条款。 (Vấn đề vận chuyển, chúng tôi đã đổi bao bì, thêm xốp, ngoài ra ký với công ty vận chuyển điều khoản bồi thường mới.)",null,null,"Cāngkù: yùnshū de wèntí, wǒmen yǐjīng gǎi le bāozhuāng, jiā le pàomò, lìngwài yě gēn wùliú gōngsī qiān le xīn de péicháng tiáokuǎn.",null,"BODY439"],["财务: 我补充一点：虽然多花了一万四千美元，但是因为预付了百分之三十，我们的资金周转没有问题。这个付款方式以后可以作为标准。 (Tôi bổ sung: tuy tốn thêm 14.000 USD, nhưng nhờ trả trước 30%, dòng vốn không vấn đề. Phương thức thanh toán này sau này có thể làm chuẩn.)",null,null,"Cáiwù: wǒ bǔchōng yīdiǎn: suīrán duō huā le yīwànsìqiān měiyuán, dànshì yīnwèi yùfù le bǎifēnzhīsānshí, wǒmen de zījīnzhōuzhuǎn méiyǒu wèntí. Zhège fùkuǎn fāngshì yǐhòu kěyǐ zuòwéi biāozhǔn.",null,"BODY440"],["经理: 第二批三万台，大家觉得有什么新的风险？ (Đợt hai 30.000 chiếc, mọi người thấy rủi ro mới gì?)",null,null,"Jīnglǐ: dì'èrpī sān wàntái, dàjiā juéde yǒu shénme xīn de fēngxiǎn?",null,"BODY441"],["生产: 第二批要在五月交，正好是越南最热的时候，工厂里温度高，工人的效率会下降。 (Đợt hai giao tháng 5, đúng lúc nóng nhất VN, nhà xưởng nhiệt độ cao, hiệu suất công nhân giảm.)",null,null,"Shēngchǎn: dì'èrpī yào zài wǔyuè jiāo, zhènghǎo shì Yuènán zuì rè de shíhou, gōngchǎng lǐ wēndù gāo, gōngrén de xiàolǜ huì xiàjiàng.",null,"BODY442"],["小阮: 我建议提前一个月开始生产，同时在车间多装几台工业风扇，正好用我们自己的产品。 (Tôi đề nghị bắt đầu sản xuất sớm một tháng, đồng thời lắp thêm vài quạt công nghiệp trong xưởng, vừa hay dùng sản phẩm của chính mình.)",null,null,"Xiǎo Ruǎn: wǒ jiànyì tíqián yīgèyuè kāishǐ shēngchǎn, tóngshí zài chējiān duō zhuāng jǐtái gōngyè fēngshàn, zhènghǎo yòng wǒmen zìjǐ de chǎnpǐn.",null,"BODY443"],["经理: 哈哈，好主意！我总结一下今天的会议：第一，关键零件实行双供应商；第二，新包装和物流赔偿条款作为标准流程；第三，第二批提前一个月生产。小阮负责整理会议纪要，周五之前发给大家。 (Haha, ý hay! Tôi tổng kết: một, linh kiện then chốt áp dụng 2 NCC; hai, bao bì mới và điều khoản bồi thường vận chuyển thành quy trình chuẩn; ba, đợt hai sản xuất sớm một tháng. Tiểu Nguyễn tổng hợp biên bản, trước thứ 6 gửi mọi người.)",null,null,"Jīnglǐ: hāhā, hǎo zhǔyì! Wǒ zǒngjié yīxià jīntiān de huìyì: dìyī, guānjiàn língjiàn shíxíng shuāng gōngyìngshāng; dì'èr, xīn bāozhuāng hé wùliú péicháng tiáokuǎn zuòwéi biāozhǔn liúchéng; dìsān, dì'èrpī tíqián yīgèyuè shēngchǎn. Xiǎo Ruǎn fùzé zhěnglǐ huìyìjìyào, zhōuwǔ zhīqián fāgěi dàjiā.",null,"BODY444"],["小阮: 好的，没问题。 (Vâng, không vấn đề.)",null,null,"Xiǎo Ruǎn: hǎo de, méi wèntí.",null,"BODY445"],["引导练习 GUIDED SPEAKING — GV chuyển nhanh giữa các vai, HS phản ứng ngay",null,null,"Yǐndǎo liànxí",null,"BODY446-C"],["1. Hỏi: (经理) 小阮，客户刚才说要把交期提前一个星期，你怎么看？ (Giám đốc: Tiểu Nguyễn, khách vừa nói muốn giao sớm một tuần, bạn thấy sao?)",null,null,"Jīnglǐ | Xiǎo Ruǎn, kèhù gāngcái shuō yào bǎ jiāo qī tíqián yīgè xīngqī, nǐ zěnme kàn?",null,"BODY447"],["Đáp: 我先确认一下生产部能不能加班。如果可以，我们需要多花大概五千美元加班费，建议跟客户商量由他们承担一半。 (Tôi xác nhận trước sản xuất có tăng ca được không. Nếu được, tốn thêm khoảng 5.000 USD tiền tăng ca, đề nghị bàn với khách chịu một nửa.)",null,null,"Wǒ xiān quèrèn yīxià shēngchǎn bù néng bùnéng jiābān. Rúguǒ kěyǐ, wǒmen xūyào duō huā dàgài wǔqiān měiyuán jiābānfèi, jiànyì gēn kèhù shāngliang yóu tāmen chéngdān yībàn.",null,"BODY448"],["2. Hỏi: (客户) 你们的价格比别家高百分之五，为什么？ (Khách: Giá các bạn cao hơn nhà khác 5%, vì sao?)",null,null,"Kèhù | Nǐmen de jiàgébǐ biéjiā gāo bǎifēnzhīwǔ, wèishénme?",null,"BODY449"],["Đáp: 因为我们的价格包括了两年的保修和免费的技术支持。而且上一批两万台我们全部按时交货，这个稳定性是很多供应商做不到的。 (Vì giá chúng tôi gồm bảo hành 2 năm và hỗ trợ kỹ thuật miễn phí. Mà đợt trước 20.000 chiếc chúng tôi giao đúng hạn hết, sự ổn định này nhiều NCC không làm được.)",null,null,"Yīnwèi wǒmen de jiàgé bāokuò le liǎngnián de bǎoxiū hé miǎnfèi de jìshùzhīchí. Érqiě shàng yīpī liǎng wàntái wǒmen quánbù ànshí jiāohuò, zhège wěndìngxìng shì hěnduō gōngyìngshāng zuò bùdào de.",null,"BODY450"],["3. Hỏi: (同事) 仓库说没有地方放新到的电机了，怎么办？ (Đồng nghiệp: Kho nói không còn chỗ để động cơ mới về, làm sao?)",null,null,"Tóngshì | Cāngkù shuō méiyǒu dìfang fàng xīn dào de diànjī le, zěnmebàn?",null,"BODY451"],["Đáp: 先别急。我们先看看哪些成品可以提前发给客户，腾出地方；如果还不够，就临时租一个小仓库，一个月大概多少钱我去问一下。 (Đừng vội. Xem thành phẩm nào giao sớm cho khách được để dọn chỗ; vẫn không đủ thì thuê tạm kho nhỏ, một tháng khoảng bao nhiêu tôi đi hỏi.)",null,null,"Xiān biéjí. Wǒmen xiān kànkan nǎxiē chéngpǐn kěyǐ tíqián fāgěi kèhù, téngchū dìfang; rúguǒ hái bùgòu, jiù línshí zū yīgè xiǎo cāngkù, yīgèyuè dàgài duōshǎo qián wǒ qù wèn yīxià.",null,"BODY452"],["4. Hỏi: (HSK5, 总经理) 这个客户的利润只有百分之六，你觉得值得继续做吗？ (Tổng giám đốc: Khách này lợi nhuận chỉ 6%, bạn thấy có đáng tiếp tục không?)",null,null,"Zǒngjīnglǐ | Zhège kèhù de lìrùn zhǐyǒu bǎifēnzhīliù, nǐ juéde zhíde jìxù zuò ma?",null,"BODY453"],["Đáp: 从短期来看，百分之六确实不高；但是从长远来看，这个客户明年有十万台的订单，能让我们的生产线一直满负荷，单位成本会降低。另外，他们在越南的品牌很有名，对我们开发其他客户也有帮助。所以我认为值得继续做，但是第二年要争取把利润提高到百分之八。 (Ngắn hạn 6% đúng là không cao; nhưng lâu dài, năm sau khách này có đơn 100.000 chiếc, giúp chuyền chạy đầy công suất, chi phí đơn vị giảm. Ngoài ra thương hiệu họ ở VN rất nổi tiếng, giúp chúng ta phát triển khách khác. Nên tôi cho rằng đáng tiếp tục, nhưng năm thứ hai phải cố nâng lợi nhuận lên 8%.)",null,null,"Cóng duǎnqī láikàn, bǎifēnzhīliù quèshí bù gāo; dànshì cóng chángyuǎn láikàn, zhège kèhù míngnián yǒu shíwàntái de dìngdān, néng ràng wǒmen de shēngchǎnxiàn yīzhí mǎnfùhè, dānwèichéngběn huì jiàngdī. Lìngwài, tāmen zài Yuènán de pǐnpái hěn yǒumíng, duì wǒmen kāifā qítā kèhù yě yǒu bāngzhù. Suǒyǐ wǒ rènwéi zhíde jìxù zuò, dànshì dì'èrnián yào zhēngqǔ bǎ lìrùn tígāo dào bǎifēnzhībā.",null,"BODY454"],["情景模拟 ROLE-PLAY — GV đổi vai liên tục và thêm biến cố bất ngờ",null,null,"Qíngjǐng mónǐ",null,"BODY455-C"],["Luật chơi: HS là nhân viên kinh doanh xuyên suốt; GV lần lượt đóng vai khách hàng → giám đốc → NCC → khách hàng; mỗi vai GV đưa 1 biến cố, HS có 10 giây để phản ứng.",null,null,null,null,"BODY456"],["GV (客户): 小阮，我们老板说要把颜色从白色改成蓝色，现在还来得及吗？ (Khách: Tiểu Nguyễn, sếp chúng tôi muốn đổi màu từ trắng sang xanh, giờ còn kịp không?)",null,null,"Kèhù | Xiǎo Ruǎn, wǒmen lǎobǎn shuō yào bǎ yánsè cóng báisè gǎichéng lánsè, xiànzài hái láidejí ma?",null,"BODY457"],["HS: 刘总，我先确认一下：现在已经生产了八千台白色的。蓝色是全部改，还是剩下的一万二千台改？ (Lưu tổng, tôi xác nhận trước: hiện đã sản xuất 8.000 chiếc màu trắng. Màu xanh là đổi toàn bộ hay đổi 12.000 chiếc còn lại?)",null,null,"Liú zǒng, wǒ xiān quèrèn yīxià: xiànzài yǐjīng shēngchǎn le bāqiān tái báisè de. Lánsè shì quánbù gǎi, háishì shèngxià de yīwàn'èrqiān tái gǎi?",null,"BODY458"],["GV (客户): 剩下的改就行。 (Đổi số còn lại là được.)",null,null,"Kèhù | Shèngxià de gǎi jiù xíng.",null,"BODY459"],["HS: 好的，我跟生产部确认一下需要多长时间，下午给您答复。 (Vâng, tôi xác nhận với sản xuất cần bao lâu, chiều trả lời ngài.)",null,null,"Hǎo de, wǒ gēn shēngchǎn bù quèrèn yīxià xūyào duōchángshíjiān, xiàwǔ gěi nín dáfù.",null,"BODY460"],["GV (đổi vai 经理): 改颜色要重新买原料，成本谁出？ (Giám đốc: Đổi màu phải mua nguyên liệu mới, chi phí ai chịu?)",null,null,"Jīnglǐ | Gǎi yánsè yào chóngxīn mǎi yuánliào, chéngběn shuí chū?",null,"BODY461"],["HS: 经理，这是客户的要求，我建议原料差价由客户承担。不过考虑到明年的大订单，我们可以不收加急费。 (Giám đốc, đây là yêu cầu của khách, em đề nghị chênh lệch nguyên liệu khách chịu. Nhưng xét đơn lớn năm sau, có thể không thu phí gấp.)",null,null,"Jīnglǐ, zhè shì kèhù de yāoqiú, wǒ jiànyì yuánliào chājià yóu kèhù chéngdān. Bùguò kǎolǜ dào míngnián de dà dìngdān, wǒmen kěyǐ bù shōu jiājí fèi.",null,"BODY462"],["GV (đổi vai 供应商): 蓝色的塑料原料现在缺货，最快要两个星期。 (NCC: Nguyên liệu nhựa xanh hiện hết hàng, nhanh nhất 2 tuần.)",null,null,"Gōngyìngshāng | Lánsè de sùliàoyuánliào xiànzài quēhuò, zuìkuài yào liǎnggè xīngqī.",null,"BODY463"],["HS: 两个星期太久了。如果我们先付全款，能不能一个星期内交一半？ (2 tuần lâu quá. Nếu chúng tôi trả đủ tiền trước, trong một tuần giao một nửa được không?)",null,null,"Liǎnggè xīngqī tàijiǔ le. Rúguǒ wǒmen xiānfù quánkuǎn, néng bùnéng yīgè xīngqī nèi jiāo yībàn?",null,"BODY464"],["GV (供应商): 先付全款的话，一个星期可以交百分之六十。 (Trả đủ trước thì một tuần giao được 60%.)",null,null,"Gōngyìngshāng | Xiānfù quánkuǎn dehuà, yīgè xīngqī kěyǐ jiāo bǎifēnzhīliùshí.",null,"BODY465"],["GV (đổi vai 客户): 小阮，蓝色的什么时候能好？ (Khách: Tiểu Nguyễn, màu xanh khi nào xong?)",null,null,"Kèhù | Xiǎo Ruǎn, lánsè de shénme shíhou néng hǎo?",null,"BODY466"],["HS: 刘总，我们的方案是：蓝色的原料一个星期到百分之六十，先生产七千台蓝色的，跟白色的一起三月十五号前交；剩下的五千台蓝色三月二十五号前交。原料的差价是每台零点三美元，您看可以吗？ (Lưu tổng, phương án của chúng tôi: nguyên liệu xanh một tuần về 60%, sản xuất trước 7.000 chiếc xanh, cùng hàng trắng giao trước 15/3; 5.000 chiếc xanh còn lại giao trước 25/3. Chênh lệch nguyên liệu 0,3 USD/chiếc, ngài thấy được không?)",null,null,"Liú zǒng, wǒmen de fāng'àn shì: lánsè de yuánliào yīgè xīngqī dào bǎifēnzhīliùshí, xiān shēngchǎn qīqiān tái lánsè de, gēn báisè de yīqǐ sānyuè shíwǔhào qián jiāo; shèngxià de wǔqiān tái lánsè sānyuè èrshíwǔ hào qián jiāo. Yuánliào de chājià shì měi tái língdiǎn sān měiyuán, nín kàn kěyǐ ma?",null,"BODY467"],["GV (客户): 可以，就这么办！ (Được, cứ thế làm!)",null,null,"Kèhù | Kěyǐ, jiù zhème bàn!",null,"BODY468"],["纠错与升级 FEEDBACK — Lỗi tổng hợp hay gặp khi nói liên tục (✗ → ✓)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY469-C"],["✗ 我知道了，我做。 (cụt, thiếu xác nhận) → ✓ 好的，我先确认一下……，……之前给您答复。",null,null,"Wǒ zhīdao le, wǒ zuò. | Hǎo de, wǒ xiān quèrèn yīxià……,…… zhīqián gěi nín dáfù.",null,"BODY470"],["✗ 这个不是我们的错。 → ✓ 经过核实，问题出在……，我们的处理方案是……",null,null,"Zhège bùshì wǒmen de cuò. | Jīngguò héshí, wèntí chū zài……, wǒmen de chǔlǐ fāng'àn shì……",null,"BODY471"],["✗ 价格不能降。 (đóng cửa đàm phán) → ✓ 价格方面我们可以再考虑，但是前提是……",null,null,"Jiàgé bùnéng jiàng. | Jiàgé fāngmiàn wǒmen kěyǐ zài kǎolǜ, dànshì qiántí shì……",null,"BODY472"],["✗ 有问题，不能按时交货。 (báo xấu không kèm giải pháp) → ✓ 目前有一个风险：……，我准备了两个方案：……",null,null,"Yǒu wèntí, bùnéng ànshí jiāohuò. | Mùqián yǒu yīgè fēngxiǎn:……, wǒ zhǔnbèi le liǎnggè fāng'àn:……",null,"BODY473"],["✗ 好的好的。 (khi họp kết thúc) → ✓ 我总结一下：第一……；第二……；第三……",null,null,"Hǎo de hǎo de. | Wǒ zǒngjié yīxià: dìyī……; dì'èr……; dìsān……",null,"BODY474"],["Mẹo tự sửa: nghe lại bản ghi âm, đánh dấu (1) câu thiếu chủ ngữ/thiếu xác nhận, (2) lỗi trật tự từ thời gian – địa điểm, (3) lỗi lượng từ, (4) lỗi thanh điệu ở từ khóa nghiệp vụ.",null,null,null,null,"BODY475"],["Phát âm: 确认 quèrèn; 协商 xiéshāng; 核实 héshí; 补救 bǔjiù; 达成一致 dáchéng yīzhì.",null,null,"Quèrèn | Xiéshāng | Héshí | Bǔjiù | Dáchéng yīzhì",null,"BODY476"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY477-C"],["Nghe lại bản ghi âm role-play của buổi này, tự tìm và sửa 10 câu sai (ghi câu sai → câu đúng → lý do), nộp kèm bản ghi âm nói lại 10 câu đã sửa.",null,null,null,null,"BODY478"],["HSK5: ghi âm lại Chặng 3 (đàm phán) và Chặng 5 (khiếu nại) với số liệu của công ty mình.",null,null,null,null,"BODY479"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY480"],["Buổi 24 — 结业口语测评 Đánh giá cuối khóa",null,null,"Jiéyè kǒuyǔ cèpíng",null,"BODY481-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY482-C"],["HSK4 (17 phút/HS): Phần 1 Giới thiệu bản thân 2' → Phần 2 Đời sống hằng ngày 5' → Phần 3 Công việc 5' → Phần 4 Kể chuyện 5'.",null,null,null,null,"BODY483"],["HSK5 (25 phút/HS): Phần 1 Trình bày chủ đề 3' → Phần 2 Thảo luận 7' → Phần 3 Đàm phán 10' → Phần 4 Phản biện 5'.",null,null,null,null,"BODY484"],["Quy trình buổi thi: GV ghi âm toàn bộ → chấm theo 5 tiêu chí → HS nghe lại và so sánh với bản ghi âm Buổi 01 → nhận xét và lập mục tiêu học tiếp.",null,null,null,null,"BODY485"],["热身 WARM-UP — Câu hỏi làm quen, giúp HS bớt căng thẳng trước khi thi",null,null,"Rèshēn",null,"BODY486-C"],["1. Hỏi: 今天紧张吗？ (Hôm nay có căng thẳng không?)",null,null,"Jīntiān jǐnzhāng ma?",null,"BODY487"],["Đáp: 有一点紧张，不过我准备了很久，希望能发挥好。 (Hơi căng thẳng, nhưng tôi chuẩn bị lâu rồi, mong thể hiện tốt.)",null,null,"Yǒu yīdiǎn jǐnzhāng, bùguò wǒ zhǔnbèi le hěn jiǔ, xīwàng néng fāhuī hǎo.",null,"BODY488"],["2. Hỏi: 这二十四节课，你觉得自己哪方面进步最大？ (Qua 24 buổi, bạn thấy mình tiến bộ nhiều nhất ở mặt nào?)",null,null,"Zhè èrshísìjié kè, nǐ juéde zìjǐ nǎ fāngmiàn jìnbù zuìdà?",null,"BODY489"],["Đáp: 我觉得进步最大的是反应速度。以前别人问我问题，我要先在心里翻译，现在可以直接用中文回答了。 (Tiến bộ nhiều nhất là tốc độ phản xạ. Trước người ta hỏi tôi phải dịch trong đầu, giờ trả lời thẳng bằng tiếng Trung được.)",null,null,"Wǒ juéde jìnbù zuìdà de shì fǎnyìngsùdù. Yǐqián biérén wèn wǒ wèntí, wǒ yào xiān zài xīnlǐ fānyì, xiànzài kěyǐ zhíjiē yòng Zhōngwén huídá le.",null,"BODY490"],["3. Hỏi: 哪一节课你印象最深？ (Buổi nào bạn ấn tượng nhất?)",null,null,"Nǎ yījiékè nǐ yìnxiàng zuìshēn?",null,"BODY491"],["Đáp: 我印象最深的是谈判那节课，因为我上个月真的用课上学的句子跟供应商谈下了百分之三的折扣。 (Ấn tượng nhất là buổi đàm phán, vì tháng trước tôi thật sự dùng câu học trên lớp để đàm phán được chiết khấu 3% với NCC.)",null,null,"Wǒ yìnxiàng zuìshēn de shì tánpàn nà jié kè, yīnwèi wǒ shànggèyuè zhēnde yòng kè shàngxué de jùzi gēn gōngyìngshāng tán xià le bǎifēnzhīsān de zhékòu.",null,"BODY492"],["语言输入 INPUT — 12 cụm \"ăn điểm\" của cả khóa (dùng được trong mọi phần thi)",null,null,"Yǔyán shūrù",null,"BODY493-C"],["1. 说实话 (nói thật): 说实话，刚开始学的时候我差点放弃。 (Nói thật, lúc mới học tôi suýt bỏ cuộc.)",null,null,"Shuōshíhuà | Shuōshíhuà, gāng kāishǐ xué de shíhou wǒ chàdiǎn fàngqì.",null,"BODY494"],["2. 在我看来 (theo tôi): 在我看来，经验比学历更重要。 (Theo tôi, kinh nghiệm quan trọng hơn bằng cấp.)",null,null,"Zàiwǒkànlái | Zàiwǒkànlái, jīngyàn bǐ xuélì gèng zhòngyào.",null,"BODY495"],["3. 举个例子 (lấy ví dụ): 举个例子，上个月我们就遇到过这样的问题。 (Ví dụ, tháng trước chúng tôi gặp vấn đề như vậy.)",null,null,"Jǔ gè lìzi | Jǔ gè lìzi, shànggèyuè wǒmen jiù yùdào guò zhèyàng de wèntí.",null,"BODY496"],["4. 一方面……另一方面 (một mặt … mặt khác): 一方面工资高，另一方面能学到很多东西。 (Một mặt lương cao, mặt khác học được nhiều.)",null,null,"Yīfāngmiàn…… lìngyīfāngmiàn | Yīfāngmiàn gōngzī gāo, lìngyīfāngmiàn néng xuédào hěnduō dōngxi.",null,"BODY497"],["5. 不可否认 (không thể phủ nhận): 不可否认，网购非常方便。 (Không thể phủ nhận mua sắm online rất tiện.)",null,null,"Bùkěfǒurèn | Bùkěfǒurèn, wǎng gòu fēicháng fāngbiàn.",null,"BODY498"],["6. 不能一概而论 (không thể vơ đũa cả nắm): 年轻人的情况不能一概而论。 (Tình hình người trẻ không thể vơ đũa cả nắm.)",null,null,"Bùnéng yīgài'érlùn | Niánqīngrén de qíngkuàng bùnéng yīgài'érlùn.",null,"BODY499"],["7. 从长远来看 (về lâu dài): 从长远来看，这是一笔很划算的投资。 (Về lâu dài đây là khoản đầu tư rất hời.)",null,null,"Cóng chángyuǎn láikàn | Cóng chángyuǎn láikàn, zhè shì yībǐ hěn huásuàn de tóuzī.",null,"BODY500"],["8. 与其……不如 (thay vì … chi bằng): 与其抱怨，不如想办法解决。 (Thay vì than phiền, chi bằng nghĩ cách giải quyết.)",null,null,"Yǔqí…… bùrú | Yǔqí bàoyuàn, bùrú xiǎng bànfǎ jiějué.",null,"BODY501"],["9. 如果贵方能……我们可以 (nếu quý bên … chúng tôi có thể): 如果贵方能预付，我们可以降价。 (Nếu quý bên trả trước, chúng tôi giảm giá.)",null,null,"Rúguǒ guìfāng néng…… wǒmen kěyǐ | Rúguǒ guìfāng néng yùfù, wǒmen kěyǐ jiàngjià.",null,"BODY502"],["10. 我理解……，不过 (tôi hiểu …, nhưng): 我理解你的担心，不过数据说明了问题。 (Tôi hiểu nỗi lo của bạn, nhưng số liệu đã nói lên vấn đề.)",null,null,"Wǒ lǐjiě……, bùguò | Wǒ lǐjiě nǐ de dānxīn, bùguò shùjù shuōmíng le wèntí.",null,"BODY503"],["11. 经过这件事，我明白了 (qua chuyện này tôi hiểu rằng): 经过这件事，我明白了沟通的重要性。 (Qua chuyện này tôi hiểu tầm quan trọng của giao tiếp.)",null,null,"Jīngguò zhèjiàn shì, wǒ míngbai le | Jīngguò zhèjiàn shì, wǒ míngbai le gōutōng de zhòngyàoxìng.",null,"BODY504"],["12. 总的来说 (nói chung, tóm lại): 总的来说，这次经历让我成长了很多。 (Tóm lại, trải nghiệm này giúp tôi trưởng thành nhiều.)",null,null,"Zǒngdeláishuō | Zǒngdeláishuō, zhècì jīnglì ràng wǒ chéngzhǎng le hěnduō.",null,"BODY505"],["句型 MẪU CÂU — Khung \"观点—理由—例子—总结\" và các khung ôn tập",null,null,"Jùxíng | \"Guāndiǎn- lǐyóu- lìzi- zǒngjié\"",null,"BODY506-C"],["1. 观点—理由—例子—总结 (Quan điểm – Lý do – Ví dụ – Tổng kết)",null,null,"Guāndiǎn- lǐyóu- lìzi- zǒngjié",null,"BODY507"],["Ví dụ: 我认为每个人都应该学一门外语（观点）。因为外语能给我们更多的工作机会（理由）。比如我学了中文以后，从普通员工升到了销售主管（例子）。所以，学外语是对自己最好的投资（总结）。 (Tôi cho rằng ai cũng nên học một ngoại ngữ. Vì ngoại ngữ cho ta nhiều cơ hội việc làm hơn. Như tôi học tiếng Trung xong, từ nhân viên lên trưởng nhóm sales. Vì vậy học ngoại ngữ là đầu tư tốt nhất cho bản thân.)",null,null,"Wǒ rènwéi měigè rén dōu yīnggāi xué yīmén wàiyǔ(guāndiǎn). Yīnwèi wàiyǔ néng gěi wǒmen gèng duō de gōngzuò jīhuì(lǐyóu). Bǐrú wǒ xué le Zhōngwén yǐhòu, cóng pǔtōngyuángōng shēng dào le xiāoshòuzhǔguǎn(lìzi). Suǒyǐ, xué wàiyǔ shì duì zìjǐ zuìhǎo de tóuzī(zǒngjié).",null,"BODY508"],["Ví dụ: 我觉得公司应该允许员工弹性上班（观点）。因为河内早上堵车很严重（理由）。举个例子，我每天七点出门，八点半才到公司（例子）。总之，弹性上班能让大家把时间用在工作上，而不是路上（总结）。 (Tôi thấy công ty nên cho phép giờ làm linh hoạt. Vì sáng Hà Nội tắc nghiêm trọng. Ví dụ tôi 7h ra khỏi nhà, 8h30 mới đến công ty. Tóm lại giờ linh hoạt giúp mọi người dùng thời gian cho công việc chứ không phải trên đường.)",null,null,"Wǒ juéde gōngsī yīnggāi yǔnxǔ yuángōng tánxìng shàngbān(guāndiǎn). Yīnwèi Hénèi zǎoshang dǔchē hěn yánzhòng(lǐyóu). Jǔ gè lìzi, wǒ měitiān qīdiǎn chūmén, bādiǎnbàn cái dào gōngsī(lìzi). Zǒngzhī, tánxìng shàngbān néng ràng dàjiā bǎ shíjiān yòng zài gōngzuò shàng, ér bùshì lùshàng(zǒngjié).",null,"BODY509"],["2. 有一次……；当时……；没想到……；经过这件事…… (Kể chuyện: Có lần … ; lúc đó … ; không ngờ … ; qua chuyện này …)",null,null,"Yǒu yīcì……; dāngshí……; méixiǎngdào……; jīngguò zhèjiàn shì……",null,"BODY510"],["Ví dụ: 有一次我第一次一个人去中国出差，当时我的中文还很差，没想到在机场就遇到了麻烦，幸亏一位大姐帮了我。经过这件事，我明白了出门前一定要做好准备。 (Có lần tôi lần đầu đi công tác TQ một mình, lúc đó tiếng Trung còn kém, không ngờ ở sân bay đã gặp rắc rối, may có một chị giúp. Qua chuyện này tôi hiểu trước khi đi phải chuẩn bị kỹ.)",null,null,"Yǒu yīcì wǒ dìyīcì yīgè rén qù Zhōngguó chūchāi, dāngshí wǒ de Zhōngwén hái hěn chà, méixiǎngdào zài jīchǎng jiù yùdào le máfan, xìngkuī yīwèi dàjiě bāng le wǒ. Jīngguò zhèjiàn shì, wǒ míngbai le chū ménqián yīdìng yào zuòhǎo zhǔnbèi.",null,"BODY511"],["3. 目前……；遇到的问题是……；下一步…… (Báo cáo: Hiện tại …; vấn đề gặp phải là …; bước tiếp theo …)",null,null,"Mùqián……; yùdào de wèntí shì……; xià yībù……",null,"BODY512"],["Ví dụ: 目前项目完成了百分之七十；遇到的问题是供应商延误；下一步我们打算开发一家备选供应商。 (Hiện dự án hoàn thành 70%; vấn đề là NCC giao trễ; bước tiếp theo dự định phát triển một NCC dự phòng.)",null,null,"Mùqián xiàngmù wánchéng le bǎifēnzhīqīshí; yùdào de wèntí shì gōngyìngshāng yánwù; xià yībù wǒmen dǎsuàn kāifā yījiā bèixuǎn gōngyìngshāng.",null,"BODY513"],["4. (HSK5) 我理解您的观点，不过我想从另一个角度来看…… (Tôi hiểu quan điểm của ngài, nhưng tôi muốn nhìn từ góc độ khác …)",null,null,"Wǒ lǐjiě nín de guāndiǎn, bùguò wǒ xiǎng cóng lìng yīgè jiǎodù láikàn……",null,"BODY514"],["Ví dụ: 我理解您的观点，不过我想从另一个角度来看：如果只看成本，自动化确实很贵；但是从长远来看，它能解决招工难的问题。 (Tôi hiểu quan điểm của ngài, nhưng nhìn từ góc khác: nếu chỉ xét chi phí, tự động hóa đúng là đắt; nhưng lâu dài nó giải quyết được vấn đề khó tuyển người.)",null,null,"Wǒ lǐjiě nín de guāndiǎn, bùguò wǒ xiǎng cóng lìng yīgè jiǎodù láikàn: rúguǒ zhǐ kàn chéngběn, zìdònghuà quèshí hěn guì; dànshì cóng chángyuǎn láikàn, tā néng jiějué zhāogōngnán de wèntí.",null,"BODY515"],["TIÊU CHÍ CHẤM ĐIỂM — 5 tiêu chí, mỗi tiêu chí 20 điểm (tổng 100)",null,null,null,null,"BODY516-C"],["1. 流利度 Lưu loát (20đ): 17–20 nói liền mạch, ít ngập ngừng, dùng câu \"câu giờ\" tự nhiên; 12–16 đôi lúc dừng 3–5 giây; dưới 12 dừng lâu, nhiều \"ờ… à…\".",null,null,"Liúlìdù",null,"BODY517"],["2. 准确度 Chính xác (20đ): 17–20 ngữ pháp và thanh điệu gần như đúng hết; 12–16 có lỗi nhưng không ảnh hưởng hiểu nghĩa; dưới 12 lỗi làm người nghe hiểu sai.",null,null,"Zhǔnquèdù",null,"BODY518"],["3. 自然度 Tự nhiên (20đ): 17–20 dùng từ, khẩu ngữ đúng ngữ cảnh, đổi sắc thái theo đối tượng; 12–16 đúng nhưng cứng, giống sách; dưới 12 dịch từng chữ từ tiếng Việt.",null,null,"Zìrándù",null,"BODY519"],["4. 互动 Tương tác (20đ): 17–20 biết hỏi lại, xác nhận, phản hồi ý người kia; 12–16 trả lời được nhưng ít chủ động; dưới 12 chỉ trả lời cụt.",null,null,"Hùdòng",null,"BODY520"],["5. 逻辑 Logic (20đ): 17–20 có cấu trúc rõ (quan điểm – lý do – ví dụ – tổng kết); 12–16 có ý nhưng sắp xếp lộn xộn; dưới 12 lan man, lạc đề.",null,null,"Luójí",null,"BODY521"],["Xếp loại: 90–100 Xuất sắc · 75–89 Tốt · 60–74 Đạt · dưới 60 Cần học thêm học phần củng cố.",null,null,null,null,"BODY522"],["PHẦN 1 — 自我介绍 Giới thiệu bản thân (HSK4: 2 phút)",null,null,"Zìwǒjièshào",null,"BODY523-C"],["Câu hỏi GV: 请你介绍一下自己，包括你的工作、学中文的原因和以后的打算。 (Mời bạn giới thiệu bản thân, gồm công việc, lý do học tiếng Trung và dự định sau này.)",null,null,"Qǐng nǐ jièshào yīxià zìjǐ, bāokuò nǐ de gōngzuò, xué Zhōngwén de yuányīn hé yǐhòu de dǎsuàn.",null,"BODY524"],["Bài mẫu: 大家好，我叫黎氏芳，今年三十二岁，是海防人。我目前在一家中资电子厂工作，担任采购主管，主要负责跟中国供应商谈价格和跟进交货。我之所以学中文，是因为我每天都要跟中国人打交道。一开始我只会说一些简单的句子，开会的时候经常听不懂，只能靠翻译。经过这半年的学习，我现在可以自己跟供应商谈判了，上个月还帮公司多谈下了百分之三的折扣。说实话，这让我很有成就感。接下来，我打算明年考HSK5，并且希望三年之内能成为采购经理。谢谢大家！",null,null,"Dàjiā hǎo, wǒ jiào Lí Shìfāng, jīnnián sānshí'èrsuì, shì Hǎifáng rén. Wǒ mùqián zài yījiā zhōngzī diànzichǎng gōngzuò, dānrèn cǎigòu zhǔguǎn, zhǔyào fùzé gēn Zhōngguó gōngyìngshāng tán jiàgé hé gēnjìn jiāohuò. Wǒ zhīsuǒyǐ xué Zhōngwén, shìyīnwèi wǒ měitiān dōu yào gēn Zhōngguórén dǎjiāodao. Yī kāishǐ wǒ zhǐ huì shuō yīxiē jiǎndān de jùzi, kāihuì de shíhou jīngcháng tīngbùdǒng, zhǐnéngkào fānyì. Jīngguò zhè bànnián de xuéxí, wǒ xiànzài kěyǐ zìjǐ gēn gōngyìngshāng tánpàn le, shànggèyuè hái bāng gōngsī duō tán xià le bǎifēnzhīsān de zhékòu. Shuōshíhuà, zhè ràng wǒ hěn yǒu chéngjiùgǎn. Jiēxiàlái, wǒ dǎsuàn míngnián kǎo HSK5, bìngqiě xīwàng sānnián zhīnèi néng chéngwéi cǎigòu jīnglǐ. Xièxie dàjiā!",null,"BODY525"],["Câu hỏi phụ GV có thể hỏi thêm: 你觉得学中文最难的是什么？/ 你最喜欢中国文化的哪一方面？/ 如果有机会去中国工作，你会去吗？",null,null,"Nǐ juéde xué Zhōngwén zuì nán de shì shénme? / | Nǐ zuì xǐhuan Zhōngguó wénhuà de nǎyīfāngmiàn? / | Rúguǒ yǒu jīhuì qù Zhōngguó gōngzuò, nǐ huì qù ma?",null,"BODY526"],["PHẦN 2 — 日常生活 Đời sống hằng ngày (HSK4: 5 phút hỏi đáp liên tục)",null,null,"Rìchángshēnghuó",null,"BODY527-C"],["考官: 你平时周末一般怎么过？ (Cuối tuần bạn thường trải qua thế nào?)",null,null,"Kǎoguān: nǐ píngshí zhōumò yībān zěnme guò?",null,"BODY528"],["考生: 我周末不是在家陪孩子，就是跟朋友去郊外爬山。上个周末我们去了三岛，风景特别美。 (Cuối tuần không ở nhà với con thì đi leo núi ngoại ô với bạn. Cuối tuần trước đi Tam Đảo, cảnh rất đẹp.)",null,null,"Kǎoshēng: wǒ zhōumò bùshì zàijiā péi háizi, jiùshì gēn péngyou qù jiāowài páshān. Shàng gè zhōumò wǒmen qù le Sāndǎo, fēngjǐng tèbié měi.",null,"BODY529"],["考官: 爬山累不累？ (Leo núi có mệt không?)",null,null,"Kǎoguān: páshān lèibùlèi?",null,"BODY530"],["考生: 挺累的，不过爬到山顶看到云海，所有的累都值了。而且自从开始爬山以后，我的睡眠好多了。 (Khá mệt, nhưng lên đỉnh ngắm biển mây, mọi mệt mỏi đều đáng. Mà từ khi bắt đầu leo núi, giấc ngủ của tôi tốt hơn nhiều.)",null,null,"Kǎoshēng: tǐng lèi de, bùguò pá dào shāndǐng kàndào yúnhǎi, suǒyǒu de lèi dōu zhí le. Érqiě zìcóng kāishǐ páshān yǐhòu, wǒ de shuìmián hǎoduō le.",null,"BODY531"],["考官: 如果有中国朋友来河内，你会带他去哪儿？吃什么？ (Nếu bạn TQ đến Hà Nội, bạn đưa đi đâu? Ăn gì?)",null,null,"Kǎoguān: rúguǒ yǒu Zhōngguó péngyou lái Hénèi, nǐ huì dài tā qù nǎr? Chī shénme?",null,"BODY532"],["考生: 我会先带他去还剑湖和老城区逛逛，然后去喝鸡蛋咖啡。中午吃烤肉米线，晚上看水上木偶戏。来河内一定要吃烤肉米线，不然就白来了。 (Đưa đi Hồ Gươm, phố cổ dạo trước, rồi uống cà phê trứng. Trưa ăn bún chả, tối xem múa rối nước. Đến Hà Nội nhất định phải ăn bún chả, không thì uổng công.)",null,null,"Kǎoshēng: wǒhuì xiān dài tā qù Huánjiàn Hú hé lǎochéngqū guàngguàng, ránhòu qù hē jīdànkāfēi. Zhōngwǔ chī kǎoròumǐxiàn, wǎnshàng kàn shuǐshàngmù'ǒuxì. Lái Hénèi yīdìng yào chī kǎoròumǐxiàn, bùrán jiù bái lái le.",null,"BODY533"],["考官: 你在超市买东西的时候遇到过什么问题吗？ (Mua đồ ở siêu thị bạn từng gặp vấn đề gì chưa?)",null,null,"Kǎoguān: nǐ zài chāoshì mǎi dōngxi de shíhou yùdào guò shénme wèntí ma?",null,"BODY534"],["考生: 遇到过。有一次收银员把价格算错了，标签上写的是十二万，她扫的是十五万。我就跟她说：\"不好意思，这个价格好像算错了。\"她马上帮我改了。 (Có. Có lần thu ngân tính sai giá, nhãn ghi 120 nghìn, cô ấy quét 150 nghìn. Tôi nói: \"Xin lỗi, giá này hình như tính sai.\" Cô ấy sửa ngay.)",null,null,"Kǎoshēng: yùdào guò. Yǒu yīcì shōuyínyuán bǎ jiàgé suàncuò le, biāoqiān shàng xiě de shì shí'èrwàn, tā sǎo de shì shíwǔwàn. Wǒ jiù gēn tā shuō: \"bùhǎoyìsi, zhège jiàgé hǎoxiàng suàncuò le.\" Tā mǎshàng bāng wǒ gǎi le.",null,"BODY535"],["考官: 你觉得手机让生活变得更好了吗？ (Bạn thấy điện thoại khiến cuộc sống tốt hơn không?)",null,null,"Kǎoguān: nǐ juéde shǒujī ràng shēnghuó biànde gènghǎo le ma?",null,"BODY536"],["考生: 一方面，手机让生活方便多了，付款、叫车、学习都可以用手机；另一方面，很多人一闲下来就刷短视频，浪费了很多时间。我觉得关键是要自律。 (Một mặt điện thoại giúp cuộc sống tiện hơn nhiều, thanh toán, gọi xe, học tập đều dùng được; mặt khác nhiều người hễ rảnh là lướt video, lãng phí nhiều thời gian. Tôi thấy mấu chốt là tự giác.)",null,null,"Kǎoshēng: yīfāngmiàn, shǒujī ràng shēnghuó fāngbiàn duō le, fùkuǎn, jiào chē, xuéxí dōu kěyǐ yòng shǒujī; lìngyīfāngmiàn, hěnduō rén yī xiánxiàlái jiù shuā duǎn shìpín, làngfèi le hěnduō shíjiān. Wǒ juéde guānjiàn shì yào zìlǜ.",null,"BODY537"],["Ngân hàng câu hỏi Phần 2: 你最近一次旅行去了哪儿？/ 你的爱好是什么？是怎么开始的？/ 你住的地方交通方便吗？/ 你会做饭吗？拿手菜是什么？/ 你跟朋友约好了，他放你鸽子，你会怎么做？",null,null,"Nǐ zuìjìn yīcì lǚxíng qù le nǎr? / | Nǐ de àihào shì shénme? Shì zěnme kāishǐ de? / | Nǐ zhù de dìfang jiāotōng fāngbiàn ma? / | Nǐ huì zuòfàn ma? Náshǒucài shì shénme? / | Nǐ gēn péngyou yuē hǎo le, tā fàng nǐ gēzi, nǐ huì zěnme zuò?",null,"BODY538"],["PHẦN 3 — 工作 Công việc (HSK4: 5 phút hỏi đáp liên tục)",null,null,"Gōngzuò",null,"BODY539-C"],["考官: 请你介绍一下你的工作职责。 (Giới thiệu trách nhiệm công việc của bạn.)",null,null,"Kǎoguān: qǐng nǐ jièshào yīxià nǐ de gōngzuò zhízé.",null,"BODY540"],["考生: 我是仓库主管，主要职责包括管理进出库、每月盘点和安排发货。我们仓库有两千多种物料，我带一个六个人的团队。 (Tôi là trưởng kho, trách nhiệm chính gồm quản lý nhập xuất, kiểm kê hằng tháng và sắp xếp giao hàng. Kho có hơn 2.000 loại vật tư, tôi dẫn đội 6 người.)",null,null,"Kǎoshēng: wǒ shì cāngkù zhǔguǎn, zhǔyàozhízé bāokuò guǎnlǐ jìnchū kù, měiyuè pándiǎn hé ānpái fāhuò. Wǒmen cāngkù yǒu liǎngqiānduōzhǒng wùliào, wǒ dài yīgè liùgè rén de tuánduì.",null,"BODY541"],["考官: 你的工作最大的挑战是什么？ (Thách thức lớn nhất trong công việc của bạn là gì?)",null,null,"Kǎoguān: nǐ de gōngzuò zuìdà de tiǎozhàn shì shénme?",null,"BODY542"],["考生: 最大的挑战是销售经常临时加急单，我们要马上调整发货计划，有时候人手不够。 (Thách thức lớn nhất là sales hay đột xuất thêm đơn gấp, chúng tôi phải điều chỉnh kế hoạch giao ngay, đôi khi thiếu người.)",null,null,"Kǎoshēng: zuìdà de tiǎozhàn shì xiāoshòu jīngcháng línshí jiājí dān, wǒmen yào mǎshàng tiáozhěng fāhuò jìhuà, yǒushíhou rénshǒu bùgòu.",null,"BODY543"],["考官: 遇到这种情况你怎么处理？ (Gặp trường hợp đó bạn xử lý thế nào?)",null,null,"Kǎoguān: yùdào zhèzhǒng qíngkuàng nǐ zěnme chǔlǐ?",null,"BODY544"],["考生: 我会先确认急单的数量和时间，然后看看哪些不急的订单可以往后推。如果还是来不及，我会跟经理申请加班，或者从生产部借两个人。 (Tôi xác nhận số lượng và thời gian của đơn gấp trước, rồi xem đơn không gấp nào lùi được. Vẫn không kịp thì xin giám đốc tăng ca, hoặc mượn 2 người từ sản xuất.)",null,null,"Kǎoshēng: wǒhuì xiān quèrèn jí dān de shùliàng hé shíjiān, ránhòu kànkan nǎxiē bù jí de dìngdān kěyǐ wǎnghòu tuī. Rúguǒ háishì láibùjí, wǒhuì gēn jīnglǐ shēnqǐng jiābān, huòzhě cóng shēngchǎn bù jiè liǎnggè rén.",null,"BODY545"],["考官: 如果你的同事犯了错，却说是你的问题，你会怎么做？ (Nếu đồng nghiệp mắc lỗi mà nói là lỗi của bạn, bạn làm gì?)",null,null,"Kǎoguān: rúguǒ nǐ de tóngshì fànlecuò, quèshuō shì nǐ de wèntí, nǐ huì zěnme zuò?",null,"BODY546"],["考生: 我会先控制情绪，不当场吵架。然后拿出记录，用事实说明情况。不管是谁的责任，最重要的是先把问题解决，然后一起想办法避免下次再发生。 (Kiểm soát cảm xúc, không cãi tại chỗ. Rồi đưa ra ghi chép, dùng sự thật giải thích. Dù lỗi ai, quan trọng nhất là giải quyết vấn đề trước, rồi cùng nghĩ cách tránh tái diễn.)",null,null,"Kǎoshēng: wǒhuì xiān kòngzhìqíngxù, bù dāngchǎng chǎojià. Ránhòu náchū jìlù, yòng shìshí shuōmíng qíngkuàng. Bùguǎnshìshéi de zérèn, zuì zhòngyào de shì xiān bǎ wèntí jiějué, ránhòu yīqǐ xiǎng bànfǎ bìmiǎn xiàcì zài fāshēng.",null,"BODY547"],["考官: 请你用一分钟向经理汇报一下这个月的工作。 (Hãy báo cáo công việc tháng này với giám đốc trong một phút.)",null,null,"Kǎoguān: qǐng nǐ yòng yīfēnzhōng xiàng jīnglǐ huìbào yīxià zhège yuè de gōngzuò.",null,"BODY548"],["考生: 好的。我先汇报一下本月的工作：本月一共发货三百二十单，准时率百分之九十八，比上个月提高了两个百分点。目前遇到的主要问题是仓库空间不够，原因是年底备货太多。下一步，我计划把一部分不常用的物料搬到二号仓库，月底之前完成。我的汇报就到这里，谢谢。 (Vâng. Tôi xin báo cáo công việc tháng này: tổng giao 320 đơn, tỷ lệ đúng hạn 98%, tăng 2 điểm so với tháng trước. Vấn đề chính hiện nay là kho thiếu chỗ, do cuối năm dự trữ quá nhiều. Bước tiếp, tôi dự định chuyển một phần vật tư ít dùng sang kho số 2, xong trước cuối tháng. Báo cáo của tôi đến đây, cảm ơn.)",null,null,"Kǎoshēng: hǎo de. Wǒ xiān huìbào yīxià běnyuè de gōngzuò: běnyuè yīgòng fāhuò sānbǎi èrshí dān, zhǔnshí lǜ bǎifēnzhījiǔshíbā, bǐ shànggèyuè tígāo le liǎnggè bǎifēndiǎn. Mùqián yùdào de zhǔyào wèntí shì cāngkù kōngjiānbùgòu, yuányīn shì niándǐ bèihuò tài duō. Xià yībù, wǒ jìhuà bǎ yībùfen bù chángyòng de wùliào bān dào èrhào cāngkù, yuèdǐ zhīqián wánchéng. Wǒ de huìbào jiù dào zhèlǐ, xièxie.",null,"BODY549"],["Ngân hàng câu hỏi Phần 3: 你为什么选择这份工作？/ 你的工作需要跟哪些部门配合？/ 你会怎么拒绝老板不合理的要求？/ 你理想的工作是什么样的？/ 五年以后你希望自己在做什么？",null,null,"Nǐ wèishénme xuǎnzé zhèfèn gōngzuò? / | Nǐ de gōngzuò xūyào gēn nǎxiē bùmén pèihé? / | Nǐ huì zěnme jùjué lǎobǎn bùhélǐ de yāoqiú? / | Nǐ lǐxiǎng de gōngzuò shì shénmeyàng de? / | Wǔnián yǐhòu nǐ xīwàng zìjǐ zài zuò shénme?",null,"BODY550"],["PHẦN 4 — 讲故事 Kể chuyện (HSK4: 5 phút, gồm 3 phút kể + 2 phút trả lời câu hỏi)",null,null,"Jiǎnggùshì",null,"BODY551-C"],["Đề bốc thăm: ① 一次难忘的旅行 ② 工作中遇到的一次大麻烦 ③ 一个改变了你的人 ④ 一次让你很尴尬的经历 ⑤ 一个你后悔的决定.",null,null,"Yīcì nánwàng de lǚxíng | Gōngzuò zhōng yùdào de yīcì dà máfan | Yīgè gǎibiàn le nǐ de rén | Yīcì ràng nǐ hěn gāngà de jīnglì | Yīgè nǐ hòuhuǐ de juédìng .",null,"BODY552"],["Bài mẫu đề ②: 有一次，我们给一个中国客户发货，结果仓库把两个订单的货装反了。客户收到货以后非常生气，打电话来说要取消合作。当时我是负责这个客户的业务员，压力特别大。我先跟客户道歉，然后马上去仓库核对，确认是我们的错。接着我们安排了加急物流，第二天就把正确的货送到了，运费由我们承担。没想到，客户不但没有取消合作，还说我们处理得很快，第二个月又追加了订单。经过这件事，我明白了出了问题不要怕，最重要的是马上面对、马上解决。从那以后，我们公司规定每次装柜之前都要拍照确认。",null,null,"Yǒu yīcì, wǒmen gěi yīgè Zhōngguó kèhù fāhuò, jiéguǒ cāngkù bǎ liǎnggè dìngdān de huò zhuāng fǎn le. Kèhù shōudào huò yǐhòu fēicháng shēngqì, dǎdiànhuà láishuō yào qǔxiāo hézuò. Dāngshí wǒ shì fùzé zhège kèhù de yèwùyuán, yālì tèbié dà. Wǒ xiān gēn kèhù dàoqiàn, ránhòu mǎshàng qù cāngkù héduì, quèrèn shì wǒmen de cuò. Jiēzhe wǒmen ānpái le jiājí wùliú, dì'èrtiān jiù bǎ zhèngquè de huò sòngdào le, yùnfèi yóu wǒmen chéngdān. Méixiǎngdào, kèhù bùdàn méiyǒu qǔxiāo hézuò, hái shuō wǒmen chǔlǐ de hěnkuài, dì'èrgè yuè yòu zhuījiā le dìngdān. Jīngguò zhèjiàn shì, wǒ míngbai le chū le wèntí bùyào pà, zuì zhòngyào de shì mǎshàng miànduì, mǎshàng jiějué. Cóngnàyǐhòu, wǒmen gōngsī guīdìng měicì zhuāng guì zhīqián dōu yào pāizhào quèrèn.",null,"BODY553"],["Câu hỏi phụ GV: 当时你是什么感觉？/ 如果是现在的你，你会怎么做？/ 这件事对你有什么影响？",null,null,"Dāngshí nǐ shì shénme gǎnjué? / | Rúguǒ shì xiànzài de nǐ, nǐ huì zěnme zuò? / | Zhèjiàn shì duì nǐ yǒu shénme yǐngxiǎng?",null,"BODY554"],["HSK5 — 4 phần thi nâng cao (mẫu tham khảo)",null,null,null,null,"BODY555-C"],["Phần 1 — 主题陈述 Trình bày chủ đề 3 phút. Đề mẫu: \"越南制造业的机会和挑战\" (Cơ hội và thách thức của ngành sản xuất VN).",null,null,"Zhǔtí chénshù | \"Yuènán zhìzàoyè de jīhuì hé tiǎozhàn\"",null,"BODY556"],["Bài mẫu Phần 1: 我今天想谈一谈越南制造业的机会和挑战。先说机会：第一，越来越多的外资企业把工厂搬到越南，据报道，中国对越南的投资每年都在增长；第二，越南签了很多自由贸易协定，出口有关税优势。再说挑战：一方面，北部工业区已经很难招到工人，工资每年上涨；另一方面，很多企业还停留在简单加工，技术含量不高。在我看来，越南企业要抓住机会，就不能只靠便宜的人工，而要从提高技术和管理入手。举个例子，我们公司去年引进了自动包装线，减少了四十个岗位，但是效率提高了百分之三十。总的来说，机会大于挑战，关键在于我们能不能及时转型。",null,null,"Wǒ jīntiān xiǎng tányītán Yuènán zhìzàoyè de jīhuì hé tiǎozhàn. Xiān shuō jīhuì: dìyī, yuèláiyuè duō de wàizīqǐyè bǎ gōngchǎng bān dào Yuènán, jù bàodào, Zhōngguó duì Yuènán de tóuzī měinián dōu zài zēngzhǎng; dì'èr, Yuènán qiān le hěnduō zìyóu màoyìxiédìng, chūkǒu yǒu guānshuì yōushì. Zàishuō tiǎozhàn: yīfāngmiàn, běibù gōngyèqū yǐjīng hěn nán zhāo dào gōngrén, gōngzī měinián shàngzhǎng; lìngyīfāngmiàn, hěnduō qǐyè hái tíngliú zài jiǎndān jiāgōng, jìshùhánliàng bù gāo. Zàiwǒkànlái, Yuènán qǐyè yào zhuāzhùjīhuì, jiù bùnéng zhǐ kào piányi de réngōng, ér yào cóng tígāo jìshù hé guǎnlǐ rùshǒu. Jǔ gè lìzi, wǒmen gōngsī qùnián yǐnjìn le zìdòng bāozhuāng xiàn, jiǎnshǎo le sìshígè gǎngwèi, dànshì xiàolǜ tígāo le bǎifēnzhīsānshí. Zǒngdeláishuō, jīhuì dàyú tiǎozhàn, guānjiànzàiyú wǒmen néng bùnéng jíshí zhuǎnxíng.",null,"BODY557"],["Phần 2 — 讨论 Thảo luận 7 phút: GV đưa ý kiến ngược, HS phải đồng ý một phần và phản bác một phần (dùng 我同意你的一部分看法，但是…… / 你说的情况确实存在，不过……).",null,null,"Tǎolùn | Wǒ tóngyì nǐ de yībùfen kànfǎ, dànshì…… | Nǐ shuō de qíngkuàng quèshí cúnzài, bùguò……",null,"BODY558"],["Phần 3 — 谈判 Đàm phán 10 phút: bốc thăm vai (bên mua / bên bán), đàm phán đủ giá – số lượng – thanh toán – thời gian giao, kết thúc bằng 我们确认一下今天谈好的条件.",null,null,"Tánpàn | Wǒmen quèrèn yīxià jīntiān tán hǎo de tiáojiàn .",null,"BODY559"],["Phần 4 — 反驳 Phản biện 5 phút: GV liên tục hỏi vặn \"你有什么证据？/ 万一……怎么办？/ 这不是个别例子吗？\", HS giữ quan điểm, bổ sung bằng chứng và đưa phương án dự phòng.",null,null,"Fǎnbó | Nǐ yǒu shénme zhèngjù? / | Wànyī…… zěnmebàn? / | Zhè bùshì gèbié lìzi ma?",null,"BODY560"],["情景模拟 ROLE-PLAY — Thi thử HSK5 Phần 3 + Phần 4 (GV = bên bán, HS = bên mua)",null,null,"Qíngjǐng mónǐ",null,"BODY561-C"],["考官(供应商): 我们的报价是每台八十五美元，三十天交货，百分之五十预付。 (Báo giá của chúng tôi 85 USD/chiếc, giao 30 ngày, trả trước 50%.)",null,null,"Kǎoguān | Gōngyìngshāng | Wǒmen de bàojià shì měi tái bāshíwǔ měiyuán, sānshítiān jiāohuò, bǎifēnzhīwǔshí yùfù.",null,"BODY562"],["考生(采购): 谢谢您的报价。我们对比了三家供应商，贵方的质量最好，不过价格比我们的预算高了百分之十。我们的预算是七十七美元。 (Cảm ơn báo giá. Chúng tôi so sánh 3 NCC, chất lượng quý bên tốt nhất, nhưng giá cao hơn ngân sách 10%. Ngân sách chúng tôi là 77 USD.)",null,null,"Kǎoshēng | Cǎigòu | Xièxienín de bàojià. Wǒmen duìbǐ le sānjiā gōngyìngshāng, guìfāng de zhìliàng zuìhǎo, bùguò jiàgébǐ wǒmen de yùsuàn gāo le bǎifēnzhīshí. Wǒmen de yùsuàn shì qīshíqī měiyuán.",null,"BODY563"],["考官: 七十七太低了，我们最多降到八十二。 (77 thấp quá, chúng tôi tối đa giảm xuống 82.)",null,null,"Kǎoguān: qīshíqī tài dī le, wǒmen zuì duō jiàngdào bāshí'èr.",null,"BODY564"],["考生: 如果我们把数量从一千台增加到两千台，单价能不能降到七十九？ (Nếu tăng số lượng từ 1.000 lên 2.000 chiếc, đơn giá giảm xuống 79 được không?)",null,null,"Kǎoshēng: rúguǒ wǒmen bǎ shùliàng cóng yīqiān tái zēngjiā dào liǎngqiān tái, dānjià néng bùnéng jiàngdào qīshíjiǔ?",null,"BODY565"],["考官: 两千台的话，八十美元。不过预付还是百分之五十。 (2.000 chiếc thì 80 USD. Nhưng trả trước vẫn 50%.)",null,null,"Kǎoguān: liǎngqiān tái dehuà, bāshí měiyuán. Bùguò yùfù háishì bǎifēnzhīwǔshí.",null,"BODY566"],["考生: 百分之五十对我们的资金压力太大。我们可以在交货期上让步，从三十天放宽到四十五天，不过作为交换，希望预付降到百分之三十。 (50% áp lực vốn quá lớn. Chúng tôi nhượng bộ thời gian giao, nới từ 30 lên 45 ngày, nhưng đổi lại mong trả trước giảm còn 30%.)",null,null,"Kǎoshēng: bǎifēnzhīwǔshí duì wǒmen de zījīn yālì tài dà. Wǒmen kěyǐ zài jiāohuòqī shàng ràngbù, cóng sānshítiān fàngkuān dào sìshíwǔtiān, bùguò zuòwéi jiāohuàn, xīwàng yùfù jiàngdào bǎifēnzhīsānshí.",null,"BODY567"],["考官(反驳): 你怎么保证两千台都能卖出去？万一你们卖不完，以后不再下单怎么办？ (Làm sao bạn đảm bảo bán hết 2.000 chiếc? Lỡ bán không hết, sau này không đặt nữa thì sao?)",null,null,"Kǎoguān | Fǎnbó | Nǐ zěnme bǎozhèng liǎngqiān tái dōu néng màichūqù? Wànyī nǐmen mài bù wán, yǐhòu bùzài xiàdān zěnmebàn?",null,"BODY568"],["考生: 我理解您的担心。我们去年同类产品卖了两千五百台，这是我们的销售数据，我可以发给您。而且我们愿意签一年的框架协议，保证全年不少于四千台。 (Tôi hiểu lo lắng của ngài. Năm ngoái sản phẩm cùng loại chúng tôi bán 2.500 chiếc, đây là số liệu bán hàng, tôi có thể gửi ngài. Hơn nữa chúng tôi sẵn sàng ký thỏa thuận khung một năm, đảm bảo cả năm không dưới 4.000 chiếc.)",null,null,"Kǎoshēng: wǒ lǐjiě nín de dānxīn. Wǒmen qùnián tónglèichǎnpǐn mài le liǎngqiānwǔbǎi tái, zhè shì wǒmen de xiāoshòu shùjù, wǒ kěyǐ fāgěinín. Érqiě wǒmen yuànyì qiān yīnián de kuāngjià xiéyì, bǎozhèng quánnián bùshǎo yú sìqiān tái.",null,"BODY569"],["考官(反驳): 去年卖得好，不代表今年也卖得好。 (Năm ngoái bán tốt không có nghĩa năm nay cũng tốt.)",null,null,"Kǎoguān | Fǎnbó | Qùnián mài de hǎo, bù dàibiǎo jīnnián yě mài de hǎo.",null,"BODY570"],["考生: 您说得有道理。所以万一市场不好，我们的备用方案是：第一批先做一千台，卖完再下第二批一千台，单价都按两千台的价格算。这样贵方的风险也小。 (Ngài nói có lý. Nên lỡ thị trường không tốt, phương án dự phòng: đợt đầu làm 1.000 chiếc, bán hết đặt đợt hai 1.000 chiếc, đơn giá đều tính theo giá 2.000 chiếc. Như vậy rủi ro của quý bên cũng nhỏ.)",null,null,"Kǎoshēng: nín shuō de yǒu dàolǐ. Suǒyǐ wànyī shìchǎng bùhǎo, wǒmen de bèiyòng fāng'àn shì: dìyīpī xiān zuò yīqiān tái, màiwán zài xià dì'èrpī yīqiān tái, dānjià dōu àn liǎngqiān tái de jiàgé suàn. Zhèyàng guìfāng de fēngxiǎn yě xiǎo.",null,"BODY571"],["考官: 好，这个方案可以接受。 (Được, phương án này chấp nhận được.)",null,null,"Kǎoguān: hǎo, zhège fāng'àn kěyǐ jiēshòu.",null,"BODY572"],["考生: 那我们确认一下今天谈好的条件：总量两千台，分两批，每批一千台，单价八十美元，预付百分之三十，四十五天交货，签一年框架协议。 (Vậy xác nhận điều kiện hôm nay: tổng 2.000 chiếc, chia 2 đợt, mỗi đợt 1.000 chiếc, đơn giá 80 USD, trả trước 30%, giao 45 ngày, ký thỏa thuận khung một năm.)",null,null,"Kǎoshēng: nà wǒmen quèrèn yīxià jīntiān tán hǎo de tiáojiàn: zǒngliàng liǎngqiān tái, fēn liǎngpī, měipī yīqiān tái, dānjià bāshí měiyuán, yùfù bǎifēnzhīsānshí, sìshíwǔtiān jiāohuò, qiān yīnián kuāngjià xiéyì.",null,"BODY573"],["纠错与升级 FEEDBACK — Nghe lại và so sánh với bản ghi âm Buổi 01",null,null,"Jiūcuò yǔ shēngjí",null,"BODY574-C"],["Bước 1: HS nghe lại đoạn giới thiệu Buổi 01 và đoạn giới thiệu hôm nay, tự ghi ra 3 điểm tiến bộ rõ nhất.",null,null,null,null,"BODY575"],["Bước 2: GV đưa 3–5 lỗi còn lặp lại nhiều nhất của từng HS (phát âm – ngữ pháp – từ vựng – sắc thái) kèm câu sửa.",null,null,null,null,"BODY576"],["Lỗi còn hay gặp cuối khóa: ✗ 我工作在…… → ✓ 我在……工作 · ✗ 我很压力 → ✓ 我压力很大 · ✗ 这个比那个很便宜 → ✓ 这个比那个便宜多了 · ✗ 我学中文两年 → ✓ 我学了两年中文 · ✗ 我看了一个新闻 → ✓ 我看了一条新闻.",null,null,"Wǒ gōngzuò zài…… | Wǒ zài…… gōngzuò | Wǒ hěn yālì | Wǒ yālì hěndà | Zhège bǐ nàge hěn piányi | Zhège bǐ nàge piányi duō le | Wǒ xué Zhōngwén liǎngnián | Wǒ xué le liǎngnián Zhōngwén | Wǒ kàn le yīgè xīnwén | Wǒ kàn le yītiáo xīnwén .",null,"BODY577"],["Câu HS dùng để tự đánh giá: 我觉得我进步最大的是……；我还需要提高的是……；接下来我打算……",null,null,"Wǒ juéde wǒ jìnbù zuìdà de shì……; wǒ hái xūyào tígāo de shì……; jiēxiàlái wǒ dǎsuàn……",null,"BODY578"],["Mẫu tự đánh giá: 我觉得我进步最大的是流利度，以前说一句话要停好几次，现在可以连续说两三分钟。我还需要提高的是声调，特别是第二声和第三声还经常分不清。接下来我打算每天跟读十分钟中文新闻，三个月以后再录一次音，跟今天比较。 (Tôi thấy tiến bộ lớn nhất là độ lưu loát, trước nói một câu phải dừng mấy lần, giờ nói liền 2–3 phút được. Điều cần nâng cao là thanh điệu, nhất là thanh 2 và thanh 3 vẫn hay lẫn. Tiếp theo tôi định mỗi ngày đọc theo tin tức tiếng Trung 10 phút, 3 tháng sau ghi âm lại so sánh với hôm nay.)",null,null,"Wǒ juéde wǒ jìnbù zuìdà de shì liúlìdù, yǐqián shuō yījù huà yào tíng hǎo jǐcì, xiànzài kěyǐ liánxù shuō liǎngsānfēnzhōng. Wǒ hái xūyào tígāo de shì shēngdiào, tèbié shì dì'èrshēng hé dìsānshēng hái jīngcháng fēnbùqīng. Jiēxiàlái wǒ dǎsuàn měitiān gēndú shífēnzhōng Zhōngwén xīnwén, sāngè yuè yǐhòu zài lù yīcì yīn, gēn jīntiān bǐjiào.",null,"BODY579"],["课后作业 HOMEWORK — Lập mục tiêu học tập tiếp theo",null,null,"Kèhòu zuòyè",null,"BODY580-C"],["Viết và ghi âm kế hoạch học 3 tháng tới (1–2 phút) theo khung: 目标 Mục tiêu (cụ thể, đo được) → 方法 Phương pháp → 时间 Thời gian mỗi tuần → 检查方式 Cách tự kiểm tra.",null,null,"Mùbiāo | Fāngfǎ | Shíjiān | Jiǎnchá fāngshì",null,"BODY581"],["Mẫu: 我接下来三个月的目标是：第一，考过HSK5；第二，能用中文独立主持一个三十分钟的会议。我的方法是每天背二十个生词，每周跟中国同事练习两次口语，每个周末做一套HSK5的模拟题。每个月底我会录一次音，看看自己有没有进步。我相信，只要坚持下去，三个月以后我一定能达到目标！ (Mục tiêu 3 tháng tới: một, đỗ HSK5; hai, tự chủ trì một cuộc họp 30 phút bằng tiếng Trung. Phương pháp: mỗi ngày học 20 từ mới, mỗi tuần luyện nói với đồng nghiệp TQ 2 lần, mỗi cuối tuần làm một đề thi thử HSK5. Cuối mỗi tháng ghi âm một lần xem có tiến bộ không. Tôi tin chỉ cần kiên trì, 3 tháng sau nhất định đạt mục tiêu!)",null,null,"Wǒ jiēxiàlái sāngè yuè de mùbiāo shì: dìyī, kǎo guò HSK5; dì'èr, néng yòng Zhōngwén dúlì zhǔchí yīgè sānshífēnzhōng de huìyì. Wǒ de fāngfǎ shì měitiān bèi èrshígè shēngcí, měizhōu gēn Zhōngguó tóngshì liànxí liǎngcì kǒuyǔ, měigè zhōumò zuòyītào HSK5 de mónǐtí. Měigè yuèdǐ wǒhuì lù yīcì yīn, kànkan zìjǐ yǒuméiyǒu jìnbù. Wǒ xiāngxìn, zhǐyào jiānchíxiàqù, sāngè yuè yǐhòu wǒ yīdìng néng dádàomùbiāo!",null,"BODY582"],["GV gửi bảng điểm 5 tiêu chí + nhận xét cá nhân + gợi ý khóa học tiếp theo cho từng HS.",null,null,null,null,"BODY583"]] };
