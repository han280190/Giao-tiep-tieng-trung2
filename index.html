",null,"BODY806"],["情景对话 3 — Khách hàng hỏi dồn trong buổi gặp, không có thời gian chuẩn bị",null,null,"Qíngjǐng duìhuà",null,"BODY807-C"],["客户: 小李，你们的产品跟市场上其他的有什么不一样？ (Tiểu Lý, sản phẩm của các bạn khác gì sản phẩm khác trên thị trường?)",null,null,"Kèhù: Xiǎo Lǐ, nǐmen de chǎnpǐn gēn shìchǎng shàng qítā de yǒu shénme bù yīyàng?",null,"BODY808"],["销售: 具体来说，有两个不一样：第一是材料，我们用的是进口的；第二是保修，别人一年，我们两年。 (Cụ thể có 2 điểm khác: một là vật liệu, chúng tôi dùng hàng nhập; hai là bảo hành, người ta 1 năm, chúng tôi 2 năm.)",null,null,"Xiāoshòu: jùtǐláishuō, yǒu liǎnggè bù yīyàng: dìyī shì cáiliào, wǒmen yòng de shì jìnkǒu de; dì'èr shì bǎoxiū, biérén yīnián, wǒmen liǎngnián.",null,"BODY809"],["客户: 你们公司在越南有多少客户？ (Công ty các bạn ở VN có bao nhiêu khách?)",null,null,"Kèhù: nǐmen gōngsī zài Yuènán yǒu duōshǎo kèhù?",null,"BODY810"],["销售: 大概三百多家，其中有五十家是中资企业。 (Khoảng hơn 300, trong đó 50 là doanh nghiệp vốn TQ.)",null,null,"Xiāoshòu: dàgài sānbǎiduō jiā, qízhōng yǒu wǔshí jiā shì zhōngzīqǐyè.",null,"BODY811"],["客户: 如果我们明天就要货，你们能做到吗？ (Nếu mai chúng tôi cần hàng, các bạn làm được không?)",null,null,"Kèhù: rúguǒ wǒmen míngtiān jiùyào huò, nǐmen néng zuòdào ma?",null,"BODY812"],["销售: 这得看数量。如果是五百件以内，仓库有现货，明天就能送；如果更多的话，需要三到五天。 (Còn tùy số lượng. Dưới 500 cái kho có sẵn, mai giao được; nhiều hơn thì cần 3–5 ngày.)",null,null,"Xiāoshòu: zhè děi kàn shùliàng. Rúguǒ shì wǔbǎijiàn yǐnèi, cāngkù yǒu xiànhuò, míngtiān jiù néng sòng; rúguǒ gèng duō dehuà, xūyào sān dào wǔtiān.",null,"BODY813"],["客户: 价格能便宜多少？ (Giá rẻ được bao nhiêu?)",null,null,"Kèhù: jiàgé néng piányi duōshǎo?",null,"BODY814"],["销售: 让我先了解一下：您大概需要多少数量？是一次性采购还是长期合作？ (Để tôi tìm hiểu trước: anh cần khoảng bao nhiêu? Mua một lần hay hợp tác lâu dài?)",null,null,"Xiāoshòu: ràng wǒ xiān liǎojiě yīxià: nín dàgài xūyào duōshǎo shùliàng? Shì yīcìxìng cǎigòu háishì chángqī hézuò?",null,"BODY815"],["客户: 长期的，一年大概两万件。 (Lâu dài, một năm khoảng 20.000 cái.)",null,null,"Kèhù: chángqī de, yīnián dàgài liǎngwànjiàn.",null,"BODY816"],["销售: 两万件的话，我们可以给您九折。具体的数字我回去跟经理确认，今天下午发报价给您。 (20.000 cái thì giảm 10% cho anh. Con số cụ thể tôi về xác nhận với giám đốc, chiều nay gửi báo giá.)",null,null,"Xiāoshòu: liǎngwànjiàn dehuà, wǒmen kěyǐ gěi nín jiǔzhé. Jùtǐ de shùzì wǒ huíqù gēn jīnglǐ quèrèn, jīntiānxiàwǔ fā bàojià gěi nín.",null,"BODY817"],["客户: 你们的竞争对手报价比你们低百分之十五，你怎么看？ (Đối thủ của các bạn báo giá thấp hơn 15%, bạn nghĩ sao?)",null,null,"Kèhù: nǐmen de jìngzhēngduìshǒu bàojià bǐ nǐmen dī bǎifēnzhīshíwǔ, nǐ zěnme kàn?",null,"BODY818"],["销售: 我理解您的疑问。说实话，我们不是最便宜的，但是打个比方，买便宜的就像买便宜的雨伞，一年换三把，最后花的钱更多。我们的产品用五年都没问题。 (Tôi hiểu thắc mắc của anh. Nói thật chúng tôi không rẻ nhất, nhưng ví như mua ô rẻ, một năm thay 3 cái, cuối cùng tốn nhiều tiền hơn. Sản phẩm chúng tôi dùng 5 năm vẫn ổn.)",null,null,"Xiāoshòu: wǒ lǐjiě nín de yíwèn. Shuōshíhuà, wǒmen bùshì zuì piányi de, dànshì dǎgèbǐfāng, mǎi piányi de jiù xiàng mǎi piányi de yǔsǎn, yīnián huàn sān bǎ, zuìhòu huā de qián gèng duō. Wǒmen de chǎnpǐn yòng wǔnián dōu méi wèntí.",null,"BODY819"],["客户: 哈哈，你挺会说话的。 (Haha, bạn khéo nói đấy.)",null,null,"Kèhù: hāhā, nǐ tǐng huì shuōhuà de.",null,"BODY820"],["销售: 谢谢！欢迎您来我们工厂看看，眼见为实。 (Cảm ơn anh! Mời anh đến nhà máy tham quan, tai nghe không bằng mắt thấy.)",null,null,"Xiāoshòu: xièxie! Huānyíngnín lái wǒmen gōngchǎng kànkan, yǎnjiànwéishí.",null,"BODY821"],["情景对话 4 — (HSK5) Bị hỏi vặn trong cuộc họp, phải phản biện ngay",null,null,"Qíngjǐng duìhuà",null,"BODY822-C"],["总监: 小林，你说明年销售额要增长百分之三十，凭什么？今年才增长了百分之十。 (Tiểu Lâm, bạn nói năm sau doanh số tăng 30%, dựa vào đâu? Năm nay mới tăng 10%.)",null,null,"Zǒngjiān: Xiǎo Lín, nǐ shuōmíng niánxiāoshòu'é yào zēngzhǎng bǎifēnzhīsānshí, píng shénme? Jīnnián cái zēngzhǎng le bǎifēnzhīshí.",null,"BODY823"],["小林: 您这个问题问得很好。我想从两个方面来回答：第一，明年我们有三个新产品上市，根据试销的数据，每个产品一年能贡献大约五十亿；第二，北宁有两家新工厂已经跟我们签了意向书。 (Câu hỏi rất hay. Tôi trả lời từ 2 mặt: một, năm sau có 3 sản phẩm mới ra mắt, theo số liệu bán thử mỗi sản phẩm đóng góp khoảng 5 tỷ/năm; hai, hai nhà máy mới ở Bắc Ninh đã ký thư ý định với chúng ta.)",null,null,"Xiǎo Lín: nín zhège wèntí wèn de hěn hǎo. Wǒ xiǎng cóng liǎnggè fāngmiàn lái huídá: dìyī, míngnián wǒmen yǒu sāngè xīn chǎnpǐn shàngshì, gēnjù shìxiāo de shùjù, měigè chǎnpǐn yīnián néng gòngxiàn dàyuē wǔshí yì; dì'èr, Běiníng yǒu liǎngjiā xīn gōngchǎng yǐjīng gēn wǒmen qiān le yìxiàngshū.",null,"BODY824"],["总监: 意向书不等于合同。 (Thư ý định không bằng hợp đồng.)",null,null,"Zǒngjiān: yìxiàngshū bù děngyú hétong.",null,"BODY825"],["小林: 我理解您的疑问，不过我想补充一点：这两家工厂的设备都是从我们的老客户那里推荐来的，老客户已经用了三年我们的产品。按照以往的经验，意向书转成合同的比例在百分之七十以上。 (Tôi hiểu thắc mắc của ngài, nhưng xin bổ sung: thiết bị hai nhà máy này đều do khách cũ của chúng ta giới thiệu, khách cũ đã dùng sản phẩm chúng ta 3 năm. Theo kinh nghiệm, tỷ lệ thư ý định chuyển thành hợp đồng trên 70%.)",null,null,"Xiǎo Lín: wǒ lǐjiě nín de yíwèn, bùguò wǒ xiǎng bǔchōng yīdiǎn: zhè liǎngjiā gōngchǎng de shèbèi dōu shìcóng wǒmen de lǎokèhù nàlǐ tuījiàn lái de, lǎokèhù yǐjīng yòng le sānnián wǒmen de chǎnpǐn. Ànzhào yǐwǎng de jīngyàn, yìxiàngshū zhuǎn chéng hétong de bǐlì zài bǎifēnzhīqīshí yǐshàng.",null,"BODY826"],["总监: 那如果新产品卖得不好呢？ (Vậy nếu sản phẩm mới bán không chạy?)",null,null,"Zǒngjiān: nà rúguǒ xīn chǎnpǐn mài de bùhǎo ne?",null,"BODY827"],["小林: 万一新产品达不到预期，我们还有一个备用计划：加大对老客户的推广，老客户的复购率现在是百分之六十，如果提高到百分之七十，也能增长百分之十五左右。 (Lỡ sản phẩm mới không đạt kỳ vọng, chúng ta còn kế hoạch dự phòng: tăng quảng bá cho khách cũ, tỷ lệ mua lại hiện 60%, nâng lên 70% cũng tăng được khoảng 15%.)",null,null,"Xiǎo Lín: wànyī xīn chǎnpǐn dá bùdào yùqī, wǒmen háiyǒu yīgè bèiyòng jìhuà: jiādà duì lǎokèhù de tuīguǎng, lǎokèhù de fùgòulǜ xiànzài shì bǎifēnzhīliùshí, rúguǒ tígāo dào bǎifēnzhīqīshí, yě néng zēngzhǎng bǎifēnzhīshíwǔ zuǒyòu.",null,"BODY828"],["总监: 所以最差的情况是百分之十五？ (Vậy trường hợp xấu nhất là 15%?)",null,null,"Zǒngjiān: suǒyǐ zuìchà de qíngkuàng shì bǎifēnzhīshíwǔ?",null,"BODY829"],["小林: 对。百分之三十是我们努力的目标，百分之十五是底线。 (Đúng. 30% là mục tiêu phấn đấu, 15% là mức sàn.)",null,null,"Xiǎo Lín: duì. Bǎifēnzhīsānshí shì wǒmen nǔlì de mùbiāo, bǎifēnzhīshíwǔ shì dǐxiàn.",null,"BODY830"],["总监: 好，这样说比较实际。你把这两种情况都写进计划里。 (Được, nói vậy thực tế hơn. Bạn ghi cả hai trường hợp vào kế hoạch.)",null,null,"Zǒngjiān: hǎo, zhèyàng shuō bǐjiào shíjì. Nǐ bǎ zhè liǎngzhǒng qíngkuàng dōu xiě jìn jìhuà lǐ.",null,"BODY831"],["THẺ CHỦ ĐỀ BỐC THĂM (HSK5) — Chuẩn bị tối đa 10 giây, nói 1–2 phút",null,null,null,null,"BODY832-C"],["1. 你同意\"顾客永远是对的\"吗？ (Bạn đồng ý \"khách hàng luôn đúng\" không?)",null,null,"Nǐ tóngyì \"gùkè yǒngyuǎn shì duì de\" ma?",null,"BODY833"],["2. 如果你是你们公司的老板，你第一件事会改什么？ (Nếu bạn là sếp công ty mình, việc đầu tiên bạn sẽ thay đổi gì?)",null,null,"Rúguǒ nǐ shì nǐmen gōngsī de lǎobǎn, nǐ dìyījiàn shì huì gǎi shénme?",null,"BODY834"],["3. 越南年轻人和中国年轻人有什么不同？ (Giới trẻ VN và giới trẻ TQ khác nhau thế nào?)",null,null,"Yuènán niánqīngrén hé Zhōngguó niánqīngrén yǒu shénme bùtóng?",null,"BODY835"],["4. 你觉得十年以后还需要学外语吗？ (Bạn thấy 10 năm nữa còn cần học ngoại ngữ không?)",null,null,"Nǐ juéde shínián yǐhòu hái xūyào xué wàiyǔ ma?",null,"BODY836"],["5. 工作和家庭，哪个更重要？ (Công việc và gia đình, cái nào quan trọng hơn?)",null,null,"Gōngzuò hé jiātíng, nǎge gèng zhòngyào?",null,"BODY837"],["6. 如果明天开始每周只上四天班，你觉得好不好？ (Nếu từ mai mỗi tuần chỉ làm 4 ngày, bạn thấy tốt không?)",null,null,"Rúguǒ míngtiān kāishǐ měizhōu zhǐ shàng sìtiān bān, nǐ juéde hǎobùhǎo?",null,"BODY838"],["Câu trả lời mẫu cho thẻ 1: 我不完全同意。我觉得顾客的需求永远是重要的，但是顾客不一定永远是对的。打个比方，如果顾客要求我们用不合格的材料降低价格，我们就不能答应，因为最后受影响的是顾客自己。总之，我们要尊重顾客，但也要有自己的原则。 (Tôi không hoàn toàn đồng ý. Nhu cầu của khách luôn quan trọng, nhưng khách chưa chắc luôn đúng. Ví như khách yêu cầu dùng vật liệu không đạt chuẩn để giảm giá thì không thể nhận, vì cuối cùng người bị ảnh hưởng là chính khách. Tóm lại, phải tôn trọng khách nhưng cũng phải có nguyên tắc của mình.)",null,null,"Wǒ bù wánquántóngyì. Wǒ juéde gùkè de xūqiú yǒngyuǎn shì zhòngyào de, dànshì gùkè bù yīdìng yǒngyuǎn shì duì de. Dǎgèbǐfāng, rúguǒ gùkè yāoqiú wǒmen yòng bù hégé de cáiliào jiàngdī jiàgé, wǒmen jiù bùnéng dāying, yīnwèi zuìhòu shòu yǐngxiǎng de shì gùkè zìjǐ. Zǒngzhī, wǒmen yào zūnzhòng gùkè, dàn yě yào yǒu zìjǐ de yuánzé.",null,"BODY839"],["Câu trả lời mẫu cho thẻ 5: 这个问题很难回答。说实话，年轻的时候我觉得工作更重要，可是有了孩子以后，我的想法变了。对我来说，工作是为了让家人过得更好，如果为了工作失去了家庭，那就本末倒置了。所以现在我尽量不把工作带回家，周末一定陪孩子。 (Câu này khó trả lời. Nói thật, hồi trẻ tôi thấy công việc quan trọng hơn, nhưng có con rồi suy nghĩ thay đổi. Với tôi, làm việc là để gia đình sống tốt hơn, nếu vì công việc mà mất gia đình thì là đảo lộn gốc ngọn. Nên giờ tôi cố không mang việc về nhà, cuối tuần nhất định ở bên con.)",null,null,"Zhège wèntí hěn nán huídá. Shuōshíhuà, niánqīng de shíhou wǒ juéde gōngzuò gèng zhòngyào, kěshì yǒu le háizi yǐhòu, wǒ de xiǎngfǎ biàn le. Duì wǒ láishuō, gōngzuò shì wèile ràng jiārén guò de gènghǎo, rúguǒ wèile gōngzuò shīqù le jiātíng, nà jiù běnmòdàozhì le. Suǒyǐ xiànzài wǒ jǐnliàng bù bǎ gōngzuò dàihuíjiā, zhōumò yīdìng péi háizi.",null,"BODY840"],["引导练习 GUIDED SPEAKING — GV hỏi liên tục, HS không được im lặng quá 3 giây",null,null,"Yǐndǎo liànxí",null,"BODY841-C"],["1. Hỏi: 现在马上用中文说出五种水果。 (Ngay bây giờ nói 5 loại quả bằng tiếng Trung.)",null,null,"Xiànzài mǎshàng yòng Zhōngwén shuōchū wǔzhǒng shuǐguǒ.",null,"BODY842"],["Đáp: 芒果、香蕉、西瓜、榴莲、火龙果。 (Xoài, chuối, dưa hấu, sầu riêng, thanh long.)",null,null,"Mángguǒ, xiāngjiāo, xīguā, liúlián, huǒlóngguǒ.",null,"BODY843"],["2. Hỏi: 你今天穿的衣服是什么颜色？为什么选这件？ (Hôm nay bạn mặc màu gì? Sao chọn bộ này?)",null,null,"Nǐ jīntiān chuān de yīfu shì shénme yánsè? Wèishénme xuǎn zhèjiàn?",null,"BODY844"],["Đáp: 我今天穿的是蓝色的衬衫，因为下午要见客户，蓝色看起来比较专业。 (Hôm nay tôi mặc sơ mi xanh vì chiều gặp khách, màu xanh trông chuyên nghiệp hơn.)",null,null,"Wǒ jīntiān chuān de shì lánsè de chènshān, yīnwèi xiàwǔ yào jiàn kèhù, lánsè kànqǐlái bǐjiào zhuānyè.",null,"BODY845"],["3. Hỏi: 如果你可以有一种超能力，你想要什么？ (Nếu có một siêu năng lực, bạn muốn gì?)",null,null,"Rúguǒ nǐ kěyǐ yǒu yīzhǒng chāonénglì, nǐ xiǎngyào shénme?",null,"BODY846"],["Đáp: 我想要\"瞬间移动\"，这样就不用每天在路上堵一个小时了。 (Tôi muốn \"dịch chuyển tức thời\", như vậy không phải ngày nào cũng tắc đường một tiếng.)",null,null,"Wǒ xiǎngyào \"shùnjiān yídòng\", zhèyàng jiù bùyòng měitiān zài lùshàng dǔ yīgè xiǎoshí le.",null,"BODY847"],["4. Hỏi: (HSK5) 有人说\"AI会让翻译这个职业消失\"，你怎么看？给你十秒钟准备。 (Có người nói \"AI sẽ khiến nghề phiên dịch biến mất\", bạn nghĩ sao? Cho bạn 10 giây chuẩn bị.)",null,null,"Yǒurén shuō \"AI huì ràng fānyì zhège zhíyè xiāoshī\", nǐ zěnme kàn? Gěi nǐ shímiǎozhōng zhǔnbèi.",null,"BODY848"],["Đáp: 有的人觉得AI会代替翻译，但是我觉得简单的翻译确实会被代替，可是商务谈判、陪同客户这样的工作还是需要人，因为翻译不只是语言，还有文化和人际关系。总之，翻译不会消失，但是要求会更高。 (Có người thấy AI sẽ thay phiên dịch, nhưng tôi thấy dịch đơn giản đúng là bị thay, còn đàm phán thương mại, tháp tùng khách vẫn cần người, vì phiên dịch không chỉ là ngôn ngữ mà còn văn hóa và quan hệ. Tóm lại, nghề phiên dịch không biến mất nhưng yêu cầu sẽ cao hơn.)",null,null,"Yǒu de rén juéde AI huì dàitì fānyì, dànshì wǒ juéde jiǎndān de fānyì quèshí huì bèi dàitì, kěshì shāngwùtánpàn, péitóng kèhù zhèyàng de gōngzuò háishì xūyào rén, yīnwèi fānyì bù zhǐshì yǔyán, háiyǒu wénhuà hé rénjìguānxi. Zǒngzhī, fānyì bùhuì xiāoshī, dànshì yāoqiú huì gèng gāo.",null,"BODY849"],["情景模拟 ROLE-PLAY — Bốc thẻ chủ đề, chuẩn bị tối đa 10 giây. Vòng 2 (bất ngờ): GV ngắt giữa chừng hỏi vặn \"你确定吗？有什么证据？\"",null,null,"Qíngjǐng mónǐ | \"Nǐ quèdìng ma? Yǒu shénme zhèngjù?\"",null,"BODY850-C"],["GV: 请抽一张卡片。 (Mời bốc một thẻ.)",null,null,"Qǐng chōu yīzhāng kǎpiàn.",null,"BODY851"],["HS: 我抽到的是：\"如果明天开始每周只上四天班，你觉得好不好？\" (Em bốc được: \"Nếu từ mai mỗi tuần chỉ làm 4 ngày, bạn thấy tốt không?\")",null,null,"Wǒ chōu dào de shì: \"rúguǒ míngtiān kāishǐ měizhōu zhǐ shàng sìtiān bān, nǐ juéde hǎobùhǎo?\"",null,"BODY852"],["HS: 怎么说呢……我觉得是好事。一方面，员工有更多时间休息和陪家人，工作的时候效率会更高；另一方面，公司还能节省电费和办公成本。 (Nói sao nhỉ… tôi thấy là chuyện tốt. Một mặt nhân viên có nhiều thời gian nghỉ ngơi và ở bên gia đình, khi làm việc hiệu suất cao hơn; mặt khác công ty còn tiết kiệm tiền điện và chi phí văn phòng.)",null,null,"Zěnme shuō ne…… wǒ juéde shì hǎoshì. Yīfāngmiàn, yuángōng yǒu gèng duō shíjiān xiūxi hé péi jiārén, gōngzuò de shíhou xiàolǜ huì gèng gāo; lìngyīfāngmiàn, gōngsī hái néng jiéshěng diànfèi hé bàngōng chéngběn.",null,"BODY853"],["GV (biến cố): 你确定效率会更高吗？有什么证据？ (Bạn chắc hiệu suất cao hơn không? Có bằng chứng gì?)",null,null,"Nǐ quèdìng xiàolǜ huì gèng gāo ma? Yǒu shénme zhèngjù?",null,"BODY854"],["HS: 好问题。我看过一个报道，有些欧洲的公司试过，员工的效率不但没有下降，请病假的人还少了。当然，越南的情况可能不一样。 (Câu hỏi hay. Tôi từng đọc một bài báo, một số công ty châu Âu đã thử, hiệu suất nhân viên không giảm mà số người nghỉ ốm còn ít đi. Tất nhiên tình hình VN có thể khác.)",null,null,"Hǎo wèntí. Wǒ kànguò yīgè bàodào, yǒuxiē ōuzhōu de gōngsī shì guò, yuángōng de xiàolǜ bùdàn méiyǒu xiàjiàng, qǐng bìngjià de rén hái shǎo le. Dāngrán, Yuènán de qíngkuàng kěnéng bù yīyàng.",null,"BODY855"],["GV: 那工厂呢？工厂的生产线不能停啊。 (Còn nhà máy? Chuyền sản xuất không thể dừng.)",null,null,"Nà gōngchǎng ne? Gōngchǎng de shēngchǎnxiàn bùnéng tíng a.",null,"BODY856"],["HS: 您说得对，这得看行业。办公室可以试四天工作制，工厂可以用轮班的方式，每个人还是上四天，但是生产线不停。总之，我觉得可以先在一部分岗位试一试。 (Ngài nói đúng, còn tùy ngành. Văn phòng có thể thử làm 4 ngày, nhà máy dùng cách xoay ca, mỗi người vẫn làm 4 ngày nhưng chuyền không dừng. Tóm lại, tôi thấy có thể thử trước ở một số vị trí.)",null,null,"Nín shuōdeduì, zhè děi kàn hángyè. Bàngōngshì kěyǐ shì sìtiān gōngzuòzhì, gōngchǎng kěyǐ yòng lúnbān de fāngshì, měigè rén háishì shàng sìtiān, dànshì shēngchǎnxiàn bùtíng. Zǒngzhī, wǒ juéde kěyǐ xiān zài yībùfen gǎngwèi shìyīshì.",null,"BODY857"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc khi phản xạ nhanh (✗ → ✓)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY858-C"],["✗ 嗯……嗯……啊…… (im lặng, \"ờ\" kéo dài) → ✓ 让我想想……/ 怎么说呢……/ 好问题！",null,null,"Ń…… ń…… a…… | Ràng wǒ xiǎngxiang…… / | Zěnme shuō ne…… / | Hǎo wèntí!",null,"BODY859"],["✗ 我不知道。 (dừng luôn, mất điểm) → ✓ 我还没仔细想过，不过我觉得……",null,null,"Wǒ bù zhīdao. | Wǒ hái méi zǐxì xiǎng guò, bùguò wǒ juéde……",null,"BODY860"],["✗ 是，是，是。 (đáp cụt) → ✓ 是的，具体来说……",null,null,"Shì, shì, shì. | Shì de, jùtǐláishuō……",null,"BODY861"],["✗ 我觉得我觉得我觉得…… (lặp mở đầu) → ✓ 在我看来……/ 对我来说……/ 说实话……",null,null,"Wǒ juéde wǒ juéde wǒ juéde…… | Zàiwǒkànlái…… / | Duì wǒ láishuō…… / | Shuōshíhuà……",null,"BODY862"],["✗ 我听不懂你。 → ✓ 不好意思，您能再说一遍吗？/ 您的意思是……吗？",null,null,"Wǒ tīngbùdǒng nǐ. | Bùhǎoyìsi, nín néng zàishuō yībiàn ma? / | Nín de yìsi shì…… ma?",null,"BODY863"],["✗ 因为……所以……因为……所以…… → ✓ 一方面……另一方面……总之……",null,null,"Yīnwèi…… suǒyǐ…… yīnwèi…… suǒyǐ…… | Yīfāngmiàn…… lìngyīfāngmiàn…… zǒngzhī……",null,"BODY864"],["Mẹo luyện: ghi âm câu trả lời, đếm số lần \"嗯/啊\"; mục tiêu mỗi phút ≤ 3 lần.",null,null,"Ń / a",null,"BODY865"],["Phát âm: 即兴 jíxìng; 具体 jùtǐ; 情况 qíngkuàng; 打比方 dǎ bǐfang; 总之 zǒngzhī.",null,null,"Jíxìng | Jùtǐ | Qíngkuàng | Dǎbǐfāng | Zǒngzhī",null,"BODY866"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY867-C"],["Ghi âm 5 câu trả lời ngẫu nhiên: nhờ người nhà/bạn bè bốc 5 câu trong danh sách 15 câu và 6 thẻ chủ đề, mỗi câu chỉ được chuẩn bị 10 giây.",null,null,null,null,"BODY868"],["HSK4: mỗi câu 30–60 giây. HSK5: mỗi câu 1–2 phút, có ít nhất 1 lần tự phản biện (有的人觉得……，但是我觉得……).",null,null,"Yǒu de rén juéde……, dànshì wǒ juéde……",null,"BODY869"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY870"],["Buổi 21 — 新闻与社会话题 Tin tức và xã hội",null,null,"Xīnwén yǔ shèhuì huàtí",null,"BODY1-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY2-C"],["HSK4: Tóm tắt một tin tức trong 1 phút và nêu ý kiến cá nhân. HSK5: Phân biệt sự thật và quan điểm, thảo luận chủ đề gây tranh cãi một cách khách quan.",null,null,null,null,"BODY3"],["Khung tóm tắt tin 5W + ý kiến: ① 什么时候、在哪儿 Khi nào, ở đâu → ② 发生了什么 Chuyện gì → ③ 为什么 / 影响 Vì sao, ảnh hưởng → ④ 我的看法 Ý kiến của tôi.",null,null,"Shénme shíhou, zài nǎr | Fāshēng le shénme | Wèishénme | Yǐngxiǎng | Wǒ de kànfǎ",null,"BODY4"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY5-C"],["1. Hỏi: 你平时通过什么方式看新闻？ (Bình thường bạn xem tin tức bằng cách nào?)",null,null,"Nǐ píngshí tōngguò shénme fāngshì kàn xīnwén?",null,"BODY6"],["Đáp: 我主要在手机上看，早上坐车的时候刷一刷新闻软件，有时候也看一些中文的新闻号，顺便学中文。 (Chủ yếu xem trên điện thoại, sáng ngồi xe lướt app tin tức, đôi khi xem kênh tin tiếng Trung, tiện học tiếng Trung.)",null,null,"Wǒ zhǔyào zài shǒujī shàng kàn, zǎoshang zuòchē de shíhou shuā yī shuā xīnwén ruǎnjiàn, yǒushíhou yě kàn yīxiē Zhōngwén de xīnwén hào, shùnbiàn xué Zhōngwén.",null,"BODY7"],["2. Hỏi: 最近有什么新闻让你印象深刻？ (Gần đây có tin nào khiến bạn ấn tượng?)",null,null,"Zuìjìn yǒu shénme xīnwén ràng nǐ yìnxiàng shēnkè?",null,"BODY8"],["Đáp: 最近有一条新闻说河内要限制摩托车进入市中心，我觉得对我们的生活影响会很大。 (Gần đây có tin nói Hà Nội sẽ hạn chế xe máy vào trung tâm, tôi thấy sẽ ảnh hưởng lớn đến cuộc sống.)",null,null,"Zuìjìn yǒu yītiáo xīnwén shuō Hénèi yào xiànzhì mótuōchē jìnrù shìzhōngxīn, wǒ juéde duì wǒmen de shēnghuó yǐngxiǎng huì hěndà.",null,"BODY9"],["3. Hỏi: 你相信网上看到的新闻吗？ (Bạn có tin tin tức trên mạng không?)",null,null,"Nǐ xiāngxìn wǎngshàng kàndào de xīnwén ma?",null,"BODY10"],["Đáp: 不完全相信。网上有很多假新闻，我一般会再看看大的新闻网站有没有报道。 (Không tin hoàn toàn. Trên mạng nhiều tin giả, tôi thường xem các trang tin lớn có đưa không.)",null,null,"Bù wánquán xiāngxìn. Wǎngshàng yǒu hěnduō jiàxīnwén, wǒ yībān huì zài kànkan dà de xīnwén wǎngzhàn yǒuméiyǒu bàodào.",null,"BODY11"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY12-C"],["1. 新闻报道 (bản tin, tin tức đưa): 据新闻报道，今年越南的出口增长了百分之十二。 (Theo tin tức, năm nay xuất khẩu VN tăng 12%.)",null,null,"Xīnwénbàodào | Jù xīnwénbàodào, jīnnián Yuènán de chūkǒu zēngzhǎng le bǎifēnzhīshí'èr.",null,"BODY13"],["2. 现象 (hiện tượng): 年轻人不想结婚的现象越来越普遍。 (Hiện tượng người trẻ không muốn kết hôn ngày càng phổ biến.)",null,null,"Xiànxiàng | Niánqīngrén bùxiǎng jiéhūn de xiànxiàng yuèláiyuè pǔbiàn.",null,"BODY14"],["3. 趋势 (xu hướng): 网上购物已经成为一种趋势。 (Mua sắm online đã thành một xu hướng.)",null,null,"Qūshì | Wǎngshàng gòuwù yǐjīng chéngwéi yīzhǒng qūshì.",null,"BODY15"],["4. 影响 (ảnh hưởng): 这个政策对小企业的影响很大。 (Chính sách này ảnh hưởng lớn đến doanh nghiệp nhỏ.)",null,null,"Yǐngxiǎng | Zhège zhèngcè duì xiǎoqǐyè de yǐngxiǎng hěndà.",null,"BODY16"],["5. 争议 (tranh cãi): 这个话题在网上引起了很大的争议。 (Chủ đề này gây tranh cãi lớn trên mạng.)",null,null,"Zhēngyì | Zhège huàtí zài wǎngshàng yǐnqǐ le hěndà de zhēngyì.",null,"BODY17"],["6. 引起关注 (thu hút sự quan tâm): 这件事引起了社会的广泛关注。 (Việc này thu hút sự quan tâm rộng rãi của xã hội.)",null,null,"Yǐnqǐ guānzhù | Zhèjiàn shì yǐnqǐ le shèhuì de guǎngfàn guānzhù.",null,"BODY18"],["7. 据说 / 据报道 (nghe nói / theo đưa tin): 据报道，明年最低工资会上调百分之六。 (Theo đưa tin, năm sau lương tối thiểu tăng 6%.)",null,null,"Jùshuō | Jù bàodào | Jù bàodào, míngnián zuìdīgōngzī huì shàngtiáo bǎifēnzhīliù.",null,"BODY19"],["8. 一方面……另一方面 (một mặt … mặt khác): 一方面经济发展很快，另一方面环境问题也越来越严重。 (Một mặt kinh tế phát triển nhanh, mặt khác vấn đề môi trường ngày càng nghiêm trọng.)",null,null,"Yīfāngmiàn…… lìngyīfāngmiàn | Yīfāngmiàn jīngjì fāzhǎn hěnkuài, lìngyīfāngmiàn huánjìng wèntí yě yuèláiyuè yánzhòng.",null,"BODY20"],["9. 事实 / 观点 (sự thật / quan điểm): 我们要分清楚哪些是事实，哪些只是个人观点。 (Phải phân rõ đâu là sự thật, đâu chỉ là quan điểm cá nhân.)",null,null,"Shìshí | Guāndiǎn | Wǒmen yào fēn qīngchu nǎxiē shì shìshí, nǎxiē zhǐshì gèrénguāndiǎn.",null,"BODY21"],["10. 不能一概而论 (không thể vơ đũa cả nắm): 不是所有年轻人都不努力，不能一概而论。 (Không phải người trẻ nào cũng không cố gắng, không thể vơ đũa cả nắm.)",null,null,"Bùnéng yīgài'érlùn | Bùshì suǒyǒu niánqīngrén dōu bù nǔlì, bùnéng yīgài'érlùn.",null,"BODY22"],["11. 有利有弊 (có lợi có hại): 任何新技术都是有利有弊的。 (Công nghệ mới nào cũng có lợi có hại.)",null,null,"Yǒulìyǒubì | Rènhé xīn jìshù dōu shì yǒulìyǒubì de.",null,"BODY23"],["12. 值得关注 (đáng chú ý): 这个数据很值得关注。 (Số liệu này rất đáng chú ý.)",null,null,"Zhíde guānzhù | Zhège shùjù hěn zhíde guānzhù.",null,"BODY24"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY25-C"],["1. 最近看到一条新闻，说…… (Gần đây đọc được một tin, nói rằng …)",null,null,"Zuìjìn kàndào yītiáo xīnwén, shuō……",null,"BODY26"],["Ví dụ: 最近看到一条新闻，说越南已经成为中国在东盟最大的贸易伙伴。 (Gần đây đọc tin nói VN đã thành đối tác thương mại lớn nhất của TQ trong ASEAN.)",null,null,"Zuìjìn kàndào yītiáo xīnwén, shuō Yuènán yǐjīng chéngwéi Zhōngguó zài Dōngméng zuìdà de màoyì huǒbàn.",null,"BODY27"],["Ví dụ: 最近看到一条新闻，说很多大学开始用AI给学生批改作业。 (Gần đây đọc tin nói nhiều trường đại học bắt đầu dùng AI chấm bài cho sinh viên.)",null,null,"Zuìjìn kàndào yītiáo xīnwén, shuō hěnduō dàxué kāishǐ yòng AI gěi xuésheng pīgǎizuòyè.",null,"BODY28"],["2. 据……报道，…… (Theo … đưa tin, …)",null,null,"Jù…… bàodào,……",null,"BODY29"],["Ví dụ: 据越南快讯报道，今年第三季度的经济增长率是百分之七。 (Theo VnExpress, tăng trưởng kinh tế quý 3 năm nay là 7%.)",null,null,"Jù Yuènán Kuàixùn bàodào, jīnnián dìsānjìdù de jīngjì zēngzhǎnglǜ shì bǎifēnzhīqī.",null,"BODY30"],["Ví dụ: 据新华社报道，中国今年的新能源汽车销量又创了新高。 (Theo Tân Hoa Xã, doanh số xe năng lượng mới của TQ năm nay lập kỷ lục mới.)",null,null,"Jù Xīnhuáshè bàodào, Zhōngguó jīnnián de xīnnéngyuán qìchēxiāoliàng yòu chuàng le xīngāo.",null,"BODY31"],["3. 这条新闻引起了……的关注，因为…… (Tin này thu hút sự quan tâm của …, vì …)",null,null,"Zhè tiáo xīnwén yǐnqǐ le…… de guānzhù, yīnwèi……",null,"BODY32"],["Ví dụ: 这条新闻引起了很多家长的关注，因为它跟孩子的教育有关。 (Tin này thu hút nhiều phụ huynh quan tâm vì liên quan đến giáo dục con cái.)",null,null,"Zhè tiáo xīnwén yǐnqǐ le hěnduō jiāzhǎng de guānzhù, yīnwèi tā gēn háizi de jiàoyù yǒuguān.",null,"BODY33"],["Ví dụ: 这条新闻引起了外资企业的关注，因为新政策会影响他们的税收。 (Tin này thu hút doanh nghiệp FDI quan tâm vì chính sách mới ảnh hưởng thuế của họ.)",null,null,"Zhè tiáo xīnwén yǐnqǐ le wàizīqǐyè de guānzhù, yīnwèi xīn zhèngcè huì yǐngxiǎng tāmen de shuìshōu.",null,"BODY34"],["4. 不能一概而论，有的……，有的…… (Không thể vơ đũa cả nắm, có … có …)",null,null,"Bùnéng yīgài'érlùn, yǒu de……, yǒu de……",null,"BODY35"],["Ví dụ: 说年轻人不能吃苦，不能一概而论，有的确实很娇气，有的比我们还努力。 (Nói người trẻ không chịu khổ được thì không thể vơ đũa, có người đúng là yếu đuối, có người còn chăm hơn chúng ta.)",null,null,"Shuō niánqīngrén bùnéng chīkǔ, bùnéng yīgài'érlùn, yǒu de quèshí hěn jiāoqì, yǒu de bǐ wǒmen hái nǔlì.",null,"BODY36"],["Ví dụ: 网红产品质量不好？不能一概而论，有的确实很差，有的性价比很高。 (Sản phẩm của người nổi tiếng chất lượng kém? Không thể vơ đũa, có cái kém thật, có cái rất đáng tiền.)",null,null,"Wǎng hóng chǎnpǐnzhìliàng bùhǎo? Bùnéng yīgài'érlùn, yǒu de quèshí hěn chà, yǒu de xìngjiàbǐ hěn gāo.",null,"BODY37"],["5. 从……来看，这是一个……的趋势 (Xét từ …, đây là xu hướng …)",null,null,"Cóng…… láikàn, zhè shì yīgè…… de qūshì",null,"BODY38"],["Ví dụ: 从数据来看，越来越多的人选择在网上买菜，这是一个不可逆的趋势。 (Từ số liệu, ngày càng nhiều người mua đồ ăn online, đây là xu hướng không thể đảo ngược.)",null,null,"Cóng shùjù láikàn, yuèláiyuè duō de rén xuǎnzé zài wǎngshàng mǎicài, zhè shì yīgè bù kěnì de qūshì.",null,"BODY39"],["6. 这件事有利有弊：好处是……，坏处是…… (Việc này có lợi có hại: lợi là …, hại là …)",null,null,"Zhèjiàn shì yǒulìyǒubì: hǎochù shì……, huàichù shì……",null,"BODY40"],["Ví dụ: 外卖平台有利有弊：好处是方便，坏处是产生了很多塑料垃圾。 (Ứng dụng giao đồ ăn có lợi có hại: lợi là tiện, hại là tạo nhiều rác nhựa.)",null,null,"Wàimài píngtái yǒulìyǒubì: hǎochù shì fāngbiàn, huàichù shì chǎnshēng le hěnduō sùliào lājī.",null,"BODY41"],["Ví dụ: 远程上课有利有弊：好处是节省时间，坏处是学生容易分心。 (Học online có lợi có hại: lợi là tiết kiệm thời gian, hại là học sinh dễ mất tập trung.)",null,null,"Yuǎnchéng shàngkè yǒulìyǒubì: hǎochù shì jiéshěngshíjiān, huàichù shì xuésheng róngyì fēnxīn.",null,"BODY42"],["7. 我对这件事的看法是…… (Quan điểm của tôi về việc này là …)",null,null,"Wǒ duì zhèjiàn shì de kànfǎ shì……",null,"BODY43"],["Ví dụ: 我对这件事的看法是，政府的出发点是好的，但是需要给大家更多的时间适应。 (Quan điểm của tôi là xuất phát điểm của chính phủ là tốt, nhưng cần cho mọi người thêm thời gian thích nghi.)",null,null,"Wǒ duì zhèjiàn shì de kànfǎ shì, zhèngfǔ de chūfādiǎn shì hǎo de, dànshì xūyào gěi dàjiā gèng duō de shíjiān shìyìng.",null,"BODY44"],["8. 这只是……的说法，具体情况还要…… (Đây chỉ là cách nói của …, tình hình cụ thể còn phải …)",null,null,"Zhè zhǐshì…… de shuōfǎ, jùtǐqíngkuàng háiyào……",null,"BODY45"],["Ví dụ: 这只是网上的说法，具体情况还要等官方公布。 (Đây chỉ là tin trên mạng, cụ thể còn phải chờ công bố chính thức.)",null,null,"Zhè zhǐshì wǎngshàng de shuōfǎ, jùtǐqíngkuàng háiyào děng guānfāng gōngbù.",null,"BODY46"],["9. (HSK5) 新闻里说的……是事实，但是……只是记者的观点 (… trong tin là sự thật, nhưng … chỉ là quan điểm của phóng viên)",null,null,"Xīnwén lǐ shuō de…… shì shìshí, dànshì…… zhǐshì jìzhě de guāndiǎn",null,"BODY47"],["Ví dụ: 新闻里说的\"房价上涨了百分之十五\"是事实，但是\"年轻人永远买不起房\"只是记者的观点。 (Trong tin \"giá nhà tăng 15%\" là sự thật, nhưng \"người trẻ mãi không mua nổi nhà\" chỉ là quan điểm của phóng viên.)",null,null,"Xīnwén lǐ shuō de \"fángjià shàngzhǎng le bǎifēnzhīshíwǔ\" shì shìshí, dànshì \"niánqīngrén yǒngyuǎn mǎibùqǐ fáng\" zhǐshì jìzhě de guāndiǎn.",null,"BODY48"],["10. (HSK5) 这个问题没有标准答案，关键在于…… (Vấn đề này không có đáp án chuẩn, mấu chốt nằm ở …)",null,null,"Zhège wèntí méiyǒu biāozhǔndá'àn, guānjiànzàiyú……",null,"BODY49"],["Ví dụ: 孩子要不要学编程，这个问题没有标准答案，关键在于孩子自己有没有兴趣。 (Trẻ có nên học lập trình không, không có đáp án chuẩn, mấu chốt ở chỗ trẻ có hứng thú không.)",null,null,"Háizi yào bùyào xué biānchéng, zhège wèntí méiyǒu biāozhǔndá'àn, guānjiànzàiyú háizi zìjǐ yǒuméiyǒu xìngqù.",null,"BODY50"],["情景对话 1 — Kể và bàn về tin \"Hà Nội hạn chế xe máy\" trong giờ nghỉ trưa (HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY51-C"],["小林: 你看到那条新闻了吗？河内要在市中心限制摩托车了。 (Bạn thấy tin đó chưa? Hà Nội sắp hạn chế xe máy ở trung tâm.)",null,null,"Xiǎo Lín: nǐ kàndào nàtiáo xīnwén le ma? Hénèi yào zài shìzhōngxīn xiànzhì mótuōchē le.",null,"BODY52"],["阿玲: 看到了。据报道，从二〇三〇年开始，一些区不能骑摩托车。 (Thấy rồi. Theo đưa tin, từ năm 2030 một số quận không được đi xe máy.)",null,null,"Ā Líng: kàndào le. Jù bàodào, cóng èr | Sān | Nián kāishǐ, yīxiē qū bùnéng qí mótuōchē.",null,"BODY53"],["小林: 那我们以后怎么上班？我家离公司十公里，坐公交车要一个多小时。 (Vậy sau này mình đi làm thế nào? Nhà mình cách công ty 10km, đi xe buýt hơn một tiếng.)",null,null,"Xiǎo Lín: nà wǒmen yǐhòu zěnme shàngbān? Wǒjiā lí gōngsī shígōnglǐ, zuò gōngjiāochē yào yīgèduō xiǎoshí.",null,"BODY54"],["阿玲: 新闻里说政府会多修地铁，还会增加公交车的线路。 (Tin nói chính phủ sẽ xây thêm tàu điện, tăng tuyến xe buýt.)",null,null,"Ā Líng: xīnwén lǐ shuō zhèngfǔ huì duō xiū dìtiě, hái huì zēngjiā gōngjiāochē de xiànlù.",null,"BODY55"],["小林: 地铁现在才两条线，五年能修好吗？ (Tàu điện giờ mới có 2 tuyến, 5 năm xây xong được không?)",null,null,"Xiǎo Lín: dìtiě xiànzài cái liǎngtiáoxiàn, wǔnián néng xiūhǎo ma?",null,"BODY56"],["阿玲: 这个就不好说了。不过我觉得这个政策的出发点是好的，河内的空气真的太差了。 (Cái đó khó nói. Nhưng mình thấy xuất phát điểm chính sách này là tốt, không khí Hà Nội tệ quá.)",null,null,"Ā Líng: zhège jiù bùhǎo shuō le. Bùguò wǒ juéde zhège zhèngcè de chūfādiǎn shì hǎo de, Hénèi de kōngqì zhēnde tàichà le.",null,"BODY57"],["小林: 这倒是。上个月有好几天空气污染指数都超过两百。 (Cũng đúng. Tháng trước mấy ngày chỉ số ô nhiễm đều vượt 200.)",null,null,"Xiǎo Lín: zhè dǎo shì. Shànggèyuè yǒu hǎo jǐtiān kōngqìwūrǎn zhǐshù dōu chāoguò liǎngbǎi.",null,"BODY58"],["阿玲: 而且摩托车太多，每天都堵车，很多外国游客都说河内过马路太危险了。 (Mà xe máy nhiều quá, ngày nào cũng tắc, nhiều khách nước ngoài nói qua đường ở Hà Nội nguy hiểm quá.)",null,null,"Ā Líng: érqiě mótuōchē tài duō, měitiān dōu dǔchē, hěnduō wàiguóyóukè dōu shuō Hénèi guò mǎlù tài wēixiǎn le.",null,"BODY59"],["小林: 我同意，可是对卖东西的小商贩影响很大，他们都靠摩托车送货。 (Mình đồng ý, nhưng ảnh hưởng lớn đến người bán hàng nhỏ, họ đều dựa vào xe máy chở hàng.)",null,null,"Xiǎo Lín: wǒ tóngyì, kěshì duì màidōngxi de xiǎoshāngfàn yǐngxiǎng hěndà, tāmen dōu kào mótuōchē sònghuò.",null,"BODY60"],["阿玲: 所以我觉得这个政策有利有弊，关键是要给大家足够的时间准备，还要有其他的交通方式。 (Nên mình thấy chính sách có lợi có hại, quan trọng là cho mọi người đủ thời gian chuẩn bị và có phương tiện khác.)",null,null,"Ā Líng: suǒyǐ wǒ juéde zhège zhèngcè yǒulìyǒubì, guānjiàn shì yào gěi dàjiā zúgòu de shíjiān zhǔnbèi, háiyào yǒu qítā de jiāotōng fāngshì.",null,"BODY61"],["小林: 对。我对这件事的看法是：方向是对的，但是不能太急。 (Đúng. Quan điểm của mình là: hướng đi đúng nhưng không thể quá vội.)",null,null,"Xiǎo Lín: duì. Wǒ duì zhèjiàn shì de kànfǎ shì: fāngxiàng shì duì de, dànshì bùnéng tài jí.",null,"BODY62"],["阿玲: 说不定到时候我们都买电动车了。 (Biết đâu đến lúc đó mình đều mua xe điện rồi.)",null,null,"Ā Líng: shuōbùdìng dàoshíhou wǒmen dōu mǎi diàndòngchē le.",null,"BODY63"],["小林: 哈哈，那我得开始存钱了！ (Haha, vậy mình phải bắt đầu tiết kiệm tiền rồi!)",null,null,"Xiǎo Lín: hāhā, nà wǒ děi kāishǐ cúnqián le!",null,"BODY64"],["情景对话 2 — Tin kinh tế liên quan đến công việc: doanh nghiệp TQ chuyển nhà máy sang VN",null,null,"Qíngjǐng duìhuà",null,"BODY65-C"],["经理: 大家最近关注到一个趋势了吗？越来越多的中国企业把工厂搬到越南。 (Mọi người có để ý một xu hướng gần đây không? Ngày càng nhiều doanh nghiệp TQ chuyển nhà máy sang VN.)",null,null,"Jīnglǐ: dàjiā zuìjìn guānzhù dào yīgè qūshì le ma? Yuèláiyuè duō de Zhōngguó qǐyè bǎ gōngchǎng bān dào Yuènán.",null,"BODY66"],["小阮: 关注到了。据报道，今年前九个月，中国对越南的投资比去年同期增长了百分之三十。 (Có ạ. Theo đưa tin, 9 tháng đầu năm nay đầu tư của TQ vào VN tăng 30% so với cùng kỳ.)",null,null,"Xiǎo Ruǎn: guānzhù dào le. Jù bàodào, jīnnián qián jiǔgè yuè, Zhōngguó duì Yuènán de tóuzī bǐ qùniántóngqī zēngzhǎng le bǎifēnzhīsānshí.",null,"BODY67"],["经理: 你觉得主要原因是什么？ (Bạn thấy nguyên nhân chính là gì?)",null,null,"Jīnglǐ: nǐ juéde zhǔyào yuányīn shì shénme?",null,"BODY68"],["小阮: 我觉得有三个原因：第一，越南的人工成本比中国低；第二，越南跟很多国家签了自由贸易协定，出口关税低；第三，越南离中国近，供应链很方便。 (Có 3 nguyên nhân: một, chi phí nhân công VN thấp hơn TQ; hai, VN ký nhiều hiệp định thương mại tự do, thuế xuất khẩu thấp; ba, VN gần TQ, chuỗi cung ứng thuận tiện.)",null,null,"Xiǎo Ruǎn: wǒ juéde yǒu sāngè yuányīn: dìyī, Yuènán de réngōngchéngběn bǐ Zhōngguó dī; dì'èr, Yuènán gēn hěnduō guójiā qiān le zìyóu màoyìxiédìng, chūkǒu guānshuì dī; dìsān, Yuènán lí Zhōngguó jìn, gōngyìngliàn hěn fāngbiàn.",null,"BODY69"],["小林: 我想补充一点：现在北宁、海防的工业区已经很难找到工人了，工资也在涨。 (Tôi xin bổ sung: giờ khu công nghiệp Bắc Ninh, Hải Phòng đã khó tuyển công nhân, lương cũng đang tăng.)",null,null,"Xiǎo Lín: wǒ xiǎng bǔchōng yīdiǎn: xiànzài Běiníng, Hǎifáng de gōngyèqū yǐjīng hěn nán zhǎodào gōngrén le, gōngzī yě zài zhǎng.",null,"BODY70"],["经理: 对，这个现象也值得关注。那对我们公司来说，是机会还是挑战？ (Đúng, hiện tượng này cũng đáng chú ý. Vậy với công ty mình là cơ hội hay thách thức?)",null,null,"Jīnglǐ: duì, zhège xiànxiàng yě zhíde guānzhù. Nà duì wǒmen gōngsī láishuō, shì jīhuì háishì tiǎozhàn?",null,"BODY71"],["小阮: 我觉得是机会。新来的中国工厂需要很多本地的供应商和物流公司，我们会说中文，有很大的优势。 (Em thấy là cơ hội. Nhà máy TQ mới sang cần nhiều NCC và công ty logistics địa phương, chúng ta nói được tiếng Trung, lợi thế rất lớn.)",null,null,"Xiǎo Ruǎn: wǒ juéde shì jīhuì. Xīn lái de Zhōngguó gōngchǎng xūyào hěnduō běndì de gōngyìngshāng hé wùliú gōngsī, wǒmen huì shuō Zhōngwén, yǒu hěndà de yōushì.",null,"BODY72"],["小林: 不过竞争也会更激烈，很多中国的物流公司也跟着过来了。 (Nhưng cạnh tranh cũng gay gắt hơn, nhiều công ty logistics TQ cũng theo sang.)",null,null,"Xiǎo Lín: bùguò jìngzhēng yě huì gèng jīliè, hěnduō Zhōngguó de wùliú gōngsī yě gēnzhe guòlái le.",null,"BODY73"],["经理: 你们说得都有道理。下一步，我想请小阮整理一份北部新开工业区的中资企业名单，我们主动去拜访。 (Các bạn nói đều có lý. Bước tiếp theo, tôi muốn Tiểu Nguyễn tổng hợp danh sách doanh nghiệp vốn TQ ở các KCN mới miền Bắc, chúng ta chủ động đến thăm.)",null,null,"Jīnglǐ: nǐmen shuō de dōu yǒu dàolǐ. Xià yībù, wǒ xiǎng qǐng Xiǎo Ruǎn zhěnglǐ yīfèn běibù xīn kāi gōngyèqū de zhōngzīqǐyè míngdān, wǒmen zhǔdòng qù bàifǎng.",null,"BODY74"],["小阮: 好的，我下周五之前整理好。 (Vâng, trước thứ 6 tuần sau em tổng hợp xong.)",null,null,"Xiǎo Ruǎn: hǎo de, wǒ xià zhōuwǔ zhīqián zhěnglǐ hǎo.",null,"BODY75"],["情景对话 3 — Tin \"học sinh dùng AI làm bài tập\": hai phụ huynh tranh luận (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY76-C"],["A: 我昨天看到一条新闻，说现在很多中学生用AI写作业，老师根本看不出来。 (Hôm qua tôi đọc tin nói giờ nhiều học sinh cấp 2 dùng AI làm bài tập, giáo viên không nhận ra được.)",null,null,"Wǒ zuótiān kàndào yītiáo xīnwén, shuō xiànzài hěnduō zhōngxuésheng yòng AI xiě zuòyè, lǎoshī gēnběn kànbùchūlái.",null,"BODY77"],["B: 我也看到了。我觉得应该禁止学生用AI，不然他们什么都不会自己想了。 (Tôi cũng đọc rồi. Tôi thấy nên cấm học sinh dùng AI, không thì chúng không tự nghĩ gì nữa.)",null,null,"Wǒ yě kàndào le. Wǒ juéde yīnggāi jìnzhǐ xuésheng yòng AI, bùrán tāmen shénme dōu bùhuì zìjǐ xiǎng le.",null,"BODY78"],["A: 完全禁止恐怕做不到吧？手机里到处都是AI。 (Cấm hoàn toàn e là không làm được? Điện thoại chỗ nào cũng có AI.)",null,null,"Wánquán jìnzhǐ kǒngpà zuò bùdào ba? Shǒujī lǐ dàochù dōu shì AI.",null,"BODY79"],["B: 那学校至少可以在考试的时候管严一点。 (Thì nhà trường ít nhất có thể quản chặt khi thi.)",null,null,"Nà xuéxiào zhìshǎo kěyǐ zài kǎoshì de shíhou guǎn yán yīdiǎn.",null,"BODY80"],["A: 这个我同意。不过我觉得AI也有好处，我女儿用它练英语口语，进步很快。 (Cái này tôi đồng ý. Nhưng AI cũng có lợi, con gái tôi dùng nó luyện nói tiếng Anh, tiến bộ rất nhanh.)",null,null,"Zhège wǒ tóngyì. Bùguò wǒ juéde AI yě yǒu hǎochù, wǒ nǚ'ér yòng tā liàn Yīngyǔkǒuyǔ, jìnbù hěnkuài.",null,"BODY81"],["B: 那是因为你女儿自律。大部分孩子只会直接复制答案。 (Đó là vì con chị tự giác. Phần lớn trẻ chỉ biết sao chép đáp án.)",null,null,"Nà shìyīnwèi nǐ nǚ'ér zìlǜ. Dàbùfen háizi zhǐ huì zhíjiē fùzhì dá'àn.",null,"BODY82"],["A: 不能一概而论吧。新闻里说的\"老师看不出来\"是事实，可是\"学生都不会思考了\"只是一部分人的担心。 (Không thể vơ đũa cả nắm. Trong tin \"giáo viên không nhận ra\" là sự thật, nhưng \"học sinh đều không biết suy nghĩ nữa\" chỉ là nỗi lo của một số người.)",null,null,"Bùnéng yīgài'érlùn ba. Xīnwén lǐ shuō de \"lǎoshī kànbùchūlái\" shì shìshí, kěshì \"xuésheng dōu bùhuì sīkǎo le\" zhǐshì yībùfen rén de dānxīn.",null,"BODY83"],["B: 那你觉得应该怎么办？ (Vậy chị thấy nên làm sao?)",null,null,"Nà nǐ juéde yīnggāi zěnmebàn?",null,"BODY84"],["A: 我觉得关键在于怎么用。老师可以改变作业的方式，比如让学生先用AI查资料，再在课堂上用自己的话讲出来。 (Tôi thấy mấu chốt ở cách dùng. Giáo viên có thể đổi cách giao bài, như cho học sinh dùng AI tra tài liệu trước, rồi trên lớp nói lại bằng lời của mình.)",null,null,"Wǒ juéde guānjiànzàiyú zěnme yòng. Lǎoshī kěyǐ gǎibiàn zuòyè de fāngshì, bǐrú ràng xuésheng xiān yòng AI cházīliào, zài zài kètáng shàng yòng zìjǐ dehuà jiǎng chūlái.",null,"BODY85"],["B: 这个办法不错，这样就不能只复制了。 (Cách này hay, như vậy không thể chỉ sao chép.)",null,null,"Zhège bànfǎ bùcuò, zhèyàng jiù bùnéng zhǐ fùzhì le.",null,"BODY86"],["A: 对。说到底，AI只是工具，就像计算器一样，关键是我们教孩子怎么用。 (Đúng. Suy cho cùng AI chỉ là công cụ, giống máy tính bỏ túi, quan trọng là dạy trẻ cách dùng.)",null,null,"Duì. Shuōdàodǐ, AI zhǐshì gōngjù, jiù xiàng jìsuànqì yīyàng, guānjiàn shì wǒmen jiào háizi zěnme yòng.",null,"BODY87"],["B: 你说得有道理，我回去也跟我儿子聊聊。 (Chị nói có lý, tôi về cũng nói chuyện với con trai.)",null,null,"Nǐ shuō de yǒu dàolǐ, wǒ huíqù yě gēn wǒ érzi liáoliao.",null,"BODY88"],["情景对话 4 — Tóm tắt tin cho sếp người Trung Quốc (thông báo chính sách mới, HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY89-C"],["总经理: 小阮，听说越南最近出了一个新的劳动政策，你给我简单说一下。 (Tiểu Nguyễn, nghe nói VN gần đây có chính sách lao động mới, bạn nói ngắn gọn cho tôi.)",null,null,"Zǒngjīnglǐ: Xiǎo Ruǎn, tīngshuō Yuènán zuìjìn chū le yīgè xīn de láodòng zhèngcè, nǐ gěi wǒ jiǎndān shuō yīxià.",null,"BODY90"],["小阮: 好的，李总。我简单总结一下：据政府网站报道，从明年一月一号开始，第一区的最低工资从每月四百九十六万盾提高到五百三十一万盾，提高了百分之七左右。 (Vâng, Lý tổng. Em tóm tắt ngắn: theo cổng thông tin chính phủ, từ 1/1 năm sau lương tối thiểu vùng 1 tăng từ 4,96 triệu lên 5,31 triệu/tháng, tăng khoảng 7%.)",null,null,"Xiǎo Ruǎn: hǎo de, Lǐ zǒng. Wǒ jiǎndān zǒngjié yīxià: jù zhèngfǔ wǎngzhàn bàodào, cóng míngnián yīyuè yīhào kāishǐ, dìyī qū de zuìdīgōngzī cóng měiyuè sìbǎi jiǔshíliù wàn dùn tígāo dào wǔbǎisānshí yīwàn dùn, tígāo le bǎifēnzhīqī zuǒyòu.",null,"BODY91"],["总经理: 对我们有什么影响？ (Ảnh hưởng gì đến chúng ta?)",null,null,"Zǒngjīnglǐ: duì wǒmen yǒu shénme yǐngxiǎng?",null,"BODY92"],["小阮: 我们工厂在第一区，有三百个工人的工资是按最低工资算的。我算了一下，一年的人工成本会增加大概十五亿盾。 (Nhà máy chúng ta ở vùng 1, có 300 công nhân lương tính theo mức tối thiểu. Em tính rồi, chi phí nhân công một năm tăng khoảng 1,5 tỷ.)",null,null,"Xiǎo Ruǎn: wǒmen gōngchǎng zài dìyī qū, yǒu sānbǎigè gōngrén de gōngzī shì àn zuìdīgōngzī suàn de. Wǒ suànle yīxià, yīnián de réngōngchéngběn huì zēngjiā dàgài shíwǔ yì dùn.",null,"BODY93"],["总经理: 社保费用也会跟着涨吧？ (Phí bảo hiểm xã hội cũng tăng theo nhỉ?)",null,null,"Zǒngjīnglǐ: shèbǎo fèiyòng yě huì gēnzhe zhǎng ba?",null,"BODY94"],["小阮: 是的，社保是按工资的比例交的，这部分我已经算进去了。 (Vâng, bảo hiểm tính theo tỷ lệ lương, phần này em đã tính vào rồi.)",null,null,"Xiǎo Ruǎn: shì de, shèbǎo shì àn gōngzī de bǐlì jiāo de, zhèbùfen wǒ yǐjīng suànjìnqù le.",null,"BODY95"],["总经理: 其他公司打算怎么应对？ (Các công ty khác định ứng phó thế nào?)",null,null,"Zǒngjīnglǐ: qítā gōngsī dǎsuàn zěnme yìngduì?",null,"BODY96"],["小阮: 据说有的公司打算提高自动化，有的打算调整奖金结构。不过这只是网上的说法，具体情况还要看各个公司的决定。 (Nghe nói có công ty định tăng tự động hóa, có công ty định điều chỉnh cơ cấu thưởng. Nhưng đây chỉ là tin trên mạng, cụ thể còn phải xem quyết định từng công ty.)",null,null,"Xiǎo Ruǎn: jùshuō yǒu de gōngsī dǎsuàn tígāo zìdònghuà, yǒu de dǎsuàn tiáozhěng jiǎngjīn jiégòu. Bùguò zhè zhǐshì wǎngshàng de shuōfǎ, jùtǐqíngkuàng háiyào kàn gègè gōngsī de juédìng.",null,"BODY97"],["总经理: 好，你把新闻的原文和你的计算发我邮箱，下周开会讨论。 (Được, bạn gửi bản gốc tin và phần tính toán vào email tôi, tuần sau họp bàn.)",null,null,"Zǒngjīnglǐ: hǎo, nǐ bǎ xīnwén de yuánwén hé nǐ de jìsuàn fā wǒ yóuxiāng, xiàzhōu kāihuìtǎolùn.",null,"BODY98"],["小阮: 好的，我把原文翻译成中文，今天下午发给您。 (Vâng, em dịch bản gốc sang tiếng Trung, chiều nay gửi ngài.)",null,null,"Xiǎo Ruǎn: hǎo de, wǒ bǎ yuánwén fānyìchéng Zhōngwén, jīntiānxiàwǔ fāgěinín.",null,"BODY99"],["情景对话 5 — (HSK5) Thảo luận chủ đề gây tranh cãi: \"Có nên làm việc 4 ngày/tuần?\"",null,null,"Qíngjǐng duìhuà",null,"BODY100-C"],["主持人: 最近有一条新闻引起了很大的争议：有几家欧洲公司试行每周工作四天，结果员工效率没有下降。大家怎么看？ (Gần đây có tin gây tranh cãi lớn: vài công ty châu Âu thử làm việc 4 ngày/tuần, hiệu suất nhân viên không giảm. Mọi người nghĩ sao?)",null,null,"Zhǔchírén: zuìjìn yǒu yītiáo xīnwén yǐnqǐ le hěndà de zhēngyì: yǒu jǐjiā Ōuzhōu gōngsī shìxíng měizhōu gōngzuò sìtiān, jiéguǒ yuángōng xiàolǜ méiyǒu xiàjiàng. Dàjiā zěnme kàn?",null,"BODY101"],["小林: 我觉得这是一个趋势。员工休息好了，工作的时候更专心，而且公司还能节省电费和办公成本。 (Tôi thấy đây là xu hướng. Nhân viên nghỉ ngơi tốt, làm việc tập trung hơn, công ty còn tiết kiệm tiền điện và chi phí văn phòng.)",null,null,"Xiǎo Lín: wǒ juéde zhè shì yīgè qūshì. Yuángōng xiūxi hǎo le, gōngzuò de shíhou gèng zhuānxīn, érqiě gōngsī hái néng jiéshěng diànfèi hé bàngōng chéngběn.",null,"BODY102"],["阿海: 我想先分清楚事实和观点。新闻里说的\"效率没有下降\"是这几家公司的数据，这是事实；但是\"这是未来的趋势\"只是记者的观点，不一定适合所有国家。 (Tôi muốn phân rõ sự thật và quan điểm trước. Trong tin \"hiệu suất không giảm\" là số liệu của mấy công ty đó, đó là sự thật; nhưng \"đây là xu hướng tương lai\" chỉ là quan điểm phóng viên, chưa chắc hợp với mọi nước.)",null,null,"Ā Hǎi: wǒ xiǎng xiān fēn qīngchu shìshí hé guāndiǎn. Xīnwén lǐ shuō de \"xiàolǜ méiyǒu xiàjiàng\" shì zhè jǐjiā gōngsī de shùjù, zhè shì shìshí; dànshì \"zhè shì wèilái de qūshì\" zhǐshì jìzhě de guāndiǎn, bù yīdìng shìhé suǒyǒu guójiā.",null,"BODY103"],["小林: 你说得对，但是越南也有公司在试，比如一些科技公司。 (Bạn nói đúng, nhưng VN cũng có công ty đang thử, như một số công ty công nghệ.)",null,null,"Xiǎo Lín: nǐ shuōdeduì, dànshì Yuènán yě yǒu gōngsī zài shì, bǐrú yīxiē kējì gōngsī.",null,"BODY104"],["阿海: 科技公司可以，可是工厂呢？生产线不能停，客户的订单也不会少。 (Công ty công nghệ thì được, còn nhà máy? Chuyền không thể dừng, đơn của khách cũng không ít đi.)",null,null,"Ā Hǎi: kējì gōngsī kěyǐ, kěshì gōngchǎng ne? Shēngchǎnxiàn bùnéng tíng, kèhù de dìngdān yě bùhuì shǎo.",null,"BODY105"],["小芳: 我觉得不能一概而论。办公室的岗位可以试，工厂可以用轮班的方式，每个人上四天，但是生产线一直开。 (Tôi thấy không thể vơ đũa. Vị trí văn phòng có thể thử, nhà máy có thể xoay ca, mỗi người làm 4 ngày nhưng chuyền vẫn chạy.)",null,null,"Xiǎo Fāng: wǒ juéde bùnéng yīgài'érlùn. Bàngōngshì de gǎngwèi kěyǐ shì, gōngchǎng kěyǐ yòng lúnbān de fāngshì, měigè rén shàng sìtiān, dànshì shēngchǎnxiàn yīzhí kāi.",null,"BODY106"],["阿海: 那就要多招人，成本会增加。 (Vậy phải tuyển thêm người, chi phí tăng.)",null,null,"Ā Hǎi: nà jiùyào duōzhāo rén, chéngběn huì zēngjiā.",null,"BODY107"],["小林: 一方面成本会增加，另一方面员工流失率可能会降低，招聘和培训的成本就少了。 (Một mặt chi phí tăng, mặt khác tỷ lệ nghỉ việc có thể giảm, chi phí tuyển dụng đào tạo ít đi.)",null,null,"Xiǎo Lín: yīfāngmiàn chéngběn huì zēngjiā, lìngyīfāngmiàn yuángōng liúshīlǜ kěnéng huì jiàngdī, zhāopìn hé péixùn de chéngběn jiù shǎo le.",null,"BODY108"],["主持人: 那大家觉得越南什么时候会普遍实行？ (Vậy mọi người thấy khi nào VN sẽ áp dụng phổ biến?)",null,null,"Zhǔchírén: nà dàjiā juéde Yuènán shénme shíhou huì pǔbiàn shíxíng?",null,"BODY109"],["小芳: 这个问题没有标准答案，关键在于经济发展到什么水平。现在很多越南人还希望多加班多赚钱。 (Câu này không có đáp án chuẩn, mấu chốt là kinh tế phát triển đến mức nào. Giờ nhiều người Việt vẫn muốn tăng ca kiếm thêm tiền.)",null,null,"Xiǎo Fāng: zhège wèntí méiyǒu biāozhǔndá'àn, guānjiànzàiyú jīngjì fāzhǎn dào shénme shuǐpíng. Xiànzài hěnduō Yuènánrén hái xīwàng duō jiābān duō zhuànqián.",null,"BODY110"],["阿海: 我同意。总的来说，我认为这个方向值得关注，但是现在全面推广还太早。 (Tôi đồng ý. Nói chung tôi cho rằng hướng này đáng chú ý, nhưng giờ triển khai toàn diện còn quá sớm.)",null,null,"Ā Hǎi: wǒ tóngyì. Zǒngdeláishuō, wǒ rènwéi zhège fāngxiàng zhíde guānzhù, dànshì xiànzài quánmiàntuīguǎng hái tài zǎo.",null,"BODY111"],["小林: 那我们能不能先在我们公司的办公室试三个月？ (Vậy công ty mình thử ở văn phòng 3 tháng được không?)",null,null,"Xiǎo Lín: nà wǒmen néng bùnéng xiān zài wǒmen gōngsī de bàngōngshì shì sāngè yuè?",null,"BODY112"],["主持人: 哈哈，这个建议你可以写一个方案交给老板！ (Haha, đề xuất này bạn có thể viết phương án nộp sếp!)",null,null,"Zhǔchírén: hāhā, zhège jiànyì nǐ kěyǐ xiě yīgè fāng'àn jiāogěi lǎobǎn!",null,"BODY113"],["BÀI NÓI MẪU — Tóm tắt một tin và nêu ý kiến (2 phút, HSK4–5)",null,null,null,null,"BODY114-C"],["最近看到一条新闻，据越南快讯报道，河内的第二条地铁线开通以后，从市中心到郊区只要二十五分钟。开通第一个星期，每天有好几万人坐。这条新闻引起了很多上班族的关注，因为河内堵车太严重了。我对这件事的看法是，这是一个很好的开始。一方面，地铁又快又准时，能减少堵车和空气污染；另一方面，地铁站离很多人的家还比较远，如果没有方便的公交车接驳，很多人还是会选择骑摩托车。所以我觉得政府下一步应该多建一些地铁站附近的停车场和公交线路。总的来说，我对河内的交通还是很有信心的。",null,null,"Zuìjìn kàndào yītiáo xīnwén, jù Yuènán Kuàixùn bàodào, Hénèi de dì'èrtiáo dìtiěxiàn kāitōng yǐhòu, cóng shìzhōngxīn dào jiāoqū zhǐyào èrshíwǔ fēnzhōng. Kāitōng dìyīgè xīngqī, měitiān yǒu hǎojǐwàn rén zuò. Zhè tiáo xīnwén yǐnqǐ le hěnduō shàngbānzú de guānzhù, yīnwèi Hénèi dǔchē tài yánzhòng le. Wǒ duì zhèjiàn shì de kànfǎ shì, zhè shì yīgè hěn hǎodekāishǐ. Yīfāngmiàn, dìtiě yòu kuàiyòuzhǔn shí, néng jiǎnshǎo dǔchē hé kōngqìwūrǎn; lìngyīfāngmiàn, dìtiězhàn lí hěnduō rén de jiā hái bǐjiào yuǎn, rúguǒ méiyǒu fāngbiàn de gōngjiāochē jiēbó, hěnduō rén háishì huì xuǎnzé qí mótuōchē. Suǒyǐ wǒ juéde zhèngfǔ xià yībù yīnggāi duō jiàn yīxiē dìtiězhàn fùjìn de tíngchēchǎng hé gōngjiāoxiànlù. Zǒngdeláishuō, wǒ duì Hénèi de jiāotōng háishì hěn yǒu xìnxīn de.",null,"BODY115"],["引导练习 GUIDED SPEAKING — GV đọc tiêu đề tin, HS tóm tắt giả định + nêu ý kiến",null,null,"Yǐndǎo liànxí",null,"BODY116-C"],["1. Hỏi: 新闻标题：\"越南咖啡出口创历史新高\"。你怎么看？ (Tiêu đề: \"Xuất khẩu cà phê VN đạt kỷ lục\". Bạn nghĩ sao?)",null,null,"Xīnwénbiāotí: \"Yuènán kāfēi chūkǒu chuàng lìshǐ xīngāo\". Nǐ zěnme kàn?",null,"BODY117"],["Đáp: 这是一个好消息。一方面说明越南咖啡在国际上越来越受欢迎，另一方面也能帮助农民增加收入。不过我觉得我们应该多出口加工好的咖啡，而不是只卖咖啡豆，这样利润更高。 (Đây là tin vui. Một mặt cho thấy cà phê VN ngày càng được ưa chuộng quốc tế, mặt khác giúp nông dân tăng thu nhập. Nhưng tôi thấy nên xuất nhiều cà phê chế biến hơn, không chỉ bán hạt, như vậy lợi nhuận cao hơn.)",null,null,"Zhè shì yīgè hǎoxiāoxi. Yīfāngmiàn shuōmíng Yuènán kāfēi zài guójì shàng yuèláiyuè shòuhuānyíng, lìngyīfāngmiàn yě néng bāngzhù nóngmín zēngjiāshōurù. Bùguò wǒ juéde wǒmen yīnggāi duō chūkǒu jiāgōng hǎo de kāfēi, ér bùshì zhǐ mài kāfēidòu, zhèyàng lìrùn gèng gāo.",null,"BODY118"],["2. Hỏi: 新闻标题：\"年轻人越来越不愿意生孩子\"。你同意吗？ (Tiêu đề: \"Giới trẻ ngày càng không muốn sinh con\". Bạn đồng ý không?)",null,null,"Xīnwénbiāotí: \"niánqīngrén yuèláiyuè bù yuànyì shēng háizi\". Nǐ tóngyì ma?",null,"BODY119"],["Đáp: 不能一概而论。在大城市确实是这样，因为房价高、养孩子的成本太高；但是在农村，很多年轻人还是想早点结婚生孩子。 (Không thể vơ đũa. Ở thành phố lớn đúng là vậy vì nhà đắt, chi phí nuôi con quá cao; nhưng ở nông thôn nhiều bạn trẻ vẫn muốn sớm kết hôn sinh con.)",null,null,"Bùnéng yīgài'érlùn. Zài dàchéngshì quèshí shì zhèyàng, yīnwèi fángjià gāo, yǎng háizi de chéngběn tài gāo; dànshì zài nóngcūn, hěnduō niánqīngrén háishì xiǎng zǎodiǎn jiéhūn shēng háizi.",null,"BODY120"],["3. Hỏi: (HSK5) 新闻里说\"短视频让年轻人越来越不爱看书\"。哪部分是事实，哪部分是观点？ (Tin nói \"video ngắn khiến giới trẻ ngày càng không thích đọc sách\". Phần nào là sự thật, phần nào là quan điểm?)",null,null,"Xīnwén lǐ shuō \"duǎn shìpín ràng niánqīngrén yuèláiyuè bù ài kànshū\". Nǎ bùfen shì shìshí, nǎ bùfen shì guāndiǎn?",null,"BODY121"],["Đáp: 如果新闻里有调查数据，比如\"年轻人每天看书的时间减少了百分之三十\"，这是事实；但是\"是因为短视频\"只是一种推测，可能还有别的原因，比如工作压力大、没有时间。 (Nếu tin có số liệu khảo sát như \"thời gian đọc sách mỗi ngày của giới trẻ giảm 30%\" thì là sự thật; nhưng \"là do video ngắn\" chỉ là suy đoán, có thể còn nguyên nhân khác như áp lực công việc, không có thời gian.)",null,null,"Rúguǒ xīnwén lǐ yǒu diàochá shùjù, bǐrú \"niánqīngrén měitiān kànshū de shíjiān jiǎnshǎo le bǎifēnzhīsānshí\", zhè shì shìshí; dànshì \"shìyīnwèi duǎn shìpín\" zhǐshì yīzhǒng tuīcè, kěnéng háiyǒu biéde yuányīn, bǐrú gōngzuò yālì dà, méiyǒu shíjiān.",null,"BODY122"],["情景模拟 ROLE-PLAY — Thảo luận tin về AI / giáo dục. Vòng 2 (bất ngờ): GV đưa một \"tin\" sai, HS phải nhận ra và yêu cầu kiểm chứng",null,null,"Qíngjǐng mónǐ",null,"BODY123-C"],["GV: 最近有一条新闻说，五年以后，百分之八十的办公室工作都会被AI代替。你怎么看？ (Gần đây có tin nói 5 năm nữa 80% việc văn phòng sẽ bị AI thay thế. Bạn nghĩ sao?)",null,null,"Zuìjìn yǒu yītiáo xīnwén shuō, wǔnián yǐhòu, bǎifēnzhībāshí de bàngōngshì gōngzuò dōu huì bèi AI dàitì. Nǐ zěnme kàn?",null,"BODY124"],["HS: 我也看到了类似的报道。我觉得有一部分工作确实会被代替，比如简单的数据录入和翻译。但是百分之八十太夸张了。 (Tôi cũng đọc tin tương tự. Tôi thấy một phần công việc đúng là sẽ bị thay như nhập liệu đơn giản và dịch thuật. Nhưng 80% thì quá phóng đại.)",null,null,"Wǒ yě kàndào le lèisì de bàodào. Wǒ juéde yǒu yībùfen gōngzuò quèshí huì bèi dàitì, bǐrú jiǎndān de shùjùlùrù hé fānyì. Dànshì bǎifēnzhībāshí tài kuāzhāng le.",null,"BODY125"],["GV: 为什么你觉得夸张？ (Sao bạn thấy phóng đại?)",null,null,"Wèishénme nǐ juéde kuāzhāng?",null,"BODY126"],["HS: 因为很多工作需要跟人沟通，比如销售、谈判、管理，AI可以帮忙，但是很难完全代替人。 (Vì nhiều việc cần giao tiếp với người như bán hàng, đàm phán, quản lý, AI có thể hỗ trợ nhưng khó thay hoàn toàn.)",null,null,"Yīnwèi hěnduō gōngzuò xūyào gēn rén gōutōng, bǐrú xiāoshòu, tánpàn, guǎnlǐ, AI kěyǐ bāngmáng, dànshì hěn nán wánquán dàitì rén.",null,"BODY127"],["GV (biến cố): 可是我在一个网站上看到，是联合国说的。 (Nhưng tôi đọc trên một trang web, nói là Liên Hợp Quốc nói.)",null,null,"Kěshì wǒ zài yīgè wǎngzhàn shàng kàndào, shì Liánhéguó shuō de.",null,"BODY128"],["HS: 这个我不太确定。是哪个网站？这只是网上的说法，我们最好看看联合国官方网站有没有发布这个报告，或者大的新闻机构有没有报道。 (Cái này tôi không chắc lắm. Trang nào vậy? Đây chỉ là tin trên mạng, tốt nhất xem trang chính thức của Liên Hợp Quốc có công bố báo cáo này không, hoặc các hãng tin lớn có đưa không.)",null,null,"Zhège wǒ bù tài quèdìng. Shì nǎge wǎngzhàn? Zhè zhǐshì wǎngshàng de shuōfǎ, wǒmen zuìhǎo kànkan Liánhéguó guānfāngwǎngzhàn yǒuméiyǒu fābù zhège bàogào, huòzhě dà de xīnwén jīgòu yǒuméiyǒu bàodào.",null,"BODY129"],["GV: 你说得对，我再查一下。 (Bạn nói đúng, tôi kiểm tra lại.)",null,null,"Nǐ shuōdeduì, wǒ zài chá yīxià.",null,"BODY130"],["HS: 不管数字是多少，我觉得关键在于我们自己要不断学习，学会用AI提高效率，这样就不怕被代替了。 (Dù con số là bao nhiêu, tôi thấy mấu chốt là chúng ta phải không ngừng học, biết dùng AI nâng hiệu suất, như vậy không sợ bị thay thế.)",null,null,"Bùguǎn shùzì shì duōshǎo, wǒ juéde guānjiànzàiyú wǒmen zìjǐ yào bùduàn xuéxí, xuéhuì yòng AI tígāoxiàolǜ, zhèyàng jiù bùpà bèi dàitì le.",null,"BODY131"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY132-C"],["✗ 新闻说是…… → ✓ 新闻里说……/ 据新闻报道……",null,null,"Xīnwén shuō shì…… | Xīnwén lǐ shuō…… / | Jù xīnwénbàodào……",null,"BODY133"],["✗ 我看了一个新闻。 → ✓ 我看了一条新闻。 (Lượng từ của 新闻 là 条.)",null,null,"Wǒ kàn le yīgè xīnwén. | Wǒ kàn le yītiáo xīnwén. | Xīnwén | Tiáo .",null,"BODY134"],["✗ 这个事情影响很大对年轻人。 → ✓ 这件事对年轻人的影响很大。",null,null,"Zhège shìqing yǐngxiǎng hěndà duì niánqīngrén. | Zhèjiàn shì duì niánqīngrén de yǐngxiǎng hěndà.",null,"BODY135"],["✗ 这是一个趋向。 → ✓ 这是一个趋势。",null,null,"Zhè shì yīgè qūxiàng. | Zhè shì yīgè qūshì.",null,"BODY136"],["✗ 所有年轻人都懒。 (khái quát hóa) → ✓ 有些年轻人比较懒，但是不能一概而论。",null,null,"Suǒyǒu niánqīngrén dōu lǎn. | Yǒuxiē niánqīngrén bǐjiào lǎn, dànshì bùnéng yīgài'érlùn.",null,"BODY137"],["✗ 我认为是事实。 (khi chỉ là cảm nhận) → ✓ 我个人觉得……/ 这只是我的看法。",null,null,"Wǒ rènwéi shì shìshí. | Wǒ gèrén juéde…… / | Zhè zhǐshì wǒ de kànfǎ.",null,"BODY138"],["Lưu ý: số năm đọc từng chữ số: 二〇三〇年 = èr líng sān líng nián.",null,null,"Èr | Sān | Nián",null,"BODY139"],["Phát âm: 报道 bàodào; 趋势 qūshì; 争议 zhēngyì; 现象 xiànxiàng; 一概而论 yīgài'érlùn.",null,null,"Bàodào | Qūshì | Zhēngyì | Xiànxiàng | Yīgài'érlùn",null,"BODY140"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY141-C"],["Chọn một tin tức có thật trong tuần (kinh tế, xã hội, công nghệ, giáo dục), ghi âm tóm tắt 1 phút theo khung 5W + 1 phút nêu ý kiến.",null,null,null,null,"BODY142"],["HSK5: thêm phần chỉ ra 1 câu là sự thật và 1 câu là quan điểm trong bản tin.",null,null,null,null,"BODY143"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY144"],["Buổi 22 — 跨文化沟通 Giao tiếp liên văn hóa",null,null,"Kuàwénhuà gōutōng",null,"BODY145-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY146-C"],["HSK4: So sánh tập quán Việt – Trung trong ăn uống, quà tặng, chào hỏi, công sở. HSK5: Nhận ra và xử lý hiểu nhầm văn hóa trong doanh nghiệp (cách từ chối, thể diện, cấp bậc, thời gian).",null,null,null,null,"BODY147"],["Khung xử lý hiểu nhầm văn hóa 3 bước: ① 发现差异 Nhận ra khác biệt → ② 解释背景 Giải thích bối cảnh văn hóa → ③ 找到双方都舒服的做法 Tìm cách làm cả hai bên đều thoải mái.",null,null,"Fāxiàn chāyì | Jiěshì bèijǐng | Zhǎodào shuāngfāng dōu shūfu de zuòfǎ",null,"BODY148"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY149-C"],["1. Hỏi: 你觉得越南人和中国人最大的不同是什么？ (Bạn thấy người Việt và người Trung khác nhau lớn nhất ở điểm nào?)",null,null,"Nǐ juéde Yuènánrén hé Zhōngguórén zuìdà de bùtóng shì shénme?",null,"BODY150"],["Đáp: 我觉得中国人说话声音比较大，做事比较快；越南人说话比较轻，做事比较灵活。 (Tôi thấy người TQ nói to hơn, làm việc nhanh hơn; người Việt nói nhẹ hơn, làm việc linh hoạt hơn.)",null,null,"Wǒ juéde Zhōngguórén shuōhuà shēngyīn bǐjiào dà, zuòshì bǐjiào kuài; Yuènánrén shuōhuà bǐjiào qīng, zuòshì bǐjiào línghuó.",null,"BODY151"],["2. Hỏi: 你跟中国同事一起工作，有没有遇到过让你吃惊的事？ (Làm việc với đồng nghiệp TQ, bạn có gặp chuyện nào khiến bạn ngạc nhiên không?)",null,null,"Nǐ gēn Zhōngguó tóngshì yīqǐ gōngzuò, yǒuméiyǒu yùdào guò ràng nǐ chījīng de shì?",null,"BODY152"],["Đáp: 有。第一次吃饭的时候，中国同事抢着买单，差点吵起来，我还以为他们生气了。 (Có. Lần đầu đi ăn, đồng nghiệp TQ tranh nhau trả tiền, suýt cãi nhau, tôi còn tưởng họ giận.)",null,null,"Yǒu. Dìyīcì chīfàn de shíhou, Zhōngguó tóngshì qiǎng zhe mǎidān, chàdiǎn chǎoqǐlái, wǒ hái yǐwéi tāmen shēngqì le.",null,"BODY153"],["3. Hỏi: 你去过中国吗？最不习惯的是什么？ (Bạn đến TQ chưa? Điều gì khó quen nhất?)",null,null,"Nǐ qùguò Zhōngguó ma? Zuì bù xíguàn de shì shénme?",null,"BODY154"],["Đáp: 去过广州。最不习惯的是吃饭的时候先喝汤，越南一般是最后喝汤。 (Đến Quảng Châu rồi. Khó quen nhất là ăn cơm uống canh trước, ở VN thường húp canh sau cùng.)",null,null,"Qùguò Guǎngzhōu. Zuì bù xíguàn de shì chīfàn de shíhou xiān hētāng, Yuènán yībān shì zuìhòu hētāng.",null,"BODY155"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY156-C"],["1. 文化差异 (khác biệt văn hóa): 很多误会都是因为文化差异。 (Nhiều hiểu lầm là do khác biệt văn hóa.)",null,null,"Wénhuàchāyì | Hěnduō wùhuì dōu shìyīnwèi wénhuàchāyì.",null,"BODY157"],["2. 礼貌 (lịch sự): 在越南，接东西的时候用两只手比较礼貌。 (Ở VN, nhận đồ bằng hai tay lịch sự hơn.)",null,null,"Lǐmào | Zài Yuènán, jiē dōngxi de shíhou yòng liǎngzhīshǒu bǐjiào lǐmào.",null,"BODY158"],["3. 委婉 (uyển chuyển, nói tránh): 中国人拒绝的时候常常说得很委婉。 (Người TQ khi từ chối thường nói rất khéo.)",null,null,"Wěiwǎn | Zhōngguórén jùjué de shíhou chángcháng shuō de hěn wěiwǎn.",null,"BODY159"],["4. 入乡随俗 (nhập gia tùy tục): 来越南工作，就要入乡随俗，慢慢习惯吃生菜。 (Sang VN làm việc thì nhập gia tùy tục, dần quen ăn rau sống.)",null,null,"Rùxiāngsuísú | Lái Yuènán gōngzuò, jiùyào rùxiāngsuísú, mànmàn xíguàn chī shēngcài.",null,"BODY160"],["5. 人情往来 (qua lại tình nghĩa, có đi có lại): 中国人很重视人情往来，你帮了我，我以后一定会帮你。 (Người TQ coi trọng có đi có lại, bạn giúp tôi, sau này tôi nhất định giúp bạn.)",null,null,"Rénqíng wǎnglái | Zhōngguórén hěn zhòngshì rénqíng wǎnglái, nǐ bāng le wǒ, wǒ yǐhòu yīdìng huì bāng nǐ.",null,"BODY161"],["6. 面子 (thể diện): 在别人面前批评他，会让他很没面子。 (Phê bình trước mặt người khác khiến anh ấy rất mất mặt.)",null,null,"Miànzi | Zài biérén miànqián pīpíng tā, huì ràng tā hěn méimiànzi.",null,"BODY162"],["7. 禁忌 (điều kiêng kỵ): 送礼的时候要注意一些禁忌，比如不能送钟。 (Tặng quà phải chú ý kiêng kỵ, như không được tặng đồng hồ.)",null,null,"Jìnjì | Sònglǐ de shíhou yào zhùyì yīxiē jìnjì, bǐrú bùnéng sòngzhōng.",null,"BODY163"],["8. 客套话 (lời khách sáo): \"改天请你吃饭\"有时候只是客套话。 (\"Hôm nào mời bạn ăn cơm\" đôi khi chỉ là lời khách sáo.)",null,null,"Kètàohuà | \"Gǎitiān qǐng nǐ chīfàn\" yǒushíhou zhǐshì kètàohuà.",null,"BODY164"],["9. 习俗 (phong tục): 春节的习俗越南和中国有很多相似的地方。 (Phong tục Tết của VN và TQ có nhiều điểm giống nhau.)",null,null,"Xísú | Chūn Jié de xísú Yuènán hé Zhōngguó yǒu hěnduō xiāngsì de dìfang.",null,"BODY165"],["10. 尊重 (tôn trọng): 了解对方的文化，是尊重的第一步。 (Hiểu văn hóa đối phương là bước đầu của sự tôn trọng.)",null,null,"Zūnzhòng | Liǎojiě duìfāng de wénhuà, shì zūnzhòng de dìyībù.",null,"BODY166"],["11. 敬酒 (mời rượu, chúc rượu): 中国的饭局上，晚辈要先给长辈敬酒。 (Trên bàn tiệc TQ, người nhỏ phải mời rượu người lớn trước.)",null,null,"Jìngjiǔ | Zhōngguó de fànjú shàng, wǎnbèi yào xiān gěi zhǎngbèi jìngjiǔ.",null,"BODY167"],["12. 守时 (đúng giờ): 中国的商务人士很守时，迟到五分钟最好提前说。 (Doanh nhân TQ rất đúng giờ, trễ 5 phút tốt nhất báo trước.)",null,null,"Shǒushí | Zhōngguó de shāngwùrénshì hěn shǒushí, chídào wǔfēnzhōng zuìhǎo tíqián shuō.",null,"BODY168"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY169-C"],["1. 在越南通常……，而在中国…… (Ở VN thường …, còn ở TQ …)",null,null,"Zài Yuènán tōngcháng……, ér zài Zhōngguó……",null,"BODY170"],["Ví dụ: 在越南通常最后喝汤，而在中国很多地方是先喝汤。 (Ở VN thường húp canh sau cùng, còn ở nhiều nơi TQ uống canh trước.)",null,null,"Zài Yuènán tōngcháng zuìhòu hētāng, ér zài Zhōngguó hěnduō dìfang shì xiān hētāng.",null,"BODY171"],["Ví dụ: 在越南通常朋友之间AA制比较多，而在中国更常见的是轮流请客。 (Ở VN bạn bè thường chia tiền, còn ở TQ phổ biến hơn là thay phiên mời.)",null,null,"Zài Yuènán tōngcháng péngyou zhījiān A Azhì bǐjiào duō, ér zài Zhōngguó gèng chángjiàn de shì lúnliú qǐngkè.",null,"BODY172"],["2. ……跟……差不多，不过…… (… với … gần giống, nhưng …)",null,null,"…… Gēn…… chàbuduō, bùguò……",null,"BODY173"],["Ví dụ: 越南的春节跟中国的差不多，不过越南人过年的时候喜欢买桃花和金橘。 (Tết VN với TQ gần giống, nhưng người Việt ngày Tết thích mua hoa đào và quất.)",null,null,"Yuènán de Chūn Jié gēn Zhōngguó de chàbuduō, bùguò Yuènánrén guònián de shíhou xǐhuan mǎi táohuā hé jīnjú.",null,"BODY174"],["Ví dụ: 越南的米粉跟广西的差不多，不过越南的汤更清淡。 (Phở/bún VN gần giống Quảng Tây, nhưng nước dùng VN thanh hơn.)",null,null,"Yuènán de mǐfěn gēn Guǎngxī de chàbuduō, bùguò Yuènán de tāng gèng qīngdàn.",null,"BODY175"],["3. 在中国，……的时候最好不要…… (Ở TQ, khi … tốt nhất đừng …)",null,null,"Zài Zhōngguó,…… de shíhou zuìhǎo bùyào……",null,"BODY176"],["Ví dụ: 在中国，送礼的时候最好不要送钟，因为\"送钟\"听起来像\"送终\"。 (Ở TQ tặng quà tốt nhất đừng tặng đồng hồ, vì \"tặng đồng hồ\" nghe như \"tiễn người chết\".)",null,null,"Zài Zhōngguó, sònglǐ de shíhou zuìhǎo bùyào sòngzhōng, yīnwèi \"sòngzhōng\" tīng qǐlái xiàng \"sòngzhōng\".",null,"BODY177"],["Ví dụ: 在越南，吃饭的时候最好不要把筷子插在饭里，因为那是给去世的人上香的样子。 (Ở VN ăn cơm đừng cắm đũa vào bát cơm, vì giống thắp hương cho người đã mất.)",null,null,"Zài Yuènán, chīfàn de shíhou zuìhǎo bùyào bǎ kuàizi chā zài fàn lǐ, yīnwèi nà shì gěi qùshì de rén shàng xiāng de yàngzi.",null,"BODY178"],["4. 我以为……，原来…… (Tôi tưởng …, hóa ra …)",null,null,"Wǒ yǐwéi……, yuánlái……",null,"BODY179"],["Ví dụ: 我以为他说\"考虑一下\"是有希望，原来是委婉地拒绝。 (Tôi tưởng anh ấy nói \"cân nhắc đã\" là có hy vọng, hóa ra là từ chối khéo.)",null,null,"Wǒ yǐwéi tā shuō \"kǎolǜyīxià\" shì yǒu xīwàng, yuánlái shì wěiwǎn de jùjué.",null,"BODY180"],["Ví dụ: 我以为他不吃是因为不喜欢，原来他是在客气。 (Tôi tưởng anh ấy không ăn vì không thích, hóa ra là đang khách sáo.)",null,null,"Wǒ yǐwéi tā bùchī shìyīnwèi bù xǐhuan, yuánlái tā shì zài kèqi.",null,"BODY181"],["5. 入乡随俗，…… (Nhập gia tùy tục, …)",null,null,"Rùxiāngsuísú,……",null,"BODY182"],["Ví dụ: 入乡随俗，在越南过马路要慢慢走，不要突然跑。 (Nhập gia tùy tục, qua đường ở VN phải đi từ từ, đừng đột nhiên chạy.)",null,null,"Rùxiāngsuísú, zài Yuènán guò mǎlù yào mànmàn zǒu, bùyào tūrán pǎo.",null,"BODY183"],["Ví dụ: 入乡随俗，去中国客户家吃饭，我也学着给长辈敬酒。 (Nhập gia tùy tục, đến nhà khách TQ ăn cơm tôi cũng học cách mời rượu người lớn.)",null,null,"Rùxiāngsuísú, qù Zhōngguó kèhù jiā chīfàn, wǒ yě xué zhe gěi zhǎngbèi jìngjiǔ.",null,"BODY184"],["6. 这在……是很正常的，不是…… (Điều này ở … là rất bình thường, không phải …)",null,null,"Zhè zài…… shì hěn zhèngcháng de, bùshì……",null,"BODY185"],["Ví dụ: 这在中国是很正常的，不是不礼貌，大家说话声音都比较大。 (Ở TQ là bình thường, không phải bất lịch sự, mọi người nói chuyện đều to.)",null,null,"Zhè zài Zhōngguó shì hěn zhèngcháng de, bùshì bù lǐmào, dàjiā shuōhuà shēngyīn dōu bǐjiào dà.",null,"BODY186"],["Ví dụ: 问年龄在越南是很正常的，不是想打听隐私，是为了知道怎么称呼对方。 (Hỏi tuổi ở VN là bình thường, không phải tò mò chuyện riêng mà để biết xưng hô thế nào.)",null,null,"Wèn niánlíng zài Yuènán shì hěn zhèngcháng de, bùshì xiǎng dǎting yǐnsī, shì wèile zhīdao zěnme chēnghu duìfāng.",null,"BODY187"],["7. 如果我说得不对，请您多包涵 (Nếu tôi nói không đúng, mong ngài bỏ qua)",null,null,"Rúguǒ wǒ shuō de bù duì, qǐng nín duō bāohán",null,"BODY188"],["Ví dụ: 我对中国的习俗了解得不多，如果我说得不对，请您多包涵。 (Tôi hiểu phong tục TQ không nhiều, nếu nói sai mong ngài bỏ qua.)",null,null,"Wǒ duì Zhōngguó de xísú liǎojiě de bù duō, rúguǒ wǒ shuō de bù duì, qǐng nín duō bāohán.",null,"BODY189"],["8. 为了避免误会，我想确认一下…… (Để tránh hiểu lầm, tôi muốn xác nhận …)",null,null,"Wèile bìmiǎn wùhuì, wǒ xiǎng quèrèn yīxià……",null,"BODY190"],["Ví dụ: 为了避免误会，我想确认一下：您说的\"再研究研究\"，是还有可能，还是这次不考虑了？ (Để tránh hiểu lầm, tôi muốn xác nhận: ngài nói \"nghiên cứu thêm\" là còn khả năng hay lần này không xét?)",null,null,"Wèile bìmiǎn wùhuì, wǒ xiǎng quèrèn yīxià: nín shuō de \"zài yánjiū yánjiū\", shì háiyǒu kěnéng, háishì zhècì bù kǎolǜ le?",null,"BODY191"],["9. (HSK5) 这其实是文化差异造成的，……并没有恶意 (Đây thực ra do khác biệt văn hóa, … không hề có ác ý)",null,null,"Zhè qíshí shì wénhuàchāyì zàochéng de,…… bìng méiyǒu èyì",null,"BODY192"],["Ví dụ: 这其实是文化差异造成的，中国经理说话直接并没有恶意，他只是想把问题快点解决。 (Đây do khác biệt văn hóa, giám đốc TQ nói thẳng không có ác ý, chỉ muốn giải quyết nhanh.)",null,null,"Zhè qíshí shì wénhuàchāyì zàochéng de, Zhōngguó jīnglǐ shuōhuà zhíjiē bìng méiyǒu èyì, tā zhǐshì xiǎng bǎ wèntí kuàidiǎn jiějué.",null,"BODY193"],["10. (HSK5) 与其要求对方改变，不如我们…… (Thay vì yêu cầu đối phương thay đổi, chi bằng chúng ta …)",null,null,"Yǔqí yāoqiú duìfāng gǎibiàn, bùrú wǒmen……",null,"BODY194"],["Ví dụ: 与其要求越南员工改变习惯，不如我们把规定写清楚，开会的时候多解释几遍。 (Thay vì bắt nhân viên Việt đổi thói quen, chi bằng viết rõ quy định, họp thì giải thích thêm vài lần.)",null,null,"Yǔqí yāoqiú Yuènán yuángōng gǎibiàn xíguàn, bùrú wǒmen bǎ guīdìng xiě qīngchu, kāihuì de shíhou duō jiěshì jǐbiàn.",null,"BODY195"],["情景对话 1 — So sánh phong tục Tết Việt – Trung với đồng nghiệp Trung Quốc (HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY196-C"],["小王: 阿明，快过年了，你们越南的春节跟我们中国的一样吗？ (A Minh, sắp Tết rồi, Tết VN có giống TQ không?)",null,null,"Xiǎo Wáng: Ā Míng, kuài guònián le, nǐmen Yuènán de Chūn Jié gēn wǒmen Zhōngguó de yīyàng ma?",null,"BODY197"],["阿明: 差不多，也是农历新年，不过有一些不一样的地方。 (Gần giống, cũng là năm mới âm lịch, nhưng có một số chỗ khác.)",null,null,"Ā Míng: chàbuduō, yě shì nónglì xīnnián, bùguò yǒu yīxiē bù yīyàng de dìfang.",null,"BODY198"],["小王: 比如呢？ (Ví dụ?)",null,null,"Xiǎo Wáng: bǐrú ne?",null,"BODY199"],["阿明: 比如中国北方过年吃饺子，我们越南吃粽子，是方形的，叫\"bánh chưng\"。 (Ví dụ miền Bắc TQ ăn sủi cảo, VN ăn bánh chưng, hình vuông.)",null,null,"Ā Míng: bǐrú Zhōngguó běifāng guònián chījiǎozi, wǒmen Yuènán chī zòngzi, shì fāngxíng de, jiào \"bánh chưng\".",null,"BODY200"],["小王: 粽子我们端午节才吃。那你们贴春联吗？ (Bánh chưng/bánh tét kiểu zongzi chúng tôi Tết Đoan Ngọ mới ăn. Thế các bạn có dán câu đối không?)",null,null,"Xiǎo Wáng: zòngzi wǒmen Duānwǔ Jié cái chī. Nà nǐmen tiē chūnlián ma?",null,"BODY201"],["阿明: 以前有，现在比较少了。越南人过年更喜欢买桃花和金橘，北方买桃花，南方买梅花。 (Trước có, giờ ít rồi. Người Việt ngày Tết thích mua hoa đào và quất, miền Bắc mua đào, miền Nam mua mai.)",null,null,"Ā Míng: yǐqián yǒu, xiànzài bǐjiào shǎo le. Yuènánrén guònián gèng xǐhuan mǎi táohuā hé jīnjú, běifāng mǎi táohuā, nánfāng mǎi méihuā.",null,"BODY202"],["小王: 有意思。红包呢？我们给小孩红包，里面放钱。 (Thú vị. Còn lì xì? Chúng tôi lì xì trẻ con, bỏ tiền trong phong bao đỏ.)",null,null,"Xiǎo Wáng: yǒuyìsi. Hóngbāo ne? Wǒmen gěi xiǎohái hóngbāo, lǐmiàn fàng qián.",null,"BODY203"],["阿明: 我们也给\"lì xì\"，不过越南的红包钱不多，主要是图个吉利。 (Chúng tôi cũng lì xì, nhưng tiền lì xì VN không nhiều, chủ yếu lấy may.)",null,null,"Ā Míng: wǒmen yě gěi \"lì xì\", bùguò Yuènán de hóngbāo qián bù duō, zhǔyào shì tú gè jílì.",null,"BODY204"],["小王: 在中国，红包越来越大，有的人过年要花好几个月的工资。 (Ở TQ lì xì ngày càng to, có người Tết tiêu mất mấy tháng lương.)",null,null,"Xiǎo Wáng: zài Zhōngguó, hóngbāo yuèláiyuè dà, yǒu de rén guònián yào huā hǎojǐgè yuè de gōngzī.",null,"BODY205"],["阿明: 哈哈，那压力太大了！还有一个习俗，越南叫\"xông đất\"，就是大年初一第一个来你家的人很重要，要选运气好的人。 (Haha, áp lực quá! Còn một phong tục, VN gọi là \"xông đất\", người đầu tiên đến nhà mùng 1 rất quan trọng, phải chọn người hợp tuổi.)",null,null,"Ā Míng: hāhā, nà yālì tài dà le! Háiyǒu yīgè xísú, Yuènán jiào \"xông đất\", jiùshì dàniánchūyī dìyīgè lái nǐjiā de rén hěn zhòngyào, yào xuǎn yùnqì hǎo de rén.",null,"BODY206"],["小王: 我们也有类似的说法，不过没有那么讲究。 (Chúng tôi cũng có cách nói tương tự, nhưng không câu nệ như vậy.)",null,null,"Xiǎo Wáng: wǒmen yě yǒu lèisì de shuōfǎ, bùguò méiyǒu nàme jiǎngjiu.",null,"BODY207"],["阿明: 今年你留在越南过年吗？要不来我家吃年夜饭吧！ (Năm nay anh ở lại VN ăn Tết à? Hay đến nhà em ăn tất niên đi!)",null,null,"Ā Míng: jīnnián nǐ liúzài Yuènán guònián ma? Yào bù lái wǒjiā chī niányèfàn ba!",null,"BODY208"],["小王: 真的吗？太好了！我去的时候带什么比较好？ (Thật à? Tuyệt quá! Lúc đến mang gì thì tốt?)",null,null,"Xiǎo Wáng: zhēnde ma? Tàihǎole! Wǒ qù de shíhou dài shénme bǐjiào hǎo?",null,"BODY209"],["阿明: 带一盒水果或者点心就可以了，千万别带太贵的东西，我爸妈会不好意思。 (Mang một hộp hoa quả hoặc bánh là được, đừng mang đồ đắt, bố mẹ em sẽ ngại.)",null,null,"Ā Míng: dài yīhé shuǐguǒ huòzhě diǎnxīn jiù kěyǐ le, qiānwànbié dài tàiguì de dōngxi, wǒ bàmā huì bùhǎoyìsi.",null,"BODY210"],["情景对话 2 — Hiểu nhầm về lời từ chối \"khéo\" của đối tác Trung Quốc (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY211-C"],["小阮: 经理，上周我们给刘总报价，他说\"我们再研究研究\"。我以为还有希望，一直在等他的消息。 (Giám đốc, tuần trước báo giá cho Lưu tổng, ông ấy nói \"chúng tôi nghiên cứu thêm\". Em tưởng còn hy vọng, cứ chờ tin ông ấy.)",null,null,"Xiǎo Ruǎn: jīnglǐ, shàngzhōu wǒmen gěi Liú zǒng bàojià, tā shuō \"wǒmen zài yánjiū yánjiū\". Wǒ yǐwéi háiyǒu xīwàng, yīzhí zài děng tā de xiāoxi.",null,"BODY212"],["经理(中国人): 已经一个星期没消息了？ (Đã một tuần không có tin à?)",null,null,"Jīnglǐ | Zhōngguórén | Yǐjīng yīgè xīngqī méi xiāoxi le?",null,"BODY213"],["小阮: 对，我给他发了两次微信，他都只回了\"好的，收到\"。 (Đúng, em nhắn WeChat 2 lần, ông ấy đều chỉ trả lời \"được, đã nhận\".)",null,null,"Xiǎo Ruǎn: duì, wǒ gěi tā fā le liǎngcì wēi xìn, tā dōu zhǐ huí le \"hǎo de, shōudào\".",null,"BODY214"],["经理: 说实话，在中国，\"再研究研究\"很多时候是一种委婉的拒绝，意思是这次可能不合作了。 (Nói thật, ở TQ \"nghiên cứu thêm\" nhiều khi là cách từ chối khéo, ý là lần này có thể không hợp tác.)",null,null,"Jīnglǐ: shuōshíhuà, zài Zhōngguó, \"zài yánjiū yánjiū\" hěnduō shíhou shì yīzhǒng wěiwǎn de jùjué, yìsi shì zhècì kěnéng bù hézuò le.",null,"BODY215"],["小阮: 啊？那他为什么不直接说？ (Hả? Vậy sao ông ấy không nói thẳng?)",null,null,"Xiǎo Ruǎn: a? Nà tā wèishénme bù zhíjiē shuō?",null,"BODY216"],["经理: 因为直接拒绝会让双方都没面子，以后不好再合作。 (Vì từ chối thẳng khiến cả hai mất mặt, sau này khó hợp tác lại.)",null,null,"Jīnglǐ: yīnwèi zhíjiē jùjué huì ràng shuāngfāng dōu méimiànzi, yǐhòu bùhǎo zài hézuò.",null,"BODY217"],["小阮: 原来是这样。在越南，我们也会委婉，但是一般会说一个具体的原因，比如\"价格有点高\"。 (Ra vậy. Ở VN chúng em cũng nói khéo, nhưng thường nêu lý do cụ thể, như \"giá hơi cao\".)",null,null,"Xiǎo Ruǎn: yuánlái shì zhèyàng. Zài Yuènán, wǒmen yě huì wěiwǎn, dànshì yībān huì shuō yīgè jùtǐ de yuányīn, bǐrú \"jiàgé yǒudiǎn gāo\".",null,"BODY218"],["经理: 对，所以你下次可以主动问。 (Đúng, nên lần sau bạn có thể chủ động hỏi.)",null,null,"Jīnglǐ: duì, suǒyǐ nǐ xiàcì kěyǐ zhǔdòng wèn.",null,"BODY219"],["小阮: 怎么问比较好，不会让他觉得我太着急？ (Hỏi thế nào thì tốt, không để ông ấy thấy em quá sốt ruột?)",null,null,"Xiǎo Ruǎn: zěnme wèn bǐjiào hǎo, bùhuì ràng tā juéde wǒ tài zháojí?",null,"BODY220"],["经理: 你可以说：\"刘总，为了避免误会，我想确认一下，我们的方案哪方面还需要调整？价格、交期还是别的？\"这样他比较容易说出真正的原因。 (Bạn có thể nói: \"Lưu tổng, để tránh hiểu lầm, tôi muốn xác nhận phương án của chúng tôi còn cần điều chỉnh mặt nào? Giá, thời gian giao hay gì khác?\" Như vậy ông ấy dễ nói ra lý do thật.)",null,null,"Jīnglǐ: nǐ kěyǐ shuō: \"Liú zǒng, wèile bìmiǎn wùhuì, wǒ xiǎng quèrèn yīxià, wǒmen de fāng'àn nǎ fāngmiàn hái xūyào tiáozhěng? Jiàgé, jiāo qī háishì biéde?\" Zhèyàng tā bǐjiào róngyì shuōchū zhēnzhèng de yuányīn.",null,"BODY221"],["小阮: 好，我今天就给他打电话，而不是发微信。 (Được, hôm nay em gọi điện thay vì nhắn WeChat.)",null,null,"Xiǎo Ruǎn: hǎo, wǒ jīntiān jiù gěi tā dǎdiànhuà, ér bùshì fā wēi xìn.",null,"BODY222"],["小阮: (gọi điện) 刘总，打扰您了。为了避免误会，我想确认一下，我们上次的方案，您觉得哪方面还需要调整？ (Lưu tổng, làm phiền ngài. Để tránh hiểu lầm, tôi muốn xác nhận phương án lần trước, ngài thấy mặt nào còn cần điều chỉnh?)",null,null,"Xiǎo Ruǎn: Liú zǒng, dǎrǎo nín le. Wèile bìmiǎn wùhuì, wǒ xiǎng quèrèn yīxià, wǒmen shàngcì de fāng'àn, nín juéde nǎ fāngmiàn hái xūyào tiáozhěng?",null,"BODY223"],["刘总: 小阮啊，说实话，你们的质量我们很满意，就是付款方式我们老板不太接受。 (Tiểu Nguyễn à, nói thật chất lượng chúng tôi rất hài lòng, chỉ là phương thức thanh toán sếp tôi không chấp nhận lắm.)",null,null,"Liú zǒng: Xiǎo Ruǎn a, shuōshíhuà, nǐmen de zhìliàng wǒmen hěn mǎnyì, jiùshì fùkuǎn fāngshì wǒmen lǎobǎn bù tài jiēshòu.",null,"BODY224"],["小阮: 谢谢您告诉我。付款方式我们可以再商量，我明天带新的方案去拜访您，可以吗？ (Cảm ơn ngài cho biết. Thanh toán chúng tôi có thể bàn lại, mai tôi mang phương án mới đến thăm ngài được không?)",null,null,"Xiǎo Ruǎn: xièxienín gàosu wǒ. Fùkuǎn fāngshì wǒmen kěyǐ zài shāngliang, wǒ míngtiān dài xīn de fāng'àn qù bàifǎng nín, kěyǐ ma?",null,"BODY225"],["刘总: 好啊，明天下午见。 (Được, chiều mai gặp.)",null,null,"Liú zǒng: hǎo a, míngtiān xiàwǔ jiàn.",null,"BODY226"],["情景对话 3 — Văn hóa bàn tiệc: mời rượu, tranh trả tiền, gắp thức ăn",null,null,"Qíngjǐng duìhuà",null,"BODY227-C"],["王总: 来，小阮，坐这儿。今天我请客，大家别客气！ (Nào, Tiểu Nguyễn, ngồi đây. Hôm nay tôi mời, mọi người đừng khách sáo!)",null,null,"Wáng zǒng: lái, Xiǎo Ruǎn, zuò zhèr. Jīntiān wǒ qǐngkè, dàjiā bié kèqi!",null,"BODY228"],["小阮: 谢谢王总！我先敬您一杯，感谢您一直以来的支持。 (Cảm ơn Vương tổng! Em mời ngài một ly trước, cảm ơn ngài luôn ủng hộ.)",null,null,"Xiǎo Ruǎn: xièxie Wáng zǒng! Wǒ xiān jìng nín yībēi, gǎnxiènín yīzhí yǐlái de zhīchí.",null,"BODY229"],["王总: 好！干杯！你的酒杯怎么比我的高？ (Được! Cạn ly! Sao ly của em cao hơn ly tôi?)",null,null,"Wáng zǒng: hǎo! Gānbēi! Nǐ de jiǔbēi zěnme bǐ wǒ de gāo?",null,"BODY230"],["小阮: 啊，不好意思，我不知道这个规矩。 (Ôi, xin lỗi, em không biết quy tắc này.)",null,null,"Xiǎo Ruǎn: a, bùhǎoyìsi, wǒ bù zhīdao zhège guījǔ.",null,"BODY231"],["王总: 哈哈，没事。在中国，晚辈给长辈敬酒的时候，杯子要放得比长辈低一点，表示尊重。 (Haha, không sao. Ở TQ, người nhỏ mời rượu người lớn, ly phải để thấp hơn chút để thể hiện tôn trọng.)",null,null,"Wáng zǒng: hāhā, méishì. Zài Zhōngguó, wǎnbèi gěi zhǎngbèi jìngjiǔ de shíhou, bēizi yào fàng de bǐ zhǎngbèi dī yīdiǎn, biǎoshì zūnzhòng.",null,"BODY232"],["小阮: 原来是这样，学到了！在越南，我们喝酒的时候大家一起喊\"một, hai, ba, dô\"。 (Ra vậy, học được rồi! Ở VN uống rượu mọi người cùng hô \"một, hai, ba, dô\".)",null,null,"Xiǎo Ruǎn: yuánlái shì zhèyàng, xuédào le! Zài Yuènán, wǒmen hējiǔ de shíhou dàjiā yīqǐ hǎn \"một, hai, ba, dô\".",null,"BODY233"],["王总: 哈哈，这个好玩！来，我们也试试，一、二、三，dô！ (Haha, cái này vui! Nào, mình cũng thử, một, hai, ba, dô!)",null,null,"Wáng zǒng: hāhā, zhège hǎowán! Lái, wǒmen yě shìshi, yī, èr, sān, dô!",null,"BODY234"],["王总: (gắp thức ăn) 来，尝尝这个鱼，这是这家店的招牌菜。 (Nào, nếm cá này, món đặc trưng của quán.)",null,null,"Wáng zǒng: lái, chángchang zhège yú, zhè shì zhèjiā diàn de zhāopáicài.",null,"BODY235"],["小阮: 谢谢王总，您也吃。 (Cảm ơn Vương tổng, ngài cũng ăn ạ.)",null,null,"Xiǎo Ruǎn: xièxie Wáng zǒng, nín yě chī.",null,"BODY236"],["王总: 你们越南人吃饭也给别人夹菜吗？ (Người Việt ăn cơm cũng gắp thức ăn cho người khác à?)",null,null,"Wáng zǒng: nǐmen Yuènánrén chīfàn yě gěi biérén jiācài ma?",null,"BODY237"],["小阮: 会的，特别是给长辈和客人夹，跟中国差不多。 (Có ạ, nhất là gắp cho người lớn và khách, gần giống TQ.)",null,null,"Xiǎo Ruǎn: huì de, tèbié shì gěi zhǎngbèi hé kèrén jiā, gēn Zhōngguó chàbuduō.",null,"BODY238"],["小阮: (cuối bữa, lén đi trả tiền) 服务员，买单。 (Bạn ơi, tính tiền.)",null,null,"Xiǎo Ruǎn: fúwùyuán, mǎidān.",null,"BODY239"],["王总: 小阮！说好了我请客，你怎么偷偷去买单了？ (Tiểu Nguyễn! Đã nói tôi mời, sao em lén đi trả tiền?)",null,null,"Wáng zǒng: Xiǎo Ruǎn! Shuōhǎo le wǒ qǐngkè, nǐ zěnme tōutōu qù mǎidān le?",null,"BODY240"],["小阮: 王总，您是客人，来越南就应该我们请。 (Vương tổng, ngài là khách, đến VN thì phải để chúng em mời.)",null,null,"Xiǎo Ruǎn: Wáng zǒng, nín shì kèrén, lái Yuènán jiù yīnggāi wǒmen qǐng.",null,"BODY241"],["王总: 那这样，这次你请，下次你来中国，一定我请，不许跟我抢！ (Vậy thế này, lần này em mời, lần sau em sang TQ nhất định tôi mời, không được tranh với tôi!)",null,null,"Wáng zǒng: nà zhèyàng, zhècì nǐ qǐng, xiàcì nǐ lái Zhōngguó, yīdìng wǒ qǐng, bùxǔ gēn wǒ qiǎng!",null,"BODY242"],["小阮: 一言为定！ (Nói là làm!)",null,null,"Xiǎo Ruǎn: yīyánwéidìng!",null,"BODY243"],["情景对话 4 — Quản lý Trung Quốc mới sang VN: khác biệt văn hóa công sở (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY244-C"],["李经理: 阿玲，我来越南一个月了，有几件事想请教你。 (A Linh, tôi sang VN một tháng rồi, có vài việc muốn hỏi bạn.)",null,null,"Lǐ jīnglǐ: Ā Líng, wǒ lái Yuènán yīgèyuè le, yǒu jǐjiànshì xiǎng qǐngjiào nǐ.",null,"BODY245"],["阿玲: 李经理您说。 (Giám đốc Lý cứ nói.)",null,null,"Ā Líng: Lǐ jīnglǐ nín shuō.",null,"BODY246"],["李经理: 第一，为什么我在会上问\"大家有没有问题\"，大家都不说话，可是会后又有很多人私下来问我？ (Một, sao trong họp tôi hỏi \"mọi người có câu hỏi không\", ai cũng im, nhưng họp xong nhiều người lại hỏi riêng tôi?)",null,null,"Lǐ jīnglǐ: dìyī, wèishénme wǒ zài huìshàng wèn \"dàjiā yǒuméiyǒu wèntí\", dàjiā dōu bù shuōhuà, kěshì huìhòu yòu yǒu hěnduō rén sīxià lái wèn wǒ?",null,"BODY247"],["阿玲: 这在越南是很正常的。很多越南员工觉得在会上当着大家的面提问，好像是在挑战领导，或者怕问的问题太简单被笑话。 (Ở VN là bình thường. Nhiều nhân viên Việt thấy hỏi trước mặt mọi người như thách thức lãnh đạo, hoặc sợ hỏi câu đơn giản bị cười.)",null,null,"Ā Líng: zhè zài Yuènán shì hěn zhèngcháng de. Hěnduō Yuènán yuángōng juéde zài huìshàng dāngzhe dàjiā de miàn tíwèn, hǎoxiàng shì zài tiǎozhàn lǐngdǎo, huòzhě pà wèn de wèntí tài jiǎndān bèi xiàohua.",null,"BODY248"],["李经理: 原来是这样。那我怎么做比较好？ (Ra vậy. Vậy tôi làm thế nào thì tốt?)",null,null,"Lǐ jīnglǐ: yuánlái shì zhèyàng. Nà wǒ zěnme zuò bǐjiào hǎo?",null,"BODY249"],["阿玲: 您可以开完会以后，在群里说\"有问题可以私下发消息给我\"，或者开会的时候直接点名问某个人的意见。 (Ngài có thể sau họp nhắn trong nhóm \"có câu hỏi có thể nhắn riêng tôi\", hoặc khi họp gọi tên hỏi ý kiến từng người.)",null,null,"Ā Líng: nín kěyǐ kāi wán huì yǐhòu, zài qún lǐ shuō \"yǒu wèntí kěyǐ sīxià fāxiāoxi gěi wǒ\", huòzhě kāihuì de shíhou zhíjiē diǎnmíng wèn mǒugè rén de yìjiàn.",null,"BODY250"],["李经理: 好主意。第二，我说话比较直接，上周我说一个员工的报告\"写得不行\"，第二天他就请假了。 (Ý hay. Hai, tôi nói khá thẳng, tuần trước tôi nói báo cáo của một nhân viên \"viết không được\", hôm sau cậu ấy xin nghỉ.)",null,null,"Lǐ jīnglǐ: hǎo zhǔyì. Dì'èr, wǒ shuōhuà bǐjiào zhíjiē, shàngzhōu wǒ shuō yīgè yuángōng de bàogào \"xiě de bùxíng\", dì'èrtiān tā jiù qǐngjià le.",null,"BODY251"],["阿玲: 这其实是文化差异造成的。您说话直接并没有恶意，但是越南人比较重视面子，特别是在别人面前被批评，会很难受。 (Đây thực ra do khác biệt văn hóa. Ngài nói thẳng không có ác ý, nhưng người Việt khá trọng thể diện, nhất là bị phê bình trước mặt người khác sẽ rất khó chịu.)",null,null,"Ā Líng: zhè qíshí shì wénhuàchāyì zàochéng de. Nín shuōhuà zhíjiē bìng méiyǒu èyì, dànshì Yuènánrén bǐjiào zhòngshì miànzi, tèbiéshìzài biérén miànqián bèi pīpíng, huì hěn nánshòu.",null,"BODY252"],["李经理: 那我应该怎么说？ (Vậy tôi nên nói thế nào?)",null,null,"Lǐ jīnglǐ: nà wǒ yīnggāi zěnme shuō?",null,"BODY253"],["阿玲: 可以先说优点，再说需要改进的地方。比如：\"你的报告结构很清楚，数据部分如果再详细一点就更好了。\"而且最好私下说。 (Có thể nói ưu điểm trước, rồi điểm cần cải thiện. Ví dụ: \"Báo cáo của bạn bố cục rất rõ, phần số liệu chi tiết thêm chút thì tốt hơn.\" Và tốt nhất nói riêng.)",null,null,"Ā Líng: kěyǐ xiān shuō yōudiǎn, zàishuō xūyào gǎijìn de dìfang. Bǐrú: \"nǐ de bàogào jiégòu hěn qīngchu, shùjù bùfen rúguǒ zài xiángxì yīdiǎn jiù gènghǎo le.\" Érqiě zuìhǎo sīxià shuō.",null,"BODY254"],["李经理: 明白了。第三，为什么中午大家都要睡午觉？在我们公司总部，中午只休息一个小时。 (Hiểu rồi. Ba, sao buổi trưa ai cũng ngủ trưa? Ở tổng bộ chúng tôi trưa chỉ nghỉ một tiếng.)",null,null,"Lǐ jīnglǐ: míngbai le. Dìsān, wèishénme zhōngwǔ dàjiā dōu yào shuìwǔjiào? Zài wǒmen gōngsīzǒngbù, zhōngwǔ zhǐ xiūxi yīgè xiǎoshí.",null,"BODY255"],["阿玲: 越南天气热，很多人习惯中午睡二十分钟，下午效率会更高。入乡随俗，您也可以试试！ (VN trời nóng, nhiều người quen ngủ trưa 20 phút, chiều làm hiệu quả hơn. Nhập gia tùy tục, ngài cũng thử xem!)",null,null,"Ā Líng: Yuènán tiānqì rè, hěnduō rén xíguàn zhōng wǔshuì èrshífēnzhōng, xiàwǔ xiàolǜ huì gèng gāo. Rùxiāngsuísú, nín yě kěyǐ shìshi!",null,"BODY256"],["李经理: 哈哈，我已经开始试了，确实下午精神好多了。谢谢你，阿玲，这些对我帮助很大。 (Haha, tôi đã bắt đầu thử, đúng là chiều tỉnh táo hơn nhiều. Cảm ơn A Linh, những điều này giúp tôi rất nhiều.)",null,null,"Lǐ jīnglǐ: hāhā, wǒ yǐjīng kāishǐ shì le, quèshí xiàwǔ jīngshén hǎoduō le. Xièxie nǐ, Ā Líng, zhèxiē duì wǒ bāngzhù hěndà.",null,"BODY257"],["情景对话 5 — (HSK5) Hiểu nhầm văn hóa doanh nghiệp: chuyên gia TQ cho rằng công nhân Việt \"không đúng giờ, không nghe lời\"",null,null,"Qíngjǐng duìhuà",null,"BODY258-C"],["张工程师: 阮主管，我必须跟你反映一个问题。你们的工人太不守时了，说好八点开始培训，八点十分人才到齐。 (Trưởng ca Nguyễn, tôi phải phản ánh một vấn đề. Công nhân các anh quá không đúng giờ, hẹn 8h đào tạo, 8h10 mới đủ người.)",null,null,"Zhāng gōngchéngshī: Ruǎn zhǔguǎn, wǒ bìxū gēn nǐ fǎnyìng yīgè wèntí. Nǐmen de gōngrén tài bù shǒushí le, shuōhǎo bādiǎn kāishǐ péixùn, bādiǎn shífēn réncái dào qí.",null,"BODY259"],["阮主管: 张工，非常抱歉，这个问题我们一定改进。我想先了解一下，迟到的主要是哪些人？ (Kỹ sư Trương, rất xin lỗi, vấn đề này chúng tôi nhất định cải thiện. Tôi muốn tìm hiểu trước, người đến muộn chủ yếu là ai?)",null,null,"Ruǎn zhǔguǎn: zhāng gōng, fēicháng bàoqiàn, zhège wèntí wǒmen yīdìng gǎijìn. Wǒ xiǎng xiān liǎojiě yīxià, chídào de zhǔyào shì nǎxiē rén?",null,"BODY260"],["张工程师: 大部分是夜班刚下班的工人。 (Phần lớn là công nhân vừa tan ca đêm.)",null,null,"Zhāng gōngchéngshī: dàbùfen shì yèbān gāng xiàbān de gōngrén.",null,"BODY261"],["阮主管: 原来是这样。夜班七点半下班，他们要先去吃早饭，所以来晚了。这不是态度问题，是我们的时间安排有问题。 (Ra vậy. Ca đêm 7h30 tan, họ phải đi ăn sáng trước nên đến muộn. Đây không phải vấn đề thái độ mà là sắp xếp thời gian của chúng ta có vấn đề.)",null,null,"Ruǎn zhǔguǎn: yuánlái shì zhèyàng. Yèbān qīdiǎn bàn xiàbān, tāmen yào xiān qù chī zǎofàn, suǒyǐ lái wǎn le. Zhè bùshì tàidù wèntí, shì wǒmen de shíjiān ānpái yǒu wèntí.",null,"BODY262"],["张工程师: 还有，我教他们新的操作方法，他们都点头说\"是是是\"，可是第二天还是按老方法做。 (Còn nữa, tôi dạy cách thao tác mới, họ đều gật đầu \"vâng vâng vâng\", nhưng hôm sau vẫn làm theo cách cũ.)",null,null,"Zhāng gōngchéngshī: háiyǒu, wǒ jiào tāmen xīn de cāozuòfāngfǎ, tāmen dōu diǎntóu shuō \"shì shì shì\", kěshì dì'èrtiān háishì àn lǎo fāngfǎ zuò.",null,"BODY263"],["阮主管: 这其实是文化差异造成的。在越南，工人点头说\"是\"，很多时候只是表示\"我在听\"，不一定是\"我听懂了\"或者\"我同意\"。他们不好意思当面说自己没听懂。 (Đây do khác biệt văn hóa. Ở VN công nhân gật đầu nói \"vâng\" nhiều khi chỉ có nghĩa \"tôi đang nghe\", chưa chắc là \"tôi hiểu\" hay \"tôi đồng ý\". Họ ngại nói thẳng mình chưa hiểu.)",null,null,"Ruǎn zhǔguǎn: zhè qíshí shì wénhuàchāyì zàochéng de. Zài Yuènán, gōngrén diǎntóu shuō \"shì\", hěnduō shíhou zhǐshì biǎoshì \"wǒ zài tīng\", bù yīdìng shì \"wǒ tīngdǒng le\" huòzhě \"wǒ tóngyì\". Tāmen bùhǎoyìsi dāngmiàn shuō zìjǐ méi tīngdǒng.",null,"BODY264"],["张工程师: 原来是这样！我还以为他们不尊重我。 (Ra vậy! Tôi còn tưởng họ không tôn trọng tôi.)",null,null,"Zhāng gōngchéngshī: yuánlái shì zhèyàng! Wǒ hái yǐwéi tāmen bù zūnzhòng wǒ.",null,"BODY265"],["阮主管: 他们其实很尊重您，正是因为尊重，才不好意思说\"没听懂\"。 (Thực ra họ rất tôn trọng ngài, chính vì tôn trọng nên mới ngại nói \"chưa hiểu\".)",null,null,"Ruǎn zhǔguǎn: tāmen qíshí hěn zūnzhòng nín, zhèngshì yīnwèi zūnzhòng, cái bùhǎoyìsi shuō \"méi tīngdǒng\".",null,"BODY266"],["张工程师: 那我应该怎么做？ (Vậy tôi nên làm thế nào?)",null,null,"Zhāng gōngchéngshī: nà wǒ yīnggāi zěnme zuò?",null,"BODY267"],["阮主管: 与其要求工人改变习惯，不如我们改一下培训的方法：第一，培训时间改到九点，让夜班的工人先吃饭；第二，讲完以后不要问\"懂了吗\"，而是请一两个工人上来做一遍给大家看；第三，我们把操作步骤翻译成越南语，贴在机器旁边。 (Thay vì bắt công nhân đổi thói quen, chi bằng đổi cách đào tạo: một, dời giờ đào tạo sang 9h để ca đêm ăn sáng trước; hai, giảng xong đừng hỏi \"hiểu chưa\" mà mời 1–2 công nhân lên làm thử cho mọi người xem; ba, dịch các bước thao tác sang tiếng Việt, dán cạnh máy.)",null,null,"Ruǎn zhǔguǎn: yǔqí yāoqiú gōngrén gǎibiàn xíguàn, bùrú wǒmen gǎi yīxià péixùn de fāngfǎ: dìyī, péixùn shíjiān gǎi dào jiǔdiǎn, ràng yèbān de gōngrén xiān chīfàn; dì'èr, jiǎngwán yǐhòu bùyào wèn \"dǒng le ma\", érshì qǐng yīliǎnggè gōngrén shànglái zuò yībiàn gěi dàjiā kàn; dìsān, wǒmen bǎ cāozuòbùzhòu fānyìchéng Yuènányǔ, tiē zài jīqì pángbiān.",null,"BODY268"],["张工程师: 这三个办法都很好。特别是让工人做一遍，这样我马上就知道他们有没有真的学会。 (Ba cách đều rất hay. Nhất là cho công nhân làm thử, như vậy tôi biết ngay họ có thật sự học được không.)",null,null,"Zhāng gōngchéngshī: zhè sāngè bànfǎ dōu hěn hǎo. Tèbié shì ràng gōngrén zuò yībiàn, zhèyàng wǒ mǎshàng jiù zhīdao tāmen yǒuméiyǒu zhēnde xuéhuì.",null,"BODY269"],["阮主管: 另外，如果您方便的话，培训的时候可以多夸一夸做得好的工人，越南工人受到表扬会特别有动力。 (Ngoài ra, nếu tiện, khi đào tạo ngài có thể khen những công nhân làm tốt, công nhân Việt được khen sẽ rất có động lực.)",null,null,"Ruǎn zhǔguǎn: lìngwài, rúguǒ nín fāngbiàn dehuà, péixùn de shíhou kěyǐ duō kuāyīkuā zuòdehǎo de gōngrén, Yuènán gōngrén shòudào biǎoyáng huì tèbié yǒu dònglì.",null,"BODY270"],["张工程师: 好，我试试。今天跟你聊完，我对越南的工人了解多了。 (Được, tôi thử. Nói chuyện với anh hôm nay, tôi hiểu công nhân Việt hơn nhiều.)",null,null,"Zhāng gōngchéngshī: hǎo, wǒ shìshi. Jīntiān gēn nǐ liáo wán, wǒ duì Yuènán de gōngrén liǎojiě duō le.",null,"BODY271"],["阮主管: 我也学到了很多。以后有什么不明白的地方，随时找我。 (Tôi cũng học được nhiều. Sau này có gì chưa rõ cứ tìm tôi.)",null,null,"Ruǎn zhǔguǎn: wǒ yě xuédào le hěnduō. Yǐhòu yǒu shénme bù míngbai de dìfang, suíshí zhǎo wǒ.",null,"BODY272"],["情景对话 6 — Quà tặng và kiêng kỵ: chuẩn bị quà cho khách Trung Quốc",null,null,"Qíngjǐng duìhuà",null,"BODY273-C"],["小芳: 阿玲，下周中国客户来访，经理让我准备礼物，送什么比较好？ (A Linh, tuần sau khách TQ đến thăm, giám đốc bảo mình chuẩn bị quà, tặng gì thì hay?)",null,null,"Xiǎo Fāng: Ā Líng, xiàzhōu Zhōngguó kèhù láifǎng, jīnglǐ ràng wǒ zhǔnbèi lǐwù, sòng shénme bǐjiào hǎo?",null,"BODY274"],["阿玲: 送有越南特色的东西吧，比如越南咖啡、腰果，或者手工的漆画。 (Tặng đồ đặc trưng VN, như cà phê VN, hạt điều, hoặc tranh sơn mài thủ công.)",null,null,"Ā Líng: sòng yǒu Yuènán tèsè de dōngxi ba, bǐrú Yuènán kāfēi, yāoguǒ, huòzhě shǒugōng de qīhuà.",null,"BODY275"],["小芳: 我本来想送一块手表，质量很好的那种。 (Mình định tặng một chiếc đồng hồ đeo tay, loại chất lượng tốt.)",null,null,"Xiǎo Fāng: wǒ běnlái xiǎng sòng yīkuài shǒubiǎo, zhìliàng hěn hǎo de nàzhǒng.",null,"BODY276"],["阿玲: 手表还可以，但是千万不要送挂钟或者座钟，在中国\"送钟\"听起来像\"送终\"，很不吉利。 (Đồng hồ đeo tay thì tạm được, nhưng tuyệt đối đừng tặng đồng hồ treo tường hay để bàn, ở TQ \"tặng đồng hồ\" nghe như \"tiễn người chết\", rất xui.)",null,null,"Ā Líng: shǒubiǎo hái kěyǐ, dànshì qiānwàn bùyào sòng guàzhōng huòzhě zuòzhōng, zài Zhōngguó \"sòngzhōng\" tīng qǐlái xiàng \"sòngzhōng\", hěn bù jílì.",null,"BODY277"],["小芳: 幸亏你提醒我！还有别的禁忌吗？ (May mà bạn nhắc! Còn kiêng kỵ gì khác không?)",null,null,"Xiǎo Fāng: xìngkuī nǐ tíxǐng wǒ! Háiyǒu biéde jìnjì ma?",null,"BODY278"],["阿玲: 不要送伞，因为\"伞\"跟\"散\"同音；也不要送梨，\"梨\"跟\"离\"同音。数字方面，中国人喜欢八和六，不喜欢四。 (Đừng tặng ô vì \"ô\" đồng âm với \"tan\"; cũng đừng tặng lê, \"lê\" đồng âm với \"ly\". Về con số, người TQ thích 8 và 6, không thích 4.)",null,null,"Ā Líng: bùyào sòng sǎn, yīnwèi \"sǎn\" gēn \"sàn\" tóngyīn; yě bùyào sòng lí, \"lí\" gēn \"lí\" tóngyīn. Shùzì fāngmiàn, Zhōngguórén xǐhuan bā hé liù, bù xǐhuan sì.",null,"BODY279"],["小芳: 越南人也不太喜欢四！那包装呢？ (Người Việt cũng không thích số 4 lắm! Còn gói quà?)",null,null,"Xiǎo Fāng: Yuènánrén yě bù tài xǐhuan sì! Nà bāozhuāng ne?",null,"BODY280"],["阿玲: 用红色或者金色的包装纸，不要用白色或者黑色。 (Dùng giấy gói màu đỏ hoặc vàng, đừng dùng trắng hoặc đen.)",null,null,"Ā Líng: yòng hóngsè huòzhě jīnsè de bāozhuāngzhǐ, bùyào yòng báisè huòzhě hēisè.",null,"BODY281"],["小芳: 送礼物的时候要注意什么？ (Khi tặng quà cần chú ý gì?)",null,null,"Xiǎo Fāng: sònglǐwù de shíhou yào zhùyì shénme?",null,"BODY282"],["阿玲: 用两只手送，说\"一点小心意，请您收下\"。中国客户可能会先推辞一两次，这是客气，你再坚持一下就好了。 (Đưa bằng hai tay, nói \"chút lòng thành, mong ngài nhận cho\". Khách TQ có thể từ chối 1–2 lần, đó là khách sáo, bạn nài thêm chút là được.)",null,null,"Ā Líng: yòng liǎngzhīshǒu sòng, shuō \"yīdiǎn xiǎo xīnyì, qǐng nín shōuxià\". Zhōngguó
