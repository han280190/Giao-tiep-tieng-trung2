shì shénme huì?",null,"BODY197"],["Đáp: 我们每天早上有十五分钟的晨会，每周五下午有部门周会，每个月还有一次经营会议。 (Mỗi sáng họp đầu ngày 15 phút, chiều thứ 6 họp tuần, mỗi tháng còn một cuộc họp kinh doanh.)",null,null,"Wǒmen měitiān zǎoshang yǒu shíwǔfēnzhōng de chénhuì, měizhōuwǔ xiàwǔ yǒu bùmén zhōu huì, měigè yuè háiyǒu yīcì jīngyíng huìyì.",null,"BODY198"],["2. Hỏi: 你觉得什么样的会议是浪费时间？ (Bạn thấy cuộc họp như thế nào là lãng phí thời gian?)",null,null,"Nǐ juéde shénmeyàng de huìyì shì làngfèishíjiān?",null,"BODY199"],["Đáp: 没有议程、讨论半天也没有结论的会议最浪费时间。 (Cuộc họp không có chương trình, bàn mãi không ra kết luận là lãng phí nhất.)",null,null,"Méiyǒu yìchéng, tǎolùn bàntiān yě méiyǒu jiélùn de huìyì zuì làngfèishíjiān.",null,"BODY200"],["3. Hỏi: 你开会的时候敢发言吗？ (Lúc họp bạn có dám phát biểu không?)",null,null,"Nǐ kāihuì de shíhou gǎn fāyán ma?",null,"BODY201"],["Đáp: 用越南语可以，用中文还有点紧张，怕说错了大家听不懂。 (Bằng tiếng Việt thì được, bằng tiếng Trung vẫn hơi run, sợ nói sai mọi người không hiểu.)",null,null,"Yòng Yuènányǔ kěyǐ, yòng Zhōngwén hái yǒudiǎn jǐnzhāng, pà shuōcuò le dàjiā tīngbùdǒng.",null,"BODY202"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY203-C"],["1. 议程 (chương trình họp): 今天会议的议程有三项。 (Chương trình họp hôm nay có 3 mục.)",null,null,"Yìchéng | Jīntiān huìyì de yìchéng yǒu sānxiàng.",null,"BODY204"],["2. 讨论 (thảo luận): 我们先讨论第一个问题：下个月的销售目标。 (Trước tiên thảo luận vấn đề thứ nhất: mục tiêu doanh số tháng sau.)",null,null,"Tǎolùn | Wǒmen xiān tǎolùn dìyīgè wèntí: xiàgèyuè de xiāoshòu mùbiāo.",null,"BODY205"],["3. 重点 (trọng điểm): 我重点说一下遇到的两个问题。 (Tôi nói trọng tâm về 2 vấn đề gặp phải.)",null,null,"Zhòngdiǎn | Wǒ zhòngdiǎn shuō yīxià yùdào de liǎnggè wèntí.",null,"BODY206"],["4. 补充 (bổ sung): 我想补充一点关于成本的情况。 (Tôi muốn bổ sung một điểm về tình hình chi phí.)",null,null,"Bǔchōng | Wǒ xiǎng bǔchōng yīdiǎn guānyú chéngběn de qíngkuàng.",null,"BODY207"],["5. 进展 (tiến triển): 新项目的进展比预期快。 (Dự án mới tiến triển nhanh hơn dự kiến.)",null,null,"Jìnzhǎn | Xīn xiàngmù de jìnzhǎn bǐ yùqī kuài.",null,"BODY208"],["6. 风险 (rủi ro): 这个计划最大的风险是原材料涨价。 (Rủi ro lớn nhất của kế hoạch này là nguyên liệu tăng giá.)",null,null,"Fēngxiǎn | Zhège jìhuà zuìdà de fēngxiǎn shì yuáncáiliào zhǎngjià.",null,"BODY209"],["7. 达成一致 (đạt được thống nhất): 经过讨论，大家达成了一致。 (Sau thảo luận, mọi người đã thống nhất.)",null,null,"Dáchéng yīzhì | Jīngguò tǎolùn, dàjiā dáchéng le yīzhì.",null,"BODY210"],["8. 汇报 (báo cáo lên cấp trên): 下面由我来汇报一下本月的工作。 (Sau đây tôi xin báo cáo công việc tháng này.)",null,null,"Huìbào | Xiàmiàn yóu wǒ lái huìbào yīxià běnyuè de gōngzuò.",null,"BODY211"],["9. 完成率 / 同比 / 环比 (tỷ lệ hoàn thành / so với cùng kỳ / so với kỳ trước): 销售额同比增长了百分之十五。 (Doanh số tăng 15% so với cùng kỳ năm ngoái.)",null,null,"Wánchénglǜ | Tóngbǐ | Huánbǐ | Xiāoshòu'é tóngbǐ zēngzhǎng le bǎifēnzhīshíwǔ.",null,"BODY212"],["10. 会议纪要 (biên bản họp): 会后我会把会议纪要发给大家。 (Họp xong tôi sẽ gửi biên bản cho mọi người.)",null,null,"Huìyìjìyào | Huìhòu wǒhuì bǎ huìyìjìyào fāgěi dàjiā.",null,"BODY213"],["11. 跑题 (lạc đề): 我们有点跑题了，先回到议程上来。 (Chúng ta hơi lạc đề rồi, quay lại chương trình họp.)",null,null,"Pǎotí | Wǒmen yǒudiǎn pǎotí le, xiānhuídào yìchéng shànglái.",null,"BODY214"],["12. 落实 (triển khai thực hiện): 会上决定的事情，下周一之前要落实。 (Việc quyết định trong họp phải triển khai trước thứ 2 tuần sau.)",null,null,"Luòshí | Huìshàng juédìng de shìqing, xiàzhōuyī zhīqián yào luòshí.",null,"BODY215"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY216-C"],["1. 我先汇报一下…… (Tôi xin báo cáo trước về …)",null,null,"Wǒ xiān huìbào yīxià……",null,"BODY217"],["Ví dụ: 我先汇报一下十月份的销售情况。 (Tôi xin báo cáo trước về tình hình bán hàng tháng 10.)",null,null,"Wǒ xiān huìbào yīxià shíyuèfèn de xiāoshòu qíngkuàng.",null,"BODY218"],["Ví dụ: 我先汇报一下新工厂的建设进展。 (Tôi xin báo cáo trước tiến độ xây dựng nhà máy mới.)",null,null,"Wǒ xiān huìbào yīxià xīn gōngchǎng de jiànshè jìnzhǎn.",null,"BODY219"],["2. 我想补充一点：…… (Tôi muốn bổ sung một điểm: …)",null,null,"Wǒ xiǎng bǔchōng yīdiǎn:……",null,"BODY220"],["Ví dụ: 我想补充一点：客户上周又追加了两千件订单。 (Tôi xin bổ sung: khách tuần trước đặt thêm 2.000 cái.)",null,null,"Wǒ xiǎng bǔchōng yīdiǎn: kèhù shàngzhōu yòu zhuījiā le liǎngqiān jiàn dìngdān.",null,"BODY221"],["Ví dụ: 我想补充一点：如果要加班的话，人事部需要提前三天申请。 (Tôi xin bổ sung: nếu tăng ca thì phòng nhân sự cần xin trước 3 ngày.)",null,null,"Wǒ xiǎng bǔchōng yīdiǎn: rúguǒ yào jiābān dehuà, rénshìbù xūyào tíqián sāntiān shēnqǐng.",null,"BODY222"],["3. 本月完成了……，完成率是…… (Tháng này hoàn thành …, tỷ lệ hoàn thành là …)",null,null,"Běnyuè wánchéng le……, wánchénglǜ shì……",null,"BODY223"],["Ví dụ: 本月完成了销售额八十亿盾，完成率是百分之一百零五。 (Tháng này doanh số đạt 8 tỷ, hoàn thành 105% chỉ tiêu.)",null,null,"Běnyuè wánchéng le xiāoshòu'é bāshí yì dùn, wánchénglǜ shì bǎifēnzhī yībǎilíngwǔ.",null,"BODY224"],["Ví dụ: 本月完成了十二个新客户的开发，完成率是百分之八十。 (Tháng này phát triển được 12 khách mới, đạt 80% chỉ tiêu.)",null,null,"Běnyuè wánchéng le shí'èrgè xīn kèhù de kāifā, wánchénglǜ shì bǎifēnzhībāshí.",null,"BODY225"],["4. 目前遇到的主要问题是……，原因是…… (Vấn đề chính hiện nay là …, nguyên nhân là …)",null,null,"Mùqián yùdào de zhǔyào wèntí shì……, yuányīn shì……",null,"BODY226"],["Ví dụ: 目前遇到的主要问题是交期延误，原因是一家供应商产能不足。 (Vấn đề chính hiện nay là giao hàng trễ, nguyên nhân là một NCC thiếu công suất.)",null,null,"Mùqián yùdào de zhǔyào wèntí shì jiāo qī yánwù, yuányīn shì yījiā gōngyìngshāng chǎnnéng bùzú.",null,"BODY227"],["Ví dụ: 目前遇到的主要问题是新员工流失率高，原因是工资比同行低。 (Vấn đề chính là tỷ lệ nghỉ việc của nhân viên mới cao, nguyên nhân là lương thấp hơn các công ty cùng ngành.)",null,null,"Mùqián yùdào de zhǔyào wèntí shì xīn yuángōng liúshīlǜ gāo, yuányīn shì gōngzī bǐ tóngháng dī.",null,"BODY228"],["5. 下一步，我们计划…… (Bước tiếp theo, chúng tôi dự định …)",null,null,"Xià yībù, wǒmen jìhuà……",null,"BODY229"],["Ví dụ: 下一步，我们计划开发两家新的供应商，降低风险。 (Bước tiếp theo, chúng tôi dự định phát triển 2 NCC mới để giảm rủi ro.)",null,null,"Xià yībù, wǒmen jìhuà kāifā liǎngjiā xīn de gōngyìngshāng, jiàngdī fēngxiǎn.",null,"BODY230"],["Ví dụ: 下一步，我们计划在胡志明市设立一个办事处。 (Bước tiếp theo, chúng tôi dự định lập văn phòng đại diện ở TP.HCM.)",null,null,"Xià yībù, wǒmen jìhuà zài Húzhìmíng Shì shèlì yīgè bànshìchù.",null,"BODY231"],["6. 关于……，大家有什么看法？ (Về …, mọi người có ý kiến gì?)",null,null,"Guānyú……, dàjiā yǒu shénme kànfǎ?",null,"BODY232"],["Ví dụ: 关于明年的预算，大家有什么看法？ (Về ngân sách năm sau, mọi người có ý kiến gì?)",null,null,"Guānyú míngnián de yùsuàn, dàjiā yǒu shénme kànfǎ?",null,"BODY233"],["Ví dụ: 关于要不要参加广州的展会，大家有什么看法？ (Về việc có tham gia triển lãm Quảng Châu không, mọi người thấy sao?)",null,null,"Guānyú yào bùyào cānjiā Guǎngzhōu de zhǎnhuì, dàjiā yǒu shénme kànfǎ?",null,"BODY234"],["7. 我同意……的意见，不过…… (Tôi đồng ý ý kiến của …, nhưng …)",null,null,"Wǒ tóngyì…… de yìjiàn, bùguò……",null,"BODY235"],["Ví dụ: 我同意小林的意见，不过我觉得时间可以再提前一点。 (Tôi đồng ý ý kiến Tiểu Lâm, nhưng tôi thấy thời gian có thể sớm hơn chút.)",null,null,"Wǒ tóngyì Xiǎo Lín de yìjiàn, bùguò wǒ juéde shíjiān kěyǐ zài tíqián yīdiǎn.",null,"BODY236"],["Ví dụ: 我同意经理的意见，不过预算可能需要再增加百分之十。 (Tôi đồng ý ý kiến giám đốc, nhưng ngân sách có thể cần tăng thêm 10%.)",null,null,"Wǒ tóngyì jīnglǐ de yìjiàn, bùguò yùsuàn kěnéng xūyào zài zēngjiā bǎifēnzhīshí.",null,"BODY237"],["8. 我们有点跑题了，先回到…… (Chúng ta hơi lạc đề, quay lại …)",null,null,"Wǒmen yǒudiǎn pǎotí le, xiānhuídào……",null,"BODY238"],["Ví dụ: 我们有点跑题了，先回到今天的第二个议题。 (Chúng ta hơi lạc đề, quay lại vấn đề thứ hai hôm nay.)",null,null,"Wǒmen yǒudiǎn pǎotí le, xiānhuídào jīntiān de dì'èrgè yìtí.",null,"BODY239"],["9. (HSK5) 我总结一下今天的会议：第一……；第二……；第三…… (Tôi xin tổng kết cuộc họp hôm nay: một …; hai …; ba …)",null,null,"Wǒ zǒngjié yīxià jīntiān de huìyì: dìyī……; dì'èr……; dìsān……",null,"BODY240"],["Ví dụ: 我总结一下今天的会议：第一，下个月目标定为一百亿；第二，小林负责新客户开发；第三，下周五再开一次会检查进展。 (Tổng kết: một, mục tiêu tháng sau 10 tỷ; hai, Tiểu Lâm phụ trách khách mới; ba, thứ 6 tuần sau họp lại kiểm tra tiến độ.)",null,null,"Wǒ zǒngjié yīxià jīntiān de huìyì: dìyī, xiàgèyuè mùbiāo dìngwéi yībǎiyì; dì'èr, Xiǎo Lín fùzé xīn kèhù kāifā; dìsān, xià zhōuwǔ zài kāi yīcì huì jiǎnchá jìnzhǎn.",null,"BODY241"],["10. (HSK5) 我理解你的顾虑，我们能不能先……，再…… (Tôi hiểu băn khoăn của bạn, chúng ta có thể … trước, rồi … không)",null,null,"Wǒ lǐjiě nǐ de gùlǜ, wǒmen néng bùnéng xiān……, zài……",null,"BODY242"],["Ví dụ: 我理解你的顾虑，我们能不能先小范围试一个月，再决定要不要全面推广？ (Tôi hiểu băn khoăn của bạn, mình thử phạm vi nhỏ một tháng trước rồi quyết định có triển khai toàn diện không?)",null,null,"Wǒ lǐjiě nǐ de gùlǜ, wǒmen néng bùnéng xiān xiǎo fànwéi shì yīgèyuè, zài juédìng yào bùyào quánmiàntuīguǎng?",null,"BODY243"],["Ví dụ: 我理解你的顾虑，我们能不能先做一个成本分析，再讨论要不要买新设备？ (Tôi hiểu băn khoăn, mình làm phân tích chi phí trước rồi bàn có mua thiết bị mới không?)",null,null,"Wǒ lǐjiě nǐ de gùlǜ, wǒmen néng bùnéng xiān zuò yīgè chéngběn fènxī, zài tǎolùn yào bùyào mǎi xīn shèbèi?",null,"BODY244"],["情景对话 1 — Mở đầu cuộc họp tuần (chủ trì giới thiệu chương trình)",null,null,"Qíngjǐng duìhuà",null,"BODY245-C"],["经理: 大家好，人都到齐了吧？那我们开始开会。 (Chào mọi người, mọi người đến đủ rồi nhỉ? Vậy chúng ta bắt đầu họp.)",null,null,"Jīnglǐ: dàjiā hǎo, rén dōu dào qí le ba? Nà wǒmen kāishǐ kāihuì.",null,"BODY246"],["经理: 今天的会议大概一个小时，议程有三项：第一，各部门汇报十月份的工作；第二，讨论年底促销方案；第三，安排下个月的展会。 (Họp hôm nay khoảng một tiếng, chương trình có 3 mục: một, các phòng báo cáo công việc tháng 10; hai, thảo luận phương án khuyến mãi cuối năm; ba, sắp xếp triển lãm tháng sau.)",null,null,"Jīnglǐ: jīntiān de huìyì dàgài yīgè xiǎoshí, yìchéng yǒu sānxiàng: dìyī, gè bùmén huìbào shíyuèfèn de gōngzuò; dì'èr, tǎolùn niándǐ cùxiāo fāng'àn; dìsān, ānpái xiàgèyuè de zhǎnhuì.",null,"BODY247"],["经理: 小芳，今天麻烦你做会议纪要。 (Tiểu Phương, hôm nay phiền bạn ghi biên bản họp.)",null,null,"Jīnglǐ: Xiǎo Fāng, jīntiān máfan nǐ zuò huìyìjìyào.",null,"BODY248"],["小芳: 好的，经理。 (Vâng, giám đốc.)",null,null,"Xiǎo Fāng: hǎo de, jīnglǐ.",null,"BODY249"],["经理: 每个部门汇报控制在五分钟以内，重点说结果、问题和下一步计划。 (Mỗi phòng báo cáo trong vòng 5 phút, tập trung vào kết quả, vấn đề và kế hoạch tiếp theo.)",null,null,"Jīnglǐ: měigè bùmén huìbào kòngzhì zài wǔfēnzhōng yǐnèi, zhòngdiǎn shuō jiéguǒ, wèntí hé xià yībù jìhuà.",null,"BODY250"],["小林: 经理，我们销售部有一个比较急的事情，能不能放在第一个讨论？ (Giám đốc, phòng kinh doanh có một việc khá gấp, có thể thảo luận đầu tiên không?)",null,null,"Xiǎo Lín: jīnglǐ, wǒmen xiāoshòubù yǒu yīgè bǐjiào jí de shìqing, néng bùnéng fàngzài dìyīgè tǎolùn?",null,"BODY251"],["经理: 什么事？ (Việc gì?)",null,null,"Jīnglǐ: shénme shì?",null,"BODY252"],["小林: 王总那边的订单可能要提前交货，需要生产部配合。 (Đơn bên Vương tổng có thể phải giao sớm, cần sản xuất phối hợp.)",null,null,"Xiǎo Lín: Wáng zǒng nàbiān de dìngdān kěnéng yào tíqián jiāohuò, xūyào shēngchǎn bù pèihé.",null,"BODY253"],["经理: 好，那这件事我们在汇报的时候一起说。还有别的需要加进议程的吗？ (Được, việc đó nói luôn trong phần báo cáo. Còn gì cần thêm vào chương trình không?)",null,null,"Jīnglǐ: hǎo, nà zhèjiàn shì wǒmen zài huìbào de shíhou yīqǐ shuō. Háiyǒu biéde xūyào jiājìn yìchéng de ma?",null,"BODY254"],["全体: 没有了。 (Không ạ.)",null,null,"Quántǐ: méiyǒu le.",null,"BODY255"],["经理: 好，那我们先从销售部开始。小林，请你先汇报。 (Được, vậy bắt đầu từ phòng kinh doanh. Tiểu Lâm, mời bạn báo cáo trước.)",null,null,"Jīnglǐ: hǎo, nà wǒmen xiān cóng xiāoshòubù kāishǐ. Xiǎo Lín, qǐng nǐ xiān huìbào.",null,"BODY256"],["情景对话 2 — Báo cáo kết quả tháng của phòng kinh doanh (HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY257-C"],["小林: 好的。我先汇报一下十月份的销售情况。 (Vâng. Tôi xin báo cáo tình hình bán hàng tháng 10.)",null,null,"Xiǎo Lín: hǎo de. Wǒ xiān huìbào yīxià shíyuèfèn de xiāoshòu qíngkuàng.",null,"BODY258"],["小林: 本月完成了销售额八十五亿盾，目标是八十亿，完成率是百分之一百零六，同比增长了百分之十二。 (Tháng này doanh số đạt 8,5 tỷ, mục tiêu 8 tỷ, hoàn thành 106%, tăng 12% so với cùng kỳ.)",null,null,"Xiǎo Lín: běnyuè wánchéng le xiāoshòu'é bāshíwǔ yì dùn, mùbiāo shì bāshí yì, wánchénglǜ shì bǎifēnzhī yībǎilíngliù, tóngbǐ zēngzhǎng le bǎifēnzhīshí'èr.",null,"BODY259"],["经理: 不错！主要是哪些客户贡献的？ (Tốt lắm! Chủ yếu nhờ những khách nào?)",null,null,"Jīnglǐ: bùcuò! Zhǔyào shì nǎxiē kèhù gòngxiàn de?",null,"BODY260"],["小林: 主要是两个大客户：王总的公司追加了两个柜，另外我们新开发了一个北宁的电子厂。 (Chủ yếu 2 khách lớn: công ty Vương tổng đặt thêm 2 container, ngoài ra chúng tôi phát triển được một nhà máy điện tử ở Bắc Ninh.)",null,null,"Xiǎo Lín: zhǔyào shì liǎnggè dà kèhù: Wáng zǒng de gōngsī zhuījiā le liǎnggè guì, lìngwài wǒmen xīn kāifā le yīgè Běiníng de diànzichǎng.",null,"BODY261"],["小林: 不过，目前遇到的主要问题是回款比较慢，有三个客户的货款超过了六十天。 (Tuy nhiên, vấn đề chính hiện nay là thu tiền chậm, có 3 khách nợ quá 60 ngày.)",null,null,"Xiǎo Lín: bùguò, mùqián yùdào de zhǔyào wèntí shì huíkuǎn bǐjiàomàn, yǒu sāngè kèhù de huòkuǎn chāoguò le liùshítiān.",null,"BODY262"],["经理: 一共多少钱？ (Tổng bao nhiêu tiền?)",null,null,"Jīnglǐ: yīgòng duōshǎo qián?",null,"BODY263"],["小林: 一共大概十二亿盾。原因是这三个客户自己的资金也比较紧张。 (Tổng khoảng 1,2 tỷ. Nguyên nhân là chính 3 khách này cũng đang khó khăn về vốn.)",null,null,"Xiǎo Lín: yīgòng dàgài shí'èryì dùn. Yuányīn shì zhè sāngè kèhù zìjǐ de zījīn yě bǐjiào jǐnzhāng.",null,"BODY264"],["经理: 你们打算怎么办？ (Các bạn định làm thế nào?)",null,null,"Jīnglǐ: nǐmen dǎsuàn zěnmebàn?",null,"BODY265"],["小林: 下一步，我们计划每周给他们打一次电话催款，下个月开始，超过六十天的客户先暂停发货。 (Bước tiếp theo, mỗi tuần gọi đòi tiền một lần, từ tháng sau khách quá 60 ngày tạm dừng giao hàng.)",null,null,"Xiǎo Lín: xià yībù, wǒmen jìhuà měizhōu gěi tāmen dǎ yīcì diànhuà cuīkuǎn, xiàgèyuè kāishǐ, chāoguò liùshítiān de kèhù xiān zàntíng fāhuò.",null,"BODY266"],["经理: 暂停发货会不会影响关系？ (Tạm dừng giao hàng có ảnh hưởng quan hệ không?)",null,null,"Jīnglǐ: zàntíng fāhuò huì bùhuì yǐngxiǎng guānxi?",null,"BODY267"],["小林: 我们会提前跟他们沟通，也可以接受他们分期付款。 (Chúng tôi sẽ trao đổi trước với họ, cũng có thể chấp nhận trả góp.)",null,null,"Xiǎo Lín: wǒmen huì tíqián gēn tāmen gōutōng, yě kěyǐ jiēshòu tāmen fēnqīfùkuǎn.",null,"BODY268"],["经理: 好。刚才说的王总订单的事呢？ (Được. Còn việc đơn Vương tổng nói lúc nãy?)",null,null,"Jīnglǐ: hǎo. Gāngcái shuō de Wáng zǒng dìngdān de shì ne?",null,"BODY269"],["小林: 王总希望把下个月二十号的订单提前到十号交货，三千件。这个需要生产部看看能不能安排。 (Vương tổng muốn đơn ngày 20 tháng sau dời lên giao ngày 10, 3.000 cái. Cái này cần sản xuất xem có sắp xếp được không.)",null,null,"Xiǎo Lín: Wáng zǒng xīwàng bǎ xiàgèyuè èrshí hào de dìngdān tíqián dào shíhào jiāohuò, sānqiānjiàn. Zhège xūyào shēngchǎn bù kànkan néng bùnéng ānpái.",null,"BODY270"],["生产: 我想补充一点：下个月初我们有一台设备要保养，停三天。如果要提前，周末可能要加班。 (Tôi xin bổ sung: đầu tháng sau chúng tôi có một máy phải bảo dưỡng, dừng 3 ngày. Nếu muốn giao sớm, cuối tuần có thể phải tăng ca.)",null,null,"Shēngchǎn: wǒ xiǎng bǔchōng yīdiǎn: xià gè yuèchū wǒmen yǒu yītái shèbèi yào bǎoyǎng, tíng sāntiān. Rúguǒ yào tíqián, zhōumò kěnéng yào jiābān.",null,"BODY271"],["经理: 设备保养能不能推迟一周？ (Bảo dưỡng máy lùi một tuần được không?)",null,null,"Jīnglǐ: shèbèi bǎoyǎng néng bùnéng tuīchí yīzhōu?",null,"BODY272"],["生产: 可以，推迟一周问题不大。 (Được, lùi một tuần không vấn đề lớn.)",null,null,"Shēngchǎn: kěyǐ, tuīchí yīzhōu wèntí bù dà.",null,"BODY273"],["经理: 好，那就这么定：保养推迟到十号以后，王总的订单十号交货。小林，你今天回复王总。 (Được, chốt vậy: bảo dưỡng lùi sau ngày 10, đơn Vương tổng giao ngày 10. Tiểu Lâm, hôm nay bạn trả lời Vương tổng.)",null,null,"Jīnglǐ: hǎo, nà jiù zhème dìng: bǎoyǎng tuīchí dào shíhào yǐhòu, Wáng zǒng de dìngdān shíhào jiāohuò. Xiǎo Lín, nǐ jīntiān huífù Wáng zǒng.",null,"BODY274"],["小林: 明白。我的汇报就到这里，谢谢大家。 (Đã rõ. Phần báo cáo của tôi đến đây, cảm ơn mọi người.)",null,null,"Xiǎo Lín: míngbai. Wǒ de huìbào jiù dào zhèlǐ, xièxie dàjiā.",null,"BODY275"],["情景对话 3 — Thảo luận phương án khuyến mãi cuối năm (nhiều ý kiến khác nhau)",null,null,"Qíngjǐng duìhuà",null,"BODY276-C"],["经理: 下面讨论第二项：年底促销方案。关于促销的方式，大家有什么看法？ (Tiếp theo thảo luận mục hai: phương án khuyến mãi cuối năm. Về hình thức khuyến mãi, mọi người có ý kiến gì?)",null,null,"Jīnglǐ: xiàmiàn tǎolùn dì'èrxiàng: niándǐ cùxiāo fāng'àn. Guānyú cùxiāo de fāngshì, dàjiā yǒu shénme kànfǎ?",null,"BODY277"],["小林: 我建议直接打折，全部产品九折，简单直接，客户最容易接受。 (Tôi đề nghị giảm giá thẳng, toàn bộ sản phẩm giảm 10%, đơn giản trực tiếp, khách dễ chấp nhận nhất.)",null,null,"Xiǎo Lín: wǒ jiànyì zhíjiē dǎzhé, quánbù chǎnpǐn jiǔzhé, jiǎndān zhíjiē, kèhù zuì róngyìjiēshòu.",null,"BODY278"],["财务: 我想补充一点：如果全部打九折，我们的利润会减少大概百分之四十，压力太大了。 (Tôi xin bổ sung: nếu giảm 10% toàn bộ, lợi nhuận giảm khoảng 40%, áp lực quá lớn.)",null,null,"Cáiwù: wǒ xiǎng bǔchōng yīdiǎn: rúguǒ quánbùdǎ jiǔzhé, wǒmen de lìrùn huì jiǎnshǎo dàgài bǎifēnzhīsìshí, yālì tài dà le.",null,"BODY279"],["小芳: 那我们能不能只给老产品打折？新产品利润高，不打折。 (Vậy chỉ giảm giá sản phẩm cũ được không? Sản phẩm mới lợi nhuận cao thì không giảm.)",null,null,"Xiǎo Fāng: nà wǒmen néng bùnéng zhǐ gěi lǎo chǎnpǐn dǎzhé? Xīn chǎnpǐn lìrùn gāo, bù dǎzhé.",null,"BODY280"],["小林: 我同意小芳的意见，不过老产品的库存不多，打折的效果可能不明显。 (Tôi đồng ý ý kiến Tiểu Phương, nhưng tồn kho sản phẩm cũ không nhiều, giảm giá có thể không hiệu quả rõ.)",null,null,"Xiǎo Lín: wǒ tóngyì Xiǎo Fāng de yìjiàn, bùguò lǎo chǎnpǐn de kùcún bù duō, dǎzhé de xiàoguǒ kěnéng bù míngxiǎn.",null,"BODY281"],["市场: 我有另外一个想法：不打折，改成满额送，比如订单满五亿送一台小设备。 (Tôi có ý khác: không giảm giá, đổi thành mua đủ mức tặng quà, như đơn đủ 500 triệu tặng một thiết bị nhỏ.)",null,null,"Shìchǎng: wǒ yǒu lìngwài yīgè xiǎngfǎ: bù dǎzhé, gǎichéng mǎn'é sòng, bǐrú dìngdān mǎn wǔyì sòng yītái xiǎo shèbèi.",null,"BODY282"],["经理: 这个方法的成本是多少？ (Cách này chi phí bao nhiêu?)",null,null,"Jīnglǐ: zhège fāngfǎ de chéngběn shì duōshǎo?",null,"BODY283"],["市场: 赠品的成本大概是订单金额的百分之三，比打九折低很多。 (Chi phí quà tặng khoảng 3% giá trị đơn, thấp hơn giảm 10% nhiều.)",null,null,"Shìchǎng: zèngpǐn de chéngběn dàgài shì dìngdān jīn'é de bǎifēnzhīsān, bǐ dǎ jiǔzhé dī hěnduō.",null,"BODY284"],["小林: 但是客户不一定需要那个设备。 (Nhưng khách chưa chắc cần thiết bị đó.)",null,null,"Xiǎo Lín: dànshì kèhù bù yīdìng xūyào nàge shèbèi.",null,"BODY285"],["市场: 我们可以准备三种赠品，让客户自己选。 (Có thể chuẩn bị 3 loại quà, để khách tự chọn.)",null,null,"Shìchǎng: wǒmen kěyǐ zhǔnbèi sānzhǒng zèngpǐn, ràng kèhù zìjǐ xuǎn.",null,"BODY286"],["经理: 我们有点跑题了，先不讨论赠品的细节。我想问一下：大家觉得哪个方案对销售额的帮助最大？ (Chúng ta hơi lạc đề, tạm chưa bàn chi tiết quà tặng. Tôi muốn hỏi: mọi người thấy phương án nào giúp doanh số nhiều nhất?)",null,null,"Jīnglǐ: wǒmen yǒudiǎn pǎotí le, xiān bù tǎolùn zèngpǐn de xìjié. Wǒ xiǎng wèn yīxià: dàjiā juéde nǎge fāng'àn duì xiāoshòu'é de bāngzhù zuìdà?",null,"BODY287"],["小林: 从销售的角度来看，满额送能让客户多下单，我现在也觉得比打折好。 (Từ góc độ bán hàng, mua đủ mức tặng quà khiến khách đặt nhiều hơn, giờ tôi cũng thấy hay hơn giảm giá.)",null,null,"Xiǎo Lín: cóng xiāoshòu de jiǎodù láikàn, mǎn'é sòng néng ràng kèhù duō xiàdān, wǒ xiànzài yě juéde bǐ dǎzhé hǎo.",null,"BODY288"],["财务: 我也支持满额送，成本可控。 (Tôi cũng ủng hộ tặng quà theo mức, chi phí kiểm soát được.)",null,null,"Cáiwù: wǒ yě zhīchí mǎn'é sòng, chéngběn kěkòng.",null,"BODY289"],["经理: 好，看来大家基本达成一致了。市场部下周三之前做一个详细方案，包括赠品的种类和预算。 (Được, xem ra mọi người cơ bản đã thống nhất. Phòng marketing trước thứ 4 tuần sau làm phương án chi tiết, gồm loại quà và ngân sách.)",null,null,"Jīnglǐ: hǎo, kànlái dàjiā jīběn dáchéng yīzhì le. Shìchǎng bùxià zhōusān zhīqián zuò yīgè xiángxì fāng'àn, bāokuò zèngpǐn de zhǒnglèi hé yùsuàn.",null,"BODY290"],["市场: 没问题。 (Không vấn đề.)",null,null,"Shìchǎng: méi wèntí.",null,"BODY291"],["情景对话 4 — Báo cáo dự án gặp khó khăn, xin hỗ trợ (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY292-C"],["经理: 小海，新仓库的项目进展怎么样了？ (Tiểu Hải, dự án kho mới tiến triển thế nào rồi?)",null,null,"Jīnglǐ: Xiǎo Hǎi, xīn cāngkù de xiàngmù jìnzhǎn zěnmeyàng le?",null,"BODY293"],["小海: 我重点说一下。目前整体进度是百分之六十，比计划落后了两个星期。 (Tôi nói trọng tâm. Hiện tiến độ tổng thể 60%, chậm so với kế hoạch 2 tuần.)",null,null,"Xiǎo Hǎi: wǒ zhòngdiǎn shuō yīxià. Mùqián zhěngtǐ jìndù shì bǎifēnzhīliùshí, bǐ jìhuà luòhòu le liǎnggè xīngqī.",null,"BODY294"],["经理: 为什么会落后？ (Vì sao bị chậm?)",null,null,"Jīnglǐ: wèishénme huì luòhòu?",null,"BODY295"],["小海: 主要有两个原因：第一，上个月下了两个星期的雨，施工停了；第二，货架的供应商交货晚了十天。 (Chủ yếu 2 nguyên nhân: một, tháng trước mưa 2 tuần, thi công dừng; hai, NCC giá kệ giao trễ 10 ngày.)",null,null,"Xiǎo Hǎi: zhǔyào yǒu liǎnggè yuányīn: dìyī, shànggèyuè xià le liǎnggè xīngqī de yǔ, shīgōng tíng le; dì'èr, huòjià de gōngyìngshāng jiāohuò wǎn le shítiān.",null,"BODY296"],["经理: 那原计划十二月一号启用，还来得及吗？ (Vậy kế hoạch ban đầu đưa vào dùng ngày 1/12, còn kịp không?)",null,null,"Jīnglǐ: nà yuán jìhuà shí'èryuè yīhào qǐyòng, hái láidejí ma?",null,"BODY297"],["小海: 按现在的速度，恐怕要到十二月十五号。 (Theo tốc độ hiện tại, e là phải đến 15/12.)",null,null,"Xiǎo Hǎi: àn xiànzài de sùdù, kǒngpà yào dào shí'èryuè shíwǔhào.",null,"BODY298"],["经理: 十二月是旺季，晚两个星期影响很大。有没有办法赶回来？ (Tháng 12 là mùa cao điểm, trễ 2 tuần ảnh hưởng lớn. Có cách nào bắt kịp không?)",null,null,"Jīnglǐ: shí'èryuè shì wàngjì, wǎn liǎnggè xīngqī yǐngxiǎng hěndà. Yǒuméiyǒu bànfǎ gǎnhuílái?",null,"BODY299"],["小海: 我想了一个办法：施工队可以加夜班，但是每天要多花一千五百万盾。 (Tôi nghĩ một cách: đội thi công làm ca đêm, nhưng mỗi ngày tốn thêm 15 triệu.)",null,null,"Xiǎo Hǎi: wǒ xiǎng le yīgè bànfǎ: shīgōngduì kěyǐ jiā yèbān, dànshì měitiān yào duō huā yīqiānwǔbǎiwàn dùn.",null,"BODY300"],["财务: 一共要加多少天？ (Tổng phải thêm bao nhiêu ngày?)",null,null,"Cáiwù: yīgòng yào jiāduōshǎo tiān?",null,"BODY301"],["小海: 大概十天，一共一亿五千万盾左右。 (Khoảng 10 ngày, tổng khoảng 150 triệu.)",null,null,"Xiǎo Hǎi: dàgài shítiān, yīgòng yīyìwǔqiānwàn dùn zuǒyòu.",null,"BODY302"],["经理: 如果不加班，晚两个星期，我们的损失是多少？ (Nếu không tăng ca, trễ 2 tuần, thiệt hại của chúng ta là bao nhiêu?)",null,null,"Jīnglǐ: rúguǒ bù jiābān, wǎn liǎnggè xīngqī, wǒmen de sǔnshī shì duōshǎo?",null,"BODY303"],["小海: 我算过，旺季的时候要租临时仓库，两个星期大概要三亿盾。 (Tôi tính rồi, mùa cao điểm phải thuê kho tạm, 2 tuần khoảng 300 triệu.)",null,null,"Xiǎo Hǎi: wǒ suàn guò, wàngjì de shíhou yào zū línshí cāngkù, liǎnggè xīngqī dàgài yào sānyì dùn.",null,"BODY304"],["经理: 那加班更划算。好，我批准加夜班。还需要什么支持？ (Vậy tăng ca hời hơn. Được, tôi duyệt làm ca đêm. Còn cần hỗ trợ gì?)",null,null,"Jīnglǐ: nà jiābān gèng huásuàn. Hǎo, wǒ pīzhǔn jiā yèbān. Hái xūyào shénme zhīchí?",null,"BODY305"],["小海: 希望采购部帮忙催一下货架供应商，剩下的货架下周一之前必须到。 (Mong phòng mua hàng giục giúp NCC giá kệ, số còn lại phải về trước thứ 2 tuần sau.)",null,null,"Xiǎo Hǎi: xīwàng cǎigòubù bāngmáng cuī yīxià huòjià gōngyìngshāng, shèngxià de huòjià xiàzhōuyī zhīqián bìxū dào.",null,"BODY306"],["采购: 好，我今天下午就去供应商那里一趟。 (Được, chiều nay tôi qua NCC một chuyến.)",null,null,"Cǎigòu: hǎo, wǒ jīntiānxiàwǔ jiù qù gōngyìngshāng nàlǐ yītàng.",null,"BODY307"],["经理: 小海，以后每周五给我发一次项目进展报告，有风险提前说。 (Tiểu Hải, sau này thứ 6 hằng tuần gửi tôi báo cáo tiến độ dự án, có rủi ro báo trước.)",null,null,"Jīnglǐ: Xiǎo Hǎi, yǐhòu měizhōuwǔ gěiwǒfā yīcì xiàngmù jìnzhǎn bàogào, yǒu fēngxiǎn tíqián shuō.",null,"BODY308"],["小海: 明白，我会的。 (Rõ, tôi sẽ làm.)",null,null,"Xiǎo Hǎi: míngbai, wǒhuì de.",null,"BODY309"],["情景对话 5 — Họp online với tổng bộ Trung Quốc (sự cố mạng, nghe không rõ)",null,null,"Qíngjǐng duìhuà",null,"BODY310-C"],["总部: 越南团队的各位，大家好！能听到我说话吗？ (Chào các bạn đội Việt Nam! Có nghe tôi nói không?)",null,null,"Zǒngbù: Yuènán tuánduì de gèwèi, dàjiā hǎo! Néng tīngdào wǒ shuōhuà ma?",null,"BODY311"],["阮经理: 能听到，李总好！不过您的画面有点卡。 (Nghe được, chào Lý tổng! Nhưng hình ảnh của ngài hơi giật.)",null,null,"Ruǎn jīnglǐ: néng tīngdào, Lǐ zǒng hǎo! Bùguò nín de huàmiàn yǒudiǎn kǎ.",null,"BODY312"],["总部: 那我先关掉摄像头。今天主要想听一下越南工厂第三季度的情况。 (Vậy tôi tắt camera trước. Hôm nay chủ yếu muốn nghe tình hình quý 3 của nhà máy Việt Nam.)",null,null,"Zǒngbù: nà wǒ xiān guāndiào shèxiàngtóu. Jīntiān zhǔyào xiǎng tīng yīxià Yuènán gōngchǎng dìsānjìdù de qíngkuàng.",null,"BODY313"],["阮经理: 好的，我先汇报一下。我把PPT共享到屏幕上，您能看到吗？ (Vâng, tôi xin báo cáo trước. Tôi chia sẻ PPT lên màn hình, ngài có thấy không?)",null,null,"Ruǎn jīnglǐ: hǎo de, wǒ xiān huìbào yīxià. Wǒ bǎ PPT gòngxiǎng dào píngmù shàng, nín néng kàndào ma?",null,"BODY314"],["总部: 看到了，请开始。 (Thấy rồi, mời bắt đầu.)",null,null,"Zǒngbù: kàndào le, qǐng kāishǐ.",null,"BODY315"],["阮经理: 第三季度我们一共生产了四十二万件，合格率百分之九十八点五，比第二季度提高了一个百分点。 (Quý 3 chúng tôi sản xuất tổng 420.000 cái, tỷ lệ đạt 98,5%, tăng 1 điểm phần trăm so với quý 2.)",null,null,"Ruǎn jīnglǐ: dìsānjìdù wǒmen yīgòng shēngchǎn le sìshí'èrwàn jiàn, hégélǜ bǎifēnzhījiǔ shíbādiǎnwǔ, bǐ dì'èrjìdù tígāo le yīgè bǎifēndiǎn.",null,"BODY316"],["总部: 不好意思，刚才网络断了一下，你说合格率是多少？ (Xin lỗi, vừa rồi mạng rớt một chút, bạn nói tỷ lệ đạt là bao nhiêu?)",null,null,"Zǒngbù: bùhǎoyìsi, gāngcái wǎngluò duàn le yīxià, nǐ shuō hégélǜ shì duōshǎo?",null,"BODY317"],["阮经理: 百分之九十八点五，我在聊天框里也打出来了。 (98,5%, tôi cũng gõ vào khung chat rồi.)",null,null,"Ruǎn jīnglǐ: bǎifēnzhījiǔ shíbādiǎnwǔ, wǒ zài liáotiān kuāng lǐ yě dǎ chūlái le.",null,"BODY318"],["总部: 好的，谢谢。成本方面呢？ (Được, cảm ơn. Về chi phí thì sao?)",null,null,"Zǒngbù: hǎo de, xièxie. Chéngběn fāngmiàn ne?",null,"BODY319"],["阮经理: 单位成本降低了百分之三，主要是因为我们改进了包装方式，节省了材料。 (Chi phí đơn vị giảm 3%, chủ yếu do cải tiến cách đóng gói, tiết kiệm vật liệu.)",null,null,"Ruǎn jīnglǐ: dānwèichéngběn jiàngdī le bǎifēnzhīsān, zhǔyào shìyīnwèi wǒmen gǎijìn le bāozhuāng fāngshì, jiéshěng le cáiliào.",null,"BODY320"],["总部: 很好。第四季度有什么风险吗？ (Rất tốt. Quý 4 có rủi ro gì không?)",null,null,"Zǒngbù: hěn hǎo. Dìsìjìdù yǒu shénme fēngxiǎn ma?",null,"BODY321"],["阮经理: 最大的风险是越南的最低工资明年一月要上调，人工成本会增加大概百分之六。 (Rủi ro lớn nhất là lương tối thiểu VN tăng từ tháng 1 năm sau, chi phí nhân công tăng khoảng 6%.)",null,null,"Ruǎn jīnglǐ: zuìdà de fēngxiǎn shì Yuènán de zuìdīgōngzī míngnián yīyuè yào shàngtiáo, réngōngchéngběn huì zēngjiā dàgài bǎifēnzhīliù.",null,"BODY322"],["总部: 你们有什么应对方案？ (Các bạn có phương án ứng phó gì?)",null,null,"Zǒngbù: nǐmen yǒu shénme yìngduì fāng'àn?",null,"BODY323"],["阮经理: 我们计划引进两台自动化设备，减少十个人工岗位。详细的方案我会后发邮件给您。 (Chúng tôi dự định đưa vào 2 thiết bị tự động hóa, giảm 10 vị trí nhân công. Phương án chi tiết họp xong tôi gửi email cho ngài.)",null,null,"Ruǎn jīnglǐ: wǒmen jìhuà yǐnjìn liǎngtái zìdònghuà shèbèi, jiǎnshǎo shígè réngōng gǎngwèi. Xiángxì de fāng'àn wǒ huìhòu fāyóujiàn gěi nín.",null,"BODY324"],["总部: 好，辛苦了。今天就到这里吧。 (Được, vất vả rồi. Hôm nay đến đây thôi.)",null,null,"Zǒngbù: hǎo, xīnkǔ le. Jīntiān jiù dào zhèlǐ ba.",null,"BODY325"],["阮经理: 谢谢李总，会议纪要我今天下班前发给您。 (Cảm ơn Lý tổng, biên bản họp tôi gửi ngài trước giờ tan làm hôm nay.)",null,null,"Ruǎn jīnglǐ: xièxie Lǐ zǒng, huìyìjìyào wǒ jīntiān xiàbān qián fāgěinín.",null,"BODY326"],["情景对话 6 — (HSK5) Chủ trì cuộc họp: đồng nghiệp phản đối kế hoạch, xử lý và kết luận",null,null,"Qíngjǐng duìhuà",null,"BODY327-C"],["经理: 今天主要讨论一个问题：明年要不要把一部分生产搬到北宁的新工厂。 (Hôm nay chủ yếu thảo luận một vấn đề: năm sau có chuyển một phần sản xuất sang nhà máy mới ở Bắc Ninh không.)",null,null,"Jīnglǐ: jīntiān zhǔyào tǎolùn yīgè wèntí: míngnián yào bùyào bǎ yībùfen shēngchǎn bān dào Běiníng de xīn gōngchǎng.",null,"BODY328"],["生产: 我反对。现在的工人都住在海防附近，搬到北宁的话，很多人可能会辞职。 (Tôi phản đối. Công nhân hiện nay đều ở gần Hải Phòng, chuyển lên Bắc Ninh nhiều người có thể nghỉ việc.)",null,null,"Shēngchǎn: wǒ fǎnduì. Xiànzài de gōngrén dōu zhù zài Hǎifáng fùjìn, bān dào Běiníng dehuà, hěnduō rén kěnéng huì cízhí.",null,"BODY329"],["采购: 但是北宁离供应商更近，物流成本每年能省二十亿。 (Nhưng Bắc Ninh gần NCC hơn, chi phí vận chuyển mỗi năm tiết kiệm được 2 tỷ.)",null,null,"Cǎigòu: dànshì Běiníng lí gōngyìngshāng gèng jìn, wùliú chéngběn měinián néng shěng èrshíyì.",null,"BODY330"],["生产: 省了物流成本，可是重新招人、培训也要花钱，而且新工人的效率至少半年才能上来。 (Tiết kiệm vận chuyển, nhưng tuyển người, đào tạo lại cũng tốn tiền, mà hiệu suất công nhân mới ít nhất nửa năm mới lên được.)",null,null,"Shēngchǎn: shěng le wùliú chéngběn, kěshì chóngxīn zhāo rén, péixùn yě yào huāqián, érqiě xīn gōngrén de xiàolǜ zhìshǎo bànnián cáinéng shànglái.",null,"BODY331"],["经理: 我理解你的顾虑。人员的问题确实是最大的风险。大家先别急着下结论，我们把利弊都列出来。 (Tôi hiểu băn khoăn của bạn. Vấn đề nhân sự đúng là rủi ro lớn nhất. Mọi người đừng vội kết luận, chúng ta liệt kê lợi hại ra.)",null,null,"Jīnglǐ: wǒ lǐjiě nǐ de gùlǜ. Rényuán de wèntí quèshí shì zuìdà de fēngxiǎn. Dàjiā xiān biéjí zhe xiàjiélùn, wǒmen bǎ lìbì dōu lièchūlái.",null,"BODY332"],["财务: 我算了一下：搬迁一次性投入大概三十亿，如果物流每年省二十亿，一年半就能收回成本。 (Tôi tính rồi: chi phí chuyển một lần khoảng 3 tỷ, nếu mỗi năm tiết kiệm 2 tỷ vận chuyển thì 1 năm rưỡi thu hồi vốn.)",null,null,"Cáiwù: wǒ suànle yīxià: bānqiān yīcìxìng tóurù dàgài sānshí yì, rúguǒ wùliú měinián shěng èrshíyì, yīnián bàn jiù néng shōuhuí chéngběn.",null,"BODY333"],["生产: 这还没算工人流失的损失。 (Đó là chưa tính thiệt hại khi công nhân nghỉ việc.)",null,null,"Shēngchǎn: zhè hái méi suàn gōngrén liúshī de sǔnshī.",null,"BODY334"],["人事: 我想补充一点：北宁那边工业区很多，招人比海防更容易，但是工资要高百分之十左右。 (Tôi xin bổ sung: Bắc Ninh nhiều khu công nghiệp, tuyển người dễ hơn Hải Phòng, nhưng lương phải cao hơn khoảng 10%.)",null,null,"Rénshì: wǒ xiǎng bǔchōng yīdiǎn: Běiníng nàbiān gōngyèqū hěnduō, zhāo rén bǐ Hǎifáng gèng róngyì, dànshì gōngzī yào gāo bǎifēnzhīshízuǒyòu.",null,"BODY335"],["经理: 好，现在情况比较清楚了。我提一个折中的方案：我们能不能先搬一条生产线，试运行六个月，再决定要不要全部搬？ (Được, giờ tình hình khá rõ. Tôi đề xuất phương án dung hòa: mình chuyển trước một chuyền, chạy thử 6 tháng rồi quyết định có chuyển toàn bộ không?)",null,null,"Jīnglǐ: hǎo, xiànzài qíngkuàng bǐjiàoqīngchu le. Wǒ tí yīgè zhézhōng de fāng'àn: wǒmen néng bùnéng xiān bān yītiáo shēngchǎnxiàn, shìyùnxíng liùgèyuè, zài juédìng yào bùyào quánbù bān?",null,"BODY336"],["生产: 如果只搬一条线，我可以接受。但是要给愿意去北宁的工人一些补贴，比如住宿和交通。 (Nếu chỉ chuyển một chuyền thì tôi chấp nhận. Nhưng phải hỗ trợ công nhân sẵn sàng lên Bắc Ninh, như chỗ ở và đi lại.)",null,null,"Shēngchǎn: rúguǒ zhǐ bān yītiáoxiàn, wǒ kěyǐ jiēshòu. Dànshì yào gěi yuànyì qù Běiníng de gōngrén yīxiē bǔtiē, bǐrú zhùsù hé jiāotōng.",null,"BODY337"],["人事: 补贴每人每月大概一百五十万盾，我觉得公司可以承担。 (Hỗ trợ mỗi người mỗi tháng khoảng 1,5 triệu, tôi thấy công ty chịu được.)",null,null,"Rénshì: bǔtiē měirén měiyuè dàgài yībǎiwǔshíwàn dùn, wǒ juéde gōngsī kěyǐ chéngdān.",null,"BODY338"],["采购: 我同意，先试一条线风险小很多。 (Tôi đồng ý, thử một chuyền trước rủi ro nhỏ hơn nhiều.)",null,null,"Cǎigòu: wǒ tóngyì, xiān shì yītiáoxiàn fēngxiǎn xiǎo hěnduō.",null,"BODY339"],["经理: 好，看来大家达成一致了。我总结一下今天的会议：第一，明年一月先把三号线搬到北宁，试运行六个月；第二，人事部负责制定补贴方案，下周五之前提交；第三，六个月以后根据效率和成本的数据，再决定下一步。大家还有没有不同意见？ (Được, xem ra đã thống nhất. Tôi tổng kết: một, tháng 1 năm sau chuyển chuyền số 3 lên Bắc Ninh, chạy thử 6 tháng; hai, phòng nhân sự lập phương án hỗ trợ, nộp trước thứ 6 tuần sau; ba, sau 6 tháng dựa vào số liệu hiệu suất và chi phí để quyết định bước tiếp. Mọi người còn ý kiến khác không?)",null,null,"Jīnglǐ: hǎo, kànlái dàjiā dáchéng yīzhì le. Wǒ zǒngjié yīxià jīntiān de huìyì: dìyī, míngnián yīyuè xiān bǎ sānhào xiàn bān dào Běiníng, shìyùnxíng liùgèyuè; dì'èr, rénshìbù fùzé zhìdìng bǔtiē fāng'àn, xià zhōuwǔ zhīqián tíjiāo; dìsān, liùgèyuè yǐhòu gēnjù xiàolǜ hé chéngběn de shùjù, zài juédìng xià yībù. Dàjiā háiyǒu méiyǒu bùtóng yìjiàn?",null,"BODY340"],["全体: 没有了。 (Không ạ.)",null,null,"Quántǐ: méiyǒu le.",null,"BODY341"],["经理: 好，散会。小芳，会议纪要今天发给大家。 (Được, tan họp. Tiểu Phương, hôm nay gửi biên bản cho mọi người.)",null,null,"Jīnglǐ: hǎo, sànhuì. Xiǎo Fāng, huìyìjìyào jīntiān fāgěi dàjiā.",null,"BODY342"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY343-C"],["1. Hỏi: 请你用一分钟汇报一下你这个月的工作。 (Hãy báo cáo công việc tháng này của bạn trong 1 phút.)",null,null,"Qǐng nǐ yòng yīfēnzhōng huìbào yīxià nǐ zhège yuè de gōngzuò.",null,"BODY344"],["Đáp: 我先汇报一下这个月的工作。本月我完成了三十五份报价，成交了十二单，成交率百分之三十四。目前遇到的主要问题是两个客户的样品测试还没通过。下一步，我计划下周去客户工厂了解具体原因。 (Tôi xin báo cáo công việc tháng này. Tháng này làm 35 báo giá, chốt 12 đơn, tỷ lệ chốt 34%. Vấn đề chính là mẫu của 2 khách chưa đạt thử nghiệm. Bước tiếp, tuần sau tôi định đến nhà máy khách tìm hiểu nguyên nhân cụ thể.)",null,null,"Wǒ xiān huìbào yīxià zhège yuè de gōngzuò. Běnyuè wǒ wánchéng le sānshíwǔ fèn bàojià, chéngjiāo le shí'èr dān, chéngjiāolǜ bǎifēnzhīsānshí sì. Mùqián yùdào de zhǔyào wèntí shì liǎnggè kèhù de yàngpǐn cèshì hái méi tōngguò. Xià yībù, wǒ jìhuà xiàzhōu qù kèhù gōngchǎng liǎojiě jùtǐ yuányīn.",null,"BODY345"],["2. Hỏi: 开会的时候有人一直跑题，你作为主持人会怎么说？ (Lúc họp có người cứ lạc đề, là người chủ trì bạn nói thế nào?)",null,null,"Kāihuì de shíhou yǒurén yīzhí pǎotí, nǐ zuòwéi zhǔchírén huì zěnme shuō?",null,"BODY346"],["Đáp: 我会说：\"这个问题很重要，我们会后单独讨论，好吗？现在我们先回到今天的议程上来。\" (Tôi sẽ nói: \"Vấn đề này rất quan trọng, họp xong mình bàn riêng nhé? Giờ quay lại chương trình hôm nay.\")",null,null,"Wǒhuì shuō: \"zhège wèntí hěn zhòngyào, wǒmen huìhòu dāndú tǎolùn, hǎo ma? Xiànzài wǒmen xiānhuídào jīntiān de yìchéng shànglái.\"",null,"BODY347"],["3. Hỏi: 如果老板在会上问你一个你不知道答案的问题，你怎么办？ (Nếu sếp hỏi trong họp câu bạn không biết đáp án, bạn làm sao?)",null,null,"Rúguǒ lǎobǎn zài huìshàng wèn nǐ yīgè nǐ bù zhīdao dá'àn de wèntí, nǐ zěnmebàn?",null,"BODY348"],["Đáp: 我会老实说：\"这个数据我现在手上没有，我会后马上核实，今天下班前发给您。\" (Tôi sẽ nói thật: \"Số liệu này hiện tôi chưa có, họp xong tôi xác minh ngay, trước giờ tan làm gửi anh.\")",null,null,"Wǒhuì lǎoshí shuō: \"zhège shùjù wǒ xiànzài shǒushàng méiyǒu, wǒ huìhòu mǎshàng héshí, jīntiān xiàbān qián fāgěinín.\"",null,"BODY349"],["4. Hỏi: (HSK5) 你觉得一个好的会议主持人需要哪些能力？ (Bạn thấy người chủ trì họp giỏi cần những năng lực gì?)",null,null,"Nǐ juéde yīgè hǎo de huìyì zhǔchírén xūyào nǎxiē nénglì?",null,"BODY350"],["Đáp: 我觉得需要三种能力：第一是控制时间，不让会议拖太久；第二是让每个人都有机会发言，特别是不太爱说话的人；第三是能在不同意见中找到折中的方案，最后给出明确的结论和分工。 (Cần 3 năng lực: kiểm soát thời gian; tạo cơ hội cho mọi người phát biểu, nhất là người ít nói; tìm được phương án dung hòa giữa các ý kiến, cuối cùng đưa kết luận và phân công rõ ràng.)",null,null,"Wǒ juéde xūyào sānzhǒng nénglì: dìyī shì kòngzhì shíjiān, bùràng huìyì tuō tàijiǔ; dì'èr shì ràng měigè rén dōu yǒu jīhuì fāyán, tèbié shì bù tài ài shuōhuà de rén; dìsān shì néng zài bùtóng yìjiàn zhōng zhǎodào zhézhōng de fāng'àn, zuìhòu gěichū míngquè de jiélùn hé fēngōng.",null,"BODY351"],["情景模拟 ROLE-PLAY — HS báo cáo kế hoạch; GV đóng đồng nghiệp phản đối. Vòng 2 (bất ngờ): sếp yêu cầu kết luận ngay trong 2 phút",null,null,"Qíngjǐng mónǐ",null,"BODY352-C"],["HS: 我先汇报一下明年的计划。我们打算在胡志明市开一个销售办事处，主要开发南部的客户。 (Tôi xin báo cáo kế hoạch năm sau. Chúng tôi dự định mở văn phòng bán hàng ở TP.HCM, chủ yếu phát triển khách miền Nam.)",null,null,"Wǒ xiān huìbào yīxià míngnián de jìhuà. Wǒmen dǎsuàn zài Húzhìmíng Shì kāi yīgè xiāoshòu bànshìchù, zhǔyào kāifā nánbù de kèhù.",null,"BODY353"],["GV: 我反对。开办事处成本太高了，房租、工资一年至少五十亿。 (Tôi phản đối. Mở văn phòng chi phí quá cao, tiền thuê, lương một năm ít nhất 5 tỷ.)",null,null,"Wǒ fǎnduì. Kāi bànshìchù chéngběn tài gāo le, fángzū, gōngzī yīnián zhìshǎo wǔshí yì.",null,"BODY354"],["HS: 我理解你的顾虑。不过南部的市场现在占全国的百分之四十，我们的份额只有百分之五，空间很大。 (Tôi hiểu băn khoăn của bạn. Nhưng thị trường miền Nam chiếm 40% cả nước, thị phần của chúng ta chỉ 5%, dư địa rất lớn.)",null,null,"Wǒ lǐjiě nǐ de gùlǜ. Bùguò nánbù de shìchǎng xiànzài zhàn quánguó de bǎifēnzhīsìshí, wǒmen de fèn'é zhǐyǒu bǎifēnzhīwǔ, kōngjiān hěndà.",null,"BODY355"],["GV: 我们可以让销售从河内出差过去，不用开办事处。 (Có thể cho sales từ Hà Nội đi công tác vào, không cần mở văn phòng.)",null,null,"Wǒmen kěyǐ ràng xiāoshòu cóng Hénèi chūchāi guòqù, bùyòng kāi bànshìchù.",null,"BODY356"],["HS: 这个办法我们去年试过，出差费用一年也要十五亿，而且客户反映我们的响应速度太慢。 (Cách này năm ngoái thử rồi, chi phí công tác một năm cũng 1,5 tỷ, mà khách phản ánh chúng ta phản hồi quá chậm.)",null,null,"Zhège bànfǎ wǒmen qùnián shì guò, chūchāi fèiyòng yīnián yě yào shíwǔ yì, érqiě kèhù fǎnyìng wǒmen de xiǎngyìngsùdù tàimàn.",null,"BODY357"],["GV: 那万一开了办事处，销售额上不去呢？ (Lỡ mở văn phòng mà doanh số không lên thì sao?)",null,null,"Nà wànyīkāi le bànshìchù, xiāoshòu'é shàng bù qù ne?",null,"BODY358"],["HS: 我们能不能先租一个小的共享办公室，只派三个人，试一年？如果第一年销售额达不到三十亿，就撤回来。 (Mình thuê trước văn phòng chia sẻ nhỏ, chỉ cử 3 người, thử một năm được không? Năm đầu doanh số không đạt 3 tỷ thì rút về.)",null,null,"Wǒmen néng bùnéng xiān zū yīgè xiǎo de gòngxiǎng bàngōngshì, zhǐ pài sāngè rén, shì yīnián? Rúguǒ dìyīnián xiāoshòu'é dá bùdào sānshí yì, jiù chèhuílái.",null,"BODY359"],["GV (biến cố, vai sếp): 好了，时间不多了，你给我一个结论。 (Được rồi, không còn nhiều thời gian, cho tôi một kết luận.)",null,null,"Hǎo le, shíjiān bù duō le, nǐ gěi wǒ yīgè jiélùn.",null,"BODY360"],["HS: 我总结一下：第一，明年一月在胡志明市租共享办公室，派三个人，预算十二亿；第二，第一年的目标是销售额三十亿；第三，每个季度向您汇报一次，达不到目标就调整。 (Tôi tổng kết: một, tháng 1 năm sau thuê văn phòng chia sẻ ở TP.HCM, cử 3 người, ngân sách 1,2 tỷ; hai, mục tiêu năm đầu doanh số 3 tỷ; ba, mỗi quý báo cáo anh một lần, không đạt mục tiêu thì điều chỉnh.)",null,null,"Wǒ zǒngjié yīxià: dìyī, míngnián yīyuè zài Húzhìmíng Shì zū gòngxiǎng bàngōngshì, pài sāngè rén, yùsuàn shí'èryì; dì'èr, dìyīnián de mùbiāo shì xiāoshòu'é sānshí yì; dìsān, měigè jìdù xiàng nín huìbào yīcì, dá bùdào mùbiāo jiù tiáozhěng.",null,"BODY361"],["GV: 好，就按这个方案执行。 (Được, thực hiện theo phương án này.)",null,null,"Hǎo, jiù àn zhège fāng'àn zhíxíng.",null,"BODY362"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY363-C"],["✗ 我报告给经理。 → ✓ 我向经理汇报。 (Với cấp trên dùng 汇报; 报告 dùng cho văn bản báo cáo.)",null,null,"Wǒ bàogào gěi jīnglǐ. | Wǒ xiàng jīnglǐ huìbào. | Huìbào | Bàogào",null,"BODY364"],["✗ 销售额增加了百分之十二比去年。 → ✓ 销售额比去年增加了百分之十二。/ 销售额同比增长了百分之十二。",null,null,"Xiāoshòu'é zēngjiā le bǎifēnzhīshí'èr bǐ qùnián. | Xiāoshòu'é bǐ qùnián zēngjiā le bǎifēnzhīshí'èr. / | Xiāoshòu'é tóngbǐ zēngzhǎng le bǎifēnzhīshí'èr.",null,"BODY365"],["✗ 我想加一点。 → ✓ 我想补充一点。",null,null,"Wǒ xiǎng jiāyīdiǎn. | Wǒ xiǎng bǔchōng yīdiǎn.",null,"BODY366"],["✗ 我不同意你，因为…… → ✓ 我不太同意这个看法，因为……/ 我有一点不同的想法。",null,null,"Wǒ bù tóngyì nǐ, yīnwèi…… | Wǒ bù tài tóngyì zhège kànfǎ, yīnwèi…… / | Wǒ yǒu yīdiǎn bùtóng de xiǎngfǎ.",null,"BODY367"],["✗ 会议开始！ (cộc) → ✓ 人都到齐了，我们开始吧。",null,null,"Huìyì kāishǐ! | Rén dōu dào qí le, wǒmen kāishǐ ba.",null,"BODY368"],["✗ 百分之九十八.五 → ✓ 百分之九十八点五 (Số thập phân đọc là 点.)",null,null,"Bǎifēnzhījiǔshíbā . wǔ | Bǎifēnzhījiǔ shíbādiǎnwǔ | Diǎn .",null,"BODY369"],["Cách đọc số lớn: 85亿 = 8,5 tỷ (bā shí wǔ yì); 1亿 = 100 triệu; 1000万 = 10 triệu → người Việt hay nhầm 万/亿, cần luyện riêng.",null,null,"85 yì | 1 yì | 1000 wàn | Wàn / yì",null,"BODY370"],["Phát âm: 议程 yìchéng; 补充 bǔchōng; 进展 jìnzhǎn; 达成一致 dáchéng yīzhì; 纪要 jìyào.",null,null,"Yìchéng | Bǔchōng | Jìnzhǎn | Dáchéng yīzhì | Jìyào",null,"BODY371"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY372-C"],["Ghi âm báo cáo cuộc họp 3 phút về công việc thật của mình theo khung 4 phần: kết quả (có số liệu) → khó khăn → nguyên nhân → kế hoạch tiếp theo.",null,null,null,null,"BODY373"],["HSK5: thêm 1 phút đóng vai chủ trì, tổng kết cuộc họp bằng 我总结一下：第一……第二……第三…….",null,null,"Wǒ zǒngjié yīxià: dìyī…… dì'èr…… dìsān…… .",null,"BODY374"],["Luyện riêng: đọc to 10 con số lớn (亿/万/百分之/点).",null,null,"Yì / wàn / bǎifēnzhī / diǎn",null,"BODY375"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY376"],["Buổi 13 — 表达观点与说明理由 Nêu quan điểm",null,null,"Biǎodá guāndiǎn yǔ shuōmíng lǐyóu",null,"BODY377-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY378-C"],["HSK4: Nêu ý kiến, đưa 2 lý do và 1 ví dụ. HSK5: Bảo vệ quan điểm trước phản ví dụ, nhượng bộ có chọn lọc.",null,null,null,null,"BODY379"],["Khung nêu quan điểm (PREP): ① 观点 Quan điểm → ② 理由 Lý do → ③ 例子 Ví dụ → ④ 总结 Nhắc lại quan điểm.",null,null,"Guāndiǎn | Lǐyóu | Lìzi | Zǒngjié",null,"BODY380"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY382-C"],["1. Hỏi: 你觉得在河内生活好还是在胡志明市生活好？ (Bạn thấy sống ở Hà Nội tốt hay TP.HCM tốt?)",null,null,"Nǐ juéde zài Hénèi shēnghuó hǎo háishì zài Húzhìmíng Shì shēnghuó hǎo?",null,"BODY383"],["Đáp: 我觉得在河内生活更好，因为这里四季分明，而且文化气氛很浓。 (Tôi thấy sống ở Hà Nội tốt hơn vì bốn mùa rõ rệt, không khí văn hóa đậm đà.)",null,null,"Wǒ juéde zài Hénèi shēnghuó gènghǎo, yīnwèi zhèlǐ sìjì fēnmíng, érqiě wénhuà qìfēn hěnnóng.",null,"BODY384"],["2. Hỏi: 你觉得学中文最好的方法是什么？ (Bạn thấy cách học tiếng Trung tốt nhất là gì?)",null,null,"Nǐ juéde xué Zhōngwén zuìhǎo de fāngfǎ shì shénme?",null,"BODY385"],["Đáp: 我认为最好的方法是多跟中国人聊天，因为课本上的话跟实际说的不太一样。 (Tôi cho rằng tốt nhất là nói chuyện nhiều với người TQ, vì lời trong sách khác với cách nói thực tế.)",null,null,"Wǒ rènwéi zuìhǎo de fāngfǎ shì duō gēn Zhōngguórén liáotiān, yīnwèi kèběnshàng dehuà gēn shíjì shuō de bù tài yīyàng.",null,"BODY386"],["3. Hỏi: 你同意\"工作越忙越好\"这个说法吗？ (Bạn có đồng ý với câu \"công việc càng bận càng tốt\" không?)",null,null,"Nǐ tóngyì \"gōngzuò yuèmáng yuè hǎo\" zhège shuōfǎ ma?",null,"BODY387"],["Đáp: 我不太同意。忙不等于有效率，有时候太忙反而容易出错。 (Tôi không đồng ý lắm. Bận không có nghĩa là hiệu quả, đôi khi quá bận lại dễ sai.)",null,null,"Wǒ bù tài tóngyì. Máng bù děngyú yǒuxiàolǜ, yǒushíhou tài máng fǎn'ér róngyì chūcuò.",null,"BODY388"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY389-C"],["1. 观点 (quan điểm): 每个人都有自己的观点，我们应该互相尊重。 (Ai cũng có quan điểm riêng, nên tôn trọng nhau.)",null,null,"Guāndiǎn | Měigè rén dōu yǒu zìjǐ de guāndiǎn, wǒmen yīnggāi hùxiāng zūnzhòng.",null,"BODY390"],["2. 立场 (lập trường): 在这个问题上，我的立场很明确：安全第一。 (Về vấn đề này, lập trường của tôi rõ ràng: an toàn là trên hết.)",null,null,"Lìchǎng | Zài zhège wèntí shàng, wǒ de lìchǎng hěn míngquè: ānquán dìyī.",null,"BODY391"],["3. 理由 (lý do): 你反对的理由是什么？ (Lý do bạn phản đối là gì?)",null,null,"Lǐyóu | Nǐ fǎnduì de lǐyóu shì shénme?",null,"BODY392"],["4. 事实 (sự thật): 我们要用事实说话，不能只凭感觉。 (Phải để sự thật lên tiếng, không thể chỉ dựa vào cảm giác.)",null,null,"Shìshí | Wǒmen yào yòng shìshí shuōhuà, bùnéng zhǐ pínggǎnjué.",null,"BODY393"],["5. 证据 (bằng chứng): 你有什么证据证明这个方法更有效？ (Bạn có bằng chứng gì chứng minh cách này hiệu quả hơn?)",null,null,"Zhèngjù | Nǐ yǒu shénme zhèngjù zhèngmíng zhège fāngfǎ gèng yǒuxiào?",null,"BODY394"],["6. 支持 (ủng hộ): 我支持这个建议，因为它能节省成本。 (Tôi ủng hộ đề xuất này vì nó tiết kiệm chi phí.)",null,null,"Zhīchí | Wǒ zhīchí zhège jiànyì, yīnwèi tā néng jiéshěngchéngběn.",null,"BODY395"],["7. 反对 (phản đối): 很多员工反对周六加班。 (Nhiều nhân viên phản đối tăng ca thứ 7.)",null,null,"Fǎnduì | Hěnduō yuángōng fǎnduì zhōuliù jiābān.",null,"BODY396"],["8. 在我看来 (theo tôi thấy): 在我看来，经验比学历更重要。 (Theo tôi, kinh nghiệm quan trọng hơn bằng cấp.)",null,null,"Zàiwǒkànlái | Zàiwǒkànlái, jīngyàn bǐ xuélì gèng zhòngyào.",null,"BODY397"],["9. 一方面……另一方面 (một mặt … mặt khác): 一方面我们要控制成本，另一方面也要保证质量。 (Một mặt phải kiểm soát chi phí, mặt khác phải đảm bảo chất lượng.)",null,null,"Yīfāngmiàn…… lìngyīfāngmiàn | Yīfāngmiàn wǒmen yào kòngzhì chéngběn, lìngyīfāngmiàn yě yào bǎozhèngzhìliàng.",null,"BODY398"],["10. 不可否认 (không thể phủ nhận): 不可否认，网购给我们带来了很多方便。 (Không thể phủ nhận mua sắm online mang lại nhiều tiện lợi.)",null,null,"Bùkěfǒurèn | Bùkěfǒurèn, wǎng gòu gěi wǒmen dàilái le hěnduō fāngbiàn.",null,"BODY399"],["11. 说到底 (suy cho cùng): 说到底，客户最关心的还是价格和质量。 (Suy cho cùng, khách quan tâm nhất vẫn là giá và chất lượng.)",null,null,"Shuōdàodǐ | Shuōdàodǐ, kèhù zuì guānxīn de háishì jiàgé hé zhìliàng.",null,"BODY400"],["12. 一概而论 (vơ đũa cả nắm): 年轻人不一定都不能吃苦，不能一概而论。 (Người trẻ chưa chắc đều không chịu khổ được, không thể vơ đũa cả nắm.)",null,null,"Yīgài'érlùn | Niánqīngrén bù yīdìng dōu bùnéng chīkǔ, bùnéng yīgài'érlùn.",null,"BODY401"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY402-C"],["1. 我个人认为……，主要有两个理由：第一……；第二…… (Cá nhân tôi cho rằng …, chủ yếu có 2 lý do: một …; hai …)",null,null,"Wǒ gèrén rènwéi……, zhǔyào yǒu liǎnggè lǐyóu: dìyī……; dì'èr……",null,"BODY403"],["Ví dụ: 我个人认为公司应该给员工提供中文培训，主要有两个理由：第一，我们百分之七十的客户是中国人；第二，员工的中文好了，可以减少翻译的费用。 (Cá nhân tôi cho rằng công ty nên đào tạo tiếng Trung cho nhân viên, có 2 lý do: một, 70% khách là người TQ; hai, nhân viên giỏi tiếng Trung sẽ giảm chi phí phiên dịch.)",null,null,"Wǒ gèrén rènwéi gōngsī yīnggāi gěi yuángōng tígōng Zhōngwén péixùn, zhǔyào yǒu liǎnggè lǐyóu: dìyī, wǒmen bǎifēnzhīqīshí de kèhù shì Zhōngguórén; dì'èr, yuángōng de Zhōngwén hǎo le, kěyǐ jiǎnshǎo fānyì de fèiyòng.",null,"BODY404"],["Ví dụ: 我个人认为每天的晨会可以取消，主要有两个理由：第一，大部分内容在群里都能说清楚；第二，每天能节省十五分钟。 (Cá nhân tôi cho rằng có thể bỏ họp đầu ngày, 2 lý do: một, phần lớn nội dung nói rõ trong nhóm chat được; hai, mỗi ngày tiết kiệm 15 phút.)",null,null,"Wǒ gèrén rènwéi měitiān de chénhuì kěyǐ qǔxiāo, zhǔyào yǒu liǎnggè lǐyóu: dìyī, dàbùfen nèiróng zài qún lǐ dōu néng shuō qīngchu; dì'èr, měitiān néng jiéshěng shíwǔfēnzhōng.",null,"BODY405"],["2. 举个例子，…… (Lấy ví dụ, …)",null,null,"Jǔ gè lìzi,……",null,"BODY406"],["Ví dụ: 举个例子，上个月小林用中文直接跟客户谈判，三天就签了合同。 (Ví dụ, tháng trước Tiểu Lâm đàm phán trực tiếp với khách bằng tiếng Trung, 3 ngày đã ký hợp đồng.)",null,null,"Jǔ gè lìzi, shànggèyuè Xiǎo Lín yòng Zhōngwén zhíjiē gēn kèhù tánpàn, sāntiān jiù qiān le hétong.",null,"BODY407"],["Ví dụ: 举个例子，我朋友在家办公以后，每天能多睡一个小时，效率反而更高了。 (Ví dụ, bạn tôi làm việc ở nhà, mỗi ngày ngủ thêm được một tiếng, hiệu quả lại cao hơn.)",null,null,"Jǔ gè lìzi, wǒ péngyou zàijiā bàngōng yǐhòu, měitiān néng duō shuì yīgè xiǎoshí, xiàolǜ fǎn'ér gèng gāo le.",null,"BODY408"],["3. 在我看来，…… (Theo tôi thấy, …)",null,null,"Zàiwǒkànlái,……",null,"BODY409"],["Ví dụ: 在我看来，换工作最重要的不是工资，而是能不能学到东西。 (Theo tôi, đổi việc quan trọng nhất không phải lương mà là có học được gì không.)",null,null,"Zàiwǒkànlái, huàn gōngzuò zuì zhòngyào de bùshì gōngzī, érshì néng bùnéng xuédào dōngxi.",null,"BODY410"],["Ví dụ: 在我看来，这个问题的根本原因是沟通不够。 (Theo tôi, nguyên nhân gốc của vấn đề này là giao tiếp chưa đủ.)",null,null,"Zàiwǒkànlái, zhège wèntí de gēnběnyuányīn shì gōutōng bùgòu.",null,"BODY411"],["4. 我同意你的一部分看法，但是…… (Tôi đồng ý một phần ý kiến của bạn, nhưng …)",null,null,"Wǒ tóngyì nǐ de yībùfen kànfǎ, dànshì……",null,"BODY412"],["Ví dụ: 我同意你的一部分看法，确实价格很重要，但是质量不好的话，客户以后就不来了。 (Tôi đồng ý một phần, đúng là giá quan trọng, nhưng chất lượng kém thì khách sau này không quay lại.)",null,null,"Wǒ tóngyì nǐ de yībùfen kànfǎ, quèshí jiàgé hěn zhòngyào, dànshì zhìliàng bùhǎo dehuà, kèhù yǐhòu jiù bù lái le.",null,"BODY413"],["Ví dụ: 我同意你的一部分看法，但是我觉得这个方法不适合所有部门。 (Tôi đồng ý một phần, nhưng tôi thấy cách này không phù hợp mọi phòng ban.)",null,null,"Wǒ tóngyì nǐ de yībùfen kànfǎ, dànshì wǒ juéde zhège fāngfǎ bù shìhé suǒyǒu bùmén.",null,"BODY414"],["5. 不可否认，……；但是…… (Không thể phủ nhận …; nhưng …)",null,null,"Bùkěfǒurèn,……; dànshì……",null,"BODY415"],["Ví dụ: 不可否认，自动化能提高效率；但是一开始的投入太大了。 (Không thể phủ nhận tự động hóa nâng cao hiệu quả; nhưng đầu tư ban đầu quá lớn.)",null,null,"Bùkěfǒurèn, zìdònghuà néng tígāoxiàolǜ; dànshì yī kāishǐ de tóurù tài dà le.",null,"BODY416"],["Ví dụ: 不可否认，社交媒体让我们联系更方便；但是也让很多人越来越孤独。 (Không thể phủ nhận mạng xã hội giúp liên lạc dễ hơn; nhưng cũng khiến nhiều người cô đơn hơn.)",null,null,"Bùkěfǒurèn, shèjiāo méitǐ ràng wǒmen liánxì gèng fāngbiàn; dànshì yě ràng hěnduō rén yuèláiyuè gūdú.",null,"BODY417"],["6. 从……的角度来看，…… (Xét từ góc độ …, …)",null,null,"Cóng…… de jiǎodù láikàn,……",null,"BODY418"],["Ví dụ: 从员工的角度来看，弹性工作时间能让大家更好地照顾家庭。 (Từ góc độ nhân viên, giờ làm linh hoạt giúp mọi người chăm sóc gia đình tốt hơn.)",null,null,"Cóng yuángōng de jiǎodù láikàn, tánxìng gōngzuò shíjiān néng ràng dàjiā gènghǎo de zhàogu jiātíng.",null,"BODY419"],["Ví dụ: 从公司的角度来看，这样做会增加管理的难度。 (Từ góc độ công ty, làm vậy tăng độ khó quản lý.)",null,null,"Cóng gōngsī de jiǎodù láikàn, zhèyàng zuò huì zēngjiā guǎnlǐ de nándù.",null,"BODY420"],["7. 之所以……，是因为…… (Sở dĩ …, là vì …)",null,null,"Zhīsuǒyǐ……, shìyīnwèi……",null,"BODY421"],["Ví dụ: 我之所以反对这个方案，是因为它没有考虑到客户的需求。 (Sở dĩ tôi phản đối phương án này là vì nó chưa tính đến nhu cầu khách hàng.)",null,null,"Wǒ zhīsuǒyǐ fǎnduì zhège fāng'àn, shìyīnwèi tā méiyǒu kǎolǜ dào kèhù de xūqiú.",null,"BODY422"],["Ví dụ: 越南的咖啡之所以有名，是因为味道很浓，而且喝法很特别。 (Cà phê VN nổi tiếng vì vị đậm và cách uống rất đặc biệt.)",null,null,"Yuènán de kāfēi zhīsuǒyǐ yǒumíng, shìyīnwèi wèidào hěnnóng, érqiě hē fǎ hěn tèbié.",null,"BODY423"],["8. 总的来说，…… (Nói chung, tóm lại …)",null,null,"Zǒngdeláishuō,……",null,"BODY424"],["Ví dụ: 总的来说，我还是支持在家办公，但是每周最好来公司两天。 (Tóm lại tôi vẫn ủng hộ làm ở nhà, nhưng mỗi tuần nên lên công ty 2 ngày.)",null,null,"Zǒngdeláishuō, wǒ háishì zhīchí zàijiā bàngōng, dànshì měizhōu zuìhǎo lái gōngsī liǎngtiān.",null,"BODY425"],["Ví dụ: 总的来说，这个方案利大于弊。 (Nói chung phương án này lợi nhiều hơn hại.)",null,null,"Zǒngdeláishuō, zhège fāng'àn lìdàyúbì.",null,"BODY426"],["9. (HSK5) 你说的情况确实存在，不过那只是个别例子，…… (Trường hợp bạn nói đúng là có, nhưng đó chỉ là ví dụ cá biệt, …)",null,null,"Nǐ shuō de qíngkuàng quèshí cúnzài, bùguò nà zhǐshì gèbié lìzi,……",null,"BODY427"],["Ví dụ: 你说的情况确实存在，不过那只是个别例子，大部分员工在家的效率并没有降低。 (Trường hợp bạn nói có thật, nhưng chỉ là cá biệt, phần lớn nhân viên làm ở nhà hiệu suất không hề giảm.)",null,null,"Nǐ shuō de qíngkuàng quèshí cúnzài, bùguò nà zhǐshì gèbié lìzi, dàbùfen yuángōng zàijiā de xiàolǜ bìng méiyǒu jiàngdī.",null,"BODY428"],["10. (HSK5) 即使……，我也认为…… (Cho dù …, tôi vẫn cho rằng …)",null,null,"Jíshǐ……, wǒ yě rènwéi……",null,"BODY429"],["Ví dụ: 即使成本高一点，我也认为应该选质量更好的供应商。 (Cho dù chi phí cao hơn chút, tôi vẫn cho rằng nên chọn NCC chất lượng tốt hơn.)",null,null,"Jíshǐ chéngběn gāo yīdiǎn, wǒ yě rènwéi yīnggāi xuǎn zhìliàng gènghǎo de gōngyìngshāng.",null,"BODY430"],["Ví dụ: 即使大家都反对，我也认为这个决定是对的，因为数据支持我的观点。 (Cho dù mọi người phản đối, tôi vẫn cho rằng quyết định này đúng vì số liệu ủng hộ quan điểm của tôi.)",null,null,"Jíshǐ dàjiā dōu fǎnduì, wǒ yě rènwéi zhège juédìng shì duì de, yīnwèi shùjù zhīchí wǒ de guāndiǎn.",null,"BODY431"],["情景对话 1 — Bàn về chuyện có nên học thạc sĩ (hai đồng nghiệp, HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY432-C"],["A: 小林，我在考虑要不要去读研究生，你觉得呢？ (Tiểu Lâm, mình đang cân nhắc có nên học thạc sĩ không, bạn thấy sao?)",null,null,"Xiǎo Lín, wǒ zài kǎolǜ yào bùyào qù dú yánjiūshēng, nǐ juéde ne?",null,"BODY433"],["B: 我个人认为值得读，主要有两个理由：第一，现在很多公司招主管都要求硕士学历；第二，你可以认识很多不同行业的朋友。 (Cá nhân mình cho rằng đáng học, 2 lý do: một, giờ nhiều công ty tuyển trưởng nhóm yêu cầu bằng thạc sĩ; hai, bạn sẽ quen nhiều bạn ngành khác.)",null,null,"Wǒ gèrén rènwéi zhíde dú, zhǔyào yǒu liǎnggè lǐyóu: dìyī, xiànzài hěnduō gōngsī zhāo zhǔguǎn dōu yāoqiú shuòshì xuélì; dì'èr, nǐ kěyǐ rènshi hěnduō bùtóng hángyè de péngyou.",null,"BODY434"],["A: 可是读研要两年，学费也不便宜，一年要六千万盾左右。 (Nhưng học thạc sĩ mất 2 năm, học phí không rẻ, mỗi năm khoảng 60 triệu.)",null,null,"Kěshì dúyán yào liǎngnián, xuéfèi yě bù piányi, yīnián yào liùqiānwàn dùn zuǒyòu.",null,"BODY435"],["B: 不可否认，学费是一笔不小的钱；但是从长远来看，这是对自己的投资。 (Không thể phủ nhận học phí là khoản không nhỏ; nhưng về lâu dài đó là đầu tư cho bản thân.)",null,null,"Bùkěfǒurèn, xuéfèi shì yībǐ bùxiǎo de qián; dànshì cóng chángyuǎn láikàn, zhè shì duì zìjǐ de tóuzī.",null,"BODY436"],["A: 我担心工作和学习没办法兼顾。 (Mình lo không cân bằng được công việc và học tập.)",null,null,"Wǒ dānxīn gōngzuò hé xuéxí méi bànfǎ jiāngù.",null,"BODY437"],["B: 你可以读周末班，很多人都是这样的。举个例子，我表姐就是一边工作一边读的，现在已经是部门经理了。 (Bạn có thể học lớp cuối tuần, nhiều người làm vậy. Ví dụ chị họ mình vừa làm vừa học, giờ đã là trưởng phòng.)",null,null,"Nǐ kěyǐ dú zhōumò bān, hěnduō rén dōu shì zhèyàng de. Jǔ gè lìzi, wǒ biǎojiě jiùshì yībiān gōngzuò yībiān dú de, xiànzài yǐjīng shì bùménjīnglǐ le.",null,"BODY438"],["A: 但是我觉得经验比学历更重要。 (Nhưng mình thấy kinh nghiệm quan trọng hơn bằng cấp.)",null,null,"Dànshì wǒ juéde jīngyàn bǐ xuélì gèng zhòngyào.",null,"BODY439"],["B: 我同意你的一部分看法，在工作中经验确实很重要。但是在升职的时候，学历常常是一个门槛。 (Mình đồng ý một phần, trong công việc kinh nghiệm đúng là rất quan trọng. Nhưng khi thăng chức, bằng cấp thường là một ngưỡng cửa.)",null,null,"Wǒ tóngyì nǐ de yībùfen kànfǎ, zài gōngzuò zhōng jīngyàn quèshí hěn zhòngyào. Dànshì zài shēngzhí de shíhou, xuélì chángcháng shì yīgè ménkǎn.",null,"BODY440"],["A: 那你觉得读什么专业比较好？ (Vậy bạn thấy học chuyên ngành gì thì tốt?)",null,null,"Nà nǐ juéde dú shénme zhuānyè bǐjiào hǎo?",null,"BODY441"],["B: 在我看来，你做采购，读供应链管理最合适，学的东西马上就能用上。 (Theo mình, bạn làm mua hàng, học quản trị chuỗi cung ứng phù hợp nhất, học xong dùng được ngay.)",null,null,"Zàiwǒkànlái, nǐ zuò cǎigòu, dú gōngyìngliàn guǎnlǐ zuìhéshì, xué de dōngxi mǎshàng jiù néng yòng shàng.",null,"BODY442"],["A: 有道理。我先去了解一下学校和时间安排。 (Có lý. Mình tìm hiểu trường và lịch học trước.)",null,null,"Yǒu dàolǐ. Wǒ xiān qù liǎojiě yīxià xuéxiào hé shíjiān ānpái.",null,"BODY443"],["B: 总的来说，我觉得趁年轻多学点东西不会错。 (Tóm lại, mình thấy nhân lúc còn trẻ học thêm thì không sai.)",null,null,"Zǒngdeláishuō, wǒ juéde chèn niánqīng duō xué diǎn dōngxi bùhuìcuò.",null,"BODY444"],["情景对话 2 — Trong cuộc họp: có nên dùng phần mềm quản lý mới không",null,null,"Qíngjǐng duìhuà",null,"BODY445-C"],["经理: 关于要不要换新的管理软件，大家说说自己的看法。 (Về việc có đổi phần mềm quản lý mới không, mọi người nói ý kiến của mình.)",null,null,"Jīnglǐ: guānyú yào bùyào huàn xīn de guǎnlǐruǎnjiàn, dàjiā shuōshuo zìjǐ de kànfǎ.",null,"BODY446"],["小芳: 我支持换。现在的系统太老了，经常死机，上个月就停了三次，每次都耽误发货。 (Tôi ủng hộ đổi. Hệ thống hiện tại quá cũ, hay treo, tháng trước dừng 3 lần, lần nào cũng làm chậm giao hàng.)",null,null,"Xiǎo Fāng: wǒ zhīchí huàn. Xiànzài de xìtǒng tài lǎo le, jīngcháng sǐjī, shànggèyuè jiù tíng le sāncì, měicì dōu dānwù fāhuò.",null,"BODY447"],["小海: 我反对现在换。年底是最忙的时候，大家没时间学新系统，万一出问题，影响更大。 (Tôi phản đối đổi lúc này. Cuối năm bận nhất, mọi người không có thời gian học hệ thống mới, lỡ có vấn đề thì ảnh hưởng còn lớn hơn.)",null,null,"Xiǎo Hǎi: wǒ fǎnduì xiànzài huàn. Niándǐ shì zuì máng de shíhou, dàjiā méi shíjiān xué xīn xìtǒng, wànyīchū wèntí, yǐngxiǎng gèng dà.",null,"BODY448"],["经理: 小海，你的意思是不换，还是晚一点换？ (Tiểu Hải, ý bạn là không đổi hay đổi muộn hơn?)",null,null,"Jīnglǐ: Xiǎo Hǎi, nǐ de yìsi shì bù huàn, háishì wǎnyīdiǎn huàn?",null,"BODY449"],["小海: 我不是反对换系统，而是反对在年底换。我建议明年三月以后再换。 (Tôi không phản đối đổi hệ thống, mà phản đối đổi vào cuối năm. Tôi đề nghị sau tháng 3 năm sau hãy đổi.)",null,null,"Xiǎo Hǎi: wǒ bùshì fǎnduì huàn xìtǒng, érshì fǎnduì zài niándǐ huàn. Wǒ jiànyì míngnián sānyuè yǐhòu zài huàn.",null,"BODY450"],["小芳: 可是如果系统在年底又死机怎么办？那个时候订单最多。 (Nhưng lỡ cuối năm hệ thống lại treo thì sao? Lúc đó nhiều đơn nhất.)",null,null,"Xiǎo Fāng: kěshì rúguǒ xìtǒng zài niándǐ yòu sǐjī zěnmebàn? Nàge shíhou dìngdān zuì duō.",null,"BODY451"],["小海: 我们可以先找IT部门做一次全面维护，再准备一个手工记录的备用方案。 (Có thể nhờ phòng IT bảo trì toàn diện một lần, rồi chuẩn bị phương án dự phòng ghi chép thủ công.)",null,null,"Xiǎo Hǎi: wǒmen kěyǐ xiān zhǎo IT bùmén zuò yīcì quánmiàn wéihù, zài zhǔnbèi yīgè shǒugōng jìlù de bèiyòng fāng'àn.",null,"BODY452"],["财务: 我想补充一点：新系统要两亿盾，今年的预算已经不够了，明年再买正好用明年的预算。 (Tôi bổ sung: hệ thống mới 200 triệu, ngân sách năm nay không đủ, năm sau mua vừa hay dùng ngân sách năm sau.)",null,null,"Cáiwù: wǒ xiǎng bǔchōng yīdiǎn: xīn xìtǒng yào liǎngyì dùn, jīnnián de yùsuàn yǐjīng bùgòu le, míngnián zài mǎi zhènghǎo yòng míngnián de yùsuàn.",null,"BODY453"],["小芳: 这样的话，我同意明年换，但是希望能确定一个具体的时间，不要一直拖。 (Vậy thì tôi đồng ý năm sau đổi, nhưng mong xác định thời gian cụ thể, đừng kéo dài mãi.)",null,null,"Xiǎo Fāng: zhèyàngdehuà, wǒ tóngyì míngnián huàn, dànshì xīwàng néng quèdìng yīgè jùtǐ de shíjiān, bùyào yīzhí tuō.",null,"BODY454"],["经理: 好，我觉得大家的理由都很充分。我的决定是：明年三月开始换新系统；年底之前IT部门先做一次维护。小芳负责准备备用方案。 (Được, lý do của mọi người đều thuyết phục. Quyết định của tôi: tháng 3 năm sau bắt đầu đổi hệ thống mới; trước cuối năm IT bảo trì một lần. Tiểu Phương phụ trách phương án dự phòng.)",null,null,"Jīnglǐ: hǎo, wǒ juéde dàjiā de lǐyóu dōu hěn chōngfèn. Wǒ de juédìng shì: míngnián sānyuè kāishǐ huàn xīn xìtǒng; niándǐ zhīqián IT bùmén xiān zuò yīcì wéihù. Xiǎo Fāng fùzé zhǔnbèi bèiyòng fāng'àn.",null,"BODY455"],["小芳: 好的。 (Vâng.)",null,null,"Xiǎo Fāng: hǎo de.",null,"BODY456"],["小海: 没问题，我也会帮忙。 (Không vấn đề, tôi cũng sẽ giúp.)",null,null,"Xiǎo Hǎi: méi wèntí, wǒ yě huì bāngmáng.",null,"BODY457"],["情景对话 3 — Tranh luận: Mạng xã hội có ích hay có hại cho trẻ em (chuyện đời thường)",null,null,"Qíngjǐng duìhuà",null,"BODY458-C"],["A: 我女儿才十岁，天天要玩手机看短视频，我真头疼。 (Con gái tôi mới 10 tuổi, ngày nào cũng đòi chơi điện thoại xem video ngắn, tôi đau đầu thật.)",null,null,"Wǒ nǚ'ér cái shísuì, tiāntiān yào wán shǒujī kàn duǎn shìpín, wǒ zhēn tóuténg.",null,"BODY459"],["B: 在我看来，现在的孩子不可能完全不用手机，关键是怎么管理。 (Theo tôi, trẻ con bây giờ không thể hoàn toàn không dùng điện thoại, quan trọng là quản lý thế nào.)",null,null,"Zàiwǒkànlái, xiànzài de háizi bù kěnéng wánquán bùyòng shǒujī, guānjiàn shì zěnme guǎnlǐ.",null,"BODY460"],["A: 可是短视频对孩子影响太大了，看多了注意力不集中，学习成绩也下降了。 (Nhưng video ngắn ảnh hưởng trẻ quá lớn, xem nhiều không tập trung, học hành cũng sa sút.)",null,null,"Kěshì duǎn shìpín duì háizi yǐngxiǎng tài dà le, kàn duō le zhùyìlì bù jízhōng, xuéxíchéngjì yě xiàjiàng le.",null,"BODY461"],["B: 不可否认，有这方面的问题。不过也有很多学习的内容，比如我儿子就是在网上学会画画的。 (Không thể phủ nhận có vấn đề đó. Nhưng cũng nhiều nội dung học tập, như con trai tôi học vẽ trên mạng.)",null,null,"Bùkěfǒurèn, yǒu zhèfāngmiàn de wèntí. Bùguò yě yǒu hěnduō xuéxí de nèiróng, bǐrú wǒ érzi jiùshì zài wǎngshàng xuéhuì huàhuà de.",null,"BODY462"],["A: 那只是个别例子吧？大部分孩子看的都是没用的东西。 (Đó chỉ là ví dụ cá biệt thôi? Phần lớn trẻ xem toàn thứ vô bổ.)",null,null,"Nà zhǐshì gèbié lìzi ba? Dàbùfen háizi kàn de dōu shì méiyòng de dōngxi.",null,"BODY463"],["B: 所以家长要帮孩子选内容啊。举个例子，我给儿子的手机设置了儿童模式，每天只能用一个小时。 (Vậy nên phụ huynh phải giúp con chọn nội dung. Ví dụ tôi cài chế độ trẻ em cho điện thoại con, mỗi ngày chỉ dùng một tiếng.)",null,null,"Suǒyǐ jiāzhǎng yào bāng háizi xuǎn nèiróng a. Jǔ gè lìzi, wǒ gěi érzi de shǒujī shèzhì le értóng móshì, měitiān zhǐnéng yòng yīgè xiǎoshí.",null,"BODY464"],["A: 一个小时他就满足了吗？ (Một tiếng thì cháu chịu à?)",null,null,"Yīgè xiǎoshí tā jiù mǎnzú le ma?",null,"BODY465"],["B: 一开始也闹，后来我们约定：周末全家一起去公园或者爬山，他就没那么想玩手机了。 (Lúc đầu cũng quấy, sau chúng tôi giao hẹn: cuối tuần cả nhà đi công viên hoặc leo núi, cháu không còn thèm điện thoại lắm.)",null,null,"Yī kāishǐ yě nào, hòulái wǒmen yuēdìng: zhōumò quánjiā yīqǐ qù gōngyuán huòzhě páshān, tā jiù méi nàme xiǎng wán shǒujī le.",null,"BODY466"],["A: 这个办法好。说到底，孩子玩手机，可能是因为大人没时间陪他们。 (Cách này hay. Suy cho cùng, trẻ chơi điện thoại có lẽ vì người lớn không có thời gian bên chúng.)",null,null,"Zhège bànfǎ hǎo. Shuōdàodǐ, háizi wán shǒujī, kěnéng shìyīnwèi dàrén méi shíjiān péi tāmen.",null,"BODY467"],["B: 对，我也是这么想的。家长自己也要少看手机，给孩子做个榜样。 (Đúng, tôi cũng nghĩ vậy. Phụ huynh cũng phải bớt xem điện thoại, làm gương cho con.)",null,null,"Duì, wǒ yě shì zhème xiǎng de. Jiāzhǎng zìjǐ yě yào shǎo kàn shǒujī, gěi háizi zuò gè bǎngyàng.",null,"BODY468"],["A: 总的来说，不是手机的问题，是我们怎么用的问题。 (Tóm lại không phải lỗi điện thoại, mà là vấn đề chúng ta dùng thế nào.)",null,null,"Zǒngdeláishuō, bùshì shǒujī de wèntí, shì wǒmen zěnme yòng de wèntí.",null,"BODY469"],["情景对话 4 — Nêu quan điểm với sếp: đề xuất tăng lương cho công nhân để giảm nghỉ việc",null,null,"Qíngjǐng duìhuà",null,"BODY470-C"],["小阮: 经理，关于工人流失的问题，我想说说我的看法。 (Giám đốc, về vấn đề công nhân nghỉ việc, em muốn nói quan điểm của mình.)",null,null,"Xiǎo Ruǎn: jīnglǐ, guānyú gōngrén liúshī de wèntí, wǒ xiǎng shuōshuo wǒ de kànfǎ.",null,"BODY471"],["经理: 好，你说。 (Được, bạn nói đi.)",null,null,"Jīnglǐ: hǎo, nǐ shuō.",null,"BODY472"],["小阮: 我个人认为，我们应该把普通工人的工资提高百分之八。 (Cá nhân em cho rằng nên tăng lương công nhân phổ thông 8%.)",null,null,"Xiǎo Ruǎn: wǒ gèrén rènwéi, wǒmen yīnggāi bǎ pǔtōnggōngrén de gōngzī tígāo bǎifēnzhībā.",null,"BODY473"],["经理: 百分之八？成本会增加很多啊。你的理由是什么？ (8%? Chi phí tăng nhiều lắm. Lý do của bạn là gì?)",null,null,"Jīnglǐ: bǎifēnzhībā? Chéngběn huì zēngjiā hěnduō a. Nǐ de lǐyóu shì shénme?",null,"BODY474"],["小阮: 主要有两个理由。第一，我们现在的工资比旁边工业区的工厂低了大概一百万盾，这是工人离职的最主要原因。 (Chủ yếu 2 lý do. Một, lương hiện tại thấp hơn các nhà máy khu công nghiệp bên cạnh khoảng 1 triệu, đó là nguyên nhân chính khiến công nhân nghỉ.)",null,null,"Xiǎo Ruǎn: zhǔyào yǒu liǎnggè lǐyóu. Dìyī, wǒmen xiànzài de gōngzī bǐ pángbiān gōngyèqū de gōngchǎng dī le dàgài yībǎiwàn dùn, zhè shì gōngrén lízhí de zuì zhǔyào yuányīn.",null,"BODY475"],["小阮: 第二，每走一个工人，我们重新招聘和培训要花大概五百万盾，新工人的效率还要两个月才能上来。 (Hai, mỗi công nhân nghỉ, tuyển và đào tạo lại tốn khoảng 5 triệu, hiệu suất công nhân mới phải 2 tháng mới lên.)",null,null,"Xiǎo Ruǎn: dì'èr, měi zǒu yīgè gōngrén, wǒmen chóngxīn zhāopìn hé péixùn yào huā dàgài wǔbǎiwàn dùn, xīn gōngrén de xiàolǜ háiyào liǎnggè yuè cáinéng shànglái.",null,"BODY476"],["经理: 你有数据吗？ (Bạn có số liệu không?)",null,null,"Jīnglǐ: nǐ yǒu shùjù ma?",null,"BODY477"],["小阮: 有。今年一共走了一百二十个工人，光招聘和培训就花了六亿盾，还没算效率的损失。如果涨工资，一年大概多花五亿。 (Có ạ. Năm nay tổng cộng 120 công nhân nghỉ, chỉ tuyển dụng và đào tạo đã tốn 600 triệu, chưa tính thiệt hại hiệu suất. Nếu tăng lương, mỗi năm tốn thêm khoảng 500 triệu.)",null,null,"Xiǎo Ruǎn: yǒu. Jīnnián yīgòng zǒu le yībǎi'èrshígè gōngrén, guāng zhāopìn hé péixùn jiù huā le liùyì dùn, hái méi suàn xiàolǜ de sǔnshī. Rúguǒ zhǎnggōngzī, yīnián dàgài duō huā wǔyì.",null,"BODY478"],["经理: 可是涨了工资，工人就一定不走吗？ (Nhưng tăng lương rồi công nhân có chắc không đi?)",null,null,"Jīnglǐ: kěshì zhǎngle gōngzī, gōngrén jiù yīdìng bù zǒu ma?",null,"BODY479"],["小阮: 不一定全部留下来，但是我们去年做过调查，百分之六十五的离职工人说是因为工资。举个例子，二号线的组长去了隔壁的工厂，工资多了一百二十万盾。 (Chưa chắc giữ được hết, nhưng năm ngoái chúng ta khảo sát, 65% công nhân nghỉ nói vì lương. Ví dụ tổ trưởng chuyền 2 sang nhà máy bên cạnh, lương hơn 1,2 triệu.)",null,null,"Xiǎo Ruǎn: bù yīdìng quánbù liúxiàlái, dànshì wǒmen qùnián zuò guò diàochá, bǎifēnzhīliùshíwǔ de lízhí gōngrén shuō shìyīnwèi gōngzī. Jǔ gè lìzi, èrhàoxiàn de zǔzhǎng qù le gébì de gōngchǎng, gōngzī duō le yībǎi'èrshíwàn dùn.",null,"BODY480"],["经理: 嗯，这个数据很有说服力。不过一次涨百分之八，压力还是有点大。 (Ừm, số liệu này rất thuyết phục. Nhưng tăng một lần 8% áp lực vẫn hơi lớn.)",null,null,"Jīnglǐ: ń, zhège shùjù hěn yǒu shuōfúlì. Bùguò yīcì zhǎng bǎifēnzhībā, yālì háishì yǒudiǎn dà.",null,"BODY481"],["小阮: 我理解。那我们能不能分两次：一月先涨百分之五，七月再根据流失率决定要不要再涨百分之三？ (Em hiểu. Vậy chia 2 lần được không: tháng 1 tăng 5% trước, tháng 7 dựa vào tỷ lệ nghỉ việc quyết định có tăng thêm 3% không?)",null,null,"Xiǎo Ruǎn: wǒ lǐjiě. Nà wǒmen néng bùnéng fēn liǎngcì: yīyuè xiān zhǎng bǎifēnzhīwǔ, qīyuè zài gēnjù liúshīlǜ juédìng yào bùyào zài zhǎng bǎifēnzhīsān?",null,"BODY482"],["经理: 这个方案比较稳妥。你写一份详细的报告，下周一交给我。 (Phương án này khá chắc chắn. Bạn viết báo cáo chi tiết, thứ 2 tuần sau nộp tôi.)",null,null,"Jīnglǐ: zhège fāng'àn bǐjiào wěntuǒ. Nǐ xiě yīfèn xiángxì de bàogào, xiàzhōuyī jiāogěi wǒ.",null,"BODY483"],["小阮: 好的，谢谢经理！ (Vâng, cảm ơn giám đốc!)",null,null,"Xiǎo Ruǎn: hǎo de, xièxie jīnglǐ!",null,"BODY484"],["情景对话 5 — (HSK5) Tranh luận làm việc từ xa: bảo vệ quan điểm trước phản ví dụ",null,null,"Qíngjǐng duìhuà",null,"BODY485-C"],["主持人: 今天讨论的问题是：公司要不要允许员工每周在家办公两天？小林支持，阿海反对。小林先说。 (Chủ đề hôm nay: công ty có nên cho nhân viên làm ở nhà 2 ngày/tuần không? Tiểu Lâm ủng hộ, A Hải phản đối. Tiểu Lâm nói trước.)",null,null,"Zhǔchírén: jīntiān tǎolùn de wèntí shì: gōngsī yào bùyào yǔnxǔ yuángōng měizhōu zàijiā bàngōng liǎngtiān? Xiǎo Lín zhīchí, Ā Hǎi fǎnduì. Xiǎo Lín xiān shuō.",null,"BODY486"],["小林: 我认为应该允许。第一，员工每天在路上要花一到两个小时，在家办公能节省时间；第二，疫情期间我们已经试过，大部分工作在家都能完成。 (Tôi cho rằng nên cho phép. Một, nhân viên mỗi ngày mất 1–2 tiếng đi đường, làm ở nhà tiết kiệm thời gian; hai, thời dịch chúng ta đã thử, phần lớn việc làm ở nhà được.)",null,null,"Xiǎo Lín: wǒ rènwéi yīnggāi yǔnxǔ. Dìyī, yuángōng měitiān zài lùshàng yào huā yī dào liǎnggè xiǎoshí, zàijiā bàngōng néng jiéshěngshíjiān; dì'èr, yìqíng qījiān wǒmen yǐjīng shì guò, dàbùfen gōngzuò zàijiā dōu néng wánchéng.",null,"BODY487"],["阿海: 我不同意。不可否认，在家办公能节省时间，但是沟通效率会下降。很多问题当面五分钟就能说清楚，在网上要来回发半天消息。 (Tôi không đồng ý. Không thể phủ nhận làm ở nhà tiết kiệm thời gian, nhưng hiệu quả giao tiếp giảm. Nhiều việc gặp mặt 5 phút nói rõ, trên mạng nhắn qua lại nửa ngày.)",null,null,"Ā Hǎi: wǒ bù tóngyì. Bùkěfǒurèn, zàijiā bàngōng néng jiéshěngshíjiān, dànshì gōutōng xiàolǜ huì xiàjiàng. Hěnduō wèntí dāngmiàn wǔfēnzhōng jiù néng shuō qīngchu, zài wǎngshàng yào láihuí fā bàntiān xiāoxi.",null,"BODY488"],["小林: 你说的情况确实存在，不过可以通过视频会议解决。而且研究表明，在家办公的员工效率平均提高了百分之十三。 (Trường hợp bạn nói có thật, nhưng có thể giải quyết bằng họp video. Hơn nữa nghiên cứu cho thấy nhân viên làm ở nhà hiệu suất trung bình tăng 13%.)",null,null,"Xiǎo Lín: nǐ shuō de qíngkuàng quèshí cúnzài, bùguò kěyǐ tōngguò shìpínhuìyì jiějué. Érqiě yánjiū biǎomíng, zàijiā bàngōng de yuángōng xiàolǜ píngjūn tígāo le bǎifēnzhīshísān.",null,"BODY489"],["阿海: 那是国外的研究，不一定适合越南。举个例子，疫情的时候我们部门在家办公，有两个同事经常找不到人。 (Đó là nghiên cứu nước ngoài, chưa chắc phù hợp VN. Ví dụ hồi dịch phòng tôi làm ở nhà, có 2 đồng nghiệp hay không liên lạc được.)",null,null,"Ā Hǎi: nà shì guówài de yánjiū, bù yīdìng shìhé Yuènán. Jǔ gè lìzi, yìqíng de shíhou wǒmen bùmén zàijiā bàngōng, yǒu liǎnggè tóngshì jīngcháng zhǎo bùdào rén.",null,"BODY490"],["小林: 那只是个别例子，不能一概而论。我们可以用结果来考核，而不是看他是不是一直在线。 (Đó chỉ là cá biệt, không thể vơ đũa cả nắm. Có thể đánh giá theo kết quả, chứ không phải xem có online liên tục không.)",null,null,"Xiǎo Lín: nà zhǐshì gèbié lìzi, bùnéng yīgài'érlùn. Wǒmen kěyǐ yòng jiéguǒ lái kǎohé, ér bùshì kàn tā shìbùshì yīzhí zàixiàn.",null,"BODY491"],["阿海: 可是有些岗位根本不能在家做，比如仓库和生产，这样对他们不公平。 (Nhưng có vị trí không thể làm ở nhà, như kho và sản xuất, vậy không công bằng với họ.)",null,null,"Ā Hǎi: kěshì yǒuxiē gǎngwèi gēnběn bùnéng zàijiā zuò, bǐrú cāngkù hé shēngchǎn, zhèyàng duì tāmen bù gōngpíng.",null,"BODY492"],["小林: 这一点我承认。所以我的建议是只针对办公室岗位，生产岗位可以用别的福利来补偿，比如弹性排班。 (Điểm này tôi thừa nhận. Nên đề xuất của tôi chỉ áp dụng vị trí văn phòng, vị trí sản xuất có thể bù bằng phúc lợi khác, như xếp ca linh hoạt.)",null,null,"Xiǎo Lín: zhè yīdiǎn wǒ chéngrèn. Suǒyǐ wǒ de jiànyì shì zhǐ zhēnduì bàngōngshì gǎngwèi, shēngchǎn gǎngwèi kěyǐ yòng biéde fúlì lái bǔcháng, bǐrú tánxìng páibān.",null,"BODY493"],["阿海: 就算只针对办公室，新员工在家也很难学到东西，因为没有人在旁边带。 (Cho dù chỉ áp dụng văn phòng, nhân viên mới làm ở nhà cũng khó học hỏi vì không có người kèm bên cạnh.)",null,null,"Ā Hǎi: jiùsuàn zhǐ zhēnduì bàngōngshì, xīn yuángōng zàijiā yě hěn nán xuédào dōngxi, yīnwèi méiyǒu rén zài pángbiān dài.",null,"BODY494"],["小林: 你说得有道理。那我修改一下我的观点：入职满一年的员工才可以申请在家办公。 (Bạn nói có lý. Vậy tôi điều chỉnh quan điểm: nhân viên làm đủ một năm mới được đăng ký làm ở nhà.)",null,null,"Xiǎo Lín: nǐ shuō de yǒu dàolǐ. Nà wǒ xiūgǎi yīxià wǒ de guāndiǎn: rùzhí mǎn yīnián de yuángōng cái kěyǐ shēnqǐng zàijiā bàngōng.",null,"BODY495"],["阿海: 这样的话，我的反对意见就少多了。不过我还是建议先试三个月，用数据说话。 (Vậy thì ý kiến phản đối của tôi giảm nhiều. Nhưng tôi vẫn đề nghị thử 3 tháng trước, để số liệu lên tiếng.)",null,null,"Ā Hǎi: zhèyàngdehuà, wǒ de fǎnduì yìjiàn jiù shǎo duō le. Bùguò wǒ háishì jiànyì xiān shì sāngè yuè, yòng shùjù shuōhuà.",null,"BODY496"],["主持人: 看来双方的观点越来越接近了。总结一下：办公室岗位、入职满一年的员工，每周可以在家办公两天，先试行三个月。 (Xem ra quan điểm hai bên ngày càng gần nhau. Tổng kết: vị trí văn phòng, nhân viên làm đủ một năm, mỗi tuần làm ở nhà 2 ngày, thử 3 tháng trước.)",null,null,"Zhǔchírén: kànlái shuāngfāng de guāndiǎn yuèláiyuè jiējìn le. Zǒngjié yīxià: bàngōngshì gǎngwèi, rùzhí mǎn yīnián de yuángōng, měizhōu kěyǐ zàijiā bàngōng liǎngtiān, xiān shìxíng sāngè yuè.",null,"BODY497"],["小林: 我同意。 (Tôi đồng ý.)",null,null,"Xiǎo Lín: wǒ tóngyì.",null,"BODY498"],["阿海: 我也同意。 (Tôi cũng đồng ý.)",null,null,"Ā Hǎi: wǒ yě tóngyì.",null,"BODY499"],["BÀI NÓI MẪU — Nêu quan điểm 2 phút theo khung PREP (HSK4–5)",null,null,null,null,"BODY500-C"],["我个人认为，公司应该每年组织员工旅游一次。主要有两个理由：第一，旅游能让大家放松，一年工作下来压力都很大，放松以后工作效率会更高；第二，旅游能增进同事之间的感情，平时大家都在不同的部门，很少有机会聊天。举个例子，去年我们公司去了下龙湾，在船上我跟仓库的同事聊了一个晚上，后来我们的工作配合得特别顺利，有什么问题打个电话就解决了。当然，不可否认，旅游要花不少钱，但是从长远来看，员工开心了，离职率低了，公司其实是赚了。总的来说，我认为员工旅游不是浪费，而是一种投资。",null,null,"Wǒ gèrén rènwéi, gōngsī yīnggāi měinián zǔzhī yuángōng lǚyóu yīcì. Zhǔyào yǒu liǎnggè lǐyóu: dìyī, lǚyóu néng ràng dàjiā fàngsōng, yīnián gōngzuò xiàlái yālì dōu hěndà, fàngsōng yǐhòu gōngzuòxiàolǜ huì gèng gāo; dì'èr, lǚyóu néng zēngjìn tóngshì zhījiān de gǎnqíng, píngshí dàjiā dōu zài bùtóng de bùmén, hěnshǎo yǒu jīhuì liáotiān. Jǔ gè lìzi, qùnián wǒmen gōngsī qù le Xiàlóng Wān, zài chuánshàng wǒ gēn cāngkù de tóngshì liáo le yīgè wǎnshàng, hòulái wǒmen de gōngzuò pèihé de tèbié shùnlì, yǒu shénme wèntí dǎ gè diànhuà jiù jiějué le. Dāngrán, bùkěfǒurèn, lǚyóu yào huā bùshǎo qián, dànshì cóng chángyuǎn láikàn, yuángōng kāixīn le, lízhí lǜ dī le, gōngsī qíshí shì zhuàn le. Zǒngdeláishuō, wǒ rènwéi yuángōng lǚyóu bùshì làngfèi, érshì yīzhǒng tóuzī.",null,"BODY501"],["引导练习 GUIDED SPEAKING — GV đưa đề, HS nói 1–2 phút theo PREP; GV phản biện 1 lần",null,null,"Yǐndǎo liànxí",null,"BODY502-C"],["1. Hỏi: 你觉得应该先买房还是先买车？ (Nên mua nhà trước hay mua xe trước?)",null,null,"Nǐ juéde yīnggāi xiān mǎifáng háishì xiānmǎi chē?",null,"BODY503"],["Đáp: 我认为应该先买房。第一，房子会升值，车会贬值；第二，有了房子生活更稳定。举个例子，我同事五年前在河内买了房，现在价格涨了一倍。所以我觉得先买房更划算。 (Nên mua nhà trước. Một, nhà tăng giá, xe mất giá; hai, có nhà cuộc sống ổn định hơn. Ví dụ đồng nghiệp tôi 5 năm trước mua nhà ở Hà Nội, giờ giá tăng gấp đôi. Nên tôi thấy mua nhà trước hời hơn.)",null,null,"Wǒ rènwéi yīnggāi xiān mǎifáng. Dìyī, fángzi huì shēngzhí, chē huì biǎnzhí; dì'èr, yǒu le fángzi shēnghuó gèng wěndìng. Jǔ gè lìzi, wǒ tóngshì wǔnián qián zài Hénèi mǎi le fáng, xiànzài jiàgé zhǎngle yībèi. Suǒyǐ wǒ juéde xiān mǎifáng gèng huásuàn.",null,"BODY504"],["2. Hỏi: 你同意\"年轻人应该多换工作\"吗？ (Bạn có đồng ý \"người trẻ nên đổi việc nhiều\" không?)",null,null,"Nǐ tóngyì \"niánqīngrén yīnggāi duō huàn gōngzuò\" ma?",null,"BODY505"],["Đáp: 我不完全同意。年轻的时候换一两次可以多了解自己适合什么，但是换得太频繁，简历不好看，也积累不了深的经验。 (Không hoàn toàn đồng ý. Lúc trẻ đổi 1–2 lần để hiểu mình hợp gì, nhưng đổi quá thường xuyên thì CV xấu, cũng không tích lũy được kinh nghiệm sâu.)",null,null,"Wǒ bù wánquántóngyì. Niánqīng de shíhou huàn yīliǎngcì kěyǐ duō liǎojiě zìjǐ shìhé shénme, dànshì huàn de tài pínfán, jiǎnlì bù hǎokàn, yě jīlěi bùliǎo shēn de jīngyàn.",null,"BODY506"],["3. Hỏi: (HSK5) 有人说AI会让很多人失业，你怎么看？ (Có người nói AI sẽ khiến nhiều người thất nghiệp, bạn nghĩ sao?)",null,null,"Yǒurén shuō AI huì ràng hěnduō rén shīyè, nǐ zěnme kàn?",null,"BODY507"],["Đáp: 不可否认，AI会取代一部分重复性的工作，比如简单的翻译和数据录入。但是在我看来，它也会创造新的工作。关键是我们要不断学习，学会用AI提高自己的效率，而不是害怕它。 (Không thể phủ nhận AI sẽ thay thế một phần công việc lặp lại như dịch đơn giản và nhập liệu. Nhưng theo tôi nó cũng tạo ra việc làm mới. Quan trọng là liên tục học, biết dùng AI nâng cao hiệu suất của mình chứ không sợ nó.)",null,null,"Bùkěfǒurèn, AI huì qǔdài yībùfen chóngfùxìng de gōngzuò, bǐrú jiǎndān de fānyì hé shùjùlùrù. Dànshì zàiwǒkànlái, tā yě huì chuàngzào xīn de gōngzuò. Guānjiàn shì wǒmen yào bùduàn xuéxí, xuéhuì yòng AI tígāo zìjǐ de xiàolǜ, ér bùshì hàipà tā.",null,"BODY508"],["情景模拟 ROLE-PLAY — Tranh luận làm việc từ xa: HS ủng hộ, GV phản đối. Vòng 2 (bất ngờ): GV đổi vai, HS phải phản đối chính quan điểm vừa bảo vệ",null,null,"Qíngjǐng mónǐ",null,"BODY509-C"],["GV: 我认为在家办公会让员工变懒。 (Tôi cho rằng làm ở nhà khiến nhân viên lười đi.)",null,null,"Wǒ rènwéi zàijiā bàngōnghuì ràng yuángōng biàn lǎn.",null,"BODY510"],["HS: 我不太同意。在我看来，懒不懒跟在哪里工作关系不大，关键是怎么考核。 (Tôi không đồng ý lắm. Theo tôi lười hay không ít liên quan đến nơi làm, quan trọng là cách đánh giá.)",null,null,"Wǒ bù tài tóngyì. Zàiwǒkànlái, lǎn bù lǎn gēn zài nǎlǐ gōngzuò guānxibùdà, guānjiàn shì zěnme kǎohé.",null,"BODY511"],["GV: 可是在家没有人监督啊。 (Nhưng ở nhà không ai giám sát.)",null,null,"Kěshì zàijiā méiyǒu rén jiāndū a.",null,"BODY512"],["HS: 我们可以每天早上开十分钟视频会，每周看完成了多少任务。举个例子，我朋友的公司就是这样做的，效率一点也没下降。 (Mỗi sáng họp video 10 phút, mỗi tuần xem hoàn thành bao nhiêu việc. Ví dụ công ty bạn tôi làm vậy, hiệu suất không hề giảm.)",null,null,"Wǒmen kěyǐ měitiān zǎoshang kāi shífēnzhōng shìpín huì, měizhōu kàn wánchéng le duōshǎo rènwù. Jǔ gè lìzi, wǒ péngyou de gōngsī jiùshì zhèyàng zuò de, xiàolǜ yīdiǎn yě méi xiàjiàng.",null,"BODY513"],["GV: 那团队精神呢？大家见不到面，感情会越来越淡。 (Còn tinh thần đồng đội? Không gặp mặt, tình cảm ngày càng nhạt.)",null,null,"Nà tuánduìjīngshén ne? Dàjiā jiàn bùdào miàn, gǎnqíng huì yuèláiyuè dàn.",null,"BODY514"],["HS: 这一点你说得有道理。所以我建议每周至少来公司两三天，在家办公不是全部，只是一部分。 (Điểm này bạn nói có lý. Nên tôi đề nghị mỗi tuần ít nhất lên công ty 2–3 ngày, làm ở nhà không phải toàn bộ, chỉ là một phần.)",null,null,"Zhè yīdiǎn nǐ shuō de yǒu dàolǐ. Suǒyǐ wǒ jiànyì měizhōu zhìshǎo lái gōngsī liǎngsāntiān, zàijiā bàngōng bùshì quánbù, zhǐshì yībùfen.",null,"BODY515"],["GV (biến cố): 好，现在换过来，请你说说反对在家办公的理由。 (Được, giờ đổi lại, mời bạn nói lý do phản đối làm ở nhà.)",null,null,"Hǎo, xiànzài huànguòlái, qǐng nǐ shuōshuo fǎnduì zàijiā bàngōng de lǐyóu.",null,"BODY516"],["HS: 好的。从公司的角度来看，在家办公有三个问题：第一，信息安全有风险；第二，新员工很难得到指导；第三，跨部门沟通慢。总的来说，我认为它只适合一部分有经验的员工。 (Vâng. Từ góc độ công ty, làm ở nhà có 3 vấn đề: một, rủi ro an toàn thông tin; hai, nhân viên mới khó được hướng dẫn; ba, giao tiếp liên phòng ban chậm. Tóm lại, tôi cho rằng nó chỉ phù hợp một bộ phận nhân viên có kinh nghiệm.)",null,null,"Hǎo de. Cóng gōngsī de jiǎodù láikàn, zàijiā bàngōng yǒu sāngè wèntí: dìyī, xìnxī'ānquán yǒu fēngxiǎn; dì'èr, xīn yuángōng hěn nán dédào zhǐdǎo; dìsān, kuàbùmén gōutōng màn. Zǒngdeláishuō, wǒ rènwéi tā zhǐ shìhé yībùfen yǒu jīngyàn de yuángōng.",null,"BODY517"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY518-C"],["✗ 我想你说得不对。 → ✓ 我觉得这个说法不太对。/ 我不太同意你的看法。 (想 không dùng để nêu quan điểm như \"think\" trong tiếng Anh.)",null,null,"Wǒ xiǎng nǐ shuō de bù duì. | Wǒ juéde zhège shuōfǎ bù tài duì. / | Wǒ bù tài tóngyì nǐ de kànfǎ. | Xiǎng",null,"BODY519"],["✗ 我同意和你。 → ✓ 我同意你的看法。/ 我跟你的想法一样。",null,null,"Wǒ tóngyì hé nǐ. | Wǒ tóngyì nǐ de kànfǎ. / | Wǒ gēn nǐ de xiǎngfǎ yīyàng.",null,"BODY520"],["✗ 我的观点是我认为…… (lặp) → ✓ 我认为……/ 我的观点是……",null,null,"Wǒ de guāndiǎn shì wǒ rènwéi…… | Wǒ rènwéi…… / | Wǒ de guāndiǎn shì……",null,"BODY521"],["✗ 例如说…… → ✓ 比如说……/ 举个例子……",null,null,"Lìrú shuō…… | Bǐrúshuō…… / | Jǔ gè lìzi……",null,"BODY522"],["✗ 因为……所以……因为……所以…… (lặp) → ✓ 第一……；第二……；所以……",null,null,"Yīnwèi…… suǒyǐ…… yīnwèi…… suǒyǐ…… | Dìyī……; dì'èr……; suǒyǐ……",null,"BODY523"],["✗ 你错了！ (gay gắt) → ✓ 我有一点不同的想法。/ 这个问题我们可以换个角度看。",null,null,"Nǐ cuò le! | Wǒ yǒu yīdiǎn bùtóng de xiǎngfǎ. / | Zhège wèntí wǒmen kěyǐ huàn gè jiǎodùkàn.",null,"BODY524"],["Phát âm: 观点 guāndiǎn; 立场 lìchǎng; 证据 zhèngjù; 反对 fǎnduì; 一概而论 yīgài'érlùn.",null,null,"Guāndiǎn | Lìchǎng | Zhèngjù | Fǎnduì | Yīgài'érlùn",null,"BODY525"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY526-C"],["Ghi âm nêu quan điểm 2–4 phút về 1 trong 3 đề: (1) Có nên làm việc ở nhà không? (2) Bằng cấp hay kinh nghiệm quan trọng hơn? (3) Có nên cho trẻ dùng điện thoại không?",null,null,null,null,"BODY527"],["Bắt buộc theo khung PREP, có ít nhất 1 ví dụ thật và 1 câu phản biện trước (不可否认……但是……).",null,null,"Bùkěfǒurèn…… dànshì……",null,"BODY528"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY529"],["Buổi 14 — 比较选择与做决定 So sánh và quyết định",null,null,"Bǐjiào xuǎnzé yǔ zuò juédìng",null,"BODY530-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY531-C"],["HSK4: So sánh 2 sản phẩm / 2 công việc / 2 nơi ở. HSK5: Chọn nhà cung cấp dựa trên 4 tiêu chí (giá – chất lượng – thời gian giao – dịch vụ) và giải thích quyết định.",null,null,null,null,"BODY532"],["Khung ra quyết định 4 bước: ① 列出选项 Liệt kê lựa chọn → ② 定标准 Đặt tiêu chí → ③ 比较优缺点 So sánh ưu nhược → ④ 做决定并说明理由 Quyết định và giải thích.",null,null,"Lièchū xuǎnxiàng | Dìng biāozhǔn | Bǐjiào yōuquēdiǎn | Zuò juédìng bìng shuōmíng lǐyóu",null,"BODY533"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY535-C"],["1. Hỏi: 你最近做过什么比较难的决定？ (Gần đây bạn đưa ra quyết định nào khá khó?)",null,null,"Nǐ zuìjìn zuò guò shénme bǐjiào nán de juédìng?",null,"BODY536"],["Đáp: 上个月我在两个工作机会之间选了很久，一个工资高，一个离家近，最后我选了离家近的。 (Tháng trước tôi phân vân rất lâu giữa 2 cơ hội việc làm, một lương cao, một gần nhà, cuối cùng chọn gần nhà.)",null,null,"Shànggèyuè wǒ zài liǎnggè gōngzuò jīhuì zhījiān xuǎn le hěn jiǔ, yīgè gōngzī gāo, yīgè líjiājìn, zuìhòu wǒ xuǎn le líjiājìn de.",null,"BODY537"],["2. Hỏi: 你买手机的时候，最看重哪一点？ (Mua điện thoại bạn coi trọng điểm nào nhất?)",null,null,"Nǐ mǎishǒujī de shíhou, zuì kànzhòng nǎyīdiǎn?",null,"BODY538"],["Đáp: 我最看重电池和拍照，因为我经常出差，要拍很多产品的照片。 (Tôi coi trọng pin và chụp ảnh nhất vì hay đi công tác, phải chụp nhiều ảnh sản phẩm.)",null,null,"Wǒ zuì kànzhòng diànchí hé pāizhào, yīnwèi wǒ jīngcháng chūchāi, yào pāi hěnduō chǎnpǐn de zhàopiàn.",null,"BODY539"],["3. Hỏi: 你做决定的时候，是比较快还是比较慢？ (Khi quyết định, bạn nhanh hay chậm?)",null,null,"Nǐ zuò juédìng de shíhou, shì bǐjiào kuài háishì bǐjiàomàn?",null,"BODY540"],["Đáp: 小事我很快，大事我会考虑很久，还会问问家人的意见。 (Việc nhỏ tôi quyết nhanh, việc lớn cân nhắc lâu, còn hỏi ý kiến gia đình.)",null,null,"Xiǎoshì wǒ hěnkuài, dàshì wǒhuì kǎolǜ hěn jiǔ, hái huì wènwen jiārén de yìjiàn.",null,"BODY541"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY542-C"],["1. 优点 / 缺点 (ưu điểm / nhược điểm): 这款车的优点是省油，缺点是空间小。 (Ưu điểm mẫu xe này là tiết kiệm xăng, nhược điểm là không gian nhỏ.)",null,null,"Yōudiǎn | Quēdiǎn | Zhè kuǎn chē de yōudiǎn shì shěngyóu, quēdiǎn shì kōngjiān xiǎo.",null,"BODY543"],["2. 成本 (chi phí, giá thành): 自己生产的成本比外包高百分之二十。 (Tự sản xuất chi phí cao hơn thuê ngoài 20%.)",null,null,"Chéngběn | Zìjǐ shēngchǎn de chéngběn bǐ wài bāo gāo bǎifēnzhī'èrshí.",null,"BODY544"],["3. 效率 (hiệu suất, hiệu quả): 新机器的效率是旧机器的两倍。 (Hiệu suất máy mới gấp đôi máy cũ.)",null,null,"Xiàolǜ | Xīn jīqì de xiàolǜ shì jiù jīqì de liǎngbèi.",null,"BODY545"],["4. 风险 (rủi ro): 只用一家供应商，风险太大了。 (Chỉ dùng một NCC rủi ro quá lớn.)",null,null,"Fēngxiǎn | Zhǐyòng yījiā gōngyìngshāng, fēngxiǎn tài dà le.",null,"BODY546"],["5. 权衡 (cân nhắc, đong đếm): 我权衡了很久，最后决定留在现在的公司。 (Tôi cân nhắc rất lâu, cuối cùng quyết định ở lại công ty hiện tại.)",null,null,"Quánhéng | Wǒ quánhéng le hěn jiǔ, zuìhòu juédìng liúzài xiànzài de gōngsī.",null,"BODY547"],["6. 取舍 (lấy hay bỏ, đánh đổi): 时间和质量之间，有时候必须做出取舍。 (Giữa thời gian và chất lượng, đôi khi phải đánh đổi.)",null,null,"Qǔshě | Shíjiān hé zhìliàng zhījiān, yǒushíhou bìxū zuòchū qǔshě.",null,"BODY548"],["7. 各有优缺点 (mỗi bên đều có ưu nhược): 两个方案各有优缺点，关键看我们最需要什么。 (Hai phương án mỗi cái có ưu nhược, quan trọng là chúng ta cần gì nhất.)",null,null,"Gè yǒu yōuquēdiǎn | Liǎnggè fāng'àn gè yǒu yōuquēdiǎn, guānjiàn kàn wǒmen zuì xūyào shénme.",null,"BODY549"],["8. 性价比 (giá trị so với giá tiền): 综合来看，B公司的性价比更高。 (Xét tổng thể, công ty B đáng tiền hơn.)",null,null,"Xìngjiàbǐ | Zōnghé láikàn, B gōngsī de xìngjiàbǐ gèng gāo.",null,"BODY550"],["9. 长远 / 短期 (lâu dài / ngắn hạn): 短期来看省钱，长远来看可能更贵。 (Ngắn hạn tiết kiệm, lâu dài có thể đắt hơn.)",null,null,"Chángyuǎn | Duǎnqī | Duǎnqī láikàn shěngqián, chángyuǎn láikàn kěnéng gèng guì.",null,"BODY551"],["10. 标准 (tiêu chuẩn, tiêu chí): 我们选供应商有四个标准。 (Chúng tôi chọn NCC theo 4 tiêu chí.)",null,null,"Biāozhǔn | Wǒmen xuǎn gōngyìngshāng yǒu sìgè biāozhǔn.",null,"BODY552"],["11. 犹豫 (do dự): 别犹豫了，机会不等人。 (Đừng do dự nữa, cơ hội không chờ người.)",null,null,"Yóuyù | Bié yóuyù le, jīhuì bù děng rén.",null,"BODY553"],["12. 综合考虑 (cân nhắc tổng thể): 综合考虑价格、质量和服务，我们选择了第二家。 (Cân nhắc tổng thể giá, chất lượng và dịch vụ, chúng tôi chọn nhà thứ hai.)",null,null,"Zōnghé kǎolǜ | Zōnghé kǎolǜ jiàgé, zhìliàng hé fúwù, wǒmen xuǎnzé le dì'èrjiā.",null,"BODY554"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY555-C"],["1. A比B……，但是B比A…… (A … hơn B, nhưng B … hơn A)",null,null,"A bǐ B……, dànshì B bǐ A……",null,"BODY556"],["Ví dụ: 这家酒店比那家便宜，但是那家比这家离海边近。 (Khách sạn này rẻ hơn khách sạn kia, nhưng khách sạn kia gần biển hơn.)",null,null,"Zhèjiā jiǔdiàn bǐ nà jiā piányi, dànshì nà jiā bǐ zhèjiā lí hǎibiān jìn.",null,"BODY557"],["Ví dụ: 中国的供应商比日本的便宜，但是日本的质量比中国的稳定。 (NCC Trung Quốc rẻ hơn Nhật, nhưng chất lượng Nhật ổn định hơn.)",null,null,"Zhōngguó de gōngyìngshāng bǐ Rìběn de piányi, dànshì Rìběn de zhìliàng bǐ Zhōngguó de wěndìng.",null,"BODY558"],["2. A没有B那么…… (A không … bằng B)",null,null,"A méiyǒu B nàme……",null,"BODY559"],["Ví dụ: 河内的冬天没有北京那么冷。 (Mùa đông Hà Nội không lạnh bằng Bắc Kinh.)",null,null,"Hénèi de dōngtiān méiyǒu Běijīng nàme lěng.",null,"BODY560"],["Ví dụ: 二手车没有新车那么贵，可是维修费用比较高。 (Xe cũ không đắt bằng xe mới, nhưng phí sửa chữa khá cao.)",null,null,"Èrshǒuchē méiyǒu xīnchē nàme guì, kěshì wéixiū fèiyòng bǐjiào gāo.",null,"BODY561"],["3. A跟B差不多，不过…… (A với B tương đương, nhưng …)",null,null,"A gēn B chàbuduō, bùguò……",null,"BODY562"],["Ví dụ: 这两款手机的价格差不多，不过华为的电池更耐用。 (Hai mẫu điện thoại giá tương đương, nhưng Huawei pin bền hơn.)",null,null,"Zhè liǎngkuǎn shǒujī de jiàgé chàbuduō, bùguò Huáwéi de diànchí gèng nàiyòng.",null,"BODY563"],["Ví dụ: 两家公司的工资差不多，不过这家的福利更好。 (Lương hai công ty tương đương, nhưng phúc lợi công ty này tốt hơn.)",null,null,"Liǎngjiā gōngsī de gōngzī chàbuduō, bùguò zhèjiā de fúlì gènghǎo.",null,"BODY564"],["4. 两个……各有优缺点：……的优点是……，缺点是…… (Hai … đều có ưu nhược: … ưu điểm là …, nhược điểm là …)",null,null,"Liǎnggè…… gè yǒu yōuquēdiǎn:…… de yōudiǎn shì……, quēdiǎn shì……",null,"BODY565"],["Ví dụ: 两个方案各有优缺点：A方案的优点是成本低，缺点是时间长；B方案的优点是速度快，缺点是贵。 (Hai phương án đều có ưu nhược: A ưu điểm chi phí thấp, nhược điểm lâu; B ưu điểm nhanh, nhược điểm đắt.)",null,null,"Liǎnggè fāng'àn gè yǒu yōuquēdiǎn: A fāng'àn de yōudiǎn shì chéngběndī, quēdiǎn shì shíjiān zhǎng; B fāng'àn de yōudiǎn shì sùdùkuài, quēdiǎn shì guì.",null,"BODY566"],["5. 从长远来看，…… (Về lâu dài, …)",null,null,"Cóng chángyuǎn láikàn,……",null,"BODY567"],["Ví dụ: 从长远来看，买自动化设备比多招工人更划算。 (Về lâu dài, mua thiết bị tự động hóa hời hơn tuyển thêm công nhân.)",null,null,"Cóng chángyuǎn láikàn, mǎi zìdònghuà shèbèi bǐ duōzhāo gōngrén gèng huásuàn.",null,"BODY568"],["Ví dụ: 从长远来看，学中文对我的职业发展帮助很大
