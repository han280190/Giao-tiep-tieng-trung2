 hēbēi kāfēi.",null,"BODY68"],["小芳: 好啊！跟你聊完，我心里轻松多了。 (Được đấy! Nói chuyện với bạn xong, mình nhẹ lòng hơn nhiều.)",null,null,"Xiǎo Fāng: hǎo a! Gēn nǐ liáo wán, wǒ xīnlǐ qīngsōng duō le.",null,"BODY69"],["阿玲: 有什么事随时找我，别一个人憋着。 (Có gì cứ tìm mình, đừng một mình kìm nén.)",null,null,"Ā Líng: yǒu shénme shì suíshí zhǎo wǒ, bié yīgè rén biēzhe.",null,"BODY70"],["情景对话 2 — Báo sếp mình đang quá tải và xin hỗ trợ (HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY71-C"],["小芳: 经理，您现在方便吗？我想跟您说一下我的工作情况。 (Giám đốc, giờ anh tiện không? Em muốn báo về tình hình công việc của em.)",null,null,"Xiǎo Fāng: jīnglǐ, nín xiànzài fāngbiàn ma? Wǒ xiǎng gēn nín shuō yīxià wǒ de gōngzuò qíngkuàng.",null,"BODY72"],["经理: 可以，什么事？ (Được, việc gì?)",null,null,"Jīnglǐ: kěyǐ, shénme shì?",null,"BODY73"],["小芳: 自从小海离职以后，他的三个客户都转给了我。说实话，我现在真的有点忙不过来了。 (Từ khi Tiểu Hải nghỉ, 3 khách của anh ấy chuyển hết sang em. Nói thật, giờ em thật sự hơi quá tải.)",null,null,"Xiǎo Fāng: zìcóng Xiǎo Hǎi lízhí yǐhòu, tā de sāngè kèhù dōu zhuǎngěi le wǒ. Shuōshíhuà, wǒ xiànzài zhēnde yǒudiǎn mángbùguòlái le.",null,"BODY74"],["经理: 具体有多少工作？ (Cụ thể bao nhiêu việc?)",null,null,"Jīnglǐ: jùtǐ yǒu duōshǎo gōngzuò?",null,"BODY75"],["小芳: 我做了一个表：现在我一共负责十一个客户，每周要做二十份左右的报价，每天加班两到三个小时。 (Em làm một bảng: hiện em phụ trách tổng 11 khách, mỗi tuần làm khoảng 20 báo giá, mỗi ngày tăng ca 2–3 tiếng.)",null,null,"Xiǎo Fāng: wǒ zuò le yīgè biǎo: xiànzài wǒ yīgòng fùzé shíyīgè kèhù, měizhōu yào zuò èrshífèn zuǒyòu de bàojià, měitiān jiābān liǎng dào sāngè xiǎoshí.",null,"BODY76"],["经理: 这么多？我还以为你应付得过来。 (Nhiều vậy? Tôi còn tưởng em lo được.)",null,null,"Jīnglǐ: zhème duō? Wǒ hái yǐwéi nǐ yìngfu de guòlái.",null,"BODY77"],["小芳: 我一直在努力，但是最近已经有两次报价晚了，我担心会影响客户。 (Em vẫn luôn cố gắng, nhưng gần đây đã 2 lần báo giá trễ, em sợ ảnh hưởng khách.)",null,null,"Xiǎo Fāng: wǒ yīzhí zài nǔlì, dànshì zuìjìn yǐjīng yǒu liǎngcì bàojià wǎn le, wǒ dānxīn huì yǐngxiǎng kèhù.",null,"BODY78"],["经理: 你考虑得对。那你希望我怎么帮你？ (Em nghĩ đúng. Vậy em muốn tôi giúp thế nào?)",null,null,"Jīnglǐ: nǐ kǎolǜ de duì. Nà nǐ xīwàng wǒ zěnme bāng nǐ?",null,"BODY79"],["小芳: 我有两个建议：第一，新员工招进来之前，能不能请小林暂时帮我负责两个小客户？第二，常规产品的报价能不能做一个模板，这样可以节省时间。 (Em có 2 đề xuất: một, trước khi tuyển được người mới, nhờ Tiểu Lâm tạm phụ trách giúp 2 khách nhỏ được không? Hai, làm mẫu báo giá cho sản phẩm thông thường để tiết kiệm thời gian.)",null,null,"Xiǎo Fāng: wǒ yǒu liǎnggè jiànyì: dìyī, xīn yuángōng zhāojìnlái zhīqián, néng bùnéng qǐng Xiǎo Lín zànshí bāng wǒ fùzé liǎnggè xiǎo kèhù? Dì'èr, chángguī chǎnpǐn de bàojià néng bùnéng zuò yīgè múbǎn, zhèyàng kěyǐ jiéshěngshíjiān.",null,"BODY80"],["经理: 第一个我可以安排，我今天就跟小林说。第二个是个好主意，你先做一个模板给我看看。 (Đề xuất một tôi sắp xếp được, hôm nay tôi nói với Tiểu Lâm. Đề xuất hai là ý hay, em làm trước một mẫu cho tôi xem.)",null,null,"Jīnglǐ: dìyīgè wǒ kěyǐ ānpái, wǒ jīntiān jiù gēn Xiǎo Lín shuō. Dì'èrgè shì gè hǎo zhǔyì, nǐ xiān zuò yīgè múbǎn gěi wǒ kànkan.",null,"BODY81"],["小芳: 好的。另外，新员工大概什么时候能到？ (Vâng. Ngoài ra, khoảng khi nào có nhân viên mới ạ?)",null,null,"Xiǎo Fāng: hǎo de. Lìngwài, xīn yuángōng dàgài shénme shíhou néng dào?",null,"BODY82"],["经理: 人事部说下个月中旬。这段时间辛苦你了，忙不过来要早点说，别等到出问题。 (Phòng nhân sự nói giữa tháng sau. Thời gian này vất vả cho em, không xuể thì phải nói sớm, đừng đợi đến khi có chuyện.)",null,null,"Jīnglǐ: rénshìbù shuō xiàgèyuè zhōngxún. Zhè duànshíjiān xīnkǔ nǐ le, mángbùguòlái yào zǎodiǎn shuō, bié děngdào chū wèntí.",null,"BODY83"],["小芳: 明白，谢谢经理的理解！ (Rõ ạ, cảm ơn giám đốc đã thông cảm!)",null,null,"Xiǎo Fāng: míngbai, xièxie jīnglǐ de lǐjiě!",null,"BODY84"],["情景对话 3 — Hai đồng nghiệp cãi nhau, một người đứng ra làm dịu (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY85-C"],["小林: 阿海，客户的样品你为什么还没寄？我昨天就跟你说了！ (A Hải, mẫu của khách sao bạn vẫn chưa gửi? Hôm qua mình đã nói với bạn rồi!)",null,null,"Xiǎo Lín: Ā Hǎi, kèhù de yàngpǐn nǐ wèishénme hái méi jì? Wǒ zuótiān jiù gēn nǐ shuō le!",null,"BODY86"],["阿海: 你昨天下午五点才说，快递已经走了，我怎么寄？ (Bạn 5h chiều qua mới nói, chuyển phát đi rồi, mình gửi kiểu gì?)",null,null,"Ā Hǎi: nǐ zuótiānxiàwǔ wǔdiǎn cái shuō, kuàidì yǐjīng zǒu le, wǒ zěnme jì?",null,"BODY87"],["小林: 那你可以今天一早寄啊！客户刚才打电话来骂我了。 (Thì bạn có thể gửi sáng sớm nay chứ! Khách vừa gọi điện mắng mình.)",null,null,"Xiǎo Lín: nà nǐ kěyǐ jīntiān yīzǎo jì a! Kèhù gāngcái dǎdiànhuà lái mà wǒ le.",null,"BODY88"],["阿海: 我今天早上要盘点仓库，经理安排的，你又不是不知道。 (Sáng nay mình phải kiểm kê kho, giám đốc sắp xếp, bạn có phải không biết đâu.)",null,null,"Ā Hǎi: wǒ jīntiān zǎoshang yào pándiǎn cāngkù, jīnglǐ ānpái de, nǐ yòu bùshì bù zhīdao.",null,"BODY89"],["阿玲: 好了好了，你们俩先别急，先冷静一下。 (Thôi thôi, hai bạn đừng nóng, bình tĩnh lại đã.)",null,null,"Ā Líng: hǎo le hǎo le, nǐmen liǎ xiān biéjí, xiān lěngjìng yīxià.",null,"BODY90"],["阿玲: 我们先把事情弄清楚：客户要求什么时候收到样品？ (Mình làm rõ sự việc trước: khách yêu cầu khi nào nhận được mẫu?)",null,null,"Ā Líng: wǒmen xiān bǎ shìqing nòngqīngchu: kèhù yāoqiú shénme shíhou shōudào yàngpǐn?",null,"BODY91"],["小林: 明天下午之前。 (Trước chiều mai.)",null,null,"Xiǎo Lín: míngtiān xiàwǔ zhīqián.",null,"BODY92"],["阿玲: 现在寄快递的话，明天下午能到吗？ (Giờ gửi chuyển phát, chiều mai đến được không?)",null,null,"Ā Líng: xiànzài jì kuàidì dehuà, míngtiān xiàwǔ néng dào ma?",null,"BODY93"],["阿海: 寄加急的话，明天上午就能到。 (Gửi hỏa tốc thì sáng mai đến.)",null,null,"Ā Hǎi: jì jiājí dehuà, míngtiān shàngwǔ jiù néng dào.",null,"BODY94"],["阿玲: 那问题就不大了。阿海，你现在能寄吗？ (Vậy vấn đề không lớn. A Hải, giờ bạn gửi được không?)",null,null,"Ā Líng: nà wèntí jiù bù dà le. Ā Hǎi, nǐ xiànzài néng jì ma?",null,"BODY95"],["阿海: 盘点还差一点，半个小时以后我就去寄。 (Kiểm kê còn chút nữa, nửa tiếng nữa mình đi gửi.)",null,null,"Ā Hǎi: pándiǎn hái chàyīdiǎn, bàngè xiǎoshí yǐhòu wǒ jiù qù jì.",null,"BODY96"],["阿玲: 小林，你先给客户回个电话，告诉他明天上午就能收到，好吗？ (Tiểu Lâm, bạn gọi lại cho khách trước, báo sáng mai nhận được, được không?)",null,null,"Ā Líng: Xiǎo Lín, nǐ xiān gěi kèhù huí gè diànhuà, gàosu tā míngtiān shàngwǔ jiù néng shōudào, hǎo ma?",null,"BODY97"],["小林: 好。阿海，刚才我说话太冲了，对不起，我是被客户骂急了。 (Được. A Hải, lúc nãy mình nói hơi gắt, xin lỗi, mình bị khách mắng nên cuống.)",null,null,"Xiǎo Lín: hǎo. Ā Hǎi, gāngcái wǒ shuōhuà tàichòng le, duìbuqǐ, wǒ shì bèi kèhù mà jí le.",null,"BODY98"],["阿海: 没事，我也有问题，昨天应该跟你说一声我今天要盘点。 (Không sao, mình cũng có lỗi, hôm qua đáng lẽ phải báo bạn hôm nay mình kiểm kê.)",null,null,"Ā Hǎi: méishì, wǒ yě yǒu wèntí, zuótiān yīnggāi gēn nǐ shuō yīshēng wǒ jīntiān yào pándiǎn.",null,"BODY99"],["阿玲: 以后寄样品的事，最好前一天中午之前发到群里，大家都能提前安排。 (Sau này việc gửi mẫu, tốt nhất trước trưa hôm trước gửi lên nhóm, mọi người sắp xếp trước được.)",null,null,"Ā Líng: yǐhòu jì yàngpǐn de shì, zuìhǎo qiányītiān zhōngwǔ zhīqián fādào qún lǐ, dàjiā dōu néng tíqián ānpái.",null,"BODY100"],["小林: 好主意，就这么办。 (Ý hay, cứ thế mà làm.)",null,null,"Xiǎo Lín: hǎo zhǔyì, jiù zhème bàn.",null,"BODY101"],["情景对话 4 — Bị sếp phê bình trước mặt mọi người, nói chuyện lại với sếp sau đó",null,null,"Qíngjǐng duìhuà",null,"BODY102-C"],["小阮: 经理，打扰您几分钟，我想跟您聊一下今天上午开会的事。 (Giám đốc, làm phiền anh vài phút, em muốn nói về chuyện họp sáng nay.)",null,null,"Xiǎo Ruǎn: jīnglǐ, dǎrǎo nín jǐfēnzhōng, wǒ xiǎng gēn nín liáo yīxià jīntiānshàngwǔ kāihuì de shì.",null,"BODY103"],["经理: 你是说报告的事吗？ (Em nói chuyện báo cáo à?)",null,null,"Jīnglǐ: nǐ shì shuō bàogào de shì ma?",null,"BODY104"],["小阮: 是的。首先，报告的数据有错误，是我的问题，我已经改好了，这是新的版本。 (Vâng. Trước hết, số liệu báo cáo có lỗi là lỗi của em, em đã sửa xong, đây là bản mới.)",null,null,"Xiǎo Ruǎn: shì de. Shǒuxiān, bàogào de shùjù yǒu cuòwù, shì wǒ de wèntí, wǒ yǐjīng gǎi hǎo le, zhè shì xīn de bǎnběn.",null,"BODY105"],["经理: 好，我等一下看。 (Được, lát tôi xem.)",null,null,"Jīnglǐ: hǎo, wǒ děng yīxià kàn.",null,"BODY106"],["小阮: 另外，说实话，您在会上当着大家的面批评我，我心里有点难受。 (Ngoài ra, nói thật, anh phê bình em trước mặt mọi người, trong lòng em hơi khó chịu.)",null,null,"Xiǎo Ruǎn: lìngwài, shuōshíhuà, nín zài huìshàng dāngzhe dàjiā de miàn pīpíng wǒ, wǒ xīnlǐ yǒudiǎn nánshòu.",null,"BODY107"],["经理: 我当时也是太着急了，因为下午要把报告交给总部。 (Lúc đó tôi cũng quá sốt ruột, vì chiều phải nộp báo cáo cho tổng bộ.)",null,null,"Jīnglǐ: wǒ dāngshí yě shì tài zháojí le, yīnwèi xiàwǔ yào bǎ bàogào jiāogěi zǒngbù.",null,"BODY108"],["小阮: 我理解您的压力。我不是想说您不对，只是希望以后如果我有问题，您可以私下先告诉我，我会马上改。 (Em hiểu áp lực của anh. Em không có ý nói anh sai, chỉ mong sau này em có vấn đề, anh có thể nói riêng với em trước, em sẽ sửa ngay.)",null,null,"Xiǎo Ruǎn: wǒ lǐjiě nín de yālì. Wǒ bùshì xiǎng shuō nín bù duì, zhǐshì xīwàng yǐhòu rúguǒ wǒ yǒu wèntí, nín kěyǐ sīxià xiān gàosu wǒ, wǒhuì mǎshàng gǎi.",null,"BODY109"],["经理: 你说得对，在会上那么说确实不太合适。我向你道歉。 (Em nói đúng, nói vậy trong họp đúng là không thích hợp lắm. Tôi xin lỗi em.)",null,null,"Jīnglǐ: nǐ shuōdeduì, zài huìshàng nàme shuō quèshí bù tài héshì. Wǒ xiàng nǐ dàoqiàn.",null,"BODY110"],["小阮: 谢谢经理。我以后交报告之前也会再多检查一遍。 (Cảm ơn giám đốc. Sau này trước khi nộp báo cáo em cũng sẽ kiểm tra thêm một lượt.)",null,null,"Xiǎo Ruǎn: xièxie jīnglǐ. Wǒ yǐhòu jiāo bàogào zhīqián yě huì zài duō jiǎnchá yībiàn.",null,"BODY111"],["经理: 好。其实你的报告整体做得很不错，只是这一个数字的问题。 (Được. Thực ra tổng thể báo cáo của em làm rất tốt, chỉ là vấn đề một con số.)",null,null,"Jīnglǐ: hǎo. Qíshí nǐ de bàogào zhěngtǐ zuò de hěn bùcuò, zhǐshì zhè yīgè shùzì de wèntí.",null,"BODY112"],["小阮: 那我以后重要的数据都请小林帮我再核对一次。 (Vậy sau này số liệu quan trọng em nhờ Tiểu Lâm đối chiếu lại giúp một lần.)",null,null,"Xiǎo Ruǎn: nà wǒ yǐhòu zhòngyào de shùjù dōu qǐng Xiǎo Lín bāng wǒ zài héduì yīcì.",null,"BODY113"],["经理: 可以。说开了就好，别放在心上。 (Được. Nói ra là ổn, đừng để bụng.)",null,null,"Jīnglǐ: kěyǐ. Shuō kāi le jiù hǎo, bié fàngzàixīnshàng.",null,"BODY114"],["情景对话 5 — (HSK5) Mua hàng và Kỹ thuật đổ lỗi cho nhau: hòa giải xung đột liên phòng ban",null,null,"Qíngjǐng duìhuà",null,"BODY115-C"],["经理: 今天请两个部门来，是想把上周那批零件的问题说清楚。大家就事论事，不要带情绪。 (Hôm nay mời hai phòng đến để nói rõ vấn đề lô linh kiện tuần trước. Mọi người bàn đúng việc, đừng mang cảm xúc.)",null,null,"Jīnglǐ: jīntiān qǐng liǎnggè bùmén lái, shì xiǎng bǎ shàngzhōu nà pī língjiàn de wèntí shuō qīngchu. Dàjiā jiùshìlùnshì, bùyào dài qíngxù.",null,"BODY116"],["技术: 那批零件的尺寸全部不对，装不上去，生产线停了一天。这是采购的责任，他们买错了。 (Lô linh kiện đó kích thước sai hết, lắp không vào, chuyền dừng một ngày. Đây là trách nhiệm của mua hàng, họ mua sai.)",null,null,"Jìshù: nà pī língjiàn de chǐcùn quánbù bù duì, zhuāng bù shàngqù, shēngchǎnxiàn tíng le yītiān. Zhè shì cǎigòu de zérèn, tāmen mǎi cuò le.",null,"BODY117"],["采购: 我们是按照技术部给的图纸下的单，怎么能说是我们买错了？ (Chúng tôi đặt hàng theo bản vẽ phòng kỹ thuật đưa, sao nói chúng tôi mua sai được?)",null,null,"Cǎigòu: wǒmen shì ànzhào jìshùbù gěi de túzhǐ xià de dān, zěnme néng shuō shì wǒmen mǎi cuò le?",null,"BODY118"],["技术: 我们上个月就更新了图纸，你们用的是旧版本。 (Tháng trước chúng tôi đã cập nhật bản vẽ, các anh dùng bản cũ.)",null,null,"Jìshù: wǒmen shànggèyuè jiù gèngxīn le túzhǐ, nǐmen yòng de shì jiùbǎnběn.",null,"BODY119"],["采购: 更新了为什么不通知我们？我们没有收到任何邮件。 (Cập nhật sao không thông báo chúng tôi? Chúng tôi không nhận được email nào.)",null,null,"Cǎigòu: gèngxīn le wèishénme bù tōngzhī wǒmen? Wǒmen méiyǒu shōudào rènhé yóujiàn.",null,"BODY120"],["技术: 新图纸放在共享文件夹里了，你们应该自己去看。 (Bản vẽ mới để trong thư mục chung rồi, các anh phải tự vào xem.)",null,null,"Jìshù: xīn túzhǐ fàngzài gòngxiǎng wénjiànjiā lǐ le, nǐmen yīnggāi zìjǐ qù kàn.",null,"BODY121"],["经理: 先别急，我们先把事实弄清楚。图纸是哪一天更新的？ (Đừng vội, làm rõ sự thật trước. Bản vẽ cập nhật ngày nào?)",null,null,"Jīnglǐ: xiān biéjí, wǒmen xiān bǎ shìshí nòngqīngchu. Túzhǐ shì nǎyītiān gèngxīn de?",null,"BODY122"],["技术: 九月二十号。 (Ngày 20/9.)",null,null,"Jìshù: jiǔyuè èrshí hào.",null,"BODY123"],["采购: 我们的订单是九月二十五号下的，下单的时候系统里显示的还是旧版本。 (Đơn của chúng tôi đặt ngày 25/9, lúc đặt hệ thống vẫn hiển thị bản cũ.)",null,null,"Cǎigòu: wǒmen de dìngdān shì jiǔyuè èrshíwǔ hào xià de, xiàdān de shíhou xìtǒng lǐ xiǎnshì de háishì jiùbǎnběn.",null,"BODY124"],["经理: 也就是说，共享文件夹更新了，但是采购系统里的图纸没有更新？ (Tức là thư mục chung đã cập nhật nhưng bản vẽ trong hệ thống mua hàng chưa cập nhật?)",null,null,"Jīnglǐ: yějiùshìshuō, gòngxiǎng wénjiànjiā gèngxīn le, dànshì cǎigòu xìtǒng lǐ de túzhǐ méiyǒu gèngxīn?",null,"BODY125"],["技术: ……对，系统的图纸需要我们申请IT部门更新，我们忘了。 (…Đúng, bản vẽ trong hệ thống phải xin phòng IT cập nhật, chúng tôi quên.)",null,null,"Jìshù:…… duì, xìtǒng de túzhǐ xūyào wǒmen shēnqǐng IT bùmén gèngxīn, wǒmen wàng le.",null,"BODY126"],["经理: 好，现在情况清楚了。这件事双方都有一定的责任：一方面技术部更新图纸以后没有同步到系统，也没有通知采购；另一方面采购下单前也没有跟技术部再确认一次规格。 (Được, giờ rõ rồi. Hai bên đều có trách nhiệm nhất định: một mặt kỹ thuật cập nhật bản vẽ mà không đồng bộ lên hệ thống, cũng không báo mua hàng; mặt khác mua hàng trước khi đặt cũng không xác nhận lại quy cách với kỹ thuật.)",null,null,"Jīnglǐ: hǎo, xiànzài qíngkuàng qīngchu le. Zhèjiàn shì shuāngfāng dōu yǒu yīdìng de zérèn: yīfāngmiàn jìshùbù gèngxīn túzhǐ yǐhòu méiyǒu tóngbù dào xìtǒng, yě méiyǒu tōngzhī cǎigòu; lìngyīfāngmiàn cǎigòu xiàdān qián yě méiyǒu gēn jìshùbù zài quèrèn yīcì guīgé.",null,"BODY127"],["采购: 我同意。以后重要零件下单前，我们会先发邮件跟技术部确认。 (Tôi đồng ý. Sau này linh kiện quan trọng trước khi đặt, chúng tôi sẽ gửi email xác nhận với kỹ thuật.)",null,null,"Cǎigòu: wǒ tóngyì. Yǐhòu zhòngyào língjiàn xiàdān qián, wǒmen huì xiān fāyóujiàn gēn jìshùbù quèrèn.",null,"BODY128"],["技术: 我们也有问题。以后图纸一更新，我们当天就同步到系统，并且发邮件通知采购和生产。 (Chúng tôi cũng có lỗi. Sau này bản vẽ vừa cập nhật, trong ngày chúng tôi đồng bộ lên hệ thống và gửi email báo mua hàng, sản xuất.)",null,null,"Jìshù: wǒmen yě yǒu wèntí. Yǐhòu túzhǐ yī gèngxīn, wǒmen dàngtiān jiù tóngbù dào xìtǒng, bìngqiě fāyóujiàn tōngzhī cǎigòu hé shēngchǎn.",null,"BODY129"],["经理: 很好。不管是谁的责任，现在最重要的是那批零件怎么处理。 (Rất tốt. Dù là trách nhiệm của ai, quan trọng nhất bây giờ là xử lý lô linh kiện đó thế nào.)",null,null,"Jīnglǐ: hěn hǎo. Bùguǎnshìshéi de zérèn, xiànzài zuì zhòngyào de shì nà pī língjiàn zěnme chǔlǐ.",null,"BODY130"],["采购: 我问过供应商了，可以改，但是要收百分之十五的加工费，五天交货。 (Tôi hỏi NCC rồi, sửa được nhưng thu 15% phí gia công, giao trong 5 ngày.)",null,null,"Cǎigòu: wǒ wèn guò gōngyìngshāng le, kěyǐ gǎi, dànshì yào shōu bǎifēnzhīshíwǔ de jiāgōngfèi, wǔtiān jiāohuò.",null,"BODY131"],["技术: 我们可以派一个工程师去供应商那里，帮他们确认新的尺寸，保证一次就改对。 (Chúng tôi có thể cử một kỹ sư đến NCC, giúp họ xác nhận kích thước mới, đảm bảo sửa đúng ngay lần đầu.)",null,null,"Jìshù: wǒmen kěyǐ pài yīgè gōngchéngshī qù gōngyìngshāng nàlǐ, bāng tāmen quèrèn xīn de chǐcùn, bǎozhèng yīcì jiù gǎi duì.",null,"BODY132"],["经理: 好，那就这样定：加工费由两个部门的预算各承担一半；技术部明天派人去供应商；采购部负责跟进交期。大家有没有意见？ (Được, chốt vậy: phí gia công ngân sách hai phòng mỗi bên chịu một nửa; kỹ thuật mai cử người đến NCC; mua hàng theo dõi thời gian giao. Mọi người có ý kiến gì không?)",null,null,"Jīnglǐ: hǎo, nà jiù zhèyàng dìng: jiāgōngfèi yóu liǎnggè bùmén de yùsuàn gè chéngdān yībàn; jìshùbù míngtiān pài rén qù gōngyìngshāng; cǎigòubù fùzé gēnjìn jiāo qī. Dàjiā yǒuméiyǒu yìjiàn?",null,"BODY133"],["采购: 没有意见。 (Không có ý kiến.)",null,null,"Cǎigòu: méiyǒu yìjiàn.",null,"BODY134"],["技术: 我也同意。刚才我说话有点冲，不好意思。 (Tôi cũng đồng ý. Lúc nãy tôi nói hơi gắt, xin lỗi.)",null,null,"Jìshù: wǒ yě tóngyì. Gāngcái wǒ shuōhuà yǒudiǎnchòng, bùhǎoyìsi.",null,"BODY135"],["采购: 没关系，大家的目标是一样的，都是让生产线别再停。 (Không sao, mục tiêu mọi người giống nhau, đều là để chuyền đừng dừng nữa.)",null,null,"Cǎigòu: méiguānxi, dàjiā de mùbiāo shì yīyàng de, dōu shì ràng shēngchǎnxiàn bié zài tíng.",null,"BODY136"],["情景对话 6 — (HSK5) Thương lượng với nhóm công nhân phản đối tăng ca liên tục",null,null,"Qíngjǐng duìhuà",null,"BODY137-C"],["主管: 大家好，我知道最近连续加班，大家都很累，今天想听听大家的想法。 (Chào mọi người, tôi biết gần đây tăng ca liên tục, ai cũng mệt, hôm nay muốn nghe ý kiến mọi người.)",null,null,"Zhǔguǎn: dàjiā hǎo, wǒ zhīdao zuìjìn liánxù jiābān, dàjiā dōu hěn lèi, jīntiān xiǎng tīngtīng dàjiā de xiǎngfǎ.",null,"BODY138"],["组长: 主管，我们已经连续三个星期每天加班三个小时，周末也没休息，很多人都受不了了。 (Trưởng ca, chúng tôi đã liên tục 3 tuần mỗi ngày tăng ca 3 tiếng, cuối tuần cũng không nghỉ, nhiều người chịu không nổi rồi.)",null,null,"Zǔzhǎng: zhǔguǎn, wǒmen yǐjīng liánxù sāngè xīngqī měitiān jiābān sāngè xiǎoshí, zhōumò yě méi xiūxi, hěnduō rén dōu shòubùliǎo le.",null,"BODY139"],["主管: 我理解大家的难处。这段时间确实太辛苦了。 (Tôi hiểu cái khó của mọi người. Thời gian này đúng là quá vất vả.)",null,null,"Zhǔguǎn: wǒ lǐjiě dàjiā de nánchù. Zhè duànshíjiān quèshí tài xīnkǔ le.",null,"BODY140"],["组长: 有的工人家里有孩子，每天晚上九点才回家，孩子都睡了。还有两个人身体不舒服，请假都请不了。 (Có công nhân nhà có con nhỏ, tối nào 9h mới về, con ngủ mất rồi. Còn 2 người không khỏe mà xin nghỉ cũng không được.)",null,null,"Zǔzhǎng: yǒu de gōngrén jiālǐ yǒu háizi, měitiānwǎnshàng jiǔdiǎn cái huíjiā, háizi dōu shuì le. Háiyǒu liǎnggè rén shēntǐ bù shūfu, qǐngjià dōu qǐng bùliǎo.",null,"BODY141"],["主管: 这些情况我会马上向上面反映。不过我也想跟大家说一下公司的难处：这批订单下个月十号必须交，如果晚了，要赔很多钱，明年的订单也可能没有了。 (Những chuyện này tôi sẽ phản ánh lên trên ngay. Nhưng tôi cũng muốn nói với mọi người cái khó của công ty: lô đơn này ngày 10 tháng sau phải giao, trễ thì phải bồi thường nhiều, đơn năm sau cũng có thể mất.)",null,null,"Zhǔguǎn: zhèxiē qíngkuàng wǒhuì mǎshàng xiàng shàngmiàn fǎnyìng. Bùguò wǒ yě xiǎng gēn dàjiā shuō yīxià gōngsī de nánchù: zhè pī dìngdān xiàgèyuè shíhào bìxū jiāo, rúguǒ wǎn le, yào péi hěnduō qián, míngnián de dìngdān yě kěnéng méiyǒu le.",null,"BODY142"],["组长: 我们不是不想帮公司，而是真的太累了，再这样下去，容易出安全事故。 (Chúng tôi không phải không muốn giúp công ty, mà thật sự quá mệt, cứ thế này dễ xảy ra tai nạn lao động.)",null,null,"Zǔzhǎng: wǒmen bùshì bùxiǎng bāng gōngsī, érshì zhēnde tài lèi le, zài zhèyàng xiàqù, róngyì chū ānquánshìgù.",null,"BODY143"],["主管: 你说得对，安全是第一位的。那我们一起想想办法，大家的目标是一样的：订单按时交，大家也能休息。 (Anh nói đúng, an toàn là trên hết. Vậy cùng nghĩ cách, mục tiêu mọi người giống nhau: đơn giao đúng hạn mà mọi người cũng được nghỉ.)",null,null,"Zhǔguǎn: nǐ shuōdeduì, ānquán shì dìyīwèi de. Nà wǒmen yīqǐ xiǎngxiang bànfǎ, dàjiā de mùbiāo shì yīyàng de: dìngdān ànshí jiāo, dàjiā yě néng xiūxi.",null,"BODY144"],["组长: 我的建议是：每天加班改成两个小时，周日一定要休息一天。 (Đề xuất của tôi: mỗi ngày tăng ca giảm còn 2 tiếng, chủ nhật nhất định nghỉ một ngày.)",null,null,"Zǔzhǎng: wǒ de jiànyì shì: měitiān jiābān gǎichéng liǎnggè xiǎoshí, zhōurì yīdìng yào xiūxi yītiān.",null,"BODY145"],["主管: 这样的话产量会少百分之十五左右。能不能各让一步：每天加班两个小时，周日休息；同时我们从二号线临时调五个人过来，把产量补上？ (Như vậy sản lượng giảm khoảng 15%. Mỗi bên lùi một bước được không: mỗi ngày tăng ca 2 tiếng, chủ nhật nghỉ; đồng thời tạm điều 5 người từ chuyền 2 sang bù sản lượng?)",null,null,"Zhǔguǎn: zhèyàngdehuà chǎnliàng huì shǎo bǎifēnzhīshíwǔ zuǒyòu. Néng bùnéng gè ràng yībù: měitiān jiābān liǎnggè xiǎoshí, zhōurì xiūxi; tóngshí wǒmen cóng èrhàoxiàn línshí diào wǔgè rén guòlái, bǎ chǎnliàng bǔ shàng?",null,"BODY146"],["组长: 这个可以接受。另外，加班费能不能按时发？上个月的晚了一个星期。 (Cái này chấp nhận được. Ngoài ra, tiền tăng ca trả đúng hạn được không? Tháng trước trễ một tuần.)",null,null,"Zǔzhǎng: zhège kěyǐ jiēshòu. Lìngwài, jiābānfèi néng bùnéng ànshí fā? Shànggèyuè de wǎn le yīgè xīngqī.",null,"BODY147"],["主管: 这个是我们的问题，我今天就去找财务，保证这个月十号跟工资一起发。另外，订单完成以后，我会申请给大家每人发一笔奖金。 (Đó là lỗi của chúng tôi, hôm nay tôi tìm kế toán, đảm bảo tháng này ngày 10 trả cùng lương. Ngoài ra, xong đơn tôi sẽ xin thưởng cho mỗi người một khoản.)",null,null,"Zhǔguǎn: zhège shì wǒmen de wèntí, wǒ jīntiān jiù qù zhǎo cáiwù, bǎozhèng zhège yuè shíhào gēn gōngzī yīqǐ fā. Lìngwài, dìngdān wánchéng yǐhòu, wǒhuì shēnqǐng gěi dàjiā měirén fā yībǐ jiǎngjīn.",null,"BODY148"],["组长: 好，那我回去跟大家说一下。 (Được, vậy tôi về nói với mọi người.)",null,null,"Zǔzhǎng: hǎo, nà wǒ huíqù gēn dàjiā shuō yīxià.",null,"BODY149"],["主管: 谢谢你。身体不舒服的那两位，明天就让他们休息，有什么问题直接来找我。 (Cảm ơn anh. Hai người không khỏe, mai cho họ nghỉ, có vấn đề gì cứ tìm thẳng tôi.)",null,null,"Zhǔguǎn: xièxie nǐ. Shēntǐ bù shūfu de nà liǎngwèi, míngtiān jiùràng tāmen xiūxi, yǒu shénme wèntí zhíjiē lái zhǎo wǒ.",null,"BODY150"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY151-C"],["1. Hỏi: 你觉得工作压力主要来自哪里？ (Bạn thấy áp lực công việc chủ yếu đến từ đâu?)",null,null,"Nǐ juéde gōngzuò yālì zhǔyào láizì nǎlǐ?",null,"BODY152"],["Đáp: 我觉得主要来自三个方面：工作量太大、时间太紧，还有人际关系。其中最累的是人际关系，因为工作做不完可以加班，但是跟人有矛盾就很难受。 (Chủ yếu từ 3 mặt: khối lượng quá lớn, thời gian quá gấp, và quan hệ con người. Mệt nhất là quan hệ, vì việc làm không xong thì tăng ca, còn mâu thuẫn với người thì rất khó chịu.)",null,null,"Wǒ juéde zhǔyào láizì sāngè fāngmiàn: gōngzuòliàng tài dà, shíjiān tàijǐn, háiyǒu rénjìguānxi. Qízhōng zuì lèi de shì rénjìguānxi, yīnwèi gōngzuò zuò bù wán kěyǐ jiābān, dànshì gēn rén yǒu máodùn jiù hěn nánshòu.",null,"BODY153"],["2. Hỏi: 同事把错误推到你身上，你会怎么做？ (Đồng nghiệp đổ lỗi cho bạn, bạn sẽ làm gì?)",null,null,"Tóngshì bǎ cuòwù tuī dào nǐ shēnshang, nǐ huì zěnme zuò?",null,"BODY154"],["Đáp: 我会先控制情绪，不当场吵架。然后拿出邮件和记录，用事实说明情况，最后跟他一起想以后怎么避免。 (Tôi kiểm soát cảm xúc trước, không cãi tại chỗ. Rồi đưa ra email và ghi chép, dùng sự thật giải thích, cuối cùng cùng anh ấy nghĩ cách tránh sau này.)",null,null,"Wǒhuì xiān kòngzhìqíngxù, bù dāngchǎng chǎojià. Ránhòu náchū yóujiàn hé jìlù, yòng shìshí shuōmíng qíngkuàng, zuìhòu gēn tā yīqǐ xiǎng yǐhòu zěnme bìmiǎn.",null,"BODY155"],["3. Hỏi: 你有什么减压的好办法？ (Bạn có cách giảm áp lực nào hay?)",null,null,"Nǐ yǒu shénme jiǎnyā de hǎo bànfǎ?",null,"BODY156"],["Đáp: 我每天睡前会把第二天要做的事写下来，这样脑子里就不用一直想着。周末我一定会关掉工作群的提醒。 (Mỗi tối trước khi ngủ tôi viết ra việc ngày mai, như vậy đầu óc không phải nghĩ mãi. Cuối tuần tôi nhất định tắt thông báo nhóm công việc.)",null,null,"Wǒ měitiān shuì qián huì bǎ dì'èrtiān yào zuò de shì xiě xiàlái, zhèyàng nǎozilǐ jiù bùyòng yīzhí xiǎngzhe. Zhōumò wǒ yīdìng huì guāndiào gōngzuò qún de tíxǐng.",null,"BODY157"],["4. Hỏi: (HSK5) 如果你是经理，两个下属吵得很厉害，你会怎么处理？ (Nếu bạn là giám đốc, hai cấp dưới cãi nhau gay gắt, bạn xử lý thế nào?)",null,null,"Rúguǒ nǐ shì jīnglǐ, liǎnggè xiàshǔ chǎo de hěn lìhai, nǐ huì zěnme chǔlǐ?",null,"BODY158"],["Đáp: 我会先分别跟他们聊，让他们把情绪说出来；然后把两个人叫到一起，只谈事实，不谈谁对谁错；最后找到他们共同的目标，让他们一起提出解决方案，这样他们会更愿意执行。 (Nói chuyện riêng từng người trước để họ xả cảm xúc; rồi gọi cả hai lại, chỉ bàn sự thật, không bàn ai đúng ai sai; cuối cùng tìm mục tiêu chung, để họ cùng đưa ra giải pháp, như vậy họ sẵn lòng thực hiện hơn.)",null,null,"Wǒhuì xiān fēnbié gēn tāmen liáo, ràng tāmen bǎ qíngxù shuō chūlái; ránhòu bǎ liǎnggè rén jiào dào yīqǐ, zhǐ tán shìshí, bù tán shuí duì shuícuò; zuìhòu zhǎodào tāmen gòngtóng de mùbiāo, ràng tāmen yīqǐ tíchū jiějuéfāng'àn, zhèyàng tāmen huì gèng yuànyì zhíxíng.",null,"BODY159"],["情景模拟 ROLE-PLAY — HS làm người hòa giải giữa Mua hàng (GV) và Kỹ thuật (bạn cùng lớp). Vòng 2 (bất ngờ): một bên dọa báo lên tổng giám đốc",null,null,"Qíngjǐng mónǐ",null,"BODY160-C"],["GV (采购): 这次延误完全是技术部的错，他们给的规格一直在变！ (Lần trễ này hoàn toàn do kỹ thuật, quy cách họ đưa cứ thay đổi mãi!)",null,null,"Cǎigòu | Zhècì yánwù wánquán shì jìshùbù de cuò, tāmen gěi de guīgé yīzhí zài biàn!",null,"BODY161"],["同学 (技术): 规格变是因为客户改了要求，我们也没办法。 (Quy cách thay đổi vì khách đổi yêu cầu, chúng tôi cũng hết cách.)",null,null,"Tóngxué | Jìshù | Guīgé biàn shìyīnwèi kèhù gǎi le yāoqiú, wǒmen yě méi bànfǎ.",null,"BODY162"],["HS: 两位先别急。我理解大家的难处，客户一改要求，两个部门都很被动。我们先把事实弄清楚：这个月规格一共改了几次？ (Hai anh đừng vội. Tôi hiểu cái khó của mọi người, khách đổi yêu cầu là hai phòng đều bị động. Làm rõ sự thật trước: tháng này quy cách đổi tổng cộng mấy lần?)",null,null,"Liǎngwèi xiān biéjí. Wǒ lǐjiě dàjiā de nánchù, kèhù yī gǎi yāoqiú, liǎnggè bùmén dōu hěn bèidòng. Wǒmen xiān bǎ shìshí nòngqīngchu: zhège yuè guīgé yīgòng gǎi le jǐcì?",null,"BODY163"],["同学 (技术): 三次。 (Ba lần.)",null,null,"Tóngxué | Jìshù | Sāncì.",null,"BODY164"],["HS: 每次改了以后，采购是什么时候知道的？ (Mỗi lần đổi, mua hàng biết khi nào?)",null,null,"Měicì gǎi le yǐhòu, cǎigòu shì shénme shíhou zhīdao de?",null,"BODY165"],["GV (采购): 有一次是三天以后才知道的，供应商的货都已经做好了！ (Có lần 3 ngày sau mới biết, hàng của NCC đã làm xong rồi!)",null,null,"Cǎigòu | Yǒu yīcì shì sāntiān yǐhòu cái zhīdao de, gōngyìngshāng de huò dōu yǐjīng zuòhǎo le!",null,"BODY166"],["GV (biến cố): 这样下去不行，我要直接找总经理反映！ (Cứ thế này không được, tôi phải báo thẳng lên tổng giám đốc!)",null,null,"Zhèyàng xiàqù bùxíng, wǒ yào zhíjiē zhǎo zǒngjīnglǐ fǎnyìng!",null,"BODY167"],["HS: 您当然可以找总经理，不过与其让总经理来判断谁对谁错，不如我们今天先把流程定下来，这样总经理看到的是解决方案，而不是问题。 (Anh tất nhiên có thể tìm tổng giám đốc, nhưng thay vì để tổng giám đốc phân xử ai đúng ai sai, chi bằng hôm nay chúng ta chốt quy trình trước, như vậy tổng giám đốc thấy là giải pháp chứ không phải vấn đề.)",null,null,"Nín dāngrán kěyǐ zhǎo zǒngjīnglǐ, bùguò yǔqí ràng zǒngjīnglǐ lái pànduàn shuí duì shuícuò, bùrú wǒmen jīntiān xiān bǎ liúchéng dìng xiàlái, zhèyàng zǒngjīnglǐ kàndào de shì jiějuéfāng'àn, ér bùshì wèntí.",null,"BODY168"],["GV (采购): ……那你说怎么办？ (…Vậy anh nói làm sao?)",null,null,"Cǎigòu | …… Nà nǐ shuō zěnmebàn?",null,"BODY169"],["HS: 我建议：客户一改规格，技术部当天在群里通知采购；采购在通知供应商之前，再跟技术部确认一次。能不能各让一步，大家都多做一个动作？ (Tôi đề nghị: khách vừa đổi quy cách, kỹ thuật trong ngày thông báo mua hàng trên nhóm; mua hàng trước khi báo NCC xác nhận lại với kỹ thuật một lần. Mỗi bên lùi một bước, mỗi người làm thêm một thao tác được không?)",null,null,"Wǒ jiànyì: kèhù yī gǎi guīgé, jìshùbù dàngtiān zài qún lǐ tōngzhī cǎigòu; cǎigòu zài tōngzhī gōngyìngshāng zhīqián, zài gēn jìshùbù quèrèn yīcì. Néng bùnéng gè ràng yībù, dàjiā dōu duō zuò yīgè dòngzuò?",null,"BODY170"],["同学 (技术): 我同意。 (Tôi đồng ý.)",null,null,"Tóngxué | Jìshù | Wǒ tóngyì.",null,"BODY171"],["GV (采购): 好吧，那就先这样试一个月。 (Thôi được, vậy thử thế một tháng.)",null,null,"Cǎigòu | Hǎo ba, nà jiù xiān zhèyàng shì yīgèyuè.",null,"BODY172"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY173-C"],["✗ 我很压力。 → ✓ 我压力很大。/ 我的压力很大。 (压力 là danh từ, không dùng như tính từ.)",null,null,"Wǒ hěn yālì. | Wǒ yālì hěndà. / | Wǒ de yālì hěndà. | Yālì",null,"BODY174"],["✗ 这是你的错！ (công kích) → ✓ 我觉得这个环节可能有点问题，我们一起看看。",null,null,"Zhè shì nǐ de cuò! | Wǒ juéde zhège huánjié kěnéng yǒudiǎn wèntí, wǒmen yīqǐ kànkan.",null,"BODY175"],["✗ 你冷静！ → ✓ 我们先冷静一下，好吗？",null,null,"Nǐ lěngjìng! | Wǒmen xiān lěngjìng yīxià, hǎo ma?",null,"BODY176"],["✗ 我生气你。 → ✓ 我对你有点生气。/ 我生你的气。",null,null,"Wǒ shēngqì nǐ. | Wǒ duì nǐ yǒudiǎn shēngqì. / | Wǒ shēng nǐ de qì.",null,"BODY177"],["✗ 我们妥协吧。 (nghe như chịu thua) → ✓ 我们能不能各让一步？",null,null,"Wǒmen tuǒxié ba. | Wǒmen néng bùnéng gè ràng yībù?",null,"BODY178"],["✗ 他推责任给我。 → ✓ 他把责任推到我身上。/ 他推卸责任。",null,null,"Tā tuī zérèn gěi wǒ. | Tā bǎ zérèn tuī dào wǒ shēnshang. / | Tā tuīxièzérèn.",null,"BODY179"],["Lưu ý văn hóa: người TQ rất coi trọng 面子 → phê bình nên nói riêng; khi hòa giải nên bắt đầu bằng 我理解你的难处 trước khi nói 不过.",null,null,"Miànzi | Wǒ lǐjiě nǐ de nánchù | Bùguò .",null,"BODY180"],["Phát âm: 焦虑 jiāolǜ; 推卸 tuīxiè; 妥协 tuǒxié; 情绪 qíngxù; 协调 xiétiáo.",null,null,"Jiāolǜ | Tuīxiè | Tuǒxié | Qíngxù | Xiétiáo",null,"BODY181"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY182-C"],["Ghi âm cách xử lý một cuộc tranh cãi 3 phút (thật hoặc tưởng tượng) theo 4 bước: làm dịu cảm xúc → làm rõ sự thật → tìm mục tiêu chung → phương án thỏa hiệp.",null,null,null,null,"BODY183"],["HSK4: thay bằng bài nói 2 phút \"Áp lực công việc của tôi và cách tôi giải tỏa\".",null,null,null,null,"BODY184"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY185"],["Buổi 17 — 商务谈判与协商 Đàm phán thương mại",null,null,"Shāngwùtánpàn yǔ xiéshāng",null,"BODY186-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY187-C"],["HSK4: Hỏi giá, đề nghị giảm giá, hỏi điều kiện giao hàng và thanh toán. HSK5: Đàm phán trọn gói giá – thanh toán – tiến độ; dùng nhượng bộ có điều kiện.",null,null,null,null,"BODY188"],["Nguyên tắc nhượng bộ: không bao giờ nhượng bộ miễn phí → luôn dùng \"如果……，我们可以……\" (nếu bên kia cho cái gì, mình mới đổi lại cái gì).",null,null,"Rúguǒ……, wǒmen kěyǐ……",null,"BODY189"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY190-C"],["1. Hỏi: 你买东西的时候会讲价吗？一般怎么讲？ (Mua đồ bạn có mặc cả không? Thường mặc cả thế nào?)",null,null,"Nǐ mǎi dōngxi de shíhou huì jiǎngjià ma? Yībān zěnme jiǎng?",null,"BODY191"],["Đáp: 会。我一般先问最低多少钱，然后说别家更便宜，最后说买多一点能不能再便宜。 (Có. Tôi thường hỏi thấp nhất bao nhiêu, rồi nói chỗ khác rẻ hơn, cuối cùng nói mua nhiều có rẻ thêm không.)",null,null,"Huì. Wǒ yībān xiān wèn zuìdī duōshǎo qián, ránhòu shuō biéjiā gèng piányi, zuìhòu shuō mǎi duōyīdiǎn néng bùnéng zài piányi.",null,"BODY192"],["2. Hỏi: 你在工作中参加过谈判吗？ (Trong công việc bạn từng tham gia đàm phán chưa?)",null,null,"Nǐ zài gōngzuò zhōng cānjiā guò tánpàn ma?",null,"BODY193"],["Đáp: 参加过。去年跟一个中国供应商谈了三轮，最后把价格降了百分之六。 (Có. Năm ngoái đàm phán 3 vòng với một NCC TQ, cuối cùng giảm giá 6%.)",null,null,"Cānjiā guò. Qùnián gēn yīgè Zhōngguó gōngyìngshāng tán le sānlún, zuìhòu bǎ jiàgé jiàng le bǎifēnzhīliù.",null,"BODY194"],["3. Hỏi: 你觉得谈判最重要的是什么？ (Bạn thấy đàm phán quan trọng nhất là gì?)",null,null,"Nǐ juéde tánpàn zuì zhòngyào de shì shénme?",null,"BODY195"],["Đáp: 我觉得最重要的是知道自己的底线，还要了解对方真正想要什么。 (Quan trọng nhất là biết giới hạn của mình, còn phải hiểu bên kia thật sự muốn gì.)",null,null,"Wǒ juéde zuì zhòngyào de shì zhīdao zìjǐ de dǐxiàn, háiyào liǎojiě duìfāng zhēnzhèng xiǎngyào shénme.",null,"BODY196"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY197-C"],["1. 报价 (báo giá): 这是我们的最新报价，有效期三十天。 (Đây là báo giá mới nhất, hiệu lực 30 ngày.)",null,null,"Bàojià | Zhè shì wǒmen de zuìxīn bàojià, yǒuxiàoqī sānshítiān.",null,"BODY198"],["2. 预算 (ngân sách): 这个价格超出了我们的预算。 (Giá này vượt ngân sách của chúng tôi.)",null,null,"Yùsuàn | Zhège jiàgé chāochū le wǒmen de yùsuàn.",null,"BODY199"],["3. 让步 (nhượng bộ): 价格上我们已经做了很大的让步。 (Về giá chúng tôi đã nhượng bộ rất nhiều.)",null,null,"Ràngbù | Jiàgé shàng wǒmen yǐjīng zuò le hěndà de ràngbù.",null,"BODY200"],["4. 底线 (giới hạn cuối, giá sàn): 一百二十万是我们的底线，不能再低了。 (1,2 triệu là giá sàn, không thể thấp hơn.)",null,null,"Dǐxiàn | Yībǎi'èrshíwàn shì wǒmen de dǐxiàn, bùnéng zài dī le.",null,"BODY201"],["5. 折扣 (chiết khấu): 如果订单超过一万件，可以给百分之五的折扣。 (Đơn trên 10.000 cái được chiết khấu 5%.)",null,null,"Zhékòu | Rúguǒ dìngdān chāoguò yī wànjiàn, kěyǐ gěi bǎifēnzhīwǔ de zhékòu.",null,"BODY202"],["6. 付款方式 (phương thức thanh toán): 我们的付款方式是百分之三十预付，百分之七十见提单付款。 (Thanh toán: trả trước 30%, 70% khi nhận vận đơn.)",null,null,"Fùkuǎn fāngshì | Wǒmen de fùkuǎn fāngshì shì bǎifēnzhīsānshí yùfù, bǎifēnzhīqīshí jiàn tídān fùkuǎn.",null,"BODY203"],["7. 交货期 (thời gian giao hàng): 交货期能不能从四十五天缩短到三十天？ (Thời gian giao rút từ 45 xuống 30 ngày được không?)",null,null,"Jiāohuòqī | Jiāohuòqī néng bùnéng cóng sìshíwǔtiān suōduǎn dào sānshítiān?",null,"BODY204"],["8. 起订量 (số lượng đặt tối thiểu – MOQ): 这款产品的起订量是五千件。 (MOQ sản phẩm này là 5.000 cái.)",null,null,"Qǐ dìng liàng | Zhè kuǎn chǎnpǐn de qǐ dìng liàng shì wǔqiān jiàn.",null,"BODY205"],["9. 贵方 / 我方 (quý bên / bên chúng tôi): 我方希望贵方能在价格上再考虑一下。 (Bên chúng tôi mong quý bên cân nhắc thêm về giá.)",null,null,"Guìfāng | Wǒfāng | Wǒfāng xīwàng guìfāng néng zài jiàgé shàng zài kǎolǜyīxià.",null,"BODY206"],["10. 诚意 (thành ý): 为了表示诚意，我们愿意承担运费。 (Để thể hiện thành ý, chúng tôi sẵn sàng chịu phí vận chuyển.)",null,null,"Chéngyì | Wèile biǎoshì chéngyì, wǒmen yuànyì chéngdān yùnfèi.",null,"BODY207"],["11. 双赢 (đôi bên cùng có lợi): 我们希望找到一个双赢的方案。 (Chúng tôi mong tìm được phương án đôi bên cùng có lợi.)",null,null,"Shuāngyíng | Wǒmen xīwàng zhǎodào yīgè shuāngyíng de fāng'àn.",null,"BODY208"],["12. 长期合作 (hợp tác lâu dài): 考虑到长期合作，这次我们可以优惠一点。 (Xét hợp tác lâu dài, lần này có thể ưu đãi chút.)",null,null,"Chángqī hézuò | Kǎolǜ dào chángqī hézuò, zhècì wǒmen kěyǐ yōuhuì yīdiǎn.",null,"BODY209"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY210-C"],["1. 如果贵方能……，我们可以…… (Nếu quý bên có thể …, chúng tôi có thể …)",null,null,"Rúguǒ guìfāng néng……, wǒmen kěyǐ……",null,"BODY211"],["Ví dụ: 如果贵方能把订单增加到一万件，我们可以再降百分之三。 (Nếu quý bên tăng đơn lên 10.000 cái, chúng tôi giảm thêm 3%.)",null,null,"Rúguǒ guìfāng néng bǎ dìngdān zēngjiā dào yī wànjiàn, wǒmen kěyǐ zài jiàng bǎifēnzhīsān.",null,"BODY212"],["Ví dụ: 如果贵方能预付百分之五十，我们可以把交货期缩短一个星期。 (Nếu quý bên trả trước 50%, chúng tôi rút ngắn thời gian giao một tuần.)",null,null,"Rúguǒ guìfāng néng yùfù bǎifēnzhīwǔshí, wǒmen kěyǐ bǎ jiāohuòqī suōduǎn yīgè xīngqī.",null,"BODY213"],["2. 这个价格比我们的预期高了……，能不能…… (Giá này cao hơn dự kiến của chúng tôi …, có thể … không)",null,null,"Zhège jiàgébǐ wǒmen de yùqī gāo le……, néng bùnéng……",null,"BODY214"],["Ví dụ: 这个价格比我们的预期高了百分之十，能不能再优惠一点？ (Giá này cao hơn dự kiến 10%, ưu đãi thêm được không?)",null,null,"Zhège jiàgébǐ wǒmen de yùqī gāo le bǎifēnzhīshí, néng bùnéng zài yōuhuì yīdiǎn?",null,"BODY215"],["Ví dụ: 这个价格比去年高了不少，能不能保持去年的价格？ (Giá này cao hơn năm ngoái khá nhiều, giữ giá năm ngoái được không?)",null,null,"Zhège jiàgébǐ qùnián gāo le bùshǎo, néng bùnéng bǎochí qùnián de jiàgé?",null,"BODY216"],["3. ……是我们的底线了，再低的话…… (… là giới hạn cuối rồi, thấp hơn nữa thì …)",null,null,"…… Shì wǒmen de dǐxiàn le, zài dī dehuà……",null,"BODY217"],["Ví dụ: 九十五万是我们的底线了，再低的话我们就亏本了。 (950 nghìn là giá sàn rồi, thấp hơn nữa chúng tôi lỗ vốn.)",null,null,"Jiǔshíwǔwàn shì wǒmen de dǐxiàn le, zài dī dehuà wǒmen jiù kuīběn le.",null,"BODY218"],["Ví dụ: 六十天的账期是我们的底线了，再长的话我们的资金压力太大。 (Công nợ 60 ngày là giới hạn rồi, dài hơn áp lực vốn quá lớn.)",null,null,"Liùshítiān de zhàng qī shì wǒmen de dǐxiàn le, zài zhǎng dehuà wǒmen de zījīn yālì tài dà.",null,"BODY219"],["4. 价格我们可以再考虑，但是…… (Giá chúng tôi có thể cân nhắc thêm, nhưng …)",null,null,"Jiàgé wǒmen kěyǐ zài kǎolǜ, dànshì……",null,"BODY220"],["Ví dụ: 价格我们可以再考虑，但是付款方式必须是预付百分之三十。 (Giá có thể cân nhắc thêm, nhưng thanh toán phải trả trước 30%.)",null,null,"Jiàgé wǒmen kěyǐ zài kǎolǜ, dànshì fùkuǎn fāngshì bìxū shì yùfù bǎifēnzhīsānshí.",null,"BODY221"],["Ví dụ: 价格我们可以再考虑，但是起订量不能少于五千件。 (Giá có thể cân nhắc, nhưng số lượng tối thiểu không dưới 5.000 cái.)",null,null,"Jiàgé wǒmen kěyǐ zài kǎolǜ, dànshì qǐ dìng liàng bùnéng shǎoyú wǔqiān jiàn.",null,"BODY222"],["5. 我们对比了几家供应商，…… (Chúng tôi đã so sánh vài NCC, …)",null,null,"Wǒmen duìbǐ le jǐjiā gōngyìngshāng,……",null,"BODY223"],["Ví dụ: 我们对比了几家供应商，贵方的价格是最高的。 (Chúng tôi so sánh vài NCC, giá quý bên cao nhất.)",null,null,"Wǒmen duìbǐ le jǐjiā gōngyìngshāng, guìfāng de jiàgé shì zuìgāo de.",null,"BODY224"],["Ví dụ: 我们对比了几家供应商，贵方的质量最好，所以我们很希望跟贵方合作。 (So sánh vài NCC, chất lượng quý bên tốt nhất, nên rất mong hợp tác.)",null,null,"Wǒmen duìbǐ le jǐjiā gōngyìngshāng, guìfāng de zhìliàng zuìhǎo, suǒyǐ wǒmen hěn xīwàng gēn guìfāng hézuò.",null,"BODY225"],["6. 为了表示诚意，我们愿意…… (Để thể hiện thành ý, chúng tôi sẵn sàng …)",null,null,"Wèile biǎoshì chéngyì, wǒmen yuànyì……",null,"BODY226"],["Ví dụ: 为了表示诚意，我们愿意免费提供第一批的样品。 (Để thể hiện thành ý, chúng tôi sẵn sàng tặng miễn phí mẫu lô đầu.)",null,null,"Wèile biǎoshì chéngyì, wǒmen yuànyì miǎnfèi tígōng dìyīpī de yàngpǐn.",null,"BODY227"],["Ví dụ: 为了表示诚意，我们愿意把保修期从一年延长到两年。 (Để thể hiện thành ý, chúng tôi kéo dài bảo hành từ 1 lên 2 năm.)",null,null,"Wèile biǎoshì chéngyì, wǒmen yuànyì bǎ bǎoxiūqī cóng yīnián yáncháng dào liǎngnián.",null,"BODY228"],["7. 我需要跟……商量一下，……之前给您答复 (Tôi cần bàn với …, trước … trả lời ngài)",null,null,"Wǒ xūyào gēn…… shāngliangyīxià,…… zhīqián gěi nín dáfù",null,"BODY229"],["Ví dụ: 这个条件我需要跟我们老板商量一下，明天中午之前给您答复。 (Điều kiện này tôi cần bàn với sếp, trước trưa mai trả lời ngài.)",null,null,"Zhège tiáojiàn wǒ xūyào gēn wǒmen lǎobǎn shāngliangyīxià, míngtiān zhōngwǔ zhīqián gěi nín dáfù.",null,"BODY230"],["Ví dụ: 我需要跟财务部商量一下，周五之前给您答复。 (Tôi cần bàn với phòng tài chính, trước thứ 6 trả lời ngài.)",null,null,"Wǒ xūyào gēn cáiwùbù shāngliangyīxià, zhōuwǔ zhīqián gěi nín dáfù.",null,"BODY231"],["8. 我们确认一下今天谈好的条件：…… (Chúng ta xác nhận lại các điều kiện đã thống nhất hôm nay: …)",null,null,"Wǒmen quèrèn yīxià jīntiān tán hǎo de tiáojiàn:……",null,"BODY232"],["Ví dụ: 我们确认一下今天谈好的条件：单价一点零五美元，数量一万件，三十天交货。 (Xác nhận điều kiện đã thống nhất: đơn giá 1,05 USD, số lượng 10.000 cái, giao trong 30 ngày.)",null,null,"Wǒmen quèrèn yīxià jīntiān tán hǎo de tiáojiàn: dānjià yīdiǎn líng wǔměiyuán, shùliàng yī wànjiàn, sānshítiān jiāohuò.",null,"BODY233"],["9. (HSK5) 我们可以在……上让步，不过作为交换，希望贵方…… (Chúng tôi có thể nhượng bộ về …, nhưng đổi lại, mong quý bên …)",null,null,"Wǒmen kěyǐ zài…… shàng ràngbù, bùguò zuòwéi jiāohuàn, xīwàng guìfāng……",null,"BODY234"],["Ví dụ: 我们可以在价格上让步，不过作为交换，希望贵方签两年的合同。 (Chúng tôi nhượng bộ về giá, nhưng đổi lại mong quý bên ký hợp đồng 2 năm.)",null,null,"Wǒmen kěyǐ zài jiàgé shàng ràngbù, bùguò zuòwéi jiāohuàn, xīwàng guìfāng qiān liǎngnián de hétong.",null,"BODY235"],["Ví dụ: 我们可以在交货期上让步，不过作为交换，希望贵方接受分两批发货。 (Chúng tôi nhượng bộ thời gian giao, đổi lại mong quý bên chấp nhận giao 2 đợt.)",null,null,"Wǒmen kěyǐ zài jiāohuòqī shàng ràngbù, bùguò zuòwéi jiāohuàn, xīwàng guìfāng jiēshòu fēn liǎngpī fāhuò.",null,"BODY236"],["10. (HSK5) 与其在……上僵持，不如我们换个角度…… (Thay vì giằng co về …, chi bằng chúng ta đổi góc nhìn …)",null,null,"Yǔqí zài…… shàng jiāngchí, bùrú wǒmen huàn gè jiǎodù……",null,"BODY237"],["Ví dụ: 与其在单价上僵持，不如我们换个角度，看看能不能通过增加数量来降低总成本。 (Thay vì giằng co về đơn giá, chi bằng đổi góc nhìn, xem có thể giảm tổng chi phí bằng cách tăng số lượng không.)",null,null,"Yǔqí zài dānjià shàng jiāngchí, bùrú wǒmen huàn gè jiǎodù, kànkan néng bùnéng tōngguò zēngjiā shùliàng lái jiàngdī zǒngchéngběn.",null,"BODY238"],["情景对话 1 — Hỏi giá và điều kiện cơ bản qua điện thoại (HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY239-C"],["采购: 您好，是华信公司的刘经理吗？我是越南ABC公司的采购小黄。 (Chào anh, có phải giám đốc Lưu công ty Hoa Tín không? Tôi là Tiểu Hoàng, mua hàng công ty ABC Việt Nam.)",null,null,"Cǎigòu: nínhǎo, shì Huáxìn gōngsī de Liú jīnglǐ ma? Wǒ shì Yuènán ABC gōngsī de cǎigòu Xiǎo Huáng.",null,"BODY240"],["供应商: 您好，黄小姐！请问有什么可以帮您？ (Chào cô Hoàng! Tôi có thể giúp gì?)",null,null,"Gōngyìngshāng: nínhǎo, Huáng xiǎojiě! Qǐngwèn yǒu shénme kěyǐ bāng nín?",null,"BODY241"],["采购: 我们看到贵公司的不锈钢水壶，想了解一下价格。如果订五千个，单价是多少？ (Chúng tôi thấy bình nước inox của quý công ty, muốn tìm hiểu giá. Nếu đặt 5.000 cái, đơn giá bao nhiêu?)",null,null,"Cǎigòu: wǒmen kàndào guì gōngsī de bùxiùgāng shuǐhú, xiǎng liǎojiě yīxià jiàgé. Rúguǒ dìng wǔqiāngè, dānjià shì duōshǎo?",null,"BODY242"],["供应商: 五千个的话，单价是四点五美元，FOB深圳。 (5.000 cái thì đơn giá 4,5 USD, FOB Thâm Quyến.)",null,null,"Gōngyìngshāng: wǔqiāngè dehuà, dānjià shì sìdiǎn wǔměiyuán, FOB Shēnzhèn.",null,"BODY243"],["采购: 这个价格比我们的预期高了一点。如果订一万个呢？ (Giá này cao hơn dự kiến chút. Nếu đặt 10.000 cái thì sao?)",null,null,"Cǎigòu: zhège jiàgébǐ wǒmen de yùqī gāo le yīdiǎn. Rúguǒ dìng yīwàngè ne?",null,"BODY244"],["供应商: 一万个可以给您四点二美元。 (10.000 cái có thể 4,2 USD.)",null,null,"Gōngyìngshāng: yīwàngè kěyǐ gěi nín sìdiǎn èr měiyuán.",null,"BODY245"],["采购: 起订量是多少？ (MOQ là bao nhiêu?)",null,null,"Cǎigòu: qǐ dìng liàng shì duōshǎo?",null,"BODY246"],["供应商: 起订量是三千个，每个颜色至少一千个。 (MOQ 3.000 cái, mỗi màu ít nhất 1.000 cái.)",null,null,"Gōngyìngshāng: qǐ dìng liàng shì sānqiāngè, měigè yánsè zhìshǎo yīqiāngè.",null,"BODY247"],["采购: 交货期要多久？ (Thời gian giao bao lâu?)",null,null,"Cǎigòu: jiāohuòqī yào duōjiǔ?",null,"BODY248"],["供应商: 收到定金以后三十五天。 (Nhận cọc xong 35 ngày.)",null,null,"Gōngyìngshāng: shōudào dìngjīn yǐhòu sānshíwǔ tiān.",null,"BODY249"],["采购: 付款方式是怎么样的？ (Phương thức thanh toán thế nào?)",null,null,"Cǎigòu: fùkuǎn fāngshì shì zěnmeyàng de?",null,"BODY250"],["供应商: 百分之三十定金，百分之七十出货前付清。 (Cọc 30%, 70% trả hết trước khi xuất hàng.)",null,null,"Gōngyìngshāng: bǎifēnzhīsānshí dìngjīn, bǎifēnzhīqīshí chūhuò qián fùqīng.",null,"BODY251"],["采购: 能不能改成百分之七十见提单付款？这样我们比较放心。 (Đổi thành 70% thanh toán khi nhận vận đơn được không? Như vậy bên tôi yên tâm hơn.)",null,null,"Cǎigòu: néng bùnéng gǎichéng bǎifēnzhīqīshí jiàn tídān fùkuǎn? Zhèyàng wǒmen bǐjiào fàngxīn.",null,"BODY252"],["供应商: 第一次合作的话，我们一般要求出货前付清。合作几次以后可以再商量。 (Lần đầu hợp tác, chúng tôi thường yêu cầu trả hết trước khi xuất. Hợp tác vài lần rồi có thể bàn thêm.)",null,null,"Gōngyìngshāng: dìyīcì hézuò dehuà, wǒmen yībān yāoqiú chūhuò qián fùqīng. Hézuò jǐcì yǐhòu kěyǐ zài shāngliang.",null,"BODY253"],["采购: 明白。能先寄两个样品给我们吗？ (Hiểu rồi. Có thể gửi trước 2 mẫu cho chúng tôi không?)",null,null,"Cǎigòu: míngbai. Néng xiānjì liǎnggè yàngpǐn gěi wǒmen ma?",null,"BODY254"],["供应商: 可以，样品免费，运费需要您那边承担。 (Được, mẫu miễn phí, phí vận chuyển bên cô chịu.)",null,null,"Gōngyìngshāng: kěyǐ, yàngpǐn miǎnfèi, yùnfèi xūyào nín nàbiān chéngdān.",null,"BODY255"],["采购: 好的。麻烦您把正式的报价单发到我的邮箱，我们内部讨论一下，下周给您答复。 (Vâng. Phiền anh gửi báo giá chính thức vào email tôi, nội bộ bàn bạc rồi tuần sau trả lời anh.)",null,null,"Cǎigòu: hǎo de. Máfan nín bǎ zhèngshì de bàojiàdān fādào wǒ de yóuxiāng, wǒmen nèibù tǎolùnyīxià, xiàzhōu gěi nín dáfù.",null,"BODY256"],["情景对话 2 — Mặc cả giảm giá: dùng đối thủ và số lượng làm đòn bẩy (HSK4–5)",null,null,"Qíngjǐng duìhuà",null,"BODY257-C"],["采购: 刘经理，样品我们测试过了，质量不错。不过价格方面，我们对比了几家供应商，贵方的价格是最高的。 (Giám đốc Lưu, mẫu chúng tôi thử rồi, chất lượng tốt. Nhưng về giá, chúng tôi so sánh vài NCC, giá quý bên cao nhất.)",null,null,"Cǎigòu: Liú jīnglǐ, yàngpǐn wǒmen cèshì guò le, zhìliàng bùcuò. Bùguò jiàgé fāngmiàn, wǒmen duìbǐ le jǐjiā gōngyìngshāng, guìfāng de jiàgé shì zuìgāo de.",null,"BODY258"],["供应商: 黄小姐，我们的质量您也看到了，用的是304不锈钢，很多便宜的用的是201。 (Cô Hoàng, chất lượng của chúng tôi cô cũng thấy rồi, dùng inox 304, nhiều loại rẻ dùng 201.)",null,null,"Gōngyìngshāng: Huáng xiǎojiě, wǒmen de zhìliàng nín yě kàndào le, yòng de shì 304 bùxiùgāng, hěnduō piányi de yòng de shì 201.",null,"BODY259"],["采购: 我们对比的也都是304的。另一家的报价是三点九美元。 (Chúng tôi so sánh cũng toàn loại 304. Một nhà khác báo 3,9 USD.)",null,null,"Cǎigòu: wǒmen duìbǐ de yě dōu shì 304 de. Lìngyījiā de bàojià shì sāndiǎn jiǔ měiyuán.",null,"BODY260"],["供应商: 三点九太低了，我们的成本都不止。 (3,9 thấp quá, chi phí của chúng tôi còn hơn thế.)",null,null,"Gōngyìngshāng: sāndiǎn jiǔ tài dī le, wǒmen de chéngběn dōu bùzhǐ.",null,"BODY261"],["采购: 我理解。那我们换个方式：如果我们第一次订一万五千个，单价能不能降到四美元？ (Tôi hiểu. Vậy đổi cách: nếu lần đầu chúng tôi đặt 15.000 cái, đơn giá giảm xuống 4 USD được không?)",null,null,"Cǎigòu: wǒ lǐjiě. Nà wǒmen huàn gè fāngshì: rúguǒ wǒmen dìyīcì dìng yīwànwǔqiāngè, dānjià néng bùnéng jiàngdào sì měiyuán?",null,"BODY262"],["供应商: 一万五千个的话，最多四点一。 (15.000 cái thì tối đa 4,1.)",null,null,"Gōngyìngshāng: yīwànwǔqiāngè dehuà, zuì duō sìdiǎn yī.",null,"BODY263"],["采购: 四点一还是比我们的预算高。我们的预算是四美元。 (4,1 vẫn cao hơn ngân sách. Ngân sách chúng tôi là 4 USD.)",null,null,"Cǎigòu: sìdiǎn yī háishì bǐ wǒmen de yùsuàn gāo. Wǒmen de yùsuàn shì sì měiyuán.",null,"BODY264"],["供应商: 价格我们可以再考虑，但是付款方式必须是出货前付清。 (Giá chúng tôi có thể cân nhắc thêm, nhưng thanh toán phải trả hết trước khi xuất hàng.)",null,null,"Gōngyìngshāng: jiàgé wǒmen kěyǐ zài kǎolǜ, dànshì fùkuǎn fāngshì bìxū shì chūhuò qián fùqīng.",null,"BODY265"],["采购: 可以接受。另外，包装上要印我们的标志，这个要加钱吗？ (Chấp nhận được. Ngoài ra, bao bì phải in logo của chúng tôi, có tính thêm tiền không?)",null,null,"Cǎigòu: kěyǐ jiēshòu. Lìngwài, bāozhuāng shàng yào yìn wǒmen de biāozhì, zhège yào jiā qián ma?",null,"BODY266"],["供应商: 印标志每个加零点零五美元。 (In logo mỗi cái thêm 0,05 USD.)",null,null,"Gōngyìngshāng: yìn biāozhì měigè jiā língdiǎn líng wǔměiyuán.",null,"BODY267"],["采购: 如果贵方能免费印标志，单价四点零五美元，我们今天就可以确认订单。 (Nếu quý bên in logo miễn phí, đơn giá 4,05 USD, hôm nay chúng tôi có thể xác nhận đơn.)",null,null,"Cǎigòu: rúguǒ guìfāng néng miǎnfèi yìn biāozhì, dānjià sìdiǎn líng wǔměiyuán, wǒmen jīntiān jiù kěyǐ quèrèn dìngdān.",null,"BODY268"],["供应商: ……好吧，看在第一次合作的份上，四点零五，免费印标志。 (…Thôi được, vì lần đầu hợp tác, 4,05, in logo miễn phí.)",null,null,"Gōngyìngshāng:…… hǎo ba, kàn zài dìyīcì hézuò de fèn shàng, sìdiǎn líng wǔ, miǎnfèi yìn biāozhì.",null,"BODY269"],["采购: 谢谢刘经理！我们确认一下今天谈好的条件：数量一万五千个，单价四点零五美元FOB深圳，免费印标志，百分之三十定金，出货前付清，三十五天交货。 (Cảm ơn giám đốc Lưu! Xác nhận lại điều kiện hôm nay: số lượng 15.000 cái, đơn giá 4,05 USD FOB Thâm Quyến, in logo miễn phí, cọc 30%, trả hết trước khi xuất, giao trong 35 ngày.)",null,null,"Cǎigòu: xièxie Liú jīnglǐ! Wǒmen quèrèn yīxià jīntiān tán hǎo de tiáojiàn: shùliàng yīwànwǔqiāngè, dānjià sìdiǎn líng wǔměiyuán FOB Shēnzhèn, miǎnfèi yìn biāozhì, bǎifēnzhīsānshí dìngjīn, chūhuò qián fùqīng, sānshíwǔ tiān jiāohuò.",null,"BODY270"],["供应商: 没错。我今天把合同发给您。 (Chính xác. Hôm nay tôi gửi hợp đồng cho cô.)",null,null,"Gōngyìngshāng: méicuò. Wǒ jīntiān bǎ hétong fāgěinín.",null,"BODY271"],["情景对话 3 — Đàm phán thời gian giao hàng gấp",null,null,"Qíngjǐng duìhuà",null,"BODY272-C"],["客户: 阮经理，我们的新店下个月十五号开业，这批家具能不能二十天之内交货？ (Giám đốc Nguyễn, cửa hàng mới của chúng tôi khai trương ngày 15 tháng sau, lô nội thất này giao trong 20 ngày được không?)",null,null,"Kèhù: Ruǎn jīnglǐ, wǒmen de xīndiàn xiàgèyuè shíwǔhào kāiyè, zhè pī jiājù néng bùnéng èrshítiān zhīnèi jiāohuò?",null,"BODY273"],["阮经理: 王总，我们正常的交货期是四十天，二十天确实很紧张。 (Vương tổng, thời gian giao bình thường của chúng tôi là 40 ngày, 20 ngày thật sự rất gấp.)",null,null,"Ruǎn jīnglǐ: Wáng zǒng, wǒmen zhèngcháng de jiāohuòqī shì sìshítiān, èrshítiān quèshí hěn jǐnzhāng.",null,"BODY274"],["客户: 我知道，但是开业的时间改不了。 (Tôi biết, nhưng ngày khai trương không đổi được.)",null,null,"Kèhù: wǒ zhīdao, dànshì kāiyè de shíjiān gǎibùliǎo.",null,"BODY275"],["阮经理: 我理解。我们看看能不能想办法。这批货一共一百二十套，能不能分两批交？ (Tôi hiểu. Để xem có cách nào không. Lô này tổng 120 bộ, giao làm 2 đợt được không?)",null,null,"Ruǎn jīnglǐ: wǒ lǐjiě. Wǒmen kànkan néng bùnéng xiǎng bànfǎ. Zhè pīhuò yīgòng yībǎi'èrshí tào, néng bùnéng fēn liǎngpī jiāo?",null,"BODY276"],["客户: 怎么分？ (Chia thế nào?)",null,null,"Kèhù: zěnme fēn?",null,"BODY277"],["阮经理: 第一批六十套，二十天交，够您新店开业用；第二批六十套，四十天交。 (Đợt một 60 bộ, giao 20 ngày, đủ cho cửa hàng mới khai trương; đợt hai 60 bộ, giao 40 ngày.)",null,null,"Ruǎn jīnglǐ: dìyīpī liùshí tào, èrshítiān jiāo, gòu nín xīndiàn kāiyè yòng; dì'èrpī liùshí tào, sìshítiān jiāo.",null,"BODY278"],["客户: 嗯，开业的时候六十套应该够了。不过第一批你们能保证吗？ (Ừm, lúc khai trương 60 bộ chắc đủ. Nhưng đợt đầu các anh đảm bảo được không?)",null,null,"Kèhù: ń, kāiyè de shíhou liùshí tào yīnggāi gòu le. Bùguò dìyīpī nǐmen néng bǎozhèng ma?",null,"BODY279"],["阮经理: 要保证二十天，我们必须安排加班，还要空运一部分配件，成本会增加。 (Để đảm bảo 20 ngày, chúng tôi phải tăng ca, còn phải vận chuyển hàng không một phần phụ kiện, chi phí sẽ tăng.)",null,null,"Ruǎn jīnglǐ: yào bǎozhèng èrshítiān, wǒmen bìxū ānpái jiābān, háiyào kōngyùn yībùfen pèijiàn, chéngběn huì zēngjiā.",null,"BODY280"],["客户: 增加多少？ (Tăng bao nhiêu?)",null,null,"Kèhù: zēngjiā duōshǎo?",null,"BODY281"],["阮经理: 第一批每套加百分之八的加急费。 (Đợt một mỗi bộ thêm 8% phí gấp.)",null,null,"Ruǎn jīnglǐ: dìyīpī měitào jiā bǎifēnzhībā de jiājí fèi.",null,"BODY282"],["客户: 百分之八太多了，百分之五吧。 (8% nhiều quá, 5% đi.)",null,null,"Kèhù: bǎifēnzhībā tài duō le, bǎifēnzhīwǔ ba.",null,"BODY283"],["阮经理: 如果贵方能把第一批的货款提前付清，我们可以接受百分之五，因为我们需要资金先买材料。 (Nếu quý bên thanh toán trước toàn bộ tiền hàng đợt một, chúng tôi chấp nhận 5%, vì cần vốn mua vật liệu trước.)",null,null,"Ruǎn jīnglǐ: rúguǒ guìfāng néng bǎ dìyīpī de huòkuǎn tíqián fùqīng, wǒmen kěyǐ jiēshòu bǎifēnzhīwǔ, yīnwèi wǒmen xūyào zījīn xiānmǎi cáiliào.",null,"BODY284"],["客户: 可以，第一批我们这周就全款付清。 (Được, đợt một tuần này chúng tôi trả đủ.)",null,null,"Kèhù: kěyǐ, dìyīpī wǒmen zhè zhōu jiù quánkuǎn fùqīng.",null,"BODY285"],["阮经理: 好。另外，如果我们晚交了，按合同每天赔偿千分之五，您看可以吗？ (Được. Ngoài ra, nếu chúng tôi giao trễ, theo hợp đồng mỗi ngày bồi thường 0,5%, ngài thấy được không?)",null,null,"Ruǎn jīnglǐ: hǎo. Lìngwài, rúguǒ wǒmen wǎn jiāo le, àn hétong měitiān péicháng qiānfēnzhī wǔ, nín kàn kěyǐ ma?",null,"BODY286"],["客户: 可以，这样我比较放心。 (Được, như vậy tôi yên tâm hơn.)",null,null,"Kèhù: kěyǐ, zhèyàng wǒ bǐjiào fàngxīn.",null,"BODY287"],["阮经理: 那我今天就修改合同，明天发给您确认。 (Vậy hôm nay tôi sửa hợp đồng, mai gửi ngài xác nhận.)",null,null,"Ruǎn jīnglǐ: nà wǒ jīntiān jiù xiūgǎi hétong, míngtiān fāgěinín quèrèn.",null,"BODY288"],["情景对话 4 — Đàm phán điều kiện thanh toán / công nợ",null,null,"Qíngjǐng duìhuà",null,"BODY289-C"],["客户: 陈经理，我们想把付款方式从月结三十天改成月结九十天。 (Giám đốc Trần, chúng tôi muốn đổi thanh toán từ công nợ 30 ngày thành 90 ngày.)",null,null,"Kèhù: Chén jīnglǐ, wǒmen xiǎng bǎ fùkuǎn fāngshì cóng yuè jié sānshítiān gǎichéng yuè jié jiǔshítiān.",null,"BODY290"],["陈经理: 九十天太长了，我们是小公司，资金压力很大。 (90 ngày dài quá, chúng tôi là công ty nhỏ, áp lực vốn rất lớn.)",null,null,"Chén jīnglǐ: jiǔshítiān tài zhǎng le, wǒmen shì xiǎo gōngsī, zījīn yālì hěndà.",null,"BODY291"],["客户: 我们公司现在所有的供应商都是九十天，这是总部的新规定。 (Công ty chúng tôi giờ mọi NCC đều 90 ngày, đây là quy định mới của tổng bộ.)",null,null,"Kèhù: wǒmen gōngsī xiànzài suǒyǒu de gōngyìngshāng dōu shì jiǔshítiān, zhè shì zǒngbù de xīn guīdìng.",null,"BODY292"],["陈经理: 我理解贵方的规定，不过六十天是我们的底线了，再长的话我们周转不过来。 (Tôi hiểu quy định của quý bên, nhưng 60 ngày là giới hạn rồi, dài hơn chúng tôi xoay vòng vốn không nổi.)",null,null,"Chén jīnglǐ: wǒ lǐjiě guìfāng de guīdìng, bùguò liùshítiān shì wǒmen de dǐxiàn le, zài zhǎng dehuà wǒmen zhōuzhuǎn bù guòlái.",null,"BODY293"],["客户: 那我们也很难办，总部不会为一家供应商改规定。 (Vậy chúng tôi cũng khó xử, tổng bộ sẽ không vì một NCC mà đổi quy định.)",null,null,"Kèhù: nà wǒmen yě hěn nánbàn, zǒngbù bùhuì wèi yījiā gōngyìngshāng gǎi guīdìng.",null,"BODY294"],["陈经理: 那我们换个角度：九十天我们可以接受，但是价格要上调百分之二，因为我们要向银行贷款，有利息成本。 (Vậy đổi góc nhìn: 90 ngày chúng tôi chấp nhận, nhưng giá tăng 2%, vì chúng tôi phải vay ngân hàng, có chi phí lãi.)",null,null,"Chén jīnglǐ: nà wǒmen huàn gè jiǎodù: jiǔshítiān wǒmen kěyǐ jiēshòu, dànshì jiàgé yào shàngtiáo bǎifēnzhī'èr, yīnwèi wǒmen yào xiàng yínhángdàikuǎn, yǒu lìxī chéngběn.",null,"BODY295"],["客户: 涨价恐怕不行，今年的预算已经定了。 (Tăng giá e là không được, ngân sách năm nay đã chốt.)",null,null,"Kèhù: zhǎngjià kǒngpà bùxíng, jīnnián de yùsuàn yǐjīng dìng le.",null,"BODY296"],["陈经理: 那还有一个办法：九十天账期，但是如果贵方在三十天内付款，我们给百分之二的现金折扣。这样贵方可以自己选。 (Vậy còn một cách: công nợ 90 ngày, nhưng nếu quý bên trả trong 30 ngày, chúng tôi chiết khấu tiền mặt 2%. Như vậy quý bên tự chọn.)",null,null,"Chén jīnglǐ: nà háiyǒu yīgè bànfǎ: jiǔshítiān zhàng qī, dànshì rúguǒ guìfāng zài sānshítiān nèi fùkuǎn, wǒmen gěi bǎifēnzhī'èr de xiànjīn zhékòu. Zhèyàng guìfāng kěyǐ zìjǐ xuǎn.",null,"BODY297"],["客户: 这个办法不错！我们财务应该会喜欢。 (Cách này hay! Phòng tài chính chúng tôi chắc sẽ thích.)",null,null,"Kèhù: zhège bànfǎ bùcuò! Wǒmen cáiwù yīnggāi huì xǐhuan.",null,"BODY298"],["陈经理: 另外，能不能先付百分之二十的预付款，剩下的再按九十天？ (Ngoài ra, có thể trả trước 20%, phần còn lại theo 90 ngày không?)",null,null,"Chén jīnglǐ: lìngwài, néng bùnéng xiānfù bǎifēnzhī'èrshí de yùfùkuǎn, shèngxià de zài àn jiǔshítiān?",null,"BODY299"],["客户: 预付款我需要跟财务确认一下，明天给您答复。 (Khoản trả trước tôi cần xác nhận với tài chính, mai trả lời anh.)",null,null,"Kèhù: yùfùkuǎn wǒ xūyào gēn cáiwù quèrèn yīxià, míngtiān gěi nín dáfù.",null,"BODY300"],["陈经理: 好的。我们的目标都是长期合作，希望找到一个双赢的方案。 (Vâng. Mục tiêu của chúng ta đều là hợp tác lâu dài, mong tìm được phương án đôi bên cùng có lợi.)",null,null,"Chén jīnglǐ: hǎo de. Wǒmen de mùbiāo dōu shì chángqī hézuò, xīwàng zhǎodào yīgè shuāngyíng de fāng'àn.",null,"BODY301"],["情景对话 5 — (HSK5) Đàm phán trọn gói: nhà cung cấp kiên quyết không giảm giá",null,null,"Qíngjǐng duìhuà",null,"BODY302-C"],["采购经理: 张总，今年的合同我们想重新谈一下。原材料价格下降了，我们希望贵方的报价能降百分之八。 (Trương tổng, hợp đồng năm nay chúng tôi muốn đàm phán lại. Giá nguyên liệu đã giảm, chúng tôi mong báo giá quý bên giảm 8%.)",null,null,"Cǎigòu jīnglǐ: Zhāng zǒng, jīnnián de hétong wǒmen xiǎng chóngxīn tán yīxià. Yuáncáiliào jiàgéxiàjiàng le, wǒmen xīwàng guìfāng de bàojià néng jiàng bǎifēnzhībā.",null,"BODY303"],["供应商: 原材料是降了一点，可是人工和运费都涨了，我们的总成本其实没怎么变。价格我们不能降。 (Nguyên liệu có giảm chút, nhưng nhân công và vận chuyển đều tăng, tổng chi phí thực ra không đổi mấy. Giá chúng tôi không thể giảm.)",null,null,"Gōngyìngshāng: yuáncáiliào shì jiàng le yīdiǎn, kěshì réngōng hé yùnfèi dōu zhǎngle, wǒmen de zǒngchéngběn qíshí méi zěnme biàn. Jiàgé wǒmen bùnéng jiàng.",null,"BODY304"],["采购经理: 我理解贵方的成本压力。不过我们对比了三家供应商，有一家的价格比贵方低百分之十。 (Tôi hiểu áp lực chi phí của quý bên. Nhưng chúng tôi so sánh 3 NCC, có một nhà giá thấp hơn quý bên 10%.)",null,null,"Cǎigòu jīnglǐ: wǒ lǐjiě guìfāng de chéngběn yālì. Bùguò wǒmen duìbǐ le sānjiā gōngyìngshāng, yǒu yījiā de jiàgébǐ guìfāng dī bǎifēnzhīshí.",null,"BODY305"],["供应商: 我们合作了五年，质量和交期一直很稳定。换一家新的，风险您也要考虑。 (Chúng ta hợp tác 5 năm, chất lượng và thời gian giao luôn ổn định. Đổi nhà mới, rủi ro ngài cũng phải tính.)",null,null,"Gōngyìngshāng: wǒmen hézuò le wǔnián, zhìliàng hé jiāo qī yīzhí hěn wěndìng. Huàn yījiā xīn de, fēngxiǎn nín yě yào kǎolǜ.",null,"BODY306"],["采购经理: 这也是我们一直选择贵方的原因。所以与其在单价上僵持，不如我们换个角度，看看能不能通过别的方式降低总成本。 (Đó cũng là lý do chúng tôi luôn chọn quý bên. Nên thay vì giằng co về đơn giá, chi bằng đổi góc nhìn, xem có thể giảm tổng chi phí bằng cách khác không.)",null,null,"Cǎigòu jīnglǐ: zhè yě shì wǒmen yīzhí xuǎnzé guìfāng de yuányīn. Suǒyǐ yǔqí zài dānjià shàng jiāngchí, bùrú wǒmen huàn gè jiǎodù, kànkan néng bùnéng tōngguò biéde fāngshì jiàngdī zǒngchéngběn.",null,"BODY307"],["供应商: 您说说看。 (Ngài nói thử xem.)",null,null,"Gōngyìngshāng: nín shuōshuokàn.",null,"BODY308"],["采购经理: 第一，如果我们把明年的订单从二十万件增加到三十万件，单价能不能降百分之五？ (Một, nếu chúng tôi tăng đơn năm sau từ 200.000 lên 300.000 cái, đơn giá giảm 5% được không?)",null,null,"Cǎigòu jīnglǐ: dìyī, rúguǒ wǒmen bǎ míngnián de dìngdān cóng èrshíwànjiàn zēngjiā dào sānshíwàn jiàn, dānjià néng bùnéng jiàng bǎifēnzhīwǔ?",null,"BODY309"],["供应商: 三十万件的话，我们的生产效率会提高，可以降百分之三。 (300.000 cái thì hiệu suất sản xuất tăng, có thể giảm 3%.)",null,null,"Gōngyìngshāng: sānshíwàn jiàn dehuà, wǒmen de shēngchǎn xiàolǜ huì tígāo, kěyǐ jiàng bǎifēnzhīsān.",null,"BODY310"],["采购经理: 第二，包装方面，我们可以接受简易包装，不用彩盒，这样能省多少？ (Hai, về đóng gói, chúng tôi chấp nhận bao bì đơn giản, không dùng hộp màu, như vậy tiết kiệm bao nhiêu?)",null,null,"Cǎigòu jīnglǐ: dì'èr, bāozhuāng fāngmiàn, wǒmen kěyǐ jiēshòu jiǎnyì bāozhuāng, bùyòng cǎi hé, zhèyàng néng shěng duōshǎo?",null,"BODY311"],["供应商: 简易包装每件能省零点零八美元，大概是百分之二。 (Bao bì đơn giản mỗi cái tiết kiệm 0,08 USD, khoảng 2%.)",null,null,"Gōngyìngshāng: jiǎnyì bāozhuāng měijiàn néng shěng língdiǎn líng bā měiyuán, dàgài shì bǎifēnzhī'èr.",null,"BODY312"],["采购经理: 那加起来就是百分之五了。我们可以在交货期上让步，从三十天放宽到四十五天，不过作为交换，希望贵方再降百分之一，一共百分之六。 (Vậy cộng lại là 5%. Chúng tôi có thể nhượng bộ thời gian giao, nới từ 30 lên 45 ngày, nhưng đổi lại mong quý bên giảm thêm 1%, tổng cộng 6%.)",null,null,"Cǎigòu jīnglǐ: nà jiā qǐlái jiùshì bǎifēnzhīwǔ le. Wǒmen kěyǐ zài jiāohuòqī shàng ràngbù, cóng sānshítiān fàngkuān dào sìshíwǔtiān, bùguò zuòwéi jiāohuàn, xīwàng guìfāng zài jiàng bǎifēnzhīyī, yīgòng bǎifēnzhīliù.",null,"BODY313"],["供应商: 交货期放宽对我们安排生产确实有帮助……但是百分之六真的是我们的底线了。另外，付款能不能从六十天改成四十五天？ (Nới thời gian giao đúng là giúp chúng tôi sắp xếp sản xuất… nhưng 6% thật sự là giới hạn cuối rồi. Ngoài ra, thanh toán đổi từ 60 ngày sang 45 ngày được không?)",null,null,"Gōngyìngshāng: jiāohuòqī fàngkuān duì wǒmen ānpái shēngchǎn quèshí yǒu bāngzhù…… dànshì bǎifēnzhīliù zhēnde shì wǒmen de dǐxiàn le. Lìngwài, fùkuǎn néng bùnéng cóng liùshítiān gǎichéng sìshíwǔtiān?",null,"BODY314"],["采购经理: 四十五天我需要跟财务商量一下。如果财务同意，我们就按百分之六、三十万件、四十五天交货、四十五天付款签两年的合同。 (45 ngày tôi cần bàn với tài chính. Nếu tài chính đồng ý, chúng ta ký hợp đồng 2 năm theo: giảm 6%, 300.000 cái, giao 45 ngày, thanh toán 45 ngày.)",null,null,"Cǎigòu jīnglǐ: sìshíwǔtiān wǒ xūyào gēn cáiwù shāngliangyīxià. Rúguǒ cáiwù tóngyì, wǒmen jiù àn bǎifēnzhīliù, sānshíwàn jiàn, sìshíwǔtiān jiāohuò, sìshíwǔtiān fùkuǎn qiān liǎngnián de hétong.",null,"BODY315"],["供应商: 两年的合同我们很欢迎。不过第二年如果原材料涨价超过百分之十，我们希望可以重新谈价格。 (Hợp đồng 2 năm chúng tôi rất hoan nghênh. Nhưng năm thứ hai nếu nguyên liệu tăng quá 10%, chúng tôi mong được đàm phán lại giá.)",null,null,"Gōngyìngshāng: liǎngnián de hétong wǒmen hěn huānyíng. Bùguò dì'èrnián rúguǒ yuáncáiliào zhǎngjià chāoguò bǎifēnzhīshí, wǒmen xīwàng kěyǐ chóngxīn tán jiàgé.",null,"BODY316"],["采购经理: 这个合理，我们可以把这一条写进合同。同样，如果原材料降价超过百分之十，我们也可以重新谈。 (Hợp lý, có thể ghi điều này vào hợp đồng. Tương tự, nếu nguyên liệu giảm quá 10%, chúng tôi cũng có thể đàm phán lại.)",null,null,"Cǎigòu jīnglǐ: zhège hélǐ, wǒmen kěyǐ bǎ zhè yītiáo xiě jìn hétong. Tóngyàng, rúguǒ yuáncáiliào jiàngjià chāoguò bǎifēnzhīshí, wǒmen yě kěyǐ chóngxīn tán.",null,"BODY317"],["供应商: 公平。那就这么定了。 (Công bằng. Vậy chốt thế.)",null,null,"Gōngyìngshāng: gōngpíng. Nà jiù zhème dìng le.",null,"BODY318"],["采购经理: 好，我们确认一下今天谈好的条件：单价降百分之六，年订单三十万件，简易包装，交货期四十五天，付款四十五天，合同两年，原材料价格变动超过百分之十可以重新谈。我明天中午之前确认付款条件，然后把合同草稿发给您。 (Được, xác nhận điều kiện hôm nay: đơn giá giảm 6%, đơn năm 300.000 cái, bao bì đơn giản, giao 45 ngày, thanh toán 45 ngày, hợp đồng 2 năm, giá nguyên liệu biến động quá 10% được đàm phán lại. Trước trưa mai tôi xác nhận điều kiện thanh toán rồi gửi dự thảo hợp đồng cho ngài.)",null,null,"Cǎigòu jīnglǐ: hǎo, wǒmen quèrèn yīxià jīntiān tán hǎo de tiáojiàn: dānjià jiàng bǎifēnzhīliù, nián dìngdān sānshíwàn jiàn, jiǎnyì bāozhuāng, jiāohuòqī sìshíwǔtiān, fùkuǎn sìshíwǔtiān, hétong liǎngnián, yuáncáiliào jiàgé biàndòng chāoguò bǎifēnzhīshí kěyǐ chóngxīn tán. Wǒ míngtiān zhōngwǔ zhīqián quèrèn fùkuǎntiáojiàn, ránhòu bǎ hétong cǎogǎo fāgěinín.",null,"BODY319"],["供应商: 合作愉快！ (Hợp tác vui vẻ!)",null,null,"Gōngyìngshāng: hézuòyúkuài!",null,"BODY320"],["情景对话 6 — Phía bán hàng: khách ép giá, giữ vững giá sàn mà không mất khách",null,null,"Qíngjǐng duìhuà",null,"BODY321-C"],["客户: 小李，你们的价格再降百分之十，我们就下单。 (Tiểu Lý, giá các bạn giảm thêm 10% là chúng tôi đặt.)",null,null,"Kèhù: Xiǎo Lǐ, nǐmen de jiàgé zài jiàng bǎifēnzhīshí, wǒmen jiù xiàdān.",null,"BODY322"],["销售: 王总，谢谢您对我们产品的认可。不过降百分之十，我们真的做不到。 (Vương tổng, cảm ơn ngài đã công nhận sản phẩm của chúng tôi. Nhưng giảm 10% thật sự chúng tôi không làm được.)",null,null,"Xiāoshòu: Wáng zǒng, xièxienín duì wǒmen chǎnpǐn de rènkě. Bùguò jiàng bǎifēnzhīshí, wǒmen zhēnde zuò bùdào.",null,"BODY323"],["客户: 别家都愿意降，你们为什么不行？ (Nhà khác đều sẵn sàng giảm, sao các bạn không được?)",null,null,"Kèhù: biéjiā dōu yuànyì jiàng, nǐmen wèishénme bùxíng?",null,"BODY324"],["销售: 我们的价格包含了两年的保修和免费上门安装，很多供应商的报价是不含这些服务的。 (Giá chúng tôi bao gồm bảo hành 2 năm và lắp đặt tận nơi miễn phí, nhiều NCC báo giá không gồm các dịch vụ này.)",null,null,"Xiāoshòu: wǒmen de jiàgé bāohán le liǎngnián de bǎoxiū hé miǎnfèi shàngmén ānzhuāng, hěnduō gōngyìngshāng de bàojià shì bù hán zhèxiē fúwù de.",null,"BODY325"],["客户: 安装我们可以自己做。 (Lắp đặt chúng tôi tự làm được.)",null,null,"Kèhù: ānzhuāng wǒmen kěyǐ zìjǐ zuò.",null,"BODY326"],["销售: 如果不需要安装，我们可以降百分之四。 (Nếu không cần lắp đặt, chúng tôi giảm được 4%.)",null,null,"Xiāoshòu: rúguǒ bù xūyào ānzhuāng, wǒmen kěyǐ jiàng bǎifēnzhīsì.",null,"BODY327"],["客户: 百分之四太少了。 (4% ít quá.)",null,null,"Kèhù: bǎifēnzhīsì tài shǎo le.",null,"BODY328"],["销售: 为了表示诚意，如果贵方这个月就下单，我们再送一年的延长保修，相当于又省了百分之三的维修费。 (Để thể hiện thành ý, nếu quý bên đặt trong tháng này, chúng tôi tặng thêm một năm bảo hành mở rộng, tương đương tiết kiệm thêm 3% phí sửa chữa.)",null,null,"Xiāoshòu: wèile biǎoshì chéngyì, rúguǒ guìfāng zhège yuè jiù xiàdān, wǒmen zài sòng yīnián de yáncháng bǎoxiū, xiāngdāngyú yòu shěng le bǎifēnzhīsān de wéixiūfèi.",null,"BODY329"],["客户: 那价格本身不能再降了吗？ (Vậy bản thân giá không thể giảm thêm à?)",null,null,"Kèhù: nà jiàgé běnshēn bùnéng zài jiàng le ma?",null,"BODY330"],["销售: 百分之四是我们的底线了，再低的话我们就没办法保证质量和服务了。我相信王总也不希望买到质量不好的产品。 (4% là giới hạn rồi, thấp hơn nữa chúng tôi không đảm bảo được chất lượng và dịch vụ. Tôi tin Vương tổng cũng không muốn mua sản phẩm kém chất lượng.)",null,null,"Xiāoshòu: bǎifēnzhīsì shì wǒmen de dǐxiàn le, zài dī dehuà wǒmen jiù méi bànfǎ bǎozhèngzhìliàng hé fúwù le. Wǒ xiāngxìn Wáng zǒng yě bù xīwàng mǎi dào zhìliàng bùhǎo de chǎnpǐn.",null,"BODY331"],["客户: 嗯……那你们能不能免费培训我们的技术员？ (Ừm… vậy các bạn đào tạo miễn phí cho kỹ thuật viên của chúng tôi được không?)",null,null,"Kèhù: ń…… nà nǐmen néng bùnéng miǎnfèi péixùn wǒmen de jìshùyuán?",null,"BODY332"],["销售: 这个没问题！我们可以派工程师过去，给你们的技术员做两天的培训。 (Không vấn đề! Chúng tôi cử kỹ sư sang đào tạo 2 ngày cho kỹ thuật viên của quý bên.)",null,null,"Xiāoshòu: zhège méi wèntí! Wǒmen kěyǐ pài gōngchéngshī guòqù, gěi nǐmen de jìshùyuán zuò liǎngtiān de péixùn.",null,"BODY333"],["客户: 好，那就这样：降百分之四，不含安装，送一年延长保修和两天培训。 (Được, vậy thế này: giảm 4%, không gồm lắp đặt, tặng một năm bảo hành mở rộng và 2 ngày đào tạo.)",null,null,"Kèhù: hǎo, nà jiù zhèyàng: jiàng bǎifēnzhīsì, bù hán ānzhuāng, sòng yīnián yáncháng bǎoxiū hé liǎngtiān péixùn.",null,"BODY334"],["销售: 没问题，谢谢王总！我今天下午就把新的报价单发给您。 (Không vấn đề, cảm ơn Vương tổng! Chiều nay tôi gửi báo giá mới cho ngài.)",null,null,"Xiāoshòu: méi wèntí, xièxie Wáng zǒng! Wǒ jīntiānxiàwǔ jiù bǎ xīn de bàojiàdān fāgěinín.",null,"BODY335"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY336-C"],["1. Hỏi: 供应商说\"这是最低价了\"，你会怎么回应？ (NCC nói \"đây là giá thấp nhất rồi\", bạn đáp thế nào?)",null,null,"Gōngyìngshāng shuō \"zhè shì zuìdījià le\", nǐ huì zěnme huíyìng?",null,"BODY337"],["Đáp: 我会说：\"我理解。那如果我们把数量增加一倍，或者提前付款，价格还有没有空间？\"这样把话题从价格转到其他条件上。 (Tôi sẽ nói: \"Tôi hiểu. Vậy nếu chúng tôi tăng gấp đôi số lượng hoặc trả trước, giá còn dư địa không?\" Như vậy chuyển chủ đề từ giá sang điều kiện khác.)",null,null,"Wǒhuì shuō: \"wǒ lǐjiě. Nà rúguǒ wǒmen bǎ shùliàng zēngjiāyībèi, huòzhě tíqián fùkuǎn, jiàgé háiyǒu méiyǒu kòngjiān?\" Zhèyàng bǎ huàtí cóng jiàgé zhuǎn dào qítā tiáojiàn shàng.",null,"BODY338"],["2. Hỏi: 谈判之前，你会做哪些准备？ (Trước khi đàm phán, bạn chuẩn bị những gì?)",null,null,"Tánpàn zhīqián, nǐ huì zuò nǎxiē zhǔnbèi?",null,"BODY339"],["Đáp: 我会先了解市场价格，对比几家供应商；然后定好自己的目标价和底线；最后想好可以让步的条件，比如数量、付款或者交货期。 (Tìm hiểu giá thị trường, so sánh vài NCC; rồi định giá mục tiêu và giới hạn; cuối cùng nghĩ sẵn các điều kiện có thể nhượng bộ như số lượng, thanh toán hoặc thời gian giao.)",null,null,"Wǒhuì xiān liǎojiě shìchǎng jiàgé, duìbǐ jǐjiā gōngyìngshāng; ránhòu dìng hǎo zìjǐ de mùbiāojià hé dǐxiàn; zuìhòu xiǎng hǎo kěyǐ ràngbù de tiáojiàn, bǐrú shùliàng, fùkuǎn huòzhě jiāohuòqī.",null,"BODY340"],["3. Hỏi: 谈判的时候，对方一直不说话，你会怎么办？ (Khi đàm phán, bên kia cứ im lặng, bạn làm sao?)",null,null,"Tánpàn de shíhou, duìfāng yīzhí bù shuōhuà, nǐ huì zěnmebàn?",null,"BODY341"],["Đáp: 我也会保持冷静，不急着让步。可以问一个开放的问题，比如\"您觉得哪个条件对贵方最重要？\" (Tôi cũng giữ bình tĩnh, không vội nhượng bộ. Có thể hỏi câu mở như \"Ngài thấy điều kiện nào quan trọng nhất với quý bên?\")",null,null,"Wǒ yě huì bǎochí lěngjìng, bù jí zhe ràngbù. Kěyǐ wèn yīgè kāifàng de wèntí, bǐrú \"nín juéde nǎge tiáojiàn duì guìfāng zuì zhòngyào?\"",null,"BODY342"],["4. Hỏi: (HSK5) 你觉得\"双赢\"在谈判中真的可能吗？ (Bạn thấy \"đôi bên cùng có lợi\" trong đàm phán có thật sự khả thi không?)",null,null,"Nǐ juéde \"shuāngyíng\" zài tánpàn zhōng zhēnde kěnéng ma?",null,"BODY343"],["Đáp: 我觉得是可能的，关键是不要只盯着价格。双方关心的东西往往不一样：买方可能更在乎价格，卖方可能更在乎订单稳定和付款速度。如果能把这些条件组合起来，就能找到双方都满意的方案。 (Khả thi, quan trọng là đừng chỉ nhìn chằm chằm vào giá. Hai bên thường quan tâm khác nhau: bên mua có thể quan tâm giá hơn, bên bán quan tâm đơn ổn định và tốc độ thanh toán. Kết hợp các điều kiện đó sẽ tìm được phương án cả hai hài lòng.)",null,null,"Wǒ juéde shì kěnéng de, guānjiàn shì bùyào zhǐ dīng zhe jiàgé. Shuāngfāng guānxīn de dōngxi wǎngwǎng bù yīyàng: mǎifāng kěnéng gèng zàihū jiàgé, màifāng kěnéng gèng zàihū dìngdān wěndìng hé fùkuǎn sùdù. Rúguǒ néng bǎ zhèxiē tiáojiàn zǔhé qǐlái, jiù néng zhǎodào shuāngfāng dōu mǎnyì de fāng'àn.",null,"BODY344"],["情景模拟 ROLE-PLAY — GV đóng NCC kiên quyết không giảm giá; HS đàm phán 4–5 phút. Vòng 2 (bất ngờ): NCC báo nguyên liệu tăng giá, đòi tăng 5%",null,null,"Qíngjǐng mónǐ",null,"BODY345-C"],["HS: 张经理，这次的订单是去年的两倍，我们希望单价能降百分之五。 (Giám đốc Trương, đơn lần này gấp đôi năm ngoái, chúng tôi mong đơn giá giảm 5%.)",null,null,"Zhāng jīnglǐ, zhècì de dìngdān shì qùnián de liǎngbèi, wǒmen xīwàng dānjià néng jiàng bǎifēnzhīwǔ.",null,"BODY346"],["GV: 不好意思，价格我们不能降。 (Xin lỗi, giá chúng tôi không thể giảm.)",null,null,"Bùhǎoyìsi, jiàgé wǒmen bùnéng jiàng.",null,"BODY347"],["HS: 我理解。那如果我们预付百分之五十，价格能不能有一点空间？ (Tôi hiểu. Vậy nếu chúng tôi trả trước 50%, giá có chút dư địa không?)",null,null,"Wǒ lǐjiě. Nà rúguǒ wǒmen yùfù bǎifēnzhīwǔshí, jiàgé néng bùnéng yǒu yīdiǎn kōngjiān?",null,"BODY348"],["GV (biến cố): 其实我们正想跟您说，下个月原材料要涨价，我们的价格要上调百分之五。 (Thật ra chúng tôi đang định báo, tháng sau nguyên liệu tăng giá, giá của chúng tôi phải tăng 5%.)",null,null,"Qíshí wǒmen zhèng xiǎng gēn nín shuō, xiàgèyuè yuáncáiliào yào zhǎngjià, wǒmen de jiàgé yào shàngtiáo bǎifēnzhīwǔ.",null,"BODY349"],["HS: 这个消息有点突然。能不能给我们看一下原材料涨价的数据？ (Tin này hơi đột ngột. Có thể cho chúng tôi xem số liệu nguyên liệu tăng giá không?)",null,null,"Zhège xiāoxi yǒudiǎn tūrán. Néng bùnéng gěi wǒmen kàn yīxià yuáncáiliào zhǎngjià de shùjù?",null,"BODY350"],["GV: 钢材价格上个月涨了百分之八。 (Giá thép tháng trước tăng 8%.)",null,null,"Gāngcáijiàgé shànggèyuè zhǎngle bǎifēnzhībā.",null,"BODY351"],["HS: 我明白。不过我们这次的订单是去年的两倍，而且如果预付百分之五十，贵方可以提前锁定原材料的价格。所以我们希望至少保持去年的价格不变。 (Tôi hiểu. Nhưng đơn lần này gấp đôi năm ngoái, nếu trả trước 50% quý bên có thể khóa giá nguyên liệu sớm. Nên chúng tôi mong ít nhất giữ nguyên giá năm ngoái.)",null,null,"Wǒ míngbai. Bùguò wǒmen zhècì de dìngdān shì qùnián de liǎngbèi, érqiě rúguǒ yùfù bǎifēnzhīwǔshí, guìfāng kěyǐ tíqián suǒdìng yuáncáiliào de jiàgé. Suǒyǐ wǒmen xīwàng zhìshǎo bǎochí qùnián de jiàgé bùbiàn.",null,"BODY352"],["GV: 保持不变有点难，最多只涨百分之二。 (Giữ nguyên hơi khó, tối đa chỉ tăng 2%.)",null,null,"Bǎochí bùbiàn yǒudiǎn nán, zuì duōzhǐ zhǎng bǎifēnzhī'èr.",null,"BODY353"],["HS: 如果贵方能保持原价，我们可以把合同从一年签到两年。 (Nếu quý bên giữ giá cũ, chúng tôi có thể ký hợp đồng từ 1 lên 2 năm.)",null,null,"Rúguǒ guìfāng néng bǎochí yuánjià, wǒmen kěyǐ bǎ hétong cóng yīnián qiāndào liǎngnián.",null,"BODY354"],["GV: 两年的话……好，原价，但是预付百分之五十。 (Hai năm thì… được, giá cũ, nhưng trả trước 50%.)",null,null,"Liǎngnián dehuà…… hǎo, yuánjià, dànshì yùfù bǎifēnzhīwǔshí.",null,"BODY355"],["HS: 成交！我们确认一下：原价不变，订单两倍，预付百分之五十，合同两年。 (Chốt! Xác nhận lại: giữ giá cũ, đơn gấp đôi, trả trước 50%, hợp đồng 2 năm.)",null,null,"Chéngjiāo! Wǒmen quèrèn yīxià: yuánjià bùbiàn, dìngdān liǎngbèi, yùfù bǎifēnzhīwǔshí, hétong liǎngnián.",null,"BODY356"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY357-C"],["✗ 你便宜一点！ (ra lệnh, thô) → ✓ 价格方面还有没有商量的空间？",null,null,"Nǐ piányi yīdiǎn! | Jiàgé fāngmiàn háiyǒu méiyǒu shāngliang de kōngjiān?",null,"BODY358"],["✗ 我们的底线价格是一百万。 → ✓ 一百万是我们的底线。",null,null,"Wǒmen de dǐxiàn jiàgé shì yībǎiwàn. | Yībǎiwàn shì wǒmen de dǐxiàn.",null,"BODY359"],["✗ 如果你们降价，我们会买更多。 (mơ hồ) → ✓ 如果贵方能降价百分之三，我们可以把数量增加到一万件。",null,null,"Rúguǒ nǐmen jiàngjià, wǒmen huì mǎi gèng duō. | Rúguǒ guìfāng néng jiàngjià bǎifēnzhīsān, wǒmen kěyǐ bǎ shùliàng zēngjiā dào yī wànjiàn.",null,"BODY360"],["✗ 折扣百分之五。 → ✓ 打九五折。/ 给百分之五的折扣。",null,null,"Zhékòu bǎifēnzhīwǔ. | Dǎ jiǔwǔ zhé. / | Gěi bǎifēnzhīwǔ de zhékòu.",null,"BODY361"],["✗ 我们同意了价格，但是…… (chốt rồi mới mặc cả tiếp, mất uy tín) → ✓ 价格我们可以考虑，但是前提是……",null,null,"Wǒmen tóngyì le jiàgé, dànshì…… | Jiàgé wǒmen kěyǐ kǎolǜ, dànshì qiántí shì……",null,"BODY362"],["✗ 交货时间是很长。 → ✓ 交货期太长了。",null,null,"Jiāohuò shíjiān shì hěn zhǎng. | Jiāohuòqī tài zhǎng le.",null,"BODY363"],["Lưu ý văn hóa: người TQ thường không nói \"không\" thẳng: \"我们研究一下 / 回去商量商量\" có thể là từ chối → nên hỏi lại cụ thể 您大概什么时候能给我们答复？",null,null,"Wǒmen yánjiū yīxià | Huíqù shāngliang shāngliang | Nín dàgài shénme shíhou néng gěi wǒmen dáfù?",null,"BODY364"],["Phát âm: 让步 ràngbù; 底线 dǐxiàn; 折扣 zhékòu; 起订量 qǐdìngliàng; 双赢 shuāngyíng.",null,null,"Ràngbù | Dǐxiàn | Zhékòu | Qǐ dìng liàng | Shuāngyíng",null,"BODY365"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY366-C"],["Ghi âm một cuộc đàm phán 4–5 phút (tự đóng 2 vai hoặc với bạn) gồm đủ 3 nội dung: giá – thanh toán – thời gian giao; mỗi lần nhượng bộ phải dùng 如果贵方能……，我们可以…….",null,null,"Rúguǒ guìfāng néng……, wǒmen kěyǐ…… .",null,"BODY367"],["Cuối bài bắt buộc tổng kết bằng 我们确认一下今天谈好的条件：…….",null,null,"Wǒmen quèrèn yīxià jīntiān tán hǎo de tiáojiàn:…… .",null,"BODY368"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY369"],["Buổi 18 — 分析问题与提出方案 Phân tích và đề xuất",null,null,"Fēnxī wèntí yǔ tíchū fāng'àn",null,"BODY370-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY371-C"],["HSK4: Nêu vấn đề, phân tích 2 nguyên nhân, đề xuất 2 giải pháp. HSK5: Đánh giá tính khả thi, rủi ro và phương án dự phòng; thuyết phục cấp trên duyệt đề xuất.",null,null,null,null,"BODY372"],["Khung phân tích – đề xuất 5 bước: ① 现象 Hiện tượng (số liệu) → ② 原因 Nguyên nhân → ③ 方案 Giải pháp → ④ 可行性与风险 Khả thi & rủi ro → ⑤ 实施计划 Kế hoạch thực hiện.",null,null,"Xiànxiàng | Yuányīn | Fāng'àn | Kěxíngxìng yǔ fēngxiǎn | Shíshī jìhuà",null,"BODY373"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY374-C"],["1. Hỏi: 你们公司现在最大的问题是什么？ (Vấn đề lớn nhất của công ty bạn hiện nay là gì?)",null,null,"Nǐmen gōngsī xiànzài zuìdà de wèntí shì shénme?",null,"BODY375"],["Đáp: 我觉得最大的问题是部门之间沟通太少，很多事情要等到出了问题才知道。 (Tôi thấy lớn nhất là các phòng ít trao đổi, nhiều việc đợi đến khi có chuyện mới biết.)",null,null,"Wǒ juéde zuìdà de wèntí shì bùmén zhījiān gōutōng tài shǎo, hěnduō shìqing yào děngdào chū le wèntí cái zhīdao.",null,"BODY376"],["2. Hỏi: 你给公司提过建议吗？被采纳了吗？ (Bạn từng góp ý cho công ty chưa? Có được chấp nhận không?)",null,null,"Nǐ gěi gōngsī tí guò jiànyì ma? Bèi cǎinà le ma?",null,"BODY377"],["Đáp: 提过。我建议把纸质的出库单改成电子的，后来公司采纳了，每天能节省一个小时。 (Có. Tôi đề nghị đổi phiếu xuất kho giấy sang điện tử, sau đó công ty chấp nhận, mỗi ngày tiết kiệm một tiếng.)",null,null,"Tí guò. Wǒ jiànyì bǎ zhǐzhì de chūkù dān gǎichéng diànzi de, hòulái gōngsī cǎinà le, měitiān néng jiéshěng yīgè xiǎoshí.",null,"BODY378"],["3. Hỏi: 遇到问题的时候，你习惯先找原因还是先找办法？ (Gặp vấn đề, bạn quen tìm nguyên nhân trước hay tìm cách giải quyết trước?)",null,null,"Yùdào wèntí de shíhou, nǐ xíguàn xiān zhǎo yuányīn háishì xiān zhǎo bànfǎ?",null,"BODY379"],["Đáp: 紧急的问题我先找办法，先把火灭了；不紧急的我会先找原因，避免下次再发生。 (Việc gấp tôi tìm cách trước, dập lửa trước; việc không gấp thì tìm nguyên nhân trước, tránh lần sau tái diễn.)",null,null,"Jǐnjí de wèntí wǒ xiān zhǎo bànfǎ, xiān bǎ huǒ miè le; bù jǐnjí de wǒhuì xiān zhǎo yuányīn, bìmiǎn xiàcì zài fāshēng.",null,"BODY380"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY381-C"],["1. 根本问题 / 根本原因 (vấn đề gốc / nguyên nhân gốc): 表面上是交货晚，根本原因是计划不准确。 (Bề ngoài là giao trễ, nguyên nhân gốc là kế hoạch không chính xác.)",null,null,"Gēnběn wèntí | Gēnběnyuányīn | Biǎomiàn shàng shì jiāohuò wǎn, gēnběnyuányīn shì jìhuà bù zhǔnquè.",null,"BODY382"],["2. 可行性 (tính khả thi): 这个方案的可行性需要再评估一下。 (Tính khả thi của phương án này cần đánh giá lại.)",null,null,"Kěxíngxìng | Zhège fāng'àn de kěxíngxìng xūyào zài pínggū yīxià.",null,"BODY383"],["3. 方案 (phương án): 我准备了两个方案供大家讨论。 (Tôi chuẩn bị 2 phương án để mọi người thảo luận.)",null,null,"Fāng'àn | Wǒ zhǔnbèi le liǎnggè fāng'àn gōng dàjiā tǎolùn.",null,"BODY384"],["4. 优化 (tối ưu hóa): 我们需要优化一下仓库的布局。 (Cần tối ưu bố trí kho.)",null,null,"Yōuhuà | Wǒmen xūyào yōuhuà yīxià cāngkù de bùjú.",null,"BODY385"],["5. 实施 (triển khai, thực hiện): 新流程下个月一号开始实施。 (Quy trình mới bắt đầu triển khai từ ngày 1 tháng sau.)",null,null,"Shíshī | Xīn liúchéng xiàgèyuè yīhào kāishǐ shíshī.",null,"BODY386"],["6. 评估风险 (đánh giá rủi ro): 在做决定之前，我们要先评估风险。 (Trước khi quyết định, phải đánh giá rủi ro.)",null,null,"Pínggū fēngxiǎn | Zài zuò juédìng zhīqián, wǒmen yào xiān pínggū fēngxiǎn.",null,"BODY387"],["7. 入手 (bắt tay vào, bắt đầu từ): 解决这个问题，可以从培训入手。 (Giải quyết vấn đề này có thể bắt đầu từ đào tạo.)",null,null,"Rùshǒu | Jiějué zhège wèntí, kěyǐ cóng péixùn rùshǒu.",null,"BODY388"],["8. 备用方案 / 备选方案 (phương án dự phòng): 万一供应商来不及交货，我们要有一个备用方案。 (Lỡ NCC giao không kịp, phải có phương án dự phòng.)",null,null,"Bèiyòng fāng'àn | Bèixuǎn fāng'àn | Wànyī gōngyìngshāng láibùjí jiāohuò, wǒmen yào yǒu yīgè bèiyòng fāng'àn.",null,"BODY389"],["9. 数据显示 (số liệu cho thấy): 数据显示，退货的原因百分之六十是包装破损。 (Số liệu cho thấy 60% nguyên nhân trả hàng là bao bì hỏng.)",null,null,"Shùjù xiǎnshì | Shùjù xiǎnshì, tuìhuò de yuányīn bǎifēnzhīliùshí shì bāozhuāng pòsǔn.",null,"BODY390"],["10. 治标不治本 (chữa ngọn không chữa gốc): 每次加班赶货是治标不治本。 (Lần nào cũng tăng ca chạy hàng là chữa ngọn không chữa gốc.)",null,null,"Zhìbiāobùzhìběn | Měicì jiābān gǎn huò shì zhìbiāobùzhìběn.",null,"BODY391"],["11. 投入 / 回报 (đầu tư / lợi nhuận thu về): 这个项目投入不大，回报很快。 (Dự án này đầu tư không lớn, thu hồi rất nhanh.)",null,null,"Tóurù | Huíbào | Zhège xiàngmù tóurù bù dà, huíbào hěnkuài.",null,"BODY392"],["12. 见效 (có hiệu quả, thấy kết quả): 这个方法三个月就能见效。 (Cách này 3 tháng là thấy hiệu quả.)",null,null,"Jiànxiào | Zhège fāngfǎ sāngè yuè jiù néng jiànxiào.",null,"BODY393"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY394-C"],["1. 主要原因是……；其次是…… (Nguyên nhân chính là …; tiếp theo là …)",null,null,"Zhǔyào yuányīn shì……; qícì shì……",null,"BODY395"],["Ví dụ: 客户投诉增加的主要原因是交货延误；其次是售后回复太慢。 (Nguyên nhân chính khiếu nại tăng là giao trễ; tiếp theo là hậu mãi phản hồi chậm.)",null,null,"Kèhù tóusù zēngjiā de zhǔyào yuányīn shì jiāohuò yánwù; qícì shì shòuhòu huífù tàimàn.",null,"BODY396"],["Ví dụ: 员工离职的主要原因是工资偏低；其次是加班太多。 (Nguyên nhân chính nhân viên nghỉ là lương thấp; tiếp theo là tăng ca quá nhiều.)",null,null,"Yuángōng lízhí de zhǔyào yuányīn shì gōngzī piāndī; qícì shì jiābān tài duō.",null,"BODY397"],["2. 建议从……入手 (Đề nghị bắt đầu từ …)",null,null,"Jiànyì cóng…… rùshǒu",null,"BODY398"],["Ví dụ: 要降低不良率，建议从原材料检验入手。 (Muốn giảm tỷ lệ lỗi, đề nghị bắt đầu từ kiểm tra nguyên liệu.)",null,null,"Yào jiàngdī bùliánglǜ, jiànyì cóng yuáncáiliào jiǎnyàn rùshǒu.",null,"BODY399"],["Ví dụ: 要提高销售额，建议从老客户的复购入手。 (Muốn tăng doanh số, đề nghị bắt đầu từ việc khách cũ mua lại.)",null,null,"Yào tígāo xiāoshòu'é, jiànyì cóng lǎokèhù de fù gòurù shǒu.",null,"BODY400"],["3. 数据显示，…… (Số liệu cho thấy, …)",null,null,"Shùjù xiǎnshì,……",null,"BODY401"],["Ví dụ: 数据显示，上个季度的退货率比去年同期高了百分之三。 (Số liệu cho thấy tỷ lệ trả hàng quý trước cao hơn cùng kỳ năm ngoái 3%.)",null,null,"Shùjù xiǎnshì, shànggèjìdù de tuìhuò lǜ bǐ qùniántóngqī gāo le bǎifēnzhīsān.",null,"BODY402"],["Ví dụ: 数据显示，百分之七十的延误发生在周五和周六。 (Số liệu cho thấy 70% chậm trễ xảy ra vào thứ 6 và thứ 7.)",null,null,"Shùjù xiǎnshì, bǎifēnzhīqīshí de yánwù fāshēng zài zhōuwǔ hé zhōuliù.",null,"BODY403"],["4. 表面上是……，实际上是…… (Bề ngoài là …, thực chất là …)",null,null,"Biǎomiàn shàng shì……, shíjìshàng shì……",null,"BODY404"],["Ví dụ: 表面上是工人不认真，实际上是作业指导书写得不清楚。 (Bề ngoài là công nhân không cẩn thận, thực chất là hướng dẫn thao tác viết không rõ.)",null,null,"Biǎomiàn shàng shì gōngrén bù rènzhēn, shíjìshàng shì zuòyè zhǐdǎo shūxiě de bù qīngchu.",null,"BODY405"],["Ví dụ: 表面上是价格问题，实际上是客户对我们的服务不满意。 (Bề ngoài là vấn đề giá, thực chất là khách không hài lòng dịch vụ của chúng ta.)",null,null,"Biǎomiàn shàng shì jiàgé wèntí, shíjìshàng shì kèhù duì wǒmen de fúwù bù mǎnyì.",null,"BODY406"],["5. 针对这个问题，我有两个建议：一是……，二是…… (Về vấn đề này, tôi có 2 đề xuất: một là …, hai là …)",null,null,"Zhēnduì zhège wèntí, wǒ yǒu liǎnggè jiànyì: yī shì……, èr shì……",null,"BODY407"],["Ví dụ: 针对这个问题，我有两个建议：一是增加一个质检员，二是给供应商做培训。 (Về vấn đề này, tôi có 2 đề xuất: một là thêm một nhân viên QC, hai là đào tạo cho NCC.)",null,null,"Zhēnduì zhège wèntí, wǒ yǒu liǎnggè jiànyì: yī shì zēngjiā yīgè zhìjiǎnyuán, èr shì gěi gōngyìngshāng zuò péixùn.",null,"BODY408"],["Ví dụ: 针对仓库太乱的问题，我有两个建议：一是重新划分区域，二是每个货架贴上二维码。 (Về chuyện kho lộn xộn, có 2 đề xuất: một là chia lại khu vực, hai là dán mã QR cho từng kệ.)",null,null,"Zhēnduì cāngkù tài luàn de wèntí, wǒ yǒu liǎnggè jiànyì: yī shì chóngxīn huàfēn qūyù, èr shì měigè huòjià tiē shàng èrwéimǎ.",null,"BODY409"],["6. 这个方案的好处是……，不过需要注意…… (Lợi ích của phương án này là …, nhưng cần lưu ý …)",null,null,"Zhège fāng'àn de hǎochù shì……, bùguò xūyào zhùyì……",null,"BODY410"],["Ví dụ: 这个方案的好处是成本低、见效快，不过需要注意员工的接受程度。 (Lợi ích phương án là chi phí thấp, hiệu quả nhanh, nhưng cần chú ý mức độ chấp nhận của nhân viên.)",null,null,"Zhège fāng'àn de hǎochù shì chéngběndī, jiànxiàokuài, bùguò xūyào zhùyì yuángōng de jiēshòuchéngdù.",null,"BODY411"],["Ví dụ: 这个方案的好处是能彻底解决问题，不过需要注意前期投入比较大。 (Lợi ích là giải quyết triệt để, nhưng cần lưu ý đầu tư ban đầu khá lớn.)",null,null,"Zhège fāng'àn de hǎochù shì néng chèdǐjiějué wèntí, bùguò xūyào zhùyì qiánqī tóurù bǐjiào dà.",null,"BODY412"],["7. 如果……，就会……，所以我们要提前…… (Nếu …, sẽ …, nên chúng ta phải chuẩn bị trước …)",null,null,"Rúguǒ……, jiù huì……, suǒyǐ wǒmen yào tíqián……",null,"BODY413"],["Ví dụ: 如果供应商延误，就会影响整个生产计划，所以我们要提前准备两个星期的库存。 (Nếu NCC trễ, sẽ ảnh hưởng toàn bộ kế hoạch sản xuất, nên phải chuẩn bị trước 2 tuần tồn kho.)",null,null,"Rúguǒ gōngyìngshāng yánwù, jiù huì yǐngxiǎng zhěnggè shēngchǎn jìhuà, suǒyǐ wǒmen yào tíqiánzhǔnbèi liǎnggè xīngqī de kùcún.",null,"BODY414"],["8. 只有……，才能从根本上…… (Chỉ có …, mới có thể từ gốc rễ …)",null,null,"Zhǐyǒu……, cáinéng cónggēnběnshàng……",null,"BODY415"],["Ví dụ: 只有改进计划的准确性，才能从根本上解决交货延误的问题。 (Chỉ có cải thiện độ chính xác kế hoạch mới giải quyết tận gốc vấn đề giao trễ.)",null,null,"Zhǐyǒu gǎijìn jìhuà de zhǔnquèxìng, cáinéng cónggēnběnshàng jiějué jiāohuò yánwù de wèntí.",null,"BODY416"],["Ví dụ: 只有提高工资待遇，才能从根本上留住员工。 (Chỉ có nâng lương đãi ngộ mới giữ chân nhân viên tận gốc.)",null,null,"Zhǐyǒu tígāo gōngzīdàiyù, cáinéng cónggēnběnshàng liúzhù yuángōng.",null,"BODY417"],["9. (HSK5) 从可行性来看，……；从风险来看，…… (Xét tính khả thi, …; xét rủi ro, …)",null,null,"Cóng kěxíngxìng láikàn,……; cóng fēngxiǎn láikàn,……",null,"BODY418"],["Ví dụ: 从可行性来看，方案A只需要两个星期就能实施；从风险来看，方案B对现有生产的影响更小。 (Xét khả thi, phương án A chỉ cần 2 tuần là triển khai được; xét rủi ro, phương án B ảnh hưởng sản xuất hiện tại ít hơn.)",null,null,"Cóng kěxíngxìng láikàn, fāng'àn A zhǐ xūyào liǎnggè xīngqī jiù néng shíshī; cóng fēngxiǎn láikàn, fāng'àn B duì xiànyǒu shēngchǎn de yǐngxiǎng gèng xiǎo.",null,"BODY419"],["10. (HSK5) 万一……，我们的备用方案是…… (Lỡ …, phương án dự phòng của chúng ta là …)",null,null,"Wànyī……, wǒmen de bèiyòng fāng'àn shì……",null,"BODY420"],["Ví dụ: 万一新系统上线以后出问题，我们的备用方案是先用旧系统，两个系统同时运行一个月。 (Lỡ hệ thống mới chạy rồi có vấn đề, phương án dự phòng là dùng hệ thống cũ, chạy song song 2 hệ thống một tháng.)",null,null,"Wànyī xīn xìtǒng shàngxiàn yǐhòu chū wèntí, wǒmen de bèiyòng fāng'àn shì xiān yòng jiù xìtǒng, liǎnggè xìtǒng tóngshí yùnxíng yīgèyuè.",null,"BODY421"],["Ví dụ: 万一台风影响海运，我们的备用方案是一部分货改走陆运。 (Lỡ bão ảnh hưởng đường biển, phương án dự phòng là chuyển một phần hàng sang đường bộ.)",null,null,"Wànyī táifēng yǐngxiǎng hǎiyùn, wǒmen de bèiyòng fāng'àn shì yībùfen huò gǎi zǒu lùyùn.",null,"BODY422"],["情景对话 1 — Phân tích vì sao khách trả hàng nhiều (HSK4)",null,null,"Qíngjǐng duìhuà",null,"BODY423-C"],["经理: 小芳，最近退货好像越来越多了，你分析一下原因。 (Tiểu Phương, gần đây hàng trả về hình như ngày càng nhiều, bạn phân tích nguyên nhân xem.)",null,null,"Jīnglǐ: Xiǎo Fāng, zuìjìn tuìhuò hǎoxiàng yuèláiyuè duō le, nǐ fēnxī yīxià yuányīn.",null,"BODY424"],["小芳: 好的。我先说一下现象：数据显示，这个季度的退货率是百分之四点五，比上个季度高了两个百分点。 (Vâng. Em nói hiện tượng trước: số liệu cho thấy tỷ lệ trả hàng quý này 4,5%, cao hơn quý trước 2 điểm phần trăm.)",null,null,"Xiǎo Fāng: hǎo de. Wǒ xiān shuō yīxià xiànxiàng: shùjù xiǎnshì, zhège jìdù de tuìhuò lǜ shì bǎifēnzhīsìdiǎn wǔ, bǐ shànggèjìdù gāo le liǎnggè bǎifēndiǎn.",null,"BODY425"],["经理: 主要是什么原因？ (Chủ yếu là nguyên nhân gì?)",null,null,"Jīnglǐ: zhǔyào shì shénme yuányīn?",null,"BODY426"],["小芳: 我把一百二十单退货都看了一遍。主要原因是包装破损，占了百分之五十五；其次是发错型号，占了百分之二十五。 (Em xem hết 120 đơn trả hàng. Nguyên nhân chính là bao bì hỏng, chiếm 55%; tiếp theo là giao nhầm mã, chiếm 25%.)",null,null,"Xiǎo Fāng: wǒ bǎ yībǎi'èrshí dān tuìhuò dōu kàn le yībiàn. Zhǔyào yuányīn shì bāozhuāng pòsǔn, zhàn le bǎifēnzhīwǔshí wǔ; qícì shì fācuò xínghào, zhàn le bǎifēnzhī'èrshíwǔ.",null,"BODY427"],["经理: 包装为什么会破？以前不是这样的。 (Sao bao bì lại hỏng? Trước đâu có vậy.)",null,null,"Jīnglǐ: bāozhuāng wèishénme huì pò? Yǐqián bùshì zhèyàng de.",null,"BODY428"],["小芳: 我问了仓库，原因是三个月前我们换了一家便宜的纸箱供应商，纸箱比以前薄。 (Em hỏi kho rồi, nguyên nhân là 3 tháng trước đổi sang NCC thùng carton rẻ hơn, thùng mỏng hơn trước.)",null,null,"Xiǎo Fāng: wǒ wèn le cāngkù, yuányīn shì sāngè yuè qián wǒmen huàn le yījiā piányi de zhǐxiāng gōngyìngshāng, zhǐxiāng bǐyǐqiánbáo.",null,"BODY429"],["经理: 原来是这样。那发错型号呢？ (Ra vậy. Còn giao nhầm mã?)",null,null,"Jīnglǐ: yuánlái shì zhèyàng. Nà fācuò xínghào ne?",null,"BODY430"],["小芳: 发错型号主要是因为有两个型号的外包装几乎一样，只差一个字母，仓库的同事很容易拿错。 (Giao nhầm mã chủ yếu vì có 2 mã vỏ hộp gần như giống nhau, chỉ khác một chữ cái, đồng nghiệp kho rất dễ lấy nhầm.)",null,null,"Xiǎo Fāng: fācuò xínghào zhǔyào shìyīnwèi yǒu liǎnggè xínghào de wàibāozhuāng jīhū yīyàng, zhǐ chà yīgè zìmǔ, cāngkù de tóngshì hěn róngyì ná cuò.",null,"BODY431"],["经理: 你有什么建议？ (Bạn có đề xuất gì?)",null,null,"Jīnglǐ: nǐ yǒu shénme jiànyì?",null,"BODY432"],["小芳: 针对这两个问题，我有两个建议：一是换回原来的纸箱，虽然每个贵两千盾，但是退货的损失比这个大得多；二是给这两个型号的包装换不同的颜色。 (Về 2 vấn đề này em có 2 đề xuất: một là đổi lại loại thùng cũ, tuy mỗi cái đắt hơn 2.000 đồng nhưng thiệt hại trả hàng lớn hơn nhiều; hai là đổi màu bao bì cho 2 mã này.)",null,null,"Xiǎo Fāng: zhēnduì zhè liǎnggè wèntí, wǒ yǒu liǎnggè jiànyì: yī shì huànhuí yuánlái de zhǐxiāng, suīrán měigè guì liǎngqiān dùn, dànshì tuìhuò de sǔnshī bǐ zhège dàdeduō; èr shì gěi zhè liǎnggè xínghào de bāozhuāng huàn bùtóng de yánsè.",null,"BODY433"],["经理: 换颜色要多久？ (Đổi màu mất bao lâu?)",null,null,"Jīnglǐ: huàn yán
