10. 背后说人 (nói xấu sau lưng): 我不喜欢在背后说人。 (Tôi không thích nói xấu sau lưng người khác.)",null,null,"Bèihòu shuō rén | Wǒ bù xǐhuan zài bèihòu shuō rén.",null,"BODY1625"],["11. 闹矛盾 (xảy ra mâu thuẫn): 他们俩因为一个项目闹矛盾了。 (Hai người họ mâu thuẫn vì một dự án.)",null,null,"Nàomáodùn | Tāmen liǎ yīnwèi yīgè xiàngmù nàomáodùn le.",null,"BODY1626"],["12. 分寸 / 界限 (chừng mực / ranh giới): 跟同事开玩笑要有分寸。 (Đùa với đồng nghiệp phải có chừng mực.)",null,null,"Fēncùn | Jièxiàn | Gēn tóngshì kāiwánxiào yào yǒufēncùn.",null,"BODY1627"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY1628-C"],["1. 我不是那个意思，我是想说…… (Tôi không có ý đó, ý tôi là …)",null,null,"Wǒ bùshì nàge yìsi, wǒ shì xiǎng shuō……",null,"BODY1629"],["Ví dụ: 我不是那个意思，我是想说这个方案还可以再完善一下。 (Tôi không có ý đó, ý tôi là phương án này còn có thể hoàn thiện thêm.)",null,null,"Wǒ bùshì nàge yìsi, wǒ shì xiǎng shuō zhège fāng'àn hái kěyǐ zài wánshàn yīxià.",null,"BODY1630"],["Ví dụ: 我不是那个意思，我是想说你最近太累了，应该休息一下。 (Tôi không có ý đó, ý tôi là dạo này bạn mệt quá, nên nghỉ ngơi.)",null,null,"Wǒ bùshì nàge yìsi, wǒ shì xiǎng shuō nǐ zuìjìn tài lèi le, yīnggāi xiūxi yīxià.",null,"BODY1631"],["2. 可能有点误会，…… (Có lẽ có chút hiểu lầm, …)",null,null,"Kěnéng yǒudiǎn wùhuì,……",null,"BODY1632"],["Ví dụ: 可能有点误会，那天我没回你消息是因为手机没电了。 (Có lẽ có chút hiểu lầm, hôm đó tôi không trả lời tin nhắn vì điện thoại hết pin.)",null,null,"Kěnéng yǒudiǎn wùhuì, nàtiān wǒ méi huí nǐ xiāoxi shìyīnwèi shǒujī méi diàn le.",null,"BODY1633"],["Ví dụ: 可能有点误会，邮件不是我抄送给老板的。 (Có lẽ có hiểu lầm, email không phải tôi CC cho sếp.)",null,null,"Kěnéng yǒudiǎn wùhuì, yóujiàn bùshì wǒ chāo sònggěi lǎobǎn de.",null,"BODY1634"],["3. 跟……相处得…… (Cư xử / hòa hợp với … thế nào)",null,null,"Gēn…… xiāngchǔ de……",null,"BODY1635"],["Ví dụ: 我跟新来的经理相处得还不错。 (Tôi với giám đốc mới hòa hợp khá tốt.)",null,null,"Wǒ gēn xīn lái de jīnglǐ xiāngchǔ de hái bùcuò.",null,"BODY1636"],["Ví dụ: 刚开始跟中国同事相处得有点难，后来慢慢习惯了。 (Mới đầu với đồng nghiệp TQ hơi khó hòa hợp, sau dần quen.)",null,null,"Gāng kāishǐ gēn Zhōngguó tóngshì xiāngchǔ de yǒudiǎn nán, hòulái mànmàn xíguàn le.",null,"BODY1637"],["4. ……的时候，我们常常一起…… (Lúc …, chúng tôi hay cùng nhau …)",null,null,"…… De shíhou, wǒmen chángcháng yīqǐ……",null,"BODY1638"],["Ví dụ: 下班的时候，我们常常一起去喝奶茶。 (Tan làm chúng tôi hay cùng đi uống trà sữa.)",null,null,"Xiàbān de shíhou, wǒmen chángcháng yīqǐ qù hē nǎichá.",null,"BODY1639"],["Ví dụ: 放假的时候，我们常常一起去旅游。 (Nghỉ lễ chúng tôi hay cùng đi du lịch.)",null,null,"Fàngjià de shíhou, wǒmen chángcháng yīqǐ qù lǚyóu.",null,"BODY1640"],["5. 要不是……，我们也不会…… (Nếu không phải …, chúng tôi cũng không …)",null,null,"Yàobùshì……, wǒmen yě bùhuì……",null,"BODY1641"],["Ví dụ: 要不是那次一起出差，我们也不会成为好朋友。 (Nếu không có lần đi công tác đó, chúng tôi cũng không thành bạn thân.)",null,null,"Yàobùshì nàcì yīqǐ chūchāi, wǒmen yě bùhuì chéngwéi hǎo péngyou.",null,"BODY1642"],["Ví dụ: 要不是他帮我，我也不会这么快适应新工作。 (Nếu không có anh ấy giúp, tôi cũng không quen việc mới nhanh vậy.)",null,null,"Yàobùshì tā bāng wǒ, wǒ yě bùhuì zhème kuài shìyìng xīn gōngzuò.",null,"BODY1643"],["6. 说实话，我有点…… (Thật lòng mà nói, tôi hơi …)",null,null,"Shuōshíhuà, wǒ yǒudiǎn……",null,"BODY1644"],["Ví dụ: 说实话，你那天在会上那么说，我有点不舒服。 (Thật lòng mà nói, hôm đó bạn nói vậy trong họp, tôi hơi khó chịu.)",null,null,"Shuōshíhuà, nǐ nàtiān zài huìshàng nàme shuō, wǒ yǒudiǎn bù shūfu.",null,"BODY1645"],["Ví dụ: 说实话，我有点担心我们的关系会受影响。 (Thật lòng tôi hơi lo quan hệ của chúng ta bị ảnh hưởng.)",null,null,"Shuōshíhuà, wǒ yǒudiǎn dānxīn wǒmen de guānxi huì shòu yǐngxiǎng.",null,"BODY1646"],["7. 如果我哪里做得不对，…… (Nếu tôi làm sai chỗ nào, …)",null,null,"Rúguǒ wǒ nǎlǐ zuò de bù duì,……",null,"BODY1647"],["Ví dụ: 如果我哪里做得不对，你直接告诉我就行。 (Nếu tôi sai chỗ nào, bạn cứ nói thẳng.)",null,null,"Rúguǒ wǒ nǎlǐ zuò de bù duì, nǐ zhíjiē gàosu wǒ jiù xíng.",null,"BODY1648"],["Ví dụ: 如果我哪里说得不对，请你多包涵。 (Nếu tôi nói sai chỗ nào, mong bạn bỏ qua.)",null,null,"Rúguǒ wǒ nǎlǐ shuō de bù duì, qǐng nǐ duō bāohán.",null,"BODY1649"],["8. 改天……吧 (Hôm nào … nhé)",null,null,"Gǎitiān…… ba",null,"BODY1650"],["Ví dụ: 改天一起吃个饭吧，我请客。 (Hôm nào cùng ăn bữa cơm nhé, tôi mời.)",null,null,"Gǎitiān yīqǐ chī gè fàn ba, wǒ qǐngkè.",null,"BODY1651"],["Ví dụ: 今天太晚了，改天再聊吧。 (Hôm nay muộn rồi, hôm khác nói tiếp nhé.)",null,null,"Jīntiān tàiwǎn le, gǎitiān zàiliáo ba.",null,"BODY1652"],["9. (HSK5) 工作归工作，…… (Công việc là công việc, …)",null,null,"Gōngzuò guī gōngzuò,……",null,"BODY1653"],["Ví dụ: 工作归工作，私下我们还是朋友。 (Công việc là công việc, ngoài đời chúng ta vẫn là bạn.)",null,null,"Gōngzuò guī gōngzuò, sīxià wǒmen háishì péngyou.",null,"BODY1654"],["Ví dụ: 工作归工作，下班以后我不太想谈工作的事。 (Công việc là công việc, tan làm rồi tôi không muốn bàn chuyện công việc lắm.)",null,null,"Gōngzuò guī gōngzuò, xiàbān yǐhòu wǒ bùtàixiǎng tán gōngzuò de shì.",null,"BODY1655"],["10. (HSK5) 我理解你的感受，不过…… (Tôi hiểu cảm giác của bạn, nhưng …)",null,null,"Wǒ lǐjiě nǐ de gǎnshòu, bùguò……",null,"BODY1656"],["Ví dụ: 我理解你的感受，不过这件事不能只怪一个人。 (Tôi hiểu cảm giác của bạn, nhưng chuyện này không thể đổ lỗi cho một người.)",null,null,"Wǒ lǐjiě nǐ de gǎnshòu, bùguò zhèjiàn shì bùnéng zhǐ guài yīgè rén.",null,"BODY1657"],["Ví dụ: 我理解你的感受，不过我们还是先把问题解决了再说。 (Tôi hiểu cảm giác của bạn, nhưng mình cứ giải quyết vấn đề trước đã.)",null,null,"Wǒ lǐjiě nǐ de gǎnshòu, bùguò wǒmen háishì xiān bǎ wèntí jiějué le zàishuō.",null,"BODY1658"],["情景对话 1 — Kể về người bạn thân (hai đồng nghiệp trò chuyện)",null,null,"Qíngjǐng duìhuà",null,"BODY1659-C"],["A: 你周末去哪儿了？朋友圈里看到你在海边。 (Cuối tuần bạn đi đâu? Thấy trên trang cá nhân bạn ở biển.)",null,null,"Nǐ zhōumò qù nǎr le? Péngyou quānlǐ kàndào nǐ zài hǎibiān.",null,"BODY1660"],["B: 我去海防找我最好的朋友了，她下个月结婚。 (Tôi xuống Hải Phòng tìm bạn thân nhất, tháng sau cô ấy cưới.)",null,null,"Wǒ qù Hǎifáng zhǎo wǒ zuìhǎo de péngyou le, tā xiàgèyuè jiéhūn.",null,"BODY1661"],["A: 恭喜她！你们认识多久了？ (Chúc mừng cô ấy! Hai bạn quen bao lâu rồi?)",null,null,"Gōngxǐ tā! Nǐmen rènshi duōjiǔ le?",null,"BODY1662"],["B: 快二十年了，我们是小学同学，一直到高中都在一个班。 (Gần 20 năm rồi, bạn tiểu học, đến cấp 3 vẫn cùng lớp.)",null,null,"Kuài èrshínián le, wǒmen shì xiǎoxuétóngxué, yīzhí dào gāozhōng dōu zài yīgèbān.",null,"BODY1663"],["A: 那真不容易！你们性格像吗？ (Thật không dễ! Tính hai bạn có giống nhau không?)",null,null,"Nà zhēnbùróngyì! Nǐmen xìnggé xiàng ma?",null,"BODY1664"],["B: 一点也不像。她特别外向，我比较安静，但是我们特别合得来。 (Không giống chút nào. Cô ấy rất hướng ngoại, tôi khá trầm, nhưng rất hợp nhau.)",null,null,"Yīdiǎn yě bù xiàng. Tā tèbié wàixiàng, wǒ bǐjiào ānjìng, dànshì wǒmen tèbié hédelái.",null,"BODY1665"],["A: 你们吵过架吗？ (Hai bạn từng cãi nhau chưa?)",null,null,"Nǐmen chǎoguò jià ma?",null,"BODY1666"],["B: 吵过一次，大学的时候她忘了我的生日，我生了一个星期的气。 (Cãi một lần, hồi đại học cô ấy quên sinh nhật tôi, tôi giận cả tuần.)",null,null,"Chǎoguò yīcì, dàxué de shíhou tā wàng le wǒ de shēngrì, wǒ shēng le yīgè xīngqī de qì.",null,"BODY1667"],["A: 哈哈，后来呢？ (Haha, sau đó thì sao?)",null,null,"Hāhā, hòulái ne?",null,"BODY1668"],["B: 后来她坐了三个小时的车来河内找我，还给我带了一个蛋糕。我一看到她就不生气了。 (Sau đó cô ấy đi xe 3 tiếng lên Hà Nội tìm tôi, còn mang bánh kem. Vừa thấy cô ấy là hết giận.)",null,null,"Hòulái tā zuò le sāngè xiǎoshí de chē lái Hénèi zhǎo wǒ, huángěi wǒ dài le yīgè dàngāo. Wǒ yī kàndào tā jiù bù shēngqì le.",null,"BODY1669"],["A: 太感动了！现在你们不在一个城市，平时怎么联系？ (Cảm động quá! Giờ không cùng thành phố, bình thường liên lạc thế nào?)",null,null,"Tài gǎndòng le! Xiànzài nǐmen bù zài yīgè chéngshì, píngshí zěnme liánxì?",null,"BODY1670"],["B: 几乎每天都聊天，有什么开心或者不开心的事，第一个告诉的就是她。 (Gần như ngày nào cũng nhắn, có chuyện vui buồn gì, người đầu tiên tôi kể là cô ấy.)",null,null,"Jīhū měitiān dōu liáotiān, yǒu shénme kāixīn huòzhě bù kāixīn de shì, dìyīgè gàosu de jiùshì tā.",null,"BODY1671"],["A: 有这样的朋友真好。我毕业以后跟大学同学都很少联系了。 (Có bạn như vậy thật tốt. Ra trường tôi ít liên lạc với bạn đại học lắm.)",null,null,"Yǒu zhèyàng de péngyou zhēn hǎo. Wǒ bìyè yǐhòu gēn dàxué tóngxué dōu hěnshǎo liánxì le.",null,"BODY1672"],["B: 友谊也需要经营的。你可以主动约他们出来聚一聚。 (Tình bạn cũng cần vun đắp. Bạn có thể chủ động hẹn họ tụ tập.)",null,null,"Yǒuyì yě xūyào jīngyíng de. Nǐ kěyǐ zhǔdòng yuē tāmen chūlái jùyījù.",null,"BODY1673"],["A: 你说得对，这个周末我就在群里约一下。 (Bạn nói đúng, cuối tuần này tôi hẹn trong nhóm.)",null,null,"Nǐ shuōdeduì, zhège zhōumò wǒ jiù zài qún lǐ yuē yīxià.",null,"BODY1674"],["情景对话 2 — Mời đồng nghiệp người Trung Quốc đến nhà ăn cơm",null,null,"Qíngjǐng duìhuà",null,"BODY1675-C"],["A: 李哥，这个星期六你有空吗？我想请你来我家吃饭。 (Anh Lý, thứ 7 này anh rảnh không? Em muốn mời anh đến nhà ăn cơm.)",null,null,"Lǐgē, zhège xīngqīliù nǐ yǒukòng ma? Wǒ xiǎng qǐng nǐ lái wǒjiā chīfàn.",null,"BODY1676"],["B: 真的吗？太客气了！会不会给你添麻烦？ (Thật à? Khách sáo quá! Có làm phiền em không?)",null,null,"Zhēnde ma? Tài kèqi le! Huì bùhuì gěi nǐ tiānmáfan?",null,"BODY1677"],["A: 不麻烦，我妈妈很想认识你，她说要给你做越南菜。 (Không phiền đâu, mẹ em rất muốn làm quen anh, mẹ bảo sẽ nấu món Việt cho anh.)",null,null,"Bù máfan, wǒ māma hěn xiǎng rènshi nǐ, tā shuō yào gěi nǐ zuò Yuènán cài.",null,"BODY1678"],["B: 那我一定去！几点比较好？ (Vậy anh nhất định đến! Mấy giờ thì tiện?)",null,null,"Nà wǒ yīdìng qù! Jǐdiǎn bǐjiào hǎo?",null,"BODY1679"],["A: 晚上六点吧，我把地址发给你。 (6h tối nhé, em gửi địa chỉ cho anh.)",null,null,"Wǎnshàng liùdiǎn ba, wǒ bǎ dìzhǐ fāgěinǐ.",null,"BODY1680"],["B: 需要我带什么吗？ (Anh cần mang gì không?)",null,null,"Xūyào wǒ dài shénme ma?",null,"BODY1681"],["A: 什么都不用带，人来就行。 (Không cần mang gì, người đến là được.)",null,null,"Shénme dōu bùyòng dài, rén lái jiù xíng.",null,"BODY1682"],["B: 那怎么行！在中国，第一次去别人家一般要带点礼物。 (Sao được! Ở TQ, lần đầu đến nhà người ta thường mang chút quà.)",null,null,"Nàzěnmexíng! Zài Zhōngguó, dìyīcì qù biérén jiā yībān yào dài diǎn lǐwù.",null,"BODY1683"],["A: 越南也一样，不过一点水果就可以了，千万别买太贵的。 (VN cũng vậy, nhưng chút hoa quả là được, đừng mua đồ đắt.)",null,null,"Yuènán yě yīyàng, bùguò yīdiǎn shuǐguǒ jiù kěyǐ le, qiānwànbié mǎi tàiguì de.",null,"BODY1684"],["B: (thứ 7) 阿姨好！这是我从中国带来的茶叶，一点心意。 (Chào cô ạ! Đây là trà cháu mang từ TQ, chút lòng thành.)",null,null,"Āyí hǎo! Zhè shì wǒ cóng Zhōngguó dàilái de cháyè, yīdiǎn xīnyì.",null,"BODY1685"],["妈妈: 你太客气了！快进来坐。 (Cháu khách sáo quá! Vào ngồi đi.)",null,null,"Māma: nǐ tài kèqi le! Kuàijìnlái zuò.",null,"BODY1686"],["A: 李哥，这是我妈做的春卷和酸鱼汤，你尝尝。 (Anh Lý, đây là nem và canh chua cá mẹ em làm, anh nếm thử.)",null,null,"Lǐgē, zhè shì wǒ mā zuò de chūnjuǎn hé suānyútāng, nǐ chángchang.",null,"BODY1687"],["B: 太好吃了！阿姨的手艺比餐厅还好。 (Ngon quá! Tay nghề cô còn hơn nhà hàng.)",null,null,"Tài hǎochī le! Āyí de shǒuyì bǐ cāntīng háihǎo.",null,"BODY1688"],["妈妈: 喜欢就多吃点，别客气，就当是在自己家。 (Thích thì ăn nhiều vào, đừng khách sáo, coi như ở nhà mình.)",null,null,"Māma: xǐhuan jiù duō chī diǎn, bié kèqi, jiù dāng shì zài zìjǐ jiā.",null,"BODY1689"],["B: (lúc về) 谢谢阿姨的招待，今天吃得太开心了！改天我请你们去吃中国火锅。 (Cảm ơn cô đã tiếp đãi, hôm nay ăn vui quá! Hôm nào cháu mời mọi người đi ăn lẩu TQ.)",null,null,"Xièxie āyí de zhāodài, jīntiān chī de tài kāixīn le! Gǎitiān wǒ qǐng nǐmen qù chī Zhōngguó huǒguō.",null,"BODY1690"],["A: 好啊，一言为定！路上小心，到家给我发个消息。 (Được, nói là làm nhé! Đi đường cẩn thận, về đến nhà nhắn em.)",null,null,"Hǎo a, yīyánwéidìng! Lùshàng xiǎoxīn, dào jiā gěiwǒfā gè xiāoxi.",null,"BODY1691"],["情景对话 3 — Hỏi thăm, động viên đồng nghiệp đang gặp chuyện buồn",null,null,"Qíngjǐng duìhuà",null,"BODY1692-C"],["A: 小林，你今天看起来不太开心，怎么了？ (Tiểu Lâm, hôm nay trông bạn không vui lắm, sao vậy?)",null,null,"Xiǎo Lín, nǐ jīntiān kànqǐlái bù tài kāixīn, zěnme le?",null,"BODY1693"],["B: 没什么，就是有点累。 (Không có gì, chỉ hơi mệt.)",null,null,"Méishénme, jiùshì yǒudiǎnlèi.",null,"BODY1694"],["A: 真的没事吗？如果你想聊聊，我随时都在。 (Thật không sao chứ? Nếu muốn nói chuyện, mình luôn ở đây.)",null,null,"Zhēnde méishì ma? Rúguǒ nǐ xiǎng liáoliao, wǒ suíshí dōu zài.",null,"BODY1695"],["B: 其实……我爸爸上周住院了，我每天下班都要去医院。 (Thật ra… bố mình tuần trước nhập viện, ngày nào tan làm mình cũng vào viện.)",null,null,"Qíshí…… wǒ bàba shàngzhōu zhùyuàn le, wǒ měitiān xiàbān dōu yào qù yīyuàn.",null,"BODY1696"],["A: 啊，怎么不早说？叔叔现在怎么样了？ (Ôi, sao không nói sớm? Chú giờ thế nào rồi?)",null,null,"A, zěnme bù zǎo shuō? Shūshu xiànzài zěnmeyàng le?",null,"BODY1697"],["B: 做了手术，医生说恢复得还可以，就是要住两个星期。 (Mổ rồi, bác sĩ nói hồi phục khá tốt, chỉ là phải nằm 2 tuần.)",null,null,"Zuò le shǒushù, yīshēng shuō huīfù de hái kěyǐ, jiùshì yào zhù liǎnggè xīngqī.",null,"BODY1698"],["A: 那就好。你别太担心，也要照顾好自己的身体。 (Vậy thì tốt. Bạn đừng lo quá, cũng phải giữ gìn sức khỏe.)",null,null,"Nàjiùhǎo. Nǐ bié tài dānxīn, yě yào zhàogu hǎo zìjǐ de shēntǐ.",null,"BODY1699"],["B: 嗯，就是工作和医院两边跑，有点忙不过来。 (Ừ, chỉ là chạy hai đầu công việc với bệnh viện, hơi lo không xuể.)",null,null,"Ń, jiùshì gōngzuò hé yīyuàn liǎngbiān pǎo, yǒudiǎn mángbùguòlái.",null,"BODY1700"],["A: 这几天你手上的报表我先帮你做，你早点下班去医院。 (Mấy hôm nay báo cáo của bạn để mình làm giúp, bạn tan sớm vào viện.)",null,null,"Zhè jǐtiān nǐ shǒushàng de bàobiǎo wǒ xiān bāng nǐ zuò, nǐ zǎodiǎn xiàbān qù yīyuàn.",null,"BODY1701"],["B: 这样太麻烦你了。 (Vậy phiền bạn quá.)",null,null,"Zhèyàng tài máfan nǐ le.",null,"BODY1702"],["A: 别跟我客气，我们是同事也是朋友。你要不要跟经理说一下，请几天假？ (Đừng khách sáo, mình là đồng nghiệp cũng là bạn. Bạn có muốn nói với giám đốc xin nghỉ vài ngày không?)",null,null,"Biégēnwǒ kèqi, wǒmen shì tóngshì yě shì péngyou. Nǐ yào bùyào gēn jīnglǐ shuō yīxià, qǐng jǐtiān jià?",null,"BODY1703"],["B: 我本来不想麻烦大家，不过你说得对，我下午就跟经理说。 (Mình vốn không muốn làm phiền mọi người, nhưng bạn nói đúng, chiều nay mình nói với giám đốc.)",null,null,"Wǒ běnlái bùxiǎng máfan dàjiā, bùguò nǐ shuōdeduì, wǒ xiàwǔ jiù gēn jīnglǐ shuō.",null,"BODY1704"],["A: 周末我跟阿玲去医院看看叔叔吧。 (Cuối tuần mình với A Linh vào viện thăm chú nhé.)",null,null,"Zhōumò wǒ gēn Ā Líng qù yīyuàn kànkan shūshu ba.",null,"BODY1705"],["B: 谢谢你们！有你们这样的同事，我真的很幸运。 (Cảm ơn các bạn! Có đồng nghiệp như các bạn, mình thật may mắn.)",null,null,"Xièxienǐmen! Yǒu nǐmen zhèyàng de tóngshì, wǒ zhēnde hěn xìngyùn.",null,"BODY1706"],["情景对话 4 — Hiểu lầm giữa hai người bạn (tin nhắn không trả lời, buổi hẹn bị quên)",null,null,"Qíngjǐng duìhuà",null,"BODY1707-C"],["A: 阿明，你最近怎么不理我了？ (Minh, dạo này sao bạn không thèm để ý mình?)",null,null,"Ā Míng, nǐ zuìjìn zěnme bùlǐ wǒ le?",null,"BODY1708"],["B: 没有啊，你怎么这么说？ (Đâu có, sao bạn nói vậy?)",null,null,"Méiyǒu a, nǐ zěnme zhème shuō?",null,"BODY1709"],["A: 上周六我们约好一起吃饭，我在餐厅等了你一个小时，给你打电话你也不接。 (Thứ 7 tuần trước hẹn ăn cơm, mình đợi ở nhà hàng một tiếng, gọi bạn cũng không nghe.)",null,null,"Shàng zhōuliù wǒmen yuē hǎo yīqǐ chīfàn, wǒ zài cāntīng děng le nǐ yīgè xiǎoshí, gěi nǐ dǎdiànhuà nǐ yě bù jiē.",null,"BODY1710"],["B: 啊？上周六？我以为是这周六！ (Hả? Thứ 7 tuần trước? Mình tưởng là thứ 7 này!)",null,null,"A? Shàng zhōuliù? Wǒ yǐwéi shì zhè zhōuliù!",null,"BODY1711"],["A: 我们明明在微信上说的是\"这个周六\"。 (Rõ ràng trên WeChat nói là \"thứ 7 này\".)",null,null,"Wǒmen míngmíng zài wēi xìn shàng shuō de shì \"zhège zhōuliù\".",null,"BODY1712"],["B: 你说的时候是星期天，我以为\"这个周六\"是下一周的周六。可能有点误会。 (Lúc bạn nói là Chủ nhật, mình tưởng \"thứ 7 này\" là thứ 7 tuần sau. Có lẽ hiểu lầm rồi.)",null,null,"Nǐ shuō de shíhou shì xīngqītiān, wǒ yǐwéi \"zhège zhōuliù\" shì xià yīzhōu de zhōuliù. Kěnéng yǒudiǎn wùhuì.",null,"BODY1713"],["A: 那你为什么不接电话？ (Thế sao bạn không nghe máy?)",null,null,"Nà nǐ wèishénme bù jiēdiànhuà?",null,"BODY1714"],["B: 那天我在开车回老家，手机放在包里，没听见。后来看到未接来电，回电话你又没接。 (Hôm đó mình lái xe về quê, điện thoại để trong túi không nghe thấy. Sau thấy cuộc gọi nhỡ, gọi lại thì bạn không nghe.)",null,null,"Nàtiān wǒ zài kāichē huílǎojiā, shǒujī fàngzài bāo lǐ, méi tīngjiàn. Hòulái kàndào wèijiē láidiàn, huí diànhuà nǐ yòu méi jiē.",null,"BODY1715"],["A: 我那时候太生气了，故意不接的。 (Lúc đó mình giận quá, cố ý không nghe.)",null,null,"Wǒ nà shíhou tài shēngqì le, gùyì bù jiē de.",null,"BODY1716"],["B: 真的对不起，让你白等了一个小时。我不是故意的。 (Thật xin lỗi, để bạn đợi uổng một tiếng. Mình không cố ý.)",null,null,"Zhēnde duìbuqǐ, ràng nǐ bái děng le yīgè xiǎoshí. Wǒ bùshìgùyì de.",null,"BODY1717"],["A: 算了，我也有不对，应该说清楚日期。 (Thôi, mình cũng có lỗi, đáng lẽ phải nói rõ ngày.)",null,null,"Suànle, wǒ yě yǒu bù duì, yīnggāi shuō qīngchu rìqī.",null,"BODY1718"],["B: 以后我们约时间就直接说几号，不说\"这个周六\"了。 (Sau này hẹn thì nói thẳng ngày mấy, không nói \"thứ 7 này\" nữa.)",null,null,"Yǐhòu wǒmen yuē shíjiān jiù zhíjiē shuō jǐhào, bù shuō \"zhège zhōuliù\" le.",null,"BODY1719"],["A: 好主意！哈哈。 (Ý hay! Haha.)",null,null,"Hǎo zhǔyì! Hāhā.",null,"BODY1720"],["B: 这周六……不对，十月二十五号，我请你吃饭，向你赔罪！ (Thứ 7 này… không, ngày 25/10, mình mời bạn ăn cơm, tạ lỗi với bạn!)",null,null,"Zhè zhōuliù…… bù duì, shíyuè èrshíwǔ hào, wǒ qǐng nǐ chīfàn, xiàng nǐ péizuì!",null,"BODY1721"],["A: 这还差不多！一言为定。 (Thế mới được chứ! Nói là làm nhé.)",null,null,"Zhè hái chàbuduō! Yīyánwéidìng.",null,"BODY1722"],["情景对话 5 — (HSK5) Mâu thuẫn với đồng nghiệp: bị nói trước mặt sếp",null,null,"Qíngjǐng duìhuà",null,"BODY1723-C"],["小芳: 阿海，你现在有空吗？我想跟你聊几句。 (A Hải, giờ rảnh không? Mình muốn nói vài câu.)",null,null,"Xiǎo Fāng: Ā Hǎi, nǐ xiànzài yǒukòng ma? Wǒ xiǎng gēn nǐ liáo jǐjù.",null,"BODY1724"],["阿海: 可以，什么事？ (Được, chuyện gì?)",null,null,"Ā Hǎi: kěyǐ, shénme shì?",null,"BODY1725"],["小芳: 说实话，昨天开会的时候，你当着经理的面说我的报告数据有错误，我有点不舒服。 (Thật lòng mà nói, hôm qua họp bạn nói trước mặt giám đốc là báo cáo của mình sai số liệu, mình hơi khó chịu.)",null,null,"Xiǎo Fāng: shuōshíhuà, zuótiān kāihuì de shíhou, nǐ dāngzhe jīnglǐ de miàn shuō wǒ de bàogào shùjù yǒu cuòwù, wǒ yǒudiǎn bù shūfu.",null,"BODY1726"],["阿海: 可是数据确实有错啊，我只是说了事实。 (Nhưng số liệu đúng là sai mà, mình chỉ nói sự thật.)",null,null,"Ā Hǎi: kěshì shùjù quèshí yǒu cuò a, wǒ zhǐshì shuō le shìshí.",null,"BODY1727"],["小芳: 我知道有错，我也很感谢你发现了。我不是怪你指出问题，我是觉得你可以会前私下告诉我。 (Mình biết có sai, cũng cảm ơn bạn đã phát hiện. Mình không trách bạn chỉ ra lỗi, mình thấy bạn có thể nói riêng với mình trước buổi họp.)",null,null,"Xiǎo Fāng: wǒ zhīdao yǒu cuò, wǒ yě hěn gǎnxiè nǐ fāxiàn le. Wǒ bùshì guài nǐ zhǐchū wèntí, wǒ shì juéde nǐ kěyǐ huì qián sīxià gàosu wǒ.",null,"BODY1728"],["阿海: 我会前也是刚看到，没来得及跟你说。 (Trước họp mình cũng mới thấy, không kịp nói với bạn.)",null,null,"Ā Hǎi: wǒhuì qián yě shì gāng kàndào, méi láidejí gēn nǐ shuō.",null,"BODY1729"],["小芳: 原来是这样。我还以为你是故意的。 (Ra vậy. Mình còn tưởng bạn cố ý.)",null,null,"Xiǎo Fāng: yuánlái shì zhèyàng. Wǒ hái yǐwéi nǐ shì gùyì de.",null,"BODY1730"],["阿海: 怎么会呢！不过我当时说话的语气可能有点急，如果让你觉得没面子，我向你道歉。 (Sao lại thế! Nhưng lúc đó giọng mình có thể hơi gắt, nếu làm bạn mất mặt, mình xin lỗi.)",null,null,"Ā Hǎi: zěnme huì ne! Bùguò wǒ dāngshí shuōhuà de yǔqì kěnéng yǒudiǎn jí, rúguǒ ràng nǐ juéde méimiànzi, wǒ xiàng nǐ dàoqiàn.",null,"BODY1731"],["小芳: 谢谢你这么说。其实我也有问题，交报告之前应该再检查一遍。 (Cảm ơn bạn nói vậy. Thật ra mình cũng có lỗi, trước khi nộp báo cáo phải kiểm tra lại.)",null,null,"Xiǎo Fāng: xièxie nǐ zhème shuō. Qíshí wǒ yě yǒu wèntí, jiāo bàogào zhīqián yīnggāi zài jiǎnchá yībiàn.",null,"BODY1732"],["阿海: 要不以后这样：重要的报告交之前，我们互相帮对方看一遍。 (Hay sau này thế này: báo cáo quan trọng trước khi nộp, mình xem giúp nhau một lượt.)",null,null,"Ā Hǎi: yào bù yǐhòu zhèyàng: zhòngyào de bàogào jiāo zhīqián, wǒmen hùxiāng bāng duìfāng kànyībiàn.",null,"BODY1733"],["小芳: 好主意！这样错误会少很多。 (Ý hay! Như vậy sẽ ít lỗi hơn nhiều.)",null,null,"Xiǎo Fāng: hǎo zhǔyì! Zhèyàng cuòwù huì shǎo hěnduō.",null,"BODY1734"],["阿海: 工作归工作，我们还是好同事。今天中午一起吃饭吧？ (Công việc là công việc, mình vẫn là đồng nghiệp tốt. Trưa nay ăn cơm cùng nhé?)",null,null,"Ā Hǎi: gōngzuò guī gōngzuò, wǒmen háishì hǎo tóngshì. Jīntiān zhōngwǔ yīqǐ chīfàn ba?",null,"BODY1735"],["小芳: 好啊，今天我请！ (Được, hôm nay mình mời!)",null,null,"Xiǎo Fāng: hǎo a, jīntiān wǒ qǐng!",null,"BODY1736"],["情景对话 6 — (HSK5) Giữ ranh giới: đồng nghiệp hay nhờ việc ngoài phạm vi, sếp nhắn tin cuối tuần",null,null,"Qíngjǐng duìhuà",null,"BODY1737-C"],["同事: 小阮，帮我把这份翻译做一下吧，明天要用。 (Tiểu Nguyễn, dịch giúp mình tài liệu này nhé, mai cần dùng.)",null,null,"Tóngshì: Xiǎo Ruǎn, bāng wǒ bǎ zhèfèn fānyì zuò yīxià ba, míngtiān yào yòng.",null,"BODY1738"],["小阮: 又是翻译吗？这个月已经是第五份了。 (Lại dịch à? Tháng này là bản thứ 5 rồi.)",null,null,"Xiǎo Ruǎn: yòu shì fānyì ma? Zhège yuè yǐjīng shì dìwǔ fèn le.",null,"BODY1739"],["同事: 你中文好嘛，我自己翻要花一整天。 (Bạn giỏi tiếng Trung mà, tự mình dịch mất cả ngày.)",null,null,"Tóngshì: nǐ Zhōngwén hǎo ma, wǒ zìjǐ fān yào huā yīzhěngtiān.",null,"BODY1740"],["小阮: 我理解，不过我这周手上有三个报价要做，恐怕没时间帮你。 (Mình hiểu, nhưng tuần này mình có 3 báo giá phải làm, e không có thời gian giúp.)",null,null,"Xiǎo Ruǎn: wǒ lǐjiě, bùguò wǒ zhè zhōu shǒushàng yǒu sāngè bàojià yào zuò, kǒngpà méi shíjiān bāng nǐ.",null,"BODY1741"],["同事: 就这一次，下次不找你了。 (Lần này thôi, lần sau không nhờ nữa.)",null,null,"Tóngshì: jiù zhè yīcì, xiàcì bù zhǎo nǐ le.",null,"BODY1742"],["小阮: 这样吧，我帮你看一下最重要的那两页，其他的你先用翻译软件翻，我最后帮你检查一遍。 (Thế này nhé, mình xem giúp 2 trang quan trọng nhất, phần còn lại bạn dùng phần mềm dịch trước, cuối cùng mình kiểm tra giúp.)",null,null,"Xiǎo Ruǎn: zhèyàng ba, wǒ bāng nǐ kàn yīxià zuì zhòngyào de nà liǎngyè, qítā de nǐ xiān yòng fānyì ruǎnjiàn fān, wǒ zuìhòu bāng nǐ jiǎnchá yībiàn.",null,"BODY1743"],["同事: 好，这样也行，谢谢！ (Được, vậy cũng ổn, cảm ơn!)",null,null,"Tóngshì: hǎo, zhèyàng yě xíng, xièxie!",null,"BODY1744"],["小阮: 另外，我觉得公司其实需要一个专门的翻译，我们可以一起跟经理提一下。 (Ngoài ra, mình thấy công ty thực sự cần một phiên dịch chuyên trách, mình cùng đề xuất với giám đốc nhé.)",null,null,"Xiǎo Ruǎn: lìngwài, wǒ juéde gōngsī qíshí xūyào yīgè zhuānmén de fānyì, wǒmen kěyǐ yīqǐ gēn jīnglǐ tí yīxià.",null,"BODY1745"],["同事: 对，这样大家都轻松一点。 (Đúng, vậy mọi người đều nhẹ nhõm hơn.)",null,null,"Tóngshì: duì, zhèyàng dàjiā dōu qīngsōng yīdiǎn.",null,"BODY1746"],["小阮: (thứ 2, nói với sếp) 经理，有件事想跟您沟通一下。周末您发的工作消息，我有时候没能及时回复，不好意思。 (Giám đốc, có việc em muốn trao đổi. Tin nhắn công việc anh gửi cuối tuần, đôi khi em không trả lời kịp, xin lỗi anh.)",null,null,"Xiǎo Ruǎn: jīnglǐ, yǒujiànshì xiǎng gēn nín gōutōng yīxià. Zhōumò nín fā de gōngzuò xiāoxi, wǒ yǒushíhou méi néng jíshí huífù, bùhǎoyìsi.",null,"BODY1747"],["经理: 没关系，周末的事一般不急。 (Không sao, việc cuối tuần thường không gấp.)",null,null,"Jīnglǐ: méiguānxi, zhōumò de shì yībān bù jí.",null,"BODY1748"],["小阮: 谢谢您理解。周末我一般陪家人，如果有紧急的事，您直接打电话给我，我一定马上处理；不急的事，我周一一早就回复。 (Cảm ơn anh thông cảm. Cuối tuần em thường ở với gia đình, có việc gấp anh cứ gọi điện, em nhất định xử lý ngay; việc không gấp em trả lời sáng sớm thứ 2.)",null,null,"Xiǎo Ruǎn: xièxienín lǐjiě. Zhōumò wǒ yībān péi jiārén, rúguǒ yǒu jǐnjí de shì, nín zhíjiē dǎdiànhuà gěi wǒ, wǒ yīdìng mǎshàng chǔlǐ; bù jí de shì, wǒ zhōuyī yī zǎojiù huífù.",null,"BODY1749"],["经理: 好，这样很清楚，以后我也注意一下。 (Được, vậy rõ ràng, sau này tôi cũng chú ý.)",null,null,"Jīnglǐ: hǎo, zhèyàng hěn qīngchu, yǐhòu wǒ yě zhùyì yīxià.",null,"BODY1750"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY1751-C"],["1. Hỏi: 你觉得什么样的同事最好相处？ (Bạn thấy đồng nghiệp thế nào dễ hòa hợp nhất?)",null,null,"Nǐ juéde shénmeyàng de tóngshì zuìhǎo xiāngchǔ?",null,"BODY1752"],["Đáp: 我觉得说话直接但是有分寸、愿意帮助别人、不在背后说人的同事最好相处。 (Đồng nghiệp nói thẳng nhưng có chừng mực, sẵn lòng giúp người, không nói xấu sau lưng là dễ hòa hợp nhất.)",null,null,"Wǒ juéde shuōhuà zhíjiē dànshì yǒufēncùn, yuànyì bāngzhù biérén, bù zài bèihòu shuō rén de tóngshì zuìhǎo xiāngchǔ.",null,"BODY1753"],["2. Hỏi: 跟中国同事相处，你觉得跟越南同事有什么不一样？ (Hòa hợp với đồng nghiệp TQ khác đồng nghiệp VN thế nào?)",null,null,"Gēn Zhōngguó tóngshì xiāngchǔ, nǐ juéde gēn Yuènán tóngshì yǒu shénme bù yīyàng?",null,"BODY1754"],["Đáp: 我觉得中国同事更喜欢在饭桌上谈事情，关系好了，工作也好办。越南同事比较随意，下班喝杯咖啡就熟了。 (Đồng nghiệp TQ thích bàn việc trên bàn ăn, quan hệ tốt thì việc dễ làm. Đồng nghiệp VN thoải mái hơn, tan làm uống cà phê là thân.)",null,null,"Wǒ juéde Zhōngguó tóngshì gèng xǐhuan zài fànzhuō shàng tán shìqing, guānxi hǎo le, gōngzuò yě hǎobàn. Yuènán tóngshì bǐjiào suíyì, xiàbān hēbēi kāfēi jiù shú le.",null,"BODY1755"],["3. Hỏi: 如果朋友误会了你，你会怎么做？ (Nếu bạn bè hiểu lầm bạn, bạn sẽ làm gì?)",null,null,"Rúguǒ péngyou wùhuì le nǐ, nǐ huì zěnme zuò?",null,"BODY1756"],["Đáp: 我会先让他说完，了解他为什么生气，然后再解释。如果是我的错，我会马上道歉。 (Để bạn ấy nói hết, hiểu vì sao giận, rồi mới giải thích. Nếu lỗi của mình thì xin lỗi ngay.)",null,null,"Wǒhuì xiān ràng tā shuōwán, liǎojiě tā wèishénme shēngqì, ránhòu zài jiěshì. Rúguǒ shì wǒ de cuò, wǒhuì mǎshàng dàoqiàn.",null,"BODY1757"],["4. Hỏi: (HSK5) 同事和朋友的界限在哪里？ (Ranh giới giữa đồng nghiệp và bạn bè ở đâu?)",null,null,"Tóngshì hé péngyou de jièxiàn zài nǎlǐ?",null,"BODY1758"],["Đáp: 我觉得可以跟同事做朋友，但是工作上的事要公事公办。比如朋友犯了错，我也会指出来，只是方式要注意，最好私下说。 (Có thể làm bạn với đồng nghiệp, nhưng việc công phải rõ ràng. Ví dụ bạn mắc lỗi tôi vẫn chỉ ra, chỉ là chú ý cách nói, tốt nhất nói riêng.)",null,null,"Wǒ juéde kěyǐ gēn tóngshì zuò péngyou, dànshì gōngzuò shàng de shì yào gōngshìgōngbàn. Bǐrú péngyou fànlecuò, wǒ yě huì zhǐchū lái, zhǐshì fāngshì yào zhùyì, zuìhǎo sīxià shuō.",null,"BODY1759"],["情景模拟 ROLE-PLAY — Bạn bè hiểu nhầm lời nói. Vòng 2 (bất ngờ): GV thêm một người thứ ba \"truyền lời\" làm hiểu lầm nặng hơn",null,null,"Qíngjǐng mónǐ",null,"BODY1760-C"],["GV: 我听小王说，你觉得我做的PPT很难看？ (Nghe Tiểu Vương nói bạn thấy PPT tôi làm rất xấu?)",null,null,"Wǒ tīng Xiǎo Wáng shuō, nǐ juéde wǒ zuò de PPT hěn nánkàn?",null,"BODY1761"],["HS: 啊？我不是那个意思！我是说颜色有点多，可以再简单一点。 (Hả? Mình không có ý đó! Mình nói màu hơi nhiều, có thể đơn giản hơn chút.)",null,null,"A? Wǒ bùshì nàge yìsi! Wǒ shì shuō yánsè yǒudiǎn duō, kěyǐ zài jiǎndān yīdiǎn.",null,"BODY1762"],["GV: 可是小王说你当着很多人的面笑我。 (Nhưng Tiểu Vương nói bạn cười mình trước mặt nhiều người.)",null,null,"Kěshì Xiǎo Wáng shuō nǐ dāngzhe hěnduō rén de miàn xiào wǒ.",null,"BODY1763"],["HS: 可能有点误会。那天我们在讨论设计，我笑是因为小王讲了个笑话，跟你没关系。 (Có lẽ có hiểu lầm. Hôm đó mọi người bàn thiết kế, mình cười vì Tiểu Vương kể chuyện cười, không liên quan đến bạn.)",null,null,"Kěnéng yǒudiǎn wùhuì. Nàtiān wǒmen zài tǎolùn shèjì, wǒ xiào shìyīnwèi Xiǎo Wáng jiǎng le gè xiàohua, gēn nǐ méiguānxi.",null,"BODY1764"],["GV: 真的吗？ (Thật không?)",null,null,"Zhēnde ma?",null,"BODY1765"],["HS: 真的。如果我说的话让你不舒服，我向你道歉。其实我觉得你的内容做得很好，数据特别清楚。 (Thật. Nếu lời mình làm bạn khó chịu, mình xin lỗi. Thật ra mình thấy nội dung bạn làm rất tốt, số liệu rất rõ.)",null,null,"Zhēnde. Rúguǒ wǒ shuō dehuà ràng nǐ bù shūfu, wǒ xiàng nǐ dàoqiàn. Qíshí wǒ juéde nǐ de nèiróng zuò de hěn hǎo, shùjù tèbié qīngchu.",null,"BODY1766"],["GV: 那你为什么不直接跟我说？ (Thế sao bạn không nói thẳng với mình?)",null,null,"Nà nǐ wèishénme bù zhíjiē gēn wǒ shuō?",null,"BODY1767"],["HS: 你说得对，以后有意见我直接跟你说，不在别人面前讨论。我们一起叫上小王，把话说清楚吧。 (Bạn nói đúng, sau có ý kiến mình nói thẳng với bạn, không bàn trước mặt người khác. Mình cùng gọi Tiểu Vương nói rõ mọi chuyện nhé.)",null,null,"Nǐ shuōdeduì, yǐhòu yǒu yìjiàn wǒ zhíjiē gēn nǐ shuō, bù zài biérén miànqián tǎolùn. Wǒmen yīqǐ jiào shàng Xiǎo Wáng, bǎ huà shuō qīngchu ba.",null,"BODY1768"],["GV: 好吧，我也不应该只听别人说。 (Thôi được, mình cũng không nên chỉ nghe người khác nói.)",null,null,"Hǎo ba, wǒ yě bù yīnggāi zhǐ tīng biérén shuō.",null,"BODY1769"],["HS: 没事，说开了就好。下班一起喝杯咖啡吧！ (Không sao, nói ra là ổn. Tan làm cùng uống cà phê nhé!)",null,null,"Méishì, shuō kāi le jiù hǎo. Xiàbān yīqǐ hēbēi kāfēiba!",null,"BODY1770"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY1771-C"],["✗ 我和他相处很好。 → ✓ 我和他相处得很好。 (Bổ ngữ trình độ cần 得.)",null,null,"Wǒ hé tā xiāngchǔ hěn hǎo. | Wǒ hé tā xiāngchǔ de hěn hǎo. | De .",null,"BODY1772"],["✗ 你误会了我的意思是…… → ✓ 你误会我的意思了，我是想说……",null,null,"Nǐ wùhuì le wǒ de yìsi shì…… | Nǐ wùhuì wǒ de yìsi le, wǒ shì xiǎng shuō……",null,"BODY1773"],["✗ 我很信他。 → ✓ 我很信任他。/ 我很相信他。",null,null,"Wǒ hěn xìn tā. | Wǒ hěn xìnrèn tā. / | Wǒ hěn xiāngxìn tā.",null,"BODY1774"],["✗ 我们合得来很好。 → ✓ 我们很合得来。",null,null,"Wǒmen hédelái hěn hǎo. | Wǒmen hěn hédelái.",null,"BODY1775"],["✗ 对不起你。 → ✓ 对不起。/ 我向你道歉。",null,null,"Duìbuqǐ nǐ. | Duìbuqǐ. / | Wǒ xiàng nǐ dàoqiàn.",null,"BODY1776"],["✗ 我生气他。 → ✓ 我生他的气。/ 我对他很生气。",null,null,"Wǒ shēngqì tā. | Wǒ shēng tā de qì. / | Wǒ duì tā hěn shēngqì.",null,"BODY1777"],["Lưu ý văn hóa: người TQ rất coi trọng 面子 (thể diện) → góp ý nên nói riêng, mở đầu bằng lời khen, dùng 是不是可以……？ thay vì 你错了.",null,null,"Miànzi | Shìbùshì kěyǐ……? | Nǐ cuò le .",null,"BODY1778"],["Phát âm: 相处 xiāngchǔ; 误会 wùhuì; 信任 xìnrèn; 尊重 zūnzhòng.",null,null,"Xiāngchǔ | Wùhuì | Xìnrèn | Zūnzhòng",null,"BODY1779"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY1780-C"],["Ghi âm cách hóa giải một hiểu lầm (thật hoặc tưởng tượng) 2 phút: chuyện gì → vì sao hiểu lầm → giải thích thế nào → kết quả.",null,null,null,null,"BODY1781"],["HSK5: thêm 1 phút nói về cách giữ ranh giới giữa công việc và quan hệ cá nhân.",null,null,null,null,"BODY1782"],["Luyện cặp: đóng lại Hội thoại 4 và 5, đổi vai.",null,null,null,null,"BODY1783"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY1784"],["Buổi 10 — 请求、拒绝与建议 Nhờ vả và từ chối",null,null,"Qǐngqiú, jùjué yǔ jiànyì",null,"BODY1785-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY1786-C"],["HSK4: Nhờ giúp đỡ, xin nghỉ phép, từ chối lịch sự, đưa lời khuyên. HSK5: Từ chối yêu cầu vô lý nhưng vẫn lịch sự, đưa phương án thay thế.",null,null,null,null,"BODY1787"],["Công thức từ chối 3 bước: ① Cảm ơn / thể hiện thiện chí → ② Nêu lý do cụ thể → ③ Đưa phương án thay thế.",null,null,null,null,"BODY1788"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY1790-C"],["1. Hỏi: 你最近请别人帮过什么忙？ (Gần đây bạn nhờ ai giúp việc gì?)",null,null,"Nǐ zuìjìn qǐng biérén bāng guò shénme máng?",null,"BODY1791"],["Đáp: 上周我请同事帮我接孩子，因为我临时要加班。 (Tuần trước tôi nhờ đồng nghiệp đón con giúp vì đột xuất phải tăng ca.)",null,null,"Shàngzhōu wǒ qǐng tóngshì bāng wǒ jiē háizi, yīnwèi wǒ línshí yào jiābān.",null,"BODY1792"],["2. Hỏi: 别人请你帮忙，你一般会拒绝吗？ (Người khác nhờ, bạn có hay từ chối không?)",null,null,"Biérén qǐng nǐ bāngmáng, nǐ yībān huì jùjué ma?",null,"BODY1793"],["Đáp: 我不太会拒绝别人，所以常常把自己弄得很累。 (Tôi không giỏi từ chối nên hay khiến mình rất mệt.)",null,null,"Wǒ bùtàihuì jùjué biérén, suǒyǐ chángcháng bǎ zìjǐ nòng de hěn lèi.",null,"BODY1794"],["3. Hỏi: 你上一次请假是什么时候？什么原因？ (Lần gần nhất bạn xin nghỉ là khi nào? Lý do gì?)",null,null,"Nǐ shàng yīcì qǐngjià shì shénme shíhou? Shénme yuányīn?",null,"BODY1795"],["Đáp: 上个月，我孩子发烧了，我请了一天假带他去医院。 (Tháng trước, con tôi bị sốt, tôi xin nghỉ một ngày đưa con đi viện.)",null,null,"Shànggèyuè, wǒ háizi fāshāo le, wǒ qǐng le yītiān jiàdài tā qù yīyuàn.",null,"BODY1796"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY1797-C"],["1. 麻烦 (làm phiền, phiền): 麻烦你帮我把这份文件交给经理。 (Phiền bạn đưa tài liệu này cho giám đốc giúp.)",null,null,"Máfan | Máfan nǐ bāng wǒ bǎ zhèfèn wénjiàn jiāogěi jīnglǐ.",null,"BODY1798"],["2. 打扰 (quấy rầy): 不好意思，打扰一下，能问你个问题吗？ (Xin lỗi làm phiền, hỏi bạn một câu được không?)",null,null,"Dǎrǎo | Bùhǎoyìsi, dǎrǎo yīxià, néng wèn nǐ gè wèntí ma?",null,"BODY1799"],["3. 恐怕 (e là, sợ rằng): 恐怕我今天完成不了。 (E là hôm nay tôi không hoàn thành được.)",null,null,"Kǒngpà | Kǒngpà wǒ jīntiān wánchéng bùliǎo.",null,"BODY1800"],["4. 尽量 (cố gắng hết mức): 我尽量明天上午给你答复。 (Tôi cố gắng sáng mai trả lời bạn.)",null,null,"Jǐnliàng | Wǒ jǐnliàng míngtiān shàngwǔ gěi nǐ dáfù.",null,"BODY1801"],["5. 不太方便 (không tiện lắm): 今天晚上我不太方便，明天可以吗？ (Tối nay tôi không tiện lắm, mai được không?)",null,null,"Bù tài fāngbiàn | Jīntiān wǎnshàng wǒ bù tài fāngbiàn, míngtiān kěyǐ ma?",null,"BODY1802"],["6. 另想办法 (nghĩ cách khác): 这次我帮不了你，你另想办法吧。 (Lần này tôi không giúp được, bạn nghĩ cách khác nhé.)",null,null,"Lìngxiǎngbànfǎ | Zhècì wǒ bāngbùliǎo nǐ, nǐ lìngxiǎngbànfǎ ba.",null,"BODY1803"],["7. 请假 (xin nghỉ): 我想请两天假回老家。 (Tôi muốn xin nghỉ 2 ngày về quê.)",null,null,"Qǐngjià | Wǒ xiǎng qǐng liǎngtiān jià huílǎojiā.",null,"BODY1804"],["8. 能不能……？/ 可不可以……？ (… được không?): 能不能借我一下你的充电器？ (Cho tôi mượn sạc một chút được không?)",null,null,"Néng bùnéng……? / | Kěbùkěyǐ……? | Néng bùnéng jiè wǒ yīxià nǐ de chōngdiànqì?",null,"BODY1805"],["9. 力不从心 (lực bất tòng tâm): 我很想帮你，可是真的力不从心。 (Tôi rất muốn giúp, nhưng thật sự lực bất tòng tâm.)",null,null,"Lìbùcóngxīn | Wǒ hěn xiǎng bāng nǐ, kěshì zhēnde lìbùcóngxīn.",null,"BODY1806"],["10. 建议 (đề nghị, khuyên): 我建议你先跟客户打个电话。 (Tôi khuyên bạn gọi điện cho khách trước.)",null,null,"Jiànyì | Wǒ jiànyì nǐ xiān gēn kèhù dǎ gè diànhuà.",null,"BODY1807"],["11. 帮得上忙 / 帮不上忙 (giúp được / không giúp được): 有什么我帮得上忙的，尽管说。 (Có gì tôi giúp được cứ nói.)",null,null,"Bāng de shàng máng | Bāngbùshàngmáng | Yǒu shénme wǒ bāng de shàng máng de, jǐnguǎn shuō.",null,"BODY1808"],["12. 欠人情 (nợ ân tình): 这次你帮了我，我欠你一个人情。 (Lần này bạn giúp tôi, tôi nợ bạn một lần.)",null,null,"Qiàn rénqíng | Zhècì nǐ bāng le wǒ, wǒ qiàn nǐ yīgè rénqíng.",null,"BODY1809"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY1810-C"],["1. 恐怕今天不太方便，…… (E là hôm nay không tiện lắm, …)",null,null,"Kǒngpà jīntiān bù tài fāngbiàn,……",null,"BODY1811"],["Ví dụ: 恐怕今天不太方便，我下午要去见客户。 (E là hôm nay không tiện lắm, chiều tôi phải gặp khách.)",null,null,"Kǒngpà jīntiān bù tài fāngbiàn, wǒ xiàwǔ yào qù jiàn kèhù.",null,"BODY1812"],["Ví dụ: 恐怕今天晚上不太方便，我已经答应孩子陪他去看电影了。 (E là tối nay không tiện, tôi đã hứa đưa con đi xem phim.)",null,null,"Kǒngpà jīntiān wǎnshàng bù tài fāngbiàn, wǒ yǐjīng dāying háizi péi tā qù kàn diànyǐng le.",null,"BODY1813"],["2. 要不……？ (Hay là … nhé?)",null,null,"Yào bù……?",null,"BODY1814"],["Ví dụ: 要不我明天早上来公司早一点帮你？ (Hay mai tôi đến công ty sớm chút giúp bạn nhé?)",null,null,"Yào bù wǒ míngtiān zǎoshang lái gōngsī zǎo yīdiǎn bāng nǐ?",null,"BODY1815"],["Ví dụ: 要不你问问小林，他对这个系统比较熟悉。 (Hay bạn hỏi Tiểu Lâm, anh ấy rành hệ thống này hơn.)",null,null,"Yào bù nǐ wènwen Xiǎo Lín, tā duì zhège xìtǒng bǐjiào shúxi.",null,"BODY1816"],["3. 不好意思，能不能麻烦你……？ (Xin lỗi, phiền bạn … được không?)",null,null,"Bùhǎoyìsi, néng bùnéng máfan nǐ……?",null,"BODY1817"],["Ví dụ: 不好意思，能不能麻烦你帮我看一下这封中文邮件有没有错？ (Xin lỗi, phiền bạn xem giúp email tiếng Trung này có sai không?)",null,null,"Bùhǎoyìsi, néng bùnéng máfan nǐ bāng wǒ kàn yīxià zhè fēng Zhōngwén yóujiàn yǒuméiyǒu cuò?",null,"BODY1818"],["Ví dụ: 不好意思，能不能麻烦你下午帮我接一下客户的电话？ (Xin lỗi, chiều nay phiền bạn nghe điện thoại khách giúp được không?)",null,null,"Bùhǎoyìsi, néng bùnéng máfan nǐ xiàwǔ bāng wǒ jiē yīxià kèhù de diànhuà?",null,"BODY1819"],["4. 我很想……，可是…… (Tôi rất muốn …, nhưng …)",null,null,"Wǒ hěn xiǎng……, kěshì……",null,"BODY1820"],["Ví dụ: 我很想参加你的生日聚会，可是那天我要出差。 (Tôi rất muốn dự tiệc sinh nhật bạn, nhưng hôm đó tôi đi công tác.)",null,null,"Wǒ hěn xiǎng cānjiā nǐ de shēngrì jùhuì, kěshì nàtiān wǒ yào chūchāi.",null,"BODY1821"],["Ví dụ: 我很想帮你，可是这个权限只有经理有。 (Tôi rất muốn giúp, nhưng quyền này chỉ giám đốc có.)",null,null,"Wǒ hěn xiǎng bāng nǐ, kěshì zhège quánxiàn zhǐyǒu jīnglǐ yǒu.",null,"BODY1822"],["5. 谢谢你想到我，不过…… (Cảm ơn bạn đã nghĩ đến tôi, nhưng …)",null,null,"Xièxie nǐ xiǎngdào wǒ, bùguò……",null,"BODY1823"],["Ví dụ: 谢谢你想到我，不过我最近手上的项目太多了，恐怕做不好。 (Cảm ơn đã nghĩ đến tôi, nhưng dạo này tôi nhiều dự án quá, e làm không tốt.)",null,null,"Xièxie nǐ xiǎngdào wǒ, bùguò wǒ zuìjìn shǒushàng de xiàngmù tài duō le, kǒngpà zuò bùhǎo.",null,"BODY1824"],["Ví dụ: 谢谢你想到我，不过这个周末我已经有安排了。 (Cảm ơn đã nghĩ đến tôi, nhưng cuối tuần này tôi có kế hoạch rồi.)",null,null,"Xièxie nǐ xiǎngdào wǒ, bùguò zhège zhōumò wǒ yǐjīng yǒu ānpái le.",null,"BODY1825"],["6. 我想请……天假，因为…… (Tôi muốn xin nghỉ … ngày, vì …)",null,null,"Wǒ xiǎng qǐng…… tiān jià, yīnwèi……",null,"BODY1826"],["Ví dụ: 我想请三天假，因为下周我妹妹结婚，我要回老家帮忙。 (Tôi muốn xin nghỉ 3 ngày vì tuần sau em gái cưới, phải về quê giúp.)",null,null,"Wǒ xiǎng qǐng sāntiān jià, yīnwèi xiàzhōu wǒ mèimei jiéhūn, wǒ yào huílǎojiā bāngmáng.",null,"BODY1827"],["Ví dụ: 我想请半天假，因为明天上午要去办护照。 (Tôi muốn xin nghỉ nửa ngày vì sáng mai phải đi làm hộ chiếu.)",null,null,"Wǒ xiǎng qǐng bàntiān jià, yīnwèi míngtiān shàngwǔ yào qù bàn hùzhào.",null,"BODY1828"],["7. 你看能不能…… (Anh/chị xem có thể … không)",null,null,"Nǐ kàn néng bùnéng……",null,"BODY1829"],["Ví dụ: 你看能不能把截止日期推到下周一？ (Anh xem có thể lùi hạn chót đến thứ 2 tuần sau không?)",null,null,"Nǐ kàn néng bùnéng bǎ jiézhǐ rìqī tuī dào xiàzhōuyī?",null,"BODY1830"],["Ví dụ: 你看能不能先付一半，剩下的下个月再付？ (Anh xem có thể trả trước một nửa, còn lại tháng sau trả không?)",null,null,"Nǐ kàn néng bùnéng xiānfù yībàn, shèngxià de xiàgèyuè zài fù?",null,"BODY1831"],["8. 我建议你……，这样…… (Tôi khuyên bạn …, như vậy …)",null,null,"Wǒ jiànyì nǐ……, zhèyàng……",null,"BODY1832"],["Ví dụ: 我建议你先跟客户确认数量，这样就不会做错报价了。 (Tôi khuyên bạn xác nhận số lượng với khách trước, như vậy không làm sai báo giá.)",null,null,"Wǒ jiànyì nǐ xiān gēn kèhù quèrèn shùliàng, zhèyàng jiù bùhuì zuò cuò bàojià le.",null,"BODY1833"],["Ví dụ: 我建议你每天学半个小时，这样比周末学三个小时效果好。 (Tôi khuyên bạn mỗi ngày học nửa tiếng, như vậy hiệu quả hơn cuối tuần học 3 tiếng.)",null,null,"Wǒ jiànyì nǐ měitiān xué bàngè xiǎoshí, zhèyàng bǐ zhōumò xué sāngè xiǎoshí xiàoguǒ hǎo.",null,"BODY1834"],["9. 如果我是你，我会…… (Nếu tôi là bạn, tôi sẽ …)",null,null,"Rúguǒ wǒ shì nǐ, wǒhuì……",null,"BODY1835"],["Ví dụ: 如果我是你，我会先跟经理说清楚，不要自己扛着。 (Nếu là bạn, tôi sẽ nói rõ với giám đốc trước, đừng tự ôm.)",null,null,"Rúguǒ wǒ shì nǐ, wǒhuì xiān gēn jīnglǐ shuō qīngchu, bùyào zìjǐ kángzhe.",null,"BODY1836"],["Ví dụ: 如果我是你，我会接受这个机会，年轻的时候多试试。 (Nếu là bạn, tôi sẽ nhận cơ hội này, lúc trẻ nên thử nhiều.)",null,null,"Rúguǒ wǒ shì nǐ, wǒhuì jiēshòu zhège jīhuì, niánqīng de shíhou duōshìshi.",null,"BODY1837"],["10. (HSK5) 不是我不想……，而是…… (Không phải tôi không muốn …, mà là …)",null,null,"Bùshì wǒ bùxiǎng……, érshì……",null,"BODY1838"],["Ví dụ: 不是我不想帮你，而是公司规定不能把客户资料给外人。 (Không phải tôi không muốn giúp, mà là công ty quy định không được đưa thông tin khách cho người ngoài.)",null,null,"Bùshì wǒ bùxiǎng bāng nǐ, érshì gōngsī guīdìng bùnéng bǎ kèhùzīliào gěi wàirén.",null,"BODY1839"],["Ví dụ: 不是我不想加班，而是这个任务一个人三天根本做不完。 (Không phải tôi không muốn tăng ca, mà là việc này một người 3 ngày không thể làm xong.)",null,null,"Bùshì wǒ bùxiǎng jiābān, érshì zhège rènwù yīgè rén sāntiān gēnběn zuò bù wán.",null,"BODY1840"],["11. (HSK5) 与其……，不如我们…… (Thay vì …, chi bằng chúng ta …)",null,null,"Yǔqí……, bùrú wǒmen……",null,"BODY1841"],["Ví dụ: 与其勉强答应以后做不好，不如我们现在就把时间调整一下。 (Thay vì miễn cưỡng nhận rồi làm không tốt, chi bằng giờ điều chỉnh thời gian luôn.)",null,null,"Yǔqí miǎnqiǎng dāying yǐhòu zuò bùhǎo, bùrú wǒmen xiànzài jiù bǎ shíjiān tiáozhěng yīxià.",null,"BODY1842"],["Ví dụ: 与其每个人各做各的，不如我们分工合作。 (Thay vì mỗi người làm một kiểu, chi bằng phân công hợp tác.)",null,null,"Yǔqí měigè rén gè zuò gè de, bùrú wǒmen fēngōnghézuò.",null,"BODY1843"],["情景对话 1 — Nhờ đồng nghiệp giúp một việc",null,null,"Qíngjǐng duìhuà",null,"BODY1844-C"],["小阮: 阿玲，不好意思，打扰一下，你现在忙吗？ (A Linh, xin lỗi làm phiền, giờ bạn bận không?)",null,null,"Xiǎo Ruǎn: Ā Líng, bùhǎoyìsi, dǎrǎo yīxià, nǐ xiànzài máng ma?",null,"BODY1845"],["阿玲: 还好，怎么了？ (Cũng được, sao vậy?)",null,null,"Ā Líng: háihǎo, zěnme le?",null,"BODY1846"],["小阮: 能不能麻烦你帮我个忙？下午三点王总要来公司，可是我临时要去海关处理一个问题。 (Phiền bạn giúp mình một việc được không? 3h chiều Vương tổng đến công ty, mà mình đột xuất phải ra hải quan xử lý một vấn đề.)",null,null,"Xiǎo Ruǎn: néng bùnéng máfan nǐ bāng wǒ gè máng? Xiàwǔ sāndiǎn Wáng zǒng yào lái gōngsī, kěshì wǒ línshí yào qù hǎiguān chǔlǐ yīgè wèntí.",null,"BODY1847"],["阿玲: 你想让我帮你接待王总？ (Bạn muốn mình tiếp Vương tổng giúp à?)",null,null,"Ā Líng: nǐ xiǎng ràng wǒ bāng nǐ jiēdài Wáng zǒng?",null,"BODY1848"],["小阮: 对，就是带他参观一下展厅，然后把这份样品资料交给他。 (Đúng, dẫn anh ấy tham quan phòng trưng bày rồi đưa tài liệu hàng mẫu này cho anh ấy.)",null,null,"Xiǎo Ruǎn: duì, jiùshì dài tā cānguān yīxià zhǎntīng, ránhòu bǎ zhèfèn yàngpǐn zīliào jiāogěi tā.",null,"BODY1849"],["阿玲: 我对你们的产品不太熟悉，万一他问技术问题怎么办？ (Mình không rành sản phẩm bên bạn, lỡ anh ấy hỏi kỹ thuật thì sao?)",null,null,"Ā Líng: wǒ duì nǐmen de chǎnpǐn bùtàishúxi, wànyī tā wèn jìshù wèntí zěnmebàn?",null,"BODY1850"],["小阮: 你别担心，技术问题你就说我回来以后给他打电话详细介绍。 (Đừng lo, câu hỏi kỹ thuật bạn cứ nói mình về sẽ gọi điện giới thiệu chi tiết.)",null,null,"Xiǎo Ruǎn: nǐ bié dānxīn, jìshù wèntí nǐ jiù shuō wǒ huílái yǐhòu gěi tā dǎdiànhuà xiángxì jièshào.",null,"BODY1851"],["阿玲: 好吧，那你先把主要的产品给我介绍一下。 (Thôi được, vậy bạn giới thiệu sơ cho mình sản phẩm chính.)",null,null,"Ā Líng: hǎo ba, nà nǐ xiān bǎ zhǔyào de chǎnpǐn gěi wǒ jièshào yīxià.",null,"BODY1852"],["小阮: 没问题，十分钟就够了。这三款是最新的，价格表在资料第二页。 (Không vấn đề, 10 phút là đủ. Ba mẫu này mới nhất, bảng giá ở trang 2 tài liệu.)",null,null,"Xiǎo Ruǎn: méi wèntí, shífēnzhōng jiù gòu le. Zhè sānkuǎn shì zuìxīn de, jiàgébiǎo zài zīliào dì'èryè.",null,"BODY1853"],["阿玲: 王总喝茶还是咖啡？ (Vương tổng uống trà hay cà phê?)",null,null,"Ā Líng: Wáng zǒng hēchá háishì kāfēi?",null,"BODY1854"],["小阮: 他喜欢喝绿茶，不加糖。真是太感谢你了！ (Anh ấy thích trà xanh, không đường. Cảm ơn bạn nhiều lắm!)",null,null,"Xiǎo Ruǎn: tā xǐhuan hē lǜchá, bù jiātáng. Zhēnshìtài gǎnxiè nǐ le!",null,"BODY1855"],["阿玲: 不客气，我们是同事嘛。 (Không có gì, đồng nghiệp mà.)",null,null,"Ā Líng: bù kèqi, wǒmen shì tóngshì ma.",null,"BODY1856"],["小阮: 这次你帮了我，我欠你一个人情。明天请你喝奶茶！ (Lần này bạn giúp mình, mình nợ bạn một lần. Mai mời bạn trà sữa!)",null,null,"Xiǎo Ruǎn: zhècì nǐ bāng le wǒ, wǒ qiàn nǐ yīgè rénqíng. Míngtiān qǐng nǐ hē nǎichá!",null,"BODY1857"],["阿玲: 哈哈，那我要大杯的！ (Haha, vậy mình lấy ly lớn!)",null,null,"Ā Líng: hāhā, nà wǒ yào dà bēi de!",null,"BODY1858"],["情景对话 2 — Xin sếp nghỉ phép",null,null,"Qíngjǐng duìhuà",null,"BODY1859-C"],["小林: 经理，您现在方便吗？我想跟您说件事。 (Giám đốc, giờ anh có tiện không? Em muốn nói với anh một việc.)",null,null,"Xiǎo Lín: jīnglǐ, nín xiànzài fāngbiàn ma? Wǒ xiǎng gēn nín shuō jiàn shì.",null,"BODY1860"],["经理: 你说。 (Bạn nói đi.)",null,null,"Jīnglǐ: nǐ shuō.",null,"BODY1861"],["小林: 我想请三天假，下周三到周五。 (Em muốn xin nghỉ 3 ngày, thứ 4 đến thứ 6 tuần sau.)",null,null,"Xiǎo Lín: wǒ xiǎng qǐng sāntiān jià, xià zhōusān dào zhōuwǔ.",null,"BODY1862"],["经理: 什么原因？ (Lý do gì?)",null,null,"Jīnglǐ: shénme yuányīn?",null,"BODY1863"],["小林: 我妹妹下周六结婚，按照我们老家的习惯，婚礼前几天家里要准备很多事情，我得回去帮忙。 (Thứ 7 tuần sau em gái em cưới, theo phong tục quê em, mấy ngày trước đám cưới nhà phải chuẩn bị nhiều việc, em phải về giúp.)",null,null,"Xiǎo Lín: wǒ mèimei xià zhōuliù jiéhūn, ànzhào wǒmen lǎojiā de xíguàn, hūnlǐ qián jǐtiān jiālǐ yào zhǔnbèi hěnduō shìqing, wǒ děi huíqù bāngmáng.",null,"BODY1864"],["经理: 恭喜恭喜！不过下周三有个客户会议，你能参加吗？ (Chúc mừng chúc mừng! Nhưng thứ 4 tuần sau có họp với khách, bạn dự được không?)",null,null,"Jīnglǐ: gōngxǐ gōngxǐ! Bùguò xià zhōusān yǒu gè kèhù huìyì, nǐ néng cānjiā ma?",null,"BODY1865"],["小林: 会议是上午十点吧？要不我周三下午再走，请两天半假？ (Họp lúc 10h sáng nhỉ? Hay chiều thứ 4 em mới đi, xin nghỉ 2 ngày rưỡi?)",null,null,"Xiǎo Lín: huìyì shì shàngwǔ shídiǎn ba? Yào bù wǒ zhōusān xiàwǔ zài zǒu, qǐng liǎngtiān bàn jià?",null,"BODY1866"],["经理: 这样最好。你手上的工作谁来跟进？ (Vậy tốt nhất. Việc trong tay bạn ai theo dõi?)",null,null,"Jīnglǐ: zhèyàng zuìhǎo. Nǐ shǒushàng de gōngzuò shuí lái gēnjìn?",null,"BODY1867"],["小林: 我已经跟小芳说好了，她帮我跟进王总的订单。其他的工作我会在走之前全部安排好。 (Em đã nói với Tiểu Phương, cô ấy theo dõi đơn Vương tổng giúp. Các việc khác em sẽ sắp xếp xong trước khi đi.)",null,null,"Xiǎo Lín: wǒ yǐjīng gēn Xiǎo Fāng shuōhǎo le, tā bāng wǒ gēnjìn Wáng zǒng de dìngdān. Qítā de gōngzuò wǒhuì zài zǒu zhīqián quánbù ānpái hǎo.",null,"BODY1868"],["经理: 好，那你在系统里提交一下请假申请，我来批。 (Được, bạn gửi đơn xin nghỉ trên hệ thống, tôi duyệt.)",null,null,"Jīnglǐ: hǎo, nà nǐ zài xìtǒng lǐ tíjiāo yīxià qǐngjià shēnqǐng, wǒ lái pī.",null,"BODY1869"],["小林: 谢谢经理！请假期间如果有急事，您可以随时给我打电话。 (Cảm ơn giám đốc! Trong thời gian nghỉ có việc gấp anh cứ gọi em.)",null,null,"Xiǎo Lín: xièxie jīnglǐ! Qǐngjià qījiān rúguǒ yǒu jíshì, nín kěyǐ suíshí gěi wǒ dǎdiànhuà.",null,"BODY1870"],["经理: 好的。代我祝你妹妹新婚快乐！ (Được. Cho tôi gửi lời chúc em gái bạn hạnh phúc!)",null,null,"Jīnglǐ: hǎo de. Dài wǒ zhù nǐ mèimei xīnhūn kuàilè!",null,"BODY1871"],["小林: 谢谢！回来给大家带喜糖！ (Cảm ơn anh! Về em mang kẹo cưới cho mọi người!)",null,null,"Xiǎo Lín: xièxie! Huílái gěi dàjiā dài xǐtáng!",null,"BODY1872"],["情景对话 3 — Từ chối lời mời của bạn bè / đồng nghiệp",null,null,"Qíngjǐng duìhuà",null,"BODY1873-C"],["同事: 小海，这个周六晚上我们部门聚餐，然后去唱K，你一起来吧！ (Tiểu Hải, tối thứ 7 này phòng mình liên hoan rồi đi hát, bạn đi cùng nhé!)",null,null,"Tóngshì: Xiǎo Hǎi, zhège zhōuliù wǎnshàng wǒmen bùmén jùcān, ránhòu qù chàng K, nǐ yī qǐlái ba!",null,"BODY1874"],["小海: 谢谢你想到我，不过这个周六恐怕不太方便。 (Cảm ơn bạn đã nghĩ đến mình, nhưng thứ 7 này e không tiện lắm.)",null,null,"Xiǎo Hǎi: xièxie nǐ xiǎngdào wǒ, bùguò zhège zhōuliù kǒngpà bù tài fāngbiàn.",null,"BODY1875"],["同事: 怎么了？有什么安排吗？ (Sao vậy? Có kế hoạch gì à?)",null,null,"Tóngshì: zěnme le? Yǒu shénme ānpái ma?",null,"BODY1876"],["小海: 我早就答应带孩子回外婆家了，好几个星期没去了。 (Mình hứa từ lâu đưa con về nhà bà ngoại, mấy tuần rồi chưa về.)",null,null,"Xiǎo Hǎi: wǒ zǎojiù dāying dài háizi huí wàipójiā le, hǎojǐgè xīngqī méi qù le.",null,"BODY1877"],["同事: 那太可惜了！大家都很想你去。 (Tiếc quá! Mọi người đều muốn bạn đi.)",null,null,"Tóngshì: nà tài kěxī le! Dàjiā dōu hěn xiǎng nǐ qù.",null,"BODY1878"],["小海: 我也很想去，可是答应孩子的事不能不算数。 (Mình cũng rất muốn, nhưng đã hứa với con thì không thể nuốt lời.)",null,null,"Xiǎo Hǎi: wǒ yě hěn xiǎng qù, kěshì dāying háizi de shì bùnéngbù suànshù.",null,"BODY1879"],["同事: 理解理解。那吃完饭唱K的时候你能来吗？ (Hiểu mà. Vậy ăn xong đi hát bạn đến được không?)",null,null,"Tóngshì: lǐjiě lǐjiě. Nà chīwánfàn chàng K de shíhou nǐ néng lái ma?",null,"BODY1880"],["小海: 外婆家在北宁，回来就很晚了，可能来不了。 (Nhà bà ngoại ở Bắc Ninh, về đến nơi muộn rồi, chắc không đến được.)",null,null,"Xiǎo Hǎi: wàipójiā zài Běiníng, huílái jiù hěn wǎn le, kěnéng lái bùliǎo.",null,"BODY1881"],["同事: 好吧，那下次吧。 (Thôi được, lần sau vậy.)",null,null,"Tóngshì: hǎo ba, nà xiàcì ba.",null,"BODY1882"],["小海: 一定！要不下周五中午我请大家喝咖啡，算是补偿。 (Nhất định! Hay trưa thứ 6 tuần sau mình mời mọi người cà phê, coi như bù.)",null,null,"Xiǎo Hǎi: yīdìng! Yào bùxià zhōuwǔ zhōngwǔ wǒ qǐng dàjiā hēkāfēi, suànshì bǔcháng.",null,"BODY1883"],["同事: 好啊，我跟大家说一声。 (Được đấy, mình báo mọi người.)",null,null,"Tóngshì: hǎo a, wǒ gēn dàjiā shuō yīshēng.",null,"BODY1884"],["小海: 谢谢！祝你们周六玩得开心，多拍点照片发群里！ (Cảm ơn! Chúc mọi người thứ 7 vui vẻ, chụp nhiều ảnh gửi nhóm nhé!)",null,null,"Xiǎo Hǎi: xièxie! Zhùnǐmen zhōuliù wán de kāixīn, duō pāidiǎn zhàopiàn fā qún lǐ!",null,"BODY1885"],["情景对话 4 — Từ chối khách hàng đòi giảm giá thêm / giao gấp",null,null,"Qíngjǐng duìhuà",null,"BODY1886-C"],["客户: 小李，这批货能不能再便宜百分之五？我们老板觉得价格还是有点高。 (Tiểu Lý, lô hàng này rẻ thêm 5% được không? Sếp tôi thấy giá vẫn hơi cao.)",null,null,"Kèhù: Xiǎo Lǐ, zhè pīhuò néng bùnéng zài piányi bǎifēnzhīwǔ? Wǒmen lǎobǎn juéde jiàgé háishì yǒudiǎn gāo.",null,"BODY1887"],["销售: 张经理，我很理解您的压力，不过这个价格已经是我们给老客户的最低价了。 (Giám đốc Trương, tôi rất hiểu áp lực của anh, nhưng giá này đã là giá thấp nhất cho khách quen rồi.)",null,null,"Xiāoshòu: Zhāng jīnglǐ, wǒ hěn lǐjiě nín de yālì, bùguò zhège jiàgé yǐjīng shì wǒmen gěi lǎokèhù de zuìdījià le.",null,"BODY1888"],["客户: 你再跟你们老板申请一下嘛。 (Bạn xin sếp bạn thêm đi.)",null,null,"Kèhù: nǐ zài gēn nǐmen lǎobǎn shēnqǐng yīxià ma.",null,"BODY1889"],["销售: 不是我不想帮您申请，而是最近原材料涨了百分之八，我们的利润已经很低了。 (Không phải tôi không muốn xin giúp anh, mà là gần đây nguyên liệu tăng 8%, lợi nhuận bên tôi đã rất thấp.)",null,null,"Xiāoshòu: bùshì wǒ bùxiǎng bāng nín shēnqǐng, érshì zuìjìn yuáncáiliào zhǎngle bǎifēnzhībā, wǒmen de lìrùn yǐjīng hěn dī le.",null,"BODY1890"],["客户: 那你们有什么别的办法吗？ (Vậy bên bạn có cách nào khác không?)",null,null,"Kèhù: nà nǐmen yǒu shénme biéde bànfǎ ma?",null,"BODY1891"],["销售: 要不这样：价格不变，但是我们免费帮您把货送到海防港，可以帮您省三百万盾的运费。 (Hay thế này: giá giữ nguyên, nhưng bên tôi giao miễn phí đến cảng Hải Phòng, giúp anh tiết kiệm 3 triệu phí vận chuyển.)",null,null,"Xiāoshòu: yào bù zhèyàng: jiàgé bùbiàn, dànshì wǒmen miǎnfèi bāng nín bǎ huò sòngdào Hǎifánggǎng, kěyǐ bāng nín shěng sānbǎiwàn dùn de yùnfèi.",null,"BODY1892"],["客户: 嗯，这个可以考虑。另外，交货期能不能从二十天缩短到十天？ (Ừm, cái này có thể cân nhắc. Ngoài ra, thời gian giao rút từ 20 ngày xuống 10 ngày được không?)",null,null,"Kèhù: ń, zhège kěyǐ kǎolǜ. Lìngwài, jiāohuòqī néng bùnéng cóng èrshítiān suōduǎn dào shítiān?",null,"BODY1893"],["销售: 十天恐怕来不及，我们的生产线已经排满了。我尽量安排十五天，您看可以吗？ (10 ngày e không kịp, chuyền sản xuất bên tôi kín lịch rồi. Tôi cố gắng sắp xếp 15 ngày, anh thấy được không?)",null,null,"Xiāoshòu: shítiān kǒngpà láibùjí, wǒmen de shēngchǎnxiàn yǐjīng páimǎn le. Wǒ jǐnliàng ānpái shíwǔtiān, nín kàn kěyǐ ma?",null,"BODY1894"],["客户: 十五天也行，但是不能再晚了。 (15 ngày cũng được, nhưng không được muộn hơn.)",null,null,"Kèhù: shíwǔtiān yě xíng, dànshì bùnéng zài wǎn le.",null,"BODY1895"],["销售: 没问题，我会每周给您发一次生产进度。 (Không vấn đề, tôi sẽ gửi tiến độ sản xuất cho anh mỗi tuần.)",null,null,"Xiāoshòu: méi wèntí, wǒhuì měizhōu gěi nín fā yīcì shēngchǎn jìndù.",null,"BODY1896"],["客户: 好，那就这样吧，你把新的报价单发给我。 (Được, vậy thế nhé, bạn gửi báo giá mới cho tôi.)",null,null,"Kèhù: hǎo, nà jiù zhèyàng ba, nǐ bǎ xīn de bàojiàdān fāgěi wǒ.",null,"BODY1897"],["销售: 好的，我下午就发。谢谢张经理的理解！ (Vâng, chiều nay tôi gửi. Cảm ơn giám đốc Trương đã thông cảm!)",null,null,"Xiāoshòu: hǎo de, wǒ xiàwǔ jiù fā. Xièxie Zhāng jīnglǐ de lǐjiě!",null,"BODY1898"],["情景对话 5 — Đưa lời khuyên cho đồng nghiệp mới",null,null,"Qíngjǐng duìhuà",null,"BODY1899-C"],["新同事: 阿明哥，我来公司一个月了，觉得压力好大，什么都不会。 (Anh Minh, em vào công ty một tháng rồi, thấy áp lực quá, cái gì cũng không biết.)",null,null,"Xīn tóngshì: Ā Mínggē, wǒ lái gōngsī yīgèyuè le, juéde yālì hǎo dà, shénme dōu bùhuì.",null,"BODY1900"],["阿明: 刚开始都是这样的，我刚来的时候也一样。 (Mới đầu ai cũng vậy, hồi anh mới đến cũng thế.)",null,null,"Ā Míng: gāng kāishǐ dōu shì zhèyàng de, wǒ gāng lái de shíhou yě yīyàng.",null,"BODY1901"],["新同事: 每次开会，中国同事说得太快，我都听不懂，也不敢问。 (Lần nào họp, đồng nghiệp TQ nói nhanh quá, em nghe không hiểu, cũng không dám hỏi.)",null,null,"Xīn tóngshì: měicì kāihuì, Zhōngguó tóngshì shuō de tài kuài, wǒ dōu tīngbùdǒng, yě bùgǎn wèn.",null,"BODY1902"],["阿明: 我建议你开会前先看一下议程，把可能用到的词提前查好，这样就容易听懂了。 (Anh khuyên em trước khi họp xem chương trình, tra trước các từ có thể dùng, như vậy dễ nghe hơn.)",null,null,"Ā Míng: wǒ jiànyì nǐ kāihuì qián xiān kàn yīxià yìchéng, bǎ kěnéng yòngdào de cí tíqián chá hǎo, zhèyàng jiù róngyì tīngdǒng le.",null,"BODY1903"],["新同事: 那听不懂的时候怎么办？ (Vậy lúc nghe không hiểu thì làm sao?)",null,null,"Xīn tóngshì: nà tīngbùdǒng de shíhou zěnmebàn?",null,"BODY1904"],["阿明: 不要怕问。你可以说\"不好意思，能再说一遍吗？\"或者会后私下问。没有人会笑你的。 (Đừng sợ hỏi. Em có thể nói \"Xin lỗi, nói lại được không?\" hoặc họp xong hỏi riêng. Không ai cười em đâu.)",null,null,"Ā Míng: bùyào pà wèn. Nǐ kěyǐ shuō \"bùhǎoyìsi, néng zàishuō yībiàn ma?\" Huòzhě huìhòu sīxià wèn. Méiyǒu rén huì xiào nǐ de.",null,"BODY1905"],["新同事: 还有，经理每天都给我很多工作，我做不完，又不敢拒绝。 (Còn nữa, giám đốc ngày nào cũng giao em nhiều việc, em làm không xuể mà không dám từ chối.)",null,null,"Xīn tóngshì: háiyǒu, jīnglǐ měitiān dōu gěi wǒ hěnduō gōngzuò, wǒ zuò bù wán, yòu bùgǎn jùjué.",null,"BODY1906"],["阿明: 如果我是你，我会把手上的工作列一个表，拿给经理看，请他告诉你哪个最重要。 (Nếu là em, anh sẽ liệt kê các việc trong tay, đưa giám đốc xem, nhờ anh ấy nói việc nào quan trọng nhất.)",null,null,"Ā Míng: rúguǒ wǒ shì nǐ, wǒhuì bǎ shǒushàng de gōngzuò liè yīgè biǎo, nágěi jīnglǐ kàn, qǐng tā gàosu nǐ nǎge zuì zhòngyào.",null,"BODY1907"],["新同事: 这样经理不会觉得我能力不够吗？ (Như vậy giám đốc có nghĩ em năng lực kém không?)",null,null,"Xīn tóngshì: zhèyàng jīnglǐ bùhuì juéde wǒ nénglì bùgòu ma?",null,"BODY1908"],["阿明: 不会，反而会觉得你做事有条理。与其最后什么都做不好，不如一开始就说清楚。 (Không, ngược lại còn thấy em làm việc có hệ thống. Thay vì cuối cùng chẳng làm tốt việc gì, chi bằng nói rõ ngay từ đầu.)",null,null,"Ā Míng: bùhuì, fǎn'ér huì juéde nǐ zuòshì yǒutiáolǐ. Yǔqí zuìhòu shénme dōu zuò bùhǎo, bùrú yī kāishǐ jiù shuō qīngchu.",null,"BODY1909"],["新同事: 谢谢阿明哥，我心里轻松多了。 (Cảm ơn anh Minh, em nhẹ lòng hơn nhiều.)",null,null,"Xīn tóngshì: xièxie Ā Mínggē, wǒ xīnlǐ qīngsōng duō le.",null,"BODY1910"],["阿明: 不客气，有什么我帮得上忙的，尽管说。 (Không có gì, có gì anh giúp được cứ nói.)",null,null,"Ā Míng: bù kèqi, yǒu shénme wǒ bāng de shàng máng de, jǐnguǎn shuō.",null,"BODY1911"],["情景对话 6 — (HSK5) Từ chối yêu cầu vô lý của người quen / đối tác",null,null,"Qíngjǐng duìhuà",null,"BODY1912-C"],["朋友: 阿海，你在海关有认识的人吧？我有一批货被扣了，你帮我找人说说，让他们快点放行。 (A Hải, bạn có quen người ở hải quan nhỉ? Mình có lô hàng bị giữ, bạn nhờ người nói giúp cho họ thông quan nhanh.)",null,null,"Péngyou: Ā Hǎi, nǐ zài hǎiguān yǒu rènshi de rén ba? Wǒ yǒu yīpī huò bèikòu le, nǐ bāng wǒ zhǎo rén shuōshuo, ràng tāmen kuàidiǎn fàngxíng.",null,"BODY1913"],["阿海: 你的货为什么被扣了？ (Hàng bạn sao lại bị giữ?)",null,null,"Ā Hǎi: nǐ de huò wèishénme bèikòu le?",null,"BODY1914"],["朋友: 报关资料有点问题，申报的数量跟实际的不一样。 (Hồ sơ khai báo có chút vấn đề, số lượng khai không khớp thực tế.)",null,null,"Péngyou: bàoguān zīliào yǒudiǎn wèntí, shēnbào de shùliàng gēn shíjì de bù yīyàng.",null,"BODY1915"],["阿海: 不是我不想帮你，而是这种事我真的不能找人。如果被查出来，我们两个人都会有麻烦。 (Không phải mình không muốn giúp, mà là chuyện này thật sự mình không thể nhờ người. Nếu bị phát hiện, cả hai đều gặp rắc rối.)",null,null,"Ā Hǎi: bùshì wǒ bùxiǎng bāng nǐ, érshì zhèzhǒng shì wǒ zhēnde bùnéng zhǎo rén. Rúguǒ bèi cháchūlái, wǒmen liǎnggè rén dōu huì yǒu máfan.",null,"BODY1916"],["朋友: 就打个招呼而已，没那么严重吧？ (Chỉ chào hỏi một câu thôi, đâu nghiêm trọng vậy?)",null,null,"Péngyou: jiù dǎgèzhāohu éryǐ, méi nàme yánzhòng ba?",null,"BODY1917"],["阿海: 我理解你着急，可是海关的事一定要按规定办。我们公司也有明确规定，员工不能这样做。 (Mình hiểu bạn sốt ruột, nhưng việc hải quan phải làm theo quy định. Công ty mình cũng quy định rõ nhân viên không được làm vậy.)",null,null,"Ā Hǎi: wǒ lǐjiě nǐ zháojí, kěshì hǎiguān de shì yīdìng yào ànguīdìng bàn. Wǒmen gōngsī yě yǒu míngquèguīdìng, yuángōng bùnéng zhèyàng zuò.",null,"BODY1918"],["朋友: 那我现在怎么办？客户天天催我。 (Vậy giờ mình làm sao? Khách ngày nào cũng giục.)",null,null,"Péngyou: nà wǒ xiànzài zěnmebàn? Kèhù tiāntiān cuī wǒ.",null,"BODY1919"],["阿海: 我可以给你另外一个建议：我认识一个很专业的报关公司，他们可以帮你重新整理资料，补交说明，这样最快。 (Mình có thể gợi ý cách khác: mình quen một công ty khai báo hải quan rất chuyên nghiệp, họ giúp bạn sắp xếp lại hồ sơ, nộp bổ sung giải trình, như vậy nhanh nhất.)",null,null,"Ā Hǎi: wǒ kěyǐ gěi nǐ lìngwài yīgè jiànyì: wǒ rènshi yīgè hěn zhuānyè de bàoguān gōngsī, tāmen kěyǐ bāng nǐ chóngxīnzhěnglǐ zīliào, bǔjiāo shuōmíng, zhèyàng zuìkuài.",null,"BODY1920"],["朋友: 要多长时间？ (Mất bao lâu?)",null,null,"Péngyou: yào duōchángshíjiān?",null,"BODY1921"],["阿海: 资料齐全的话，一般三到五个工作日。我把他们经理的电话发给你，你就说是我介绍的。 (Đủ hồ sơ thì thường 3–5 ngày làm việc. Mình gửi số giám đốc bên đó, bạn cứ nói mình giới thiệu.)",null,null,"Ā Hǎi: zīliàoqíquán dehuà, yībān sān dào wǔgè gōngzuòrì. Wǒ bǎ tāmen jīnglǐ de diànhuà fāgěinǐ, nǐ jiù shuō shì wǒ jièshào de.",null,"BODY1922"],["朋友: 好吧……其实我也知道这样不太好，就是太着急了。 (Thôi được… thật ra mình cũng biết làm vậy không hay, chỉ là sốt ruột quá.)",null,null,"Péngyou: hǎo ba…… qíshí wǒ yě zhīdao zhèyàng bùtàihǎo, jiùshì tài zháojí le.",null,"BODY1923"],["阿海: 我明白。下次报关之前，你可以先把资料发给我看看，我帮你检查一下。 (Mình hiểu. Lần sau trước khi khai báo, bạn gửi hồ sơ mình xem, mình kiểm tra giúp.)",null,null,"Ā Hǎi: wǒ míngbai. Xiàcì bàoguān zhīqián, nǐ kěyǐ xiān bǎ zīliào fāgěi wǒ kànkan, wǒ bāng nǐ jiǎncháyīxià.",null,"BODY1924"],["朋友: 谢谢你，还是你考虑得周到。 (Cảm ơn bạn, vẫn là bạn chu đáo.)",null,null,"Péngyou: xièxie nǐ, háishì nǐ kǎolǜ de zhōudào.",null,"BODY1925"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY1926-C"],["1. Hỏi: 你觉得拒绝别人难吗？为什么？ (Bạn thấy từ chối người khác có khó không? Vì sao?)",null,null,"Nǐ juéde jùjué biérén nán ma? Wèishénme?",null,"BODY1927"],["Đáp: 挺难的，因为我怕对方不高兴，影响关系。不过我现在学会了先说谢谢，再说原因，最后给一个别的办法。 (Khá khó vì sợ người ta không vui, ảnh hưởng quan hệ. Nhưng giờ tôi học được cách cảm ơn trước, nói lý do, cuối cùng đưa cách khác.)",null,null,"Tǐng nán de, yīnwèi wǒ pà duìfāng bù gāoxìng, yǐngxiǎng guānxi. Bùguò wǒ xiànzài xuéhuì le xiān shuō xièxie, zàishuō yuányīn, zuìhòu gěi yīgè biéde bànfǎ.",null,"BODY1928"],["2. Hỏi: 在越南和中国，拒绝别人的方式有什么不同？ (Ở VN và TQ, cách từ chối có gì khác?)",null,null,"Zài Yuènán hé Zhōngguó, jùjué biérén de fāngshì yǒu shénme bùtóng?",null,"BODY1929"],["Đáp: 我觉得都比较委婉。中国人常说\"我考虑一下\"、\"再研究研究\"，其实很多时候就是拒绝的意思。 (Tôi thấy đều khá vòng vo. Người TQ hay nói \"để tôi cân nhắc\", \"nghiên cứu thêm\", thật ra nhiều khi là từ chối.)",null,null,"Wǒ juéde dōu bǐjiào wěiwǎn. Zhōngguórén cháng shuō \"wǒ kǎolǜyīxià\", \"zài yánjiū yánjiū\", qíshí hěnduō shíhou jiùshì jùjué de yìsi.",null,"BODY1930"],["3. Hỏi: 朋友找你借钱，你会借吗？ (Bạn bè hỏi vay tiền, bạn có cho vay không?)",null,null,"Péngyou zhǎo nǐ jièqián, nǐ huì jiè ma?",null,"BODY1931"],["Đáp: 要看情况。如果是急事，比如看病，我会借；如果是买奢侈品，我会委婉地拒绝。 (Tùy trường hợp. Việc gấp như khám bệnh thì cho vay; mua đồ xa xỉ thì từ chối khéo.)",null,null,"Yào kàn qíngkuàng. Rúguǒ shì jíshì, bǐrú kànbìng, wǒhuì jiè; rúguǒ shì mǎi shēchǐpǐn, wǒhuì wěiwǎn de jùjué.",null,"BODY1932"],["4. Hỏi: (HSK5) 如果老板让你做一件违反公司规定的事，你会怎么办？ (Nếu sếp bảo bạn làm việc vi phạm quy định công ty, bạn làm sao?)",null,null,"Rúguǒ lǎobǎn ràng nǐ zuò yījiàn wéifǎn gōngsī guīdìng de shì, nǐ huì zěnmebàn?",null,"BODY1933"],["Đáp: 我会先确认我是不是理解错了。如果真的违反规定，我会礼貌地说明风险，并提出一个合规的替代方案。 (Xác nhận xem mình có hiểu sai không. Nếu thật sự vi phạm, tôi lịch sự nói rõ rủi ro và đưa ra phương án thay thế đúng quy định.)",null,null,"Wǒhuì xiān quèrèn wǒ shìbùshì lǐjiě cuò le. Rúguǒ zhēnde wéifǎnguīdìng, wǒhuì lǐmào de shuōmíng fēngxiǎn, bìng tíchū yīgè héguī de tìdài fāng'àn.",null,"BODY1934"],["情景模拟 ROLE-PLAY — Cấp trên giao việc không khả thi. Vòng 2 (bất ngờ): sếp ép \"không làm được thì tìm người khác\"",null,null,"Qíngjǐng mónǐ",null,"BODY1935-C"],["GV: 小阮，客户的投标书明天早上就要，你今天晚上加班做完吧。 (Tiểu Nguyễn, hồ sơ thầu của khách sáng mai cần, tối nay bạn tăng ca làm xong nhé.)",null,null,"Xiǎo Ruǎn, kèhù de tóubiāoshū míngtiān zǎoshang jiùyào, nǐ jīntiān wǎnshàng jiābān zuò wán ba.",null,"BODY1936"],["HS: 经理，投标书一共有五十多页，还要翻译成中文，我一个人一个晚上恐怕做不完。 (Giám đốc, hồ sơ thầu hơn 50 trang, còn phải dịch sang tiếng Trung, một mình em một tối e không xong.)",null,null,"Jīnglǐ, tóubiāoshū yīgòng yǒu wǔshíduō yè, háiyào fānyìchéng Zhōngwén, wǒ yīgè rén yīgè wǎnshàng kǒngpà zuò bù wán.",null,"BODY1937"],["GV: 你中文最好，只能你来做。 (Bạn giỏi tiếng Trung nhất, chỉ bạn làm được.)",null,null,"Nǐ Zhōngwén zuìhǎo, zhǐnéng nǐ lái zuò.",null,"BODY1938"],["HS: 我很想做好这个项目，可是如果赶着做，质量没办法保证，万一出错，影响更大。 (Em rất muốn làm tốt dự án này, nhưng nếu làm gấp, chất lượng không đảm bảo, lỡ sai thì ảnh hưởng còn lớn hơn.)",null,null,"Wǒ hěn xiǎng zuòhǎo zhège xiàngmù, kěshì rúguǒ gǎnzhe zuò, zhìliàng méi bànfǎ bǎozhèng, wànyī chūcuò, yǐngxiǎng gèng dà.",null,"BODY1939"],["GV: 那你说怎么办？ (Vậy bạn nói làm sao?)",null,null,"Nà nǐ shuō zěnmebàn?",null,"BODY1940"],["HS: 要不这样：技术部分请小林先写好越南语版本，我负责翻译最重要的报价和公司介绍部分。另外，您看能不能跟客户申请把时间推到明天下午？ (Hay thế này: phần kỹ thuật nhờ Tiểu Lâm viết bản tiếng Việt trước, em phụ trách dịch phần báo giá và giới thiệu công ty quan trọng nhất. Ngoài ra anh xem có thể xin khách lùi đến chiều mai không?)",null,null,"Yào bù zhèyàng: jìshù bùfen qǐng Xiǎo Lín xiān xiě hǎo Yuènányǔ bǎnběn, wǒ fùzé fānyì zuì zhòngyào de bàojià hé gōngsī jièshào bùfen. Lìngwài, nín kàn néng bùnéng gēn kèhù shēnqǐng bǎ shíjiān tuī dào míngtiān xiàwǔ?",null,"BODY1941"],["GV (biến cố): 客户不可能推迟。你做不了，我就找别人。 (Khách không thể lùi. Bạn không làm được thì tôi tìm người khác.)",null,null,"Kèhù bù kěnéng tuīchí. Nǐ zuòbùliǎo, wǒ jiù zhǎo biérén.",null,"BODY1942"],["HS: 我不是不愿意做，而是想把它做好。如果时间不能改，我今晚可以做到十二点，完成最关键的三十页；剩下的部分明天早上七点来公司继续做，九点之前交给您，您看可以吗？ (Em không phải không muốn làm, mà muốn làm cho tốt. Nếu không đổi được thời gian, tối nay em làm đến 12h, xong 30 trang quan trọng nhất; phần còn lại 7h sáng mai đến công ty làm tiếp, trước 9h gửi anh, anh thấy được không?)",null,null,"Wǒ bùshì bù yuànyì zuò, érshì xiǎng bǎ tā zuòhǎo. Rúguǒ shíjiān bùnéng gǎi, wǒ jīnwǎn kěyǐ zuòdào shí'èrdiǎn, wánchéng zuì guānjiàn de sānshí yè; shèngxià de bùfen míngtiān zǎoshang qīdiǎn lái gōngsī jìxù zuò, jiǔdiǎn zhīqián jiāogěi nín, nín kàn kěyǐ ma?",null,"BODY1943"],["GV: 好吧，那就这样。需要什么支持吗？ (Thôi được, vậy làm thế. Cần hỗ trợ gì không?)",null,null,"Hǎo ba, nà jiù zhèyàng. Xūyào shénme zhīchí ma?",null,"BODY1944"],["HS: 麻烦您跟小林说一下，让他今天下班前把技术资料发给我。谢谢经理！ (Phiền anh nói với Tiểu Lâm gửi tài liệu kỹ thuật cho em trước khi tan làm hôm nay. Cảm ơn giám đốc!)",null,null,"Máfan nín gēn Xiǎo Lín shuō yīxià, ràng tā jīntiān xiàbān qián bǎ jìshù zīliào fāgěi wǒ. Xièxie jīnglǐ!",null,"BODY1945"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY1946-C"],["✗ 我不能，我很忙。 (cộc, mất lòng) → ✓ 不好意思，我今天手上的事比较多，恐怕帮不了你。",null,null,"Wǒ bùnéng, wǒ hěn máng. | Bùhǎoyìsi, wǒ jīntiān shǒushàng de shì bǐjiào duō, kǒngpà bāngbùliǎo nǐ.",null,"BODY1947"],["✗ 你帮我！ (ra lệnh) → ✓ 能不能麻烦你帮我一下？",null,null,"Nǐ bāng wǒ! | Néng bùnéng máfan nǐ bāng wǒ yīxià?",null,"BODY1948"],["✗ 我想请假两天。 → ✓ 我想请两天假。 (Số lượng chen giữa 请 và 假.)",null,null,"Wǒ xiǎng qǐngjià liǎngtiān. | Wǒ xiǎng qǐng liǎngtiān jià. | Qǐng | Jià .",null,"BODY1949"],["✗ 我建议你应该…… → ✓ 我建议你…… (建议 và 应该 không cần dùng cùng nhau.)",null,null,"Wǒ jiànyì nǐ yīnggāi…… | Wǒ jiànyì nǐ…… | Jiànyì | Yīnggāi",null,"BODY1950"],["✗ 恐怕我可以。 → ✓ 恐怕我做不到 / 恐怕来不及。 (恐怕 dùng cho dự đoán không tốt.)",null,null,"Kǒngpà wǒ kěyǐ. | Kǒngpà wǒ zuò bùdào | Kǒngpà láibùjí. | Kǒngpà",null,"BODY1951"],["✗ 打扰你，我问一个问题。 → ✓ 不好意思，打扰一下，能问你一个问题吗？",null,null,"Dǎrǎo nǐ, wǒ wèn yīgè wèntí. | Bùhǎoyìsi, dǎrǎo yīxià, néng wèn nǐ yīgè wèntí ma?",null,"BODY1952"],["Lưu ý văn hóa: \"我考虑一下 / 再研究研究 / 回头再说\" trong giao tiếp TQ thường là lời từ chối khéo → đừng chờ đợi, hỏi lại cụ thể: 您大概什么时候能给我答复？",null,null,"Wǒ kǎolǜyīxià | Zài yánjiū yánjiū | Huítóu zàishuō | Nín dàgài shénme shíhou néng gěi wǒ dáfù?",null,"BODY1953"],["Phát âm: 恐怕 kǒngpà; 打扰 dǎrǎo; 尽量 jǐnliàng; 请假 qǐngjià.",null,null,"Kǒngpà | Dǎrǎo | Jǐnliàng | Qǐngjià",null,"BODY1954"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY1955-C"],["Ghi âm 3 cách từ chối cho 3 đối tượng khác nhau (bạn bè – đồng nghiệp – cấp trên/khách hàng), mỗi lần 40–60 giây, theo công thức 3 bước: cảm ơn → lý do → phương án thay thế.",null,null,null,null,"BODY1956"],["HSK5: thêm 1 phút từ chối một yêu cầu vô lý (vi phạm quy định) mà vẫn giữ được quan hệ.",null,null,null,null,"BODY1957"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY1958"],["Buổi 11 — 客户沟通与投诉处理 Khiếu nại khách hàng",null,null,"Kèhù gōutōng yǔ tóusù chǔlǐ",null,"BODY1-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY2-C"],["HSK4: Tiếp nhận phản ánh, xin lỗi, giải thích nguyên nhân, hẹn thời gian trả lời. HSK5: Thương lượng bồi thường, giữ chân khách hàng.",null,null,null,null,"BODY3"],["Quy trình xử lý khiếu nại 5 bước: ① 倾听 Lắng nghe → ② 道歉 Xin lỗi → ③ 核实 Xác minh → ④ 方案 Đưa giải pháp → ⑤ 跟进 Theo dõi, xác nhận khách hài lòng.",null,null,"Qīngtīng | Dàoqiàn | Héshí | Fāng'àn | Gēnjìn",null,"BODY4"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY6-C"],["1. Hỏi: 你有没有投诉过别人？为什么？ (Bạn từng khiếu nại ai chưa? Vì sao?)",null,null,"Nǐ yǒuméiyǒu tóusù guò biérén? Wèishénme?",null,"BODY7"],["Đáp: 有。上个月我在网上订的沙发晚了两个星期才送到，我给客服打了三次电话才解决。 (Có. Tháng trước sofa đặt online giao muộn 2 tuần, tôi gọi CSKH 3 lần mới giải quyết được.)",null,null,"Yǒu. Shànggèyuè wǒ zài wǎngshàng dìng de shāfā wǎn le liǎnggè xīngqī cái sòngdào, wǒ gěi kèfú dǎ le sāncì diànhuà cái jiějué.",null,"BODY8"],["2. Hỏi: 你在工作中遇到过客户投诉吗？ (Trong công việc bạn từng gặp khách khiếu nại chưa?)",null,null,"Nǐ zài gōngzuò zhōng yùdào guò kèhù tóusù ma?",null,"BODY9"],["Đáp: 经常遇到。最常见的是交货晚了，或者产品包装有破损。 (Thường xuyên. Hay gặp nhất là giao hàng trễ hoặc bao bì sản phẩm bị hỏng.)",null,null,"Jīngcháng yùdào. Zuì chángjiàn de shì jiāohuò wǎn le, huòzhě chǎnpǐnbāozhuāng yǒu pòsǔn.",null,"BODY10"],["3. Hỏi: 你觉得处理投诉最重要的是什么？ (Bạn thấy xử lý khiếu nại quan trọng nhất là gì?)",null,null,"Nǐ juéde chǔlǐ tóusù zuì zhòngyào de shì shénme?",null,"BODY11"],["Đáp: 我觉得最重要的是先让客户把话说完，不要急着解释。 (Quan trọng nhất là để khách nói hết, đừng vội giải thích.)",null,null,"Wǒ juéde zuì zhòngyào de shì xiān ràng kèhù bǎ huà shuōwán, bùyào jí zhe jiěshì.",null,"BODY12"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY13-C"],["1. 反馈 (phản hồi, phản ánh): 谢谢您的反馈，我们会马上改进。 (Cảm ơn phản hồi của anh/chị, chúng tôi sẽ cải thiện ngay.)",null,null,"Fǎnkuì | Xièxienín de fǎnkuì, wǒmen huì mǎshàng gǎijìn.",null,"BODY14"],["2. 投诉 (khiếu nại): 客户投诉我们的售后服务太慢。 (Khách khiếu nại dịch vụ hậu mãi của chúng tôi quá chậm.)",null,null,"Tóusù | Kèhù tóusù wǒmen de shòuhòufúwù tàimàn.",null,"BODY15"],["3. 核实 (xác minh, kiểm tra lại): 我先核实一下发货记录，再给您回电话。 (Tôi xác minh lại lịch sử giao hàng rồi gọi lại cho anh/chị.)",null,null,"Héshí | Wǒ xiān héshí yīxià fāhuò jìlù, zài gěi nín huí diànhuà.",null,"BODY16"],["4. 道歉 (xin lỗi): 我代表公司向您道歉。 (Tôi thay mặt công ty xin lỗi anh/chị.)",null,null,"Dàoqiàn | Wǒ dàibiǎo gōngsī xiàng nín dàoqiàn.",null,"BODY17"],["5. 补救措施 (biện pháp khắc phục): 我们已经采取了补救措施，明天补发。 (Chúng tôi đã áp dụng biện pháp khắc phục, mai gửi bù.)",null,null,"Bǔjiùcuòshī | Wǒmen yǐjīng cǎiqǔ le bǔjiùcuòshī, míngtiān bǔfā.",null,"BODY18"],["6. 处理结果 (kết quả xử lý): 处理结果我们会在二十四小时内通知您。 (Kết quả xử lý chúng tôi sẽ báo trong 24 giờ.)",null,null,"Chǔlǐjiéguǒ | Chǔlǐjiéguǒ wǒmen huì zài èrshísì xiǎoshí nèi tōngzhī nín.",null,"BODY19"],["7. 答复 (trả lời, phúc đáp): 我们会尽快给您一个答复。 (Chúng tôi sẽ sớm trả lời anh/chị.)",null,null,"Dáfù | Wǒmen huì jǐnkuài gěi nín yīgè dáfù.",null,"BODY20"],["8. 售后服务 (dịch vụ hậu mãi): 我们的售后服务电话是二十四小时的。 (Số hotline hậu mãi của chúng tôi hoạt động 24 giờ.)",null,null,"Shòuhòufúwù | Wǒmen de shòuhòufúwù diànhuà shì èrshísì xiǎoshí de.",null,"BODY21"],["9. 给您带来不便 (gây bất tiện cho anh/chị): 很抱歉给您带来不便。 (Rất xin lỗi đã gây bất tiện cho anh/chị.)",null,null,"Gěi nín dàilái bùbiàn | Hěn bàoqiàn gěi nín dàilái bùbiàn.",null,"BODY22"],["10. 补偿 (bù đắp, đền bù): 为了表示歉意，我们给您一定的补偿。 (Để tỏ lòng xin lỗi, chúng tôi đền bù cho anh/chị một phần.)",null,null,"Bǔcháng | Wèile biǎoshìqiànyì, wǒmen gěi nín yīdìng de bǔcháng.",null,"BODY23"],["11. 责任 (trách nhiệm): 如果是我们的责任，我们一定负责到底。 (Nếu là trách nhiệm của chúng tôi, chúng tôi sẽ chịu trách nhiệm đến cùng.)",null,null,"Zérèn | Rúguǒ shì wǒmen de zérèn, wǒmen yīdìng fùzé dàodǐ.",null,"BODY24"],["12. 满意 (hài lòng): 请问您对这个处理方案满意吗？ (Xin hỏi anh/chị có hài lòng với phương án xử lý này không?)",null,null,"Mǎnyì | Qǐngwèn nín duì zhège chǔlǐ fāng'àn mǎnyì ma?",null,"BODY25"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY26-C"],["1. 我先核实一下……，…… (Tôi xác minh … trước, …)",null,null,"Wǒ xiān héshí yīxià……,……",null,"BODY27"],["Ví dụ: 我先核实一下您的订单号，请稍等。 (Tôi xác minh mã đơn của anh/chị trước, xin chờ chút.)",null,null,"Wǒ xiān héshí yīxià nín de dìngdānhào, qǐngshāoděng.",null,"BODY28"],["Ví dụ: 我先核实一下仓库的发货记录，十分钟以后给您回电话。 (Tôi kiểm tra lịch sử xuất kho trước, 10 phút sau gọi lại anh/chị.)",null,null,"Wǒ xiān héshí yīxià cāngkù de fāhuò jìlù, shífēnzhōng yǐhòu gěi nín huí diànhuà.",null,"BODY29"],["2. 我们会尽快答复，最晚…… (Chúng tôi sẽ trả lời sớm nhất, muộn nhất …)",null,null,"Wǒmen huì jǐnkuài dáfù, zuì wǎn……",null,"BODY30"],["Ví dụ: 我们会尽快答复，最晚明天中午之前。 (Chúng tôi sẽ trả lời sớm, muộn nhất trước trưa mai.)",null,null,"Wǒmen huì jǐnkuài dáfù, zuì wǎn míngtiān zhōngwǔ zhīqián.",null,"BODY31"],["Ví dụ: 我们会尽快答复，最晚今天下班之前给您结果。 (Chúng tôi sẽ trả lời sớm, muộn nhất trước giờ tan làm hôm nay có kết quả.)",null,null,"Wǒmen huì jǐnkuài dáfù, zuì wǎn jīntiān xiàbān zhīqián gěi nín jiéguǒ.",null,"BODY32"],["3. 非常抱歉，给您带来了…… (Rất xin lỗi, đã gây cho anh/chị …)",null,null,"Fēicháng bàoqiàn, gěi nín dàilái le……",null,"BODY33"],["Ví dụ: 非常抱歉，给您带来了这么多麻烦。 (Rất xin lỗi đã gây cho anh/chị nhiều phiền phức như vậy.)",null,null,"Fēicháng bàoqiàn, gěi nín dàilái le zhème duō máfan.",null,"BODY34"],["Ví dụ: 非常抱歉，给您的生产带来了影响。 (Rất xin lỗi đã ảnh hưởng đến sản xuất của anh/chị.)",null,null,"Fēicháng bàoqiàn, gěi nín de shēngchǎn dàilái le yǐngxiǎng.",null,"BODY35"],["4. 我完全理解您的心情，…… (Tôi hoàn toàn hiểu tâm trạng của anh/chị, …)",null,null,"Wǒ wánquán lǐjiě nín de xīnqíng,……",null,"BODY36"],["Ví dụ: 我完全理解您的心情，换了我也会很生气。 (Tôi hoàn toàn hiểu tâm trạng anh/chị, nếu là tôi tôi cũng rất tức.)",null,null,"Wǒ wánquán lǐjiě nín de xīnqíng, huàn le wǒ yě huì hěn shēngqì.",null,"BODY37"],["Ví dụ: 我完全理解您的心情，我们现在最重要的是先把问题解决。 (Tôi hoàn toàn hiểu, điều quan trọng nhất bây giờ là giải quyết vấn đề trước.)",null,null,"Wǒ wánquán lǐjiě nín de xīnqíng, wǒmen xiànzài zuì zhòngyào de shì xiān bǎ wèntí jiějué.",null,"BODY38"],["5. 经过核实，问题出在…… (Qua xác minh, vấn đề nằm ở …)",null,null,"Jīngguò héshí, wèntí chū zài……",null,"BODY39"],["Ví dụ: 经过核实，问题出在我们的物流公司，他们把货送错了地址。 (Qua xác minh, vấn đề do công ty vận chuyển của chúng tôi giao nhầm địa chỉ.)",null,null,"Jīngguò héshí, wèntí chū zài wǒmen de wùliú gōngsī, tāmen bǎ huò sòngcuò le dìzhǐ.",null,"BODY40"],["Ví dụ: 经过核实，问题出在包装环节，有一台机器没有调好。 (Qua xác minh, lỗi ở khâu đóng gói, có một máy chưa chỉnh đúng.)",null,null,"Jīngguò héshí, wèntí chū zài bāozhuāng huánjié, yǒu yītái jīqì méiyǒu diào hǎo.",null,"BODY41"],["6. 我们可以为您提供两个方案：一是……，二是…… (Chúng tôi có thể đưa ra 2 phương án: một là …, hai là …)",null,null,"Wǒmen kěyǐ wèi nín tígōng liǎnggè fāng'àn: yī shì……, èr shì……",null,"BODY42"],["Ví dụ: 我们可以为您提供两个方案：一是全部换新，二是退款百分之二十。 (Hai phương án: một là đổi mới toàn bộ, ll,"BODY139"],["阮经理: 刘总，我非常理解您的决定，换了我也会这么想。在您做最后决定之前，能不能给我十分钟，让我说说我们的改进方案？ (Lưu tổng, tôi rất hiểu quyết định của ngài, nếu là tôi cũng nghĩ vậy. Trước khi ngài quyết định cuối cùng, cho tôi 10 phút trình bày phương án cải tiến được không?)",null,null,"Ruǎn jīnglǐ: Liú zǒng, wǒ fēicháng lǐjiě nín de juédìng, huàn le wǒ yě huì zhème xiǎng. Zài nín zuò zuìhòu juédìng zhīqián, néng bùnéng gěi wǒ shífēnzhōng, ràng wǒ shuōshuo wǒmen de gǎijìn fāng'àn?",null,"BODY140"],["客户: 你说吧。 (Anh nói đi.)",null,null,"Kèhù: nǐ shuō ba.",null,"BODY141"],["阮经理: 经过分析，三次延误的根本原因都是我们的产能不够。上个月我们已经新增了一条生产线，产能提高了百分之四十。 (Qua phân tích, nguyên nhân gốc của 3 lần trễ đều là công suất không đủ. Tháng trước chúng tôi đã thêm một chuyền, công suất tăng 40%.)",null,null,"Ruǎn jīnglǐ: jīngguò fēnxī, sāncì yánwù de gēnběnyuányīn dōu shì wǒmen de chǎnnéng bùgòu. Shànggèyuè wǒmen yǐjīng xīnzēng le yītiáo shēngchǎnxiàn, chǎnnéng tígāo le bǎifēnzhīsìshí.",null,"BODY142"],["客户: 说得好听，可是我怎么知道下次不会再晚？ (Nói nghe hay, nhưng sao tôi biết lần sau không trễ nữa?)",null,null,"Kèhù: shuō de hǎotīng, kěshì wǒ zěnme zhīdao xiàcì bùhuì zài wǎn?",null,"BODY143"],["阮经理: 我们愿意在合同里加一条：如果再延误，每天的违约金从百分之零点五提高到百分之一。 (Chúng tôi sẵn sàng thêm vào hợp đồng một điều: nếu trễ nữa, tiền phạt mỗi ngày tăng từ 0,5% lên 1%.)",null,null,"Ruǎn jīnglǐ: wǒmen yuànyì zài hétong lǐjiā yītiáo: rúguǒ zài yánwù, měitiān de wéiyuējīn cóng bǎifēnzhīlíngdiǎn wǔ tígāo dào bǎifēnzhīyī.",null,"BODY144"],["客户: 那这三次的损失呢？我们算过，一共大概三亿盾。 (Còn thiệt hại 3 lần này? Chúng tôi tính khoảng 300 triệu.)",null,null,"Kèhù: nà zhè sāncì de sǔnshī ne? Wǒmen suàn guò, yīgòng dàgài sānyì dùn.",null,"BODY145"],["阮经理: 赔偿全部损失的要求我们恐怕很难满足，因为合同里有明确的赔偿上限。不过考虑到我们多年的合作，我们可以这样：这三次的违约金全部按合同扣，另外下一季度的所有订单再给您九五折。 (Yêu cầu bồi thường toàn bộ e chúng tôi khó đáp ứng vì hợp đồng có mức trần bồi thường rõ ràng. Nhưng xét hợp tác nhiều năm, chúng tôi đề xuất: tiền phạt 3 lần trừ hết theo hợp đồng, ngoài ra mọi đơn quý sau giảm thêm 5%.)",null,null,"Ruǎn jīnglǐ: péicháng quánbù sǔnshī de yāoqiú wǒmen kǒngpà hěn nán mǎnzú, yīnwèi hétong lǐ yǒu míngquè de péicháng shàngxiàn. Bùguò kǎolǜ dào wǒmen duōnián de hézuò, wǒmen kěyǐ zhèyàng: zhè sāncì de wéiyuējīn quánbù àn hétong kòu, lìngwài xià yījìdù de suǒyǒu dìngdān zài gěi nín jiǔwǔ zhé.",null,"BODY146"],["客户: 九五折大概能省多少？ (Giảm 5% tiết kiệm khoảng bao nhiêu?)",null,null,"Kèhù: jiǔwǔ zhé dàgài néng shěng duōshǎo?",null,"BODY147"],["阮经理: 按照您每个季度大概二十亿盾的订单，能省一亿盾左右。 (Theo đơn mỗi quý khoảng 2 tỷ của ngài, tiết kiệm được khoảng 100 triệu.)",null,null,"Ruǎn jīnglǐ: ànzhào nín měigè jìdù dàgài èrshíyì dùn de dìngdān, néng shěng yīyì dùn zuǒyòu.",null,"BODY148"],["客户: 还是不够。 (Vẫn chưa đủ.)",null,null,"Kèhù: háishì bùgòu.",null,"BODY149"],["阮经理: 我理解。那我再加一条：以后您的急单我们优先安排，最快七天交货，而且我们在您的工厂附近准备一个月的安全库存。 (Tôi hiểu. Vậy tôi thêm một điều: sau này đơn gấp của ngài được ưu tiên, nhanh nhất 7 ngày giao, và chúng tôi chuẩn bị tồn kho an toàn một tháng gần nhà máy của ngài.)",null,null,"Ruǎn jīnglǐ: wǒ lǐjiě. Nà wǒ zài jiā yītiáo: yǐhòu nín de jí dān wǒmen yōuxiān ānpái, zuìkuài qītiān jiāohuò, érqiě wǒmen zài nín de gōngchǎng fùjìn zhǔnbèi yīgèyuè de ānquán kùcún.",null,"BODY150"],["客户: 安全库存的费用谁出？ (Chi phí tồn kho an toàn ai chịu?)",null,null,"Kèhù: ānquán kùcún de fèiyòng shuí chū?",null,"BODY151"],["阮经理: 由我们承担，您用多少结多少。 (Chúng tôi chịu, ngài dùng bao nhiêu thanh toán bấy nhiêu.)",null,null,"Ruǎn jīnglǐ: yóu wǒmen chéngdān, nín yòng duōshǎo jié duōshǎo.",null,"BODY152"],["客户: 嗯……这个方案比较有诚意。我需要跟我们老板商量一下。 (Ừm… phương án này khá thành ý. Tôi cần bàn với sếp.)",null,null,"Kèhù: ń…… zhège fāng'àn bǐjiào yǒu chéngyì. Wǒ xūyào gēn wǒmen lǎobǎn shāngliangyīxià.",null,"BODY153"],["阮经理: 当然。我今天把书面方案发给您，您看完有任何问题随时找我。 (Tất nhiên. Hôm nay tôi gửi phương án bằng văn bản, ngài xem có gì cứ tìm tôi.)",null,null,"Ruǎn jīnglǐ: dāngrán. Wǒ jīntiān bǎ shūmiàn fāng'àn fāgěinín, nín kàn wán yǒu rènhé wèntí suíshí zhǎo wǒ.",null,"BODY154"],["客户: 好，周五之前给你答复。 (Được, trước thứ 6 trả lời anh.)",null,null,"Kèhù: hǎo, zhōuwǔ zhīqián gěi nǐ dáfù.",null,"BODY155"],["阮经理: 谢谢刘总再给我们一次机会，我们一定不会让您失望。 (Cảm ơn Lưu tổng cho chúng tôi thêm một cơ hội, chúng tôi nhất định không để ngài thất vọng.)",null,null,"Ruǎn jīnglǐ: xièxie Liú zǒng zài gěi wǒmen yīcì jīhuì, wǒmen yīdìng bùhuì ràng nín shīwàng.",null,"BODY156"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY157-C"],["1. Hỏi: 客户打电话来骂你，你第一句话会说什么？ (Khách gọi điện mắng bạn, câu đầu tiên bạn nói gì?)",null,null,"Kèhù dǎdiànhuà lái mà nǐ, nǐ dìyījù huà huì shuō shénme?",null,"BODY158"],["Đáp: 我会先说：\"非常抱歉，我完全理解您的心情，您慢慢说，我在听。\" (Tôi sẽ nói: \"Rất xin lỗi, tôi hoàn toàn hiểu tâm trạng của anh/chị, anh/chị cứ từ từ nói, tôi đang nghe.\")",null,null,"Wǒhuì xiān shuō: \"fēicháng bàoqiàn, wǒ wánquán lǐjiě nín de xīnqíng, nín mànmànshuō, wǒ zài tīng.\"",null,"BODY159"],["2. Hỏi: 如果问题不是你们公司的责任，你会怎么跟客户说？ (Nếu vấn đề không phải trách nhiệm công ty bạn, bạn nói với khách thế nào?)",null,null,"Rúguǒ wèntí bùshì nǐmen gōngsī de zérèn, nǐ huì zěnme gēn kèhù shuō?",null,"BODY160"],["Đáp: 我会先感谢客户的反馈，然后用事实和数据说明原因，最后还是会提出一个帮助客户的办法，比如帮他联系物流公司。 (Cảm ơn phản hồi của khách, dùng sự thật và số liệu giải thích nguyên nhân, cuối cùng vẫn đưa ra cách giúp khách, như liên hệ công ty vận chuyển giúp.)",null,null,"Wǒhuì xiān gǎnxiè kèhù de fǎnkuì, ránhòu yòng shìshí hé shùjù shuōmíng yuányīn, zuìhòu háishì huì tíchū yīgè bāngzhù kèhù de bànfǎ, bǐrú bāng tā liánxì wùliú gōngsī.",null,"BODY161"],["3. Hỏi: 处理投诉的时候，你觉得最不应该做的是什么？ (Khi xử lý khiếu nại, bạn thấy điều không nên làm nhất là gì?)",null,null,"Chǔlǐ tóusù de shíhou, nǐ juéde zuì bù yīnggāi zuò de shì shénme?",null,"BODY162"],["Đáp: 最不应该的是跟客户争论谁对谁错，或者答应了做不到的事情。 (Không nên nhất là tranh cãi với khách ai đúng ai sai, hoặc hứa những việc không làm được.)",null,null,"Zuì bù yīnggāi de shì gēn kèhù zhēnglùn shuí duì shuícuò, huòzhě dāying le zuò bùdào de shìqing.",null,"BODY163"],["4. Hỏi: (HSK5) 客户要求的赔偿太高，你怎么既保护公司利益又留住客户？ (Khách đòi bồi thường quá cao, làm sao vừa bảo vệ lợi ích công ty vừa giữ khách?)",null,null,"Kèhù yāoqiú de péicháng tài gāo, nǐ zěnme jì bǎohù gōngsī lìyì yòu liúzhù kèhù?",null,"BODY164"],["Đáp: 我会先按合同说明赔偿的标准，然后用其他方式补偿，比如下次订单打折、优先交货或者延长保修，这样公司的成本可控，客户也能感受到诚意。 (Giải thích mức bồi thường theo hợp đồng, rồi bù bằng cách khác như giảm giá đơn sau, ưu tiên giao hàng hoặc kéo dài bảo hành; chi phí công ty kiểm soát được mà khách vẫn thấy thành ý.)",null,null,"Wǒhuì xiān àn hétong shuōmíng péicháng de biāozhǔn, ránhòu yòng qítā fāngshì bǔcháng, bǐrú xiàcì dìngdān dǎzhé, yōuxiān jiāohuò huòzhě yáncháng bǎoxiū, zhèyàng gōngsī de chéngběn kěkòng, kèhù yě néng gǎnshòu dào chéngyì.",null,"BODY165"],["情景模拟 ROLE-PLAY — GV đóng khách tức giận vì giao hàng trễ; HS làm đủ 5 bước. Vòng 2 (bất ngờ): khách dọa đăng lên mạng xã hội / đòi hoàn tiền 100%",null,null,"Qíngjǐng mónǐ",null,"BODY166-C"],["GV: 你们的货又晚了！这次我们的客户也要罚我们的款！ (Hàng các bạn lại trễ! Lần này khách của chúng tôi cũng phạt tiền chúng tôi!)",null,null,"Nǐmen de huò yòu wǎn le! Zhècì wǒmen de kèhù yě yào fá wǒmen de kuǎn!",null,"BODY167"],["HS: 张经理，非常抱歉，您先别着急，我在听，您能告诉我具体是哪一批货吗？ (Giám đốc Trương, rất xin lỗi, anh đừng sốt ruột, tôi đang nghe, anh cho biết cụ thể là lô nào được không?)",null,null,"Zhāng jīnglǐ, fēicháng bàoqiàn, nín xiān biézháojí, wǒ zài tīng, nín néng gàosu wǒ jùtǐ shì nǎ yīpī huò ma?",null,"BODY168"],["GV: 订单号PO1025，说好昨天到，到现在都没消息。 (Đơn PO1025, hẹn hôm qua đến, đến giờ không tin tức gì.)",null,null,"Dìngdānhào PO1025, shuōhǎo zuótiān dào, dào xiànzài dōu méi xiāoxi.",null,"BODY169"],["HS: 我先核实一下，五分钟以后给您回电话，好吗？ (Tôi xác minh trước, 5 phút sau gọi lại anh, được không?)",null,null,"Wǒ xiān héshí yīxià, wǔfēnzhōng yǐhòu gěi nín huí diànhuà, hǎo ma?",null,"BODY170"],["HS: (gọi lại) 张经理，经过核实，货在海关查验，耽误了一天，预计今天下午三点能到您的工厂。 (Giám đốc Trương, qua xác minh, hàng bị hải quan kiểm tra, chậm một ngày, dự kiến 3h chiều nay đến nhà máy anh.)",null,null,"Zhāng jīnglǐ, jīngguò héshí, huò zài hǎiguān cháyàn, dānwù le yītiān, yùjì jīntiānxiàwǔ sāndiǎn néng dào nín de gōngchǎng.",null,"BODY171"],["GV (biến cố): 我不管什么原因，你们要是不全额退款，我就把这件事发到网上！ (Tôi không cần biết lý do, các bạn không hoàn tiền 100% thì tôi đăng chuyện này lên mạng!)",null,null,"Wǒ bùguǎn shénme yuányīn, nǐmen yàoshì bù quán'é tuìkuǎn, wǒ jiù bǎ zhèjiàn shìfā dào wǎngshàng!",null,"BODY172"],["HS: 我理解您现在很生气，给您带来这么大的麻烦，真的很抱歉。全额退款的要求我们恐怕很难满足，不过我们可以承担您客户的罚款，并且这批货的运费全免。 (Tôi hiểu anh đang rất giận, gây phiền phức lớn vậy thật xin lỗi. Yêu cầu hoàn 100% e khó đáp ứng, nhưng chúng tôi có thể chịu khoản phạt của khách anh và miễn toàn bộ phí vận chuyển lô này.)",null,null,"Wǒ lǐjiě nín xiànzài hěn shēngqì, gěi nín dàilái zhème dà de máfan, zhēnde hěn bàoqiàn. Quán'é tuìkuǎn de yāoqiú wǒmen kǒngpà hěn nán mǎnzú, bùguò wǒmen kěyǐ chéngdān nín kèhù de fákuǎn, bìngqiě zhè pīhuò de yùn fèiquánmiǎn.",null,"BODY173"],["GV: 罚款要两千万盾，你们真的愿意出？ (Tiền phạt 20 triệu, các bạn thật sự chịu à?)",null,null,"Fákuǎn yào liǎngqiānwàn dùn, nǐmen zhēnde yuànyì chū?",null,"BODY174"],["HS: 是的，只要您提供客户的罚款通知，我们会在下次结款时直接扣除。 (Vâng, chỉ cần anh cung cấp thông báo phạt của khách, chúng tôi sẽ trừ thẳng vào kỳ thanh toán sau.)",null,null,"Shì de, zhǐyào nín tígōng kèhù de fákuǎn tōngzhī, wǒmen huì zài xiàcì jiékuǎn shí zhíjiē kòuchú.",null,"BODY175"],["GV: 好吧，这样还可以。 (Thôi được, vậy cũng tạm.)",null,null,"Hǎo ba, zhèyàng hái kěyǐ.",null,"BODY176"],["HS: 谢谢您的理解。今天下午货到了以后，我再给您打电话确认。 (Cảm ơn anh đã thông cảm. Chiều nay hàng đến tôi gọi lại xác nhận.)",null,null,"Xièxienín de lǐjiě. Jīntiānxiàwǔ huò dào le yǐhòu, wǒ zài gěi nín dǎdiànhuà quèrèn.",null,"BODY177"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY178-C"],["✗ 这不是我们的错。 (đổ lỗi ngay, mất khách) → ✓ 我先核实一下，看看是哪个环节出了问题。",null,null,"Zhè bùshì wǒmen de cuò. | Wǒ xiān héshí yīxià, kànkan shì nǎge huánjié chū le wèntí.",null,"BODY179"],["✗ 对不起你很多。 → ✓ 非常抱歉。/ 我代表公司向您道歉。",null,null,"Duìbuqǐ nǐ hěnduō. | Fēicháng bàoqiàn. / | Wǒ dàibiǎo gōngsī xiàng nín dàoqiàn.",null,"BODY180"],["✗ 我们会快快回复你。 → ✓ 我们会尽快给您答复。",null,null,"Wǒmen huì kuàikuài huífù nǐ. | Wǒmen huì jǐnkuài gěi nín dáfù.",null,"BODY181"],["✗ 我理解你的心。 → ✓ 我理解您的心情。",null,null,"Wǒ lǐjiě nǐ de xīn. | Wǒ lǐjiě nín de xīnqíng.",null,"BODY182"],["✗ 我们会赔偿给你所有。 → ✓ 我们会承担相应的责任。/ 我们会按合同赔偿。",null,null,"Wǒmen huì péicháng gěi nǐ suǒyǒu. | Wǒmen huì chéngdān xiāngyìng de zérèn. / | Wǒmen huì àn hétong péicháng.",null,"BODY183"],["✗ 你冷静！ (ra lệnh, khách càng giận) → ✓ 您先别着急，慢慢说，我在听。",null,null,"Nǐ lěngjìng! | Nín xiān biézháojí, mànmànshuō, wǒ zài tīng.",null,"BODY184"],["Nâng cấp HSK5: 我们会改 → 我们已经采取了补救措施，并且建立了预防机制。",null,null,"Wǒmen huì gǎi | Wǒmen yǐjīng cǎiqǔ le bǔjiùcuòshī, bìngqiě jiànlì le yùfáng jīzhì.",null,"BODY185"],["Phát âm: 投诉 tóusù; 核实 héshí; 道歉 dàoqiàn; 补偿 bǔcháng; 答复 dáfù.",null,null,"Tóusù | Héshí | Dàoqiàn | Bǔcháng | Dáfù",null,"BODY186"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY187-C"],["Ghi âm một cuộc gọi xử lý khiếu nại 3 phút (tự đóng 2 vai), đủ 5 bước: lắng nghe → xin lỗi → xác minh → giải pháp → theo dõi.",null,null,null,null,"BODY188"],["HSK5: thêm phần thương lượng bồi thường, dùng 恐怕很难满足，不过我们可以…… và 考虑到我们多年的合作…….",null,null,"Kǒngpà hěn nán mǎnzú, bùguò wǒmen kěyǐ…… | Kǎolǜ dào wǒmen duōnián de hézuò…… .",null,"BODY189"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY190"],["Buổi 12 — 会议沟通与工作汇报 Họp và báo cáo",null,null,"Huìyì gōutōng yǔ gōngzuòhuìbào",null,"BODY191-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY192-C"],["HSK4: Báo cáo kết quả, khó khăn, kế hoạch trong cuộc họp. HSK5: Chủ trì cuộc họp, xử lý ý kiến phản đối và đưa ra kết luận.",null,null,null,null,"BODY193"],["Khung báo cáo 4 phần: ① 结果 Kết quả (số liệu) → ② 问题 Khó khăn → ③ 原因 Nguyên nhân → ④ 计划 Kế hoạch tiếp theo.",null,null,"Jiéguǒ | Wèntí | Yuányīn | Jìhuà",null,"BODY194"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY196-C"],["1. Hỏi: 你们公司一个星期开几次会？都是什么会？ (Công ty bạn một tuần họp mấy lần? Là những cuộc họp gì?)",null,null,"Nǐmen gōngsī yīgè xīngqī kāi jǐcì huì? Dōu
