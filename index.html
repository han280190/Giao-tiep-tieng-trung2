 dào le hǎijǐngfáng.",null,"BODY775"],["GV: 等一下，你不是说没有房间了吗？ (Khoan, chẳng phải bạn nói hết phòng rồi sao?)",null,null,"Děng yīxià, nǐ bùshì shuō méiyǒu fángjiān le ma?",null,"BODY776"],["HS: 是这样的，普通房间没有了，但是还有一间贵一点的海景房，酒店就免费给我换了。 (Là thế này: phòng thường hết, nhưng còn một phòng hướng biển đắt hơn, khách sạn đổi miễn phí cho tôi.)",null,null,"Shì zhèyàng de, pǔtōng fángjiān méiyǒu le, dànshì háiyǒu yījiān guì yīdiǎn de hǎijǐngfáng, jiǔdiàn jiù miǎnfèi gěi wǒ huàn le.",null,"BODY777"],["GV: 原来是这样！那你学到了什么？ (Ra vậy! Thế bạn học được gì?)",null,null,"Yuánlái shì zhèyàng! Nà nǐ xuédào le shénme?",null,"BODY778"],["HS: 经过这件事，我明白了，出差之前一定要打电话跟酒店再确认一次。 (Qua chuyện này tôi hiểu trước khi đi công tác phải gọi xác nhận lại với khách sạn.)",null,null,"Jīngguò zhèjiàn shì, wǒ míngbai le, chūchāi zhīqián yīdìng yào dǎdiànhuà gēn jiǔdiàn zài quèrèn yīcì.",null,"BODY779"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc khi kể chuyện quá khứ (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY780-C"],["✗ 我昨天去了超市买了东西了。 → ✓ 我昨天去超市买了点东西。 (Không lạm dụng 了.)",null,null,"Wǒ zuótiān qù le chāoshì mǎi le dōngxi le. | Wǒ zuótiān qù chāoshì mǎi le diǎn dōngxi. | Le .",null,"BODY781"],["✗ 去年我常常去了中国。 → ✓ 去年我常常去中国。 (Hành động lặp lại thường xuyên không dùng 了.)",null,null,"Qùnián wǒ chángcháng qù le Zhōngguó. | Qùnián wǒ chángcháng qù Zhōngguó. | Le .",null,"BODY782"],["✗ 我已经去过下龙湾一次。 → ✓ 我去过一次下龙湾。",null,null,"Wǒ yǐjīng qùguò Xiàlóng Wān yīcì. | Wǒ qùguò yīcì Xiàlóng Wān.",null,"BODY783"],["✗ 我很后悔不学英语。 → ✓ 我很后悔当初没好好学英语。",null,null,"Wǒ hěn hòuhuǐ bù xué Yīngyǔ. | Wǒ hěn hòuhuǐ dāngchū méi hǎohǎoxué Yīngyǔ.",null,"BODY784"],["✗ 然后……然后……然后…… (lặp 然后) → ✓ thay bằng 接着、后来、这时候、最后、没想到.",null,null,"Ránhòu…… ránhòu…… ránhòu…… | Ránhòu | Jiēzhe, hòulái, zhèshíhou, zuìhòu, méixiǎngdào .",null,"BODY785"],["Lưu ý: 我差点儿迟到了 = 我差点儿没迟到 (đều là suýt muộn nhưng kịp) → HS nên dùng 我差点儿迟到了 cho rõ nghĩa.",null,null,"Wǒ chàdiǎnr chídào le | Wǒ chàdiǎnr méi chídào | Wǒ chàdiǎnr chídào le",null,"BODY786"],["Phát âm: 幸亏 xìngkuī; 后悔 hòuhuǐ; 教训 jiàoxùn; 印象深刻 yìnxiàng shēnkè.",null,null,"Xìngkuī | Hòuhuǐ | Jiàoxùn | Yìnxiàng shēnkè",null,"BODY787"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY788-C"],["Ghi âm 1 câu chuyện có mở đầu, cao trào, kết thúc: HSK4 2 phút; HSK5 3 phút kèm phần phân tích bài học.",null,null,null,null,"BODY789"],["Bắt buộc dùng ít nhất 6 từ nối: 有一次、当时、没想到、幸亏、后来、经过这件事.",null,null,"Yǒu yīcì, dāngshí, méixiǎngdào, xìngkuī, hòulái, jīngguò zhèjiàn shì .",null,"BODY790"],["Luyện cặp: một bạn kể, một bạn hỏi 然后呢？为什么？ ít nhất 5 lần.",null,null,"Ránhòu ne? Wèishénme?",null,"BODY791"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY792"],["Buổi 05 — 工作介绍与岗位职责 Giới thiệu công việc",null,null,"Gōngzuò jièshào yǔ gǎngwèizhízé",null,"BODY793-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY794-C"],["HSK4: Giới thiệu 3 nhiệm vụ thường ngày. HSK5: Trình bày quy trình, khó khăn liên phòng ban.",null,null,null,null,"BODY795"],["Mỗi HS luyện kỹ hội thoại đúng vị trí công việc của mình (Sales / Kho / Mua hàng / Kế hoạch / QC / Nhân sự / Kế toán), sau đó thay bằng thông tin thật của công ty.",null,null,null,null,"BODY796"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY798-C"],["1. Hỏi: 你在公司是哪个部门的？部门有多少人？ (Bạn ở phòng nào? Phòng có bao nhiêu người?)",null,null,"Nǐ zài gōngsī shì nǎge bùmén de? Bùmén yǒu duōshǎo rén?",null,"BODY799"],["Đáp: 我在采购部，我们部门一共七个人：一个经理，两个主管，四个采购员。 (Tôi ở phòng mua hàng, phòng có 7 người: 1 giám đốc, 2 trưởng nhóm, 4 nhân viên mua hàng.)",null,null,"Wǒ zài cǎigòubù, wǒmen bùmén yīgòng qīgè rén: yīgè jīnglǐ, liǎnggè zhǔguǎn, sìgè cǎigòuyuán.",null,"BODY800"],["2. Hỏi: 你今天上午做了哪些工作？ (Sáng nay bạn đã làm những việc gì?)",null,null,"Nǐ jīntiānshàngwǔ zuò le nǎxiē gōngzuò?",null,"BODY801"],["Đáp: 我上午先回复了客户的邮件，然后跟仓库确认了库存，十点开了一个部门会议。 (Sáng nay tôi trả lời email khách, rồi xác nhận tồn kho với kho, 10h họp phòng.)",null,null,"Wǒ shàngwǔ xiān huífù le kèhù de yóujiàn, ránhòu gēn cāngkù quèrèn le kùcún, shídiǎn kāi le yīgè bùmén huìyì.",null,"BODY802"],["3. Hỏi: 你工作中最常跟哪个部门打交道？ (Bạn làm việc nhiều nhất với phòng nào?)",null,null,"Nǐ gōngzuò zhōng zuì cháng gēn nǎge bùmén dǎjiāodao?",null,"BODY803"],["Đáp: 我最常跟仓库和财务打交道，因为发货和收款都要找他们。 (Tôi làm việc nhiều nhất với kho và kế toán, vì giao hàng và thu tiền đều phải tìm họ.)",null,null,"Wǒ zuì cháng gēn cāngkù hé cáiwù dǎjiāodao, yīnwèi fāhuò hé shōukuǎn dōu yào zhǎo tāmen.",null,"BODY804"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY805-C"],["1. 岗位 (vị trí công việc): 我的岗位是销售助理，主要支持销售经理的工作。 (Vị trí của tôi là trợ lý kinh doanh, chủ yếu hỗ trợ giám đốc kinh doanh.)",null,null,"Gǎngwèi | Wǒ de gǎngwèi shì xiāoshòu zhùlǐ, zhǔyào zhīchí xiāoshòu jīnglǐ de gōngzuò.",null,"BODY806"],["2. 职责 (trách nhiệm): 这个岗位的职责包括报价、下单和跟进回款。 (Trách nhiệm vị trí này gồm báo giá, lên đơn và theo dõi thu tiền.)",null,null,"Zhízé | Zhège gǎngwèi de zhízé bāokuò bàojià, xiàdān hé gēnjìn huíkuǎn.",null,"BODY807"],["3. 协调 (điều phối): 我需要协调生产部和仓库，保证按时出货。 (Tôi cần điều phối sản xuất và kho để xuất hàng đúng hạn.)",null,null,"Xiétiáo | Wǒ xūyào xiétiáo shēngchǎn bù hé cāngkù, bǎozhèng ànshí chūhuò.",null,"BODY808"],["4. 跟进 (theo dõi, bám sát): 这个订单你帮我跟进一下，有消息马上告诉我。 (Đơn này bạn theo dõi giúp, có tin báo ngay.)",null,null,"Gēnjìn | Zhège dìngdān nǐ bāng wǒ gēnjìn yīxià, yǒu xiāoxi mǎshàng gàosu wǒ.",null,"BODY809"],["5. 汇报 (báo cáo lên cấp trên): 我每周五要向经理汇报一周的销售情况。 (Thứ 6 hằng tuần tôi báo cáo tình hình bán hàng với giám đốc.)",null,null,"Huìbào | Wǒ měizhōuwǔ yào xiàng jīnglǐ huìbào yīzhōu de xiāoshòu qíngkuàng.",null,"BODY810"],["6. 对接 (làm đầu mối với): 我负责对接华南地区的客户。 (Tôi làm đầu mối với khách khu vực Hoa Nam.)",null,null,"Duìjiē | Wǒ fùzé duìjiē Huánándìqū de kèhù.",null,"BODY811"],["7. 工作流程 (quy trình công việc): 新人入职第一周要先熟悉工作流程。 (Tuần đầu nhân viên mới phải làm quen quy trình.)",null,null,"Gōngzuò liúchéng | Xīnrén rùzhí dìyīzhōu yào xiān shúxi gōngzuò liúchéng.",null,"BODY812"],["8. 订单 / 交期 (đơn hàng / hạn giao hàng): 这批订单的交期是月底。 (Lô đơn này hạn giao cuối tháng.)",null,null,"Dìngdān | Jiāo qī | Zhè pī dìngdān de jiāo qī shì yuèdǐ.",null,"BODY813"],["9. 库存 (tồn kho): 这个型号的库存只剩两百个了。 (Mã hàng này chỉ còn tồn 200 cái.)",null,null,"Kùcún | Zhège xínghào de kùcún zhǐ shèng liǎngbǎigè le.",null,"BODY814"],["10. 报表 (báo cáo dạng bảng): 我每天下班前要做一份出入库报表。 (Mỗi ngày trước khi về phải làm bảng báo cáo nhập xuất kho.)",null,null,"Bàobiǎo | Wǒ měitiān xiàbān qián yào zuò yīfèn chūrùkù bàobiǎo.",null,"BODY815"],["11. 审批 (phê duyệt): 采购申请要经过经理审批才能下单。 (Đề xuất mua phải được giám đốc duyệt mới được đặt hàng.)",null,null,"Shěnpī | Cǎigòu shēnqǐng yào jīngguò jīnglǐ shěnpī cáinéng xiàdān.",null,"BODY816"],["12. 产能 (công suất sản xuất): 我们一条生产线的产能是每天八百件。 (Công suất một chuyền của chúng tôi là 800 cái/ngày.)",null,null,"Chǎnnéng | Wǒmen yītiáo shēngchǎnxiàn de chǎnnéng shì měitiān bābǎi jiàn.",null,"BODY817"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY818-C"],["1. 我的主要职责包括……、……和…… (Trách nhiệm chính của tôi gồm …, … và …)",null,null,"Wǒ de zhǔyàozhízé bāokuò……,…… hé……",null,"BODY819"],["Ví dụ: 我的主要职责包括开发新客户、维护老客户和跟进回款。 (Trách nhiệm chính gồm phát triển khách mới, chăm sóc khách cũ và theo dõi thu tiền.)",null,null,"Wǒ de zhǔyàozhízé bāokuò kāifāxīn kèhù, wéihù lǎokèhù hé gēnjìn huíkuǎn.",null,"BODY820"],["Ví dụ: 我的主要职责包括收货、发货和每月盘点。 (Trách nhiệm chính gồm nhận hàng, xuất hàng và kiểm kê hằng tháng.)",null,null,"Wǒ de zhǔyàozhízé bāokuò shōuhuò, fāhuò hé měiyuè pándiǎn.",null,"BODY821"],["2. 遇到问题时，我会先……，再…… (Khi gặp vấn đề, tôi sẽ … trước, rồi …)",null,null,"Yùdào wèntí shí, wǒhuì xiān……, zài……",null,"BODY822"],["Ví dụ: 遇到问题时，我会先跟相关部门确认原因，再向经理汇报。 (Khi gặp vấn đề, tôi xác nhận nguyên nhân với bộ phận liên quan trước rồi báo cáo giám đốc.)",null,null,"Yùdào wèntí shí, wǒhuì xiān gēn xiāngguān bùmén quèrèn yuányīn, zài xiàng jīnglǐ huìbào.",null,"BODY823"],["Ví dụ: 遇到客户投诉时，我会先道歉，再了解具体情况。 (Khi khách khiếu nại, tôi xin lỗi trước rồi tìm hiểu tình hình cụ thể.)",null,null,"Yùdào kèhù tóusù shí, wǒhuì xiān dàoqiàn, zài liǎojiě jùtǐqíngkuàng.",null,"BODY824"],["3. ……由……负责 (… do … phụ trách)",null,null,"…… Yóu…… fùzé",null,"BODY825"],["Ví dụ: 报价由销售部负责，合同由法务部审核。 (Báo giá do phòng kinh doanh phụ trách, hợp đồng do pháp chế thẩm định.)",null,null,"Bàojià yóu xiāoshòubù fùzé, hétong yóu fǎwùbù shěnhé.",null,"BODY826"],["Ví dụ: 来料检验由品质部负责。 (Kiểm hàng đầu vào do phòng chất lượng phụ trách.)",null,null,"Láiliào jiǎnyàn yóu pǐnzhì bù fùzé.",null,"BODY827"],["4. 只有……才能…… (Chỉ khi … mới …)",null,null,"Zhǐyǒu…… cáinéng……",null,"BODY828"],["Ví dụ: 只有财务确认收到货款，仓库才能发货。 (Chỉ khi kế toán xác nhận đã nhận tiền, kho mới được giao hàng.)",null,null,"Zhǐyǒu cáiwù quèrèn shōudào huòkuǎn, cāngkù cáinéng fāhuò.",null,"BODY829"],["Ví dụ: 只有品质部检验合格，物料才能入库。 (Chỉ khi QC kiểm đạt, vật tư mới được nhập kho.)",null,null,"Zhǐyǒu pǐnzhì bù jiǎnyàn hégé, wùliào cáinéng rùkù.",null,"BODY830"],["5. 一旦……，就…… (Một khi …, sẽ …)",null,null,"Yīdàn……, jiù……",null,"BODY831"],["Ví dụ: 一旦库存低于安全库存，系统就会自动提醒采购。 (Một khi tồn kho thấp hơn mức an toàn, hệ thống sẽ tự nhắc mua hàng.)",null,null,"Yīdàn kùcún dīyú ānquán kùcún, xìtǒng jiù huì zìdòng tíxǐng cǎigòu.",null,"BODY832"],["Ví dụ: 一旦客户改订单，我们就要重新排生产计划。 (Một khi khách đổi đơn, phải xếp lại kế hoạch sản xuất.)",null,null,"Yīdàn kèhù gǎi dìngdān, wǒmen jiùyào chóngxīn pái shēngchǎn jìhuà.",null,"BODY833"],["6. 这份工作最大的挑战是…… (Thách thức lớn nhất của công việc này là …)",null,null,"Zhèfèn gōngzuò zuìdà de tiǎozhàn shì……",null,"BODY834"],["Ví dụ: 这份工作最大的挑战是客户的需求经常变。 (Thách thức lớn nhất là yêu cầu khách hay thay đổi.)",null,null,"Zhèfèn gōngzuò zuìdà de tiǎozhàn shì kèhù de xūqiú jīngcháng biàn.",null,"BODY835"],["Ví dụ: 这份工作最大的挑战是每个部门都催我，我要决定先做哪个。 (Thách thức lớn nhất là phòng nào cũng giục, tôi phải quyết định làm việc nào trước.)",null,null,"Zhèfèn gōngzuò zuìdà de tiǎozhàn shì měigè bùmén dōu cuī wǒ, wǒ yào juédìng xiān zuò nǎge.",null,"BODY836"],["7. (HSK5) 之所以……，主要是因为…… (Sở dĩ …, chủ yếu là vì …)",null,null,"Zhīsuǒyǐ……, zhǔyào shìyīnwèi……",null,"BODY837"],["Ví dụ: 之所以经常延误，主要是因为采购和计划之间的信息不同步。 (Sở dĩ hay trễ chủ yếu vì thông tin giữa mua hàng và kế hoạch không đồng bộ.)",null,null,"Zhīsuǒyǐ jīngcháng yánwù, zhǔyào shìyīnwèi cǎigòu hé jìhuà zhījiān de xìnxī bù tóngbù.",null,"BODY838"],["Ví dụ: 之所以客户满意度提高了，主要是因为我们缩短了交期。 (Sở dĩ khách hài lòng hơn chủ yếu vì chúng tôi rút ngắn thời gian giao.)",null,null,"Zhīsuǒyǐ kèhù mǎnyìdù tígāo le, zhǔyào shìyīnwèi wǒmen suōduǎn le jiāo qī.",null,"BODY839"],["8. (HSK5) 为了避免……，我们…… (Để tránh …, chúng tôi …)",null,null,"Wèile bìmiǎn……, wǒmen……",null,"BODY840"],["Ví dụ: 为了避免发错货，我们规定装柜前必须双人核对。 (Để tránh giao nhầm, chúng tôi quy định đóng container phải 2 người đối chiếu.)",null,null,"Wèile bìmiǎn fācuò huò, wǒmen guīdìng zhuāng guì qián bìxū shuāngrén héduì.",null,"BODY841"],["Ví dụ: 为了避免断料，我们把安全库存提高到两周的用量。 (Để tránh thiếu vật tư, chúng tôi nâng tồn an toàn lên mức dùng 2 tuần.)",null,null,"Wèile bìmiǎn duàn liào, wǒmen bǎ ānquán kùcún tígāo dào liǎngzhōu de yòngliàng.",null,"BODY842"],["情景对话 1 — NHÂN VIÊN SALES 销售 (gọi điện chào hàng → báo giá → chốt đơn → đòi tiền)",null,null,"Qíngjǐng duìhuà | Xiāoshòu",null,"BODY843-C"],["销售: 您好，请问是陈经理吗？我是ABC包装公司的销售小李。 (Chào anh, có phải giám đốc Trần không ạ? Tôi là Tiểu Lý, sales công ty bao bì ABC.)",null,null,"Xiāoshòu: nínhǎo, qǐngwèn shì Chén jīnglǐ ma? Wǒ shì ABC bāozhuāng gōngsī de xiāoshòu Xiǎo Lǐ.",null,"BODY844"],["客户: 我是。有什么事吗？ (Tôi đây. Có việc gì vậy?)",null,null,"Kèhù: wǒ shì. Yǒu shénme shì ma?",null,"BODY845"],["销售: 我们公司专门做食品包装袋，想跟您介绍一下我们的新产品，您现在方便吗？ (Công ty tôi chuyên làm túi bao bì thực phẩm, muốn giới thiệu sản phẩm mới, giờ anh có tiện không ạ?)",null,null,"Xiāoshòu: wǒmen gōngsī zhuānmén zuò shípǐn bāozhuāngdài, xiǎng gēn nín jièshào yīxià wǒmen de xīn chǎnpǐn, nín xiànzài fāngbiàn ma?",null,"BODY846"],["客户: 你说吧，五分钟。 (Nói đi, 5 phút.)",null,null,"Kèhù: nǐ shuō ba, wǔfēnzhōng.",null,"BODY847"],["销售: 请问贵公司现在用的是哪个品牌的包装？用得怎么样？ (Xin hỏi quý công ty đang dùng bao bì hãng nào? Dùng thấy thế nào?)",null,null,"Xiāoshòu: qǐngwèn guì gōngsī xiànzài yòng de shì nǎge pǐnpái de bāozhuāng? Yòng de zěnmeyàng?",null,"BODY848"],["客户: 用的是一家中国的，质量还可以，就是交货太慢，经常要等一个月。 (Đang dùng một hãng TQ, chất lượng tạm được, chỉ là giao chậm, hay phải đợi một tháng.)",null,null,"Kèhù: yòng de shì yījiā Zhōngguó de, zhìliàng hái kěyǐ, jiùshì jiāohuò tàimàn, jīngcháng yào děng yīgèyuè.",null,"BODY849"],["销售: 我们的工厂就在北宁，交期一般是十天，急单七天就能交。 (Nhà máy chúng tôi ở Bắc Ninh, thường giao trong 10 ngày, đơn gấp 7 ngày.)",null,null,"Xiāoshòu: wǒmen de gōngchǎng jiù zài Běiníng, jiāo qī yībān shì shítiān, jí dān qītiān jiù néng jiāo.",null,"BODY850"],["客户: 价格呢？ (Giá thì sao?)",null,null,"Kèhù: jiàgé ne?",null,"BODY851"],["销售: 质量跟进口的差不多，价格便宜百分之十五左右。您需要多少数量？我好给您做报价。 (Chất lượng tương đương hàng nhập, giá rẻ hơn khoảng 15%. Anh cần số lượng bao nhiêu để tôi làm báo giá?)",null,null,"Xiāoshòu: zhìliàng gēn jìnkǒu de chàbuduō, jiàgépiányi bǎifēnzhīshíwǔ zuǒyòu. Nín xūyào duōshǎo shùliàng? Wǒ hǎo gěi nín zuò bàojià.",null,"BODY852"],["客户: 每个月大概五万个。 (Mỗi tháng khoảng 50.000 cái.)",null,null,"Kèhù: měigè yuè dàgài wǔwàn gè.",null,"BODY853"],["销售: 好的，我今天下午就把报价单发到您的邮箱。我们还可以先寄样品给您测试，样品是免费的。 (Vâng, chiều nay tôi gửi báo giá vào email anh. Chúng tôi có thể gửi mẫu thử trước, mẫu miễn phí.)",null,null,"Xiāoshòu: hǎo de, wǒ jīntiānxiàwǔ jiù bǎ bàojiàdān fādào nín de yóuxiāng. Wǒmen hái kěyǐ xiānjì yàngpǐn gěi nín cèshì, yàngpǐn shì miǎnfèi de.",null,"BODY854"],["客户: (một tuần sau) 小李，样品我们测试过了，没问题。价格还能再优惠吗？ (Tiểu Lý, mẫu bên tôi thử rồi, không vấn đề. Giá còn ưu đãi thêm được không?)",null,null,"Kèhù: Xiǎo Lǐ, yàngpǐn wǒmen cèshì guò le, méi wèntí. Jiàgé hái néng zài yōuhuì ma?",null,"BODY855"],["销售: 如果您签一年的合同，我们可以再给您打九五折。 (Nếu anh ký hợp đồng một năm, chúng tôi giảm thêm 5%.)",null,null,"Xiāoshòu: rúguǒ nín qiān yīnián de hétong, wǒmen kěyǐ zài gěi nín dǎ jiǔwǔ zhé.",null,"BODY856"],["客户: 付款方式是怎么样的？ (Phương thức thanh toán thế nào?)",null,null,"Kèhù: fùkuǎn fāngshì shì zěnmeyàng de?",null,"BODY857"],["销售: 第一单先付百分之三十定金，发货前付清余款。合作三个月以后可以改成月结。 (Đơn đầu cọc 30%, trả hết trước khi giao. Hợp tác 3 tháng có thể chuyển sang công nợ tháng.)",null,null,"Xiāoshòu: dìyī dān xiānfù bǎifēnzhīsānshí dìngjīn, fāhuò qián fùqīng yúkuǎn. Hézuò sāngè yuè yǐhòu kěyǐ gǎichéng yuè jié.",null,"BODY858"],["客户: 可以，你把合同发过来吧。 (Được, gửi hợp đồng qua đi.)",null,null,"Kèhù: kěyǐ, nǐ bǎ hétong fāguòlái ba.",null,"BODY859"],["销售: 谢谢陈经理！合同我今天就发，您确认没问题就可以签字盖章。 (Cảm ơn giám đốc Trần! Hôm nay tôi gửi hợp đồng, anh xác nhận không vấn đề thì ký đóng dấu.)",null,null,"Xiāoshòu: xièxie Chén jīnglǐ! Hétong wǒ jīntiān jiù fā, nín quèrèn méi wèntí jiù kěyǐ qiānzì gàizhāng.",null,"BODY860"],["销售: (hai tháng sau) 陈经理，打扰了，上个月的货款还没到账，麻烦您帮我问一下财务。 (Giám đốc Trần, làm phiền anh, tiền hàng tháng trước chưa về, phiền anh hỏi giúp kế toán.)",null,null,"Xiāoshòu: Chén jīnglǐ, dǎrǎo le, shànggèyuè de huòkuǎn hái méi dào zhàng, máfan nín bāng wǒ wèn yīxià cáiwù.",null,"BODY861"],["客户: 不好意思，财务这几天在月底结账，我让他们明天付。 (Xin lỗi, kế toán mấy hôm nay khóa sổ cuối tháng, tôi bảo họ mai trả.)",null,null,"Kèhù: bùhǎoyìsi, cáiwù zhè jǐtiān zài yuèdǐ jiézhàng, wǒ ràng tāmen míngtiān fù.",null,"BODY862"],["销售: 好的，谢谢您！感谢您一直以来的支持，希望我们长期合作！ (Vâng, cảm ơn anh! Cảm ơn anh đã ủng hộ, mong hợp tác lâu dài!)",null,null,"Xiāoshòu: hǎo de, xièxienín! Gǎnxiènín yīzhí yǐlái de zhīchí, xīwàng wǒmen chángqī hézuò!",null,"BODY863"],["情景对话 2 — NHÂN VIÊN KHO 仓管 (nhận hàng từ tài xế NCC → phát hiện thiếu → xuất kho)",null,null,"Qíngjǐng duìhuà | Cāng guǎn",null,"BODY864-C"],["仓管: 师傅，您是哪家公司送货的？ (Anh tài, anh giao hàng của công ty nào?)",null,null,"Cāng guǎn: shīfu, nín shì nǎjiā gōngsī sònghuò de?",null,"BODY865"],["司机: 我是明达公司的，送纸箱，这是送货单。 (Tôi bên công ty Minh Đạt, giao thùng carton, đây là phiếu giao hàng.)",null,null,"Sījī: wǒ shì míngdá gōngsī de, sòng zhǐxiāng, zhè shì sònghuò dān.",null,"BODY866"],["仓管: 好的，请把车停到三号门，我们马上卸货。 (Vâng, đỗ xe ở cửa số 3, bên tôi dỡ hàng ngay.)",null,null,"Cāng guǎn: hǎo de, qǐng bǎ chē tíng dào sānhào mén, wǒmen mǎshàng xièhuò.",null,"BODY867"],["仓管: (đếm xong) 师傅，送货单上写的是五十箱，可是我们只点到四十七箱，少了三箱。 (Anh tài, phiếu giao ghi 50 thùng, bên tôi chỉ đếm được 47, thiếu 3 thùng.)",null,null,"Cāng guǎn: shīfu, sònghuò dān shàng xiě de shì wǔshí xiāng, kěshì wǒmen zhǐ diǎn dào sìshíqī xiāng, shǎo le sānxiāng.",null,"BODY868"],["司机: 不可能吧？我们装车的时候是够的。 (Không thể nào? Lúc bốc lên xe là đủ mà.)",null,null,"Sījī: bù kěnéng ba? Wǒmen zhuāngchē de shíhou shì gòu de.",null,"BODY869"],["仓管: 您可以跟我再点一遍。还有，这两箱外包装破了，我先拍照留证据。 (Anh có thể đếm lại cùng tôi. Còn nữa, 2 thùng này rách vỏ, tôi chụp ảnh làm bằng chứng.)",null,null,"Cāng guǎn: nín kěyǐ gēn wǒ zài diǎn yībiàn. Háiyǒu, zhè liǎngxiāng wàibāozhuāng pò le, wǒ xiān pāizhào liú zhèngjù.",null,"BODY870"],["司机: (đếm lại) 确实是四十七箱，可能是工厂装漏了。 (Đúng là 47 thùng, có lẽ xưởng bốc sót.)",null,null,"Sījī: quèshí shì sìshíqī xiāng, kěnéng shì gōngchǎng zhuāng lòu le.",null,"BODY871"],["仓管: 那麻烦您在送货单上写明\"实收四十七箱，两箱破损\"，然后签字。 (Vậy phiền anh ghi lên phiếu \"Thực nhận 47 thùng, 2 thùng hư hỏng\" rồi ký.)",null,null,"Cāng guǎn: nà máfan nín zài sònghuò dān shàng xiěmíng \"shíshōu sìshíqī xiāng, liǎngxiāng pòsǔn\", ránhòu qiānzì.",null,"BODY872"],["司机: 好，我签。 (Được, tôi ký.)",null,null,"Sījī: hǎo, wǒ qiān.",null,"BODY873"],["仓管: (gọi điện) 喂，小芳吗？明达的纸箱少了三箱，还有两箱破损，照片我发到群里了，麻烦你跟供应商联系一下。 (A lô, Tiểu Phương à? Thùng carton Minh Đạt thiếu 3 thùng, 2 thùng hỏng, ảnh tôi gửi lên nhóm rồi, phiền bạn liên hệ NCC.)",null,null,"Cāng guǎn: wèi, Xiǎo Fāng ma? Míngdá de zhǐxiāng shǎo le sānxiāng, háiyǒu liǎngxiāng pòsǔn, zhàopiàn wǒ fādào qún lǐ le, máfan nǐ gēn gōngyìngshāng liánxì yīxià.",null,"BODY874"],["采购: 收到，我马上联系他们补货。这批货可以先入库吗？ (Nhận rồi, tôi liên hệ họ bổ sung ngay. Lô này nhập kho trước được không?)",null,null,"Cǎigòu: shōudào, wǒ mǎshàng liánxì tāmen bǔhuò. Zhè pīhuò kěyǐ xiān rùkù ma?",null,"BODY875"],["仓管: 要等品质部检验，合格以后才能入库。我先放在待检区。 (Phải chờ QC kiểm, đạt mới nhập kho. Tôi để ở khu chờ kiểm trước.)",null,null,"Cāng guǎn: yào děng pǐnzhì bù jiǎnyàn, hégé yǐhòu cáinéng rùkù. Wǒ xiān fàngzài dàijiǎnqū.",null,"BODY876"],["生产: (một lúc sau) 仓库，二号线要领料，型号是A305，要五百个。 (Kho ơi, chuyền 2 cần lĩnh vật tư mã A305, 500 cái.)",null,null,"Shēngchǎn: cāngkù, èrhàoxiàn yàolǐng liào, xínghào shì A305, yào wǔbǎigè.",null,"BODY877"],["仓管: 请先开领料单，你们主管签字以后再来拿。 (Mở phiếu lĩnh trước, trưởng chuyền ký rồi mới đến lấy.)",null,null,"Cāng guǎn: qǐng xiān kāi lǐng liàodān, nǐmen zhǔguǎn qiānzì yǐhòu zài lái ná.",null,"BODY878"],["生产: 单子在这儿，已经签好了。 (Phiếu đây, ký rồi.)",null,null,"Shēngchǎn: dānzi zài zhèr, yǐjīng qiānhǎo le.",null,"BODY879"],["仓管: 好。A305在A区三号货架第二层，我们按先进先出发料，先拿上个月的那批。 (Được. A305 ở khu A, kệ 3, tầng 2, bọn tôi xuất theo nhập trước xuất trước, lấy lô tháng trước.)",null,null,"Cāng guǎn: hǎo. A305 zài A qū sānhào huòjià dì'èrcéng, wǒmen àn xiānjìnxiānchū fāliào, xiān ná shànggèyuè de nà pī.",null,"BODY880"],["仓管: 不过A305只剩八百个了，发完只剩三百，我得马上通知采购。 (Nhưng A305 chỉ còn 800 cái, phát xong còn 300, tôi phải báo mua hàng ngay.)",null,null,"Cāng guǎn: bùguò A305 zhǐ shèng bābǎigè le, fā wán zhǐ shèng sānbǎi, wǒ děi mǎshàng tōngzhī cǎigòu.",null,"BODY881"],["生产: 辛苦了！ (Vất vả rồi!)",null,null,"Shēngchǎn: xīnkǔ le!",null,"BODY882"],["仓管: 不客气。今天下班前我会把出入库报表发到群里。 (Không có gì. Trước khi tan làm tôi sẽ gửi báo cáo nhập xuất lên nhóm.)",null,null,"Cāng guǎn: bù kèqi. Jīntiān xiàbān qián wǒhuì bǎ chūrùkù bàobiǎo fādào qún lǐ.",null,"BODY883"],["情景对话 3 — NHÂN VIÊN MUA HÀNG 采购 (hỏi giá NCC → mặc cả → giao trễ, hàng lỗi)",null,null,"Qíngjǐng duìhuà | Cǎigòu",null,"BODY884-C"],["采购: 张经理，您好！我们需要采购一批电源线，型号是PW-220，数量五千条，麻烦您报个价。 (Chào giám đốc Trương! Chúng tôi cần mua lô dây nguồn mã PW-220, 5.000 sợi, phiền anh báo giá.)",null,null,"Cǎigòu: Zhāng jīnglǐ, nínhǎo! Wǒmen xūyào cǎigòu yīpī diànyuánxiàn, xínghào shì PW | 220, shùliàng wǔqiān tiáo, máfan nín bào gè jià.",null,"BODY885"],["供应商: 好的。这个型号单价是一点二美元，含税，不含运费。 (Vâng. Mã này đơn giá 1,2 USD, đã gồm thuế, chưa gồm vận chuyển.)",null,null,"Gōngyìngshāng: hǎo de. Zhège xínghào dānjià shì yīdiǎn èr měiyuán, hán shuì, bù hán yùnfèi.",null,"BODY886"],["采购: 比上次的价格高了不少，上次才一点一美元。 (Cao hơn lần trước khá nhiều, lần trước chỉ 1,1 USD.)",null,null,"Cǎigòu: bǐ shàngcì de jiàgé gāo le bùshǎo, shàngcì cái yīdiǎn yī měiyuán.",null,"BODY887"],["供应商: 最近铜价涨了，我们的成本也提高了。 (Gần đây giá đồng tăng, chi phí bên tôi cũng tăng.)",null,null,"Gōngyìngshāng: zuìjìn tóngjià zhǎngle, wǒmen de chéngběn yě tígāo le.",null,"BODY888"],["采购: 我理解。如果我们一次订一万条，单价能降到多少？ (Tôi hiểu. Nếu đặt một lần 10.000 sợi, đơn giá giảm được bao nhiêu?)",null,null,"Cǎigòu: wǒ lǐjiě. Rúguǒ wǒmen yīcì dìng yīwàntiáo, dānjià néng jiàngdào duōshǎo?",null,"BODY889"],["供应商: 一万条的话，可以给您一点一二。 (10.000 sợi thì được 1,12.)",null,null,"Gōngyìngshāng: yīwàntiáo dehuà, kěyǐ gěi nín yīdiǎn yī'èr.",null,"BODY890"],["采购: 一点一可以吗？我们是长期合作，而且付款一直很准时。 (1,1 được không? Chúng ta hợp tác lâu dài, bên tôi thanh toán luôn đúng hạn.)",null,null,"Cǎigòu: yīdiǎn yī kěyǐ ma? Wǒmen shì chángqī hézuò, érqiě fùkuǎn yīzhí hěn zhǔnshí.",null,"BODY891"],["供应商: 好吧，一点一，但是付款要改成月结十五天。 (Thôi được, 1,1, nhưng thanh toán đổi thành công nợ 15 ngày.)",null,null,"Gōngyìngshāng: hǎo ba, yīdiǎn yī, dànshì fùkuǎn yào gǎichéng yuè jié shíwǔtiān.",null,"BODY892"],["采购: 可以。交货期最快要多久？我们这边比较急。 (Được. Giao nhanh nhất bao lâu? Bên tôi khá gấp.)",null,null,"Cǎigòu: kěyǐ. Jiāohuòqī zuìkuài yào duōjiǔ? Wǒmen zhèbiān bǐjiào jí.",null,"BODY893"],["供应商: 正常是二十天，我尽量安排十五天交货。 (Bình thường 20 ngày, tôi cố gắng sắp xếp 15 ngày.)",null,null,"Gōngyìngshāng: zhèngcháng shì èrshítiān, wǒ jǐnliàng ānpái shíwǔtiān jiāohuò.",null,"BODY894"],["采购: 好的，订单我今天下午发给您，请您确认交货时间，并且每周给我更新一次生产进度。 (Vâng, chiều nay tôi gửi đơn, anh xác nhận thời gian giao, mỗi tuần cập nhật tiến độ cho tôi một lần.)",null,null,"Cǎigòu: hǎo de, dìngdān wǒ jīntiānxiàwǔ fāgěinín, qǐng nín quèrèn jiāohuò shíjiān, bìngqiě měizhōu gěi wǒ gèngxīn yīcì shēngchǎn jìndù.",null,"BODY895"],["采购: (15 ngày sau) 张经理，今天已经是交货日了，货发出了吗？有物流单号吗？ (Giám đốc Trương, hôm nay là ngày giao rồi, hàng gửi đi chưa? Có mã vận đơn chưa?)",null,null,"Cǎigòu: Zhāng jīnglǐ, jīntiān yǐjīng shì jiāohuò rì le, huò fāchū le ma? Yǒu wùliú dān hào ma?",null,"BODY896"],["供应商: 真不好意思，工厂的设备坏了两天，要推迟三天才能发货。 (Thật xin lỗi, máy ở xưởng hỏng 2 ngày, phải lùi 3 ngày mới giao được.)",null,null,"Gōngyìngshāng: zhēn bùhǎoyìsi, gōngchǎng de shèbèi huài le liǎngtiān, yào tuīchí sāntiān cáinéng fāhuò.",null,"BODY897"],["采购: 这样会影响我们的生产。您能不能先发一半，剩下的三天后再发？ (Như vậy ảnh hưởng sản xuất của chúng tôi. Anh gửi trước một nửa, còn lại 3 ngày sau gửi được không?)",null,null,"Cǎigòu: zhèyàng huì yǐngxiǎng wǒmen de shēngchǎn. Nín néng bùnéng xiān fā yībàn, shèngxià de sāntiān hòu zài fā?",null,"BODY898"],["供应商: 可以，我今天先发五千条，用空运，运费我们承担。 (Được, hôm nay tôi gửi trước 5.000 sợi bằng đường hàng không, phí vận chuyển bên tôi chịu.)",null,null,"Gōngyìngshāng: kěyǐ, wǒ jīntiān xiān fā wǔqiān tiáo, yòng kōngyùn, yùnfèi wǒmen chéngdān.",null,"BODY899"],["采购: (một tuần sau) 张经理，货到了，但是品质部检验发现不良率有百分之五，超过了我们百分之一的标准。 (Hàng về rồi, nhưng QC kiểm thấy tỷ lệ lỗi 5%, vượt tiêu chuẩn 1% của chúng tôi.)",null,null,"Cǎigòu: Zhāng jīnglǐ, huò dào le, dànshì pǐnzhì bù jiǎnyàn fāxiàn bùliánglǜ yǒu bǎifēnzhīwǔ, chāoguò le wǒmen bǎifēnzhīyī de biāozhǔn.",null,"BODY900"],["供应商: 主要是什么问题？ (Lỗi chủ yếu là gì?)",null,null,"Gōngyìngshāng: zhǔyào shì shénme wèntí?",null,"BODY901"],["采购: 插头松动，检验报告和照片我已经发到您的邮箱了。不合格的那部分需要换货。 (Phích cắm lỏng, báo cáo và ảnh tôi đã gửi email anh. Phần không đạt cần đổi hàng.)",null,null,"Cǎigòu: chātóu sōngdòng, jiǎnyàn bàogào hé zhàopiàn wǒ yǐjīng fādào nín de yóuxiāng le. Bù hégé de nà bùfen xūyào huànhuò.",null,"BODY902"],["供应商: 我们马上安排补货，下周一送到，以后出货前我们会加一道检验。 (Bên tôi bổ sung ngay, thứ 2 tuần sau giao, sau này trước khi xuất sẽ thêm một khâu kiểm.)",null,null,"Gōngyìngshāng: wǒmen mǎshàng ānpái bǔhuò, xiàzhōuyī sòngdào, yǐhòu chūhuò qián wǒmen huì jiā yīdào jiǎnyàn.",null,"BODY903"],["采购: 好的，希望下次不要再出现这种情况。季度评估的时候，我们会考虑质量和交期。 (Vâng, mong lần sau không tái diễn. Khi đánh giá quý, chúng tôi sẽ xét chất lượng và thời gian giao.)",null,null,"Cǎigòu: hǎo de, xīwàng xiàcì bùyào zài chūxiàn zhèzhǒng qíngkuàng. Jìdù pínggū de shíhou, wǒmen huì kǎolǜ zhìliàng hé jiāo qī.",null,"BODY904"],["情景对话 4 — NHÂN VIÊN KẾ HOẠCH 计划员 (họp sáng với Sales và Sản xuất khi có đơn gấp)",null,null,"Qíngjǐng duìhuà | Jìhuà yuán",null,"BODY905-C"],["销售: 小黄，客户临时加了一个急单，三千件，要求下周五交货。 (Tiểu Hoàng, khách đột xuất thêm đơn gấp 3.000 cái, yêu cầu giao thứ 6 tuần sau.)",null,null,"Xiāoshòu: Xiǎo Huáng, kèhù línshí jiā le yīgè jí dān, sānqiānjiàn, yāoqiú xià zhōuwǔ jiāohuò.",null,"BODY906"],["计划: 下周五？那只有八天了。我先看一下物料和产能。 (Thứ 6 tuần sau? Vậy chỉ còn 8 ngày. Để tôi xem vật tư và công suất.)",null,null,"Jìhuà: xià zhōuwǔ? Nà zhǐyǒu bātiān le. Wǒ xiān kàn yīxià wùliào hé chǎnnéng.",null,"BODY907"],["计划: 物料方面，主料够，但是包装盒还差两千个，采购说最快周三到。 (Vật tư: nguyên liệu chính đủ, nhưng hộp đóng gói thiếu 2.000 cái, mua hàng nói nhanh nhất thứ 4 về.)",null,null,"Jìhuà: wùliào fāngmiàn, zhǔliào gòu, dànshì bāozhuānghé hái chà liǎngqiāngè, cǎigòu shuō zuìkuài zhōusān dào.",null,"BODY908"],["销售: 那产能呢？ (Còn công suất?)",null,null,"Xiāoshòu: nà chǎnnéng ne?",null,"BODY909"],["计划: 一条线一天能做八百件，现在两条线都排满了，在做王总的订单。 (Một chuyền một ngày làm 800 cái, giờ hai chuyền đều kín lịch, đang làm đơn của Vương tổng.)",null,null,"Jìhuà: yītiáoxiàn yītiān néng zuò bābǎi jiàn, xiànzài liǎngtiáoxiàn dōu páimǎn le, zài zuò Wáng zǒng de dìngdān.",null,"BODY910"],["销售: 王总的订单交期是什么时候？ (Đơn Vương tổng hạn giao khi nào?)",null,null,"Xiāoshòu: Wáng zǒng de dìngdān jiāo qī shì shénme shíhou?",null,"BODY911"],["计划: 下个月十号，还有一点时间。 (Ngày 10 tháng sau, còn chút thời gian.)",null,null,"Jìhuà: xiàgèyuè shíhào, háiyǒu yīdiǎn shíjiān.",null,"BODY912"],["销售: 那能不能先做急单，王总的往后推？ (Vậy làm đơn gấp trước, đơn Vương tổng lùi lại được không?)",null,null,"Xiāoshòu: nà néng bùnéng xiān zuò jí dān, Wáng zǒng de wǎnghòu tuī?",null,"BODY913"],["计划: 可以，但是王总的订单会推迟两天，十号可能比较紧。 (Được, nhưng đơn Vương tổng sẽ chậm 2 ngày, ngày 10 có thể sẽ sát.)",null,null,"Jìhuà: kěyǐ, dànshì Wáng zǒng de dìngdān huì tuīchí liǎngtiān, shíhào kěnéng bǐjiào jǐn.",null,"BODY914"],["生产: 如果这样的话，我建议周六两条线都加班，把时间补回来。 (Nếu vậy, tôi đề nghị thứ 7 hai chuyền đều tăng ca để bù thời gian.)",null,null,"Shēngchǎn: rúguǒ zhèyàngdehuà, wǒ jiànyì zhōuliù liǎngtiáoxiàn dōu jiābān, bǎ shíjiān bǔ huílái.",null,"BODY915"],["计划: 好。那我这样安排：周一到周三先做没有包装的半成品，周三包装盒到了以后马上包装，周四做完，周五出货。 (Được. Tôi sắp xếp thế này: thứ 2 đến thứ 4 làm bán thành phẩm chưa đóng gói, thứ 4 hộp về thì đóng gói ngay, thứ 5 xong, thứ 6 xuất hàng.)",null,null,"Jìhuà: hǎo. Nà wǒ zhèyàng ānpái: zhōuyī dào zhōusān xiān zuò méiyǒu bāozhuāng de bànchéngpǐn, zhōusān bāozhuānghé dào le yǐhòu mǎshàng bāozhuāng, zhōusì zuò wán, zhōuwǔ chūhuò.",null,"BODY916"],["销售: 万一包装盒周三到不了呢？ (Lỡ thứ 4 hộp không về kịp thì sao?)",null,null,"Xiāoshòu: wànyī bāozhuānghé zhōusān dào bùliǎo ne?",null,"BODY917"],["计划: 那就麻烦你跟客户沟通一下，能不能分两批交货，第一批一千五百件周五交。 (Vậy phiền anh trao đổi với khách xem giao làm 2 đợt được không, đợt đầu 1.500 cái giao thứ 6.)",null,null,"Jìhuà: nà jiù máfan nǐ gēn kèhù gōutōng yīxià, néng bùnéng fēn liǎngpī jiāohuò, dìyīpī yīqiānwǔbǎijiàn zhōuwǔ jiāo.",null,"BODY918"],["销售: 好，我先跟客户打个招呼。 (Được, tôi báo trước với khách.)",null,null,"Xiāoshòu: hǎo, wǒ xiān gēn kèhù dǎgèzhāohu.",null,"BODY919"],["计划: 生产计划改了以后，我会更新到系统里，并通知仓库、采购和品质部。 (Kế hoạch đổi xong tôi sẽ cập nhật hệ thống và báo kho, mua hàng, QC.)",null,null,"Jìhuà: shēngchǎn jìhuà gǎi le yǐhòu, wǒhuì gèngxīn dào xìtǒng lǐ, bìng tōngzhī cāngkù, cǎigòu hé pǐnzhì bù.",null,"BODY920"],["经理: 小黄，这周的计划达成率是多少？ (Tiểu Hoàng, tỷ lệ đạt kế hoạch tuần này bao nhiêu?)",null,null,"Jīnglǐ: Xiǎo Huáng, zhè zhōu de jìhuà dáchéng lǜ shì duōshǎo?",null,"BODY921"],["计划: 百分之九十二，没达到目标，主要是因为二号线周二设备故障，停了四个小时。 (92%, chưa đạt mục tiêu, chủ yếu vì chuyền 2 hỏng máy thứ 3, dừng 4 tiếng.)",null,null,"Jìhuà: bǎifēnzhījiǔshí èr, méi dádàomùbiāo, zhǔyào shìyīnwèi èrhàoxiàn zhōu'èr shèbèi gùzhàng, tíng le sìgè xiǎoshí.",null,"BODY922"],["经理: 下个月是旺季，你们要提前备料，别再出现断料的情况。 (Tháng sau là mùa cao điểm, phải chuẩn bị vật tư trước, đừng để thiếu vật tư nữa.)",null,null,"Jīnglǐ: xiàgèyuè shì wàngjì, nǐmen yào tíqián bèiliào, bié zài chūxiàn duàn liào de qíngkuàng.",null,"BODY923"],["计划: 明白，我今天就把下个月的物料需求发给采购。 (Đã rõ, hôm nay tôi gửi nhu cầu vật tư tháng sau cho mua hàng.)",null,null,"Jìhuà: míngbai, wǒ jīntiān jiù bǎ xiàgèyuè de wùliào xūqiú fāgěi cǎigòu.",null,"BODY924"],["情景对话 5 — NHÂN VIÊN QC 品质 (phát hiện lô hàng lỗi, trao đổi với trưởng chuyền)",null,null,"Qíngjǐng duìhuà | Pǐnzhì",null,"BODY925-C"],["品质: 李主管，二号线早上做的这批产品尺寸有问题。 (Trưởng chuyền Lý, lô sáng nay chuyền 2 làm có vấn đề về kích thước.)",null,null,"Pǐnzhì: Lǐ zhǔguǎn, èrhàoxiàn zǎoshang zuò de zhè pī chǎnpǐn chǐcùn yǒu wèntí.",null,"BODY926"],["生产: 什么问题？ (Vấn đề gì?)",null,null,"Shēngchǎn: shénme wèntí?",null,"BODY927"],["品质: 我抽检了一百个，有八个尺寸偏大零点五毫米，超出了标准。 (Tôi lấy mẫu 100 cái, 8 cái lớn hơn 0,5mm, vượt tiêu chuẩn.)",null,null,"Pǐnzhì: wǒ chōujiǎn le yībǎigè, yǒu bāgè chǐcùn piān dà língdiǎn wǔ háomǐ, chāochū le biāozhǔn.",null,"BODY928"],["生产: 会不会是量具的问题？ (Có phải do dụng cụ đo không?)",null,null,"Shēngchǎn: huì bùhuì shì liángjù de wèntí?",null,"BODY929"],["品质: 我用两个量具都测过了，结果一样。另外还有几个外观有划痕。 (Tôi đo bằng 2 dụng cụ rồi, kết quả như nhau. Ngoài ra vài cái có vết xước bề mặt.)",null,null,"Pǐnzhì: wǒ yòng liǎnggè liángjù dōu cè guò le, jiéguǒ yīyàng. Lìngwài háiyǒu jǐgè wàiguān yǒu huàhén.",null,"BODY930"],["生产: 那现在怎么办？订单下午就要出货。 (Vậy giờ làm sao? Đơn chiều nay phải xuất rồi.)",null,null,"Shēngchǎn: nà xiànzài zěnmebàn? Dìngdān xiàwǔ jiùyào chūhuò.",null,"BODY931"],["品质: 我建议先停线，等技术员把模具检查清楚再继续生产。 (Tôi đề nghị dừng chuyền, chờ kỹ thuật kiểm tra khuôn xong mới chạy tiếp.)",null,null,"Pǐnzhì: wǒ jiànyì xiān tíngxiàn, děng jìshùyuán bǎ mújù jiǎnchá qīngchu zài jìxù shēngchǎn.",null,"BODY932"],["生产: 停线会影响交期啊。 (Dừng chuyền sẽ ảnh hưởng hạn giao.)",null,null,"Shēngchǎn: tíngxiàn huì yǐngxiǎng jiāo qī a.",null,"BODY933"],["品质: 我理解，可是如果不合格的货发给客户，被退货的损失更大。 (Tôi hiểu, nhưng hàng lỗi giao cho khách mà bị trả về thì thiệt hại còn lớn hơn.)",null,null,"Pǐnzhì: wǒ lǐjiě, kěshì rúguǒ bù hégé de huò fāgěi kèhù, bèi tuìhuò de sǔnshī gèng dà.",null,"BODY934"],["生产: 好吧，我马上叫技术员过来。已经做好的那些怎么处理？ (Thôi được, tôi gọi kỹ thuật ngay. Hàng đã làm xong xử lý thế nào?)",null,null,"Shēngchǎn: hǎo ba, wǒ mǎshàng jiào jìshùyuán guòlái. Yǐjīng zuòhǎo de nàxiē zěnme chǔlǐ?",null,"BODY935"],["品质: 已经做好的要全检，合格的可以出货，不合格的放到不良品区。我会开一份不合格报告。 (Hàng đã làm phải kiểm 100%, đạt thì xuất, không đạt để khu hàng lỗi. Tôi sẽ lập báo cáo không phù hợp.)",null,null,"Pǐnzhì: yǐjīng zuòhǎo de yào quán jiǎn, hégé de kěyǐ chūhuò, bù hégé de fàngdào bùliáng pǐn qū. Wǒhuì kāi yīfèn bù hégé bàogào.",null,"BODY936"],["生产: 辛苦了。下周客户来验厂，这些记录也要准备好吧？ (Vất vả rồi. Tuần sau khách đến audit, mấy hồ sơ này cũng phải chuẩn bị nhỉ?)",null,null,"Shēngchǎn: xīnkǔ le. Xiàzhōu kèhù lái yàn chǎng, zhèxiē jìlù yě yào zhǔnbèi hǎo ba?",null,"BODY937"],["品质: 对，所有检验记录和改善报告我都会整理好。质量是做出来的，不是检出来的，以后每两个小时要做一次首件确认。 (Đúng, toàn bộ hồ sơ kiểm và báo cáo cải tiến tôi sẽ sắp xếp. Chất lượng được làm ra chứ không phải kiểm ra, sau này cứ 2 tiếng phải xác nhận sản phẩm đầu một lần.)",null,null,"Pǐnzhì: duì, suǒyǒu jiǎnyàn jìlù hé gǎishàn bàogào wǒ dōu huì zhěnglǐ hǎo. Zhìliàng shì zuò chūlái de, bùshì jiǎn chūlái de, yǐhòu měi liǎnggè xiǎoshí yào zuò yīcì shǒujiàn quèrèn.",null,"BODY938"],["情景对话 6 — NHÂN SỰ – HÀNH CHÍNH 人事 (nhân viên mới làm thủ tục nhận việc)",null,null,"Qíngjǐng duìhuà | Rénshì",null,"BODY939-C"],["人事: 你好，欢迎加入我们公司！今天主要是办入职手续。 (Chào bạn, chào mừng gia nhập công ty! Hôm nay chủ yếu làm thủ tục nhận việc.)",null,null,"Rénshì: nǐhǎo, huānyíng jiārù wǒmen gōngsī! Jīntiān zhǔyào shì bàn rùzhí shǒuxù.",null,"BODY940"],["新员工: 谢谢！需要准备什么材料？ (Cảm ơn! Cần chuẩn bị giấy tờ gì ạ?)",null,null,"Xīn yuángōng: xièxie! Xūyào zhǔnbèi shénme cáiliào?",null,"BODY941"],["人事: 身份证复印件、两张照片、毕业证复印件和体检报告。你都带了吗？ (Bản sao CCCD, 2 ảnh, bản sao bằng tốt nghiệp và giấy khám sức khỏe. Bạn mang đủ chưa?)",null,null,"Rénshì: shēnfènzhèng fùyìnjiàn, liǎngzhāng zhàopiàn, bìyèzhèng fùyìnjiàn hé tǐjiǎn bàogào. Nǐ dōu dài le ma?",null,"BODY942"],["新员工: 都带了，就是体检报告还没出来，明天可以补交吗？ (Mang đủ rồi, chỉ là giấy khám chưa có kết quả, mai nộp bổ sung được không ạ?)",null,null,"Xīn yuángōng: dōu dài le, jiùshì tǐjiǎn bàogào hái méi chūlái, míngtiān kěyǐ bǔjiāo ma?",null,"BODY943"],["人事: 可以，这周内交就行。试用期是两个月，试用期工资是正式工资的百分之八十五。 (Được, trong tuần này nộp là được. Thử việc 2 tháng, lương thử việc bằng 85% lương chính thức.)",null,null,"Rénshì: kěyǐ, zhè zhōu nèi jiāo jiù xíng. Shìyòngqī shì liǎnggè yuè, shìyòngqī gōngzī shì zhèngshì gōngzī de bǎifēnzhībāshíwǔ.",null,"BODY944"],["新员工: 好的。请问上下班时间是几点？ (Vâng. Xin hỏi giờ làm việc thế nào ạ?)",null,null,"Xīn yuángōng: hǎo de. Qǐngwèn shàngxiàbān shíjiān shì jǐdiǎn?",null,"BODY945"],["人事: 早上八点到下午五点，中午休息一个小时，周六上半天。 (8h sáng đến 5h chiều, nghỉ trưa 1 tiếng, thứ 7 làm nửa ngày.)",null,null,"Rénshì: zǎoshang bādiǎn dào xiàwǔ wǔdiǎn, zhōngwǔ xiūxi yīgè xiǎoshí, zhōuliù shàngbàntiān.",null,"BODY946"],["新员工: 如果要请假，怎么申请？ (Nếu muốn nghỉ phép thì xin thế nào?)",null,null,"Xīn yuángōng: rúguǒ yào qǐngjià, zěnme shēnqǐng?",null,"BODY947"],["人事: 在系统里提前申请，三天以内主管批准就可以，三天以上需要经理批准。 (Xin trước trên hệ thống, dưới 3 ngày trưởng nhóm duyệt là được, trên 3 ngày cần giám đốc duyệt.)",null,null,"Rénshì: zài xìtǒng lǐ tíqián shēnqǐng, sāntiān yǐnèi zhǔguǎn pīzhǔn jiù kěyǐ, sāntiān yǐshàng xūyào jīnglǐ pīzhǔn.",null,"BODY948"],["新员工: 工资是每个月几号发？ (Lương trả ngày mấy hằng tháng ạ?)",null,null,"Xīn yuángōng: gōngzī shì měigè yuè jǐhào fā?",null,"BODY949"],["人事: 每个月十号，加班费跟工资一起发。这是员工手册，你回去仔细看看。 (Ngày 10 hằng tháng, tiền tăng ca trả cùng lương. Đây là sổ tay nhân viên, bạn về đọc kỹ.)",null,null,"Rénshì: měigè yuè shíhào, jiābānfèi gēn gōngzī yīqǐ fā. Zhè shì yuángōng shǒucè, nǐ huíqù zǐxì kànkan.",null,"BODY950"],["新员工: 好的，谢谢您！ (Vâng, cảm ơn chị!)",null,null,"Xīn yuángōng: hǎo de, xièxienín!",null,"BODY951"],["人事: 不客气。下周一上午有新员工培训，别忘了参加。下个月公司还组织去下龙湾旅游，到时候记得报名！ (Không có gì. Sáng thứ 2 tuần sau có đào tạo nhân viên mới, đừng quên dự. Tháng sau công ty còn tổ chức đi Hạ Long, nhớ đăng ký nhé!)",null,null,"Rénshì: bù kèqi. Xiàzhōuyī shàngwǔ yǒu xīn yuángōng péixùn, biéwàngle cānjiā. Xiàgèyuè gōngsī hái zǔzhī qù Xiàlóng Wān lǚyóu, dàoshíhou jìde bàomíng!",null,"BODY952"],["情景对话 7 — KẾ TOÁN 财务 (đối chiếu chứng từ thanh toán với mua hàng)",null,null,"Qíngjǐng duìhuà | Cáiwù",null,"BODY953-C"],["采购: 刘姐，明达公司的货款这周能付吗？他们一直在催。 (Chị Lưu, tiền hàng công ty Minh Đạt tuần này trả được không? Họ cứ giục mãi.)",null,null,"Cǎigòu: Liújiě, míngdá gōngsī de huòkuǎn zhè zhōu néng fù ma? Tāmen yīzhí zài cuī.",null,"BODY954"],["会计: 我看一下……付款申请上缺了入库单，合同、发票和入库单缺一不可。 (Để chị xem… Đề nghị thanh toán thiếu phiếu nhập kho, hợp đồng, hóa đơn và phiếu nhập kho thiếu một cũng không được.)",null,null,"Kuàijì: wǒ kàn yīxià…… fùkuǎn shēnqǐng shàng quē le rùkù dān, hétong, fāpiào hé rùkù dān quēyībùkě.",null,"BODY955"],["采购: 不好意思，我忘了附上，我马上去仓库拿。 (Xin lỗi, em quên đính kèm, em xuống kho lấy ngay.)",null,null,"Cǎigòu: bùhǎoyìsi, wǒ wàng le fùshàng, wǒ mǎshàng qù cāngkù ná.",null,"BODY956"],["会计: 还有，这张发票的金额是一亿两千万盾，可是合同是一亿一千五百万盾，对不上。 (Còn nữa, hóa đơn này 120 triệu, hợp đồng lại 115 triệu, không khớp.)",null,null,"Kuàijì: háiyǒu, zhè zhāng fāpiào de jīn'é shì yīyìliǎngqiānwàn dùn, kěshì hétong shì yīyì yīqiānwǔbǎiwàn dùn, duìbùshàng.",null,"BODY957"],["采购: 哦，多出来的五百万是运费，我们之前邮件里确认过。 (À, 5 triệu chênh là phí vận chuyển, trước đó đã xác nhận qua email.)",null,null,"Cǎigòu: ó, duō chūlái de wǔbǎiwàn shì yùnfèi, wǒmen zhīqián yóujiàn lǐ quèrèn guò.",null,"BODY958"],["会计: 那你把邮件打印出来附上，或者让供应商把运费单独开一张发票。 (Vậy em in email đính kèm, hoặc bảo NCC xuất riêng hóa đơn phí vận chuyển.)",null,null,"Kuàijì: nà nǐ bǎ yóujiàn dǎyìn chūlái fùshàng, huòzhě ràng gōngyìngshāng bǎ yùnfèi dāndú kāi yīzhāng fāpiào.",null,"BODY959"],["采购: 好的。资料齐了以后，大概什么时候能付？ (Vâng. Đủ giấy tờ thì khoảng khi nào trả được ạ?)",null,null,"Cǎigòu: hǎo de. Zīliào qí le yǐhòu, dàgài shénme shíhou néng fù?",null,"BODY960"],["会计: 我们每周三、周五统一付款。你周三中午之前交齐，周三下午就能付。 (Bên chị trả tập trung thứ 4, thứ 6. Em nộp đủ trước trưa thứ 4 thì chiều thứ 4 trả được.)",null,null,"Kuàijì: wǒmen měizhōusān, zhōuwǔ tǒngyī fùkuǎn. Nǐ zhōusān zhōngwǔ zhīqián jiāoqí, zhōusān xiàwǔ jiù néng fù.",null,"BODY961"],["采购: 太好了，谢谢刘姐！ (Tốt quá, cảm ơn chị Lưu!)",null,null,"Cǎigòu: tàihǎole, xièxie Liújiě!",null,"BODY962"],["会计: 另外提醒一下，月底要结账，各部门二十五号之前要交齐单据，出差的费用也要在回来一周内报销。 (Nhắc thêm, cuối tháng khóa sổ, các phòng nộp đủ chứng từ trước ngày 25, chi phí công tác cũng phải hoàn ứng trong 1 tuần sau khi về.)",null,null,"Kuàijì: lìngwài tíxǐng yīxià, yuèdǐ yào jiézhàng, gè bùmén èrshíwǔ hào zhīqián yào jiāoqí dānjù, chūchāi de fèiyòng yě yào zài huílái yīzhōu nèi bàoxiāo.",null,"BODY963"],["采购: 明白，我会通知我们部门的同事。 (Đã rõ, em sẽ báo đồng nghiệp trong phòng.)",null,null,"Cǎigòu: míngbai, wǒhuì tōngzhī wǒmen bùmén de tóngshì.",null,"BODY964"],["QUY TRÌNH 工作流程 — Bài nói mẫu HSK5 (từ đơn hàng đến giao hàng, 5 bước)",null,null,"Gōngzuò liúchéng",null,"BODY965-C"],["我们公司的订单流程大概分五步。第一步，销售跟客户确认订单的型号、数量和交期，然后在系统里录入订单。第二步，计划部根据订单和产能排生产计划，同时算出物料需求。第三步，采购根据物料需求跟供应商下单，并跟进到货时间。第四步，物料到了以后，品质部先检验，合格的才能入库，然后生产部领料生产。第五步，产品做好以后，品质部做出货检验，仓库备货、装柜，销售通知客户发货，财务跟进收款。整个流程中，最关键的是信息要同步，任何一个环节出问题，都会影响交期。",null,null,"Wǒmen gōngsī de dìngdān liúchéng dàgài fēn wǔbù. Dìyībù, xiāoshòu gēn kèhù quèrèn dìngdān de xínghào, shùliàng hé jiāo qī, ránhòu zài xìtǒng lǐ lùrù dìngdān. Dì'èrbù, jìhuà bù gēnjù dìngdān hé chǎnnéng pái shēngchǎn jìhuà, tóngshí suàn chū wùliào xūqiú. Dìsānbù, cǎigòu gēnjù wùliào xūqiú gēn gōngyìngshāng xiàdān, bìng gēnjìn dàohuò shíjiān. Dìsìbù, wùliào dào le yǐhòu, pǐnzhì bù xiān jiǎnyàn, hégé de cáinéng rùkù, ránhòu shēngchǎn bù lǐngliào shēngchǎn. Dìwǔbù, chǎnpǐn zuòhǎo yǐhòu, pǐnzhì bù zuòchū huò jiǎnyàn, cāngkù bèihuò, zhuāng guì, xiāoshòu tōngzhī kèhù fāhuò, cáiwù gēnjìn shōukuǎn. Zhěnggè liúchéng zhōng, zuì guānjiàn de shì xìnxī yào tóngbù, rènhé yīgè huánjié chū wèntí, dōu huì yǐngxiǎng jiāo qī.",null,"BODY966"],["情景对话 8 — (HSK5) Họp liên phòng ban: đơn hàng trễ, các phòng đổ lỗi cho nhau",null,null,"Qíngjǐng duìhuà",null,"BODY967-C"],["经理: 今天开会主要讨论上周王总订单延误的问题。大家先说说情况。 (Họp hôm nay chủ yếu bàn việc đơn Vương tổng tuần trước bị trễ. Mọi người nói tình hình trước.)",null,null,"Jīnglǐ: jīntiān kāihuì zhǔyào tǎolùn shàngzhōu Wáng zǒng dìngdān yánwù de wèntí. Dàjiā xiān shuōshuo qíngkuàng.",null,"BODY968"],["生产: 我们生产线没问题，是物料晚到了三天，我们等料等了三天。 (Chuyền sản xuất không có vấn đề, vật tư về muộn 3 ngày, bên tôi chờ vật tư 3 ngày.)",null,null,"Shēngchǎn: wǒmen shēngchǎnxiàn méi wèntí, shì wùliào wǎn dào le sāntiān, wǒmen děng liào děng le sāntiān.",null,"BODY969"],["采购: 物料其实周一就到了，是品质部检验太慢，周四才入库。 (Vật tư thật ra thứ 2 đã về, là QC kiểm quá chậm, thứ 5 mới nhập kho.)",null,null,"Cǎigòu: wùliào qíshí zhōuyī jiù dào le, shì pǐnzhì bù jiǎnyàn tàimàn, zhōusì cái rùkù.",null,"BODY970"],["品质: 我们部门只有三个人，那周同时到了五批货，根本检不过来。而且采购没有提前告诉我们这批是急料。 (Phòng tôi chỉ có 3 người, tuần đó về cùng lúc 5 lô, kiểm không xuể. Mà mua hàng cũng không báo trước lô này là vật tư gấp.)",null,null,"Pǐnzhì: wǒmen bùmén zhǐyǒu sāngè rén, nà zhōu tóngshí dào le wǔ pīhuò, gēnběn jiǎn bù guòlái. Érqiě cǎigòu méiyǒu tíqián gàosu wǒmen zhè pī shì jí liào.",null,"BODY971"],["计划: 我在计划里标了\"急\"，可能大家没注意到。 (Tôi đã đánh dấu \"gấp\" trong kế hoạch, có lẽ mọi người không để ý.)",null,null,"Jìhuà: wǒ zài jìhuà lǐ biāo le \"jí\", kěnéng dàjiā méi zhùyì dào.",null,"BODY972"],["经理: 大家先别互相推卸责任。我们要找的是根本原因，不是找谁的错。 (Mọi người đừng đùn đẩy trách nhiệm. Cái cần tìm là nguyên nhân gốc, không phải lỗi của ai.)",null,null,"Jīnglǐ: dàjiā xiān bié hùxiāng tuīxièzérèn. Wǒmen yào zhǎo de shì gēnběnyuányīn, bùshì zhǎo shéi de cuò.",null,"BODY973"],["销售: 我同意。说白了，问题是信息不同步，每个部门只看自己的那一部分。 (Tôi đồng ý. Nói thẳng ra, vấn đề là thông tin không đồng bộ, mỗi phòng chỉ nhìn phần của mình.)",null,null,"Xiāoshòu: wǒ tóngyì. Shuōbáile, wèntí shì xìnxī bù tóngbù, měigè bùmén zhǐ kàn zìjǐ de nà yībùfen.",null,"BODY974"],["计划: 我建议每天早上开一个十五分钟的产销协调会，把急单和问题当场说清楚。 (Tôi đề nghị mỗi sáng họp điều phối sản xuất – kinh doanh 15 phút, nói rõ đơn gấp và vấn đề tại chỗ.)",null,null,"Jìhuà: wǒ jiànyì měitiān zǎoshang kāi yīgè shíwǔfēnzhōng de chǎnxiāo xiétiáohuì, bǎ jí dān hé wèntí dāngchǎng shuō qīngchu.",null,"BODY975"],["采购: 我们还可以建一个共享表格，订单、物料到货、检验、生产进度都实时更新。 (Có thể lập bảng chia sẻ chung, cập nhật đơn, vật tư về, kiểm tra, tiến độ sản xuất theo thời gian thực.)",null,null,"Cǎigòu: wǒmen hái kěyǐ jiàn yīgè gòngxiǎng biǎogé, dìngdān, wùliào dàohuò, jiǎnyàn, shēngchǎn jìndù dōu shíshí gèngxīn.",null,"BODY976"],["品质: 如果是急料，希望采购提前一天通知我们，我们可以优先检验。 (Nếu là vật tư gấp, mong mua hàng báo trước một ngày, bên tôi ưu tiên kiểm.)",null,null,"Pǐnzhì: rúguǒ shì jí liào, xīwàng cǎigòu tíqián yītiān tōngzhī wǒmen, wǒmen kěyǐ yōuxiān jiǎnyàn.",null,"BODY977"],["销售: 另外，订单变更必须提前四十八小时通知，并且要经过经理确认。 (Ngoài ra, thay đổi đơn phải báo trước 48h và có giám đốc xác nhận.)",null,null,"Xiāoshòu: lìngwài, dìngdān biàngèng bìxū tíqián sìshíbā xiǎoshí tōngzhī, bìngqiě yào jīngguò jīnglǐ quèrèn.",null,"BODY978"],["经理: 好，我总结一下：第一，从明天开始每天八点开协调会；第二，小黄负责建共享表格；第三，急料提前一天通知品质部。大家有没有不同意见？ (Được, tôi tổng kết: Một, từ mai 8h mỗi sáng họp điều phối; hai, Tiểu Hoàng lập bảng chia sẻ; ba, vật tư gấp báo QC trước một ngày. Mọi người có ý kiến khác không?)",null,null,"Jīnglǐ: hǎo, wǒ zǒngjié yīxià: dìyī, cóng míngtiān kāishǐ měitiān bādiǎn kāi xiétiáohuì; dì'èr, Xiǎo Huáng fùzé jiàn gòngxiǎng biǎogé; dìsān, jí liào tíqián yītiān tōngzhī pǐnzhì bù. Dàjiā yǒuméiyǒu bùtóng yìjiàn?",null,"BODY979"],["全体: 没有。 (Không ạ.)",null,null,"Quántǐ: méiyǒu.",null,"BODY980"],["经理: 那就这么定了，下周我们再看看效果。 (Vậy chốt thế, tuần sau xem lại hiệu quả.)",null,null,"Jīnglǐ: nà jiù zhème dìng le, xiàzhōu wǒmen zài kànkan xiàoguǒ.",null,"BODY981"],["引导练习 GUIDED SPEAKING — HS nói về chính công việc của mình",null,null,"Yǐndǎo liànxí",null,"BODY982-C"],["1. Hỏi: 你的岗位是什么？主要负责哪三件事？ (Vị trí của bạn là gì? Phụ trách chính 3 việc gì?)",null,null,"Nǐ de gǎngwèi shì shénme? Zhǔyào fùzé nǎ sānjiàn shì?",null,"BODY983"],["Đáp: 我是计划员，主要负责三件事：排生产计划、算物料需求、跟进生产进度。 (Tôi là nhân viên kế hoạch, phụ trách 3 việc: xếp kế hoạch sản xuất, tính nhu cầu vật tư, theo dõi tiến độ.)",null,null,"Wǒ shì jìhuà yuán, zhǔyào fùzé sānjiàn shì: pái shēngchǎn jìhuà, suàn wùliào xūqiú, gēnjìn shēngchǎn jìndù.",null,"BODY984"],["2. Hỏi: 请描述一下你典型的一天。 (Mô tả một ngày làm việc điển hình.)",null,null,"Qǐng miáoshù yīxià nǐ diǎnxíng de yītiān.",null,"BODY985"],["Đáp: 早上八点开协调会，九点更新计划，上午跟采购确认物料，下午去车间看进度，下班前做日报表。 (8h họp điều phối, 9h cập nhật kế hoạch, sáng xác nhận vật tư với mua hàng, chiều xuống xưởng xem tiến độ, trước khi về làm báo cáo ngày.)",null,null,"Zǎoshang bādiǎn kāi xiétiáohuì, jiǔdiǎn gèngxīn jìhuà, shàngwǔ gēn cǎigòu quèrèn wùliào, xiàwǔ qù chējiān kàn jìndù, xiàbān qián zuò rìbàobiǎo.",null,"BODY986"],["3. Hỏi: 你的工作需要跟哪些部门配合？怎么配合？ (Công việc cần phối hợp với những phòng nào? Phối hợp thế nào?)",null,null,"Nǐ de gōngzuò xūyào gēn nǎxiē bùmén pèihé? Zěnme pèihé?",null,"BODY987"],["Đáp: 我跟销售、采购和生产配合最多。销售给我订单，我给采购物料需求，再把计划发给生产。 (Phối hợp nhiều nhất với sales, mua hàng và sản xuất. Sales đưa đơn cho tôi, tôi gửi nhu cầu vật tư cho mua hàng, rồi gửi kế hoạch cho sản xuất.)",null,null,"Wǒ gēn xiāoshòu, cǎigòu hé shēngchǎn pèihé zuì duō. Xiāoshòu gěi wǒ dìngdān, wǒ gěi cǎigòu wùliào xūqiú, zài bǎ jìhuà fāgěi shēngchǎn.",null,"BODY988"],["4. Hỏi: 你工作中遇到过最难处理的问题是什么？你是怎么解决的？ (Vấn đề khó xử lý nhất? Giải quyết thế nào?)",null,null,"Nǐ gōngzuò zhōng yùdào guò zuì nán chǔlǐ de wèntí shì shénme? Nǐ shì zěnme jiějué de?",null,"BODY989"],["Đáp: 最难的是客户临时加急单。我会先看物料和产能，然后提出两个方案给经理选，比如加班或者分批交货。 (Khó nhất là khách đột xuất thêm đơn gấp. Tôi xem vật tư và công suất trước, rồi đưa 2 phương án cho giám đốc chọn, như tăng ca hoặc giao từng đợt.)",null,null,"Zuì nán de shì kèhù línshí jiājí dān. Wǒhuì xiān kàn wùliào hé chǎnnéng, ránhòu tíchū liǎnggè fāng'àn gěi jīnglǐ xuǎn, bǐrú jiābān huòzhě fēnpījiāohuò.",null,"BODY990"],["5. Hỏi: (HSK5) 如果让你改进一个工作流程，你会改哪个？为什么？ (Nếu được cải tiến một quy trình, bạn sẽ chọn cái nào? Vì sao?)",null,null,"Rúguǒ ràng nǐ gǎijìn yīgè gōngzuò liúchéng, nǐ huì gǎi nǎge? Wèishénme?",null,"BODY991"],["Đáp: 我会改订单变更的流程。之所以经常延误，主要是因为销售改订单没有提前通知。为了避免这种情况，我建议所有变更都要提前四十八小时在系统里提交。 (Tôi sẽ cải tiến quy trình thay đổi đơn. Sở dĩ hay trễ chủ yếu vì sales đổi đơn không báo trước. Để tránh, tôi đề nghị mọi thay đổi phải gửi trên hệ thống trước 48h.)",null,null,"Wǒhuì gǎi dìngdān biàngèng de liúchéng. Zhīsuǒyǐ jīngcháng yánwù, zhǔyào shìyīnwèi xiāoshòu gǎi dìngdān méiyǒu tíqián tōngzhī. Wèile bìmiǎn zhèzhǒng qíngkuàng, wǒ jiànyì suǒyǒu biàngèng dōu yào tíqián sìshíbā xiǎoshí zài xìtǒng lǐ tíjiāo.",null,"BODY992"],["情景模拟 ROLE-PLAY — HS (nhân viên cũ) hướng dẫn GV (nhân viên mới) ngày đầu. Vòng 2: phát sinh sự cố ngay trong ngày",null,null,"Qíngjǐng mónǐ",null,"BODY993-C"],["HS: 欢迎你加入我们部门！我先带你熟悉一下工作环境。这边是仓库办公室，那边是成品区。 (Chào mừng bạn vào phòng! Mình dẫn bạn làm quen môi trường. Bên này là văn phòng kho, bên kia khu thành phẩm.)",null,null,"Huānyíng nǐ jiārù wǒmen bùmén! Wǒ xiān dài nǐ shúxi yīxià gōngzuò huánjìng. Zhèbiān shì cāngkù bàngōngshì, nàbiān shì chéngpǐn qū.",null,"BODY994"],["GV: 我第一周主要做什么？ (Tuần đầu tôi chủ yếu làm gì?)",null,null,"Wǒ dìyīzhōu zhǔyào zuò shénme?",null,"BODY995"],["HS: 第一周你先跟着我学收货和录系统，第二周开始自己负责发货。 (Tuần đầu bạn theo mình học nhận hàng và nhập hệ thống, tuần thứ hai bắt đầu tự phụ trách xuất hàng.)",null,null,"Dìyīzhōu nǐ xiān gēnzhe wǒ xué shōuhuò hé lù xìtǒng, dì'èrzhōu kāishǐ zìjǐ fùzé fāhuò.",null,"BODY996"],["GV: 收货的时候要注意什么？ (Nhận hàng cần chú ý gì?)",null,null,"Shōuhuò de shíhou yào zhùyì shénme?",null,"BODY997"],["HS: 最重要的是核对数量和型号，有破损一定要拍照，然后马上告诉我。 (Quan trọng nhất là đối chiếu số lượng và mã hàng, có hư hỏng phải chụp ảnh, rồi báo mình ngay.)",null,null,"Zuì zhòngyào de shì héduì shùliàng hé xínghào, yǒu pòsǔn yīdìng yào pāizhào, ránhòu mǎshàng gàosu wǒ.",null,"BODY998"],["GV: 系统用的是什么软件？ (Hệ thống dùng phần mềm gì?)",null,null,"Xìtǒng yòng de shì shénme ruǎnjiàn?",null,"BODY999"],["HS: 我们用ERP系统，下午我给你开账号，再教你怎么做入库单。 (Dùng hệ thống ERP, chiều mình mở tài khoản rồi chỉ bạn cách làm phiếu nhập kho.)",null,null,"Wǒmen yòng ERP xìtǒng, xiàwǔ wǒ gěi nǐ kāi zhànghào, zài jiào nǐ zěnme zuò rùkù dān.",null,"BODY1000"],["GV: (biến cố) 刚才供应商送来的货少了两箱，司机说他们装的时候是够的，怎么办？ (Vừa rồi NCC giao thiếu 2 thùng, tài xế bảo lúc bốc là đủ, làm sao?)",null,null,"Gāngcái gōngyìngshāng sònglái de huò shǎo le liǎngxiāng, sījī shuō tāmen zhuāng de shíhou shì gòu de, zěnmebàn?",null,"BODY1001"],["HS: 别着急。你先让司机在送货单上写明\"实收数量\"并签字，我们拍照留证。 (Đừng cuống. Bạn bảo tài xế ghi rõ \"số lượng thực nhận\" trên phiếu giao và ký, mình chụp ảnh làm bằng chứng.)",null,null,"Biézháojí. Nǐ xiān ràng sījī zài sònghuò dān shàng xiěmíng \"shíshōu shùliàng\" bìng qiānzì, wǒmen pāizhào liú zhèng.",null,"BODY1002"],["GV: 然后呢？ (Rồi sao nữa?)",null,null,"Ránhòu ne?",null,"BODY1003"],["HS: 然后我给采购打电话，让他们跟供应商核对，我们这边只按实收数量入库。 (Rồi mình gọi mua hàng để họ đối chiếu với NCC, bên mình chỉ nhập kho theo số thực nhận.)",null,null,"Ránhòu wǒ gěi cǎigòu dǎdiànhuà, ràng tāmen gēn gōngyìngshāng héduì, wǒmen zhèbiān zhǐ àn shíshōu shùliàng rùkù.",null,"BODY1004"],["GV: 明白了，以后我遇到这种情况就这样处理。 (Hiểu rồi, sau này gặp tình huống vậy tôi sẽ xử lý như thế.)",null,null,"Míngbai le, yǐhòu wǒ yùdào zhèzhǒng qíngkuàng jiù zhèyàng chǔlǐ.",null,"BODY1005"],["Biến thể theo vị trí: Sales hướng dẫn cách báo giá / Mua hàng hướng dẫn so giá NCC / Kế hoạch hướng dẫn xếp lịch khi có đơn gấp / Kế toán hướng dẫn hồ sơ thanh toán.",null,null,null,null,"BODY1006"],["纠错与升级 FEEDBACK — Lỗi người Việt hay mắc (✗ sai → ✓ đúng)",null,null,"Jiūcuò yǔ shēngjí",null,"BODY1007-C"],["✗ 我负责于销售。 → ✓ 我负责销售。 (负责 + tân ngữ trực tiếp.)",null,null,"Wǒ fùzé yú xiāoshòu. | Wǒ fùzé xiāoshòu. | Fùzé",null,"BODY1008"],["✗ 我是销售部的员工在ABC公司。 → ✓ 我是ABC公司销售部的员工。",null,null,"Wǒ shì xiāoshòubù de yuángōng zài ABC gōngsī. | Wǒ shì ABC gōngsī xiāoshòubù de yuángōng.",null,"BODY1009"],["✗ 我每天跟进订单很多。 → ✓ 我每天要跟进很多订单。",null,null,"Wǒ měitiān gēnjìn dìngdān hěnduō. | Wǒ měitiān yào gēnjìn hěnduō dìngdān.",null,"BODY1010"],["✗ 我汇报给经理。 → ✓ 我向经理汇报。/ 我给经理汇报工作。",null,null,"Wǒ huìbào gěi jīnglǐ. | Wǒ xiàng jīnglǐ huìbào. / | Wǒ gěi jīnglǐ huìbàogōngzuò.",null,"BODY1011"],["✗ 交货时间是很急。 → ✓ 交期很紧。 (Tính từ làm vị ngữ không cần 是.)",null,null,"Jiāohuò shíjiān shì hěn jí. | Jiāo qī hěn jǐn. | Shì .",null,"BODY1012"],["✗ 这批货是不合格。 → ✓ 这批货不合格。",null,null,"Zhè pīhuò shì bù hégé. | Zhè pīhuò bù hégé.",null,"BODY1013"],["Từ dễ nhầm: 报价 (báo giá) ≠ 报告 (báo cáo); 库存 (tồn kho) ≠ 仓库 (nhà kho); 交期 (hạn giao) ≠ 周期 (chu kỳ).",null,null,"Bàojià | Bàogào | Kùcún | Cāngkù | Jiāo qī | Zhōuqī",null,"BODY1014"],["Phát âm: 职责 zhízé; 采购 cǎigòu; 协调 xiétiáo; 盘点 pándiǎn; 审批 shěnpī.",null,null,"Zhízé | Cǎigòu | Xiétiáo | Pándiǎn | Shěnpī",null,"BODY1015"],["课后作业 HOMEWORK",null,null,"Kèhòu zuòyè",null,"BODY1016-C"],["Ghi âm giới thiệu công việc của chính mình: HSK4 2 phút (vị trí + 3 nhiệm vụ + 1 khó khăn); HSK5 3–4 phút (quy trình 5 bước + 1 vấn đề liên phòng ban + đề xuất cải tiến).",null,null,null,null,"BODY1017"],["Luyện cặp: đóng lại hội thoại đúng vị trí của mình, sau đó thay toàn bộ tên hàng, số lượng, tên công ty bằng thông tin thật.",null,null,null,null,"BODY1018"],["GV chấm 5 tiêu chí: lưu loát, chính xác, tự nhiên, tương tác, logic; buổi sau ôn 5 phút.",null,null,null,null,"BODY1019"],["Buổi 06 — 工作沟通与任务安排 Giao nhiệm vụ và tiến độ",null,null,"Gōngzuò gōutōng yǔ rènwù ānpái",null,"BODY1020-B"],["MỤC TIÊU & THỜI GIAN",null,null,null,null,"BODY1021-C"],["HSK4: Nhận nhiệm vụ, hỏi thời hạn, báo cáo tiến độ. HSK5: Phân chia nguồn lực, xử lý chậm tiến độ.",null,null,null,null,"BODY1022"],["热身 WARM-UP — Hỏi nhanh, trả lời không nhìn tài liệu",null,null,"Rèshēn",null,"BODY1024-C"],["1. Hỏi: 你这个星期手上有几项工作？哪项最急？ (Tuần này bạn có mấy việc trong tay? Việc nào gấp nhất?)",null,null,"Nǐ zhège xīngqī shǒushàng yǒu jǐxiàng gōngzuò? Nǎxiàng zuì jí?",null,"BODY1025"],["Đáp: 我手上有四项工作，最急的是给客户做报价，明天中午之前就要发出去。 (Tôi có 4 việc, gấp nhất là làm báo giá cho khách, trước trưa mai phải gửi đi.)",null,null,"Wǒ shǒushàng yǒu sìxiàng gōngzuò, zuì jí de shì gěi kèhù zuò bàojià, míngtiān zhōngwǔ zhīqián jiùyào fāchū qù.",null,"BODY1026"],["2. Hỏi: 老板给你安排工作的时候，一般用什么方式？ (Sếp giao việc cho bạn thường bằng cách nào?)",null,null,"Lǎobǎn gěi nǐ ānpái gōngzuò de shíhou, yībān yòng shénme fāngshì?",null,"BODY1027"],["Đáp: 一般是在微信群里说，比较重要的会当面讲，然后再发邮件确认。 (Thường nói trong nhóm WeChat, việc quan trọng thì nói trực tiếp rồi gửi email xác nhận.)",null,null,"Yībān shì zài wēi xìn qún lǐ shuō, bǐjiào zhòngyào de huì dāngmiàn jiǎng, ránhòu zài fāyóujiàn quèrèn.",null,"BODY1028"],["3. Hỏi: 你有没有因为别人耽误了自己的工作？ (Có khi nào bạn bị người khác làm chậm việc của mình không?)",null,null,"Nǐ yǒuméiyǒu yīnwèi biérén dānwù le zìjǐ de gōngzuò?",null,"BODY1029"],["Đáp: 有。上个月财务晚了两天给我数据，我的报告也只好推迟交。 (Có. Tháng trước kế toán gửi số liệu muộn 2 ngày, báo cáo của tôi cũng đành nộp muộn.)",null,null,"Yǒu. Shànggèyuè cáiwù wǎn le liǎngtiān gěi wǒ shùjù, wǒ de bàogào yě zhǐhǎo tuīchí jiāo.",null,"BODY1030"],["语言输入 INPUT — Cụm từ trọng tâm",null,null,"Yǔyán shūrù",null,"BODY1031-C"],["1. 截止日期 (hạn chót): 这个报告的截止日期是本周五下午五点。 (Hạn chót báo cáo này là 5h chiều thứ 6 tuần này.)",null,null,"Jiézhǐ rìqī | Zhège bàogào de jiézhǐ rìqī shì běn zhōuwǔ xiàwǔ wǔdiǎn.",null,"BODY1032"],["2. 优先处理 (ưu tiên xử lý): 客户投诉的问题要优先处理。 (Vấn đề khách khiếu nại phải ưu tiên xử lý.)",null,null,"Yōuxiān chǔlǐ | Kèhù tóusù de wèntí yào yōuxiān chǔlǐ.",null,"BODY1033"],["3. 确认 (xác nhận): 发货之前请再跟客户确认一下地址。 (Trước khi giao hàng xác nhận lại địa chỉ với khách.)",null,null,"Quèrèn | Fāhuò zhīqián qǐng zài gēn kèhù quèrèn yīxià dìzhǐ.",null,"BODY1034"],["4. 耽误 (làm chậm, làm lỡ): 不好意思，耽误你的时间了。/ 物料晚到耽误了生产。 (Xin lỗi đã làm mất thời gian của bạn. / Vật tư về muộn làm chậm sản xuất.)",null,null,"Dānwù | Bùhǎoyìsi, dānwù nǐ de shíjiān le. / | Wùliào wǎn dào dānwù le shēngchǎn.",null,"BODY1035"],["5. 进度 (tiến độ): 目前项目进度是百分之七十。 (Hiện tiến độ dự án đạt 70%.)",null,null,"Jìndù | Mùqián xiàngmù jìndù shì bǎifēnzhīqīshí.",null,"BODY1036"],["6. 分配任务 (phân công nhiệm vụ): 经理每周一给大家分配任务。 (Giám đốc phân công nhiệm vụ cho mọi người vào thứ 2 hằng tuần.)",null,null,"Fēnpèirènwù | Jīnglǐ měizhōu yī gěi dàjiā fēnpèirènwù.",null,"BODY1037"],["7. 落后 / 提前完成 (chậm so với kế hoạch / hoàn thành sớm): 进度落后了两天。/ 我们提前一天完成了任务。 (Tiến độ chậm 2 ngày. / Chúng tôi hoàn thành sớm một ngày.)",null,null,"Luòhòu | Tíqiánwánchéng | Jìndù luòhòu le liǎngtiān. / | Wǒmen tíqián yītiān wánchéng le rènwù.",null,"BODY1038"],["8. 跟进 (theo dõi): 这件事你负责跟进，每天下午给我更新一次。 (Việc này bạn theo dõi, mỗi chiều cập nhật cho tôi một lần.)",null,null,"Gēnjìn | Zhèjiàn shì nǐ fùzé gēnjìn, měitiān xiàwǔ gěi wǒ gèngxīn yīcì.",null,"BODY1039"],["9. 抓紧 (tranh thủ, khẩn trương): 时间不多了，大家抓紧一点。 (Không còn nhiều thời gian, mọi người khẩn trương lên.)",null,null,"Zhuājǐn | Shíjiān bù duō le, dàjiā zhuājǐn yīdiǎn.",null,"BODY1040"],["10. 人手不够 (thiếu người): 这周人手不够，能不能从别的部门借两个人？ (Tuần này thiếu người, mượn 2 người từ phòng khác được không?)",null,null,"Rénshǒu bùgòu | Zhè zhōu rénshǒu bùgòu, néng bùnéng cóng biéde bùmén jiè liǎnggè rén?",null,"BODY1041"],["11. 来不及 / 赶得上 (không kịp / kịp): 按现在的速度，月底恐怕赶不上。 (Theo tốc độ hiện tại, cuối tháng e là không kịp.)",null,null,"Láibùjí | Gǎndeshàng | Àn xiànzài de sùdù, yuèdǐ kǒngpà gǎnbùshàng.",null,"BODY1042"],["12. 同步 (đồng bộ, cập nhật cho nhau): 会议结束以后，我会把结果同步给大家。 (Họp xong tôi sẽ cập nhật kết quả cho mọi người.)",null,null,"Tóngbù | Huìyì jiéshù yǐhòu, wǒhuì bǎ jiéguǒ tóngbù gěi dàjiā.",null,"BODY1043"],["句型 MẪU CÂU — Mỗi mẫu kèm câu áp dụng",null,null,"Jùxíng",null,"BODY1044-C"],["1. 麻烦你先确认一下…… (Phiền bạn xác nhận trước …)",null,null,"Máfan nǐ xiān quèrèn yīxià……",null,"BODY1045"],["Ví dụ: 麻烦你先确认一下客户要的数量，再做报价。 (Phiền bạn xác nhận số lượng khách cần trước rồi mới làm báo giá.)",null,null,"Máfan nǐ xiān quèrèn yīxià kèhù yào de shùliàng, zài zuò bàojià.",null,"BODY1046"],["Ví dụ: 麻烦你先确认一下仓库还有没有库存。 (Phiền bạn xác nhận trước xem kho còn tồn không.)",null,null,"Máfan nǐ xiān quèrèn yīxià cāngkù háiyǒu méiyǒu kùcún.",null,"BODY1047"],["2. 目前进度是……，预计……能完成 (Tiến độ hiện tại là …, dự kiến … sẽ xong)",null,null,"Mùqián jìndù shì……, yùjì…… néng wánchéng",null,"BODY1048"],["Ví dụ: 目前进度是百分之六十，预计周四能完成。 (Tiến độ hiện đạt 60%, dự kiến thứ 5 xong.)",null,null,"Mùqián jìndù shì bǎifēnzhīliùshí, yùjì zhōusì néng wánchéng.",null,"BODY1049"],["Ví dụ: 目前三个部分已经做完了两个，预计明天下午能全部完成。 (Hiện 3 phần đã xong 2, dự kiến chiều mai xong hết.)",null,null,"Mùqián sāngè bùfen yǐjīng zuò wán le liǎnggè, yùjì míngtiān xiàwǔ néng quánbù wánchéng.",null,"BODY1050"],["3. 这件事最晚什么时候要？ (Việc này muộn nhất khi nào cần?)",null,null,"Zhèjiàn shì zuì wǎn shénme shíhou yào?",null,"BODY1051"],["Ví dụ: 这份资料最晚什么时候要？我今天还有两个会。 (Tài liệu này muộn nhất khi nào cần? Hôm nay tôi còn 2 cuộc họp.)",null,null,"Zhèfèn zīliào zuì wǎn shénme shíhou yào? Wǒ jīntiān háiyǒu liǎnggè huì.",null,"BODY1052"],["Ví dụ: 经理，这个报价最晚什么时候要发给客户？ (Giám đốc, báo giá này muộn nhất khi nào phải gửi khách?)",null,null,"Jīnglǐ, zhège bàojià zuì wǎn shénme shíhou yào fāgěi kèhù?",null,"BODY1053"],["4. 先……，……的事可以往后放一放 (Làm … trước, việc … có thể để lại sau)",null,null,"Xiān……,…… de shì kěyǐ wǎnghòu fàng yī fàng",null,"BODY1054"],["Ví dụ: 先把客户的急单处理好，内部报表的事可以往后放一放。 (Xử lý đơn gấp của khách trước, báo cáo nội bộ để sau.)",null,null,"Xiān bǎ kèhù de jí dān chǔlǐ hǎo, nèibù bàobiǎo de shì kěyǐ wǎnghòu fàng yī fàng.",null,"BODY1055"],["Ví dụ: 先准备明天的会议资料，培训的事可以往后放一放。 (Chuẩn bị tài liệu họp ngày mai trước, việc đào tạo để sau.)",null,null,"Xiān zhǔnbèi míngtiān de huìyì zīliào, péixùn de shì kěyǐ wǎnghòu fàng yī fàng.",null,"BODY1056"],["5. 由于……，……可能会推迟 (Do …, … có thể sẽ chậm)",null,null,"Yóuyú……,…… kěnéng huì tuīchí",null,"BODY1057"],["Ví dụ: 由于供应商延误，交货时间可能会推迟三天。 (Do NCC giao trễ, thời gian giao hàng có thể chậm 3 ngày.)",null,null,"Yóuyú gōngyìngshāng yánwù, jiāohuò shíjiān kěnéng huì tuīchí sāntiān.",null,"BODY1058"],["Ví dụ: 由于系统升级，今天的数据可能会推迟到晚上才能出来。 (Do nâng cấp hệ thống, số liệu hôm nay có thể tối mới có.)",null,null,"Yóuyú xìtǒngshēngjí, jīntiān de shùjù kěnéng huì tuīchí dào wǎnshàng cáinéng chūlái.",null,"BODY1059"],["6. 如果……的话，我需要…… (Nếu …, tôi cần …)",null,null,"Rúguǒ…… dehuà, wǒ xūyào……",null,"BODY1060"],["Ví dụ: 如果周五要交的话，我需要财务今天把数据给我。 (Nếu thứ 6 phải nộp thì tôi cần kế toán hôm nay gửi số liệu.)",null,null,"Rúguǒ zhōuwǔ yào jiāo dehuà, wǒ xūyào cáiwù jīntiān bǎ shùjù gěi wǒ.",null,"BODY1061"],["Ví dụ: 如果要同时做这两个项目的话，我需要再加一个人。 (Nếu phải làm cùng lúc 2 dự án, tôi cần thêm một người.)",null,null,"Rúguǒ yào tóngshí zuò zhè liǎnggè xiàngmù dehuà, wǒ xūyào zài jiā yīgè rén.",null,"BODY1062"],["7. 我这边已经……了，就等…… (Bên tôi đã … rồi, chỉ chờ …)",null,null,"Wǒ zhèbiān yǐjīng…… le, jiù děng……",null,"BODY1063"],["Ví dụ: 我这边已经准备好了，就等客户确认。 (Bên tôi chuẩn bị xong rồi, chỉ chờ khách xác nhận.)",null,null,"Wǒ zhèbiān yǐjīng zhǔnbèi hǎo le, jiù děng kèhù quèrèn.",null,"BODY1064"],["Ví dụ: 合同我这边已经签了，就等对方盖章。 (Hợp đồng bên tôi ký rồi, chỉ chờ bên kia đóng dấu.)",null,null,"Hétong wǒ zhèbiān yǐjīng qiān le, jiù děng duìfāng gàizhāng.",null,"BODY1065"],["8. 有什么问题随时跟我说 (Có vấn đề gì cứ nói với tôi bất cứ lúc nào)",null,null,"Yǒu shénme wèntí suíshí gēn wǒ shuō",null,"BODY1066"],["Ví dụ: 你刚来，有什么问题随时跟我说，别自己扛着。 (Bạn mới đến, có gì cứ nói với tôi, đừng tự ôm hết.)",null,null,"Nǐ gāng lái, yǒu shénme wèntí suíshí gēn wǒ shuō, bié zìjǐ kángzhe.",null,"BODY1067"],["9. (HSK5) 考虑到……，我建议把……调给…… (Xét đến …, tôi đề nghị điều … sang …)",null,null,"Kǎolǜ dào……, wǒ jiànyì bǎ…… diào gěi……",null,"BODY1068"],["Ví dụ: 考虑到A项目更急，我建议把小林暂时调给A项目。 (Xét đến việc dự án A gấp hơn, tôi đề nghị tạm điều Tiểu Lâm sang dự án A.)",null,null,"Kǎolǜ dào A xiàngmù gèng jí, wǒ jiànyì bǎ Xiǎo Lín zànshí diào gěi A xiàngmù.",null,"BODY1069"],["Ví dụ: 考虑到二号线的订单比较少，我建议把两个工人调到一号线。 (Xét chuyền 2 ít đơn, tôi đề nghị điều 2 công nhân sang chuyền 1.)",null,null,"Kǎolǜ dào èrhàoxiàn de dìngdān bǐjiào shǎo, wǒ jiànyì bǎ liǎnggè gōngrén diào dào yīhàoxiàn.",null,"BODY1070"],["10. (HSK5) 为了赶上……，我们可以…… (Để kịp …, chúng ta có thể …)",null,null,"Wèile gǎnshàng……, wǒmen kěyǐ……",null,"BODY1071"],["Ví dụ: 为了赶上交期，我们可以周末加班，或者把一部分外包出去。 (Để kịp hạn giao, có thể tăng ca cuối tuần hoặc thuê ngoài một phần.)",null,null,"Wèile gǎnshàng jiāo qī, wǒmen kěyǐ zhōumò jiābān, huòzhě bǎ yībùfen wài bāo chūqù.",null,"BODY1072"],["Ví dụ: 为了赶上展会，我们可以先做样品，正式产品下个月再做。 (Để kịp triển lãm, có thể làm mẫu trước, sản phẩm chính thức tháng sau làm.)",null,null,"Wèile gǎnshàng zhǎnhuì, wǒmen kěyǐ xiān zuò yàngpǐn, zhèngshì chǎnpǐn xiàgèyuè zài zuò.",null,"BODY1073"],["情景对话 1 — Nhận nhiệm vụ từ sếp, hỏi rõ yêu cầu và thời hạn",null,null,"Qíngjǐng duìhuà",null,"BODY1074-C"],["经理: 小阮，你过来一下，有个任务交给你。 (Tiểu Nguyễn, qua đây chút, có việc giao cho bạn.)",null,null,"Jīnglǐ: Xiǎo Ruǎn, nǐ guòlái yīxià, yǒu gè rènwù jiāogěi nǐ.",null,"BODY1075"],["小阮: 好的，经理，什么任务？ (Vâng giám đốc, việc gì ạ?)",null,null,"Xiǎo Ruǎn: hǎo de, jīnglǐ, shénme rènwù?",null,"BODY1076"],["经理: 下个月中国总部要来人检查，我想让你准备一份今年的销售总结。 (Tháng sau tổng bộ TQ cử người sang kiểm tra, tôi muốn bạn chuẩn bị bản tổng kết bán hàng năm nay.)",null,null,"Jīnglǐ: xiàgèyuè Zhōngguó zǒngbù yào lái rén jiǎnchá, wǒ xiǎng ràng nǐ zhǔnbèi yīfèn jīnnián de xiāoshòu zǒngjié.",null,"BODY1077"],["小阮: 没问题。请问总结需要包括哪些内容？ (Không vấn đề. Xin hỏi tổng kết cần gồm những nội dung gì ạ?)",null,null,"Xiǎo Ruǎn: méi wèntí. Qǐngwèn zǒngjié xūyào bāokuò nǎxiē nèiróng?",null,"BODY1078"],["经理: 主要是三部分：今年的销售数据、主要客户的情况，还有明年的计划。 (Chủ yếu 3 phần: số liệu bán hàng năm nay, tình hình khách hàng chính, và kế hoạch năm sau.)",null,null,"Jīnglǐ: zhǔyào shì sān bùfen: jīnnián de xiāoshòu shùjù, zhǔyào kèhù de qíngkuàng, háiyǒu míngnián de jìhuà.",null,"BODY1079"],["小阮: 好的。是做成PPT还是Word文件？ (Vâng. Làm dạng PPT hay file Word ạ?)",null,null,"Xiǎo Ruǎn: hǎo de. Shì zuòchéng PPT háishì W | Wénjiàn?",null,"BODY1080"],["经理: 做PPT吧，要在会上演示，最好用中文，十五页左右。 (Làm PPT, phải trình chiếu trong họp, tốt nhất bằng tiếng Trung, khoảng 15 trang.)",null,null,"Jīnglǐ: zuò PPT ba, yào zài huìshàng yǎnshì, zuìhǎo yòng Zhōngwén, shíwǔ yè zuǒyòu.",null,"BODY1081"],["小阮: 这份总结最晚什么时候要？ (Bản tổng kết muộn nhất khi nào cần ạ?)",null,null,"Xiǎo Ruǎn: zhèfèn zǒngjié zuì wǎn shénme shíhou yào?",null,"BODY1082"],["经理: 下周五之前给我初稿，我看完再给你意见。 (Trước thứ 6 tuần sau gửi tôi bản nháp, tôi xem rồi góp ý.)",null,null,"Jīnglǐ: xià zhōuwǔ zhīqián gěi wǒ chūgǎo, wǒ kàn wán zài gěi nǐ yìjiàn.",null,"BODY1083"],["小阮: 明白。销售数据我需要找财务要，可能要两三天。 (Rõ ạ. Số liệu bán hàng em phải xin kế toán, có thể mất 2–3 ngày.)",null,null,"Xiǎo Ruǎn: míngbai. Xiāoshòu shùjù wǒ xūyào zhǎo cáiwù yào, kěnéng yào liǎngsāntiān.",null,"BODY1084"],["经理: 我今天就跟财务打个招呼，让他们优先处理。 (Hôm nay tôi báo trước với kế toán để họ ưu tiên.)",null,null,"Jīnglǐ: wǒ jīntiān jiù gēn cáiwù dǎgèzhāohu, ràng tāmen yōuxiān chǔlǐ.",null,"BODY1085"],["小阮: 谢谢经理。另外，我手上还有王总的报价，周三要发，这两件事哪个优先？ (Cảm ơn giám đốc. Ngoài ra em còn báo giá cho Vương tổng, thứ 4 phải gửi, hai việc này ưu tiên việc nào ạ?)",null,null,"Xiǎo Ruǎn: xièxie jīnglǐ. Lìngwài, wǒ shǒushàng háiyǒu Wáng zǒng de bàojià, zhōusān yào fā, zhè liǎngjiànshì nǎge yōuxiān?",null,"BODY1086"],["经理: 报价优先，客户的事不能等。总结你周三以后再集中做。 (Báo giá trước, việc của khách không đợi được. Tổng kết bạn làm tập trung sau thứ 4.)",null,null,"Jīnglǐ: bàojià yōuxiān, kèhù de shì bùnéng děng. Zǒngjié nǐ zhōusān yǐhòu zài jízhōng zuò.",null,"BODY1087"],["小阮: 好的。那我先把报价做完，周四开始做总结，周五把初稿发给您。 (Vâng. Vậy em làm xong báo giá trước, thứ 5 bắt đầu làm tổng kết, thứ 6 gửi bản nháp cho anh.)",null,null,"Xiǎo Ruǎn: hǎo de. Nà wǒ xiān bǎ bàojià zuò wán, zhōusì kāishǐ zuò zǒngjié, zhōuwǔ bǎ chūgǎo fāgěinín.",null,"BODY1088"],["经理: 很好。有什么问题随时跟我说。 (Tốt lắm. Có vấn đề gì cứ nói với tôi.)",null,null,"Jīnglǐ: hěn hǎo. Yǒu shénme wèntí suíshí gēn wǒ shuō.",null,"BODY1089"],["小阮: 好的，我做完以后先发给您确认一下。 (Vâng, làm xong em gửi anh xác nhận trước.)",null,null,"Xiǎo Ruǎn: hǎo de, wǒ zuò wán yǐhòu xiān fāgěinín quèrèn yīxià.",null,"BODY1090"],["情景对话 2 — Giao việc cho cấp dưới / đồng nghiệp",null,null,"Qíngjǐng duìhuà",null,"BODY1091-C"],["主管: 大家早！这周有三件事，我先分配一下任务。 (Chào buổi sáng! Tuần này có 3 việc, tôi phân công trước.)",null,null,"Zhǔguǎn: dàjiā zǎo! Zhè zhōu yǒu sānjiàn shì, wǒ xiān fēnpèi yīxià rènwù.",null,"BODY1092"],["主管: 小林，你负责跟进越南航空公司的订单，每天下午四点给我更新一次进度。 (Tiểu Lâm, bạn theo dõi đơn của hãng hàng không, 4h chiều mỗi ngày cập nhật tiến độ cho tôi.)",null,null,"Zhǔguǎn: Xiǎo Lín, nǐ fùzé gēnjìn Yuènán hángkōnggōngsī de dìngdān, měitiān xiàwǔ sìdiǎn gěi wǒ gèngxīn yīcì jìndù.",null,"BODY1093"],["小林: 好的。客户那边的联系人还是陈小姐吗？ (Vâng. Đầu mối bên khách vẫn là cô Trần ạ?)",null,null,"Xiǎo Lín: hǎo de. Kèhù nàbiān de liánxìrén háishì Chén xiǎojiě ma?",null,"BODY1094"],["主管: 对，她的电话我发到你微信上。 (Đúng, số điện thoại cô ấy tôi gửi qua WeChat bạn.)",null,null,"Zhǔguǎn: duì, tā de diànhuà wǒ fādào nǐ wēi xìn shàng.",null,"BODY1095"],["主管: 小芳，你准备下周展会的资料，包括产品手册和样品。 (Tiểu Phương, bạn chuẩn bị tài liệu triển lãm tuần sau, gồm catalog và hàng mẫu.)",null,null,"Zhǔguǎn: Xiǎo Fāng, nǐ zhǔnbèi xiàzhōu zhǎnhuì de zīliào, bāokuò chǎnpǐn shǒucè hé yàngpǐn.",null,"BODY1096"],["小芳: 产品手册要印多少本？ (Catalog in bao nhiêu cuốn ạ?)",null,null,"Xiǎo Fāng: chǎnpǐn shǒucè yào yìn duōshǎo běn?",null,"BODY1097"],["主管: 五百本，中文和英文各一半。麻烦你先确认一下印刷厂能不能周四之前交。 (500 cuốn, tiếng Trung và tiếng Anh mỗi loại một nửa. Phiền bạn xác nhận trước xem xưởng in giao trước thứ 5 được không.)",null,null,"Zhǔguǎn: wǔbǎi běn, Zhōngwén hé Yīngwén gè yībàn. Máfan nǐ xiān quèrèn yīxià yìnshuāchǎng néng bùnéng zhōusì zhīqián jiāo.",null,"BODY1098"],["小芳: 好，我上午就打电话问。 (Vâng, sáng nay em gọi hỏi luôn.)",null,null,"Xiǎo Fāng: hǎo, wǒ shàngwǔ jiù dǎdiànhuà wèn.",null,"BODY1099"],["主管: 小海，你整理一下上个月的客户投诉，做一份分析报告，周五交。 (Tiểu Hải, bạn tổng hợp khiếu nại khách tháng trước, làm báo cáo phân tích, thứ 6 nộp.)",null,null,"Zhǔguǎn: Xiǎo Hǎi, nǐ zhěnglǐ yīxià shànggèyuè de kèhù tóusù, zuò yīfèn fēnxī bàogào, zhōuwǔ jiāo.",null,"BODY1100"],["小海: 主管，我这周还要去海防出差两天，周五可能来不及。 (Trưởng nhóm, tuần này em còn đi công tác Hải Phòng 2 ngày, thứ 6 có thể không kịp.)",null,null,"Xiǎo Hǎi: zhǔguǎn, wǒ zhè zhōu háiyào qù Hǎifáng chūchāi liǎngtiān, zhōuwǔ kěnéng láibùjí.",null,"BODY1101"],["主管: 那下周一上午交可以吗？ (Vậy sáng thứ 2 tuần sau nộp được không?)",null,null,"Zhǔguǎn: nà xiàzhōuyī shàngwǔ jiāo kěyǐ ma?",null,"BODY1102"],["小海: 可以，周一上午没问题。 (Được ạ, sáng thứ 2 không vấn đề.)",null,null,"Xiǎo Hǎi: kěyǐ, zhōuyī shàngwǔ méi wèntí.",null,"BODY1103"],["主管: 好，那就这样定了。大家有什么困难提前说，不要等到截止日期才说。 (Được, chốt vậy. Ai có khó khăn thì nói trước, đừng đợi đến hạn chót mới nói.)",null,null,"Zhǔguǎn: hǎo, nà jiù zhèyàng dìng le. Dàjiā yǒu shénme kùnnán tíqián shuō, bùyào děngdào jiézhǐ rìqī cái shuō.",null,"BODY1104"],["全体: 明白！ (Rõ!)",null,null,"Quántǐ: míngbai!",null,"BODY1105"],["情景对话 3 — Báo cáo tiến độ cho sếp (đang đúng tiến độ và có rủi ro)",null,null,"Qíngjǐng duìhuà",null,"BODY1106-C"],["经理: 小林，越南航空的订单现在进度怎么样？ (Tiểu Lâm, đơn hãng hàng không giờ tiến độ thế nào?)",null,null,"Jīnglǐ: Xiǎo Lín, Yuènán Hángkōng de dìngdān xiànzài jìndù zěnmeyàng?",null,"BODY1107"],["小林: 目前进度是百分之七十。一共五千套，已经生产了三千五百套。 (Hiện đạt 70%. Tổng 5.000 bộ, đã sản xuất 3.500 bộ.)",null,null,"Xiǎo Lín: mùqián jìndù shì bǎifēnzhīqīshí. Yīgòng wǔqiān tào, yǐjīng shēngchǎn le sānqiānwǔbǎi tào.",null,"BODY1108"],["经理: 能按时交货吗？ (Giao đúng hạn được không?)",null,null,"Jīnglǐ: néng ànshí jiāohuò ma?",null,"BODY1109"],["小林: 生产方面没问题，预计下周二能全部完成。不过有一个风险。 (Về sản xuất không vấn đề, dự kiến thứ 3 tuần sau xong hết. Nhưng có một rủi ro.)",null,null,"Xiǎo Lín: shēngchǎn fāngmiàn méi wèntí, yùjì xià zhōu'èr néng quánbù wánchéng. Bùguò yǒu yīgè fēngxiǎn.",null,"BODY1110"],["经理: 什么风险？ (Rủi ro gì?)",null,null,"Jīnglǐ: shénme fēngxiǎn?",null,"BODY1111"],["小林: 包装盒的供应商说最近订单太多，可能要晚两天才能送到。 (NCC hộp đóng gói nói gần đây nhiều đơn, có thể muộn 2 ngày mới giao.)",null,null,"Xiǎo Lín: bāozhuānghé de gōngyìngshāng shuō zuìjìn dìngdān tài duō, kěnéng yào wǎn liǎngtiān cáinéng sòngdào.",null,"BODY1112"],["经理: 晚两天的话会影响交期吗？ (Muộn 2 ngày có ảnh hưởng hạn giao không?)",null,null,"Jīnglǐ: wǎn liǎngtiān dehuà huì yǐngxiǎng jiāo qī ma?",null,"BODY1113"],["小林: 会。客户要求下周四交货，如果包装盒周三才到，就来不及包装了。 (Có ạ. Khách yêu cầu giao thứ 5 tuần sau, nếu hộp thứ 4 mới về thì không kịp đóng gói.)",null,null,"Xiǎo Lín: huì. Kèhù yāoqiú xià zhōusì jiāohuò, rúguǒ bāozhuānghé zhōusān cái dào, jiù láibùjí bāozhuāng le.",null,"BODY1114"],["经理: 那你有什么办法？ (Vậy bạn có cách gì?)",null,null,"Jīnglǐ: nà nǐ yǒu shénme bànfǎ?",null,"BODY1115"],["小林: 我想了两个办法。第一，让供应商先送一半，剩下的周三送；第二，找另一家供应商做一部分。 (Em nghĩ 2 cách. Một, bảo NCC giao trước một nửa, còn lại thứ 4; hai, tìm NCC khác làm một phần.)",null,null,"Xiǎo Lín: wǒ xiǎng le liǎnggè bànfǎ. Dìyī, ràng gōngyìngshāng xiān sòng yībàn, shèngxià de zhōusān sòng; dì'èr, zhǎo lìngyījiā gōngyìngshāng zuò yībùfen.",null,"BODY1116"],["经理: 第二个办法价格会高吗？ (Cách hai giá có cao hơn không?)",null,null,"Jīnglǐ: dì'èrgè bànfǎ jiàgé huì gāo ma?",null,"BODY1117"],["小林: 会高百分之十左右，但是能保证交期。 (Cao hơn khoảng 10%, nhưng đảm bảo hạn giao.)",null,null,"Xiǎo Lín: huì gāo bǎifēnzhīshízuǒyòu, dànshì néng bǎozhèng jiāo qī.",null,"BODY1118"],["经理: 先试第一个办法，今天下班之前给我答复。如果不行，再用第二个。 (Thử cách một trước, trước khi tan làm hôm nay trả lời tôi. Không được thì dùng cách hai.)",null,null,"Jīnglǐ: xiān shì dìyīgè bànfǎ, jīntiān xiàbān zhīqián gěi wǒ dáfù. Rúguǒ bùxíng, zài yòng dì'èrgè.",null,"BODY1119"],["小林: 好的，我马上联系供应商，有结果第一时间告诉您。 (Vâng, em liên hệ NCC ngay, có kết quả báo anh đầu tiên.)",null,null,"Xiǎo Lín: hǎo de, wǒ mǎshàng liánxì gōngyìngshāng, yǒu jiéguǒ dìyī shíjiān gàosunín.",null,"BODY1120"],["小林: (5 giờ chiều) 经理，供应商同意明天先送一半，剩下的周二送到，交期没问题了。 (Giám đốc, NCC đồng ý mai giao trước một nửa, còn lại thứ 3 giao, hạn giao không vấn đề nữa.)",null,null,"Xiǎo Lín: jīnglǐ, gōngyìngshāng tóngyì míngtiān xiān sòng yībàn, shèngxià de zhōu'èr sòngdào, jiāo qī méi wèntí le.",null,"BODY1121"],["经理: 很好，辛苦了！继续跟进，有变化马上告诉我。 (Tốt lắm, vất vả rồi! Tiếp tục theo dõi, có thay đổi báo ngay.)",null,null,"Jīnglǐ: hěn hǎo, xīnkǔ le! Jìxù gēnjìn, yǒu biànhuà mǎshàng gàosu wǒ.",null,"BODY1122"],["情景对话 4 — Báo cáo bị chậm tiến độ và xin lùi hạn",null,null,"Qíngjǐng duìhuà",null,"BODY1123-C"],["小海: 经理，打扰一下，我想跟您说一下投诉分析报告的事。 (Giám đốc, làm phiền anh, em muốn báo về báo cáo phân tích khiếu nại.)",null,null,"Xiǎo Hǎi: jīnglǐ, dǎrǎo yīxià, wǒ xiǎng gēn nín shuō yīxià tóusù fēnxī bàogào de shì.",null,"BODY1124"],["经理: 怎么了？不是说周一交吗？ (Sao vậy? Chẳng phải hẹn thứ 2 nộp sao?)",null,null,"Jīnglǐ: zěnme le? Bùshì shuō zhōuyī jiāo ma?",null,"BODY1125"],["小海: 真不好意思，可能要推迟两天。 (Thật ngại quá, có thể phải lùi 2 ngày.)",null,null,"Xiǎo Hǎi: zhēn bùhǎoyìsi, kěnéng yào tuīchí liǎngtiān.",null,"BODY1126"],["经理: 为什么？ (Vì sao?)",null,null,"Jīnglǐ: wèishénme?",null,"BODY1127"],["小海: 由于客服部的数据还没整理好，我这边已经写好了框架，就等他们的数据。 (Do phòng CSKH chưa tổng hợp xong số liệu, bên em viết xong khung rồi, chỉ chờ số liệu của họ.)",null,null,"Xiǎo Hǎi: yóuyú kèfúbù de shùjù hái méi zhěnglǐ hǎo, wǒ zhèbiān yǐjīng xiě hǎo le kuāngjià, jiù děng tāmen de shùjù.",null,"BODY1128"],["经理: 你什么时候发现数据有问题的？ (Bạn phát hiện số liệu có vấn đề từ khi nào?)",null,null,"Jīnglǐ: nǐ shénme shíhou fāxiàn shùjù yǒu wèntí de?",null,"BODY1129"],["小海: 上周四，我当时以为他们周末能做完，所以没有马上告诉您，是我的问题。 (Thứ 5 tuần trước, lúc đó em tưởng cuối tuần họ làm xong nên không báo anh ngay, là lỗi của em.)",null,null,"Xiǎo Hǎi: shàngzhōusì, wǒ dāngshí yǐwéi tāmen zhōumò néng zuò wán, suǒyǐ méiyǒu mǎshàng gàosunín, shì wǒ de wèntí.",null,"BODY1130"],["经理: 以后遇到这种情况要早点说，我可以帮你协调。 (Sau này gặp tình huống vậy phải nói sớm, tôi có thể điều phối giúp.)",null,null,"Jīnglǐ: yǐhòu yùdào zhèzhǒng qíngkuàng yào zǎodiǎn shuō, wǒ kěyǐ bāng nǐ xiétiáo.",null,"BODY1131"],["小海: 明白，我吸取教训。 (Rõ ạ, em rút kinh nghiệm.)",null,null,"Xiǎo Hǎi: míngbai, wǒ xīqǔjiàoxùn.",null,"BODY1132"],["经理: 那你现在需要我做什么？ (Vậy giờ bạn cần tôi làm gì?)",null,null,"Jīnglǐ: nà nǐ xiànzài xūyào wǒ zuò shénme?",null,"BODY1133"],["小海: 能不能麻烦您跟客服部经理说一下，让他们今天下班前把数据给我？ (Phiền anh nói với giám đốc CSKH để họ gửi số liệu cho em trước khi tan làm hôm nay được không?)",null,null,"Xiǎo Hǎi: néng bùnéng máfan nín gēn kèfúbù jīnglǐ shuō yīxià, ràng tāmen jīntiān xiàbān qián bǎ shùjù gěi wǒ?",null,"BODY1134"],["经理: 可以，我马上打电话。那你最晚什么时候能交？ (Được, tôi gọi ngay. Vậy muộn nhất bạn nộp được khi nào?)",null,null,"Jīnglǐ: kěyǐ, wǒ mǎshàng dǎdiànhuà. Nà nǐ zuì wǎn shénme shíhou néng jiāo?",null,"BODY1135"],["小海: 如果今天拿到数据的话，周三上午一定能交。 (Nếu hôm nay có số liệu, sáng thứ 4 chắc chắn nộp được.)",null,null,"Xiǎo Hǎi: rúguǒ jīntiān nádào shùjù dehuà, zhōusān shàngwǔ yīdìng néng jiāo.",null,"BODY1136"],["经理: 好，周三上午，不能再推了。 (Được, sáng thứ 4, không được lùi nữa.)",null,null,"Jīnglǐ: hǎo, zhōusān shàngwǔ, bùnéng zài tuī le.",null,"BODY1137"],["小海: 好的，谢谢经理，给您添麻烦了！ (Vâng, cảm ơn giám đốc, làm phiền anh rồi!)",null,null,"Xiǎo Hǎi: hǎo de, xièxie jīnglǐ, gěi nín tiānmáfan le!",null,"BODY1138"],["情景对话 5 — Nhắc việc / giục đồng nghiệp phòng khác một cách lịch sự",null,null,"Qíngjǐng duìhuà",null,"BODY1139-C"],["小芳: 阿玲，在忙吗？打扰你一下。 (A Linh, đang bận à? Làm phiền chút.)",null,null,"Xiǎo Fāng: Ā Líng, zài máng ma? Dǎrǎo nǐ yīxià.",null,"BODY1140"],["阿玲: 没事，你说。 (Không sao, cứ nói.)",null,null,"Ā Líng: méishì, nǐ shuō.",null,"BODY1141"],["小芳: 上周我们申请的展会预算，审批进行到哪一步了？ (Ngân sách triển lãm tuần trước bên mình đề xuất, phê duyệt đến bước nào rồi?)",null,null,"Xiǎo Fāng: shàngzhōu wǒmen shēnqǐng de zhǎnhuì yùsuàn, shěnpī jìnxíng dào nǎ yībù le?",null,"BODY1142"],["阿玲: 我看一下……还在财务经理那里，他这两天出差了。 (Để mình xem… Vẫn ở chỗ giám đốc tài chính, mấy hôm nay anh ấy đi công tác.)",null,null,"Ā Líng: wǒ kàn yīxià…… hái zài cáiwùjīnglǐ nàlǐ, tā zhè liǎngtiān chūchāi le.",null,"BODY1143"],["小芳: 啊，那他什么时候回来？我们周四就要付展位费了。 (Ồ, thế khi nào anh ấy về? Thứ 5 bên mình phải trả phí gian hàng rồi.)",null,null,"Xiǎo Fāng: a, nà tā shénme shíhou huílái? Wǒmen zhōusì jiùyào fù zhǎnwèi fèi le.",null,"BODY1144"],["阿玲: 他明天下午回来。 (Chiều mai anh ấy về.)",null,null,"Ā Líng: tā míngtiān xiàwǔ huílái.",null,"BODY1145"],["小芳: 能不能麻烦你跟他说一下，这个比较急，明天回来以后优先处理？ (Phiền bạn nói với anh ấy việc này khá gấp, mai về thì ưu tiên xử lý được không?)",null,null,"Xiǎo Fāng: néng bùnéng máfan nǐ gēn tā shuō yīxià, zhège bǐjiào jí, míngtiān huílái yǐhòu yōuxiān chǔlǐ?",null,"BODY1146"],["阿玲: 可以，我现在就给他发个微信。 (Được, mình nhắn WeChat anh ấy ngay.)",null,null,"Ā Líng: kěyǐ, wǒ xiànzài jiù gěi tā fā gè wēi xìn.",null,"BODY1147"],["小芳: 太谢谢了！如果需要补充什么资料，随时告诉我。 (Cảm ơn nhiều! Cần bổ sung tài liệu gì cứ báo mình.)",null,null,"Xiǎo Fāng: tài xièxie le! Rúguǒ xūyào bǔchōng shénme zīliào, suíshí gàosu wǒ.",null,"BODY1148"],["阿玲: 好的。对了，你们的合同复印件好像还没交，他可能会问。 (Được. À, bản sao hợp đồng bên bạn hình như chưa nộp, anh ấy có thể sẽ hỏi.)",null,null,"Ā Líng: hǎo de. Duì le, nǐmen de hétong fùyìnjiàn hǎoxiàng hái méi jiāo, tā kěnéng huì wèn.",null,"BODY1149"],["小芳: 哦，我差点忘了！我十分钟之内发给你。 (Ồ, suýt quên! Trong 10 phút mình gửi bạn.)",null,null,"Xiǎo Fāng: ó, wǒ chàdiǎn wàng le! Wǒ shífēnzhōng zhīnèi fāgěinǐ.",null,"BODY1150"],["阿玲: 好，有结果我第一时间同步给你。 (Được, có kết quả mình báo bạn ngay.)",null,null,"Ā Líng: hǎo, yǒu jiéguǒ wǒ dìyī shíjiān tóngbù gěi nǐ.",null,"BODY1151"],["情景对话 6 — (HSK5) Ba việc trùng hạn, thương lượng ưu tiên và phân bổ người",null,null,"Qíngjǐng duìhuà",null,"BODY1152-C"],["经理: 这周有三个项目都要在周五之前完成，大家看看怎么安排。 (Tuần này có 3 dự án đều phải xong trước thứ 6, mọi người xem sắp xếp thế nào.)",null,null,"Jīnglǐ: zhè zhōu yǒu sāngè xiàngmù dōu yào zài zhōuwǔ zhīqián wánchéng, dàjiā kànkan zěnme ānpái.",null,"BODY1153"],["小林: 我们部门只有四个人，三个项目同时做，人手肯定不够。 (Phòng mình chỉ có 4 người, làm 3 dự án cùng lúc chắc chắn thiếu người.)",null,null,"Xiǎo Lín: wǒmen bùmén zhǐyǒu sìgè rén, sāngè xiàngmù tóngshí zuò, rénshǒu kěndìng bùgòu.",null,"BODY1154"],["经理: 那我们先排一下优先级。你们觉得哪个最急？ (Vậy xếp thứ tự ưu tiên trước. Mọi người thấy cái nào gấp nhất?)",null,null,"Jīnglǐ: nà wǒmen xiānpái yīxià yōuxiānjí. Nǐmen juéde nǎge zuì jí?",null,"BODY1155"],["小芳: 我觉得A项目最急，因为客户周五就要来验货，不能改。 (Em thấy dự án A gấp nhất, vì thứ 6 khách đến kiểm hàng, không đổi được.)",null,null,"Xiǎo Fāng: wǒ juéde A xiàngmù zuì jí, yīnwèi kèhù zhōuwǔ jiùyào lái yànhuò, bùnéng gǎi.",null,"BODY1156"],["小海: B项目是总部要的报告，也很重要，但是我可以问问能不能下周一交。 (Dự án B là báo cáo tổng bộ cần, cũng quan trọng, nhưng em có thể hỏi xem thứ 2 tuần sau nộp được không.)",null,null,"Xiǎo Hǎi: B xiàngmù shì zǒngbù yào de bàogào, yě hěn zhòngyào, dànshì wǒ kěyǐ wènwen néng bùnéng xiàzhōuyī jiāo.",null,"BODY1157"],["经理: C项目呢？ (Còn dự án C?)",null,null,"Jīnglǐ: C xiàngmù ne?",null,"BODY1158"],["小林: C项目是内部的流程优化，我觉得可以往后放一放。 (Dự án C là tối ưu quy trình nội bộ, em thấy có thể để lại sau.)",null,null,"Xiǎo Lín: C xiàngmù shì nèibù de liúchéng yōuhuà, wǒ juéde kěyǐ wǎnghòu fàng yī fàng.",null,"BODY1159"],["经理: 好。考虑到A项目最急，我建议小林和小芳两个人都做A项目。 (Được. Xét dự án A gấp nhất, tôi đề nghị Tiểu Lâm và Tiểu Phương cùng làm dự án A.)",null,null,"Jīnglǐ: hǎo. Kǎolǜ dào A xiàngmù zuì jí, wǒ jiànyì Xiǎo Lín hé Xiǎo Fāng liǎnggè rén dōu zuò A xiàngmù.",null,"BODY1160"],["小海: 那B项目就我一个人做吗？数据量很大，一个人恐怕来不及。 (Vậy dự án B một mình em làm à? Số liệu rất nhiều, một người e không kịp.)",null,null,"Xiǎo Hǎi: nà B xiàngmù jiù wǒ yīgè rén zuò ma? Shùjùliàng hěndà, yīgè rén kǒngpà láibùjí.",null,"BODY1161"],["经理: 你先跟总部确认截止日期。如果能推到周一，你一个人做；不能推的话，我从财务部借一个人帮你。 (Bạn xác nhận hạn chót với tổng bộ trước. Lùi được đến thứ 2 thì bạn làm một mình; không lùi được thì tôi mượn một người bên kế toán giúp bạn.)",null,null,"Jīnglǐ: nǐ xiān gēn zǒngbù quèrèn jiézhǐ rìqī. Rúguǒ néng tuī dào zhōuyī, nǐ yīgè rén zuò; bùnéng tuī dehuà, wǒ cóng cáiwùbù jiè yīgè rén bāng nǐ.",null,"BODY1162"],["小海: 好的，我上午就发邮件问。 (Vâng, sáng nay em gửi email hỏi.)",null,null,"Xiǎo Hǎi: hǎo de, wǒ shàngwǔ jiù fāyóujiàn wèn.",null,"BODY1163"],["经理: C项目先暂停，下周再开始。我会跟老板解释原因。 (Dự án C tạm dừng, tuần sau bắt đầu lại. Tôi sẽ giải thích lý do với sếp.)",null,null,"Jīnglǐ: C xiàngmù xiān zàntíng, xiàzhōu zài kāishǐ. Wǒhuì gēn lǎobǎn jiěshì yuányīn.",null,"BODY1164"],["小芳: 经理，A项目如果周四还做不完，周末可以加班吗？ (Giám đốc, nếu thứ 5 dự án A chưa xong, cuối tuần tăng ca được không ạ?)",null,null,"Xiǎo Fāng: jīnglǐ, A xiàngmù rúguǒ zhōusì hái zuò bù wán, zhōumò kěyǐ jiābān ma?",null,"BODY1165"],["经理: 可以，加班我来申请。不过我希望大家抓紧一点，尽量不要拖到周末。 (Được, tăng ca tôi xin. Nhưng mong mọi người khẩn trương, cố đừng để kéo đến cuối tuần.)",null,null,"Jīnglǐ: kěyǐ, jiābān wǒ lái shēnqǐng. Bùguò wǒ xīwàng dàjiā zhuājǐn yīdiǎn, jǐnliàng bùyào tuō dào zhōumò.",null,"BODY1166"],["经理: 我总结一下：A项目最优先，小林和小芳负责；B项目小海负责，今天确认截止日期；C项目下周再做。每天下午五点大家在群里同步一下进度。 (Tôi tổng kết: dự án A ưu tiên nhất, Lâm và Phương phụ trách; dự án B Hải phụ trách, hôm nay xác nhận hạn chót; dự án C tuần sau làm. 5h chiều mỗi ngày mọi người cập nhật tiến độ trong nhóm.)",null,null,"Jīnglǐ: wǒ zǒngjié yīxià: A xiàngmù zuì yōuxiān, Xiǎo Lín hé Xiǎo Fāng fùzé; B xiàngmù Xiǎo Hǎi fùzé, jīntiān quèrèn jiézhǐ rìqī; C xiàngmù xiàzhōu zài zuò. Měitiān xiàwǔ wǔdiǎn dàjiā zài qún lǐ tóngbù yīxià jìndù.",null,"BODY1167"],["全体: 没问题！ (Không vấn đề!)",null,null,"Quántǐ: méi wèntí!",null,"BODY1168"],["引导练习 GUIDED SPEAKING — GV hỏi, HS trả lời đủ ý",null,null,"Yǐndǎo liànxí",null,"BODY1169-C"],["1. Hỏi: 你接到一个新任务，一般会先问哪些问题？ (Nhận việc mới, bạn thường hỏi những câu gì trước?)",null,null,"Nǐ jiēdào yīgè xīn rènwù, yībān huì xiān wèn nǎxiē wèntí?",null,"BODY1170"],["Đáp: 我会先问三个问题：具体要做什么，最晚什么时候要，有问题应该找谁。 (Tôi hỏi 3 câu: cụ thể làm gì, muộn nhất khi nào cần, có vấn đề thì tìm ai.)",null,null,"Wǒhuì xiān wèn sāngè wèntí: jùtǐ yào zuò shénme, zuì wǎn shénme shíhou yào, yǒu wèntí yīnggāi zhǎo shuí.",null,"BODY1171"],["2. Hỏi: 你怎么向老板汇报工作进度？ (Bạn báo cáo tiến độ với sếp thế nào?)",null,null,"Nǐ zěnme xiàng lǎobǎn huìbào gōngzuòjìndù?",null,"BODY1172"],["Đáp: 我先说现在完成了多少，然后说有没有风险，最后说预计什么时候能完成。 (Nói hiện xong bao nhiêu, rồi có rủi ro gì không, cuối cùng dự kiến khi nào xong.)",null,null,"Wǒ xiān shuō xiànzài wánchéng le duōshǎo, ránhòu shuō yǒuméiyǒu fēngxiǎn, zuìhòu shuō yùjì shénme shíhou néng wánchéng.",null,"BODY1173"],["3. Hỏi: 如果你发现自己赶不上截止日期，你会怎么做？ (Nếu thấy mình không kịp hạn chót, bạn sẽ làm gì?)",null,null,"Rúguǒ nǐ fāxiànzìjǐ gǎnbùshàng jiézhǐ rìqī, nǐ huì zěnme zuò?",null,"BODY1174"],["Đáp: 我会马上告诉经理，说明原因，提出一个新的时间，还会说需要什么帮助。 (Báo giám đốc ngay, nói rõ lý do, đề xuất thời gian mới, và nói mình cần giúp gì.)",null,null,"Wǒhuì mǎshàng gàosu jīnglǐ, shuōmíng yuányīn, tíchū yīgè xīn de shíjiān, hái huì shuō xūyào shénme bāngzhù.",null,"BODY1175"],["4. Hỏi: 同事一直不给你需要的资料，你怎么办？ (Đồng nghiệp mãi không gửi tài liệu bạn cần, bạn làm sao?)",null,null,"Tóngshì yīzhí bù gěi nǐ xūyào de zīliào, nǐ zěnmebàn?",null,"BODY1176"],["Đáp: 我会先客气地提醒他一次，说明这件事有多急。如果还是不行，我会请经理帮忙协调。 (Nhắc khéo một lần, nói rõ việc gấp thế nào. Vẫn không được thì nhờ giám đốc điều phối.)",null,null,"Wǒhuì xiān kèqi de tíxǐng tā yīcì, shuōmíng zhèjiàn shì yǒu duō jí. Rúguǒ háishì bùxíng, wǒhuì qǐng jīnglǐ bāngmáng xiétiáo.",null,"BODY1177"],["5. Hỏi: (HSK5) 如果你是经理，团队人手不够，你会怎么分配任务？ (Nếu bạn là giám đốc, đội thiếu người, bạn phân việc thế nào?)",null,null,"Rúguǒ nǐ shì jīnglǐ, tuánduì rénshǒu bùgòu, nǐ huì zěnme fēnpèirènwù?",null,"BODY1178"],["Đáp: 我会先按紧急程度和重要程度排序，最急的项目安排最有经验的人，不急的先暂停，同时跟上级申请临时支援。 (Xếp theo mức độ gấp và quan trọng, dự án gấp nhất giao người nhiều kinh nghiệm nhất, việc không gấp tạm dừng, đồng thời xin cấp trên hỗ trợ tạm thời.)",null,null,"Wǒhuì xiān àn jǐnjí chéngdù hé zhòngyào chéngdù páixù, zuì jí de xiàngmù ānpái zuì yǒu jīngyàn de rén, bù jí de xiān zàntíng, tóngshí gēn shàngjí shēnqǐng línshí zhīyuán.",null,"BODY1179"],["情景模拟 ROLE-PLAY — GV (sếp) giao cùng lúc 3 việc trùng hạn; HS phải hỏi rõ, xin thứ tự ưu tiên, đề xuất phương án",null,null,"Qíngjǐng mónǐ",null,"BODY1180-C"],["GV: 小阮，今天下班之前要把报价发给客户，还要准备明天的会议资料，另外总部要的数据也是今天要。 (Tiểu Nguyễn, trước khi tan làm hôm nay phải gửi báo giá cho khách, còn chuẩn bị tài liệu họp ngày mai, ngoài ra số liệu tổng bộ cần cũng là hôm nay.)",null,null,"Xiǎo Ruǎn, jīntiān xiàbān zhīqián yào bǎ bàojià fāgěi kèhù, háiyào zhǔnbèi míngtiān de huìyì zīliào, lìngwài zǒngbù yào de shùjù yě shì jīntiān yào.",null,"BODY1181"],["HS: 经理，三件事都是今天要，我恐怕来不及全部做完。能不能先排一下优先级？ (Giám đốc, cả 3 việc đều là hôm nay, e em không kịp làm hết. Có thể xếp thứ tự ưu tiên trước không ạ?)",null,null,"Jīnglǐ, sānjiàn shì dōu shì jīntiān yào, wǒ kǒngpà láibùjí quánbù zuò wán. Néng bùnéng xiānpái yīxià yōuxiānjí?",null,"BODY1182"],["GV: 你觉得哪个最急？ (Bạn thấy việc nào gấp nhất?)",null,null,"Nǐ juéde nǎge zuì jí?",null,"BODY1183"],["HS: 我觉得报价最急，因为客户今天要做决定。会议资料可以今晚做完，明天早上开会前给您。 (Em thấy báo giá gấp nhất vì hôm nay khách phải quyết định. Tài liệu họp tối nay làm xong, sáng mai gửi anh trước giờ họp.)",null,null,"Wǒ juéde bàojià zuì jí, yīnwèi kèhù jīntiān yào zuò juédìng. Huìyì zīliào kěyǐ jīnwǎn zuò wán, míngtiān zǎo
