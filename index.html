const CJK = /[぀-ヿ㐀-鿿豈-﫿]/;
const hasCJK = s => CJK.test(s || '');
const VI_RE = /[ăâđêôơưàáảãạằắẳẵặầấẩẫậèéẻẽẹềếểễệìíỉĩịòóỏõọồốổỗộờớởỡợùúủũụừứửữựỳýỷỹỵ]/i;
const isVi = s => VI_RE.test(s || '');
const TARGET = s => { s = s || ''; return (LANG === 'en' ? /[A-Za-z]{2}/.test(s) : hasCJK(s)) && !isVi(s); };
const VI_PLAIN = new Set(['sinh','mua','du','quan','so','tin','giao','tranh','kinh','thi','ban','xin','an','hang','gia','danh','trao','phong','chi','nhanh','cao','tinh','thanh','khi','trong','ngoai','tam','tai','con','nguoi']);
const RUN = /[぀-ヿ㐀-鿿豈-﫿]+(?:……[぀-ヿ㐀-鿿豈-﫿]*)*/g;
const runs = s => ((s || '').match(RUN) || []).length;
const clean = v => v == null ? '' : String(v).replace(/\r/g,'').trim();
const pyParts = p => (p || '').split('|').map(s => s.trim().replace(/\s*\/$/, '').trim()).filter(Boolean);
const pyFlat = p => pyParts(p).join(' ');
function takeParts(parts, text){
  if(!text || !TARGET(text) || !parts.length) return ['', 0];
  const k = (text.match(/[\/／]/g) || []).length; const seg = []; let used = 0;
  while(used < parts.length){ seg.push(parts[used]); used++; if(seg.join(' / ').split('/').length - 1 >= k) break; }
  return [seg.join(' / '), used];
}
const CUE_RE = /^\s*[(（]([^)）]{1,44})[)）]\s*/;
function cutGloss(t){ let [a, b] = splitGloss(t); if(!TARGET(a) && /[(（]/.test(t)){ const i = t.search(/[(（]/); if(i > 0 && TARGET(t.slice(0, i))){ a = t.slice(0, i).trim(); b = t.slice(i).replace(/^[(（]|[)）]$/g, '').trim(); } } return [a, b]; }
function splitGloss(s){
  s = (s || '').trim();
  if(!s.endsWith(')')) return [s, ''];
  let d = 0;
  for(let i = s.length - 1; i >= 0; i--){
    if(s[i] === ')') d++;
    else if(s[i] === '('){ d--; if(d === 0) return [s.slice(0, i).trim(), s.slice(i + 1, -1).trim()]; }
  }
  return [s, ''];
}
const LEVEL_RE = /\(\s*(HSK\s?\d|[ABC][12]|N[1-5])\s*\)\s*/i;
function stripLevel(s){ const m = (s || '').match(LEVEL_RE); return [m ? m[1].replace(/\s/g,'').toUpperCase() : '', (s || '').replace(LEVEL_RE, '').trim()]; }
const blankify = s => esc(s).replace(/……|\.\.\.\.\.\./g, '<span class="blank">……</span>');
const pad2 = n => String(n).padStart(2, '0');

/* ================= parsing ================= */
function classify(head){
  const lab = head.split('—')[0];
  const h = lab.toUpperCase();
  if(/MỤC TIÊU|OBJECTIVE|GOAL|目标|目標/.test(h)) return 'goals';
  if(/热身|WARM-?UP|ウォーム/.test(h)) return 'warm';
  if(/语言输入|INPUT|TỪ VỰNG|VOCAB|語彙|単語|IDIOM|決まり文句|THÀNH NGỮ/.test(h)) return 'vocab';
  if(/句型|MẪU CÂU|PATTERN|STRUCTURE|文型/.test(h)) return 'pat';
  if(/情景对话|HỘI THOẠI|DIALOGUE|CONVERSATION|会話/.test(h)) return 'dialogue';
  if(/引导练习|GUIDED/.test(h)) return 'guided';
  if(/情景模拟|ROLE-?PLAY|ロールプレイ/.test(h)) return 'role';
  if(/纠错|FEEDBACK|SỬA LỖI|フィードバック/.test(h)) return 'fix';
  if(/课后作业|HOMEWORK|BÀI TẬP VỀ NHÀ|宿題/.test(h)) return 'hw';
  if(/BÀI NÓI MẪU|QUY TRÌNH|MODEL|SAMPLE|SPEECH|TALK|スピーチ|サンプル|業務フロー/.test(h)) return 'speech';
  return 'generic';
}
function parseHead(head, headPy){
  const i = head.indexOf('—') >= 0 ? head.indexOf('—') : head.indexOf(' - ');
  const label = (i >= 0 ? head.slice(0, i) : head).trim();
  const sub = (i >= 0 ? head.slice(i + 1).replace(/^[-\s]+/, '') : '').trim();
  const cjk = (label.match(/[぀-ヿ㐀-鿿]+(?:\s*\d+)?/) || [''])[0].trim();
  const latin = label.replace(/[぀-ヿ㐀-鿿]+/g, '').replace(/\s+/g, ' ').trim();
  const eb = latin && cjk && /[A-Za-zÀ-ỹ]/.test(latin) ? latin : '';
  return { label, sub, big: cjk || latin || label, eyebrow: eb, py: pyParts(headPy)[0] || '' };
}
function parseRows(rows, langKey){
  const L = LANGS[langKey];
  const lessons = []; let course = ''; let cur = null; let sec = null;
  for(const r of rows){
    const t = clean(r[L.col]); const p = L.pron == null ? '' : clean(r[L.pron]); const f = clean(r[LEVEL_COL]).toUpperCase();
    if(!t) continue;
    if(f === 'TITLE'){ course = t; continue; }
    if(/-B$/.test(f)){
      const m = t.match(/(?:Buổi|Bài|Lesson|Unit)\s*0*(\d+)/i);
      let rest = t.replace(/^.*?(?:Buổi|Bài|Lesson|Unit)\s*\d+\s*[—\-–:]\s*/i, '');
      let zh = '', vi = rest;
      const mm = rest.match(/^([　-ヿ㐀-鿿＀-￯、，·・\s]+?)\s+([^　-ヿ㐀-鿿].*)$/);
      if(mm){ zh = mm[1].trim(); vi = mm[2].trim(); }
      else if(langKey === 'en'){
        const tk = rest.split(/\s+/); let d = tk.findIndex(w => isVi(w));
        if(d > 0){ while(d > 1 && VI_PLAIN.has(tk[d - 1].toLowerCase())) d--; zh = tk.slice(0, d).join(' '); vi = tk.slice(d).join(' '); }
      }
      cur = { num: m ? +m[1] : lessons.length + 1, raw: t, zh, vi, py: pyFlat(p), sections: [] };
      lessons.push(cur); sec = null; continue;
    }
    if(!cur) continue;
    if(/-C$/.test(f)){ sec = { type: classify(t), head: t, headPy: p, rows: [] }; cur.sections.push(sec); continue; }
    if(!sec){ sec = { type:'generic', head:'Ghi chú', headPy:'', rows:[] }; cur.sections.push(sec); }
    sec.rows.push({ t, p });
  }
  return { course, lessons };
}

/* row-level parsers */
const Q_RE = /^\s*(\d+)\s*[.)]\s*(?:Hỏi|Ask|Q|Question|質問|问)\s*[:：]\s*/i;
const A_RE = /^\s*(?:Đáp|Trả lời|Answer|A\s*\(.*?\)|答え|回答|答)\s*[:：]\s*/i;
const NUM_RE = /^\s*(\d+)\s*[.)]\s*/;
const EX_RE = /^\s*(?:Ví dụ|VD|Example|E\.g\.|例)\s*[:：]\s*/i;
const SPK_RE = /^\s*([^:：()（）\s][^:：()（）]{0,23}(?:\s*[（(][^)）]{1,30}[)）])?)\s*[:：]\s*(.+)$/;
const baseSp = sp => sp.replace(/\s*[（(].*$/, '').trim();
function line(t, p){ const [zh, vi] = splitGloss(t); return { zh, vi, py: pyFlat(p) }; }
function parseQA(rows){
  const items = [], notes = [];
  for(const r of rows){
    if(Q_RE.test(r.t)){ items.push({ q: line(r.t.replace(Q_RE, ''), r.p), a: null }); }
    else if(A_RE.test(r.t) && items.length){ items[items.length - 1].a = line(r.t.replace(A_RE, ''), r.p); }
    else if(NUM_RE.test(r.t) && !A_RE.test(r.t)){ items.push({ q: line(r.t.replace(NUM_RE, ''), r.p), a: null }); }
    else notes.push(r);
  }
  return { items, notes };
}
function parseVocab(rows){
  const out = [], notes = [];
  rows.forEach(r => {
    const m = r.t.match(NUM_RE); if(!m){ notes.push(r); return; }
    const body = r.t.replace(NUM_RE, '');
    let head = body, rest = '';
    const k = body.indexOf('):'), k2 = body.indexOf('）：');
    if(k > 0){ head = body.slice(0, k + 1); rest = body.slice(k + 2); }
    else if(k2 > 0){ head = body.slice(0, k2 + 1).replace('（','(').replace('）',')'); rest = body.slice(k2 + 2); }
    let note = '', w, mean;
    const pm = (k < 0 && k2 < 0) ? body.match(/^([^()]+?)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)\s*[–—-]\s*(.+)$/) : null;
    if(pm){
      w = pm[1].trim(); mean = pm[2].trim(); const tail = pm[3]; const c = tail.search(/[:：]\s/);
      if(c > 0 && TARGET(tail.slice(c + 1).split(/[(（]/)[0])){ note = tail.slice(0, c).trim(); rest = tail.slice(c + 1); } else { note = tail.trim(); rest = ''; }
    } else {
      if(k < 0 && k2 < 0){ const c = body.search(/[:：]/); if(c > 0){ head = body.slice(0, c); rest = body.slice(c + 1); } }
      [w, mean] = splitGloss(head);
    }
    if(!TARGET(w)){
      const rr = cutGloss(rest.trim());
      if(rest.trim() && TARGET(rr[0])){ mean = [mean, w, rr[1]].filter(Boolean).join(' – '); w = rr[0]; rest = ''; }
      else { const [a2, b2] = cutGloss(w); if(TARGET(a2)){ w = a2; mean = b2 || mean; }
        else { const ci = w.search(/[:：]/); if(ci > 0 && TARGET(w.slice(ci + 1))){ mean = [w.slice(0, ci).trim(), mean].filter(Boolean).join(' – '); w = w.slice(ci + 1).trim(); } } }
    }
    const [ex, exvi] = cutGloss(rest.trim());
    const parts = pyParts(r.p); let [wpy, used] = takeParts(parts, w); const mr = runs(mean);
    if(mr && ex && parts.length > used + mr) used += mr;
    const expy = ex && TARGET(ex) ? parts.slice(used).join(ex.includes('/') ? ' / ' : ' ') : '';
    out.push({ n: +m[1], w, mean, note, ex, exvi, wpy, expy });
  });
  return { items: out, notes };
}
function parsePatterns(rows){
  const out = [], notes = [];
  rows.forEach(r => {
    if(EX_RE.test(r.t) && out.length){ out[out.length - 1].ex.push(line(r.t.replace(EX_RE, ''), r.p)); return; }
    const m = r.t.match(NUM_RE);
    if(m){ const [lv, body] = stripLevel(r.t.replace(NUM_RE, '')); const [zh, vi] = splitGloss(body);
      out.push({ n: +m[1], lv, zh, vi, py: pyFlat(r.p), ex: [] }); return; }
    notes.push(r);
  });
  return { items: out, notes };
}
function parseDialogue(rows){
  return rows.map(r => {
    const cm = r.t.match(CUE_RE); const cue = cm ? cm[1] : ''; const tt = cm ? r.t.slice(cm[0].length) : r.t;
    const m = tt.match(SPK_RE);
    const b0 = m ? baseSp(m[1]) : '';
    const okLatin = LANG === 'en' ? (/^[A-Z][A-Za-z.' -]{0,22}$/.test(b0) && !isVi(b0) && b0.split(/\s+/).length <= 3) : (b0.length <= 6 && !isVi(b0));

        return head(this) + `<div class="hw">${sec.rows.map((r, i) => `<label><input type="checkbox" id="hw${lesson.num}_${i}" data-hw="${i}" data-hwkey="${key}" ${done.includes(i) ? 'checked' : ''}><span>${esc(r.t.replace(/^\(\d+\)\s*/, ''))}${r.p ? `<span class="py" style="display:block">${esc(pyFlat(r.p))}</span>` : ''}</span></label>`).join('')}</div>

          <div class="crit"><div><span class="em">🌊</span><b>Lưu loát</b></div><div><span class="em">🎯</span><b>Chính xác</b></div><div><span class="em">😊</span><b>Tự nhiên</b></div><div><span class="em">🔁</span><b>Tương tác</b></div><div><span class="em">🧠</span><b>Logic</b></div></div>
          <div class="card" style="text-align:center;background:var(--seal-soft);border-color:transparent">
            <div class="h-zh" style="font-size:clamp(28px,4vw,40px);margin:0">${LANG === 'en' ? 'See you next time!' : LANG === 'ja' ? 'また来週！' : '下次见！'}</div>${LANG === 'zh' ? '<div class="py">Xiàcì jiàn!</div>' : LANG === 'ja' ? '<div class="py">Mata raishū!</div>' : ''}<div class="vi">Hẹn gặp lại buổi sau 👋</div></div>`;

          const m = r.t.match(/^([^:：]{1,40}?)\s*[:：]\s*(.+)$/); const lab = m && !TARGET(m[1]) ? m[1] : ''; const body = lab ? m[2] : r.t; const [zz, vv] = splitGloss(body); return { lab, zh: zz, vi: vv, py: pyFlat(r.p) }; });
        const tabs = items.length > 1 ? `<div class="chips" role="group" aria-label="Chọn bài">${items.map((it, i) => `<button class="chip" aria-pressed="${i === 0}" data-sp-tab="${i}">${esc(it.lab || 'Bài ' + (i + 1))}</button>`).join('')}</div>` : '';
        return head(this) + `<div class="steps">
          <div class="step"><span class="em">👂</span><span><b>1. Nghe</b><small>Bấm 🔊 nghe cả bài</small></span></div>

          items.map((it, i) => `<div class="card speech" data-sp-pane="${i}" ${i ? 'hidden' : ''}>${it.lab && items.length === 1 ? `<span class="tag">${esc(it.lab)}</span>` : ''}${zl({ zh: it.zh, py: it.py, vi: it.vi }, { html: highlight(it.zh, keys) })}</div>`).join('');
      };
      s.nav = /QUY TRÌNH/i.test(sec.head) ? 'Quy trình · bài nói mẫu' : 'Bài nói mẫu';
      if(!s.title) s.title = 'Nghe, nhại lại, rồi thay bằng thông tin của bạn';
    } else {
      if(/NGẮT|ĐẨY|interrupt/i.test(sec.head)) s.st = '✋';
      s.nav = h.label.length > 34 ? h.label.slice(0, 32) + '…' : h.label;
      const pm = sub.match(/(\d+)\s*phút/); if(pm) s.min = +pm[1];
      const nQ = sec.rows.filter(r => Q_RE.test(r.t)).length;
      const nNum = sec.rows.filter(r => NUM_RE.test(r.t)).length;
      const nSpk = parseDialogue(sec.rows).filter(l => !l.nar).length;
      if(/TIÊU CHÍ|CRITERIA|RUBRIC|評価基準/i.test(sec.head)){
        s.st = '🏅';
        s.render = function(){ return head(this) + `<div class="grid">${sec.rows.map(noteHtml).join('')}</div>`; };
      } else if(nQ >= 2){
        s.st = '⚡';
        const { items, notes } = parseQA(sec.rows);
        s.render = function(){ return head(this) + notesHtml(notes) + `<div class="row"><button class="btn" data-random>🎲 Bốc ngẫu nhiên một câu</button></div><div class="grid g2" data-qlist>${items.map((x, i) => qaCard(x, i + 1)).join('')}</div>`; };
      } else if(nNum >= 3 && nNum >= sec.rows.length * 0.6){
        s.st = '🃏';
        const { items, notes } = parseQA(sec.rows);
        s.render = function(){ return head(this) + notesHtml(notes) + `<div class="row"><button class="btn" data-random>🎲 Bốc thăm một thẻ</button></div><div class="grid g3" data-qlist>${items.map((x, i) => qaCard(x, i + 1)).join('')}</div>`; };
      } else if(nSpk >= 2 && nSpk >= sec.rows.length * 0.5){
        s.st = '🎙️';
        const lines = parseDialogue(sec.rows);
        s.render = function(){ return head(this) + chat('g' + si, lines); };
      } else {
        s.render = function(){ return head(this) + `<div class="grid ${sec.rows.some(r => r.t.length > 160) ? '' : 'g2'}">${sec.rows.map(noteHtml).join('')}</div>`; };
      }
    }
    S.push(s);
  });
  return S;
}

/* ================= state ================= */
let DATASET = null;      // { name, rows }
let PARSED = {};         // lang -> { course, lessons }
let LESSON = null, SL = [], cur = 0;
const stage = $('#stage');
const courseTitle = () => (PARSED[LANG] && PARSED[LANG].course) || DEFAULT_COURSE || '';

function loadDataset(ds, persist){
  DATASET = ds; PARSED = {};
  Object.keys(LANGS).forEach(k => { PARSED[k] = parseRows(ds.rows, k); });
  if(persist){
    const ok = store.set('dataset', ds);
    return ok;
  }
  return true;
}
function availableLangs(){ return Object.keys(LANGS).filter(k => (!FIXED_LANG || k === FIXED_LANG) && PARSED[k] && PARSED[k].lessons.length); }

/* ================= library view ================= */
function showLibrary(msg, isErr){
  LESSON = null; stopSpeech(); timer.stop();
  $('#deckTools').hidden = true; $('#nav').hidden = true;
  const langs = availableLangs();
  if(!langs.includes(LANG)) LANG = langs[0] || 'zh';
  document.body.className = document.body.className.replace(/lang-\w+/g, '') + ' lang-' + LANG;
  const P = PARSED[LANG] || { lessons: [] };
  $('#bTitle').textContent = courseTitle() || 'Thư viện bài giảng';
  $('#crumb').textContent = `${LANGS[LANG].name} · ${P.lessons.length} bài`;
  const langBtns = Object.keys(LANGS).map(k => { const n = (PARSED[k] || { lessons: [] }).lessons.length;
    return `<button class="lang" aria-pressed="${k === LANG}" data-lang="${k}" ${n ? '' : 'disabled'}><span class="k">${LANGS[k].key}</span><span>${LANGS[k].name}<br><small>${n ? n + ' bài' : 'chưa có trong file'}</small></span></button>`; }).join('');
  const cards = P.lessons.map((l, i) => {
    const nd = l.sections.filter(s => s.type === 'dialogue').length;
    const nv = l.sections.filter(s => s.type === 'vocab').reduce((a, s) => a + s.rows.length, 0);
    return `<button class="lc" data-lesson="${i}"><span class="s">${pad2(l.num)}</span><span style="min-width:0">
      ${l.zh ? `<span class="z">${esc(l.zh)}</span>` : ''}<span class="v" style="display:block">${esc(l.vi)}</span>
      <span class="meta"><span>💬 ${nd} hội thoại</span><span>📚 ${nv} từ</span><span>🧩 ${l.sections.length} phần</span></span></span></button>`; }).join('');
  stage.innerHTML = `<section class="slide in">
    <div class="lib-hero"><div><div class="eyebrow">Thư viện bài giảng</div><h1>${esc(courseTitle() || 'Giao tiếp ngoại ngữ')}</h1></div>
      <div class="sticker" aria-hidden="true">🎓</div></div>
    <div class="drop" id="drop"><div class="row"><button class="btn" data-pick>Chọn file Excel</button>${DATASET && DATASET.name !== SAMPLE.name ? '<button class="btn ghost" data-sample>Dùng lại 24 bài có sẵn</button>' : ''}</div><div class="status ${isErr ? 'err' : ''}" id="status">${isErr ? esc(msg || '') : ''}</div>
    </div>
    ${FIXED_LANG ? '' : `<div class="langs" role="group" aria-label="Chọn thứ tiếng">${langBtns}</div>`}
    ${cards ? `<div class="lessons">${cards}</div>` : `<div class="empty">Chưa tìm thấy bài nào. Kiểm tra cột F có các mốc BODYn-B (tên bài) và BODYn-C (tên phần).</div>`}
  </section>`;
  stage.scrollTop = 0;
  try{ history.replaceState(null, '', '#lib'); }catch(e){}
  bindDrop();
}
function bindDrop(){
  const d = $('#drop'); if(!d) return;
  ['dragenter','dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) readFile(f); });
}
function readFile(f){
  const st = $('#status'); if(st){ st.className = 'status'; st.textContent = 'Đang đọc ' + f.name + '…'; }
  if(typeof XLSX === 'undefined'){ showLibrary('Không tải được bộ đọc Excel. Kiểm tra kết nối mạng rồi thử lại.', true); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(fr.result), { type:'array' });
      let best = null, bestN = -1;
      wb.SheetNames.forEach(n => { const ws = wb.Sheets[n]; if(!ws['!ref']) return; const rg = XLSX.utils.decode_range(ws['!ref']); rg.s.c = 0; rg.s.r = 0; ws['!ref'] = XLSX.utils.encode_range(rg);
        const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:false, blankrows:false });
        const cnt = rows.filter(r => /-B$/i.test(clean(r[LEVEL_COL]))).length; if(cnt > bestN){ bestN = cnt; best = rows; } });
      if(!best || bestN <= 0){ showLibrary('Không tìm thấy bài nào trong file. Cột F cần có BODYn-B / BODYn-C.', true); return; }
      const rows = best.map(r => { const o = []; COLS_KEPT.forEach(c => { o[c] = r[c] == null ? null : String(r[c]); }); return o; }).filter(r => r.some(v => v));
      const ok = loadDataset({ name: f.name, rows }, true);
      const n = availableLangs().map(k => `${PARSED[k].lessons.length} bài ${LANGS[k].name.toLowerCase()}`).join(', ');
      showLibrary(`Đã đọc ${f.name}: ${n}.` + (ok ? '' : ' File lớn nên trình duyệt không nhớ được, lần sau cần chọn lại.'));
    }catch(err){ showLibrary('Không đọc được file này. Hãy chọn file .xlsx. (' + err.message + ')', true); }
  };
  fr.onerror = () => showLibrary('Không đọc được file. Thử chọn lại.', true);
  fr.readAsArrayBuffer(f);
}

/* ================= deck view ================= */
function openLesson(i, slide){
  const P = PARSED[LANG]; LESSON = P.lessons[i]; if(!LESSON) return showLibrary();
  SL = buildSlides(LESSON); CUR_KEYS = hlKeys(LESSON);

    else { if(this.left === 0) this.left = this.total; this.running = true; this.h = setInterval(() => { this.left = Math.max(0, this.left - 1); if(this.left === 0){ clearInterval(this.h); this.running = false; } this.draw(); }, 1000); }

/* speech synthesis */
let voices = [];
const DEF_SET = { rate: 1, gender: 'female', voice: '', t: 1, p: (FIXED_LANG || 'zh') === 'en' ? 1 : 1.15, v: (FIXED_LANG || 'zh') === 'en' ? 1 : 1.15 };
const SET = Object.assign({}, DEF_SET, store.get('settings3', {}));
const FEMALE = /xiaoxiao|xiaoyi|xiaohan|xiaomo|xiaoxuan|xiaorui|xiaoshuang|xiaomeng|xiaochen|huihui|yaoyao|tingting|meijia|sinji|hanhan|hiumaan|hsiaochen|hsiaoyu|nanami|aoi|mayu|shiori|haruka|ayumi|kyoko|o-ren|sayaka|aria|jenny|michelle|ana\b|emma|ava|sara|nancy|jane|zira|samantha|susan|hazel|libby|sonia|maisie|natasha|clara|catherine|karen|moira|tessa|fiona|victoria|allison|flo\b|sandy|shelley|grandma|meijia|female|woman|女/i;
const MALE = /li-mu|limu|eddy|reed|rocko|grandpa|yunxi|yunyang|yunjian|yunhao|yunfeng|yunze|yunye|kangkang|zhiwei|danny|wanlung|yunjhe|keita|ichiro|daichi|naoki|otoya|hattori|guy|davis|tony|jason|christopher|eric|roger|steffan|brian|andrew|david|mark|george|ryan|thomas|william|james|daniel|alex\b|fred|aaron|arthur|oliver|rishi|male|man\b|男/i;
function genderOf(v){ const n = v.name; if(MALE.test(n) && !/female/i.test(n)) return 'male'; if(FEMALE.test(n)) return 'female'; if(/^Google/i.test(n)) return 'female'; return ''; }
function langVoices(){ const lang = LANGS[LANG].voice.toLowerCase(); return voices.filter(x => x.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0, 2))); }
function pickVoice(){
  const lv = langVoices(); if(!lv.length) return null;
  if(SET.voice){ const v = lv.find(x => x.name === SET.voice); if(v) return v; }
  const exact = lv.filter(x => x.lang.replace('_','-').toLowerCase() === LANGS[LANG].voice.toLowerCase());
  const pool = exact.length ? exact : lv;
  const nat = arr => arr.find(x => /natural|online|neural/i.test(x.name)) || arr[0];
  if(SET.gender !== 'auto'){ const g = pool.filter(x => genderOf(x) === SET.gender); if(g.length) return nat(g); }
  return nat(pool);
}
function pickVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} fillVoices(); }
try{ pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }catch(e){}
function fillVoices(){
  const sel = document.getElementById('sVoice'); if(!sel || typeof LANG === 'undefined') return;
  const lv = langVoices(); const cur = pickVoice();
  sel.innerHTML = `<option value="">Tự chọn theo giọng ${SET.gender === 'male' ? 'nam' : SET.gender === 'female' ? 'nữ' : 'mặc định'}</option>` +
    lv.map(v => { const g = genderOf(v); return `<option value="${esc(v.name)}" ${v.name === SET.voice ? 'selected' : ''}>${g === 'male' ? '👨 ' : g === 'female' ? '👩 ' : ''}${esc(v.name)} (${esc(v.lang)})</option>`; }).join('');
  const note = document.getElementById('sVoiceNote');
  if(note){
    const has = g => lv.some(v => genderOf(v) === g);
    if(!lv.length) note.textContent = `Máy này chưa có giọng ${LANGS[LANG].name.toLowerCase()}. Trên Windows: Settings → Time & Language → Speech → Add voices.`;
    else if(SET.gender !== 'auto' && !SET.voice && !has(SET.gender)) note.textContent = `⚠ Máy có ${lv.length} giọng ${LANGS[LANG].name.toLowerCase()} nhưng không có giọng ${SET.gender === 'male' ? 'nam' : 'nữ'} cho ${LANGS[LANG].name.toLowerCase()}, nên vẫn đọc bằng: ${cur ? cur.name : '—'}.`;
    else note.textContent = `Máy có ${lv.length} giọng ${LANGS[LANG].name.toLowerCase()}. Đang dùng: ${cur ? cur.name : '—'}. Edge thường có nhiều giọng "Natural" cả nam lẫn nữ.`;
  }
}

/* ===== layout pass: left info/controls panel + right content (desktop), one scrollable control row (mobile) ===== */
const CTRL_SEL = '.chips,.row,.cast,.seg-ctl';
function layoutSlide(sec, s){
  if(!sec) return;
  // 1) speaker buttons go first in their line so text can flow around them on phones
  sec.querySelectorAll('.zh > .say, .zrow > .say').forEach(b => { b.classList.add('fl'); b.parentElement.insertBefore(b, b.parentElement.firstChild); });
  // 2) per-card controls (Nghe cả phần, vai, Ẩn A/B, ghi chú) -> one control bar under the card title
  sec.querySelectorAll('.card').forEach(card => {
    const items = [];
    const cp = card.querySelector(':scope > .card-h [data-cardplay]'); if(cp) items.push(cp);
    [...card.children].forEach(ch => { if(ch.matches('.row') && !ch.querySelector('.zl,.zh,.ans,.ansbox') && ch.querySelector('button,.cast')) items.push(ch); });
    if(!items.length || items.length === 1 && items[0] === cp) return;
    const bar = document.createElement('div'); bar.className = 'ctlbar';
    items.forEach(x => bar.appendChild(x));
    const h = card.querySelector(':scope > .card-h'); if(h){ h.after(bar); if(!h.textContent.trim()) h.remove(); } else card.prepend(bar);
  });
  // 3) slide head + leading controls -> side panel
  const first = sec.firstElementChild;
  if(!first || !first.matches('.head,.vtop')) return;
  const side = document.createElement('div'); side.className = 'side';
  const ctl = document.createElement('div'); ctl.className = 'ctl';
  if(first.matches('.vtop')){
    const vrow = first.querySelector(':scope > .row'); side.appendChild(first); if(vrow) ctl.appendChild(vrow);
    ctl.insertAdjacentHTML('beforeend', `<label class="vzoom" title="Phóng to / thu nhỏ chữ của thẻ từ">🔍 Cỡ chữ từ <input type="range" data-vzoom min="0.6" max="1.6" step="0.05" value="${VZ}"><b>${Math.round(VZ * 100)}%</b></label>`);
  } else side.appendChild(first);
  while(sec.firstElementChild && sec.firstElementChild.matches(CTRL_SEL)) ctl.appendChild(sec.firstElementChild);
  if(ctl.children.length) side.appendChild(ctl);
  const main = document.createElement('div'); main.className = 'main';
  while(sec.firstChild) main.appendChild(sec.firstChild);
  if(!main.children.length) return void sec.append(...side.childNodes);
  // a slide with ONE card that has its own controls: its title + controls join the side panel too
  const cc = [...main.querySelectorAll('.card')].filter(c => c.querySelector(':scope > .ctlbar'));
  if(cc.length === 1){ const c = cc[0]; const h = c.querySelector(':scope > .card-h'); const bar = c.querySelector(':scope > .ctlbar');
    if(h){ h.classList.add('in-side'); side.insertBefore(h, side.querySelector('.ctl')); }
    let ctl2 = side.querySelector('.ctl'); if(!ctl2){ ctl2 = document.createElement('div'); ctl2.className = 'ctl'; side.appendChild(ctl2); }
    ctl2.appendChild(bar); c.classList.add('ctl-moved'); }
  const sp = document.createElement('div'); sp.className = 'splitter'; sp.title = 'Kéo trái/phải để chỉnh độ rộng hai khung · bấm đúp để đặt lại';
  sec.append(side, sp, main); sec.classList.add('split');
}

let VZ = +store.get('vzoom', 1) || 1;
function applyVZ(){ document.documentElement.style.setProperty('--vz', VZ); }
function applySideW(w){ if(w) document.documentElement.style.setProperty('--sideW', w + 'px'); else document.documentElement.style.removeProperty('--sideW'); }

/* keep the sentence being read fully on screen: if it is cut off at the bottom (or above the top),
   turn the "page" so the whole block starts near the top of the reading area */
function follow(el){
  try{
    if(!el || !stage.contains(el)) return;
    const box = el.closest('.line,.vc,.flip,.pair,.zl,.qa,.fx,.twist,.ex,.card') || el;
    const r = box.getBoundingClientRect(), sr0 = stage.getBoundingClientRect(); const stk = innerWidth < 761 ? stage.querySelector('.slide .ctl') : null; const sr = { top: sr0.top + (stk ? stk.offsetHeight : 0), bottom: sr0.bottom - (innerWidth < 761 ? 56 : 0), height: sr0.height - (stk ? stk.offsetHeight : 0) - (innerWidth < 761 ? 56 : 0) };
    if(!r.height) return;
    const pad = 14, fits = r.height <= sr.height - 2 * pad;
    const cutTop = r.top < sr.top + 4, cutBottom = r.bottom > sr.bottom - 4;
    if(!cutTop && !cutBottom) return;
    let y = stage.scrollTop + (r.top - sr.top) - pad;              // whole block to the top
    if(!fits && !cutTop){ const b = el.getBoundingClientRect(); y = stage.scrollTop + (b.top - sr.top) - pad; }
    stage.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  }catch(e){}
}

/* after "Nghe tất cả" finishes a page: Replay 1 = play this page again, Auto = go to next page and keep listening */
const MODE = { auto: !!store.get('autoNext', false), loop: !!store.get('loopOne', false) };
function paintModes(){ const a = $('#tAuto'), l = $('#tLoop'); if(a) a.setAttribute('aria-pressed', MODE.auto); if(l) l.setAttribute('aria-pressed', MODE.loop); }
function setMode(k){ MODE[k] = !MODE[k]; if(MODE[k]) MODE[k === 'auto' ? 'loop' : 'auto'] = false; store.set('autoNext', MODE.auto); store.set('loopOne', MODE.loop); paintModes(); }
function toast(msg){ let t = document.getElementById('toast'); if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); } t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 3500); }
function slideDone(empty){
  if(!LESSON || (!MODE.auto && !MODE.loop)) return;
  const g = SPGEN;
  const delay = empty ? 2500 : 1200;
  const nextL = PARSED[LANG].lessons.indexOf(LESSON) + 1; const hasNextL = nextL > 0 && nextL < PARSED[LANG].lessons.length; const keep = MODE.loop ? !empty : (cur < SL.length - 1 || hasNextL); const tp = $('#tPlay'); if(keep && tp) tp.classList.add('on');
  if(MODE.loop){ if(empty) return; setTimeout(() => { if(g === SPGEN && MODE.loop) playSlide(); }, delay); return; }
  if(cur >= SL.length - 1){
    if(!hasNextL) return;
    // end of this lesson: go on to the next lesson, starting at its first page that has something to read
    setTimeout(() => { if(g !== SPGEN || !MODE.auto) return; openLesson(nextL);
      let k = SL.findIndex((x, i) => { if(i === 0) return false; try{ return /data-say|data-seq/.test(x.render()); }catch(e){ return false; } });
      if(k > 0) show(k); toast('▶ Tự chuyển sang bài tiếp theo: ' + $('#bTitle').textContent); playSlide(); }, 1800);
    return;
  }
  setTimeout(() => { if(g !== SPGEN || !MODE.auto) return; show(cur + 1); playSlide(); }, delay);
}

function playSlide(){
  const sp = $('#tPlay'); const sl = stage.querySelector('.slide'); if(!sl) return;
  stopSpeech(); const g0 = SPGEN; sp.classList.add('on');
  const btns = [...sl.querySelectorAll('.say[data-say]')]; let k = 0;
  const nx = () => { if(g0 !== SPGEN) return; if(!sp.classList.contains('on')) return;
    if(k < btns.length){ const b = btns[k++]; const vc = b.closest('.flip.vc'); if(vc && b.closest('.vex')) vc.classList.add('on'); follow(b); speak(b.dataset.say, b, () => setTimeout(nx, 450)); }
    else { sp.classList.remove('on'); slideDone(!btns.length); } };
  nx();
}
let SPGEN = 0;
function stopSpeech(){ SPGEN++; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.say.on,[data-playall].on,[data-slideplay].on').forEach(b => b.classList.remove('on')); }
function speak(text, btn, onend){
  try{
    const lang = LANGS[LANG].voice; const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = SET.rate;
    const v = pickVoice(); if(v) u.voice = v;
    if(btn) btn.classList.add('on');
    const g = SPGEN; u.onend = u.onerror = () => { if(btn) btn.classList.remove('on'); if(onend && g === SPGEN) onend(); };
    speechSynthesis.speak(u);
  }catch(e){ if(btn) btn.title = 'Trình duyệt này chưa hỗ trợ đọc'; }
}

document.addEventListener('keydown', e => {
  if(e.target.matches('input,textarea')) return;
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('.flip,[data-fix]')){ e.preventDefault(); e.target.click(); return; }

  else if(e.key === 'v' || e.key === 'V') setVi(document.body.classList.contains('no-vi'));
  else if(e.key === 'f' || e.key === 'F') toggleFull();
  else if(e.key === 'm' || e.key === 'M'){ $('#menu').hidden ? openMenu() : ($('#menu').hidden = true); }
  else if(e.key === 'Escape') $('#menu').hidden = true;
});
$('#prev').onclick = () => show(cur - 1);
$('#next').onclick = () => show(cur + 1);
$('#tPy').onclick = () => setPy(document.body.classList.contains('no-py'));
$('#tVi').onclick = () => setVi(document.body.classList.contains('no-vi'));
$('#tTimer').onclick = () => timer.toggle();
$('#tReset').onclick = () => timer.reset();
$('#tFull').onclick = toggleFull;
$('#tMenu').onclick = openMenu;
$('#tLib').onclick = () => showLibrary();
$('#home').onclick = () => showLibrary();

  const r = document.documentElement.style; r.setProperty('--t', SET.t); r.setProperty('--p', SET.p); r.setProperty('--v', SET.v);
  const L = LANGS[LANG] || LANGS.zh;
  $('#sRate').value = SET.rate; $('#sRateV').textContent = '×' + Number(SET.rate).toFixed(2);

  $('#sPWrap').hidden = L.pron == null; $('#sPLab').textContent = 'Cỡ chữ ' + (L.pronName || 'phiên âm'); $('#sP').value = SET.p; $('#sPV').textContent = Math.round(SET.p * 100) + '%';
  $('#sV').value = SET.v; $('#sVV').textContent = Math.round(SET.v * 100) + '%';
  document.querySelectorAll('[data-gender]').forEach(b => b.setAttribute('aria-pressed', b.dataset.gender === SET.gender));
  store.set('settings3', SET); fillVoices();
}

$('#sP').oninput = e => { SET.p = +e.target.value; applySet(); };
$('#sV').oninput = e => { SET.v = +e.target.value; applySet(); };
$('#sVoice').onchange = e => { SET.voice = e.target.value; applySet(); };
document.querySelectorAll('[data-gender]').forEach(b => b.onclick = () => { SET.gender = b.dataset.gender; SET.voice = ''; applySet(); });
$('#sTest').onclick = () => { stopSpeech(); speak({ zh:'你好，今天我们学习新的对话。', en:'Hello everyone, let’s start today’s conversation.', ja:'こんにちは。今日は新しい会話を練習しましょう。' }[LANG] || '你好', $('#sTest')); };
$('#sReset').onclick = () => { Object.assign(SET, DEF_SET); applySet(); };
setPy(store.get('py', true)); setVi(store.get('vi', true));
const saved = store.get('dataset', null);
loadDataset(saved && saved.rows ? saved : SAMPLE, false);
LANG = store.get('lang', 'zh'); if(!availableLangs().includes(LANG)) LANG = availableLangs()[0] || 'zh';
const hm = (location.hash || '').match(/^#(zh|en|ja)(\d+)-(\d+)$/);
if(hm && PARSED[hm[1]]){ LANG = hm[1]; document.body.classList.add('lang-' + LANG); const li = PARSED[LANG].lessons.findIndex(l => l.num === +hm[2]); if(li >= 0) openLesson(li, +hm[3]); else showLibrary(); }
else showLibrary();
applySet();

try{ paintModes(); }catch(e){}
